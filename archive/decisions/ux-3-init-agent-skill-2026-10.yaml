outcomes:
  - id: per-user-opencode-skill-installed
    statement: |
      `mathc init --agent opencode` in a directory where
      `mathc` was built from a source tree containing
      `.opencode/skills/math-coding/SKILL.md` causes that
      file to appear at `${XDG_CONFIG_HOME:-${HOME}/
      .config}/opencode/skills/math-coding/SKILL.md` and
      the kernel prints a one-line confirmation.
  - id: installed-binary-falls-through
    statement: |
      `mathc init --agent opencode` from an installed
      binary (where the source walk fails) does NOT create
      a half-written file; the kernel prints an instruction
      pointing at `install.sh --user-skill` and exits 0.
  - id: other-agents-noop
    statement: |
      `mathc init --agent {claude-code,cursor,continue,
      generic}` is no-op (no file copy); the kernel prints
      a one-liner describing the right install path for
      that agent value.
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-init-agent-skill-2026-10.yaml` exits 0.

assumptions:
  - id: source-tree-contains-skill
    state: assumed
    statement: |
      For the in-tree build path, the math-coding source
      tree contains `.opencode/skills/math-coding/SKILL.md`
      at the repo root (per `ux-3-repo-tracked-opencode-skill-2026-10@1`).
      The kernel walks up from `<binary_dir>` to find it.
    owner: human:maintainer
    consequence_if_false: |
      If the source is moved (e.g. to `share/math-coding/
      .opencode/`), the walk fails and the kernel prints
      the `install.sh --user-skill` instruction. Resolution:
      update `find_source_skill` to also try the new path.
    review_on:
      - signal: source-skill-moved
  - id: xdg-config-home-stable
    state: assumed
    statement: |
      The XDG Base Directory Specification is stable;
      `XDG_CONFIG_HOME` is the right env var to honor for
      per-user XDG paths. Default `~/.config` is the
      fallback when `XDG_CONFIG_HOME` is unset.
    owner: human:maintainer
    consequence_if_false: |
      If the XDG spec changes (unlikely), the path
      resolution breaks. Resolution: update the lookup.
    review_on:
      - signal: xdg-spec-changed

obligations:
  - id: cram-test-passes
    outcome: per-user-opencode-skill-installed
    claim: |
      `tests/cli/init-agent.t` exercises all five agent
      values: opencode (file installed), generic (no
      install), claude-code / cursor / continue
      (one-liner printed).
    acceptance:
      all:
        - verifier: tests/cli/init-agent.t
          result: pass

  - id: this-decision-validates
    outcome: this-decision-validates
    claim: |
      `mathc validate
      decisions/ux-3-init-agent-skill-2026-10.yaml` exits 0.
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-init-agent-skill-2026-10.yaml
          result: pass

reversal:
  - signal: dist-tarball-bundles-skill
    condition: |
      A future decision bundles the per-user skill
      content into the mathc binary as a resource (via
      `dune` rules or ocaml-crunch). Resolution: this
      decision is superseded; the kernel reads the
      bundled resource and the walk-up logic is removed.
    action: supersede-with-bundled-resource
  - signal: install-sh-user-skill-deprecated
    condition: |
      `install.sh --user-skill` is removed (the per-user
      install is fully covered by `mathc init --agent`).
      Resolution: this decision is revised; the
      `install.sh --user-skill` instruction in the
      fallback message is replaced with a different
      fallback.
    action: rework


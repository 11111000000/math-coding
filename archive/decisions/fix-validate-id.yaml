intent: |
  `lib/new_decision/new_decision.ml::validate_id` accepted
  only `[a-z0-9-]` while `lib/lifecycle/lifecycle.ml::validate_id`
  and the kernel's schema (`schemas/decision.json`) all accept
  `[a-z0-9._-]`. A `mathc new-decision foo.bar` invocation
  was rejected by the dispatcher even though `mathc validate
  foo.bar.yaml` would accept the same id on disk. This
  decision brings the new-decision validator in line with
  the schema.

commitment: |
  `lib/new_decision/new_decision.ml::is_id_char` now accepts
  `.` in addition to `[a-z0-9-]`. The error messages quote
  the canonical `^[a-z0-9][a-z0-9._-]{0,127}$` pattern from
  `schemas/decision.json` so the user sees the same regex
  the kernel enforces, rather than a stricter subset.

outcomes:
  - id: new-decision-matches-schema
    statement: |
      `mathc new-decision <id>` accepts every id that
      `mathc validate <id>.yaml` accepts.

scope:
  paths:
    - lib/new_decision/new_decision.ml

obligations:
  - id: new-decision-accepts-dot-in-id
    claim: |
      `lib/new_decision/new_decision.ml::is_id_char` now
      returns true for `.`, so an id like `foo.bar` is
      accepted.
    acceptance:
      all:
        - verifier: dune build
          result: pass
        - verifier: tests/cli/new-decision.t
          result: pass

axiom_link:
  - A0

counterexample: |
  Widening `is_id_char` to accept `.` brings the new-decision
  validator into line with the kernel schema but introduces a
  consistency problem: any downstream resolver that treats `.` as
  a hierarchy separator (e.g., a future `Path_config.resolve
  decision-id` that maps ids to file paths) becomes exploitable
  for path traversal. The strongest objection is that this fix
  is shipped without a corresponding audit of path-resolution
  call sites: a user who creates a decision id `..secret` can
  register it via `mathc new-decision ..secret --write`, the
  file lands at `decisions/..secret.yaml`, and any path-aware
  tool that resolves this id to a canonical path is now open to
  path-injection. Reversal condition: when lib/path_config.ml or
  the discover walker treats any canonicalised path the same way
  it treats absolute paths (escape detection, no-symlink policy),
  the dot-id surface is safe; until then, audit-trail reviewers
  should flag any new decision with `.` in the id as a
  potential path-injection vector and inspect downstream
  resolution.

risk:

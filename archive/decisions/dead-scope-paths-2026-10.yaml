risk:
  owner: human:maintainer
  declared_triggers:
    - "a scope path is added that matches no tracked file"
    - "a file named by a pruned scope path is created, so that the path becomes live again"

assumptions:
  - id: the-scope-is-the-set-of-dependencies
    state: assumed
    owner: human:maintainer
    statement: |
      A decision's scope.paths is the set of files its obligation
      depends on, and the materials digest is computed over the
      content of exactly those files.
    consequence_if_false: |
      If a scope may name files the obligation does not depend on,
      then a dead path is not noise but a claim, and pruning it
      removes evidence of an intended dependency. The pruning is
      therefore recorded per decision rather than applied silently,
      and the entries are recoverable from the decisions' own text.


yaml_sha: "sha256:b04ea4b3ae8aa4c6d2e8baa27a80bb8aeb85c2a89176afdfd33d56092cbe5f90"

intent: |
  The MCP stdio server (`bin/mathc_mcp.ml`) dies with exit 141
  when the client closes its end of the pipes mid-loop, because
  the kernel-delivered SIGPIPE is unhandled. The
  `lib/mcp/transport.ml::read_line` helper also has no upper
  bound on a single request line, so a runaway client can exhaust
  memory by streaming an unbounded line on stdin. This decision
  closes both gaps so the server exits gracefully on broken-pipe
  and refuses oversized requests.

commitment: |
  `bin/mathc_mcp.ml::main_loop` calls `Sys.set_signal Sys.sigpipe
  Sys.Signal_ignore` before the first read so a client-side
  disconnect becomes a catchable `EPIPE` instead of a fatal
  signal. `lib/mcp/transport.ml::read_line` caps a single inbound
  line at 1 MiB; an over-cap line is treated as protocol-level
  garbage and surfaces as `None` to the caller (same shape as
  EOF), causing the dispatcher to shut down gracefully.

outcomes:
  - id: sigpipe-graceful
    statement: |
      Closing the client end of the MCP stdio pipes mid-loop
      causes the server to exit 0, not 141.

scope:
  paths:
    - bin/mathc_mcp.ml
    - lib/mcp/transport.ml

obligations:
  - id: max-request-bytes-cap
    claim: |
      `lib/mcp/transport.ml::read_line` rejects any line longer
      than `max_request_bytes` (1 MiB) and returns `None`.
    acceptance:
      all:
        - verifier: dune build
          result: pass
        - verifier: manual-target-missing-tests-cli-mathc-mcp-t

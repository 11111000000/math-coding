counterexample: |
  "AGENTS.md already says OCaml > Python; this duplicates without
  changing behavior." The objection rests on the A0-separation
  dialectic from axiom A0: a rule and an enforcement of that rule
  are observationally distinct, and a commitment is a commitment
  only when an agent can confirm the enforcement is active without
  re-reading the policy. Today an LLM agent reading the existing
  §Toolchain preference may satisfy the soft preference while
  running `ocamlfind list` on the host, which produces
  host-version-skewed output; the trap log records this failure
  mode at §11.32 (Str.regexp interval), §11.33 (string-continuation
  splice), and §11.22 (nix develop builds a non-portable mathc).
  The A0 separation is therefore not just philosophical: the soft
  rule and the hard rule produce different shell histories. The
  mitigation recorded here is the dual surface — prose rule plus
  §11.34 trap plus mathc-cli mention plus quickstart — and the
  obligation chain that closes each surface to a concrete
  verifier. The disagreement that remains is whether a single
  "always nix develop" sentence is enough; the answer recorded
  here is that a single sentence, by itself, is not enough,
  because the sentence is unreachable for an agent whose first
  contact is the README.

assumptions:
  - id: nix-shell-always-available
    state: assumed
    statement: |
      `nix develop .#test` is the agent's working environment.
      The dev shell pins dune 3.23.1 and ocaml 5.5.0 today (per
      flake.nix:9 and the nix develop banner observed at the
      time of this decision). Any agent that needs the OCaml
      toolchain enters this shell before running dune, ocaml,
      ocamlfind, merlin, ocamllsp, or mathc.
    owner: human:maintainer
    consequence_if_false: |
      Host-shell dune/ocaml/menhir invocations produce
      version-skewed binaries (§11.22), missing-str warnings
      from host vs dev-shell stdlib, and silent §11.32 / §11.33
      failures. The §11.34 trap entry is the bound for this
      assumption.
    review_on:
      - signal: nixpkgs-bump-merged

  - id: trap-log-conventions-stable
    state: assumed
    statement: |
      The §11 trap-log entry convention (Symptom / Cause / Fix
      headings + "Trigger" footer linking to the citing decision)
      is stable from §11.32 onward. The new §11.34 follows the
      same template and is reviewed by the trap-log gardener
      (the human:maintainer role, per OCAML_BEST_PRACTICES.md
      §11 header).
    owner: human:maintainer
    consequence_if_false: |
      If §11 is restructured, the §11.34 entry must be moved
      and the cross-reference from AGENTS.md updated; the
      reviewer must re-run the §11 trap-log integrity test.
    review_on:
      - signal: trap-log-template-changes

  - id: mathc-cli-stable
    state: assumed
    statement: |
      `mathc validate`, `mathc self-check`, `mathc assess` are
      stable CLI subcommands. Today they exist (§1.5 / §1.6 of
      spec/semantics.md). This decision only NAMES them in
      AGENTS.md; it does not introduce or rename them.
    owner: human:maintainer
    consequence_if_false: |
      If the CLI is renamed (per the cli-canonical-name
      decision), the AGENTS.md "For validation" bullet must be
      updated in the same commit.
    review_on:
      - signal: cli-canonical-name-changes

  - id: agent-reads-quickstart
    state: assumed
    statement: |
      An LLM agent prompt-loaded for the math-coding repository
      reads AGENTS.md first (§Read first, line 16). Therefore
      the new "Agent quickstart" section reaches the agent
      without further discovery plumbing.
    owner: human:maintainer
    consequence_if_false: |
      If AGENTS.md is removed from the read-first list (or
      demoted), the quickstart must also be duplicated into
      the agent-facing skill (e.g. `math-coding` skill in
      `.opencode/skills/`).
    review_on:
      - signal: agent-onboarding-protocol-changes

obligations:
  - id: hard-rule-observable-in-agents-md
    outcome: tooling-hard-rule-active
    claim: |
      AGENTS.md §Toolchain preference begins with the literal
      sentence "Always run `nix develop .#test` before any dune,
      ocaml, ocamlfind, merlin, ocamllsp, or mathc invocation.
      Never run these tools on the host shell." The next
      paragraph keeps the prior OCaml > Python preference text.
      `tests/process_principles.ml`'s body-sections walk accepts
      the new heading and the trailing prose still satisfies
      P1.
    acceptance:
      all:
        - verifier: tests/process_principles.ml
          result: pass

  - id: trap-11-34-published
    outcome: trap-11-34-published
    claim: |
      OCAML_BEST_PRACTICES.md contains a §11.34 entry with the
      heading "Host-shell dune / ocaml without `nix develop`"
      and the Symptom / Cause / Fix sub-headings matching §11.33.
      The new entry has a "Trigger" footer that names this
      decision. A planned verifier ("§11 trap-log integrity",
      added by the parallel subagent work) greps for the
      required sub-headings and asserts pass.
    acceptance:
      all:
        - verifier: manual-ocaml-best-practices-md-11-trap-log-integrity-pl
          result: pass

  - id: mathc-cli-named-in-toolchain-bullet
    outcome: mathc-cli-stated-in-toolchain
    claim: |
      AGENTS.md §Toolchain preference's "For validation" bullet
      names `mathc validate`, `mathc self-check`, and
      `mathc assess` explicitly, and the "For builds" bullet
      names `scripts/dev`. The dev-shell wire-up that backs this
      rule is verified by `scripts/check-merlin.sh` (merlin +
      ocaml-lsp in PATH at the documented versions, confirming
      the nix flake is the active environment).
    acceptance:
      all:
        - verifier: scripts/check-merlin.sh
          result: pass

  - id: agent-quickstart-published
    outcome: agent-quickstart-published
    claim: |
      AGENTS.md has a new section "Agent quickstart" directly
      above "Before work" (per the AGENTS.md table-of-contents
      implied by §Read first). The section lists (a) four
      move-it commands and (b) four reads-first files. The
      `tests/repo_structure.ml` walking the AGENTS.md surface
      continues to find the "Toolchain preference" heading
      anchored at the same byte offset class (i.e. the new
      section did not delete or relocate the existing rule).
    acceptance:
      all:
        - verifier: tests/repo_structure.ml
          result: pass


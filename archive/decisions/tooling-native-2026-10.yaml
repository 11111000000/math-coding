intent: |
  Strengthen the existing "Toolchain preference (OCaml ecosystem over
  Python)" soft rule in AGENTS.md §Toolchain preference into a hard
  rule that an LLM agent can verify mechanically before any source
  edit, and pin the four moving parts that make the rule operative:
  a §11.34 trap-log entry, the mathc/dune build path in the agent
  workflow, an opt-in pre-commit hook, and an agent quickstart that
  documents the rule at first contact.

axiom_link:
  - A0

commitment: |
  This decision records four interlocking sub-decisions that together
  convert the prose rule at AGENTS.md §Toolchain preference into a
  verifiable protocol:
    (1) the soft rule becomes hard, with explicit "always nix
        develop, never host-shell dune" phrasing and a self-check
        sentence at the head of §Toolchain preference;
    (2) a new OCAML_BEST_PRACTICES.md §11.34 entry captures the
        "host-shell dune/ocaml" pitfall with the same Symptom /
        Cause / Fix structure as §11.32 and §11.33;
    (3) the toolchain bullet in AGENTS.md §Toolchain preference
        names mathc CLI subcommands explicitly (mathc validate,
        mathc self-check, mathc assess) and the pre-commit path,
        and is cross-referenced from OCAML_BEST_PRACTICES.md §11.34
        so the prose and the verifier stay aligned;
    (4) a new "Agent quickstart" section in AGENTS.md names the
        four move-it commands (`nix develop .#test`,
        `scripts/check.sh`, `scripts/dev verify`, `mathc self-check`)
        and the four reads-first files (AGENTS.md, ROADMAP.md,
        PACKAGES.md, OCAML_BEST_PRACTICES.md §11).

  Each sub-decision is pinned by one obligation; each obligation's
  acceptance.all[].verifier references a concrete script or test
  that exists today or that the parallel §-11.34 work will add.

scope:
  capabilities:
    - tooling-hard-rule
    - trap-log-11-34
    - mathc-cli-documented
    - agent-onboarding-clarified
  paths:
    - "AGENTS.md"
    - ".githooks/pre-commit"
    - "scripts/dev"
    - "scripts/check-merlin.sh"
  # 2026-10-25: pruned from this scope, per decisions/dead-scope-paths-2026-10.yaml
  #   OCAML_BEST_PRACTICES.md - no tracked file matches it
  exclusions:
    - "lib/**"
    - "bin/**"
    - "spec/**"
    - "schemas/**"
    - "axioms/**"

outcomes:
  - id: tooling-hard-rule-active
    statement: |
      AGENTS.md §Toolchain preference begins with an unambiguous
      "always `nix develop .#test`; never host-shell dune/ocaml"
      sentence and the previous soft-rule prose is reduced to a
      short rationale paragraph below it. The §11.34 trap entry
      in OCAML_BEST_PRACTICES.md is the executable form.

  - id: trap-11-34-published
    statement: |
      OCAML_BEST_PRACTICES.md §11.34 "Host-shell dune / ocaml
      without `nix develop`" exists with Symptom / Cause / Fix
      blocks at the same depth as §11.32 and §11.33, and a
      "Trigger" footer that links to this decision.

  - id: mathc-cli-stated-in-toolchain
    statement: |
      The "For validation" bullet in AGENTS.md §Toolchain
      preference lists `mathc validate`, `mathc self-check`, and
      `mathc assess` explicitly, and the "For builds" bullet lists
      `scripts/dev` (which transitively calls `dune build`).
      The pre-commit hook path `.githooks/pre-commit` is named
      once in the "For builds" sub-bullet.

  - id: agent-quickstart-published
    statement: |
      A new section "Agent quickstart" appears in AGENTS.md
      immediately above §Before-work. It names (a) the four
      move-it commands, (b) the four reads-first files, and
      (c) the four hook state values (`git config core.hooksPath

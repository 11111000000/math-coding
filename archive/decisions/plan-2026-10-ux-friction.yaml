outcomes:
  - id: twelve-ux-improvements-shipped
    statement: |
      12 sub-decisions landed on main via 3 batches of
      parallel sub-agent work. Each sub-decision is a
      separate `decisions/*.yaml` file with its own
      attestation. The total wall-clock was approximately
      14 hours across 8 sub-agents (4+3+1); the equivalent
      serial work would have been 11+ hours but without
      reviewable PRs.

counterexample: |
  "12 sub-decisions is too many; this is gold-plating.
   The friction is in the agent's prompt, not in the
   user-facing surface." Counterargument: the friction is
   measurable (developer time on first install, time to
   create a decision, time to find an old one, time to
   back-fill an obligation, time to import brownfield).
   Each sub-decision is a discrete, small, revert-able
   change; the cumulative effect is 1 install page, 5 CLI
   improvements, 1 cosign signature, 2 render extensions,
   1 hotfix path, 2 brownfield import paths, 1 graph
   viewer, 1 lifecycle + gate filter. The
   meta-decision's `state: active` keeps the audit trail
   for any future agent to consult.

  "Some sub-decisions are gold-plating (e.g. `mathc find`).
   Use `grep | jq`." Counterargument: `mathc find` is
   reachable as a structured MCP method (`mathc/find`)
   that AI agents can call without shell access. The CLI
   surface is a happy side-effect, not the primary
   purpose. Similarly, the cosign signature is required
   for the "Docker first" framing that the project can
   adopt when the image-signing trust posture is improved.

  "The plan should have widened the 4-state enum to add
   `obsolete` and `archived`." Counterargument: the
   algebra §7 contract is normative; widening the enum
   for a single use case is a precedent that grows
   unbounded. The lifecycle sub-decision maps the
   user-facing names to the existing kernel states.

assumptions:
  - id: per-sub-decision-policy
    state: assumed
    statement: |
      Each sub-decision is authored under the active
      policy `bootstrap-v3@3` (or its successor) with
      the appropriate A3-protected transition for
      kernel-touching changes. The four sub-decisions
      that touch the kernel (P2 precommit, P6 lifecycle,
      P7 MCP env-gate, P12 graph) carry the kernel
      exclusions and `axiom_link: A0, A3` per
      convention.
    owner: human:maintainer
    consequence_if_false: |
      A sub-decision authored under a weaker policy
      would weaken the gate for the changes it
      introduces. The cycle halts; the offending
      sub-decision is rejected or superseded.
    review_on:
      - signal: sub-decision-policy-drift

  - id: verdict-stability-precondition
    state: assumed
    statement: |
      The 5 pre-existing unknown subjects in
      `mathc self-check` (placeholder-sha-cleanup,
      enable-counters-drift-test,
      constitution-header-3-3-update,
      re-eval-remediation-todo-fix,
      attestation-waiver-policy-schema-bump-3-3) are
      not in this plan's scope. They are tracked in
      `decisions/waivers/*.yaml` and resolved by
      separate audit cycles. The plan authorises no
      change to the verdict on these subjects.
    owner: human:maintainer
    consequence_if_false: |
      If the plan's changes cause a regression on the
      5 pre-existing unknown subjects (e.g. flip a
      pass to unknown, or move a subject out of the
      pre-existing-5 set), the regression is a
      blocker: the sub-decision is reverted or the
      regression is fixed in the same worktree.
    review_on:
      - signal: self-check-verdict-regression


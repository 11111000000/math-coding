---
schema: math-coding/3.3
id: plan-2026-10-ux-friction
revision: 1
state: active
mode: standard
change_kind: editorial
body_sha: "sha256:1dd1ae99a21229d8f2559d20df7d6ccacb8a1110cca098912301ba4d69a7d0a2"
yaml_sha: "sha256:1dd1ae99a21229d8f2559d20df7d6ccacb8a1110cca098912301ba4d69a7d0a2"

intent: |
  Reduce friction in the math-coding ux-3 workstream without
  relaxing the kernel's invariant surface. 12 sub-decisions
  across 3 batches (1 docs + CLI, 2 medium-effort, 1 high-risk
  kernel change). Each sub-decision is an additive sub-LIBRARY
  or surface change that is revert-able in one commit; the
  meta-decision records the 12 commitments and the
  dialectical resolution for each, so future agents and
  auditors see the full plan and its rationale without
  reconstructing it from `git log`.

  The plan was authored in the 2026-10-15 chat ("составь план
  улучшения моткоинга"); each item was dialectically tested
  against the strongest counter-position and synthesised to
  a concrete change that preserves the thesis without the
  antithesis's cost.

axiom_link:
  - A0
  - A1
  - A3
  - A4

commitment: |
  The cycle closes when, for every obligation below:
    (a) a sub-decision exists at
        `decisions/<id>.yaml` with `state: active` and at
        least one matching attestation in `attestations/`
        whose `kind_` in {test, build, review} appropriate
        to the change;
    (b) the surface change the sub-decision commits to has
        landed on main and is exercised by a cram test or
        conformance suite;
    (c) `mathc self-check` returns `verdict: "unknown"`
        with the SAME 5 pre-existing unknown subjects
        (placeholder-sha-cleanup, enable-counters-drift-test,
        constitution-header-3-3-update,
        re-eval-remediation-todo-fix,
        attestation-waiver-policy-schema-bump-3-3) and
        zero NEW unknown subjects.

  The meta-decision itself closes when every (a)-(c) holds
  for every obligation. After closure, `state` remains
  `active` for the audit trail; a successor
  `plan-2026-11-ux-friction` may supersede this one with
  an updated commitment.

  Boundaries (A3 self-application):

  - This decision does NOT modify any kernel file
    (`lib/`, `bin/`, `spec/`, `schemas/`, `axioms/`).
  - The plan is additive: every sub-decision is
    independently revert-able in one commit.
  - The 5 pre-existing unknown subjects are NOT in this
    plan's scope; they are tracked in
    `decisions/waivers/*.yaml` and resolved by separate
    audit cycles.


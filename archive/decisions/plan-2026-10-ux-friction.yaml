reversal:
  - signal: plan-superseded
    condition: |
      A successor `plan-2026-11-ux-friction` or similar
      is recorded with `supersedes:
      [plan-2026-10-ux-friction@1]`. Migration path: every
      still-open sub-decision from this plan is either
      closed under the successor or recorded as waived.
    action: rework

  - signal: cycle-diverges
    condition: |
      The cycle exceeds 6 months without closing all 12
      obligations. Resolution: split into
      `plan-2026-10-ux-friction-A` (P1, P3b, P5, P8, P7,
      P9, P11) and `plan-2026-10-ux-friction-B` (P3a, P2,
      P4, P12, P10, P6) with explicit per-cycle scope.
    action: rework

  - signal: sub-decision-reverted
    condition: |
      Any of the 12 sub-decisions is reverted in
      `git log` after the plan closes. The plan's
      corresponding obligation is moved to `state:
      archived` (not deleted) with a `reversal_note:`
      field recording the reverted sub-decision's SHA.
    action: archive-obligation

  - signal: axiom-violation
    condition: |
      A sub-decision under this plan is found to
      violate any of I1-I14 from `spec/constitution.md`
      or A0-A4 from `axioms/`. The offending
      sub-decision is rejected; the corresponding
      T-obligation here remains open.
    action: halt


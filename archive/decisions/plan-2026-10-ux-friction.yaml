  #   "attestations/<id>-*.json"     # the attestations - a placeholder, never a path
  #   "QUICKSTART.md"                # P1 - malformed: a comment inside the quoted path
  #   "USAGE.md"                     # P1, P3b, P8 - malformed: a comment inside the quoted path
  #   "README.md"                    # P1 - malformed: a comment inside the quoted path
  #   "site/install.md"              # P3b - malformed: a comment inside the quoted path
  #   "adoption/SKILL.md"            # P1, P7 - malformed: a comment inside the quoted path
  #   "OCAML_BEST_PRACTICES.md"      # P3a, P8 - malformed: a comment inside the quoted path
  #   "scripts/hotfix-cve.sh"        # P8 - malformed: a comment inside the quoted path
  #   "scripts/slack2madr.py"        # P11 - malformed: a comment inside the quoted path
  #   "scripts/confluence2madr.py"  # P11 - malformed: a comment inside the quoted path
  #   "tests/cli/*.t"                # cram tests - malformed: a comment inside the quoted path
  #   "tests/scripts/*.t"            # cram tests for Python - malformed: a comment inside the quoted path
  #   "tests/fixtures/*"             # test fixtures - malformed: a comment inside the quoted path
  #   ".github/workflows/docker.yml"  # P3a - malformed: a comment inside the quoted path
  #   ".github/workflows/release.yml" # P3a - malformed: a comment inside the quoted path
  #   "scripts/install-tooling/install.sh"  # P3a - malformed: a comment inside the quoted path
  exclusions:

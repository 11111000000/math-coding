assumptions:
  - id: authors-declare-honestly
    state: assumed
    owner: human:maintainer
    statement: |
      Authors declare `outcome: unchanged` when a decision changes
      no behaviour. A reviewer who believes otherwise can say so.
    consequence_if_false: |
      If the field is declared dishonestly, the ratio is wrong. The
      ratio is the thing that is being measured, so a dishonest
      declaration destroys the measurement - which is why the field
      is a field and not a rule.

---
schema: math-coding/migration-manifest
from: math-coding/3.0-alpha
to: math-coding/3.3
intent: |
  Bring the schema-string on every live decision forward from
  `math-coding/3.0-alpha` to `math-coding/3.3`. The bump
  aligns the `schema:` field in `decisions/*.yaml` with
  the schema family adopted by
  `decisions/schema-string-bump-3.0-alpha-to-3.3-2026-10.yaml@1`
  and the parallel attestation/waiver/policy schema-bump
  recorded in
  `decisions/attestation-waiver-policy-schema-bump-3-3-2026-10.yaml`.

  Each live decision file still validates today (legacy
  forms are accepted during the one-cycle grace period),
  so this manifest is the migration path that brings the
  tree to the new family in a single declarative step.

  This manifest also covers the per-file actions for the
  attestation/waiver/policy schema families. The 8
  bump-schema-string actions map 4 decision-schema
  variants, 1 attestation, 1 waiver, 1 policy, and (per
  the parallel decision) a `to: math-coding/3.3/decision`
  JSON form.

migrations:
  - kind: bump-schema-string
    from: math-coding/3.0-alpha
    to: math-coding/3.3
  - kind: bump-schema-string
    from: math-coding/3.0-alpha/decision
    to: math-coding/3.3/decision
  - kind: bump-schema-string
    from: math-coding/3.2
    to: math-coding/3.3
  - kind: bump-schema-string
    from: math-coding/3.2/decision
    to: math-coding/3.3/decision
  - kind: bump-schema-string
    from: math-coding/attestation-3.0-alpha
    to: math-coding/attestation-3.3
  - kind: bump-schema-string
    from: math-coding/waiver-3.0-alpha
    to: math-coding/waiver-3.3
  - kind: bump-schema-string
    from: math-coding/3.0-alpha/policy
    to: math-coding/3.3/policy

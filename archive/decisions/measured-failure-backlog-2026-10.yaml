intent: { source: "issue:the-store-said-pass-and-the-checks-fail-2026-10-24", text: "Re-signing every attestation by actually RUNNING the obligation's own verifier produced the first honest number the project has ever carried. The store had reported 763 passing obligations; 765 of its attestations carried an EMPTY materials_digest, which the gate treats as a WILDCARD - fresh for every tree, for ever - and the 763 passes were signatures without evidence. Running the checks says: 186 subjects pass, 11 FAIL, 6 cannot be concluded here, 2 are waived. The 40 are the project's first measured backlog of broken obligations." }

commitment: |
  After this decision closes:

  1. The 11 failing subjects are a NUMBER, measured by
     tests/fixtures/failing-subject-backlog.sh, and that number is a
     CEILING. It may fall; it may never rise. While it is within
     the ceiling the merge gate stays usable; the moment a NEW
     failure appears the gate goes red.
  2. A failed obligation is NOT waivable. The constitution says a
     waiver must not convert fail into pass, and the kernel
     enforces it. The repo's own remedy list - "revert the change
     that broke this obligation, or add a waiver" - is wrong for a
     failed check, and this decision records the correction.
  3. Every one of the 11 is classified, and each carries a
     remedy: fix the check, or retire the decision with a
     superseding one.
  4. The three defect classes that produced the backlog are
     recorded, because each is a corpus defect and not a code
     defect: verifiers naming a test case nobody wrote, verifiers
     carrying a prose tail the kernel passed to the program as
     arguments, and `mathc self-check` used as the verifier of an
     obligation INSIDE the corpus it evaluates.

axiom_link:
  - A0
  - A1
  - A2

counterexample: |
  Two counter-positions considered and rejected.

  (a) "Waive the 40 until the backlog is paid down, and keep
  the gate green." Rejected: a failed check is not waivable, and
  the reason is not pedantry. A waiver says "a human accepted
  this gap". A failed check says "the property does not hold".
  Turning the second into the first is how the corpus ended up
  claiming 763 passing obligations it had never verified.

  (b) "Retire the 40 decisions to make the backlog disappear."
  Rejected for the same reason in reverse: retiring a decision
  deletes its claims without repairing anything. The right move is
  per-decision: a decision whose commitments describe a state of
  the project that has since been superseded is retired WITH a
  superseding decision - which is the chain the constitution
  describes - and a decision whose commitment is still true and
  still broken is fixed.

antithesis: |
  The opposite claim would be that a red gate is the honest state
  and a bounded backlog is a way of hiding red behind a number.

  The claim has force, and the ceiling is not a way of hiding: the
  number is printed on every CI run, it is a DECISION FILE with the
  list, and the gate goes red the moment it grows. What the ceiling
  buys is the difference between a gate that reports the truth about
  the present and a gate that has been switched off because it has
  been red for four weeks. A gate that is always red is not a gate;
  it is a decoration that everyone learned to ignore. A gate that is
  green while a MEASURED backlog is being paid down, and red the
  moment the backlog grows, is a gate.


# policies.yaml — the per-path risk floors of this repository.
#
# WHAT THIS FILE IS. A YAML SEQUENCE of policy records, each with a
# `scope_paths` glob list and a `mode_floor`. The kernel reads it
# once at startup (lib/policy.ml::load_policies) and the floors feed
# `lib/risk.ml::mode_floor`, which is the second term of
#
#   mode(c) = max(risk_to_mode(risk(c)), mode_floor(c))
#
# (spec/algebra-3.2.md §2). The floor is what makes the friction
# ladder have rungs: a path whose floor is `light` may be changed
# with a one-line commit and a trailer; a path whose floor is
# `standard` must carry a decision.
#
# WHAT THIS FILE IS NOT. It is not the master policy, and it is not
# an instance of one either: it is the POLICY SEQUENCE -- the file
# that says which paths carry which floor. Three documents used to
# answer the question "what is the policy?", and all three had
# drifted apart (measured 2026-11-01, decision
# `one-master-policy-and-build-id-2026-11`):
#
#   * this file -- a policy SEQUENCE: five records, seventeen scope
#     paths, `mode_floor` standard on two of them and light on three,
#     and no obligations at all (which `schemas/policy.json` does not
#     allow: it says `obligations` has `minItems: 1`).
#   * `scripts/install-tooling/templates/active-policy.yaml` -- a
#     DECISION document (`id: bootstrap-v3`, revision 1), not a
#     policy sequence at all, and not a copy of this file either.
#   * `decisions/decision.yaml` -- THIS repository's instance of the
#     master policy (`bootstrap-v3@3`): a decision with seven
#     obligations, six of them about this repository.
#
# THE VOCABULARY, since the three were named as if they were one
# thing:
#
#   master policy   the protocol's document, ONE source:
#                   `templates/master-policy.yaml`. Every copy of it
#                   is GENERATED (scripts/sync-master-policy.sh) and
#                   checked (tests/fixtures/master-policy-one-source.sh).
#   active policy   a project's instance of the master policy: the
#                   file the kernel reads, located by id
#                   (`bootstrap-v3`). In this repository it is
#                   `decisions/decision.yaml` (`bootstrap-v3@3`).
#   policy sequence  this file: the per-path floors.
#
# The two were sharing one resolver until 2026-10-30, and the shared
# resolver pointed at a decision document, which parses as an empty
# policy sequence. So every path classified as `tiny`, the floor was
# dead, and `mathc mode` reported the silent baseline for a file
# whose policy said `standard`. Decision
# `record-proportionality-2026-10`.
#
# WHY NO FLOOR ABOVE `standard`. Algebra §10 makes `strict` and
# `exhaustive` require a rebuttal artifact (`rebuttals/<sha>.yaml`).
# This repository does not maintain that directory, so a floor above
# `standard` would be a floor nothing can satisfy: every change to
# the protected paths would be blocked, and a block that cannot be
# lifted is not a gate. The floor a repository declares must be one
# it can meet. `standard` is the ceiling here, and it is declared
# where the commitment is real.
#
# THE FLOORS, and what each one buys.
#
#   standard  lib/** bin/** spec/** schemas/** axioms/**
#             A change here can break a commitment, so it carries one:
#             either a decision committed with the change, or a trailer
#             that CITES an existing decision this change implements
#             (`Refs: decision:<id>@<rev>`). The citation is checked:
#             the cited decision's obligations are evaluated too, so
#             the citation is not a way to escape the evidence.
#
#   light     everything else
#             A change here cannot break a commitment the corpus
#             keeps: docs, site pages, scripts, tests, tools, the
#             corpus's own files. It costs a commit message and
#             nothing else. This is the "silent" rung the ladder
#             names, and it is where the record stopped growing: a
#             doc fix used to need a decision file.
#
# A path that no policy names falls to `tiny` — the silent baseline.
# That is the correct reading for `README.md`, `flake.nix`, the
# plugin, and every other path no commitment is scoped to.
#
# Schema: schemas/policy.json.

- policy_id: math-coding-kernel
  scope_paths:
    - "lib/**"
    - "bin/**"
  mode_floor: standard
  override_probability: 0.0
  obligations: []
  transitive_into: []
  data_flow_edges: []

- policy_id: math-coding-protocol
  scope_paths:
    - "spec/**"
    - "schemas/**"
    - "axioms/**"
  mode_floor: standard
  override_probability: 0.0
  obligations: []
  transitive_into: []
  data_flow_edges: []

- policy_id: math-coding-support
  scope_paths:
    - "scripts/**"
    - "tools/**"
    - "tests/**"
    - "fixtures/**"
    - "templates/**"
    - "render/**"
    - "plugin/**"
    - ".github/**"
  mode_floor: light
  override_probability: 0.0
  obligations: []
  transitive_into: []
  data_flow_edges: []

- policy_id: math-coding-docs
  scope_paths:
    - "docs/**"
    - "site/**"
  mode_floor: light
  override_probability: 0.0
  obligations: []
  transitive_into: []
  data_flow_edges: []

- policy_id: math-coding-corpus
  scope_paths:
    - "decisions/**"
    - "attestations/**"
  mode_floor: light
  override_probability: 0.0
  obligations: []
  transitive_into: []
  data_flow_edges: []

  <rect width="1200" height="630" fill="#fbfaf6"/>
  <g fill="none" stroke="#8b3a3a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 214 L96 258 L150 302"/>
    <path d="M330 214 L384 258 L330 302"/>
    <path d="M196 300 L258 232"/>
  </g>
  <text x="440" y="300" font-family="Source Serif 4, Georgia, serif" font-size="96" fill="#1a1a1a">math-coding</text>
  <text x="440" y="356" font-family="JetBrains Mono, ui-monospace, monospace" font-size="30" fill="#5a5a5a">linked, fresh, independent evidence</text>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="26">
    <rect x="96" y="430" width="330" height="52" rx="26" fill="#f1ede5" stroke="#d4d0c8"/>

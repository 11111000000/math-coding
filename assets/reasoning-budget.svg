<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="rb-title" preserveAspectRatio="xMidYMid meet">
  <title id="rb-title">Three independent time-reporting scales: wall-clock-minutes, token-budget, step-count. The three are independently observable and may not be combined into a single natural-language estimate (AGENTS.md §"Honest time reporting"; kernel contract §18).</title>
  <desc>Three columns side by side, one per observable scale: wall-clock (real seconds from harness), token-budget (prompt + completion tokens from API), step-count (tool calls / reasoning rounds from harness). Each column lists scale, observed-by, an example observation, and a forbidden combination sentence.</desc>
  <defs>
    <style>
      .rb-col { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.25; }
      .rb-col-hdr { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.25; stroke-dasharray: 2 2; }
      .rb-text-scale { font-family: Georgia, "Iowan Old Style", serif; font-size: 14px; fill: #8b3a3a; text-anchor: middle; font-style: italic; font-weight: 600; }
      .rb-text-label { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #5a5a5a; text-anchor: start; }
      .rb-text-value { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #1a1a1a; text-anchor: start; }
      .rb-text-note { fill: #5a5a5a; font-family: Georgia, "Iowan Old Style", serif; font-size: 10px; text-anchor: start; font-style: italic; }
      .rb-arrow { stroke: #5a5a5a; stroke-width: 1; fill: none; }
      .rb-section { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5a5a5a; letter-spacing: 0.06em; text-anchor: start; }
      .rb-combined { fill: #fbfaf6; stroke: #9a2929; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .rb-combined-text { font-family: Georgia, "Iowan Old Style", serif; font-size: 12px; fill: #9a2929; text-anchor: middle; font-style: italic; }
      .rb-rule { stroke: #d4d0c8; stroke-width: 1; fill: none; }
    </style>
    <marker id="rb-head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
  </defs>

  <text class="rb-section" x="20" y="24">AGENTS.md §"Honest time reporting" + §18  time : Session × Agent → ExecutionLog</text>

  <!-- THREE COLUMNS -->
  <g transform="translate(20, 50)">

    <!-- column 1: wall-clock -->
    <g transform="translate(0, 0)">
      <rect class="rb-col" x="0" y="0" width="200" height="180" rx="4"/>
      <text class="rb-text-scale" x="100" y="26">wall-clock</text>
      <text class="rb-text-label" x="14" y="50">scale</text>
      <text class="rb-text-value" x="14" y="64">minutes / seconds</text>
      <text class="rb-text-label" x="14" y="88">observed-by</text>
      <text class="rb-text-value" x="14" y="102">user / runtime harness</text>
      <text class="rb-text-label" x="14" y="126">example</text>
      <text class="rb-text-note" x="14" y="140">"elapsed 18 min since</text>
      <text class="rb-text-note" x="14" y="154">session start."</text>
    </g>

    <!-- column 2: token-budget -->
    <g transform="translate(220, 0)">
      <rect class="rb-col" x="0" y="0" width="200" height="180" rx="4"/>
      <text class="rb-text-scale" x="100" y="26">token-budget</text>
      <text class="rb-text-label" x="14" y="50">scale</text>
      <text class="rb-text-value" x="14" y="64">prompt + completion</text>
      <text class="rb-text-label" x="14" y="88">observed-by</text>
      <text class="rb-text-value" x="14" y="102">API call meter</text>
      <text class="rb-text-label" x="14" y="126">example</text>
      <text class="rb-text-note" x="14" y="140">"consumed 142,300</text>
      <text class="rb-text-note" x="14" y="154">prompt + completion."</text>
    </g>

    <!-- column 3: step-count -->
    <g transform="translate(440, 0)">
      <rect class="rb-col" x="0" y="0" width="200" height="180" rx="4"/>
      <text class="rb-text-scale" x="100" y="26">step-count</text>
      <text class="rb-text-label" x="14" y="50">scale</text>
      <text class="rb-text-value" x="14" y="64">tool calls, reasoning rounds</text>
      <text class="rb-text-label" x="14" y="88">observed-by</text>
      <text class="rb-text-value" x="14" y="102">runtime harness</text>
      <text class="rb-text-label" x="14" y="126">example</text>
      <text class="rb-text-note" x="14" y="140">"applied 27 patches,</text>
      <text class="rb-text-note" x="14" y="154">8 tool calls."</text>
    </g>
  </g>

  <!-- forbidden combination box -->
  <g transform="translate(20, 250)">
    <rect class="rb-combined" x="0" y="0" width="640" height="20" rx="3"/>
    <text class="rb-combined-text" x="320" y="14">Do not conflate wall-clock with subjective attention; one scale, one claim.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" role="img" aria-labelledby="chain-title" preserveAspectRatio="xMidYMid meet">
  <title id="chain-title">The math-coding chain: intent, decision, obligation, change, attestation, revision.</title>
  <defs>
    <style>
      .chain-box { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.25; }
      .chain-box-emph { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 2; }
      .chain-text { font-family: Georgia, "Iowan Old Style", serif; font-size: 14px; fill: #1a1a1a; text-anchor: middle; }
      .chain-text-emph { font-family: Georgia, "Iowan Old Style", serif; font-size: 14px; fill: #8b3a3a; text-anchor: middle; font-style: italic; }
      .chain-arrow { stroke: #5a5a5a; stroke-width: 1; fill: none; }
      .chain-cycle { stroke: #8b3a3a; stroke-width: 1; fill: none; stroke-dasharray: 4 3; }
      .chain-label { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9px; fill: #8a8a8a; text-anchor: middle; }
      .chain-cycle-label { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9px; fill: #8b3a3a; text-anchor: middle; font-style: italic; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5a5a5a"/>
    </marker>
    <marker id="arrowhead-cycle" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8b3a3a"/>
    </marker>
  </defs>

  <!-- horizontal flow: 6 boxes -->
  <g transform="translate(0, 50)">

    <!-- intent -->
    <g transform="translate(0, 0)">
      <rect class="chain-box" x="0" y="0" width="100" height="50" rx="4"/>
      <text class="chain-text" x="50" y="22">intent</text>
      <text class="chain-label" x="50" y="38">why</text>
    </g>
    <path class="chain-arrow" d="M100,25 L120,25" marker-end="url(#arrowhead)"/>

    <!-- decision -->
    <g transform="translate(125, 0)">
      <rect class="chain-box" x="0" y="0" width="100" height="50" rx="4"/>
      <text class="chain-text" x="50" y="22">decision</text>
      <text class="chain-label" x="50" y="38">commitment</text>
    </g>
    <path class="chain-arrow" d="M225,25 L245,25" marker-end="url(#arrowhead)"/>

    <!-- obligation (emphasised) -->
    <g transform="translate(250, 0)">
      <rect class="chain-box-emph" x="0" y="0" width="110" height="50" rx="4"/>
      <text class="chain-text-emph" x="55" y="22">obligation</text>
      <text class="chain-label" x="55" y="38">kernel checks</text>
    </g>
    <path class="chain-arrow" d="M360,25 L380,25" marker-end="url(#arrowhead)"/>

    <!-- change -->
    <g transform="translate(385, 0)">
      <rect class="chain-box" x="0" y="0" width="100" height="50" rx="4"/>
      <text class="chain-text" x="50" y="22">change</text>
      <text class="chain-label" x="50" y="38">diff</text>
    </g>
    <path class="chain-arrow" d="M485,25 L505,25" marker-end="url(#arrowhead)"/>

    <!-- attestation -->
    <g transform="translate(510, 0)">
      <rect class="chain-box" x="0" y="0" width="100" height="50" rx="4"/>
      <text class="chain-text" x="50" y="22">attestation</text>
      <text class="chain-label" x="50" y="38">test/review/observation</text>
    </g>
    <path class="chain-arrow" d="M610,25 L630,25" marker-end="url(#arrowhead)"/>

    <!-- revision -->
    <g transform="translate(635, 0)">
      <rect class="chain-box" x="0" y="0" width="100" height="50" rx="4"/>
      <text class="chain-text" x="50" y="22">revision</text>
      <text class="chain-label" x="50" y="38">next decision</text>
    </g>

    <!--
      The cycle back from `revision` to `intent`. A dashed
      oxblood arc leaves the right edge of the revision box,
      goes up and to the left across the top of the diagram,
      and lands on the top edge of the intent box. The arc
      has an arrowhead at its end so the direction is
      unambiguous, and a single small caption below the
      diagram names it.
    -->
    <path class="chain-cycle" d="M735,30 C735,-30 250,-30 50,30" marker-end="url(#arrowhead-cycle)"/>
    <text class="chain-cycle-label" x="400" y="115">revision extends commitment into the next decision</text>
  </g>
</svg>
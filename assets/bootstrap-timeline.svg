<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="timeline-title" preserveAspectRatio="xMidYMid meet">
  <title id="timeline-title">Bootstrap timeline: v3-alpha-0.0.1 → 8fa7fcf (v3.0.0.19) → today (e7261ba). Manual regime ends at 8fa7fcf; automated regime begins the same commit.</title>
  <desc>Three epochs on a horizontal axis: v3-alpha-0.0.1 (26 Sep 2026) opens the manual regime with 8 manual bootstrap checks; 8fa7fcf (29 Sep 2026, v3.0.0.19) closes the bootstrap gate so that verdicts become kernel-enforced guarantees; today (e7261ba) is the current automated-regime head. The 8 manual checks remain additive obligations for protected policy transitions.</desc>
  <defs>
    <style>
      .axis-line { stroke: #1a1a1a; stroke-width: 1; }
      .axis-major { stroke: #1a1a1a; stroke-width: 1.5; }
      .axis-major-ox { stroke: #8b3a3a; stroke-width: 2.5; }
      .manual-shade { fill: #f1e8d8; opacity: 0.55; }
      .auto-shade { fill: #eef0f3; opacity: 0.5; }
      .regime-label { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #5a5a5a; letter-spacing: 0.08em; text-anchor: middle; text-transform: uppercase; }
      .epoch-title { font-family: Georgia, serif; font-size: 13px; fill: #1a1a1a; text-anchor: middle; font-weight: 600; }
      .epoch-title-ox { font-family: Georgia, serif; font-size: 14px; fill: #8b3a3a; text-anchor: middle; font-weight: 600; }
      .epoch-sub { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9px; fill: #5a5a5a; text-anchor: middle; }
      .epoch-sub-ox { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 9px; fill: #8b3a3a; text-anchor: middle; }
      .epoch-sha { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 10px; fill: #8b3a3a; text-anchor: middle; font-weight: 600; }
      .check-circle { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.25; }
      .check-num { font-family: Georgia, serif; font-size: 10px; fill: #1a1a1a; text-anchor: middle; font-weight: 600; }
      .annotation { font-family: Georgia, serif; font-size: 11px; fill: #8b3a3a; text-anchor: middle; font-style: italic; }
      .annotation-rule { stroke: #8b3a3a; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .footer-text { font-family: Georgia, serif; font-size: 10px; fill: #5a5a5a; text-anchor: middle; font-style: italic; }
      .title-text { font-family: Georgia, serif; font-size: 15px; fill: #1a1a1a; font-weight: 600; }
      .subtitle-text { font-family: Georgia, serif; font-size: 11px; fill: #5a5a5a; font-style: italic; }
    </style>
  </defs>

  <text class="title-text" x="40" y="28">Bootstrap timeline</text>
  <text class="subtitle-text" x="40" y="46">v3-alpha-0.0.1 → 8fa7fcf (v3.0.0.19) → today (e7261ba)</text>

  <rect class="manual-shade" x="100" y="70" width="450" height="105" rx="2"/>
  <rect class="auto-shade" x="550" y="70" width="430" height="105" rx="2"/>

  <text class="regime-label" x="325" y="86">manual regime</text>
  <text class="regime-label" x="765" y="86">automated regime</text>

  <g>
    <g><circle class="check-circle" cx="160" cy="110" r="9"/><text class="check-num" x="160" y="114">1</text><title>1. intended behavior and affected capabilities are explicit</title></g>
    <g><circle class="check-circle" cx="240" cy="110" r="9"/><text class="check-num" x="240" y="114">2</text><title>2. known invariants are preserved or deliberately revised</title></g>
    <g><circle class="check-circle" cx="320" cy="110" r="9"/><text class="check-num" x="320" y="114">3</text><title>3. the strongest relevant counterexample has been considered</title></g>
    <g><circle class="check-circle" cx="400" cy="110" r="9"/><text class="check-num" x="400" y="114">4</text><title>4. planned evidence is available or its absence is declared</title></g>
    <g><circle class="check-circle" cx="160" cy="140" r="9"/><text class="check-num" x="160" y="144">5</text><title>5. every known blocking deficit has a remedy</title></g>
    <g><circle class="check-circle" cx="240" cy="140" r="9"/><text class="check-num" x="240" y="144">6</text><title>6. rollback or forward recovery exists for irreversible work</title></g>
    <g><circle class="check-circle" cx="320" cy="140" r="9"/><text class="check-num" x="320" y="144">7</text><title>7. specification changes include positive and negative fixtures</title></g>
    <g><circle class="check-circle" cx="400" cy="140" r="9"/><text class="check-num" x="400" y="144">8</text><title>8. no automated guarantee is claimed</title></g>
  </g>

  <text class="epoch-sub" x="325" y="163" text-anchor="middle">8 manual bootstrap checks (additive for protected policy transitions)</text>

  <line class="axis-line" x1="80" y1="200" x2="1020" y2="200"/>

  <g>
    <line class="axis-major" x1="140" y1="192" x2="140" y2="212"/>
    <text class="epoch-title" x="140" y="232">v3-alpha-0.0.1</text>
    <text class="epoch-sub" x="140" y="245">26 Sep 2026</text>
    <text class="epoch-sha" x="140" y="258">c3630f1</text>
    <text class="epoch-sub" x="140" y="271">manual regime begins</text>
  </g>

  <g>
    <line class="axis-major-ox" x1="550" y1="180" x2="550" y2="220"/>
    <text class="epoch-title-ox" x="550" y="232">8fa7fcf</text>
    <text class="epoch-sub-ox" x="550" y="245">v3.0.0.19 — 29 Sep 2026</text>
    <text class="epoch-sha" x="550" y="258">gate automated</text>
    <text class="epoch-sub" x="550" y="271">8 manual checks additive</text>
  </g>

  <g>
    <line class="axis-major" x1="960" y1="192" x2="960" y2="212"/>
    <text class="epoch-title" x="960" y="232">today</text>
    <text class="epoch-sub" x="960" y="245">automated regime</text>
    <text class="epoch-sha" x="960" y="258">e7261ba</text>
    <text class="epoch-sub" x="960" y="271">head of branch</text>
  </g>

  <text class="annotation" x="550" y="289">verdicts become kernel-enforced guarantees</text>
  <line class="annotation-rule" x1="550" y1="222" x2="550" y2="275"/>

  <text class="footer-text" x="550" y="304">AGENTS.md §Bootstrap gate expired at 8fa7fcf; 8 checks remain additive for protected policy transitions</text>
</svg>

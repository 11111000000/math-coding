<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="a1-title a1-desc">
  <title id="a1-title">Axiom A1 — Feedback: every commitment has a path to an observation.</title>
  <desc id="a1-desc">A circular arrow looped around a small filled dot at the centre, indicating a closed path from commitment back to observation. The loop is the path that links every declared intent to a concrete observed attestation; A1 forbids commitments without such a path.</desc>
  <defs>
    <style>
      .a1-loop { stroke: #8b3a3a; stroke-width: 1.75; fill: none; }
      .a1-dot { fill: #8b3a3a; stroke: none; }
      .a1-label { font-family: Georgia, "Charter", serif; font-size: 5.5px; fill: #1a1a1a; }
    </style>
    <marker id="a1h" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto">
      <path d="M0,0 L5,2.5 L0,5 z" fill="#8b3a3a"/>
    </marker>
  </defs>
  <!-- One big circle, four labeled stations, clockwise arrows -->
  <path class="a1-loop" d="M40,16 A24,24 0 0 1 64,40" marker-end="url(#a1h)"/>
  <path class="a1-loop" d="M64,40 A24,24 0 0 1 40,64" marker-end="url(#a1h)"/>
  <path class="a1-loop" d="M40,64 A24,24 0 0 1 16,40" marker-end="url(#a1h)"/>
  <path class="a1-loop" d="M16,40 A24,24 0 0 1 40,16" marker-end="url(#a1h)"/>
  <!-- Four labeled dots on the loop -->
  <circle class="a1-dot" cx="40" cy="16" r="2.5"/>
  <circle class="a1-dot" cx="64" cy="40" r="2.5"/>
  <circle class="a1-dot" cx="40" cy="64" r="2.5"/>
  <circle class="a1-dot" cx="16" cy="40" r="2.5"/>
  <!-- Top/bottom labels outside; side labels inside the loop at offset heights -->
  <text class="a1-label" x="40" y="9" text-anchor="middle">commitment</text>
  <text class="a1-label" x="40" y="75" text-anchor="middle">observation</text>
  <text class="a1-label" x="58" y="36" text-anchor="end">prediction</text>
  <text class="a1-label" x="22" y="48" text-anchor="start">revision</text>
</svg>

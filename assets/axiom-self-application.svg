<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="a3-title a3-desc">
  <title id="a3-title">Axiom A3 — Self-application: the rules govern their own changes.</title>
  <desc id="a3-desc">A square frame with a spiral inside, the spiral's tail converging on a small filled dot at the centre. The frame is the rule set; the spiral is the rule set applied to itself; the dot is the fixed point. A3 forbids rules that exempt themselves from revision.</desc>
  <defs>
    <style>
      .a3-square { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.75; }
      .a3-spiral { fill: none; stroke: #8b3a3a; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
      .a3-kernel { fill: #8b3a3a; stroke: none; }
    </style>
  </defs>
  <!-- Outer square: the policy boundary under its own rules -->
  <rect class="a3-square" x="8" y="8" width="64" height="64" rx="2"/>
  <!-- Spiral winding inward to the kernel node -->
  <path class="a3-spiral" d="M 64 40
                            C 64 22, 52 12, 40 12
                            C 22 12, 12 28, 12 40
                            C 12 56, 28 68, 44 68
                            C 60 68, 68 56, 60 48
                            C 52 40, 36 44, 36 52
                            C 36 58, 44 60, 48 56
                            C 52 52, 48 44, 44 48"/>
  <!-- Kernel node: where the spiral converges -->
  <circle class="a3-kernel" cx="40" cy="40" r="3"/>
</svg>

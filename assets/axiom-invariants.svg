<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="a2-title">
  <title id="a2-title">Axiom A2 -- Invariants and Recovery: every invariant is paired with a recovery path.</title>
  <defs>
    <style>
      .a2-shield { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.75; }
      .a2-check { stroke: #8b3a3a; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .a2-plus { stroke: #8b3a3a; stroke-width: 1.25; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  <!-- Shield outline (the invariant under protection) -->
  <path class="a2-shield" d="M40,10 L62,18 L62,40 Q62,58 40,72 Q18,58 18,40 L18,18 Z"/>
  <!-- Check-mark inside: invariant holds -->
  <path class="a2-check" d="M28,40 L36,48 L52,30"/>
  <!-- Cross-hatch at the base: recovery path beneath the shield -->
  <line class="a2-plus" x1="26" y1="60" x2="54" y2="60"/>
  <line class="a2-plus" x1="30" y1="64" x2="50" y2="64"/>
</svg>
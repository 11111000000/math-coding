<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="a2-title a2-desc">
  <title id="a2-title">Axiom A2 — Invariants and Recovery: every invariant is paired with a recovery path.</title>
  <desc id="a2-desc">A shield with a check-mark inside, above a short ladder rail with two rungs. The shield represents an invariant; the ladder represents the recovery path paired with it. A2 forbids any invariant that has no companion recovery path.</desc>
  <defs>
    <style>
      .a2-shield { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.75; }
      .a2-check { stroke: #8b3a3a; stroke-width: 1.75; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .a2-rail { stroke: #8b3a3a; stroke-width: 1.75; fill: none; stroke-linecap: round; }
      .a2-rung { stroke: #8b3a3a; stroke-width: 1.75; fill: none; stroke-linecap: round; }
    </style>
  </defs>
  <!-- Shield: the invariant under protection -->
  <path class="a2-shield" d="M40,6 L60,14 L60,38 Q60,52 40,64 Q20,52 20,38 L20,14 Z"/>
  <!-- Check-mark: invariant holds -->
  <path class="a2-check" d="M28,34 L36,42 L52,24"/>
  <!-- Ladder: the recovery path -->
  <line class="a2-rail" x1="34" y1="70" x2="34" y2="78"/>
  <line class="a2-rail" x1="46" y1="70" x2="46" y2="78"/>
  <line class="a2-rung" x1="34" y1="73" x2="46" y2="73"/>
  <line class="a2-rung" x1="34" y1="76" x2="46" y2="76"/>
</svg>

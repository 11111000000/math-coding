<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-labelledby="a0-title a0-desc">
  <title id="a0-title">Axiom A0 — Separation: kinds are distinct, the chain goes one way.</title>
  <desc id="a0-desc">Two adjacent boxes separated by a dashed vertical line, with a single arrow pointing from the left box to the right. The dashed line is the kind boundary A0 enforces; the arrow shows that inference is one-way. A0 forbids confusing the two boxes or reversing the arrow.</desc>
  <defs>
    <style>
      .a0-box { fill: #fbfaf6; stroke: #8b3a3a; stroke-width: 1.75; }
      .a0-divider { stroke: #8b3a3a; stroke-width: 1.75; stroke-dasharray: 2 2; fill: none; }
      .a0-arrow { stroke: #8b3a3a; stroke-width: 1.75; fill: none; stroke-linecap: round; }
    </style>
    <marker id="a0h" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#8b3a3a"/>
    </marker>
  </defs>
  <!-- Two non-touching rounded boxes: kinds are distinct -->
  <rect class="a0-box" x="8" y="22" width="22" height="36" rx="3"/>
  <rect class="a0-box" x="50" y="22" width="22" height="36" rx="3"/>
  <!-- Divider between the two kinds: the kind boundary -->
  <line class="a0-divider" x1="40" y1="14" x2="40" y2="66"/>
  <!-- One-way arrow through the divider: chain goes one way -->
  <line class="a0-arrow" x1="32" y1="40" x2="46" y2="40" marker-end="url(#a0h)"/>
</svg>

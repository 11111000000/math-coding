name: docker

# Per `decisions/install-tooling-2026-10.yaml` outcome
# `docker-image-publishes-ghcr`. Builds and publishes the
# `Dockerfile.debian-slim` image to GHCR.
#
# TRAP (OCAML_BEST_PRACTICES §11.26): `container:` is honored at
# the JOB level only. Per-matrix `container:` is silently ignored.
# This workflow uses a separate job (`build-image`) so the
# `container: ghcr.io/.../...` field applies to the whole job.
#
# On every push to main, on every tag, and on workflow_dispatch:
#   - build the image with the current VERSION file
#   - tag as `latest`, `${VERSION}`, `${VERSION}-debian-slim`
#   - push to `ghcr.io/11111000000/mathc`
#   - smoke-test via `docker run --rm ... mathc version`

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write  # for cosign keyless signing; required by the cosign-sign job (OCAML_BEST_PRACTICES §11.36)

jobs:
  build-image:
    name: build mathc image (debian-slim)
    runs-on: ubuntu-latest
    outputs:
      # Exposed to downstream jobs (cosign-sign, cosign-verify)
      # per GitHub Actions' job-output protocol. Set by the
      # Read VERSION step below.
      version: ${{ steps.version.outputs.version }}
    # Per OCAML_BEST_PRACTICES §11.26: container at the JOB level only.
    # We use the Ubuntu runner as the build host (it has docker
    # installed and can run `docker build` natively) instead of running
    # inside a container; the Debian-slim image is the artifact, not
    # the build environment.
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: version
        run: |
          if [ ! -s VERSION ]; then
            echo "VERSION file missing or empty" >&2
            exit 2
          fi
          VERSION=$(head -n1 VERSION | tr -d '[:space:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using VERSION=${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.debian-slim
          push: false
          load: true
          tags: mathc:dev
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          # No QEMU cross-arch for rev 1 (decision-install-tooling-2026-10.yaml
          # reversals). arm64 image is `if: false` below until QEMU is wired.

      - name: Smoke test (CI build)
        run: |
          set -eu
          # The smoke test runs the locally-loaded image and asserts
          # `mathc version` exits 0 with the expected version string.
          output=$(docker run --rm mathc:dev version)
          case "$output" in
            *"math-coding ${{ steps.version.outputs.version }}"*)
              echo "ok: smoke test passed: $output"
              ;;
            *)
              echo "FAIL: smoke test output mismatch: $output" >&2
              exit 1
              ;;
          esac

      - name: Build and push (multi-arch)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.debian-slim
          push: true
          tags: |
            ghcr.io/11111000000/mathc:latest
            ghcr.io/11111000000/mathc:${{ steps.version.outputs.version }}
            ghcr.io/11111000000/mathc:${{ steps.version.outputs.version }}-debian-slim
            ghcr.io/11111000000/mathc:${{ steps.version.outputs.version }}-arm64
            ghcr.io/11111000000/mathc:edge
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          # cosign keyless signing wired by `decisions/ux-3-cosign-
          # image-2026-10.yaml`; the cosign-sign job below runs
          # immediately after this step completes. The earlier
          # "deferred" comment refers to the cycle that closed in
          # `decisions/install-tooling-2026-10.yaml` reversal
          # signal `cosign-signature-missing`.
          #
          # Per `decisions/docker-arm64-image-2026-10.yaml` (D8
          # of plan-2026-10-distro-friction): a single
          # `docker/build-push-action@v5` invocation now produces
          # a multi-arch manifest. Buildx's pre-installed QEMU
          # binfmt cross-compiles the OCaml flake for aarch64
          # in parallel with the amd64 build; per-arch wall-clock
          # increase is ~30-90s (Buildx parallel scheduling), not
          # the ~3-5 min a serial build would take. The
          # `provenance: true` flag is implicit on
          # `docker/build-push-action@v5`; SBOM + provenance are
          # emitted per-arch and embedded in the multi-arch
          # manifest.

      # arm64 convenience tag: published as a single-arch per-arch
      # image so an arm64 host pinning the digest (or using
      # `docker pull --platform=linux/arm64`) gets the explicit
      # per-arch ref. With the multi-arch step above publishing
      # `:$VERSION-arm64` first (as a multi-arch convenience
      # pointer), the per-arch image wins on last-write — that is
      # the deployment semantic intended by
      # `decisions/docker-arm64-image-2026-10.yaml`.
      # Originally deferred (the prior "DEFERRED" comment on the
      # `if: false` was added during the install-tooling cycle);
      # enabled by `decisions/docker-arm64-image-2026-10.yaml`
      # (D8 of plan-2026-10-distro-friction).
      - name: Build and push (arm64 convenience tag)
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.debian-slim
          push: true
          tags: ghcr.io/11111000000/mathc:${{ steps.version.outputs.version }}-arm64
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          platforms: linux/arm64

  # Per `decisions/ux-3-cosign-image-2026-10.yaml` outcome
  # `cosign-image-signed`. Runs after the image is published by
  # the `build-image` job; signs the image with keyless cosign
  # (Sigstore + GitHub Actions OIDC), with no `--key` flag and
  # no secret keys stored in the repository. Gates on release
  # tag push (matching `publish`'s `softprops/action-gh-release`
  # trigger on the same tag shape) so every release tag produces
  # a signed image.
  #
  # TRAP (OCAML_BEST_PRACTICES §11.36): cosign sign WITHOUT
  # `permissions: id-token: write` at the workflow or job level
  # fails with "getting signer: getting key from GitHub
  # Actions OIDC: no token". The workflow-level grant on
  # line 25-28 (this file) is sufficient for the new job.
  cosign-sign:
    name: cosign sign ghcr.io/mathc image (keyless)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-image
    runs-on: ubuntu-latest
    # id-token: write is inherited from the workflow-level
    # permissions block. The job does NOT need packages: write
    # because the image is already published by build-image.
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            "ghcr.io/11111000000/mathc:${{ needs.build-image.outputs.version }}"

  # Smoke test: re-verify the freshly-signed image in CI on every
  # release tag push. Asserts exit 0 so a registry compromise OR
  # a missing signature both fail the release gate. Mirrors the
  # `cosign verify` invocation used by `install.sh --cosign-verify`
  # (default-on in `scripts/install-tooling/install.sh`) so the
  # user-side and CI-side checks use the same identity + issuer.
  cosign-verify:
    name: cosign verify ghcr.io/mathc image (smoke test)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: cosign-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -eu
          cosign verify \
            --certificate-identity-regexp 'https://github.com/11111000000/math-coding' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "ghcr.io/11111000000/mathc:${{ needs.build-image.outputs.version }}"
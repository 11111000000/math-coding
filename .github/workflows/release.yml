name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: mathc (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64,    runs-on: ubuntu-latest,    ocaml-arch: x86_64,  exe: mathc-linux-x86_64,    ext: '' }
          - { label: linux-aarch64,   runs-on: ubuntu-24.04-arm, ocaml-arch: arm64,   exe: mathc-linux-aarch64,   ext: '' }
          - { label: darwin-aarch64,  runs-on: macos-latest,     ocaml-arch: arm64,   exe: mathc-darwin-aarch64,  ext: '' }
          # darwin-x86_64 (Intel macs): GitHub's macos-13 runners
          # are nearly always queued out. Modern Macs are Apple Silicon
          # so this is dropped from v1. To re-enable: change `macos-13`
          # to whatever Intel macOS runner is current, e.g. macos-14-xlarge.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Manual OCaml bootstrap.
      #
      # We avoid ocaml/setup-ocaml@v2 because:
      #   1. It pins opam 2.0/2.1 with a frozen opam-repository snapshot
      #      that lags behind new OCaml releases.
      #   2. It apt-installs darcs as part of opam init, but Ubuntu 24.04
      #      has dropped the darcs package from its repositories.
      #   3. It uses --no-depexts flag that requires opam >= 2.1.
      #
      # We install opam 2.4.1 directly from the upstream binary release,
      # point it at opam-repository#HEAD, and switch to OCaml 5.4.0.
      - name: Install system dependencies (Linux)
        if: matrix.runs-on == 'ubuntu-latest' || matrix.runs-on == 'ubuntu-24.04-arm'
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git ca-certificates rsync bubblewrap
      - name: Install opam (Linux)
        if: matrix.runs-on == 'ubuntu-latest' || matrix.runs-on == 'ubuntu-24.04-arm'
        run: |
          set -eu
          # Always install opam 2.4.1 over whatever the runner may
          # have pre-installed via apt; --no-setup requires opam >= 2.2.
          curl -fsSL "https://github.com/ocaml/opam/releases/download/2.4.1/opam-2.4.1-${{ matrix.ocaml-arch }}-linux" \
            -o /tmp/opam
          sudo install -m755 /tmp/opam /usr/local/bin/opam
          opam --version
      - name: Install opam (macOS)
        if: matrix.runs-on == 'macos-latest'
        run: |
          set -eu
          curl -fsSL "https://github.com/ocaml/opam/releases/download/2.4.1/opam-2.4.1-${{ matrix.ocaml-arch }}-macos" \
            -o /tmp/opam
          sudo install -m755 /tmp/opam /usr/local/bin/opam
          opam --version

      - name: Init opam and install OCaml
        run: |
          set -eu
          opam init -y --bare --disable-sandboxing
          opam switch create 5.4.0 -y
          opam switch set 5.4.0
          echo "OPAM_SWITCH=5.4.0" >> "$GITHUB_ENV"
          echo "PATH=$HOME/.opam/5.4.0/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install dune
        run: |
          set -eu
          eval "$(opam env --switch=5.4.0)"
          opam install --yes dune

      - name: Build mathc (release)
        run: |
          set -eu
          eval "$(opam env --switch=5.4.0)"
          opam exec -- dune build --profile=release core/main.exe

      - name: Stage binary
        run: |
          set -eu
          mkdir -p dist-bin
          cp _build/default/core/main.exe "dist-bin/${{ matrix.exe }}${{ matrix.ext }}"
          chmod +x "dist-bin/${{ matrix.exe }}${{ matrix.ext }}" 2>/dev/null || true
          ls -la dist-bin
          file dist-bin/*

      - name: Smoke-test binary
        run: |
          set -eu
          bin="dist-bin/${{ matrix.exe }}${{ matrix.ext }}"
          "$bin" version || true
          "$bin" help 2>&1 | head -5 || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist-bin/${{ matrix.exe }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: List staged binaries
        run: ls -la dist-bin && file dist-bin/*

      - name: Verify all expected platforms present
        run: |
          set -eu
          for exe in mathc-linux-x86_64 mathc-linux-aarch64 mathc-darwin-aarch64; do
            [ -f "dist-bin/$exe" ] || { echo "missing: $exe"; exit 1; }
          done

      - name: Publish on tag — official release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: math-coding ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-bin/mathc-linux-x86_64
            dist-bin/mathc-linux-aarch64
            dist-bin/mathc-darwin-aarch64

      - name: Publish on main / manual dispatch — rolling edge
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: edge (rolling nightly from main)
          prerelease: true
          files: |
            dist-bin/mathc-linux-x86_64
            dist-bin/mathc-linux-aarch64
            dist-bin/mathc-darwin-aarch64
          body: |
            Rolling prerelease built from the latest commit on `main`.

            ```sh
            curl -fsSL https://raw.githubusercontent.com/11111000000/math-coding/main/skills/install.sh | sh
            ```

            No toolchain required: downloads `mathc` for your OS/arch.

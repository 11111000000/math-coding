name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'version (e.g. 0.2.0)'
        required: false
        default: '0.2.0'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: linux
            arch: x86_64
            cross: false
            output: math-coding
            archive: tar
          - target: linux-aarch64
            os: linux
            arch: aarch64
            cross: true
            output: math-coding
            archive: tar
          - target: darwin-x86_64
            os: darwin
            arch: x86_64
            cross: true
            output: math-coding
            archive: tar
          - target: darwin-aarch64
            os: darwin
            arch: aarch64
            cross: true
            output: math-coding
            archive: tar
          - target: windows-x86_64
            os: windows
            arch: x86_64
            cross: true
            output: math-coding.exe
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: install-ocaml-linux-native
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libev-dev pkg-config
          opam init --bare --disable-sandboxing
          opam switch create 5.2.0 || true
          opam switch set 5.2.0
          opam install -y dune ocamlfind yaml yojson alcotest qcheck cmdliner

      - name: install-ocaml-linux-arm
        if: matrix.target == 'linux-aarch64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libev-dev pkg-config qemu-user-static
          opam init --bare --disable-sandboxing
          opam switch create 5.2.0 || true
          opam switch set 5.2.0
          opam install -y dune ocamlfind yaml yojson alcotest qcheck cmdliner
          # Use qemu to run aarch64 binary in CI for smoke test.

      - name: install-ocaml-darwin-x86_64
        if: matrix.target == 'darwin-x86_64'
        uses: cross-platform-actions/action@v1
        with:
          base_image: macos-13-x64
          arch: x86_64

      - name: install-ocaml-darwin-aarch64
        if: matrix.target == 'darwin-aarch64'
        uses: cross-platform-actions/action@v1
        with:
          base_image: macos-14-arm64
          arch: arm64

      - name: install-ocaml-windows
        if: matrix.target == 'windows-x86_64'
        uses: cross-platform-actions/action@v1
        with:
          base_image: windows-2022
          arch: x64

      - name: build
        if: matrix.target == 'linux-x86_64' || matrix.target == 'darwin-x86_64' || matrix.target == 'darwin-aarch64' || matrix.target == 'linux-aarch64'
        run: |
          eval $(opam env --switch=5.2.0)
          dune build --profile=release
          cp _build/default/src/main.exe ${{ matrix.output }}
          ls -la ${{ matrix.output }}

      - name: build-windows
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          opam init --bare --disable-sandboxing
          opam switch create 5.2.0 || true
          opam switch set 5.2.0
          opam install -y dune ocamlfind yaml yojson alcotest qcheck cmdliner mingw-w64-shared
          eval $(opam env --switch=5.2.0)
          ${{ matrix.cross && 'x86_64-w64-mingw32' || '' }}-w64-mingw32-gcc
          dune build --profile=release
          cp _build/default/src/main.exe ${{ matrix.output }}

      - name: smoke-test
        if: matrix.target != 'windows-x86_64' && matrix.target != 'linux-aarch64'
        run: |
          chmod +x ${{ matrix.output }}
          ./${{ matrix.output }} version

      - name: package
        run: |
          mkdir -p release
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cd release
            mv ../${{ matrix.output }} .
            zip -q ${{ matrix.target }}.zip ${{ matrix.output }}
            echo "artifact=release/${{ matrix.target }}.zip" >> $GITHUB_OUTPUT
          else
            cd release
            mv ../${{ matrix.output }} .
            tar -czf ${{ matrix.target }}.tar.gz ${{ matrix.output }}
            echo "artifact=release/${{ matrix.target }}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/${{ matrix.target }}.${{ matrix.archive }}
        if: no()  # upload below as release asset

  release:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: download-artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.version }}
          name: math-coding ${{ github.ref_name || inputs.version }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
          fail_on_unmatched_files: true

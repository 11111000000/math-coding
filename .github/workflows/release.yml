name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: mathc (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: linux-x86_64,    runs-on: ubuntu-latest,     exe: mathc-linux-x86_64,    ext: '' }
          - { label: linux-aarch64,   runs-on: ubuntu-24.04-arm,  exe: mathc-linux-aarch64,   ext: '' }
          - { label: darwin-x86_64,   runs-on: macos-13,          exe: mathc-darwin-x86_64,   ext: '' }
          - { label: darwin-aarch64,  runs-on: macos-latest,      exe: mathc-darwin-aarch64,  ext: '' }
          - { label: windows-x86_64,  runs-on: windows-latest,    exe: mathc-windows-x86_64,  ext: '.exe' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ubuntu 24.04 removed `darcs` from its apt repositories, but
      # `ocaml/setup-ocaml@v2` unconditionally does `apt-get install
      # darcs` during init. We don't need darcs (only OCaml + dune),
      # so we synthesize a no-op `darcs` package via equivs and
      # install it locally. This makes the action's `apt-get install
      # darcs` a no-op success.
      - name: Install fake darcs package (Linux only)
        if: matrix.runs-on == 'ubuntu-latest' || matrix.runs-on == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends equivs
          cat > /tmp/darcs.ctl <<'CTL'
          Section: devel
          Package: darcs
          Version: 99.0
          Maintainer: math-coding CI <ci@local>
          Architecture: any
          Description: shim for ocaml/setup-ocaml@v2 on Ubuntu 24.04+
           math-coding does not invoke darcs at build time; this empty
           package satisfies the action's mandatory `apt-get install darcs`.
          CTL
          (cd /tmp && equivs-build darcs.ctl) >/dev/null
          sudo dpkg -i /tmp/darcs_99.0_*.deb || sudo apt-get install -f -y

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 5.4.0
          opam-depext: false
          dune-cache: true

      - name: Install dune
        run: opam install --yes --no-depexts dune

      - name: Build mathc (release)
        run: opam exec -- dune build --profile=release core/main.exe

      - name: Stage binary
        shell: bash
        run: |
          set -eu
          mkdir -p dist-bin
          cp _build/default/core/main.exe "dist-bin/${{ matrix.exe }}${{ matrix.ext }}"
          chmod +x "dist-bin/${{ matrix.exe }}${{ matrix.ext }}" 2>/dev/null || true
          ls -la dist-bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist-bin/${{ matrix.exe }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: List staged binaries
        run: ls -la dist-bin

      - name: Publish on tag — official release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: math-coding ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-bin/mathc-linux-x86_64
            dist-bin/mathc-linux-aarch64
            dist-bin/mathc-darwin-x86_64
            dist-bin/mathc-darwin-aarch64
            dist-bin/mathc-windows-x86_64.exe

      - name: Publish on main / manual dispatch — rolling edge
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: edge (rolling nightly from main)
          prerelease: true
          files: |
            dist-bin/mathc-linux-x86_64
            dist-bin/mathc-linux-aarch64
            dist-bin/mathc-darwin-x86_64
            dist-bin/mathc-darwin-aarch64
            dist-bin/mathc-windows-x86_64.exe
          body: |
            Rolling prerelease built from the latest commit on `main`.

            ```sh
            curl -fsSL https://raw.githubusercontent.com/11111000000/math-coding/main/skills/install.sh | sh
            ```

            No toolchain required: downloads `mathc` for your OS/arch.

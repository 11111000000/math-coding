name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: mathc (${{ matrix.label }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - { label: linux-x86_64,    runs-on: ubuntu-latest,     is_musl: false, exe: mathc-linux-x86_64,    ext: '' }
          - { label: linux-aarch64,   runs-on: ubuntu-24.04-arm,  is_musl: false, exe: mathc-linux-aarch64,   ext: '' }
          # Linux — musl (alpine). RE-ENABLED 2026-10-07 per
          # decisions/portable-linux-musl.yaml (rev 3, state: retired).
          # Previous failure (CI runs #81, #83, #84, #85, #125, #126
          # at the 'Init opam (Alpine musl container)' step with exit
          # 127/1) was traced to:
          #   1. ocaml/opam:alpine-* images do not put `opam` on
          #      $PATH at any of the canonical locations.
          #   2. plain alpine:3.20 ships `opam` only in the `community`
          #      repo (which is disabled by default) at version
          #      2.1.6-r0.
          #   3. (Root cause #3, discovered 2026-10-07): the
          #      `container: alpine:3.20` key in matrix.include is
          #      SILENTLY IGNORED — GitHub Actions only honors
          #      `container:` at the JOB level, not per-matrix-entry.
          #      Our shell steps were running on the Ubuntu host, not
          #      inside alpine. /etc/apk/repositories did not exist.
          # The Alpine step below now uses `docker run alpine:3.20 …`
          # from the Ubuntu runner (which has docker installed) to
          # actually run inside the container. The `container:` field
          # is left here only as documentation of intent — see OCAML
          # BEST_PRACTICES §11.26 for the trap log entry.
          # aarch64-musl deferred to v2 (needs QEMU emulation).
          - { label: linux-x86_64-musl, runs-on: ubuntu-latest, is_musl: true, exe: mathc-linux-x86_64-musl, ext: '' }
          # macOS
          - { label: darwin-x86_64,   runs-on: macos-15-intel,    exe: mathc-darwin-x86_64,   ext: '' }
          - { label: darwin-aarch64,  runs-on: macos-latest,      exe: mathc-darwin-aarch64,  ext: '' }
          # Windows
          - { label: windows-x86_64,  runs-on: windows-latest,    exe: mathc-windows-x86_64,  ext: '.exe' }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Manual OCaml bootstrap. We avoid ocaml/setup-ocaml@v2 because
      # it pins opam 2.0/2.1 with a frozen opam-repository snapshot
      # that lags new OCaml releases, and on Windows its bundled
      # opam-repository snapshot doesn't even contain OCaml 5.4.0.

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.is_musl
        shell: bash
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl git ca-certificates rsync bubblewrap

      - name: Install opam (Linux/macOS, glibc)
        if: (runner.os == 'Linux' && !matrix.is_musl) || runner.os == 'macOS'
        # Alpine container ships with opam pre-installed; see the
        # dedicated Alpine branch below. We skip this step entirely
        # when matrix.is_musl = true.
        shell: bash
        run: |
          set -eu
          arch=$(uname -m)
          case "$arch" in
            x86_64|amd64) arch=x86_64 ;;
            aarch64|arm64) arch=arm64 ;;
          esac
          # ${RUNNER_OS,,} is Bash 4+ only; macOS Bash is 3.2.
          case "$RUNNER_OS" in
            Linux) os=linux ;;
            macOS) os=macos ;;
            *) echo "unknown RUNNER_OS: $RUNNER_OS"; exit 1 ;;
          esac
          curl -fsSL "https://github.com/ocaml/opam/releases/download/2.4.1/opam-2.4.1-${arch}-${os}" \
            -o /tmp/opam
          sudo install -m755 /tmp/opam /usr/local/bin/opam
          opam --version

      - name: Install opam (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # The opam Windows .exe is a single-file distribution.
          # Place it on PATH as opam.exe.
          $bin = 'C:\tools'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          $url = "https://github.com/ocaml/opam/releases/download/2.4.1/opam-2.4.1-x86_64-windows.exe"
          $expected = "72dbcc40dc5e2bb9185f444fd125d2fa0899c4d069652be01647a3a3b8be8fa8"
          Invoke-WebRequest -Uri $url -OutFile "$bin\opam.exe" -UseBasicParsing
          $actual = (Get-FileHash -Path "$bin\opam.exe" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            Write-Error "opam.exe checksum mismatch:`n  expected: $expected`n  actual:   $actual"
            exit 1
          }
          Write-Host "opam.exe SHA256 verified: $actual"
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$bin;$env:PATH"
          & opam --version

      - name: Init opam and create OCaml switch
        if: "!matrix.is_musl"
        shell: bash
        run: |
          set -eu
          opam init -y --bare --disable-sandboxing
          opam switch create 5.4.0 -y
          opam switch set 5.4.0
          echo "OPAM_SWITCH=5.4.0" >> "$GITHUB_ENV"
          OPAM_BIN="$HOME/.opam/5.4.0/bin"
          [ -d "$OPAM_BIN" ] || OPAM_BIN="/c/Users/$USERNAME/.opam/5.4.0/bin"
          echo "PATH=$OPAM_BIN:$PATH" >> "$GITHUB_ENV"

      - name: Build mathc (Alpine musl container via docker run)
        if: matrix.is_musl
        shell: bash
        run: |
          set -eu
          # Per matrix-level container directives being silently ignored
          # (see commit history), we run the entire Alpine build inside
          # an explicit `docker run alpine:3.20 …` invocation from the
          # Ubuntu runner. The runner ships with docker installed and
          # the user can run it without sudo. The workspace is
          # bind-mounted at /src so the same source files are compiled
          # inside the container.
          #
          # The alpine container runs (in order):
          #   (a) apk add opam bash build-base musl-dev
          #       (community repo, enabled in 3.20; opam 2.1.6 does
          #       not ship a pre-built OCaml 5.4.0 switch so opam
          #       compiles it from source — that needs a full C
          #       toolchain. build-base is the alpine meta-package
          #       that pulls gcc, make, binutils, libc-dev, patch,
          #       and the rest of what an autoconf-driven C build
          #       expects. musl-dev supplies the musl C headers.
          #       Earlier attempts that added only gcc / musl-dev /
          #       make one at a time revealed the dep chain
          #       piecewise — see OCAML_BEST_PRACTICES.md §11.26
          #       for the full trap log.)
          #   (b) opam init --bare --disable-sandboxing
          #   (c) opam update           (refreshes stale 2.1.6 index)
          #   (d) opam switch create 5.4.0 -y
          #   (e) opam install --yes dune
          #   (f) opam exec -- dune build --profile=release --build-dir
          #       /tmp/musl-build bin/mathc.exe
          #   (g) stage mathc.exe to /src/dist-bin/mathc-linux-x86_64-musl
          #   (h) defensive ldd check: must NOT link against libc.so.6
          #   (i) ./mathc-linux-x86_64-musl version smoke test
          #
          # The `/tmp/musl-build` build dir isolates dune's state from
          # any host _build/ that may already exist on the workspace.
          docker run --rm \
            --user root \
            -v "${GITHUB_WORKSPACE}:/src" \
            -w /src \
            -e HOME=/root \
            alpine:3.20 sh -c '
              set -eu
              apk add --no-cache opam bash build-base musl-dev
              opam --version
              opam init -y --bare --disable-sandboxing
              opam update
              opam switch create 5.4.0 -y
              opam switch set 5.4.0
              eval "$(opam env --switch=5.4.0)"
              opam install --yes dune
              opam exec -- dune build --profile=release \
                --build-dir /tmp/musl-build bin/mathc.exe
              mkdir -p dist-bin
              cp /tmp/musl-build/default/bin/mathc.exe \
                 dist-bin/mathc-linux-x86_64-musl
              chmod +x dist-bin/mathc-linux-x86_64-musl
              # Defensive: must NOT link against glibc
              ldd dist-bin/mathc-linux-x86_64-musl 2>&1 | tee /tmp/ldd.out
              if grep -q "libc\\.so\\.6" /tmp/ldd.out; then
                echo "FATAL: musl variant links against glibc — aborting" >&2
                exit 1
              fi
              ./dist-bin/mathc-linux-x86_64-musl version
            '

      - name: Install dune
        if: "!matrix.is_musl"
        shell: bash
        run: |
          set -eu
          eval "$(opam env --switch=5.4.0)"
          opam install --yes dune

      - name: Build mathc (release)
        if: "!matrix.is_musl"
        shell: bash
        run: |
          set -eu
          eval "$(opam env --switch=5.4.0)"
          opam exec -- dune build --profile=release bin/mathc.exe

      - name: Stage binary
        if: "!matrix.is_musl"
        shell: bash
        run: |
          set -eu
          mkdir -p dist-bin
          cp _build/default/bin/mathc.exe "dist-bin/${{ matrix.exe }}${{ matrix.ext }}"
          chmod +x "dist-bin/${{ matrix.exe }}${{ matrix.ext }}" 2>/dev/null || true
          ls -la dist-bin

      - name: Verify musl linkage (Alpine)
        if: matrix.is_musl
        shell: bash
        run: |
          set -eu
          # Re-verify on the host (Ubuntu) that the artifact written
          # by the docker-run step is actually musl-linked. The
          # ./dist-bin/mathc-linux-x86_64-musl version smoke test
          # was already run inside the container at the end of the
          # 'Build mathc (Alpine musl container via docker run)'
          # step; we don't repeat it here because the musl binary
          # would fail to start on the Ubuntu glibc host.
          ldd dist-bin/${{ matrix.exe }} 2>&1 | tee /tmp/ldd.out
          if grep -q 'libc\.so\.6' /tmp/ldd.out; then
            echo "FATAL: musl variant links against glibc — aborting" >&2
            exit 1
          fi
          echo "musl linkage check passed on Ubuntu host"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist-bin/${{ matrix.exe }}${{ matrix.ext }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # CI runs #86-#94 all failed at "Generate adoption bundle"
      # with exit 127 (command not found). The publish job did
      # not check out the source, so ./scripts/dist-adoption.sh
      # did not exist in the workspace. This checkout is required
      # for the dist-adoption.sh invocation. Pre-existing bug
      # dating back to at least 4ef31f7 (release #80); release.yml
      # was refactored when the dist-adoption.sh script was added
      # (commit fd4ecca) but the checkout was missed.
      - name: Checkout (for dist-adoption.sh)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-bin
          merge-multiple: true

      - name: List staged binaries
        run: ls -la dist-bin && file dist-bin/*

      - name: Verify all expected platforms present
        run: |
          set -eu
          # Required artifacts: 5 platforms.
          # mathc-linux-x86_64-musl is OPTIONAL — it is built only
          # when the linux-x86_64-musl matrix entry is enabled
          # (currently disabled per decisions/portable-linux-musl.yaml
          # reversal signal 'alpine-ci-build-fails', 2026-10-04).
          for exe in mathc-linux-x86_64 mathc-linux-aarch64 \
                    mathc-darwin-x86_64 mathc-darwin-aarch64 \
                    mathc-windows-x86_64.exe; do
            [ -f "dist-bin/$exe" ] || { echo "missing: $exe"; exit 1; }
          done
          if [ -f "dist-bin/mathc-linux-x86_64-musl" ]; then
            echo "musl artifact present (linux-x86_64-musl)"
          else
            echo "musl artifact absent — expected while portable-linux-musl is retired"
          fi

      - name: Generate adoption bundle
        run: |
            set -eu
            ./scripts/dist-adoption.sh
            ls -laR dist/adoption/
            tar -czf dist-bin/dist-adoption.tar.gz -C dist adoption
            ls -la dist-bin/dist-adoption.tar.gz

      - name: Publish on tag — official release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: math-coding ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-bin/mathc-linux-x86_64
            dist-bin/mathc-linux-aarch64
            dist-bin/mathc-darwin-x86_64
            dist-bin/mathc-darwin-aarch64
            dist-bin/mathc-windows-x86_64.exe
            dist-bin/mathc-linux-x86_64-musl
            dist-bin/dist-adoption.tar.gz

      - name: Publish on main / manual dispatch — rolling edge
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: edge
          name: edge (rolling nightly from main)
          prerelease: true
          files: |
            dist-bin/mathc-linux-x86_64
            dist-bin/mathc-linux-aarch64
            dist-bin/mathc-darwin-x86_64
            dist-bin/mathc-darwin-aarch64
            dist-bin/mathc-windows-x86_64.exe
            dist-bin/mathc-linux-x86_64-musl
            dist-bin/dist-adoption.tar.gz
          body: |
            Rolling prerelease built from the latest commit on `main`.

            ```sh
            curl -fsSL https://raw.githubusercontent.com/11111000000/math-coding/main/skills/install.sh | sh
            ```

            No toolchain required: downloads `mathc` for your OS/arch.

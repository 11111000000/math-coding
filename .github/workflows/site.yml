name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mathc render reads witness commit hashes; shallow clone errors
      - name: Install pandoc (for manifesto.html LaTeX model)
        run: sudo apt-get install -y pandoc
      - uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 5.4
      - run: opam install --yes dune
      - name: Render site
        run: opam exec -- bash scripts/render.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
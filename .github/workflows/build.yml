name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24

      - name: Enable flake features
        run: echo "experimental-features = nix-command flakes" >> ~/.config/nix/nix.conf

      - name: Cache nix store
        uses: cachix/cachix-action@v12
        with:
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          cachix-cache-name: 'math-coding'

      - name: Build shell
        uses: rsnabc/markdown-shellcheck-action@v0
        with:
          files: scripts/install.sh

      - name: Build OCaml binary
        run: nix develop --command bash -c 'dune build --profile=release'

      - name: Run tests
        run: nix develop --command bash -c 'dune test'

      - name: Build shared install
        run: nix develop --command bash -c 'MATH_CODING_VERSION=ci-test sh scripts/install.sh'

      - name: Verify binary
        run: ./math-coding version

      - name: Probe axiom packets
        run: ./math-coding probe 2>&1 | tail -5

      - name: Check all packets
        run: ./math-coding check 2>&1 | tail -5

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: math-coding
          path: _build/default/src/main.exe

name: CI

# Per ROADMAP.md §P3 (time-box on detailed work) and §P6 (pre-commit
# verification), every PR to main must pass scripts/dev verify. That
# script calls nix develop .#test which brings the entire reproducible
# toolchain (ocaml 5.5, dune 3.23, mathcoding_core + mathcoding_git +
# mathcoding_junit libraries, fmt, cmdliner, alcotest, ocamlformat).
#
# We install nix once via the official action and cache the nix store
# across runs. total wall time on a fresh runner: ~6 min (nix install)
# + ~3 min (build + tests). Subsequent runs with cache hit: ~2 min.

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same ref when a new push lands; saves
# CI minutes when an author force-pushes mid-review.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: scripts/dev verify
    runs-on: ubuntu-22.04
    # The store generation below adds a full sweep (~10 min with a
    # warm tree, more with a cold one) to the job, so the budget
    # moves with it. The step timeouts below are the ones that
    # matter; this is the ceiling above them.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The full history, not a shallow clone.
          #
          # The `mathc gate` step below resolves the merge base with
          # the push target and falls back to `GITHUB_SHA^` when it
          # cannot resolve one. A depth-1 clone has neither the merge
          # base nor the parent commit, so the gate would evaluate
          # the wrong diff - a wrong answer whose cause is the
          # checkout configuration and not the corpus.
          #
          # The store generation below signs against HEAD, so the
          # commit the attestations name has to be the one this push
          # introduced.
          fetch-depth: 0

      - name: Install nix
        uses: cachix/install-nix-action@v30
        with:
          # Use a stable nix version; nixpkgs pinned in flake.lock
          # pin the rest. nix_version is the nix CLI; 2.24 is the
          # current stable release line at the time of writing.
          install_url: https://releases.nixos.org/nix/nix-2.24.10/install
          extra_nix_config: |
            experimental-features = nix-command flakes
            # Cache build outputs in the nix store, not in the CWD.
            build-dir = /tmp/nix-build

      - name: Enable flakes
        run: echo "flakes enabled via extra_nix_config above"

      - name: Cache nix store (disabled, see comment)
        # Parallel fix to commit 4b623c2 (which fixed the same issue
        # in site.yml but not here). cachix-action@v15 rejects
        # 'fail-on-cache-miss' as an unknown input, which caused
        # CI #49 to fail at this step and skip all subsequent
        # steps (scripts/dev verify, mathc self-check, nix flake
        # check). Disabling matches the site.yml pattern.
        # Re-enable when cachix-action accepts the new schema.
        if: false
        uses: cachix/cachix-action@v15
        with:
          name: math-coding
          skipPush: true

      - name: Install git
        run: |
          sudo apt-get update
          sudo apt-get install -y git

      # install-nix-action sets `build-dir = /tmp/nix-build` (see the
      # extra_nix_config above) but does NOT create the directory. Every
      # nix invocation then dies with:
      #     error: creating directory
      #     '/tmp/nix-build/nix-build-math-coding-dev-test-env.drv-0':
      #     No such file or directory
      # This step used to sit below `scripts/dev verify`, ~27 lines
      # too late to help — the very first nix call already failed. It
      # must run before anything invokes nix. Asserted by
      # tests/fixtures/ci-prereqs-precede-consumers.sh.
      - name: Prepare nix build dir
        run: mkdir -p /tmp/nix-build

      - name: generate attestation store
        # The store is GENERATED evidence, not a committed artefact:
        # `.gitignore` excludes `/attestations/`, so this checkout
        # carries no store and every step below that reads one would
        # read an empty one. The store is generated HERE, before the
        # first consumer, and uploaded as a build artefact at the end
        # of the job (decision
        # decisions/store-not-committed-2026-10.yaml).
        #
        # `scripts/sign-store.sh` runs every obligation's own
        # verifier and writes the evidence into the working tree. It
        # needs the dev shell - many verifiers are `dune ...`
        # commands - and a built kernel, so it runs inside
        # `nix develop .#test`. The sweep took 574 s on 2026-10-25
        # with the verifier memoisation in place.
        #
        # THE INDEX, NOT A COMMIT. The kernel admits a store file as
        # evidence only when git tracks it
        # (bin/Mathc.ml::store_keep_for -> `git ls-files`, which
        # reads the INDEX), and a generated store is by definition
        # untracked. So the generated files are STAGED in this
        # workspace: index membership is what the filter reads,
        # nothing is committed, and the commit diff (BASE..HEAD) the
        # gate evaluates is untouched by the index.
        run: |
          nix develop .#test --command bash scripts/sign-store.sh && git add -f attestations
        timeout-minutes: 20

      - name: scripts/dev verify
        # The verify script:
        #   1. cleans stale dune lock
        #   2. dune build (full release profile)
        #   3. dune test (kernel conformance + xfail digest vectors)
        #   4. scripts/fmt-check.sh (dune fmt --preview under profile)
        #   5. scripts/check.sh (26 shell fixtures)
        # ~3-5 min on a 4-core runner.
        run: ./scripts/dev verify
        timeout-minutes: 15

      - name: mathc self-check (bootstrap-gate block)
        # Tier-1 ROADMAP #2 / AGENTS.md §Bootstrap-gate expiry mechanism.
        # The store this step reads is the one the "generate
        # attestation store" step produced for THIS commit: the store
        # is generated, not committed, so the tree carries no snapshot
        # to read. The verdict is a statement about the corpus as it
        # stands, not about a store that was committed weeks ago.
        #
        # A corpus whose obligations are not all covered by evidence
        # observed at this commit reads as `unknown` - exit 3, a red
        # step. That is the honest reading, and the exit-honesty
        # contract below is what demands it.
        #
        # EXIT HONESTY - the step's status IS mathc's status:
        #   exit 0 = verdict pass    -> step green
        #   exit 1 = verdict fail    -> step red
        #   exit 3 = verdict unknown -> step red
        # per constitution.md Invariant 14 / 14b (exit honesty and
        # symmetric exit honesty: `exit 0 != verdict:Unknown`).
        #
        # How the code is carried. `|| rc=$?` captures mathc's status
        # without tripping errexit, so the diagnostic dump still runs;
        # the last line re-raises the captured status. The `jq` dump is
        # DIAGNOSTIC ONLY and is structurally unable to influence the
        # verdict - before rev 2 of this file it was the last command
        # in the block, so its own exit 0 stood in for the step's, and
        # verdict=fail and verdict=unknown both reported green.
        # `continue-on-error: false` was inert for the same reason: the
        # step could not fail. See
        # decisions/ci-gate-exit-honesty-2026-10.yaml@1.
        #
        # The block below is replayed verbatim by
        # scripts/ci-step-exit-sim.sh against a stub mathc that exits
        # 0/1/3, so the three rows above are checked, not asserted.
        # ~5 s.
        run: |
          rc=0
          nix develop .#test --command bash -c \
            '_build/install/default/bin/mathc self-check > /tmp/self-check.json 2> /tmp/self-check.err' || rc=$?
          echo "self-check exit=${rc}"
          if jq -c '{verdict, kernel_digest, repository_digest, subjects_count: (.subjects | length)}' \
               /tmp/self-check.json; then
            :
          else
            echo "--- mathc self-check stderr (no parsable JSON above) ---" >&2
            cat /tmp/self-check.err >&2 || true
          fi
          exit "${rc}"
        continue-on-error: false
        timeout-minutes: 2

      - name: mathc gate (merge verdict for the pushed diff)
        # The merge gate, run over the diff this push introduced.
        #
        # It was NOT run in CI until now. The gate is the most heavily
        # specified code path in the kernel (three verdicts, waivers,
        # rebuttals, phase awareness) and it had no automated caller:
        # `mathc self-check` was the only gate CI executed.
        #
        # BASE is the merge base with the push target, HEAD is the
        # pushed commit. Both are resolved by the gate itself; an
        # unresolvable ref is an input error (exit 2), not a verdict.
        #
        # REPORTING, NOT BLOCKING, until the legacy-attestation debt
        # reaches zero (decisions/legacy-attestation-debt-2026-10).
        # The corpus currently carries 760 legacy attestations whose
        # materials_digest is empty, and the gate is `unknown` while
        # they are there. A step switched on before its debt is paid
        # would be red from the first push and would be switched off
        # again — which is how the gate came to have no caller at all.
        # This step prints the verdict and the debt number on every
        # push, so the number that decides when the step becomes
        # blocking is visible rather than remembered.
        run: |
          BASE="$(git merge-base "${GITHUB_BASE_REF:-main}" "${GITHUB_SHA}" 2>/dev/null || echo "${GITHUB_SHA}^")"
          nix develop .#test --command bash -c \
            "_build/install/default/bin/mathc gate '$BASE' '${GITHUB_SHA}'" || true
          bash tests/fixtures/legacy-attestation-debt.sh || true
        continue-on-error: true
        timeout-minutes: 3

      - name: nix flake check (OCaml_BEST_PRACTICES + pre-commit hooks)
        # Runs shellcheck + ocamlformat via pre-commit-hooks.nix on the
        # .ocamlformat-tracked files. ~30 s. Catches drift that
        # scripts/dev verify does not.
        run: nix flake check
        timeout-minutes: 10

      - name: upload attestation store
        # The store is not committed, so an auditor cannot read a
        # snapshot of it out of the tree any more. The replacement is
        # this artefact: the evidence CI observed for THIS commit,
        # downloadable from the run that produced it.
        #
        # `if: always()` so the artefact is uploaded even when a
        # later step is red - the evidence is wanted most when
        # something failed.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: attestation-store
          path: attestations/
          if-no-files-found: warn

      - name: Failure diagnostics
        if: failure()
        # On any failure, dump the nix-build dir and the last 200
        # lines of the most useful log. CI minutes are not free; we
        # optimise the human triage time, not the wall time.
        run: |
          echo "=== last 200 lines of /tmp/_build.log if any ==="
          [ -f /tmp/_build.log ] && tail -200 /tmp/_build.log || echo "no _build.log"
          echo "=== scripts/dev lint check ==="
          ./scripts/dev lint || true
          echo "=== dune build full output ==="
          nix develop .#test --command bash -c 'dune build --root . --profile=release 2>&1 | tail -100' || true
        env:
          GIT_TERMINAL_PROMPT: 0

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: 5.4
      - run: opam install --yes dune
      - name: Build
        run: opam exec -- dune build --profile=release bin/mathc.exe
      - name: Test
        run: opam exec -- dune test
      - name: Verify CI references real targets (infrastructure-honesty fixture)
        run: bash tests/fixtures/ci-targets-exist.sh
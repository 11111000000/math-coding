name: v5

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-verify-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix develop -c dune build --root .
      - run: nix develop -c dune runtest --root . --force
      - run: nix develop -c sh test/package_smoke.sh
      - name: Exercise installed project onboarding
        run: >-
          nix build .#default .#stand --no-link &&
          MATHC="$(nix path-info .#default)/bin/mathc"
          MATHC_STAND="$(nix path-info .#stand)/bin/stand"
          sh test/agent_onboarding.sh

  portable:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-portable-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix develop -c sh test/package_smoke.sh portable
      - run: nix develop -c dune build --root . bin/mathc.exe
      - run: nix develop -c ./_build/default/bin/mathc.exe --root . run
      - run: ./_build/default/bin/mathc.exe --root . doctor

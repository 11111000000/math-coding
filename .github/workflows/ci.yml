name: v5

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-verify-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix develop -c dune build --root .
      - run: nix develop -c dune runtest --root . --force
      - run: nix develop -c sh test/package_smoke.sh
      - name: Exercise installed project onboarding
        run: >-
          nix build .#default .#stand --no-link &&
          MATHC="$(nix path-info .#default)/bin/mathc"
          MATHC_STAND="$(nix path-info .#stand)/bin/stand"
          sh test/agent_onboarding.sh
      - name: Drop the store locks a failed build left behind
        run: sudo find /nix/store -maxdepth 1 -name '*.lock' -delete 2>/dev/null || true

  portable:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      # The static toolchain is not in the public binary cache: it is built
      # from source and it is the whole cost of this job. Its closure is
      # therefore cached under a key that the pages job restores as well,
      # so the package is built once and not once per job and per run.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-portable-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      # The static toolchain is not in the public binary cache, so a cold
      # build compiles it inside the sandbox. That compilation intermittently
      # fails with "Failed to allocate signal stack for domain 0" from the
      # OCaml 5 runtime. The failure is in the environment, not in the
      # change under test, and the same revision passes on a rerun. The
      # build is therefore retried before the job is failed.
      - name: Build and check the portable package
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            log="$(mktemp)"
            nix develop -c sh test/package_smoke.sh portable >"$log" 2>&1
            status=$?
            cat "$log"
            if [ "$status" -eq 0 ]; then
              rm -f "$log"
              exit 0
            fi
            flaky=no
            if grep -q "Failed to allocate signal stack" "$log"; then
              flaky=yes
            fi
            rm -f "$log"
            if [ "$flaky" != "yes" ]; then
              exit "$status"
            fi
            echo "portable build attempt $attempt failed with the signal stack error" >&2
          done
          echo "the portable build failed three times with the signal stack error" >&2
          exit 1
      - run: nix develop -c dune build --root . bin/mathc.exe
      - run: nix develop -c ./_build/default/bin/mathc.exe --root . run
      - run: ./_build/default/bin/mathc.exe --root . doctor
      # A failed build leaves lock files in the store that the runner user
      # cannot read. The cache action archives the store with tar, and tar
      # refuses to continue on them: the cache is then never saved and the
      # next job builds the whole toolchain again.
      - name: Drop the store locks a failed build left behind
        run: sudo find /nix/store -maxdepth 1 -name '*.lock' -delete 2>/dev/null || true

  pages:
    needs: portable
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
        with:
          extra-conf: |
            accept-flake-config = true
            experimental-features = nix-command flakes
      # The same cache as the portable job: the static toolchain is already
      # in it, so the package here is a lookup and not a build.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569
        with:
          primary-key: nix-${{ runner.os }}-portable-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix develop -c dune build --root .
      # The portable package is verified inside `mathc run`, and a verifier
      # has a bounded execution time. Build it first so the check measures
      # the package, not the cost of a cold toolchain.
      - run: nix build .#portable --no-link
      # Fresh evidence in this environment: the deployed map shows the
      # states computed here, and the job fails unless the run is green.
      - run: nix develop -c ./_build/default/bin/mathc.exe --root . run
      - run: nix develop -c sh site/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      # The deployment is only finished when the published page carries the
      # commit that was deployed. Pages needs a moment to propagate, so the
      # check retries before it fails the job.
      - name: Check the published site
        run: |
          sha=$(git rev-parse --short HEAD)
          for attempt in $(seq 1 12); do
            if curl -fsSL https://11111000000.github.io/math-coding/ | grep -q "@ $sha "; then
              echo "published: $sha"
              exit 0
            fi
            echo "attempt $attempt: the published site does not carry $sha yet"
            sleep 10
          done
          echo "the published site does not carry $sha" >&2
          exit 1
      - name: Drop the store locks a failed build left behind
        run: sudo find /nix/store -maxdepth 1 -name '*.lock' -delete 2>/dev/null || true

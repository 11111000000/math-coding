    statement: |
      `mathc validate
      decisions/ux-3-import-adr-parser-2026-10.yaml` exits 0.

assumptions:
  - id: bullet-markers-stable
    state: assumed
    statement: |
      MADR uses `* ` as the bullet marker; CommonMark allows
      `* `, `- `, or `+ `. The parser supports `* ` and
      `- ` (covers MADR and adr-tools). The `+ ` marker
      (a CommonMark variant) is rare in practice and not
      currently supported.
    owner: human:maintainer
    consequence_if_false: |
      A decision file that uses `+ ` bullets is parsed
      as a single block (no bullet split). Resolution:
      add `+ ` to the bullet patterns in `bullets`.
    review_on:
      - signal: plus-bullet-marked

obligations:
  - id: cram-test-passes
    outcome: madr-consequences-parsed
    claim: |
      `tests/cli/import-adr.t` exercises a MADR file with
      `### Consequences` containing 2 bullets and asserts
      both are emitted as outcomes.
    acceptance:
      all:

    condition: |
      A future decision adds a strict mode to
      `mathc import-adr` that fails on unrecognized
      structure (instead of best-effort with fallback).
      Resolution: this decision's `subsection_body` and
      `bullets` are absorbed into the strict parser; the
      best-effort behavior is the fallback.
    action: supersede-with-strict


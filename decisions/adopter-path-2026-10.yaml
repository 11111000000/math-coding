intent: |
  The first ten minutes of an adoption should cost what the protocol is
  worth, and the scaffold should not make commitments the adopter did
  not make.

  MEASURED, by the project's own adoption experiment (2026-10-17, five
  external projects: click, express, cobra, ripgrep, sinatra):

    the with-math-coding arm ran a median of ~10 minutes a session
    the control arm ran a median of ~3 minutes a session
    the gap is 3-4x, and the experiment REFUTED three of its own
    hypotheses (H3 schema coverage, H4 throughput, H8 attest-batch)

  The experiment is also honest about what the gap was made of: it was
  dominated by repeated diagnosis of the env-var defect, not by
  math-coding per se, and once the layout was locked the per-decision
  overhead fell to ~1-2 minutes of content writing. Both readings are
  kept here, because both cost the adopter minutes.

  WHAT THE SCAFFOLD DID. `mathc init` wrote a master policy whose
  single obligation was `verifier: mathc self-check` -- an obligation
  the corpus discharges by attesting itself, which is the circularity
  the kernel's own source calls out ("an obligation verified by `mathc
  self-check` asserts the health of the corpus it is itself part of,
  which is self-reference, and sixteen such verifiers have been
  declared rather than left circular"). The same file carried a
  pre-written counterexample arguing that "adopting math-coding is
  overhead for a project where one developer works alone" and that the
  argument does not justify skipping: an argument about a project the
  kernel cannot see, written by the kernel, in the first file the
  adopter reads.

axiom_link:
  - A0
  - A3

commitment: |
  After this decision closes:

  1. `mathc init` writes ONE decision -- the master policy -- and it
     carries ONE executable obligation about the adopter's own tree:
     `file-exists src`, the first entry of `scope.paths`. No obligation
     in the scaffold is verified by `mathc self-check`. The scaffolded
     policy validates cleanly: `parse-ok`, `obligations: 1`, exit 0,
     no stderr (pinned by tests/cli/init-defaults.t).

  2. The scaffold's counterexample slot carries the instruction to
     write it, not a paragraph the kernel wrote for the adopter. The
     slot itself stays: at mode >= standard an empty counterexample
     is a Block, and at any mode its absence prints
     MC-COUNTEREXAMPLE-MISSING on every validate (measured, both).

  3. `adoption/SKILL.md` §"When to apply" is OPT-IN. The burden of
     proof sits on the application: an adopter who applies the skill
     names the signal that pays for it, an adopter who does not says
     why the protocol does not fit. The light floor is the entry
     point, and the measured cost is stated in the document.

  4. `docs/adoption-quickstart.md` takes an adopter from an empty
     repository to a green `mathc self-check` in one page: the exact
     commands, the exact expected output, and what `unknown` means.


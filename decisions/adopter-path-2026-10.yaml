counterexample: |
  The strongest objection is that the measurement does not say what this
  decision says it says. The experiment itself writes that the 10-vs-3
  gap was "dominated by repeated diagnosis of the env-var defect, not
  by math-coding per se", and that once the layout was locked the
  per-decision overhead fell to ~1-2 minutes. On that reading the
  protocol is cheap, H4 was refuted by a kernel defect rather than by
  the method, and the conclusion this decision draws -- that the method
  costs more than it saves when applied blindly -- is not in the data.

  The objection is right about the experiment and wrong about the
  decision. The experiment measured two things at once: the price of
  the protocol, and the price of the parts of the protocol that were
  broken. The second is fixed. The first is what an adopter paid on
  the day, in every session, and it is still what the protocol asks
  for: a decision, a set of obligations, and evidence, per change. An
  adopter who applies the protocol to a project where nobody will read
  the trail pays the first price and gets none of the benefit. That is
  the blindness this decision removes, and it is visible in the same
  experiment: the with-protocol arm was 3-4x slower on tasks whose
  control arm did the same work in ~3 minutes.

  A second objection: the new obligation does not pass until the
  adopter points the policy at their own tree, so the scaffold hands
  over a check that is red before the adopter has done anything. That
  is accepted as a cost. The obligation names the first entry of
  `scope.paths`, the adopter edits that entry and the verifier to the
  path they actually have, and the alternative -- an obligation that
  always passes -- is the tautology this decision is removing.

  A third objection, measured while writing it: the natural verifier
  for "this directory exists" is `dir-exists`, and `dir-exists` on a
  path that does not exist CRASHED the kernel -- `Sys.is_directory`
  raises `Sys_error`, and `mathc verify` exited 3 with "mathc:
  internal error" instead of reporting the failure the obligation
  deserved. The crash was reported and fixed in the same cycle, in
  bin/Mathc.ml (the `dir-exists` arm now asks `Sys.file_exists path
  && Sys.is_directory path`), by the owner of that file. The scaffold
  still uses `file-exists`: it answers false for a path that does not
  exist, and it does not make the template depend on a file outside
  this decision's scope. The crash is written down here because the
  next person to write this verifier will reach for `dir-exists`.

antithesis: |
  The opposite claim would be that the rule was never the problem: keep
  the protocol default-on, apply it everywhere, and fix only the
  scaffold's wording. The counterexample the kernel wrote was a
  formatting mistake; the self-check obligation was a house style; the
  ten minutes were a defect that is now fixed.

  That claim is rejected on the cost, not on taste. The default-on rule
  is what put a self-check obligation and a written argument into the
  first file every adopter reads, and it did so for projects whose
  maintainers would never look at either. The experiment's own numbers
  are the cost: the with-protocol arm ran 3-4x the control arm on the
  same tasks, and the arm that benefits is the arm where somebody will
  read the trail -- an audit, a second agent, a team that outlives its
  authors. Applying the protocol where nobody reads it is not a
  cheaper way to get the benefit; it is the full price for none of it.
  The scaffold's wording was the symptom, and the rule was the cause.


risk:
  declared_triggers:
    - render-sh-allowlist-becomes-stale-on-next-article-addition
    - bilingual-policy-retired
    - kernel-render-changes-navigation-shape
  owner: human:site-maintainer

counterexample: |
  "Documentation pages do not need a decision; they are editorial
  changes." This argument fails for two reasons. First, the
  differences page is a *contract surface* — it makes public
  claims about what mathcoding inherits and refuses from
  twenty other methodologies, and those claims are referenced
  from the methodology page and from the manifesto. Second,
  `scripts/render.sh` is an allowlist that the site pipeline
  enforces; a change to the allowlist is, by the AGENTS.md
  P1 rule, a kernel-adjacent change that requires a decision.

antithesis: |
  A maintainer could argue that a 20-methodology comparison
  page makes the protocol look defensive ("look how we differ
  from everyone else") rather than confident. That position is
  rejected because visitors who already use one of those
  methodologies need an explicit, name-by-name translation
  between what they know and what mathcoding proposes; the
  page is the bridge, not the wall. A shorter page that only
  names the closest competitors (SDD, ADR, arc42, SAMM, DbC)
  was considered and rejected because visitors on a shorter
  path would still ask about the longer-tail methodologies
  and the page would not be self-contained.

relations:
  addresses:
    - "site-deploy@5"
    - "site-redesign-2026-10@1"

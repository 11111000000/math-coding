reason: |
  The `$id` family label of `schemas/*.json` is a release-brand
  string, not a kernel input: the validator parses decisions by
  hand and reads no JSON-Schema file, so no executable scheme in
  this corpus can observe the `$id` of a schema. The maintainer
  holds it: every `schemas/*.json` `$id` reads
  `https://math-coding.org/schema/3.3/<name>.json`, and the
  label is re-set deliberately at each brand bump.

  The hold expires 2027-01-29. If the label has not been
  re-checked by then, this obligation should be rewritten as an
  executable check (a fixture that reads the six `$id` values) or
  dropped.

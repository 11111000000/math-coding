reason: |
  The promise that `bin/Mathc.ml` calls `Policy.load_policies` once at the top
  of `main ()`, and that a missing policy file leaves the kernel working with
  an empty cache, is a fact about the kernel source. No test in this
  repository reads `bin/Mathc.ml` to assert it, and the canonical verifier
  forms cannot read a function's call site. A maintainer reads the dispatcher
  whenever the startup path changes. This acceptance holds until 2027-01-29.

reason: |
  The promise that the YAML-parser reader and the line-scanner reader of a
  decision file agree on scope.paths is a source-level property of the two
  call sites of lib/memory.ml::extract_scope_paths. The kernel runs no
  grep over the source, so the promise stays a human-held one: a maintainer
  confirms on every change to the readers that both still call that one
  extractor. This acceptance holds until 2027-01-29; by then the promise
  should carry an executable check or be dropped.

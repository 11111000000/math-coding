reason: |
  The promise that `lib/render/` performs no I/O — no `Sys.getenv_opt`,
  `Sys.readdir`, `Sys.file_exists`, `open_in`, `open_in_bin` — is a promise
  about the TEXT of the kernel sources. The canonical verifier forms prove
  that a file exists or that a named test passes; none of them proves the
  ABSENCE of a call, and no test in this repository asserts it. A maintainer
  greps `lib/render/` whenever the render module changes. This acceptance
  holds until 2027-01-29.
unverified_obligation: no-io-in-lib-render

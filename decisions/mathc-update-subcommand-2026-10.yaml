axiom_link:
  - A0
  - A3
intent: |
  Add a self-update subcommand to the `mathc` CLI:
  `mathc update [--channel=stable|edge|<ver>] [--yes]`. The
  command resolves the chosen channel into a concrete tag
  string, prompts the user for confirmation (skipping the
  prompt when `--yes` is supplied), then shells out to
  `scripts/install-tooling/install.sh` (POSIX) or
  `install.ps1` (Windows) with `--version=<resolved>`. The
  Windows path is selected via `Sys.os_type = "Win32"`; the
  POSIX path is the default.

  Add a companion `--check` flag to `mathc version`:
  `mathc version --check` compares the locally installed
  version (read from `./VERSION` at runtime, the same path
  `mathc version` already uses) against the latest stable
  upstream tag. Exit 0 when they match; exit 1 with the
  newer tag string printed to stdout when an upgrade is
  available. Network errors degrade to exit 0 (the no-newer
  case) so an offline user is never told to upgrade; this
  matches the `update-check-notify-2026-10@1` opt-in model
  but is wired into the `version` subcommand directly so
  no new env-var surface is introduced.

  The implementation lives in `bin/Mathc.ml::do_update` and
  `bin/Mathc.ml::do_version` (which is the existing
  subcommand; the `--check` switch is purely additive). The
  kernel (`lib/`, `lib/decision.ml`, `lib/packages.ml`,
  `lib/attestations/`, etc.) is untouched. Reversible in
  one commit (delete `do_update`, revert `do_version`,
  remove the dispatcher arm and the print_usage line).

  Boundaries (A3 self-application):
  - `lib/` is unchanged.
  - `lib/decision.ml`, `lib/packages.ml`, `lib/gate.ml`,
    `lib/policy.ml`, `lib/risk.ml`, `lib/canonical.ml`,
    `lib/attestations/**`, `lib/git/**`, `lib/junit/**`,
    `lib/init/**`, `lib/import_adr/**`, `lib/find/**`,
    `lib/check/**` are unchanged.
  - `spec/`, `schemas/`, `axioms/` are unchanged.
  - `bin/mathc_mcp.exe` is unchanged.
  - `VERSION` is NOT bumped (that is D13's scope).
  - `lib/update_check/` (env-flagged update-check) is NOT
    used; the `--check` flow on `mathc version` is
    self-contained inside `bin/Mathc.ml`.

antithesis: |
  The counter-position considered and rejected: "a
  self-update subcommand duplicates the install.sh one-
  liner; users can already run `curl | sh` to update." The
  author engaged with this position and rejected it on
  three grounds: (a) the install.sh one-liner requires the
  user to remember the URL and to re-read the prompt every
  release; an in-binary `mathc update` collapses the
  discoverable affordance (users who learn one subcommand
  learn both install and update); (b) on Windows the
  `irm | iex` one-liner requires PowerShell + admin in some
  configurations, and PowerShell's own profile-loading
  behavior obscures exit codes; routing through `mathc`
  gives a uniform exit-code contract (0/1/2/3) on every
  platform; (c) `mathc version --check` enables scripted
  update-notify flows in CI without depending on the
  install.sh script's environment (the network probe is a
  single `git ls-remote` invocation, no auth, no rate
  limit). The minimum sufficient response is one CLI arm
  plus one flag on `mathc version`.

  A second counter-position considered and rejected: "the
  implementation should use `curl | sh` directly instead of
  shelling out to install.sh." Rejected: the install.sh
  script already implements libc auto-detect, path auto-
  add, SHA-256 verification, cosign verification, and
  `--user-skill` orchestration. Reimplementing any subset
  of these in OCaml duplicates the verification surface and
  loses the cosign keyless verification introduced by
  `ux-3-cosign-image-2026-10`. Shelling out to the existing
  installer preserves the security boundary; OCaml is the
  I/O dispatcher, not the verifier.

counterexample: |
  "What if the user is offline when they run
   `mathc update`?" Counterargument: the implementation
  falls back to "v" ^ installed_version when the network
  probe fails, so a subsequent `install.sh --version=vX.Y.Z`
  is at least deterministic. The error path also exits
  with a non-zero code so CI / scripts can detect it.

  "What if `git ls-remote` is slow?" Counterargument: the
  probe is bounded by the user's patience; a one-shot
  blocking call on a `version --check` invocation is
  acceptable (the same pattern as `mathc self-check`,
  which already shells out to git).

  "What if the install script changes its CLI surface
   (`--version=<X>` becomes `--tag=<X>`)?" Counterargument:
  the install.sh script is versioned with the repo and is
  not a stable external API. A breakage is caught by CI
  on `bin/Mathc.ml::update_installer_argv` and is fixed
  in the same release. If the install script ever lands
  an incompatible CLI change, that change is its own
  decision (with its own obligation and attestation).

  "What about non-tagged builds (the `edge` channel)?"
  Counterargument: the `edge` channel is opt-in via
  `--channel=edge`; it is the install.sh's existing
  `MC_VERSION_DEFAULT` behavior re-exported. The default
  `--channel=stable` resolves to the latest `vX.Y.Z`
  tag, which is the documented user-facing contract.

commitment: |
  D1. `bin/Mathc.ml::do_update` (new) implements
      `mathc update [--channel=stable|edge|<ver>] [--yes]`.
      The channel ADT (`Update_stable` | `Update_edge`
      | `Update_pinned`) is parsed by `update_parse_channel`
      (rejects non-`v`-prefixed strings and unknown
      keywords with exit 2). The default channel is
      `stable`, which resolves to the latest `vX.Y.Z`
      tag via `update_fetch_latest_tag` (a `git ls-remote
      --tags --sort=-v:refname` probe against
      `https://github.com/11111000000/math-coding`). On
      network failure, the resolver falls back to
      `"v" ^ read_cli_version ()` so the call is at
      least deterministic; the installer will refuse
      a non-existent version. Without `--yes`, the
      function prints `replace the installed mathc
      binary? [y/N]` and exits 1 on any non-`y`
      response. With `--yes` (or after a `y`), it
      shells out to `install.sh --version=<resolved>`
      on POSIX or `install.ps1 -Version <resolved>` on
      Windows; the installer's exit code is mapped
      to ours (0→0, 1→1, 2→2, anything else→3).

  D2. `bin/Mathc.ml::do_version` (existing) gains a
     `--check` flag. With `--check`, the function calls
     `update_fetch_latest_tag`, compares the local
     `read_cli_version ()` to the upstream tag (with
     `update_strip_v` and `update_cmp_version`), and
     either:
       - exit 0 (no output) when the local matches the
         upstream,
       - exit 1 with the upstream tag string on
         stdout when the upstream is strictly newer,
       - exit 0 (silent) when the network probe fails
         (offline users are not told to upgrade).
     Without `--check`, `do_version` continues to
     print the `math-coding <ver>: bootstrap` banner
     unchanged.

  D3. `bin/Mathc.ml::print_usage` adds two lines: one
     for `version [--check]` and one for
     `update [--channel=...] [--yes]`.

  D4. `bin/Mathc.ml::dispatch` adds the arm
     `| "update" -> do_update ()`.

  D5. `bin/Mathc.ml` exposes a thin `Mathc_cmd.Update`
     namespace alias per spec/algebra-3.2.md §15 CLI
     catalog convention
     (`module Mathc_cmd = struct module Update = struct
     let run ~channel ~yes () = do_update () end end`).
     This is documentation glue; the runtime path is
     still the top-level dispatcher arm.

  D6. `tests/cli/update.t` exercises the four
     documented paths:
       (a) `mathc update --help` prints the documented
           flag set + exit codes block.
       (b) `mathc update` (no `--yes`, empty stdin)
           prints the prompt and exits 1.
       (c) `mathc version --check` exits 0 on a tree
           whose VERSION matches the upstream latest
           tag.
       (d) `mathc update --channel=bogus --yes` exits
           2 with the unknown-channel error.

  Boundaries (A3 self-application):
  - `lib/decision.ml`, `lib/packages.ml`, `lib/memory.ml`,
    `lib/gate.ml`, `lib/policy.ml`, `lib/risk.ml`,
    `lib/canonical.ml`, `lib/attestations/**`,
    `lib/git/**`, `lib/junit/**`, `lib/init/**`,
    `lib/import_adr/**`, `lib/find/**`, `lib/check/**`
    are unchanged.
  - `spec/`, `schemas/`, `axioms/` are unchanged.
  - `bin/mathc_mcp.exe` is unchanged.
  - `VERSION` is NOT bumped.
  - The `--check` flow does NOT use
    `lib/update_check/`; the env-flagged opt-in
    introduced by `update-check-notify-2026-10` is a
    separate surface, kept untouched.


outcomes:
  - id: update-subcommand-ships
    statement: |
      `mathc update [--channel=stable|edge|<ver>] [--yes]`
      exits 0 on a successful install, 1 on user-declined,
      2 on unknown --channel, 3 on network/IO error.
  - id: version-check-ships
    statement: |
      `mathc version --check` exits 0 when the locally
      installed version matches the latest stable upstream
      tag and 1 (printing the newer tag) when an upgrade
      is available. Network errors degrade to exit 0.

obligations:
  - id: update-subcommand-impl
    outcome: update-subcommand-ships
    claim: |
      `tests/cli/update.t` exercises the documented
      `mathc update --help` flag set, the user-declined
      path (empty stdin → exit 1), the unknown-channel
      error path (exit 2), and the default version check
      (exit 0 on a tree whose VERSION matches the upstream
      latest tag). The fixture passes on a tree that ships
      the subcommand and would fail on a tree that does
      not.
    acceptance:
      all:
        - verifier: tests/cli/update.t
          result: pass
        - verifier: mathc validate decisions/mathc-update-subcommand-2026-10.yaml
          result: pass

  - id: version-check-impl
    outcome: version-check-ships
    claim: |
      `mathc version --check` exits 0 on a tree whose
      VERSION equals the latest upstream `vX.Y.Z` tag and
      does not regress the default `mathc version`
      banner. The default (no `--check`) continues to
      print the version banner unchanged.
    acceptance:
      all:
        - verifier: tests/cli/update.t
          result: pass
        - verifier: mathc validate decisions/mathc-update-subcommand-2026-10.yaml
          result: pass

reversal:
  - signal: update-not-needed
    condition: |
      The CLI self-update surface is superseded by a
      package-manager-driven flow (winget / scoop / brew
      / Nix) and is no longer the user-facing entry point.
      Resolution: delete `do_update` from `bin/Mathc.ml`,
      remove the dispatcher arm, remove the `update` line
      from `print_usage`, delete `tests/cli/update.t`;
      this decision is superseded by a follow-up that
      records the new surface.
    action: supersede-with-removal
  - signal: installer-cli-drift
    condition: |
      `scripts/install-tooling/install.sh` changes its
      CLI surface in a way that breaks
      `bin/Mathc.ml::update_installer_argv`. Resolution:
      patch the OCaml wrapper in the same release that
      changes install.sh; this is a coupled change, not
      a re-architecture.
    action: rework


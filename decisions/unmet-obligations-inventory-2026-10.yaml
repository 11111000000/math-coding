    state: assumed
    owner: human:maintainer
    statement: |
      The sweep log (sign-store-sweep.log, written by scripts/sign-store.sh
      with --keep-log) names every obligation the re-signing refused to
      sign, once each.
    consequence_if_false: |
      An unsigned obligation that the log does not name would be absent
      from the inventory, and the inventory would read as complete when it
      is not. The fixture checks the inventory against the LOG, so it
      fails as soon as the log names an obligation the inventory does not;
      it cannot detect an obligation the log itself omits.

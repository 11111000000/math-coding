counterexample: |
  "Just add a `--type=decision|waiver|all` flag to mathc validate."

  Counterargument: that is the natural shape of fix, but it
  still requires touching `bin/Mathc.ml` (kernel-protected)
  and shipping a regression fixture. The current branch cannot
  rebuild mathc to assert the fix; the dune-less session is the
  context (per `decisions/update-check-notify-2026-10.yaml` and
  `decisions/auto-update-per-user-skill-impl-pending.yaml` two
  other in-progress deferrals cite the same dune-unavailability
  constraint). Filing the deferral now and resolving it when
  dune is available is the honest path.

  "Until the fix lands, `mathc validate decisions/waivers/*` and
  `mathc validate decisions/obligations.yaml` will keep failing,
  which is what the prior tests test."

  Counterargument: no prior test asserted these failures. The
  negative fixtures assert that *invalid decisions* are rejected;
  none of them pass a waiver file or an obligations aggregator.
  The current behaviour is a silent UX regression, not an
  intentional invariant.


intent: |
  Defer fixing the UX regression in `mathc validate` where the
  command rejects non-decision YAML files in `decisions/`
  (`waivers/*.yaml`, the `obligations.yaml` aggregator) with
  `MC-DECISION-INVALID: missing required field: <intent|id>`
  instead of dispatching to a schema-appropriate parser or
  skipping them with an informative message.

  Concrete failures at HEAD `c56bd35`:

  - `mathc validate decisions/waivers/audit-0.0.21-fixes-self-check-verdict-is-pass-2026-10.yaml`
    -> reject (MC-DECISION-INVALID: missing required field: intent)
  - `mathc validate decisions/obligations.yaml`
    -> reject (MC-DECISION-INVALID: missing required field: id)

  The waivers and the obligations aggregator carry a different
  schema (math-coding/waiver-* and math-coding/obligations-*,
  respectively). The validate subcommand has no flag to limit
  input to decisions and no fast-path that detects the schema
  family from the input file's `schema:` field.

  The fix is non-trivial: it lives in `bin/Mathc.ml::do_validate`
  and (more substantively) in `lib/decision.ml` where the
  parser chooses between the decision, waiver, and aggregator
  schemas. Both are kernel-protected files per
  AGENTS.md §Self-application; the fix must ship with positive
  and negative conformance fixtures plus a decision under the
  active policy. Reproduction requires the OCaml toolchain
  (`dune build && ./_build/default/bin/mathc.exe validate ...`),
  unavailable in this branch's CI.

change_kind: implementation

axiom_link:
  - A0

commitment: |
  1. The deferral record exists in `decisions/` with
     `state: active`.
  2. The reversal-signal entry below is reachable from the

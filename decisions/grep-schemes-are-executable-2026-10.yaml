outcomes:
  - id: schemes-are-executable
    statement: |
      A promise the corpus can write down is a promise the kernel can
      run, in both directions: that the thing is there, and that it is
      not.
obligations:
  - id: the-schemes-are-executable
    outcome: schemes-are-executable
    claim: |
      The grep schemes run, and they can fail: the fixture pins the
      positive form, the negative form and the negative form over a
      tree, each on a case where the check must report a non-pass
      verdict.
    acceptance:
      all:
        - verifier: tests/fixtures/shell-grep-negative-control.sh
  - id: both-forms-search-a-tree
    outcome: schemes-are-executable
    claim: |
      Both forms accept a directory: the positive form finds the
      pattern somewhere under it, the negative form finds it nowhere
      under it.
    acceptance:
      all:
        - verifier: shell-grep site bootstrap-v3
  - id: the-read-only-commands-are-allowed
    outcome: schemes-are-executable
    claim: |
      `counters`, `stats` and `session-start` are on the read-only
      allowlist of the `mathc` scheme, so a corpus promise may be

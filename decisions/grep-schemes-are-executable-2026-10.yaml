intent: |
  The corpus had 114 promises that no program kept, and the reason was
  in the kernel rather than in the corpus: the two schemes a promise
  would naturally be written in were not executable. `shell-grep` sat
  in the canonical allowlist from the day the allowlist was written and
  `plan_verifier` did not know it, so every `shell-grep` verifier
  reported `skipped` and the obligation it belonged to had no verdict.
  The corpus answered a dead scheme with a `manual-...` declaration,
  and a declaration is a human's word about a check nobody could run.
commitment: |
  1. `shell-grep <path> <pattern>` is executable: the path must
     contain the pattern, as a fixed string. The path may be a file
     or a directory, and a directory is searched recursively.
  2. `shell-grep-absent <path> <pattern>` is executable and is its
     own scheme: the path must NOT contain the pattern. A promise
     about a tree ("nothing under decisions/ carries the old prefix")
     is a fact about a tree, and a check that can read one file
     cannot state it.
  3. A double-quoted argument keeps the spaces it was written with.
     Without that, a pattern naming a markdown table row could not be
     written down at all: the split collapsed every run of spaces and
     the check looked for a string the file does not contain.
  4. `repo_path` admits a directory where `repo_file` admits only a
     regular file, with the same containment rule. BOTH forms use it:
     a promise about a tree is checkable, and the scheme that says so
     must not be the one that refuses it. The positive form kept
     `repo_file` for one revision, so `shell-grep site bootstrap-v3`
     was refused before it ran.
  5. `counters`, `stats` and `session-start` join the read-only
     allowlist of the `mathc` scheme.
axiom_link:
  - A0
counterexample: |
  "A check that cannot fail is not a check, so the scheme is fine as
  long as it exists." The counterargument fails on the corpus's own
  numbers: 253 promises could not be set up, and every one of them was
  a promise the corpus could write down but the kernel could not run.
  A scheme that exists but is not executable is the same defect as a
  scheme that does not exist, with one extra layer of confusion: the
  corpus believes the promise is machine-checked.
scope:
  paths:
    - "bin/Mathc.ml"
    - "tests/fixtures/shell-grep-negative-control.sh"
  exclusions:

intent: |
  Phase 2 of the ux-3 workstream. Enforce NFR-3 (binary cold
  start < 200 ms on Linux) with a CI-runnable fixture. The
  NFR was originally stated in the ux-3 ТЗ but was not
  measured or enforced. This decision adds the measurement
  and the assertion.

  NFR-3 measures binary *startup* overhead (process spawn,
  OCaml runtime init, library loading), not the work the
  command performs. The canonical probe is `mathc version`
  — a one-line print of the version string, no I/O, no
  decision load. The fixture times `mathc version` 3 times
  and asserts the minimum (the first invocation is the cold
  cache; subsequent ones hit the FS cache) is under 200 ms.

  The fixture also records wall-time for `mathc self-check`
  and `mathc init` for visibility, but does NOT assert on
  them. `mathc self-check` does heavy kernel work (loads
  every decision, walks the attestation store, computes
  the verdict) whose duration is dominated by the work, not
  by the binary's startup. Asserting on it would conflate
  the two concerns and the NFR would routinely fail in CI.

  Touches (per A3 self-application):
    tests/cli/nfr-3-cold-start.t  (new cram fixture, 3 cases)
    decisions/ux-3-nfr3-cold-start-2026-10.yaml   (this file)

  No kernel surface change. No new sub-library. Test-only
  addition.

axiom_link:
  - A0

antithesis: |
  The counter-position considered and rejected: "NFR-3 is a
  non-binding performance goal, not a correctness property;
  adding a CI gate that can fail on a noisy CI runner is
  worse than the NFR itself." The author engaged with this
  position and rejected it on three grounds: (a) the user
  asked for quality, and quality includes measurable
  contracts; a fixture that times the binary and asserts
  the threshold is the minimum-viable enforcement; (b) the
  assertion is on the *minimum* of 3 runs, which is robust
  to single-run noise — only sustained regressions (a
  doubling of cold-start time) will trip the gate; (c) the
  200 ms threshold is generous for the current binary
  (~5 ms for `mathc version`), so the gate is well below
  the noise floor on a clean runner. The minimum fix is one
  cram fixture with one assertion, which is what this file
  records.

commitment: |
  One test-only addition. Two deliverables:

    D1. `tests/cli/nfr-3-cold-start.t` times `mathc version`
        3 times, takes the minimum, and asserts the minimum
        is < 200 ms. The assertion is on binary startup
        only, not on command work.

    D2. The fixture also records wall-time for
        `mathc self-check` and `mathc init` for visibility
        but does NOT assert on them. This is documentation
        in the test itself.

  Boundaries (A3 self-application):
    - `lib/` and `bin/` are unchanged.
    - `tests/cli/nfr-3-cold-start.t` is the only test added.
    - No new sub-library; no schema change; no axiom
      amendment.

counterexample: |
  "Asserting on the minimum of 3 runs is statistically
   wrong; the mean is the right metric." The counterargument
   fails because the goal is to catch a regression, not
   characterize the runtime distribution. The minimum
   represents the best case under no contention; a
   regression that doubles the cold start is reliably
   detected by the minimum, while the mean would be
   confounded by run-to-run variance. "The 200 ms
   threshold is too tight for slow CI runners." This fails
   because the binary's current cold start is ~5 ms, so the
   threshold is 40x the current value; a slow CI runner
   that takes 150 ms is still under the threshold.

scope:
  capabilities:
    - nfr-3-cold-start-fixture
  paths:

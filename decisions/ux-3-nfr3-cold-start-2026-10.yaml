outcomes:
  - id: nfr3-enforced
    statement: |
      `mathc version` cold start is asserted to be < 200 ms
      by `tests/cli/nfr-3-cold-start.t`. The assertion is
      on the minimum of 3 timed invocations.
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-nfr3-cold-start-2026-10.yaml` exits 0.

assumptions:
  - id: linux-only
    state: assumed
    statement: |
      The NFR's 200 ms threshold is for Linux. The fixture
      does not assert on macOS or Windows; the NFR-3 §30
      spec gives separate thresholds (200 ms Linux, 500 ms
      Windows). The CI runs on Linux per the existing
      `ci.yml` workflow.
    owner: human:maintainer
    consequence_if_false: |
      If CI moves to macOS, the fixture will still run but
      the threshold may need adjustment (macOS cold start
      is typically slower). Resolution: parametrize the
      threshold by OS.
    review_on:
      - signal: ci-runs-on-macos
  - id: no-parallel-load
    state: assumed
    statement: |
      The CI runner has the binary's cold start dominated
      by the binary's own work, not by other processes on
      the runner. The fixture takes the minimum of 3 runs
      to mitigate contention; a sustained regression (not
      a one-off slow run) trips the gate.
    owner: human:maintainer
    consequence_if_false: |
      A noisy CI runner with high contention could trip
      the gate on runs that are slow for reasons unrelated
      to the binary. Resolution: take the minimum of more
      runs (e.g. 5) or skip the gate in noisy environments.
    review_on:
      - signal: ci-flake-rate-high

obligations:
  - id: cram-test-passes
    outcome: nfr3-enforced
    claim: |
      `tests/cli/nfr-3-cold-start.t` times `mathc version`,
      takes the minimum of 3 runs, and asserts the
      minimum is < 200 ms.
    acceptance:
      all:
        - verifier: tests/cli/nfr-3-cold-start.t
          result: pass

  - id: this-decision-validates
    outcome: this-decision-validates
    claim: |
      `mathc validate
      decisions/ux-3-nfr3-cold-start-2026-10.yaml` exits 0.
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-nfr3-cold-start-2026-10.yaml
          result: pass

reversal:
  - signal: nfr3-budget-loosened
    condition: |
      The 200 ms threshold is too tight for some CI
      environment (e.g. macOS, slow x86) and trips the
      gate. Resolution: parametrize the threshold by OS
      or environment variable; the assertion is the
      minimum-of-3-runs robustness, not the absolute
      threshold.
    action: rework

risk:
  declared_triggers:
    - ci-flake-rate-high
    - ci-runs-on-macos
  owner: human:maintainer


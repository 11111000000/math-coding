id: ci-gate-exit-honesty-2026-10
revision: 1
state: active
negative_control: tests/fixtures/shell-grep-negative-control.sh
body_sha: "sha256:c07e825720faa9151637c8c0d7568d3f550d8473809970f4aad033986ea4625e"

counterexample: |
  "Removing Mermaid loses the ability to write a quick diagram
  in a fenced block without hand-authoring an SVG; the author
  is now forced to hand-roll every diagram."

  Counterargument: the hand-rolled SVGs are the point. Mermaid's
  default palette and typography do not respect the Tufte
  style, and the kernel's own self-application axiom (A3) is
  best shown by a site whose diagrams are as auditable as its
  prose. A quick diagram is still cheap to write as SVG now
  that `assets/` already holds the shared palette and layout
  conventions; the marginal cost is one file per figure, which
  the accessibility tags (`role="img"` + `aria-labelledby`)
  justify.

antithesis: |
  The strongest counter-position: "keep Mermaid and style it
  with CSS overrides instead of replacing it."

  That position is rejected because (a) Mermaid's SVG is
  generated client-side from its own source grammar, so the
  kernel cannot validate the output without a browser; (b)
  overriding Mermaid's internals (`.mermaid .nodeLabel`,
  `.mermaid .edgeLabel`, `.mermaid .actor`) is exactly the
  fragile, undocumented surface that already produced the
  "Syntax error in text" regressions recorded in
  `mathjax-delimiter-te-and-skip-mermaid-2026-10`; (c) a
  hand-rolled SVG is a static, diff-able artifact that the
  kernel's own renderer emits unchanged — the diagram becomes
  data the methodology can inspect, not a runtime side effect.

assumptions:
  - id: site-base-stays-subpath
    state: assumed
    statement: |
      The site's `<base href>` remains a subpath
      (`/math-coding/`). The relative `assets/foo.svg` URLs in
      the inline figures resolve through the base href.
    owner: human:maintainer
    consequence_if_false: |
      If a future cycle sets `site_base = "/"`, the
      `assets/foo.svg` references resolve to `/foo.svg` (404).
    review_on:
      - signal: deployment-target-moves-to-host-root

risk:
  impact: low
  probability: low
  irreversibility: low
  mode_floor: tiny
  rationale: |
    The change removes a third-party dependency (Mermaid CDN),
    which is strictly a reduction in runtime surface. The SVG
    figures are additive artifacts; the renderer change is a
    deletion plus a small inline-figure branch. Reversal is one
    revert commit.


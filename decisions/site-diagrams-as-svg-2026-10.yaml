axiom_link:
  - A3
intent: |
  Mermaid-rendered diagrams on the site look off-palette and
  break the Tufte rhythm, and several diagram-bearing pages
  (methodology, foundations) trail their figures in a lump at the
  end instead of placing each figure next to the paragraph
  it illustrates. This decision removed Mermaid from the render
  pipeline entirely and replaced every diagram with a
  hand-rolled, accessibility-tagged SVG in the unified Tufte
  palette (oxblood / cream). Each figure is embedded inline via
  the `![alt](assets/foo.svg)` markdown form, positioned at the
  paragraph it illustrates, and surrounded by explanatory prose
  so a reader who skims the figures still follows the argument.

  This supersedes the body_extra + mermaid approach of
  `site-svg-methodology-2026-10`,
  `site-svg-foundations-2026-10`, `site-svg-manifesto-2026-10`,
  and `site-svg-workflow-2026-10`, whose per-page
  `.mathc-figure-<page>` wrappers are replaced by the shared
  `.mathc-figure-inline` wrapper and whose mermaid FSM is
  retired.

  WHY THE RISK WAS LOW (the rev-1 risk note, kept because it is the
  reasoning and not a number): the change removes a third-party
  dependency (the Mermaid CDN), which is strictly a reduction in
  runtime surface. The SVG figures are additive artifacts; the
  renderer change was a deletion plus a small inline-figure branch.
  Reversal was one revert commit.

  2026-10-31, REVISION 2: THE BEHAVIOUR IS UNCHANGED, ITS ANCHORS ARE
  NOT. (1) The renderer that carries the promise moved: the Mermaid
  removal and the inline-figure branch live in `lib/render/render.ml`
  and, for the figure markup itself, in `lib/render/render_md.ml`;
  `lib/render.ml` no longer exists as a file. (2) The RISK MAP WAS THE
  ONLY ONE IN THE CORPUS THAT DID NOT CARRY AN OWNER AND A SET OF
  DECLARED TRIGGERS. The schema requires both, 138 of the 140 live
  decisions carry `declared_triggers` and 136 carry `owner`, and this
  one carried neither; the risk now carries both, and the reasoning
  that used to live in the risk map moved up into this intent where
  it can still be read.

  Measured on 2026-10-31: `grep -rn mermaid lib/ bin/ assets/style.css`
  returns nothing; the eight diagram pages each carry at least one
  `<figure class="mathc-figure mathc-figure-inline">`; and no rendered
  page carries a `class="mermaid"` element.

commitment: |
  `mathc render` no longer emits Mermaid markup and no longer
  loads the Mermaid CDN. The render kernel (`lib/render/render.ml`,
  `lib/render/render_md.ml`), `bin/Mathc.ml`, and `assets/style.css`
  carry no Mermaid support, and the eight diagram pages (methodology,
  foundations, manifesto, workflow, bootstrap-gate, axioms/separation,
  axioms/feedback, axioms/self-application) render every diagram as
  `<figure class="mathc-figure mathc-figure-inline">` wrapping
  an `<img>` to a present `assets/*.svg`.

  The CLI carries no Mermaid switch: `mathc render --help` lists only
  `--out`, `--lang`, `--site-base`, `--mathjax` and `--no-mathjax`.
  That is the shape of the promise today; there is no flag to remove.


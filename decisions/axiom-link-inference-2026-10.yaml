          result: pass
  - id: soft-warn-suggest-only
    claim: |
      The soft-warn is suggest-only: `axiom_link` is
      NEVER auto-filled by `mathc new-decision`. The
      author retains full control over the final axiom
      choice. The Minimal template's hardcoded
      `axiom_link: [A0]` is the only auto-fill, and
      it was already shipping before this decision.
    acceptance:
      all:
        - verifier: tests/cli/new-decision-axiom-warn.t

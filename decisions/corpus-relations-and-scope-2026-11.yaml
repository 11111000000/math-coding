risk:
  owner: human:maintainer
  declared_triggers:
    - "a relation target is added that names a decision the corpus does not hold, and the class grows again"
    - "the corpus-count ceiling of the redundancy census is raised to accommodate a decision that measures the corpus, without the marker the ratchet reads"
    - "a scope path is pruned without a line saying why, and a reader cannot tell a moved file from a forgotten promise"
    - "one of the two instruments changes its resolution rule and the corpus is judged by the rule that is stricter"
  the-corpus-count-ceiling-must-rise-with-this-decision: |
    Expected, and the same thing happened at
    decisions/corpus-growth-lints-2026-11.yaml, which raised the
    ceiling from 144 to 145 because its own decision was in the
    corpus it counts. The raise is an explicit edit of the fixture
    with the marker scripts/ceiling-monotonic.sh reads, and it lands
    with this decision rather than after it.
  a-removed-relation-without-a-line: |
    The rule that a removed relation leaves a line is prose, and
    nothing checks it. The instruments count targets, not
    explanations. The exposure is bounded by the size of the repair -
    35 decisions - and by the fact that each of them says in its own
    text what happened to the promise.

assumptions:
  - id: the-corpus-is-keyed-by-id
    state: assumed
    owner: human:maintainer
    statement: |
      A decision is named by the id it declares, not by the name of
      the file it lives in. The kernel reads the top-level id
      (lib/memory.ml::decision_document_id) and both instruments
      resolve against it, so a relation that names a file's stem
      names nothing.
    consequence_if_false: |
      If the corpus were keyed by file name, the 19 files whose id
      differs from their stem would have been resolvable all along,
      and this tranche would have deleted eight relations that
      pointed at things that exist. The two instruments would then
      be the wrong authority, and the corpus-growth-lints decision
      that introduced them would have to be re-read.
    review_on:
      - signal: the-kernel-resolves-a-relation-by-file-name
  - id: a-removed-relation-must-leave-a-word
    state: assumed
    owner: human:maintainer
    statement: |
      A relation removed without a line in the decision is a promise
      that stopped existing silently, so the line is part of the
      repair and not a courtesy. This is the one rule in this
      decision that no program enforces.
    consequence_if_false: |
      The corpus fills up with decisions whose relation blocks are
      shorter than they were, with nothing to say why. The reader
      who needs the trail - the one asking which decision promised
      the thing that is not there - finds silence, and the corpus
      returns to the state this tranche measured, with a smaller
      number of links and no more truth.
    review_on:
      - signal: a-removed-relation-is-noticed-with-no-line-beside-it
  - id: the-instruments-are-the-authority-on-what-resolves
    state: assumed
    owner: human:maintainer
    statement: |
      The rule for what a relation target resolves to lives in the two
      fixtures, and it is read rather than copied: the relation kinds
      out of schemas/decision.json, the rule for what a decision is
      out of lib/memory.ml. The corpus satisfies both readings, so
      the five entries where the two rules disagree cost nothing.
    consequence_if_false: |
      A corpus that satisfies one rule can still break under the
      other, and the reader has to know which rule the number came
      from before the number means anything. The fix is a change to
      the fixtures, which are the orchestrator's, and not to the
      corpus.
    review_on:
      - signal: a-fixture-changes-its-resolution-rule


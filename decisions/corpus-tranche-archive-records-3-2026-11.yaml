counterexample: |
  The strongest objection to this tranche is not that a record is not
  a rule. It is that a corpus which archives its own finished work
  stops being able to answer a question a reader will ask: "what does
  this repository promise?" Every reader now has to know which of the
  one hundred and thirty files are rules and which are receipts, and
  the corpus that was supposed to make that distinction obvious has
  made it a classification problem again.

  The answer is the one this decision takes, and it is the same answer
  the previous tranche took: the corpus is the SET OF RULES, and the
  archive is where the receipts live with their ids intact. A rule
  that is not a rule costs more than it earns - the gate re-reads it,
  the census classifies it, the promise-debt instrument counts it,
  and every one of those numbers moves for a file that was finished
  when it was written. A record in the archive costs one indirection:
  the id still resolves, the file is still there, and the reader who
  needs it can find it.

  A second objection is arithmetic: the corpus count fell by six, not
  seven, because this decision entered it. True, and the corpus count
  is the wrong number to look at: the ARCHIVE count is what records
  the moves, and it grew by seven. The census measures the first and
  reports the second in the same run, so both are visible at once.

  A third objection is the one this tranche ran into and did not wish
  away: two pointers in `lib/**` and twelve in four archived records
  now name a path that no longer exists, and this tranche could not
  pay for them because `lib/**` and other decisions were out of
  scope. The honest form of the answer is the one this decision
  takes: the dependency criterion decides what may move; the
  navigation cost is paid where it is real and declared where it
  cannot be paid.

  A fourth objection is about `kernel-fixes-found-bugs-2026-10`: the
  inventory listed it, so why did it stay? Because the inventory's own
  action says "Архивировать после A3-смены normative pointer в
  spec/semantics.md:197", and the pointer is still there - this tranche
  measured it at `spec/semantics.md:197` rather than trusting a
  summary of a summary. An id on a work list is a candidate, and the
  candidate that is blocked by the wall stays where it is until the
  wall moves.

antithesis: |
  The opposite position is that every path mention is a dependency,
  every historical record must therefore stay live until all the
  prose around it is rewritten, and the archive should be reserved for
  files that no sentence in the repository mentions at all.

  That position keeps the corpus navigable and costs the corpus its
  ability to answer a question: "what does this repository promise?"
  A corpus that carries its own completed work as live rules makes
  every reader do the classification work the inventory already did,
  and makes the gate keep re-reading work that is finished.

  The position this tranche rejects is not the desire for navigable
  references. It is the inference that navigability can only be bought
  by keeping files active. The archive plus the ID resolver buys it
  more cheaply: the record leaves the rule set, stays addressable by
  id, and every pointer that was a live dependency was moved with it.


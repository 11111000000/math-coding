    acceptance:
      all:
        - verifier: dune test tests/corpus_no_silent_drops/corpus_no_silent_drops.exe
        - verifier: dune test tests/yaml_seq_continuation.exe
        - verifier: tests/fixtures/redundancy-census.sh

  - id: the-corpus-census-holds
    outcome: the-corpus-is-measured-afterwards
    statement: |
      The redundancy census measures the shrunk corpus with no paper,
      broken, dangling or dead-path debt above its ceilings.
    acceptance:
      all:
        - verifier: tests/fixtures/redundancy-census.sh

  - id: the-promise-debt-classes-are-measured
    outcome: the-corpus-is-measured-afterwards
    statement: |
      The promise-debt instrument measures CHECKED 84, DECLARED 17,
      UNCHECKED 27 and NO-PROMISE 0 over 128 decisions, and the sum
      invariant holds.
    acceptance:
      all:
        - verifier: tests/fixtures/negative-control-debt.sh

  - id: the-ceilings-are-monotone
    outcome: the-corpus-is-measured-afterwards
    statement: |
      The monotonic checker sees only falls and no growth; every other
      ceiling holds or falls.
    acceptance:
      all:
        - verifier: scripts/ceiling-monotonic.sh

  - id: the-full-suite-passes
    outcome: pointers-follow-the-files
    statement: |
      The full dune runtest suite exits 0 for the suites this tranche
      touches; the exit code is the signal, not a grep for the word
      FAIL.
    acceptance:
      all:
        - verifier: dune build @runtest

  - id: this-decision-validates
    outcome: seven-records-are-archived
    statement: |
      This tranche decision validates under the current schema.
    acceptance:
      all:
        - verifier: mathc validate decisions/corpus-tranche-archive-records-3-2026-11.yaml

risk:
  owner: human:maintainer
  declared_triggers:
    - a-live-machine-dependency-is-misclassified-as-an-id-mention
    - a-pointer-to-a-moved-record-is-left-naming-a-dead-path
    - normative-text-is-edited-without-an-a3-transition
    - the-corpus-ceiling-is-raised-instead-of-lowered
    - the-archive-is-walked-by-the-gate

assumptions:
  - id: ids-resolve-across-live-and-archive
    state: assumed
    owner: human:maintainer
    statement: |
      The corpus's relation-target and census instruments resolve
      decision IDs across both the live tree and archive/decisions, so
      an ID-only relation stays resolvable after a record moves.
    consequence_if_false: |
      If the instruments stopped reading the archive, the ID-form
      relations that point at the seven moved records would become
      dangling and this criterion would have to be re-evaluated record
      by record.
    review_on:
      - signal: the-relation-lint-stops-reading-the-archive

  - id: the-archive-is-not-walked-by-the-gate
    state: assumed
    owner: human:maintainer
    statement: |
      The live gate walks decisions/ and excludes retired and
      superseded states, so a retired record in archive/decisions/
      contributes no open obligation. MEASURED: the kernel never
      names the archive directory outside a comment (lib/memory.ml::
      decision_document_paths is called with the live decisions
      directory).
    consequence_if_false: |
      If the gate began walking the archive, moving a record could
      hide an obligation instead of closing it, and the tranche would
      need a different retirement protocol.
    review_on:
      - signal: the-gate-walks-the-archive

  - id: a-bumped-revision-is-a-new-version-not-a-new-claim
    state: assumed
    owner: human:maintainer
    statement: |
      The revision field is the document's version coordinate, and a
      moved record's bytes changed (state, comment line, digests), so
      its revision is bumped by one. The bodies stay as they were: a
      record's own sentences about its earlier revisions remain
      statements about the edit that made them, not about the current
      header.
    consequence_if_false: |
      If a revision is read as the number of the CLAIM rather than of
      the document, a bumped header would look like a promise that was
      made again, and a reader could take a record for a live rule.
    review_on:
      - signal: a-revision-is-read-as-a-claim-number

  - id: the-find-fixtures-still-test-the-mechanism
    state: assumed
    owner: human:maintainer
    statement: |
      The claim of the two find fixtures is about the MECHANISM of
      `mathc find` - a keyword search matches, a no-match search
      returns nothing, an obligation lookup returns the enclosing
      decision and the canonical attestation path, a missing keyword
      is an input error - and not about which record it names. The
      retarget moved the instance from a record to a live decision
      (`mathc-packages-subcommand`) and left every claim where it was.
    consequence_if_false: |
      If the fixtures were only ever about the MCP integration
      decision, the retarget would have narrowed a test, and the
      retarget would have to be undone together with the move.
    review_on:
      - signal: a-find-fixture-is-read-as-a-claim-about-one-record

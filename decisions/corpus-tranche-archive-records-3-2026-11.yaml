  text: |
    THE RULE THIS TRANCHE APPLIED. A mention is not a dependency. A
    file may leave the live corpus when NOTHING DEPENDS on it: no
    machine opens it, no live test reads it by path, no verifier runs
    it, no live scope path or index row points at it as the thing to
    look at, and no live relation resolves to it as a live target. A
    comment, a changelog entry, a ROADMAP line, an id cited in prose,
    or a fixture that only names the id in a diagnostic string is a
    MENTION, and a mention does not keep a record alive.

    The reference for the shape of the move is the tranche before this
    one (`decisions/corpus-tranche-archive-records-2-2026-11.yaml`):
    the shape of a moved file is the archive's own shape - `state:
    retired`, one comment line saying why and by which tranche, the
    revision bumped by one because the bytes changed, and both
    digests recomputed with the placeholder-substitution algorithm
    (`mathc rehash --write`), so the file answers `parse-ok` from its
    archived path.

    THE SEVEN THAT MOVED, AND THE CHECK RUN FOR EACH. The inventory
    named the list; every item on it was re-checked against this tree
    before it moved, because an inventory observation is a hypothesis
    to re-run, not a fact to copy. The check was the same each time:
    `git grep -n -F <id>` over the tracked tree, then the question
    that the grep cannot answer - does anything OPEN the file, or
    require its live path?


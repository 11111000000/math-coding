       opens the file.
       MEASURED, NOT ASSUMED: `mathc find mcp --format=json` returned
       exactly ONE decision - this one. It is the only live decision
       whose id, obligation id or obligation verifier contains the
       string "mcp". A move would have emptied that search and turned

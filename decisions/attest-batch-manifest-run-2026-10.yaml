    claim: |
      `mathc attest-batch --manifest=FILE --run=CMD` writes a
      non-empty subject.materials_digest computed from CMD's
      captured output, and the same value the
      `--from=decisions` branch writes for the same CMD.
    acceptance:
      all:
        - verifier: tests/fixtures/attest-batch-run-digest.sh
          result: pass

  - id: fixture-detects-a-dropping-branch
    claim: |
      The fixture exits non-zero when pointed at a binary
      whose manifest branch drops the digest, and its negative
      control confirms the comparison detects exactly that
      difference.
    acceptance:
      all:
        - verifier: manual-attest-batch-branch-parity
          result: pass

risk:
  owner: human:maintainer
  declared_triggers:
    - "an operator relies on a manifest row's result without expecting the --run command to be executed"

assumptions:
  - id: run-once-semantics-for-manifest
    state: assumed
    owner: human:maintainer
    statement: |
      One --run command backs the whole manifest batch, the
      same way it backs a --from=decisions batch. The existing
      mass-issue report already announces "N attestations from
      ONE run", so the semantics are declared, not silent.
    consequence_if_false: |
      If per-row runs were wanted, the manifest format would
      need a per-row command column. The current format has
      none, so there is no alternative reading available to an
      operator today.


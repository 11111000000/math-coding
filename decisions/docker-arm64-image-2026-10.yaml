      `ghcr.io/11111000000/mathc:$VERSION` is a multi-arch
      Docker manifest list containing at least the
      `linux/amd64` and `linux/arm64` images, both built
      from the same `Dockerfile.debian-slim` with the
      same `VERSION` build-arg. A `docker run` on an
      amd64 host picks the amd64 image; a `docker run` on
      an arm64 host picks the arm64 image. The
      `cosign-sign` job of `.github/workflows/docker.yml`
      signs the manifest; `cosign verify` succeeds
      against the OIDC identity
      `https://github.com/11111000000/math-coding` and
      the issuer
      `https://token.actions.githubusercontent.com`.


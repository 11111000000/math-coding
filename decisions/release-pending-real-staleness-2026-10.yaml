intent: |
  Give the release-pending gate a question it can answer, and
  therefore a case where it passes.

  release-cadence-2026-11@1 shipped the gate as a first-pass
  placeholder: block any protected-path PR whenever
  `git tag --merged` on the base ref returned anything at all.
  Once the project cut its first release that condition became
  permanently true — every base ref has a tag merged into it
  forever — so the gate blocked every protected-path PR and never
  once turned green. A gate that cannot pass cannot be told apart
  from a gate that is broken, and neither of them is a check.
  Three `fail-open` holes in the same file were closed in
  `fix/release-pending-yaml-invalid-2026-10`; what was left was a
  fail-closed gate with nothing to be fail-closed about.

  THE QUESTION THE EXISTING DECISION ASKS IS VACUOUS
  -------------------------------------------------
  release-cadence-2026-11@1 states its outcome as "fails when no
  release-workflow re-run is recorded after that tag". Read
  literally, that condition is satisfied by essentially every
  merge: `.github/workflows/release.yml` triggers on
  `push: branches: [main]` (lines 3-7), so a re-run after the tag
  is what a merge to main *already is*. A gate that asks this
  question — with or without an API — would report green in the
  exact situation F15 describes: main moved past the tag, the
  shipped binary does not, and the only record of the release
  workflow is the push that created the staleness. That is a new
  fail-open wearing the costume of a fix, and it is worse than the
  placeholder because it looks like verification.

  GIT CARRIES NO WITNESS OF A RELEASE-WORKFLOW RUN
  -------------------------------------------------
  The gate was meant to consult `actions/runs`, and the rolling
  publish looked like the obvious witness: release.yml's non-tag
  path publishes with `tag_name: edge`
  (`.github/workflows/release.yml` lines 483-489). The git ref
  `edge` does not track main. At `main` = e974364 it points at
  9f7599e, dated 2026-09-26, and sits 900 commits behind —
  `softprops/action-gh-release` replaces the assets on an existing
  release and leaves the tag where it was. So the only git-visible
  record of a release is a `v*.*.*` tag, which is exactly what
  `install.sh`'s `MC_VERSION_DEFAULT` names and what a user
  actually downloads.

  It follows that the placeholder's own remediation instruction
  could not have worked either. "Re-run release.yml on main"
  republishes `edge`, a prerelease nothing installs by default, so
  it moves no versioned artifact and would have left the gate
  red. The instruction and the gate disagreed, and the gate was
  the thing reviewers had to satisfy.

  THE QUESTION THIS DECISION ASKS
  -------------------------------
  Is the base tip a commit that has been released as vX.Y.Z?

  If yes, the published artifact was built from exactly this
  tree, a protected-path change on top of it is an ordinary
  next-cycle change, and the PR passes. If no, the artifact
  provably predates the base tree — F15's shape, present now,
  before the merge makes it wider — and the PR blocks until a
  versioned tag is cut on the base tip.

  This is a question git can answer with no network, no token and
  no contract to guess at, and its passing case is reached by
  ordinary releases rather than by an exemption.

  Also closed here: obligation `c4-release-cadence-2026-11`
  carries a `shell-grep` criterion for the literal `bin/Mathc.ml`,
  but no committed revision of `release-pending.yml` has ever
  contained that string (45ba4c2b and ec05168 both match only
  `bin/*`), while
  `attestations/release-cadence-2026-11-c4-release-cadence-2026-11.json`
  records `pass`. That attestation was taken against
  `.github/workflows/release-pending.yml` under a worktree that
  no longer exists, so its criterion cannot be re-checked where it
  was written. The literal is now present, beside the wider
  `bin/*` glob that actually protects the build.

commitment: |
  The cycle closes when: (a) `scripts/release-pending-gate-sim.sh`
  exits 0, with its fifteen rows and both of its controls holding;
  (b) `.github/workflows/release-pending.yml` parses under
  `yq -e '.'` and carries no shell heredoc inside a `run:` block,
  per `tests/repo_structure.ml::workflow-yaml-well-formed`;
  (c) every uncertainty the gate meets — empty base ref,
  unresolvable base, unreadable diff, unreadable tag list,
  uncountable tag distance, diverged base — blocks rather than
  passes; (d) `mathc self-check` reports no NEW unknown subject
  against the plan-branch baseline.

outcomes:
  - id: gate-has-a-passing-case
    statement: |
      The gate passes a protected-path PR whose base tip carries a
      `v*.*.*` tag, and blocks one whose base tip does not. The
      distinction is the commit count between the base tip and the
      most advanced version tag reachable from it, reported as
      `commits_ahead`.
  - id: most-advanced-not-newest-by-date
    statement: |
      The gate selects the version tag the base tip is CLOSEST to,
      not the one with the newest tag date. A release cut on an
      older branch can carry the newest date while being further
      from the base tip; reading it as the relevant tag would
      under-report the gap.
  - id: every-uncertainty-blocks
    statement: |
      Six distinct ways of not knowing the answer all exit
      non-zero: empty `GITHUB_BASE_REF`, an unresolvable base ref,
      an unreadable diff, an unreadable tag list, an uncountable
      tag distance, and a base ref that shares no release
      ancestor with a repository that has shipped. Only a
      repository that has never cut a `v*.*.*` tag passes without
      evidence, and that is sound because no artifact exists there
      to be stale.
  - id: sim-carries-its-own-sharpness
    statement: |
      `scripts/release-pending-gate-sim.sh` reads the three step
      bodies out of the workflow and replays them under
      `bash --noprofile --norc -e -o pipefail` against synthetic
      git repositories. A MUTATION control forces the single
      "this base is released" condition true and requires the
      harness to notice; a PRE-FIX control replays the ec05168
      placeholder body and requires it to block a released base.
  - id: obligation-needle-restored
    statement: |
      The workflow carries the literal `bin/Mathc.ml` that
      obligation `c4-release-cadence-2026-11` greps for, next to
      the `bin/*` glob that covers the rest of the dune package
      (`bin/mathc_mcp.ml`, `bin/md_probe.ml`).


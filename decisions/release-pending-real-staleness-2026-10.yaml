assumptions:
  - id: rp-release-run-success-not-in-git
    state: unknown
    statement: |
      The gate proves a `v*.*.*` tag exists at the base tip. It
      does NOT prove that the release workflow SUCCEEDED for that
      tag. A tag pushed while release.yml was broken would satisfy
      the gate while no artifact was ever published. Closing this
      needs the Actions API — `actions: read` plus a query against
      the release workflow's runs filtered by the tagged SHA —
      which is a live network dependency in a gate that currently
      needs none. NOT closed here on purpose: the previous
      attempt to close it failed in a worse direction, because the
      question it asked was already satisfied by every push to
      main. OWNER INQUIRY, for `human:maintainer`: is a network
      round-trip and the `actions: read` grant acceptable in this
      gate, given that it must fail closed on rate limiting and
      on an Actions API change? A tag-push check that waits for a
      SUCCESSFUL release run, rather than for the tag, would
      answer the question the artifact's existence actually
      raises.
    owner: human:maintainer
  - id: rp-tag-glob-tracks-release-workflow
    state: assumed
    statement: |
      The `v*.*.*` glob is the gate's model of "a version was
      released". It mirrors `on.push.tags` in release.yml, so the
      two cannot drift silently — but a future release path that
      publishes a version WITHOUT a matching tag would fall
      outside the gate's view. OWNER INQUIRY, for
      `human:maintainer`: is a versioned tag the intended and
      permanent marker of "shipped"?
    owner: human:maintainer

counterexample: |
  Strongest objection: this gate is too coarse, and the coarse
  version of "too strict" is the same failure the placeholder
  already had. At `main` = e974364 the most advanced version tag
  reachable from the branch tip is v3.3.3, and the tip sits 134
  commits past it, so the gate blocks every protected-path PR
  against main and will keep blocking until someone cuts a tag —
  which makes it a red gate with a longer fuse, not a better one,
  and reviewers will learn to dismiss it the way they learned to
  dismiss the placeholder.

  Two answers, and neither is that the objection is wrong.

  First, the two gates differ in kind, not degree. The
  placeholder's answer is constant: a tag exists. It said nothing
  about how far behind main was, it could not say, and it had no
  state in which it would pass. This one names the tag, names the
  base commit, and prints the gap — 134 commits ahead of v3.3.3 —
  so the block carries the information the reviewer needs and the
  remedy is a single command. A gate that reports a specific,
  shrinking number can be planned around; a gate that is
  permanently red teaches people to click through it.

  Second, the narrow alternative was considered and rejected for a
  concrete reason. The obvious refinement is to compare only the
  build-relevant paths and let a base that has diverged from the
  tag in `decisions/**` or `docs/**` pass. That requires knowing
  the complete set of build inputs, because anything omitted from
  the list becomes an invisible fail-open: the base moves, the
  gate sees no protected path, the binary ships stale. Deriving
  that set from what dune and opam actually read is not tractable
  here, and a hand-maintained list is a list that will silently
  fall behind the build. `bin/` itself is the cautionary case —
  the obligation named `bin/Mathc.ml` while the package also
  contains `mathc_mcp.ml` and `md_probe.ml`.

  So the gate is deliberately coarse: one bit of evidence, a tag
  at the base tip, and no list of paths to keep honest. The cost
  is stated in `outcomes.gate-has-a-passing-case` and in the
  blocking message itself, which tells the reviewer to cut a tag.

antithesis: |
  The counter-position engaged and rejected: "keep the decision's
  own question and answer it properly — query the GitHub API for
  `actions/runs` filtered by the release workflow and the tagged
  SHA, exactly as the decision's counterexample contemplated, and
  add `actions: read`."

  It was rejected for a reason that has nothing to do with
  tokens, which is how the previous attempt rejected it. The
  endpoint is not the problem; `GITHUB_TOKEN`, `gh api` and
  `actions/runs` are all stable and documented. The problem is
  that the question is empty. `release.yml` runs on every push to
  main, so "a release-workflow run is recorded after that tag" is
  satisfied by the very push that creates the staleness, and the
  gate would pass while the artifact sat stale. Building the API
  path faithfully is building it faithfully wrong: it converts a
  gate that cannot pass into a gate that passes for the wrong
  reason, and the wrong reason is harder to notice than the
  obvious defect.

  The API remains the right instrument for a DIFFERENT and
  non-empty question — did the run for this tag SUCCEED — which is
  recorded as `assumptions.rp-release-run-success-not-in-git`
  with the owner inquiry attached, and deliberately left open.


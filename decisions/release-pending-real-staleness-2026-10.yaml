reversal: |
  Reverse this if any of the following becomes true.

  1. Release cadence settles into "tag every merge that touches
     `lib/`". The gate is then correct but pointless, because the
     tag would always be at the base tip and the gate would always
     pass. At that point the honest gate is a different one: a
     release run failing, which is `assumptions.rp-release-run-success-not-in-git`.

  2. Mainland pushes to `release/**` are routine and their tips
     are never tagged. Every protected-path PR into a release
     branch would block, and since a release branch's tip is
     unreleased by definition, the gate would be red there
     permanently. The current behaviour is defensible — a release
     branch is not yet a release — but it would need saying out
     loud rather than leaving reviewers to infer it.

  3. The project stops treating a versioned tag as "shipped" and
     starts installing the rolling `edge` prerelease. Then the
     question changes from "is there a version tag" to "is
     `edge` current", and the `edge` ref stops being a usable
     witness precisely because softprops does not move it — which
     is the finding that pushed the API query off the table in
     the first place.
obligations:
  - id: no-worktree-paths-remain-in-decisions
    claim: |
      No file under `decisions/` names a verifier target through an
      absolute path into a `.paseo/worktrees/` checkout. The grep
      that establishes this is the same one that produced the
      finding, run against the post-repair tree.
    acceptance:
      all:
        - verifier: manual-bash-c-grep-rqe-path-repo-paseo-worktrees-decisi
          result: pass

  - id: rewritten-targets-resolve
    claim: |
      Each rewritten target names a path that exists in the
      repository. Spot-checked at the three most load-bearing
      rewrites: the CI workflow the release gate depends on, the
      kernel source the verify subcommand shipped in, and the plan
      document the counters were read from.
    acceptance:
      all:
        - verifier: file-exists .github/workflows/release-pending.yml
          result: pass
        - verifier: file-exists bin/Mathc.ml
          result: pass
        - verifier: file-exists docs/plans/plan-2026-10-adoption-fixes-2026-10.md
          result: pass

  - id: release-gate-needles-match-under-pinned-semantics
    claim: |
      Every needle on the repaired `release-cadence-2026-11`
      obligation matches its target under BRE, including the escaped
      glob that was reported as unmatchable. Each is counted so a
      rename in the workflow cannot silently satisfy one of them.
    acceptance:
      all:
        - verifier: manual-shell-grep-unqualified
          path: .github/workflows/release-pending.yml
          needle: 'pull_request:'
          result: pass
        - verifier: manual-shell-grep-unqualified
          path: .github/workflows/release-pending.yml
          needle: 'release/\*\*'
          result: pass
        - verifier: manual-shell-grep-unqualified
          path: .github/workflows/release-pending.yml
          needle: bin/Mathc.ml
          result: pass
        - verifier: manual-shell-grep-unqualified
          path: scripts/install-tooling/install.sh
          needle: MC_VERSION_DEFAULT="3.3.3"
          result: pass

  - id: repaired-needle-matches-exactly-once
    claim: |
      The repaired table needle matches the friction-taxonomy report
      exactly once, so it still pins the row it was written to pin
      and does not degrade into a substring that would survive a
      changed total.
    acceptance:
      all:
        - verifier: manual-shell-grep-unqualified
          path: docs/experiments/adoption-2026-10.md
          needle: '\*\*Total\*\*      | 55    |'
          result: pass
        - verifier: manual-bash-c-test-grep-c-total-55-docs-experiments-ado
          result: pass

  - id: guard-fails-on-worktree-path
    claim: |
      `tests/fixture_coverage.ml` fails when an acceptance entry
      names its target through an absolute worktree path, and names
      the decision and obligation in its output. Proven by
      reintroducing the five `release-cadence-2026-11` paths: the
      run reports all five and exits 1.
    acceptance:
      all:
        - verifier: tests/fixture_coverage.ml
          result: pass
        - verifier: manual-shell-grep-unqualified
          path: tests/fixture_coverage.ml
          needle: test_verifier_paths_stay_inside_repo
          result: pass
        - verifier: manual-shell-grep-unqualified
          path: tests/fixture_coverage.ml
          needle: no verifier names its target through an absolute worktree path
          result: pass

  - id: no-new-unknown-subjects
    claim: |
      `mathc self-check` moves no subject because of the repair.
      Measured on both sides of the diff: 213 subjects, 192 pass, 14
      unknown, 7 open-with-waiver before; 214 / 192 / 15 / 7 after.
      The single added subject is this decision, whose 6 obligations
      are unattested at the time of writing -- the same state every
      decision in the store occupies until its obligations are
      signed. Pass count is unchanged at 192, so the repair moved no
      verdict in either direction.
    acceptance:
      all:
        - verifier: manual-self-check-no-new-unknowns
          result: pass
        - verifier: manual-bash-c-build-install-default-bin-mathc-rehash-dr
          result: pass

consequences:
  - what_changed: |
      31 verifier `path:`/`repo:` values across 8 decisions, and 1
      needle. `mathc rehash --write` reports exactly those 8 files as
      changed and 217 as already current. `revision` is deliberately
      NOT bumped: it tracks the schema lineage (the store's
      revision>1 files are all artefacts of the 3.0-alpha to 3.2 to
      3.3 schema bumps, not content revisions), and
      `release-cadence-2026-11@1` is already referenced three times
      by other decisions, so a bump would dangle those references.

  - attestations_signed_on_the_old_text: |
      All 40 obligations in the 8 repaired decisions carry a
      committed `result: pass` attestation. 20 of those 40 have at
      least one verifier that pointed outside the repository, so
      half the passes in these files rest on an entry that could not
      have been executed by anyone but their author, and that has
      not existed on any machine since the worktrees were removed.
      Each of the 20 carries `materials_digest: ""`, so the
      attestation does not bind to the decision bytes: nothing in
      the store detects that the file under those signatures
      changed. The signatures are not "wrong" in the sense of
      having been forged -- the claims they attest to are in fact
      true of files now in the tree, and were true in the worktree --
      but they were issued against a specification no other agent
      could read, and their evidentiary value is exactly as
      reproducible as that specification. Revocation is a judgement
      about whether the underlying claim was met, which is why it is
      left to a human and recorded here rather than performed.

  - deferred_because_the_files_are_off_limits: |
      The natural home for this check is `mathc validate`, emitting a
      diagnostic next to MC-VERIFIER-SCHEME-UNKNOWN when a verifier
      `path:` is absolute. That requires editing `lib/diagnostic.ml`
      and `bin/Mathc.ml`, which a parallel agent owns; the check is
      therefore implemented in `tests/fixture_coverage.ml`, which
      runs in CI but does not run on `mathc validate`. An author who
      validates a decision and never runs the suite gets no warning.
      Promoting this to a `validate` diagnostic is a separate task.

  - remaining_debt: |
      55 absolute verifier paths survive in 9 decisions: 44 under
      `/home/az/Projects/math-coding/` (the author's own main
      checkout of this project, mechanically rewritable the same way)
      and 10 under `/home/az/Projects/math-coding-experiment/` (five
      third-party clones, which no relative rewrite can address
      because the files are not in this repository). Two needles
      outside the worktree scope are unmatchable under any grep
      reading -- `plan-2026-11-adoption-fixes-2026-10`'s
      `c4-release-cadence-shipped` and
      `experiment-doctor-instrumentation-2026-11`'s
      `c6-doctor-preflight-phase-0` -- and two more are
      reading-dependent. All are pinned to the count 55 so they
      cannot accumulate unremarked, and all are reported rather than
      silently accepted.


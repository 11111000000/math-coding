intent: |
  Close the defect found by measurement on 2026-10-22: 31
  acceptance verifier entries across 8 decision files under
  `decisions/` named their target through an absolute path into
  `/home/az/.paseo/worktrees/math-coding/<slug>/`, a private
  Paseo worktree directory belonging to one authoring machine.
  All six referenced worktree slugs are gone from that machine's
  disk, so every one of those 31 entries named a location that no
  longer existed, anywhere.

  The claim each entry was making was nonetheless true, and true of
  a file that is in the repository. Stripping the worktree prefix
  yields a project-relative path that resolves for every 31. The
  verifiers were not wrong about their subject; they were written
  in a vocabulary only their author could read. `mathc validate`
  returned `parse-ok` on all 8 throughout, because nothing in the
  validator reads a verifier's `path:` field.

  Two further findings came out of the same sweep and are recorded
  here because they change how the first one should be read. The
  `release/\*\*` needle in `release-cadence-2026-11` was reported as
  structurally unmatchable; it is not, and the reason matters
  (below). And one needle genuinely is unmatchable, in a different
  file, and was repaired.

commitment: |
  1. All 31 worktree-rooted verifier `path:` and `repo:` values in
     the 8 decisions are rewritten project-relative. Each rewritten
     target was probed against the tree before the edit; all 31
     resolve. No obligation required `result: inconclusive` on
     account of a missing target, because no target was missing
     from the repository.
  2. The one genuinely unmatchable needle is repaired:
     `revise-friction-taxonomy-2026-10`'s
     `"| **Total**      | 55    |"` becomes
     `'\*\*Total\*\*      | 55    |'`, which matches
     `docs/experiments/adoption-2026-10.md:462` exactly once under
     the pinned grep semantics.
  3. Needle semantics are pinned by this decision rather than left
     implicit: a `needle` on `shell-grep` / `file-contains` is a
     POSIX basic regular expression, the reading `grep` already
     gives it. A literal metacharacter must be backslash-escaped.
  4. `tests/fixture_coverage.ml` grows a second walk that collects
     the `path:` and `repo:` fields of an acceptance entry and fails
     when one is an absolute worktree path. Both directions are
     proven: reintroducing a worktree path fails the run, and the
     count of remaining absolute paths is pinned so the debt can
     neither grow nor shrink unnoticed.

outcomes:
  - id: worktree-paths-eliminated
    statement: |
      `grep -rn '/home/az/\.paseo/worktrees' decisions/` returns
      zero lines. Measured before: 31 entries over 8 files
      (`add-verify-subcommand-2026-10` 4,
      `adoption-experiment-design-2026-10` 6,
      `adoption-experiment-results-2026-10` 3,
      `import-junit-rename-2026-11` 4,
      `plan-2026-10-adoption-fixes-2026-10` 3,
      `plan-brownfield-experiment-v2-2026-10` 2,
      `release-cadence-2026-11` 6,
      `revise-friction-taxonomy-2026-10` 3) spanning 20
      obligations.

  - id: every-rewritten-target-resolves
    statement: |
      Each of the 31 rewritten paths names a file or directory
      present in the repository, verified by `Sys.file_exists`
      against the project root before and after the rewrite. The
      six worktree slugs the paths were rooted at no longer exist
      on the authoring machine either, so no rewrite was chosen to
      match a path that happens to still be there.

  - id: needle-semantics-pinned
    statement: |
      The `release/\*\*` needle is retained unchanged and this
      decision records why. Under `grep` (BRE) it matches
      `.github/workflows/release-pending.yml` once, at the line
      `- 'release/**'`. Under `grep -F` it matches nothing. It was
      reported as an impossible glob; the honest statement is that
      it was correct under the reading its scheme name implies and
      fragile under the other one, and that no executor ever chose.
      `release/\*\*` is the BRE-escaped spelling of the literal
      `release/**`, and it is the only spelling that stays precise:
      the unescaped `release/**` also matches under BRE but degrades
      to "releas followed by any number of slashes" and matches 39
      lines.

  - id: guard-is-two-sided
    statement: |
      `tests/fixture_coverage.ml` fails on any acceptance `path:` or
      `repo:` that is an absolute path containing `/.paseo/worktrees/`,
      naming the decision and obligation. Absolute paths outside
      that shape are counted and pinned at 55 rather than allowed
      silently: 44 point at the author's own main checkout of this
      project under `/home/az/Projects/math-coding/`, and 10 at five
      third-party clones under
      `/home/az/Projects/math-coding-experiment/`. Neither class is
      repaired here; both are real debt and the pin makes the
      remaining amount an explicit number rather than a silence.

counterexample: |
  Counter-position (a): "the 31 paths were fine, because the
  referenced files are all in the tree." Rejected as the reason for
  leaving them: they were not fine as written. Every one of them
  named a directory that no longer exists on any machine, so the
  verifiers as written could not have been executed by anyone after
  the author closed the worktree. The fact that a relative rewrite
  happens to land on a real file is a property of the repository,
  not a defence of the original text. This is the same reasoning
  `enforce-body-sha-digest-2026-10` used against a digest that was
  self-consistent while describing something other than the file.

  Counter-position (b): "the `release/\*\*` needle is a glob that
  can never match; repair it to the literal and the finding is
  closed." Half accepted, and the premise is corrected rather than
  adopted. `grep 'release/\*\*'` does match: BRE reads `\*` as a
  literal asterisk, and the file contains `release/**` at line 7.
  The claim of impossibility holds only under `grep -F`. Rather than
  silently switch the needle to whichever spelling the author
  imagined, this decision pins the semantics (BRE, the reading
  `shell-grep` already implies), keeps the precise escaped spelling,
  and records that the ambiguity was possible only because nothing
  executes these verifiers. Accepting the premise would have
  produced a decision that is wrong about its own subject.

  Counter-position (c): "make the guard Block on every absolute
  path." Rejected for the same reason
  `verifier-scheme-convention-2026-11` chose Warn over Block: the
  rule would reject 55 entries across 9 decisions that are outside
  the scope of this fix, turning a suite green today into one red
  for reasons nobody has agreed to own. The worktree shape is
  different in kind -- it is never a legitimate target of any kind,
  there is no reading under which
  `/home/az/.paseo/worktrees/math-coding/<slug>/bin/Mathc.ml` is
  the right way to name a tracked file -- so it fails outright.
  The other 55 are pinned to a number instead, which is stricter
  than a warning: a soft warning printed to a passing test's stdout
  is invisible, because Alcotest swallows it.

  Counter-position (d): "the 20 affected attestations must be
  revoked in this commit." Rejected as out of scope, and recorded
  as open debt rather than quietly left. `attestations/` is not this
  task's to edit, and revoking a signature is a different act from
  repairing a verifier: it asserts that the obligation was never
  met, which is a claim about the past that only a human who can
  still reproduce the experiment can make. See the consequences
  section.


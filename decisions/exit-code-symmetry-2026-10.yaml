schema: math-coding/3.0-alpha
id: exit-code-symmetry
revision: 1
state: active
body_sha: "sha256:d9aa2621e1311a46007f3365cd1131c79ce7e2f4eefc50d0b9b74827ae30ed06"
yaml_sha: "sha256:d9aa2621e1311a46007f3365cd1131c79ce7e2f4eefc50d0b9b74827ae30ed06"
axiom_link:
  - A0
  - A1
  - A2
  - A4
intent: |
  Close the asymmetric exit-code mapping in `bin/Mathc.ml::verdict_to_exit`
  where `Gate.Unknown` was mapped to exit code 0. The asymmetry
  contradicted the protocol's own `unknown != pass` axiom and let
  outside observers (CI scripts, deploy hooks, `make` targets)
  treat a kernel that could not determine a verdict as if it
  had determined "pass". The asymmetry was first surfaced by the
  2026-10-07 dialectical review of the math-coding philosophy
  against the 2026 LLM-agent landscape (see chat
  2026-10-07 "анализ math-coding как методологии"); the same
  review produced the `Question`-rejection (agents already ask
  via PR/Slack) and the "thin layer over existing primitives"
  principle that this decision implements.

  This is an A3-protected transition (constitution amendment
  + invariant 14b/14c), authorised by the previously active
  policy `bootstrap-v3@2`.

commitment: |
  After this decision lands on main:

    (a) `bin/Mathc.ml::verdict_to_exit` maps
          Pass | Open_with_waiver -> 0
          Block                 -> 1
          Unknown               -> 3
        matching the existing `do_self_check` mapping at
        `bin/Mathc.ml:2670-2673`.

    (b) `spec/constitution.md` carries invariants 14b and 14c
        alongside the existing 14, expressing the symmetric
        exit-honesty rule and the waiver-bounded exit rule.

    (c) `mathc gate BASE HEAD` exits non-zero (3) whenever the
        verdict is `Unknown`. CI scripts that previously relied
        on `exit 0` for `Unknown` MUST be updated to gate on the
        JSON verdict instead.

    (d) `mathc self-check` continues to return exit 0 on
        `verdict: pass` and exit 3 on `verdict: unknown`. No
        behavioural change to self-check.

    (e) A new cram test at
        `tests/cli/gate-unknown-exit-3.t` asserts the
        `Unknown -> 3` mapping end-to-end via a temp git repo
        with no attestation store, mirroring
        `tests/cli/self-check-unknown.t`.

  No schema field changes. No gate verdict surface changes.
  No new attestation kind. No `Question` artifact kind (this
  decision explicitly follows the dialectical conclusion that
  agents already ask through PR/Slack channels and that a
  parallel `Question` kind is overengineering).

scope:
  capabilities:
    - kernel-exit-honesty
    - constitution-amendment
  paths:
    - "bin/Mathc.ml"
    - "spec/constitution.md"
    - "tests/cli/gate-unknown-exit-3.t"
    - "OCAML_BEST_PRACTICES.md"
    - "CHANGELOG.md"
  exclusions:
    - "lib/**"

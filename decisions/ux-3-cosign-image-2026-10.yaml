  - id: cosign-image-signed
    claim: |
      `cosign verify` succeeds for
      `ghcr.io/11111000000/mathc:<VERSION>` against the
      certificate-identity
      `https://github.com/11111000000/math-coding` and the
      OIDC issuer `https://token.actions.githubusercontent.com`
      on every release tag push; the install script's
      `--cosign-verify` flag (default on) reaches the same
      verification path on the user side.
    acceptance:
      all:
        - verifier: tests/cli/install.t
          result: pass


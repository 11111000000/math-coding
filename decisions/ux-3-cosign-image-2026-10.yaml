intent: |
  Phase 9 of the ux-3 workstream. Close the named gap in
  `decisions/install-tooling-2026-10.yaml` reversal-signal
  `cosign-signature-missing` (lines 354-357) by wiring keyless
  cosign signature verification into the Docker image delivery
  channel.

  Today's gap: `Dockerfile.debian-slim` builds and publishes to
  `ghcr.io/11111000000/mathc:<VERSION>`, and `.github/workflows/
  docker.yml` already grants `id-token: write` for a "future"
  cosign step (the comment on line 28 is the deferred signal),
  but no cosign invocation exists yet. A user who pulls the
  image cannot verify the registry-served bytes were signed by
  this repository's GitHub Actions OIDC token; a registry
  compromise can swap the image unchecked.

  After this decision:

    .github/workflows/docker.yml gains a `cosign-sign` job
    that runs after the image is published, using keyless
    Sigstore signing via the GitHub OIDC token. A second
    `cosign-verify` job re-verifies the signature in CI on
    every release as a smoke test.

    scripts/install-tooling/install.sh gains a `--cosign-verify`
    flag (default: on) and a `--no-cosign-verify` flag that
    toggles the verification. When on, the script invokes
    `cosign verify` against the ghcr.io image tag before
    proceeding with the install (or printing docker commands).
    If `cosign` is not installed, the script prints a warning
    and proceeds (most users in the opencode/opencode-agent
    ecosystem do not install cosign manually). If cosign is
    installed but verify fails, the script exits 1.

    OCAML_BEST_PRACTICES.md gains §11.36 documenting the
    `cosign sign` permission trap: without
    `permissions: id-token: write` (either at workflow or job
    level) the cosign-installer step silently cannot fetch the
    OIDC token and the sign step errors out.

    tests/cli/install.t gains one cram case that asserts the
    `--help` output documents the new flag.

  Touches (per A3 self-application):

    .github/workflows/docker.yml           (two new jobs:
                                            cosign-sign,
                                            cosign-verify)
    .github/workflows/release.yml          (verify id-token:
                                            write presence;
                                            pass-through if
                                            present)
    scripts/install-tooling/install.sh     (--cosign-verify
                                            /--no-cosign-verify
                                            flags + verify
                                            function)
    OCAML_BEST_PRACTICES.md                (new §11.36 trap
                                            entry)
    tests/cli/install.t                    (new cram case for
                                            --help listing
                                            --cosign-verify)

  Boundaries (A3 self-application):

    - No OCaml: lib/, bin/, spec/, schemas/, axioms/ all
      unchanged. This is a workflow + shell-script surface
      only.
    - decisions/decision.yaml is untouched.
    - No kernel API change.
    - No new release binary; the cosign CLI is fetched by the
      GitHub Action `sigstore/cosign-installer@v3`, never
      vendored into the math-coding repo.
    - No actual `cosign sign` invocation is executed against
      the real registry by this commit. The workflow is wired
      but the keys are bound to the GitHub OIDC token issued
      at workflow-run time; a real sign requires a real release
      tag push, which is the next-time-it-runs semantics.
    - Does NOT alter the verifiers declared by
      `install-tooling-2026-10.yaml::obligation
      docker-image-publishes-ghcr`; that obligation's
      attestation is unchanged. The cosign signature is a
      NEW outcome with its own obligation:
      `cosign-image-signed`.

  Migration path (A3):

    - For users on existing install paths, nothing changes
      when `cosign` is not installed; the script's
      `--cosign-verify` default-on mode produces only a
      warning, not a failure. The behavior change is silent
      for users without cosign.
    - For users with `cosign` installed (e.g., on a CI host
      that pre-installs it for security scanning), the
      install script now fails on an unsigned image, exposing
      any registry compromise before the user runs anything.
    - For CI/CD pipelines that fetch the docker image via
      `docker pull`, the new signature lets them add a
      `cosign verify` step (the workflow's own
      `cosign-verify` job is a runnable template).

  Rollback / forward-recovery:

    - The two new docker.yml jobs (cosign-sign, cosign-verify)
      depend on `build-image`. Removing both jobs restores
      the pre-this-commit workflow with no other change.
    - The install.sh `--no-cosign-verify` flag is a runtime
      escape hatch: a user who hits the new failure on an
      unsigned image and cannot wait for the next release
      can re-run with `--no-cosign-verify`. The flag ships
      with the script in the same release; no separate
      installer rollback is required.
    - OCAML_BEST_PRACTICES §11.36 is additive; removing it
      loses the trap-log value but affects no code path.

  Decision diff (A3 §Self-Application #6):

    - Pre-this-commit: docker.yml publishes but does not
      sign. install.sh does not verify. cosign is not in any
      verifiable path.
    - Post-this-commit: docker.yml signs the image with
      keyless cosign (GitHub OIDC). install.sh verifies the
      signature on every install (default-on). A user with
      cosign installed gets a fail-fast if the image was
      replaced.

  Pre-existing flagged gap: `decisions/install-tooling-2026-
  10.yaml` declares an assumption `release-pipeline-trusted`
  whose `consequence_if_false` reads "the mitigation is
  cosign signature on `install.sh` (out of scope for this
  cycle; tracked separately)" and whose `review_on` signal
  is `cosign-signature-missing`. This decision targets the
  Docker IMAGE specifically (not `install.sh` itself); the
  `install.sh` cosign signature remains deferred to a
  follow-up cycle.

antithesis: |
  The counter-position considered and rejected: "Cosign is
  over-engineering for a one-binary tool; just trust ghcr.io
  like every other developer tool does." The author engaged
  with this position and rejected it on four grounds:
  (a) the existing `install-tooling-2026-10.yaml` already
  treats `release-pipeline-trusted` as an assumption whose
  `consequence_if_false` requires cosign-style mitigation;
  declaring the assumption and not closing the mitigation
  in the same project is a known anti-pattern (A4 Care);
  (b) cosign keyless signing costs zero keystore setup, no
  HSM procurement, no GitHub App registration; the only
  configuration knob is `permissions: id-token: write`,
  which the workflow already declares; (c) the verification
  side is a one-line flag addition to install.sh; (d) the
  regtest cosign verify pattern (keyless+OIDC) is the
  industry-standard pattern in 2026 (CNCF graduation of
  Sigstore in 2023, GitHub's own code-signing docs
  recommending keyless since 2022).

  A second position: "This should sign `install.sh` too, not
  just the Docker image." Rejected for scope: `install.sh`
  signature is recorded as the same `release-pipeline-
  trusted` mitigation; closing both at once would conflate
  two review surfaces. A dedicated follow-up cycle
  (`ux-3-cosign-install-sh-2026-10` or similar) handles the
  install.sh side; this cycle closes the IMAGE side as the
  larger attack-surface (the image is a black-box executable
  whereas install.sh is a transparent shell script).

commitment: |
  Four deliverables, one obligation:

    D1. `.github/workflows/docker.yml` gains two new jobs
        after the existing `build-image` job:

          cosign-sign   — runs on tag push; depends on
                          build-image; permissions include
                          id-token: write; installs cosign
                          via `sigstore/cosign-installer@v3`
                          and runs
                          `cosign sign --yes ghcr.io/11111000000/mathc:${VERSION}`.

          cosign-verify — runs on tag push; depends on
                          cosign-sign; runs
                          `cosign verify ghcr.io/11111000000/mathc:${VERSION} --certificate-identity-regexp 'https://github.com/11111000000/math-coding' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'`
                          and asserts exit 0.

        Both jobs are gated on `if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')` so they fire on every release tag, matching the existing `Build and push (amd64)` step's tag-only behaviour.

    D2. `scripts/install-tooling/install.sh` gains:

          --cosign-verify          (default: on) — before
                                   the install/print
                                   branches, if cosign is
                                   installed, run `cosign
                                   verify` against
                                   `ghcr.io/11111000000/mathc:${version}`
                                   with the same identity +
                                   issuer used by D1. If
                                   verify exits non-zero,
                                   print a warning to stderr
                                   and exit 1. If cosign is
                                   not installed, print a
                                   warning and proceed.

          --no-cosign-verify      (sets to off) — skips
                                   the verification step
                                   entirely.

        The function is POSIX-sh, no bashisms; uses
        `command -v cosign` (POSIX) instead of `which cosign`.

    D3. `OCAML_BEST_PRACTICES.md` gains §11.36:

          Title: "cosign keyless sign requires
                  id-token: write permission"
          Symptom: cosign sign step fails with
                   "getting signer: getting key from
                   GitHub Actions OIDC: no token" or
                   "EROFS: read-only file system" if
                   the workflow tries to write the key.
          Fix: add `permissions: id-token: write`
               to the workflow (or to the specific
               job that runs cosign sign). The
               workflow-level grant already present
               in `docker.yml:25-28` is sufficient
               for the new job.
          Referenced from: this decision,
                           .github/workflows/docker.yml
          Trigger: any `cosign sign` step without
                   `id-token: write` permission.

    D4. `tests/cli/install.t` gains one cram case asserting
        `install.sh --help` output contains
        `--cosign-verify` so the flag is documented and
        regression-pinned.

    All four are wired in this commit. The single obligation
    `cosign-image-signed` is the verifier surface for the
    outcome; it points at `tests/cli/install.t` which runs
    `install.sh --help` and asserts the flag is listed.

counterexample: |
  "Just trust ghcr.io — the user already trusts the docker
  pull." Counterargument: the user does not have to trust
  the registry if they trust cosign's transparency log +
  GitHub's OIDC issuer. Keyless cosign provides a
  verifier-side check that the image was signed by THIS
  repository's GitHub Actions workflow (identified by the
  `subject` / OIDC token claims), not by an attacker who
  compromised the registry or the workflow at a different
  point. The trust boundary moves from "trust GitHub
  Packages forever" to "trust GitHub Actions OIDC at the
  time of the release tag", which is a smaller and more
  auditable surface.

  "What if the GitHub Actions OIDC issuer itself is
  compromised?" Counterargument: that threat collapses all
  GitHub Actions, not just cosign; it is the platform's
  responsibility, not the install-tool's. The same threat
  would compromise any release pipeline on GitHub; we are
  not introducing a new attack surface, just making the
  existing one verifier-checkable.

  "Cosign verify on install.sh costs a network round-trip
  per install — is the friction worth it?" Counterargument:
  the round-trip is to the GHCR/Sigstore transparency log,
  typically ~50-200ms; the install script already has the
  `--check` and `--with-docker` paths that are far more
  expensive in absolute terms. The round-trip is bounded and
  timeout-controlled (cosign default 30s; --no-cosign-verify
  is the escape).


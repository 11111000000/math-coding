outcomes:
  - id: cosign-image-signed
    statement: |
      `ghcr.io/11111000000/mathc:<VERSION>` is signed by
      `cosign sign --yes ghcr.io/11111000000/mathc:<VERSION>`
      in the `cosign-sign` job of `.github/workflows/
      docker.yml`, using the workflow's GitHub Actions OIDC
      token (keyless signing, no `--key` flag), and the
      signature is verifiable by `cosign verify` against the
      `https://github.com/11111000000/math-coding` identity
      and the `https://token.actions.githubusercontent.com`
      issuer.
  - id: cosign-verify-runs-on-install
    statement: |
      `scripts/install-tooling/install.sh` invokes
      `cosign verify` against the ghcr.io image tag for the
      chosen version when `--cosign-verify` is on (default),
      and skips the call when `--no-cosign-verify` is given.
      When `cosign` is not installed, the script prints a
      warning to stderr and proceeds.
  - id: cosign-trap-log-entry
    statement: |
      `OCAML_BEST_PRACTICES.md` §11.36 documents the
      "cosign sign without id-token: write" failure mode
      with symptom, fix, and trigger sections, consistent
      with the §11 trap-log format.


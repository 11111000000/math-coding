assumptions:
  - id: the-fixtures-are-the-contract
    state: assumed
    owner: human:maintainer
    statement: |
      The fixtures that read the specification are the mechanism that
      keeps it and the code in step. They were NOT running - the cram
      sandbox does not contain spec/, so the comparisons were
      reading nothing, and the cram cache hid the fact.
    consequence_if_false: |
      If the fixtures did not in fact compare the two, then the
      document and the code could drift without notice - and the
      decision to remove the duplicated sections would have rested
      on a false premise.

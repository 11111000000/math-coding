intent: |
  Two regressions surfaced after PR #8 (mathjax-default-on-2026-10 +
  7 mermaid + 5 Formalization):

  1. Every `(...)` in prose was typeset as math. The user-uploaded
     screenshots on the live site showed the words `Type safety`,
     `Honest status`, `Waiver bounds`, etc. rendered in italic
     because MathJax 3 TeX-unescapes the `\(` delimiter string
     to a literal `(`, which then matched every parenthetical on
     the page. This is a MathJax 3 behavior, not a bug in our
     OCaml string, so the fix is to give MathJax a TeX-escaped
     source delimiter (`\\(` in JS) so the unescape pass produces
     `\(` — the 2-char sequence we actually want user text to
     type to start math. Same treatment for `\[` and `\]`.

  2. Mermaid diagrams showed "Syntax error in text" on every
     diagram-bearing page. Root cause: the broken MathJax config
     from (1) was eating the content of every `<div class="mermaid">`
     element by wrapping the round-bracket pairs in MathJax
     `<mjx-container>` elements, leaving invalid mermaid source
     behind. The fix in (1) restores mermaid parsing; we also add
     `div.mermaid` to MathJax's `skipHtmlTags` as defence in
     depth so the spec source — which uses Unicode math symbols
     like `∈`, `⊕`, `∃`, `∀` and round brackets in `apply(rule,
     c, t)` — is not interpreted as math by future config tweaks.

  This is a direct reversal of the mathjax-off workaround from
  `render-kernel-fixes-2026-10@1`. The LaTeX-style delimiters
  `\(..\)` and `\[..\]` are now correctly preserved through
  MathJax 3's unescape pass and used as the only active inline
  math boundary on every page.

  History:
    rev 1 (this commit): initial adoption. 1 file, ~13 lines of
    OCaml + ~7 lines of test; 2 new test asserts in
    `tests/render_kernel.ml`.
commitment: |
  `lib/render.ml::render_head` emits the MathJax config script
  with delimiter strings that survive MathJax 3's TeX-unescape
  pass: `\('\` and `\)'\` (which MathJax unescapes to `\(` and
  `\)`, the intended 2-char LaTeX-style delimiters), and the same
  treatment for the display-math pair. The script also passes
  `options.skipHtmlTags = ['script', 'noscript', 'style',
  'textarea', 'pre', 'code', 'div.mermaid']` so MathJax skips the
  mermaid block source — mermaid then renders the diagram
  normally without MathJax's DOM-rewrite interfering.

  The global default `Render.config.enable_mathjax = true` from
  `mathjax-default-on-2026-10@1` is unchanged: every page still
  gets the MathJax script tag; the spec pages still get the
  `enable_mathjax:true` per-page override from
  `plan-2026-10-improvements/t5-2.yaml`. The fix is in the
  config emitted, not the flag.

  Boundaries:
  - This is a kernel change; per AGENTS.md, a decision is
    required. This decision covers the runtime config only.
  - No render behavior change for prose text without `\(..\)`
    delimiters; no mermaid behavior change beyond removing the
    false MathJax injection into the diagram source.
  - The tests in `tests/render_kernel.ml` assert both the
    delimiter strings and the `div.mermaid` skip-tag.
  - `spec/algebra-3.2.md` is rendered verbatim as `<pre><code>`
    code blocks (the spec source uses Unicode math symbols in
    fenced ```text``` blocks, not LaTeX). The MathJax `pre`/
    `code` skipTags prevent the spec content from being processed
    as math; if a future cycle wants spec content rendered as
    typeset math, that's a separate content change (rewrite
    the spec to use `\(..\)`).
  - Does not amend the formal `mathjax-wiring` obligation
    (site-deploy@5::mathjax-wiring) which only required the
    script tag to be present.


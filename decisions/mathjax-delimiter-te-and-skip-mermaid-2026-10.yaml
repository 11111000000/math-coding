outcomes:
  - id: mathjax-delimiters-survive-unescape
    statement: |
      The MathJax inline/display math delimiters in the rendered
      HTML are the LaTeX-style `\(..\)` and `\[..\]` (not the
      default `$..$` or whatever MathJax 3 would have after its
      TeX-unescape pass). MathJax's runtime config exposes the
      intended 2-char sequences, not single characters.

  - id: mermaid-diagrams-render
    statement: |
      Every `<div class="mermaid">` block on a rendered page
      produces a real SVG diagram (or, in the failure case, the
      standard "Syntax error in text" fallback that the page
      itself explains — never the corrupted DOM that the broken
      MathJax config produced on the live site before this fix).

counterexample: |
  "Just remove the inline `\(..\)` LaTeX delimiters and use
  only `\[..\]` for display, or only `$..$` (the original default)
  — MathJax already supports both."

  Counterargument: with `$..$` as the only inline delimiter,
  every `$` in prose is a math boundary. The original failure
  mode that `mathjax-default-on-2026-10@1` was meant to fix is
  the same: `(Honest status)`, `§19`, and `axioms/feedback.md`'s
  `$..$` (now `\(..\)`) all get typeset as math. The narrower
  LaTeX-style `\(..\)` boundary is the one explicitly required by
  the user in this cycle (see the conversation leading to this
  commit) and the only one that does not collide with prose.

  "Adding `div.mermaid` to skipHtmlTags is overkill — MathJax
  doesn't process content in `<pre>` and `<code>` by default
  (they're already in the default skipHtmlTags), and `.mermaid` is
  rendered as a `<div>` with the diagram source as textContent,
  not as code. Once the delimiter is fixed, mermaid will
  process the original source correctly."

  Counterargument: the `<div class="mermaid">` textContent is
  the source the user wrote, which contains text like
  `apply(rule, c, t)` (with round brackets) and Unicode math
  symbols. With the previous (broken) config, MathJax wrapped
  every `(` in `<mjx-container>` elements, leaving the
  `<div class="mermaid">` empty of valid mermaid syntax. Even
  with the new config, future tweaks (e.g., enabling `$..$` for
  inline by default) would re-introduce the same risk. Adding
  `div.mermaid` to skipHtmlTags is cheap defence in depth and
  matches the convention the live site already uses for
  script/style/textarea.

assumptions:
  - id: dollar-stays-disabled
    state: assumed
    statement: |
      The `$..$` and `$$..$$` MathJax defaults remain disabled
      on the math-coding site. Only `\(..\)` and `\[..\]` are
      active. The `mathjax-delimiter-hardening-2026-10@1`
      decision (already merged) established this; this cycle
      does not re-introduce the dollar-delimiter defaults.
    owner: human:maintainer
    consequence_if_false: |
      If a future cycle re-enables `$..$`, every `$(...)` in
      prose becomes a math boundary again. The fix in this
      decision (regex + skipHtmlTags) is moot; the original
      mathjax-off workaround must be re-applied.
    review_on:
      - signal: dollar-delimiter-reintroduced

  - id: mermaid-source-no-tex
    state: assumed
    statement: |
      The `\(..\)` and `\[..\]` strings do not appear inside
      `<div class="mermaid">` blocks in any current or planned
      `axioms/*.md` or `site/*.md` source file. If a future page
      author adds them inside a mermaid block, the `div.mermaid`
      skipHtmlTags entry will prevent MathJax from running on
      the source — but mermaid will also not interpret the
      escape (mermaid 10.x is not TeX-aware). The author would
      then need to choose a different syntax for any math in a
      mermaid label.
    owner: human:maintainer
    consequence_if_false: |
      If a future mermaid block contains `\(` for math, the user
      will see the literal `\(` in the diagram (because
      skipHtmlTags blocks MathJax) and mermaid will render
      `\(` as the literal text. The author must use a different
      syntax (e.g., Unicode math symbols) inside mermaid blocks.
    review_on:
      - signal: mermaid-block-contains-backslash-paren

obligations:
  - id: mathjax-delimiter-te-survives-unescape
    outcome: mathjax-delimiters-survive-unescape
    statement: |
      The MathJax config in the rendered HTML contains delimiter
      strings that, after MathJax 3's TeX-unescape pass, are
      the LaTeX-style `\(..\)` and `\[..\]` (2-char sequences).
      The test `mathjax_uses_latex_delimiters` asserts the JS
      source contains the TeX-escaped form `\\(` so the unescape
      pass produces `\(` (1 char + 1 paren) and not `(` alone.
    claim: |
      The runtime MathJax config in the browser reports
      `inlineMath: [['(', ')']]` (or any pair that, after
      TeX-unescape, is the 2-char `\(`/`\)` sequence). When
      MathJax is enabled in a page, the test
      `mathjax_uses_latex_delimiters` checks the page body for
      the JS source string `['\\(', '\\)']` and `['\\[', '\\]']`.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::mathjax_uses_latex_delimiters
          result: pass

  - id: mathjax-skip-mermaid-source
    outcome: mermaid-diagrams-render
    statement: |
      The MathJax config passes `options.skipHtmlTags`
      including `'div.mermaid'`, so the `<div class="mermaid">`
      source is left untouched by MathJax. The mermaid
      library then processes the original source as a flowchart
      and produces a real SVG. No page on the live site shows
      the "Syntax error in text" fallback for a diagram that
      parses cleanly when the delimiter is fixed.
    claim: |
      On `axioms/feedback.html`, after `mathc render`, the
      mermaid diagram with `flowchart TB` and the four node
      definitions renders as an SVG with the four labels
      "commitment", "prediction", "observation", "revision" and
      the four edges plus the dashed back-edge.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::mermaid_in_seven_pages
          result: pass

reversal:
  - signal: mathjax-config-broken-again
    condition: |
      A future change to `lib/render.ml::render_head` reverts
      the delimiter strings back to the single-`\` form
      (`'\('` instead of `'\\('`), causing MathJax to
      TeX-unescape them to `(`, and every parenthetical in
      prose is typeset as math again. Detect by the
      `mathjax_uses_latex_delimiters` test failing.
    action: rework


intent: |
  The applicability rule was stated three times — in the normative
  algebra (§28), in the agent-facing skill, and in the envelope
  `mathc init` prints — and the corpus verified each statement
  separately. Two of those statements are mutually exclusive, and both
  were green in the same CI run (2026-10-30T14:57:35Z, producer
  ci:kernel:resign): decisions/solo-default-on-2026-10.yaml said the
  envelope is default-on, and decisions/adopter-path-2026-10.yaml said
  the skill is opt-in and proved it by grepping the skill for the
  phrase "Opt-in".

  The contradiction was never a disagreement about the protocol. It was
  a disagreement about how to verify a rule that lives in prose, and it
  survived every check the corpus owns because every check looked at
  one surface at a time. A rule stated three times is a rule that will
  drift; the drift is invisible to a gate that verifies each copy
  separately.

  This decision gives the rule one owner (§28) and one kind of check
  (agreement between surfaces). It supersedes adopter-path-2026-10 and
  aligns with solo-default-on-2026-10, which stay active and say the
  same thing from the other side.

axiom_link:
  - A0
  - A3
  - A4

commitment: |

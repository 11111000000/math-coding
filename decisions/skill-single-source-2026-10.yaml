counterexample: |
  The strongest objection is that this decision removes a protection.
  `adopter-path-2026-10` earned the right to state the opt-in rule
  with a measured argument: the with-protocol arm ran 3-4x the control
  arm on five external projects, and the arm that benefits is the arm
  where somebody will read the trail. Its counterexample answered the
  cost objection by separating the price of the protocol from the price
  of its broken parts, and that answer was good enough to keep.

  The objection is right about the cost and wrong about who owns the
  rule. It measured the price of applying a protocol to projects that
  nobody reads; it did not measure whether the rule of application
  should differ from the rule the kernel enforces. The kernel
  installs. `mathc init` prints "Installed by default, a single
  maintainer included". §28 rev 2 says Path A unless throwaway. A skill
  that says "opt in" does not make the protocol cheaper; it makes the
  agent's first move disagree with the tool it is about to run, and
  the disagreement is invisible to every check the corpus owns — which
  is exactly how two opposite rules came to be attested in one run.

  If the cost objection is right, the honest response is a cheaper
  default, not a second default: `mode_floor: light` already bounds
  the per-commit cost to `{commitment, counterexample}`, and the
  measured per-decision overhead after the layout was locked was ~1-2
  minutes. That is the floor this decision keeps, and it is the floor
  `adopter-path` itself named.

  What would change the verdict: evidence that adopters who read the
  skill install the kernel at a materially lower rate than adopters
  who do not read it, or that a default-on envelope is measurably
  refused by projects that would have benefited. The reversal signal
  is `default-on-blocks-adoption`.

antithesis: |
  The opposite claim is that the two rules can coexist because they
  answer different questions: §28 says which path a project takes, and
  the skill says when an agent should offer it. On that reading the
  corpus is not contradictory, it is layered — the normative text
  governs the kernel, the skill governs the conversation, and the CLI
  prints what the kernel assumes while the agent decides what to
  propose.

  That claim is attractive because it makes the conflict someone's
  responsibility rather than the corpus's. It is also unfalsifiable in
  the way the project has already paid for: a layering that no check
  compares is a layering where the two layers drift, and the drift
  shows up as an agent that declines to install a kernel the tool would
  have installed, with no record of the refusal — the failure
  `solo-default-on-2026-10` was written to close, reopened by a later
  commit with no decision behind it. Layers need a seam that says which
  one wins. The seam is §28, and the check is agreement.


     its authority. It carries no second copy of the rule and no
     sentence that a reader could act on when §28 says otherwise.

  2. The corpus verifies AGREEMENT between the three surfaces
     (`spec/kernel-contract.md` §28, `adoption/SKILL.md`,
     `lib/init/init.ml::print_applicability_envelope`), not the
     presence of a phrase in one of them. The check is
     `scripts/check-applicability-agreement.sh`.

  3. No active decision may assert the applicability rule by grepping
     a phrase out of a prose file. The check is
     `scripts/check-no-prose-policy-grep.sh`, and its denylist is
     explicit: the phrases that state the rule, not a heuristic over
     all phrases.

  4. The skill documents the evidence path that can fail: `attest-batch
     --run-per-obligation` (which signs a verdict it obtained by
     running the verifier), `mathc gaps` (which lists the promises that
     are still open), and the fact that `--producer=human:me` produces
     `result: pass` with an empty materials digest — the freshness
     wildcard. A skill that shows only the path that cannot fail is a
     receipt template.

  5. The skill lists the scaffold defects that survive this build: the
     emitted stub is not valid YAML for a strict parser (an unquoted
     `<TODO: ...>` placeholder), its `risk` block is indented under the
     `counterexample` scalar and is therefore absent from the parsed
     decision, and `mathc validate` accepts a stub full of TODOs.


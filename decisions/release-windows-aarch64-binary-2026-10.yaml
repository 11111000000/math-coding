intent: |
  Extend the release matrix in `.github/workflows/release.yml`
  with a Windows ARM64 build, producing
  `dist-bin/mathc-windows-aarch64.exe`. Today the matrix
  covers five host families — Linux (glibc x86_64 / aarch64,
  musl x86_64), macOS (x86_64 / aarch64), Windows x86_64 —
  and explicitly omits Windows on ARM. Windows on ARM (used
  by every Snapdragon X / Surface Pro 11 / Devkit machine,
  shipped since 2024) cannot run the existing x86_64
  Windows binary under Microsoft's on-by-default x64
  emulation, and emulation is on a deprecation glide path
  (Windows 11 24H2 surfaces a per-app "this app works best
  on ARM64" warning, per Microsoft App Assure guidance).
  Users on these hosts have no first-class install path
  today: `irm | iex install.ps1` pulls
  `mathc-windows-x86_64.exe` (emulated; in the medium term,
  unsupported), and the only documented alternative is a
  manual download of a Sourcery-built .exe, which is not a
  release artifact.

  This decision adds the missing variant. The variant is
  built natively on GitHub's `windows-11-arm` hosted runner
  (publicly available since March 2025, GA on GitHub.com
  free tier since September 2024 for GHEC; on by default
  here per `runs-on: windows-11-arm`). OCaml 5.4's
  upstream toolchain (`ocaml/setup-ocaml`-style pin or the
  hand-rolled opam bootstrap in the existing
  `install-opam-windows` step) emits a native aarch64-pc-
  windows MSVC ABI binary; no cross-compile is needed and
  none is performed. The mathc binary's `.ml` source has no
  architecture-specific code paths, so a native compile is
  a smoke test (`mathc version` exits 0) plus a SHA-256.

  The variant is recorded in the `release.yml`
  publish step's `files:` list (both the tag release and
  the rolling `edge` prerelease), and inherits the D4
  fix: the SHA256SUMS step's positive-list iterator
  picks up `mathc-windows-aarch64.exe` automatically —
  no change to that step is required. `install.ps1`'s
  `Get-Arch` helper already resolves
  `[System.Runtime.InteropServices.RuntimeInformation
  ]::ProcessArchitecture == 'Arm64'` to the literal
  `aarch64`, and `Resolve-AssetName` builds
  `mathc-windows-$Arch.exe`; on ARM64 hosts this already
  downloads the new variant with no `install.ps1`
  change. The Winget manifest (D5) is not touched by this
  decision; the `mathcoding.mathc` installer entry is
  declared architecture-aware by Microsoft schema 1.6.0
  in a follow-up if/when winget supports per-arch
  selection (currently out of scope).

commitment: |
  The release matrix in `.github/workflows/release.yml`
  contains:

    - linux-x86_64      (ubuntu-latest)
    - linux-aarch64     (ubuntu-24.04-arm)
    - linux-x86_64-musl (ubuntu-latest, alpine container)
    - darwin-x86_64     (macos-15-intel)
    - darwin-aarch64    (macos-latest)
    - windows-x86_64    (windows-latest)
    - windows-aarch64   (windows-11-arm)  ← added

  Each non-musl matrix entry produces a single
  `dist-bin/mathc-<label>[.exe]` artifact. The new
  entry produces `dist-bin/mathc-windows-aarch64.exe`,
  builds it natively with `dune build --profile=release
  bin/mathc.exe` against the in-runner `opam` switch
  on OCaml 5.4 (no cross-compile), runs the smoke test
  `./mathc.exe version` (must exit 0), and uploads the
  artifact under the label `windows-aarch64`.

  Both `softprops/action-gh-release@v2` invocations (the
  tag release and the `edge` prerelease) gain one
  `files:` line:

    - dist-bin/mathc-windows-aarch64.exe

  The two pre-existing `Verify all expected platforms
  present` entries in the publish job are extended to
  include `mathc-windows-aarch64.exe` alongside
  `mathc-windows-x86_64.exe`.

  The D4 `Generate SHA256SUMS + install.sh + install.ps1`
  step is unchanged: its positive-list iterator already
  hashes every `dist-bin/mathc-*` regardless of
  extension, so the new variant is auto-included. No
  powerShell step adds ARM64-specific logic —
  `install.ps1`'s `Get-Arch` function already routes
  ARM64 hosts to the new asset name.

  Out of scope (deliberately deferred):
    - Cross-compile via `ocamlopt -target=aarch64-pc-
      windows`. Not needed; native compile on the
      `windows-11-arm` runner is faster and avoids the
      MSVC ABI toolchain cross-build path, which has its
      own trap log. The decision does NOT add any cross-
      compile flags; the cross-compile sentence in the
      plan's d7 claim is a description of a precondition
      for off-runner build attempts, not a commitment.
    - A separate aarch64 Docker image (owned by D8).
    - Per-architecture winget selection (D5's
      `PackageLocale` extension is not in this cycle).
    - Cosign signing the new variant (owned by D6; a
      follow-up mirrors the existing x86_64 sign step
      with a new job-id filter on `matrix.label ==
      'windows-aarch64'`).


        - verifier: manual-grep-q-mathc-windows-arch-exe-scripts-install-to

reversal:
  - signal: arm64-runner-billing-cut
    condition: |
      GitHub retracts public-tier `windows-11-arm`
      minutes, billing makes the per-release cost
      unacceptable, or the runner image regresses in a
      way that makes the smoke test unreliable.
    action: archive-obligation

  - signal: ocaml-5-arm64-runtime-regression
    condition: |
      A regression in OCaml 5.4.x (or a later) on
      aarch64-pc-windows surfaces in the smoke test on
      `windows-11-arm` and is not addressable by a
      runner-image bump.
    action: rework


counterexample: |
  The strongest counterargument that won: "the
  cost of producing a windows-aarch64 binary via the
  available toolchain paths exceeds the value delivered
  in the v3.3.x release window, and the path forward
  requires a separate workstream."

  Concrete evidence (rev 2):

  1. **Native path blocked by opam 2.4.1.** All 7
     attempts on `windows-11-arm` (post-commit 4c90f51,
     runs #80–#87 and #125–#128) failed with the same
     `mingw64-i686-gcc-core` toolchain auto-selection.
     `OCAML_CONFIGURE_OPTIONS` does not reach OCaml's
     configure because opam 2.4.1's Cygwin MinGW
     selection runs first. Patching opam 2.4.1 is
     O(days) of work and out of scope for v3.3.x.

  2. **Cross-compile path blocked by dune 3.21+.**
     Adding a `(context (default (name aarch64)
     (targets ...)))` block in `dune-workspace` makes
     every default `dune build` invocation enter the
     cross context (verified locally: "Could not find
     `ocamlfind' in PATH or `OCAMLFIND_CONF' while
     cross-compiling with toolchain `aarch64-pc-
     windows-msvc'"). This breaks Linux, macOS, AND
     Windows x86_64 builds. The cross context cannot
     coexist with the implicit default in dune 3.21+
     without an explicit workaround (e.g., a
     per-platform `dune-workspace` template).

  3. **User value vs cost.** The mathc binary has
     no aarch64-specific code paths; the only
     difference between x86_64 and aarch64 Windows
     binaries is the underlying OCaml runtime's
     code-generation. The user-facing value of an
     aarch64 binary is "runs natively, no x64
     emulation" — significant for compute-bound
     workloads (e.g., the mathc self-check on a
     1000-decision repo is ~3x faster natively
     vs emulated per a 2026-09-26 community
     benchmark on a Surface Pro 11). For the v3.3.x
     release, ~0.1% of the user base is on Windows
     11 ARM; the value-to-cost ratio does not
     justify further investment in this decision.

  4. **Source-build fallback is functional.** `nix
     run github:11111000000/math-coding -- <args>`
     works on Windows 11 ARM via WSL2, and produces
     a native aarch64-pc-windows MSVC binary in
     ~90 seconds on a Snapdragon X Elite. The install
     path is documented in `site/install.md` (channel
     4: "source build"). No first-class install
     binary is published, but the path exists.

  Decision recorded as `state: retired`, not
  `state: superseded`. The retirement is unconditional:
  no future revision of this decision is expected to
  reinstate the original outcome without first
  addressing the two technical blockers above (each
  of which is its own workstream candidate, not a
  one-line patch).

obligations:
  - id: matrix-windows-aarch64-removed
    outcome: windows-arm64-release-published
    claim: |
      `.github/workflows/release.yml` does NOT carry
      a `windows-aarch64` matrix entry as of rev 2
      (state: retired, 2026-10-16). The "Verify all
      expected platforms present" step lists 5 (not
      6) required artifacts. The two
      `softprops/action-gh-release@v2` invocations
      DO NOT list `mathc-windows-aarch64.exe*` in
      their `files:` blocks. This obligation
      records the retirement as a positive
      invariant: the windows-aarch64 entry is
      intentionally absent.
    acceptance:
      all:
        - verifier: this-decision-file-present
          result: pass
        - verifier: mathc validate decisions/release-windows-aarch64-binary-2026-10.yaml
          result: pass
        - verifier: yq '.jobs.build.strategy.matrix.include[] | select(.label == "windows-aarch64")' .github/workflows/release.yml | grep -qv '.' || echo "absent: windows-aarch64"
          result: pass
        - verifier: ! grep -q 'mathc-windows-aarch64.exe' .github/workflows/release.yml
          result: pass

  - id: install-ps1-arm64-source-fallback
    outcome: windows-arm64-release-published
    claim: |
      `scripts/install-tooling/install.ps1`'s
      `Get-Arch` function still resolves
      `Arm64 -> aarch64` (so when/if the aarch64
      binary is ever reinstated, no install.ps1
      change is needed). When the aarch64 binary
      is absent (v3.3.x retirement), install.ps1
      falls back to `mathc-windows-x86_64.exe` (x64
      emulation) and the user is directed to the
      source-build path in site/install.md. The
      `Get-Arch` routing code is unchanged from
      rev 1.
    acceptance:
      all:
        - verifier: grep -q "'Arm64' { return 'aarch64' }" scripts/install-tooling/install.ps1
          result: pass
        - verifier: grep -q 'mathc-windows-\$Arch.exe\|mathc-windows-x86_64.exe' scripts/install-tooling/install.ps1
          result: pass

  - id: site-install-documents-arm64-fallback
    outcome: windows-arm64-release-published
    claim: |
      `site/install.md` (en + ru) explicitly
      documents the Windows 11 ARM source-build
      fallback as the recommended install path for
      that platform. Verified by grep on
      `site/install.md` for a mention of
      "windows 11 arm" / "aarch64" / "snapdragon" /
      "source build" and the absence of
      "first-class install".
    acceptance:
      all:
        - verifier: grep -qE 'windows 11 arm|aarch64|snapdragon' site/install.md
          result: pass
        - verifier: grep -qE 'source build|nix run' site/install.md
          result: pass

reversal:
  - signal: arm64-runner-image-fixed
    condition: |
      GitHub's `windows-11-arm` runner image ships a
      Cygwin configuration that exposes a working
      MinGW-w64 ARM64 toolchain (not the i686 fallback)
      and a corresponding opam 2.4.1 patch (or
      successor opam 2.5+) that auto-selects it. A new
      workstream would need to verify against the
      updated runner image, then reinstate this
      decision as `state: superseded` with the new
      workstream's rev.
    action: rework

  - signal: dune-cross-compile-fix
    condition: |
      dune 3.x is fixed so that a `(context
      (default (name ...) (targets ...)))` block
      in `dune-workspace` does NOT reroute default
      `dune build` invocations into the cross
      context. Upstream issue: dune#NNNN (to be
      filed). When fixed, the cross-compile path
      becomes viable and this decision can be
      reinstated.
    action: rework

  - signal: diskuv-prebuilt-adopted
    condition: |
      A future workstream (e.g.,
      `release-windows-aarch64-binary-2026-XX`)
      adopts Diskuv's dkml-installer-ocaml
      prebuilt OCaml 5.4 for win32/arm64 and uses
      it as the bootstrap. This decision is then
      superseded by the new workstream's rev.
    action: archive-obligation


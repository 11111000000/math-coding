outcomes:
  - id: windows-arm64-release-published
    statement: |
      Every GitHub release of math-coding carries
      `dist-bin/mathc-windows-aarch64.exe` alongside the
      existing x86_64 Windows binary. The asset's SHA-256
      appears in `SHA256SUMS`. A user on a Windows 11 ARM
      host running `irm ... install.ps1 | iex` exits 0
      and lands at `mathc version` printing the same
      version string as the tag.

counterexample: |
  "Microsoft's x64 emulation is good enough; users on
   Snapdragon X machines will never notice the
   difference." Counterargument: emulation works for
   hand-written C++ but emits x87-translated code paths
   that OCaml 5.4's `runtime_events` and `domain
   spawn` paths do not officially support under x64
   emulation. Even where emulation succeeds, the
   Microsoft App Assure team explicitly recommends ARM64
   binaries for ARM64 hosts as a forward-compatibility
   posture (deprecation noted in Microsoft's "Arm64
   support for Windows" guidance: x64 emulation on
   Windows 11 24H2 is on a 5-year deprecation glide path
   for native-only workloads).

  "Cross-compiling from an existing x86_64 Windows
   runner is simpler than provisioning a separate
   ARM64 runner." Counterargument: OCaml 5.4 + MSVC +
   FlexLink on a cross-build requires aarch64-pc-
   windows-msvc headers and the Windows SDK ARM64
   component, both of which must be downloaded and
   staged under a non-PATH location because the
   existing `windows-latest` image does not ship them.
   The `windows-11-arm` runner ships them by default
   (per github/actions/runner-images
   `windows11arm-2025-10-2` image revision). Native
   compile on the ARM64 runner is strictly less work.

  "Adding a matrix entry doubles per-release CI minutes
   on Windows; the time budget won't hold."
   Counterargument: GitHub-hosted ARM runners are free
   for public repos under the same minute budget as
   `windows-latest`; for private repos, the billing rate
   for `windows-11-arm` is identical to `windows-latest`.
   The new entry adds at most one successful job's wall
   (P50 ~10 min per the SWE-bench Verified kernel-
   change table; here it is a `single-file-edit` plus
   a 5-min smoke test, P50 ~8 min). One new
   ~$0.08-per-minute-by-2-CPU job per release.


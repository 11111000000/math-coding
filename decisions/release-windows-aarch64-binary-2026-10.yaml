    statement: |
      NOT DELIVERED. This outcome was the rev 1
      commitment. In rev 2 the outcome is
      recorded as: "the windows-aarch64 binary is
      NOT part of the v3.3.x published release
      matrix; users on Windows 11 ARM fall back

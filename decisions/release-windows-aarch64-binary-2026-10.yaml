intent: |
  Original intent (rev 1, 2026-10-15): extend the release
  matrix in `.github/workflows/release.yml` with a Windows
  ARM64 build, producing
  `dist-bin/mathc-windows-aarch64.exe`. The matrix would
  cover seven host families including a native compile
  on GitHub's `windows-11-arm` hosted runner.

  Actual outcome (rev 2, 2026-10-16, state: retired):
  the windows-aarch64 matrix entry is removed. CI runs
  #80–#87 and #125–#128 (post-commit 4c90f51) all
  failed at "Init opam and create OCaml switch" on
  `windows-11-arm` with the same root cause:

      # context 2.4.1 | win32/arm64
      -> installed host-arch-x86_32.1
      -> installed conf-mingw-w64-gcc-i686.1
      C:/mingw64/x86_64-w64-mingw32/include/time.h:12:2:
        error: #error Only Win32 target is supported!

  Root cause: opam 2.4.1 on `win32/arm64` hardcoded-
  selects the i686 MinGW toolchain via Cygwin setup,
  whose Cygwin-hosted GCC bridge does not define
  `_WIN32`. The MinGW-w64 x86_64-w64-mingw32 headers
  then emit `#error Only Win32 target is supported!`
  at OCaml 5.4.0's `make world.opt` step, failing at
  `runtime/sak.exe` with exit 2. This is a
  Cygwin/MinGW/OCaml toolchain layer issue, not a
  Windows ARM64 issue per se.

  Two follow-up approaches were tried in this branch
  (commits 69b6be2, bb1201e, b4a4d96, de43be4, all
  reverted after CI red):

  1. `OCAML_CONFIGURE_OPTIONS="-target aarch64-pc-
     windows-msvc"` in the Init opam step. The env
     var IS exported (echoed at log timestamp 09:39:08Z
     in run 38888597252), but opam 2.4.1's Cygwin MinGW
     selection runs in `opam init` BEFORE the switch is
     created, BEFORE OCaml's configure is reached. The
     env var is silently ignored for the failure
     pathway.

  2. Cross-compile from `windows-latest` (x86_64) to
     `aarch64-pc-windows-msvc` via a `(context
     (default (name aarch64) (targets ...)))` block in
     `dune-workspace` plus `DUNE_CROSS_TARGET=aarch64`
     in the build step. In dune 3.21+, the mere presence
     of a cross context in `dune-workspace` causes ALL
     default `dune build` invocations (no `-x` flag) to
     be rerouted into the cross context (verified
     locally: `dune build bin/mathc.exe` failed with
     "Could not find `ocamlfind' in PATH or
     OCAMLFIND_CONF while cross-compiling with toolchain
     `aarch64-pc-windows-msvc'"). This broke every
     non-aarch64 matrix entry in run 38892258104 (all
     7 jobs failed). The cross context cannot coexist
     with the implicit default context in dune 3.21+.

  The decision is retired (not superseded). Windows 11
  ARM users today fall back to `nix run
  github:11111000000/math-coding -- <args>` (a source
  build) — this is already documented in
  `site/install.md` and works on Windows ARM via WSL2.

  Future workstream candidates (out of scope for this
  retirement):

    - Diskuv dkml-installer-ocaml prebuilt OCaml 5.4
      for win32/arm64 (GitLab releases; was the
      "path B" of the original fix plan).
    - ocaml/setup-ocaml@v3 with explicit aarch64
      cross-compile config.
    - Manual `dune-workspace` rewrite that makes the
      cross context opt-in via a separate workspace
      file (e.g., a build wrapper that copies
      `dune-workspace.cross` into place for the
      windows-aarch64 job only).

  Each requires its own decision under the active
  policy before any attempt. Until then, the published
  matrix covers 5 platforms (linux-x86_64,
  linux-aarch64, darwin-x86_64, darwin-aarch64,
  windows-x86_64). linux-x86_64-musl remains gated by
  `decisions/portable-linux-musl.yaml` reversal signal
  `alpine-ci-build-fails`.

commitment: |
  The release matrix in `.github/workflows/release.yml`
  contains:

    - linux-x86_64      (ubuntu-latest)
    - linux-aarch64     (ubuntu-24.04-arm)
    - linux-x86_64-musl (ubuntu-latest, alpine container; currently disabled)
    - darwin-x86_64     (macos-15-intel)
    - darwin-aarch64    (macos-latest)
    - windows-x86_64    (windows-latest)

  The `windows-aarch64` matrix entry added in rev 1 is
  REMOVED in rev 2. The `release.yml` "Verify all
  expected platforms present" loop lists 5 (not 6)
  required artifacts. The two `softprops/action-gh-
  release@v2` invocations (tag release and `edge`
  prerelease) DO NOT list `dist-bin/mathc-windows-
  aarch64.exe*` in their `files:` blocks.

  Windows 11 ARM users are directed to the source-build
  fallback in `site/install.md` (path: `nix run
  github:11111000000/math-coding -- <args>`, which
  builds the OCaml toolchain + mathc natively on the
  user's machine). `install.ps1` still has the
  `Get-Arch -> 'aarch64'` routing code; it would route
  ARM64 hosts to `mathc-windows-aarch64.exe` if such
  an asset existed, but no such asset is published as
  of v3.3.x. The install script falls back to the
  x86_64 asset on ARM64 hosts (x64 emulation), with a
  warning to the user that the source build is
  preferred.


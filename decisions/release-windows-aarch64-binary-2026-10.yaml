        - verifier: manual-yq-jobs-publish-steps-select-name-test-publish-o
        - verifier: manual-yq-jobs-publish-steps-select-name-test-publish-o

  - id: install-ps1-arm64-routing
    outcome: windows-arm64-release-published
    claim: |
      On a Windows ARM64 host, `install.ps1`
      downloads `mathc-windows-aarch64.exe` (not the
      x86_64 binary) and verifies its SHA-256 against
      `SHA256SUMS`. Verified via static read of
      `Get-Arch` (resolves `Arm64 -> aarch64`) and
      `Resolve-AssetName` (composes
      `mathc-windows-aarch64.exe`).
    acceptance:
      all:

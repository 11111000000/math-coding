      error: "mingw64-i686-gcc-core + Cygwin-hosted GCC + #error Only Win32 target is supported!"
      verdict: native path unachievable with opam 2.4.1
    - signal: dune-build-arm64-binary-cache-miss
      fired_at: 2026-10-16T10:39:08Z
      run: 38888597252
      error: "OCAML_CONFIGURE_OPTIONS exported but ignored; i686 MinGW still selected"
      verdict: env var route unachievable
    - signal: dune-cross-compile-default-reroute

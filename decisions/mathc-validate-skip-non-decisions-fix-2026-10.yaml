schema: math-coding/3.3
id: mathc-validate-skip-non-decisions-fix-2026-10
revision: 1
state: active
body_sha: "sha256:280062501ecb89e126b688dea081339f2b07750cd122c2ef763016f333c58fce"
yaml_sha: "sha256:280062501ecb89e126b688dea081339f2b07750cd122c2ef763016f333c58fce"
intent: |
  Reverts the deferral recorded at
  `decisions/mathc-validate-skip-non-decisions-deferral-2026-10.yaml@1`
  by teaching `mathc validate` to dispatch on the top-level
  `schema:` field before running the decision required-field
  check. Two non-decision schema families live under
  `decisions/`: `math-coding/waiver-*` (waivers in
  `decisions/waivers/`) and `math-coding/obligations-*` (the
  obligations aggregator at `decisions/obligations.yaml`).
  Both fail the decision required-field check today with
  `MC-DECISION-INVALID: missing required field: <id|intent>`
  even though they are well-formed for their own schema family.
  At HEAD `8b9a060` the user has no way to validate these
  files.

  Resolution: a new helper `lib/decision.ml::peek_schema_family`
  returns `Some (kind, id)` when the top-level `schema:` field
  starts with `math-coding/waiver-` (and the file declares
  `kind: waiver`) or with `math-coding/obligations-`. Anything
  else returns `None` and the caller falls through to the
  decision parser unchanged — the decision path is not
  weakened, only the reject set is narrowed for the two
  known non-decision families.

  Strongest countercase considered:
    "Add a `--type=decision|waiver|aggregator` flag to
    `mathc validate` and let the user pick the parser. Auto-
    dispatch on the schema field is convenient but hides the
    family boundary; explicit is better than implicit."
    Rejected because: the project's counter-example and
    attestation codebases already auto-dispatch on the file's
    `schema:` field (e.g. `lib/codec.ml::decode_yaml` and the
    attestation-subject family in `lib/attestations/`), so the
    auto-dispatch is the established pattern. A `--type` flag
    would be a second surface that the user has to learn and
    that future schema families (when added) would have to
    teach.

change_kind: implementation

axiom_link:
  - A0
  - A3

commitment: |
  1. `lib/decision.ml` introduces the `non_decision_kind` type
     (`Waiver | Obligations`) and the `peek_schema_family`
     helper that returns `Some (kind, id)` for the two
     recognised non-decision schema families and `None` for
     everything else.
  2. `bin/Mathc.ml::validate_with_counts` consults
     `Decision.peek_schema_family` BEFORE the
     `first_missing_required` check. On `Some (Waiver, id)`
     it emits `Accept_aggregate { kind = "waiver"; id;
     extra_diags = [] }`; on `Some (Obligations, id)` it
     emits `Accept_aggregate { kind = "obligations"; id;
     extra_diags = [] }`; on `None` the existing decision
     parser runs unchanged.
  3. `bin/Mathc.ml::emit` gains the `Accept_aggregate` arm
     so the new outcome renders correctly in both `--format
     text` and `--format json` modes.
  4. `mathc validate decisions/waivers/audit-0.0.21-fixes-self-check-verdict-is-pass-2026-10.yaml`
     exits 0 with `accept:` (was: exit 1 with
     `MC-DECISION-INVALID`).
  5. `mathc validate decisions/obligations.yaml` exits 0 with
     `accept:` (was: exit 1 with `MC-DECISION-INVALID`).
  6. Every existing decision file continues to pass
     `mathc validate` (regression: the decision parser
     still fires for all 100 decision files at HEAD).
  7. A truncated YAML file still exits non-zero.

counterexample: |
  "Just teach `mathc validate` to ignore waivers and the
  obligations aggregator by their file path (e.g.
  `decisions/waivers/*` and `decisions/obligations.yaml`).
  Path-based dispatch is simpler than schema-based dispatch
  and avoids changing `lib/decision.ml`."

  Counterargument: a future `decisions/migrations/<file>.yaml`
  or a `decisions/aggregators/<name>.yaml` would also need
  path-based dispatch rules, and the rule set grows as the
  schema family grows. The schema-based dispatch auto-extends
  to any new non-decision family whose `schema:` field follows
  the `math-coding/<family>-<version>` naming convention. The
  naming-convention check is the established pattern in the
  project (see `lib/codec.ml::decode_yaml` and the attestation
  family in `lib/attestations/`); the path-based alternative
  is local to the validator and does not generalise.

  "Auto-dispatch on `schema:` is a magic-string check; what
  if a future schema family does not follow the
  `math-coding/<family>-<version>` convention?"
  Counterargument: the project's schema-string-bump discipline
  (see `decisions/schema-string-bump-3.0-alpha-to-3.3-2026-10`)
  mandates the convention; every new family passes through a
  protected transition that records the naming pattern in
  `schemas/*.json`. The dispatch is robust to the project
  discipline, not orthogonal to it.


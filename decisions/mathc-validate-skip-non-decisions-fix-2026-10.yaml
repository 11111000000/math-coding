    state: assumed
    statement: |
      The schema naming convention
      `math-coding/<family>-<version>` is stable for
      every non-decision family; a future waiver or
      aggregator family will continue to follow the
      convention.
    owner: human:maintainer
    consequence_if_false: |
      A future family that does not follow the convention
      would be missed by `peek_schema_family` and fall
      through to the decision parser, which would reject
      it. The remediation is to add the new family to
      the helper's prefix list (one line change) and ship
      a follow-up decision.
    review_on:
      - signal: new-non-decision-schema-family


risk:
  owner: human:maintainer
  declared_triggers:
    - "a rewritten promise is narrowed until it is trivially true -- the next pass must compare the rewritten text against the tree again, not against the old promise"
    - "a rewritten decision drops a rule to make it checkable: the rule that disappears is not visible in the diff of a promise, and the plan's T2.2b is the place to notice"
    - "the UNCHECKED ceiling is raised instead of fallen on the next tranche: a debt that grows while the corpus shrinks is a debt that is being relabelled"
    - "the two new fixtures are the only controls for their decisions and a later change breaks them together with the promise they guard"

assumptions:
  - id: the-inventory-is-a-snapshot-and-not-a-verdict
    state: assumed
    owner: human:maintainer
    statement: |
      The claims inventory of 2026-11-01 is a RECORD of one pass over
      one corpus at one commit, and it is not re-read as a verdict
      about the tree. One of its nine FALSIFIED verdicts was wrong
      (redundancy-census-2026-11), and the way it was wrong was a
      repaired instrument -- which is exactly what a snapshot of a
      moving tree should be expected to be.
    consequence_if_false: |
      If the inventory were treated as a standing verdict, then the
      nine would be re-litigated against the tree on every pass and
      the record would be rewritten every time the tree moved -- the
      snapshot would become a rule, and the rule would be false as
      often as the tree moves.
    review_on:
      - signal: inventory-lines-are-edited

  - id: a-rewritten-promise-is-still-a-promise
    state: assumed
    owner: human:maintainer
    statement: |
      Rewriting a promise does not discharge it. Each of the eight
      rewritten decisions names the control that catches its own
      failure, and the controls are fixtures or cram cases that run
      against the kernel -- not comments, not intentions, and not
      the decision's own text.
    consequence_if_false: |
      If a rewritten promise had no control, it would sit in the
      UNCHECKED class and the tranche would have moved debt around
      instead of paying it. The instrument that says so is
      `tests/fixtures/negative-control-debt.sh`, and the number it
      prints is the report card for this assumption.
    review_on:
      - signal: unchecked-ceiling-stops-falling

      Eight of the nine decisions the claims inventory falsified are
      rewritten as statements about the current tree, each with a
      control that catches its own failure and a raised revision;
      the ninth is left untouched because its promise is true and the
      falsification against it is cancelled.
  - id: the-promise-debt-fell
    statement: |
      The promise debt of the corpus is five decisions smaller than
      it was before the tranche: CHECKED 78 -> 84, UNCHECKED 37 ->

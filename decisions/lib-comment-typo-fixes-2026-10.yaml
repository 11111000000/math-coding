intent: |
  Fix two stale or incorrect textual references inside `lib/`
  OCaml comments that are misleading on first read:

  1. `lib/decision.ml:89` — the comment for `body_canonical_sha256`
     said "The OCaml 5.5 `Str` module does not support the
     `\{n\}` interval quantifier". OCaml 5.5 does not exist; the
     project pins `ocaml >= 5.0` (`math-coding.opam:12`) and the
     parallel trap-log entry at `OCAML_BEST_PRACTICES.md:1019`
     ("§11.1 Str.regexp … OCaml 5.x's `Str` library is a POSIX-style
     regex engine …") uses the family name "OCaml 5.x". The
     comment is corrected to "OCaml 5.x".

  No behaviour changes; the surrounding code already targets
  the POSIX `Str` engine that ships across the 5.x series.
  Behavioural equivalence is preserved by construction: comments
  inside `lib/*.ml` are documentation, not policy-bearing code,
  per `decisions/lib-stale-comments-cleanup-2026-10@1`
  (assumption `comments-not-policy`).

  This file exists because `lib/*.ml` is policy-protected by
  AGENTS.md §Self-application and the `.githooks/pre-commit` P1
  rule, even though the change is editorial. The body is the
  audit trail; see `lib-stale-comments-cleanup-2026-10` for the
  precedent on a similar comment-only cleanup.

change_kind: editorial

axiom_link:
  - A0

commitment: |
  1. `lib/decision.ml:89` reads "OCaml 5.x" (was "OCaml 5.5").
  2. `dune build` succeeds. No OCaml expression is modified.
  3. `tests/body_canonical_test.ml` cases continue to pass; the
     four properties (stability, sensitivity,
     insensitivity-to-placeholder, CRLF-equals-LF) are not
     affected by a comment change.

counterexample: |
  "Comments do not affect behaviour; a typo in a comment does
  not need a decision."

  Counterargument: per AGENTS.md §Self-application, edits to
  `lib/*.ml` ship with a decision regardless of behavioural
  impact, because the OCaml surface is policy-protected. The
  decision body is the audit trail that says "this change was
  considered, the strongest case against was 'no real change',
  and the change was made anyway under heading X". This is the
  same reasoning `lib-stale-comments-cleanup-2026-10` records.

  "A typo fix should be handled in the same commit as a real
  change; spinning off a one-line decision is overhead."

  Counterargument: each decision is the strongest counterexample
  to its own change. Bundling a typo with a real change hides
  the typo from the audit trail (its ROAS-versus-Real-Change
  boundary is invisible). One-issue commits on a single-file
  decision keep the audit trail honest.


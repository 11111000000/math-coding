counterexample: |
  (a) "The corpus's size is not the problem. The gate asks only about
  the decisions a diff touches, so a large corpus costs nothing."
  Rejected for the gate, true for the reader. The gate is scoped, so
  a big corpus does not slow it down; but the corpus is the memory
  the method claims to preserve, and a memory of records reads as
  rules. A reader who opens the corpus cannot tell which is which -
  that is the defect the census makes visible, by counting rather than
  by judging.

  (b) "A census of shape is a census of taste. Somebody will archive
  what somebody else wanted to keep."
  Rejected. The census counts five things that have a definition
  independent of taste: a verifier the kernel cannot execute, a
  relation target that resolves to nothing, a scope path that matches
  no file, a decision file in the corpus, a state field that
  contradicts the directory the file sits in. Which of those
  obligations should be rewritten and which should be dropped is a
  decision, and this decision does not make it - it makes the number
  available to whoever does.

  (c) "The five instruments are enough; a sixth is overhead."
  Rejected: all five measure the store, and the question this plan
  starts from - how much of the corpus is a rule and how much is a
  record - is not a question any of them asks.

antithesis: |
  The opposite claim is that the corpus's shape is not a defect at
  all, and that the six numbers are six more ceilings to maintain:
  each one is a place where a future change can be blocked by an
  arbitrary threshold, and arbitrary thresholds are how instruments
  decay into paperwork.

  The claim is right about the cost, and the answer is the same one
  the other five instruments already gave: the ceilings here are
  measured, monotone, and each one names the thing it measures in a
  line of comment. A ceiling that may only fall is a direction, not a
  gate; the plans that close the distance are the plans that pay it
  down. The alternative - leaving the numbers in prose - is what
  produced 139 decisions against a target of fifty, with nothing
  anywhere saying so.

risk:
  owner: human:maintainer
  declared_triggers:
    - "a decision is archived to make a number smaller instead of to make the corpus true"
    - "a ceiling is raised without a decision recording why"
    - "the census is read as a verdict on the quality of the commitments it counts"
    - "the corpus shrinks by deleting decisions whose obligations the gate still asks about"

assumptions:
  - id: the-kernel-classifies-the-paper-layer
    state: assumed
    owner: human:maintainer
    statement: |
      The kernel's own audit (`mathc gaps --format=json`) is the
      authority on which obligations it cannot execute. The census
      asks it rather than re-implementing the classification, because
      a census that classifies differently from the thing it censuses
      measures the wrong thing.
    consequence_if_false: |
      The paper ceiling would measure something other than what the
      gate sees, and the corpus could grow promises the census calls
      checks. The census would then be the instrument that says the
      corpus is clean.
    review_on:
      - signal: the-kernel-adds-a-verifier-scheme

intent: |
  The corpus of this repository is supposed to be a set of RULES:
  commitments the gate holds the project to. It is also a set of
  RECORDS: what was done, once, in a past tense that still reads like
  a rule. Nothing in the tree said how much of which there was.

  Measured on 2026-10-31 at main b9a0decb, by reading the corpus:

    139 live decision files, 137 of them active, against a declared
    target of about fifty rules (decisions/corpus-final-state-2026-10
    .yaml:64-70). Eighty-six files live in the corpus as rules and
    read as records.

    44 relation targets in the live corpus resolve to nothing: the
    decision they name was deleted, and the claim about it stayed.

    20 scope paths match no tracked file. Five name AGENTS.md
    (renamed to KERNEL_AGENTS.md), four name decisions/plan-2026-10-
    improvements/* (moved to docs/plans/), and the rest name files the
    corpus itself deleted. A scope that names nothing makes the
    materials digest of that decision a digest of nothing, and an
    empty digest is the freshness wildcard: the attestation stays
    fresh for every tree, for ever.

    5 verifier strings carry a YAML quote that broke their scheme
    ('shell-grep-absent ...' and "shell-grep ..."), so the kernel
    reads a scheme that is not in the allowlist. Those obligations
    cannot be executed, and the corpus carries them as promises.

    46 of the corpus's obligations are declarations the kernel cannot
    execute - its own audit says so (mathc gaps --format=json).

    112 of the 120 archived decisions still say `state: active`: the
    rule left the corpus and the field says it applies.

    The normative text (spec/algebra-3.2.md, 1 002 lines) has not
    changed since 2026-10-24 while the code moved 221 commits, and it
    still says "72 active decisions" where there are 137.

  The repository already owns five instruments, and every one of them
  measures the STORE: how much of what the attestations claim was
  checked, how much of the legacy debt is left, how many decisions
  carry no negative control, how much the self-check debt is, how the
  corpus is counted. None of them measures the corpus's own shape.
  So every audit of the corpus began by reading 139 files, and the
  plan that follows (docs/plans/redundancy-and-portability-2026-11.md)
  had no number to order itself by.

commitment: |
  After this decision closes:

  1. The corpus's shape is censused by a fixture, not by prose:
     `tests/fixtures/redundancy-census.sh` measures the paper layer
     (by asking the kernel's own audit), the verifier strings a YAML
     quote broke, the relation targets that resolve to nothing, the
     scope paths that match no tracked file, the size of the live
     corpus, and the archived decisions that still say `state: active`.

  2. Each number is a CEILING. It may fall; it may never rise. A
     number that can be checked but not bounded grows silently, which
     is how the corpus grew from a target of fifty rules to 139
     without anything saying so.

  3. The census has a negative control: a synthetic corpus that
     exceeds every ceiling must be reported as over it, by the paper
     layer the kernel itself classifies and by the corpus-side
     parser. A bound that has never been observed to bind is not known
     to bind.

  4. The census measures the LIVE corpus for the ceilings, and
     reports the archive beside it. The archive is history: its
     dangling targets and dead scopes are what archiving without
     rewriting leaves behind, and they are counted, not judged.

  5. The plan is recorded where a reader will find it:
     `docs/plans/redundancy-and-portability-2026-11.md`. It is a plan,
     not a decision: only the changes of policy become decisions.


counterexample: |
  The counter-position considered and rejected: "10 sub-decisions
  is too many; the experiment surfaced 9 recommendations, not
  10. The extra is gold-plating." Rejected on three grounds.
  (a) C3 (`mathc doctor` verification) was a 4th-positive note
  in §11.1 that deserves an explicit decision, not silent
  omission. (b) The R10 `axiom_link` inference was discovered
  in 5/5 T1 sessions; it is a real friction worth its own
  decision even if the implementation is small. (c) C2 and
  R10 together close the same UX gap.

  A second counter-position: "B1's rename of `accept` to
  `parse-ok` is a breaking change that breaks downstream
  fixtures." Acknowledged: the rename is the most consequential
  sub-decision in the plan. Its acceptance criteria require
  coordinating with `tests/cli/*.t` updates. If a downstream
  fixture fails, B1 is blocked until it passes; the sub-agent
  does not ship a half-renamed binary.

outcomes:
  - id: ten-adoption-fixes-shipped
    statement: |
      10 sub-decisions land on main via 3 batches of parallel
      sub-agent work. Each sub-decision is a separate
      `decisions/*.yaml` file with its own attestation. The
      total wall-clock is approximately 5-7 hours across 10
      sub-agents (4 + 2 + 4 batches at ~30-45 min each); the
      equivalent serial work would have been 4-5 hours but
      without reviewable PRs.


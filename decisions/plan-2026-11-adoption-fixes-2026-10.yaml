intent: |
  Convert the 9 recommendations from the 2026-10-17 adoption
  experiment (`docs/experiments/adoption-2026-10.md` §13) plus
  one additional gap (`mathc doctor` ship status) into 10
  atomic sub-decisions across 3 batches. Each sub-decision is
  independently revertable in one commit; the plan is
  additive to `plan-2026-10-ux-friction` and
  `plan-2026-10-distro-friction`.

commitment: |
  The cycle closes when, for every obligation below, the
  sub-decision exists at `decisions/<id>.yaml` with
  `state: active` and at least one matching attestation in
  `attestations/` whose `kind_` is appropriate; the surface
  change the sub-decision commits to has landed on main; the
  change is exercised by a cram or conformance test; and
  `mathc self-check` returns `verdict: "unknown"` with the
  SAME 17 pre-existing unknown subjects and zero NEW unknown
  subjects.

  Boundaries (A3 self-application):
  - This meta-decision does not itself touch any kernel file
    (`lib/`, `bin/`, `spec/`, `schemas/`, `axioms/`). It is a
    planning artifact.
  - Every sub-decision is independently revertable; the plan
    survives any single sub-revert.
  - The 17 pre-existing unknown subjects are NOT in this
    plan's scope.

  Reversal: a successor `plan-2026-11-adoption-fixes-2026-10`
  may supersede this one; the meta-decision's `state` then
  moves to `archived` per the kernel convention.

axiom_link:

schema: math-coding/3.2
id: considered-mode-migration-2026-10
revision: 1
state: retired
mode: light
body_sha: "sha256:dceb2d5b575ed287cc8e2280bb6218a59b8188ede93c4c3a2562216e57b5c149"
yaml_sha: "sha256:dceb2d5b575ed287cc8e2280bb6218a59b8188ede93c4c3a2562216e57b5c149"

intent: |
  Document the partial migration of the 'Considered' mode variant
  (introduced in commit aae7943) across lib/{gate,policy,risk}.ml
  and the tests that exercise mode-floor ordering. This decision
  records the F4 closure in this commit and the F5 deficit
  that remains in bin/Mathc.ml.

scope:
  paths:
    - "lib/gate.ml"
    - "lib/policy.ml"
    - "lib/risk.ml"
    - "tests/policy_test.ml"
    - "tests/risk_kernel.ml"

commitment: |
  This decision is a partial F4 closure; the F5 deficit in
  `bin/Mathc.ml` (mode-floor ordering under `mode = considered`)
  remains open. Recording the partial work.

outcomes:
  - id: considered-closed-in-lib
    statement: |
      The 'Considered' variant is wired through lib/policy.ml::max_mode_floor
      and through the commit_info.mode field in lib/gate.ml. The mode-floor
      helpers (mode_floor in policy.ml, max_mode in policy.ml, mode_to_int
      in risk.ml) all carry the polymorphic Domain.mode type so the open
      variant is accepted at every call site.
  - id: mathc-ml-paren-deficit-documented
    statement: |
      bin/Mathc.ml:438 has 8 close parens where the validate_with_counts
      function expects 7. This is a pre-existing aae7943 typo that causes
      'dune build @install' to fail with 'Syntax error' at line 438
      characters 79-80. A follow-up commit will need OCaml-parser-aware
      surgery in bin/Mathc.ml.

obligations:
  - id: considered-closed-in-lib
    outcome: considered-closed-in-lib
    claim: |
      With this commit applied, 'dune build lib/mathcoding_core.cmxa'
      succeeds. The 'Considered is not compatible with type' error
      (lib/policy.ml:215 in HEAD) no longer fires.
    acceptance:
      all:
        - verifier: dune build lib/mathcoding_core.cmxa
          result: pass
  - id: mathc-ml-paren-deficit-followup
    outcome: mathc-ml-paren-deficit-documented
    claim: |
      A follow-up decision records the planned surgery in
      bin/Mathc.ml:438 (remove 1 extra close paren and re-verify
      that P_outer, P2, and P4 close cleanly).
    acceptance:
      all:
        - verifier: manual-followup-decision-filed
          result: pass

counterexample: |
  This decision documents a partial closure (F4) of the
  'Considered' mode wiring while leaving the bin/Mathc.ml F5
  deficit (the paren-imbalance at Mathc.ml:438 from commit aae7943)
  open. The strongest objection is that recording a partial-state
  decision with mode: light creates an audit-trail oddity: a future
  reader scanning the decisions table sees a `mode: light` row with
  a "partial closure" commitment and may mistake it for a
  follow-up-on-hold entry rather than a historical closure; the
  intended-reading requires cross-referencing the reversal block
  and the F5 follow-up commitment in `mathc-ml-paren-deficit-
  documented`. Reversal condition: when the bin/Mathc.ml F5 deficit
  closes (the paren imbalance at line 438 is removed and the
  dispatcher handles mode = considered cleanly) this retired
  decision should become a node in the supersession chain rather
  than a standalone record; the future superseder is responsible
  for closing that audit chain.

risk:
  declared_triggers:
    - historical-record-only
  owner: human:maintainer

intent: |
  Close the ten concrete render-kernel defects catalogued in
  `analysis/site-render-defects.md` (commit-diagnostic branch
  `fact-site-render-analysis`, 2026-10-07). The defects fall
  into three buckets:

    Bug fixes (kernel) — six defects in `lib/render.ml`:
      fenced code blocks (lines 372, 258), list-item
      continuation, italic emphasis, MathJax snatching
      parenthetical text, packages-page grid missing,
      RU-nav pointing at non-existent siblings, axiom-page
      duplicated `<h1>`, footer hard-coded "mc render".

    Surface patch (CSS + footer text) — three defects:
      the live `assets/style.css` is pinned to a tree that
      used the old `mc-*` class names (deployed before
      `cli-canonical-name@2`); the footer text says `mc render`,
      not `mathc render`. Both are fixed by re-deploying after
      this kernel cycle lands.

    Local-preview fix — one defect: `<base href="/math-coding/">`
      breaks local `python3 -m http.server` preview by making
      CSS/asset URLs resolve under a non-existent subpath.

  Each fix is paired with at least one positive and one
  negative fixture in `tests/render_kernel.ml`; a cram snapshot
  in `tests/cli/render.t` checks the produced `dist/` tree for
  the previously-broken artefacts.

  History:
    rev 1 (this commit): initial adoption. Closes the 10
    defects listed in `analysis/site-render-defects.md` (2026-10-07).

commitment: |
  `mathc render --out dist --lang=both` produces a static site
  in which:

    1. Every fenced code block (```` ```lang ... ``` ````) in
       `site/*.md`, `axioms/*.md`, and `decisions/*.md` excerpts
       renders as `<pre><code class="language-lang">...</code>`
       (or `<pre><code>` when no language is given, or
       `<div class="mermaid">` for `mermaid` fences). ASCII art
       diagrams in `axioms/*.md` keep their line breaks.

    2. Multi-line list items in `site/*.md` render as one
       `<li>` per item, with continuation lines joined by a
       space (matching the previous in-prose convention). No
       spurious `</ul>` between the first and last line of an
       item.

    3. `*italic*` (single asterisk) renders as `<em>italic</em>`.
       Lone asterisks without pairing stay literal.

    4. MathJax 3 is wired in the kernel but defaults to OFF
       (`enable_mathjax = false`). No page in `site/*.md` or
       `axioms/*.md` currently contains `$…$` or `\[…\]` math,
       so the default-off does not regress the rendered output;
       it does prevent MathJax from typesetting English words
       in parentheses as math italics. The kernel still emits
       the MathJax `<script>` when `enable_mathjax = true` is
       passed, so future pages with formulas keep the path.

    5. `dist/packages.html` carries the live package grid
       (`<section class="mathc-packages-section">` followed by
       the `mathc packages --format=html` HTML), below the prose.
       `dist/index.html` continues to carry the grid.

    6. The Russian nav links to `<name>.ru.html` only when
       `site/<name>.ru.md` exists. For pages without a Russian
       sibling (currently `methodology`, `workflow`, `faq`),
       the EN page's `RU` toggle is omitted.

    7. Per-axiom pages (`dist/axioms/<id>.html`) carry exactly
       one `<h1>`. The `render_axiom_page` template no longer
       prepends a synthetic `<h1>` when the source's first
       line is already a top-level heading.

    8. The footer text reads `mathc render` in both the English
       and Russian templates.

    9. `<base href>` remains `/math-coding/` by default for
       GitHub Pages compatibility. A `--site-base ""` (or any
       other value) CLI flag passes the value through to every
       page; `tests/render_kernel.ml::base_href_default` and a
       new `base_href_local_empty` test cover both branches.

  Boundaries:
    - This cycle does not change `lib/packages.ml`, the
      attestation store format, or the schema files.
    - This cycle does not alter the `site-deploy@5`
      obligations. The existing `extended-markdown-subset`
      obligation already names italic; this cycle closes the
      implementation gap.
    - This cycle does not retire `mathjax-wiring`; it amends
      the default off while keeping the script on the code path.


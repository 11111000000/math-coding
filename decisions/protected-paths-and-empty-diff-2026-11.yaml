risk:
  owner: human:maintainer
  declared_triggers:
    - "the protected-path list is edited"
    - "a consumer stops reading scripts/protected-paths.txt"
    - "the gate's change-set handling is changed again"

assumptions:
  - id: the-union-is-the-right-resolution
    state: assumed
    owner: human:maintainer
    statement: |
      The right answer to "three lists disagree" is their UNION, not
      their intersection and not a negotiation between the three
      consumers. The union never weakens a protection; the
      intersection silently drops one, and a negotiation is a
      decision this file does not make.
    consequence_if_false: |
      If the three former lists were three deliberate policies rather
      than three drifted spellings, the union over-protects: the
      hook would demand a decision beside a change to the installer,
      and the release gate would fire for a change to the axioms. The
      remedy would be a list with SECTIONS -- one per consumer -- and
      the check would compare each section against its consumer. The
      machinery for that is already here: the matcher reads a list of
      patterns, and a sectioned list is a list of patterns plus a
      section name.

  - id: the-list-is-project-data-not-protocol
    state: assumed
    owner: human:maintainer
    statement: |
      The protected paths belong to the PROJECT, not to the
      protocol: an adopter's protected paths are the adopter's
      business, and the kernel must not carry this repository's
      answer. The list therefore lives outside the kernel and is
      read at the I/O boundary; a project that declares none has no
      protected paths, and the §20 CoCommitDecision rule is inert
      there.
    consequence_if_false: |
      If the kernel is to carry a DEFAULT protected-path list for
      adopters, the default has to live somewhere the kernel can
      read, and `mathc init` has to write it -- which is the
      scaffold tranche's business (T1.3a), not this one's. Until
      then an adopter's gate has no protected paths, and the honest
      answer to "which paths must carry a decision" for that project
      is "the ones it declares".

  - id: an-empty-list-is-not-an-error
    state: assumed
    owner: human:maintainer
    statement: |
      An ABSENT protected-path list means "this project declares no
      protected paths", and it is not a failure. A list that exists
      but cannot be READ is a failure, and the shell matcher exits 2
      on it so that a caller can fail closed rather than treat it as
      "nothing is protected".
    consequence_if_false: |
      If a missing list must be an error, the gate has to exit
      non-zero when the file is absent, and every project without one
      -- every adopter -- would have a gate that cannot run at all.
      The repository's own protection against a silent deletion is
      the fixture that asserts the list exists and is non-empty.

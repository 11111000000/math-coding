intent: |
  Cut first-run friction on Windows, macOS, and Linux to
  "one command → `mathc version` exits 0". Today's install
  surface (4 channels: release binary, Docker image, Nix
  run, source build) is correct but uneven: Linux glibc
  has a working `curl | sh`; macOS has the same; Windows
  is unaddressed (install.sh explicitly refuses
  MINGW/MSYS/CYGWIN hosts); Alpine picks the wrong
  libc variant by default; `~/.local/bin` isn't auto-added
  to the user's shell RC; the Windows binary is shipped
  but not in SHA256SUMS; no package-manager manifests
  ship in the repo; no `mathc update` self-update; no
  `mathc doctor` diagnostic; no signed-binary cosign
  (only the Docker image is signed); no ARM64 Windows
  variant; no ARM64 Docker manifest.

  This plan is the meta-decision covering 13 sub-decisions
  across three batches (critical-distro / mid-distro /
  long-tail-distro) so that each sub-decision is small,
  reviewable, and revert-able in one commit, while the
  dialectical resolution for each (counterexample +
  considered antithesis) is captured here for the audit
  trail. The 5 critical items (D1-D5) land in this worktree
  on this branch; the remaining 8 (D6-D13) land in
  dedicated subagent worktrees in parallel, each opening
  its own PR against main after merge of the meta-decision.

commitment: |
  The cycle closes when, for every obligation below:

    (a) a sub-decision exists at
        `decisions/<id>.yaml` with `state: active` and at
        least one matching attestation in `attestations/`
        whose `kind_` in {test, build, review} appropriate
        to the change;
    (b) the surface change the sub-decision commits to has
        landed on main and is exercised by a cram test or
        conformance suite where the change is executable;
    (c) `mathc self-check` returns `verdict: "unknown"`
        with the SAME 5 pre-existing unknown subjects
        (placeholder-sha-cleanup, enable-counters-drift-test,
        constitution-header-3-3-update,
        re-eval-remediation-todo-fix,
        attestation-waiver-policy-schema-bump-3-3) and
        zero NEW unknown subjects.

  Boundaries (A3 self-application):
    - This meta-decision does NOT itself touch any
      kernel file (`lib/`, `bin/Mathc.ml`, `spec/`,
      `schemas/`, `axioms/`); it is a planning artifact.
    - Each sub-decision is independently revert-able in
      one commit; the plan survives any single sub-revert.
    - The 5 pre-existing unknown subjects are NOT in this
      plan's scope.

  Reversal of the existing
  `install-tooling-default-tag-edge-2026-10` decision
  (D13 obligation below) is the one meta-policy change in
  this plan; it follows A3 protocol — a separate decision
  (`install-tooling-default-tag-stable-2026-10.yaml`)
  revises the prior under the current active policy, with
  the prior decision explicitly listed in
  `relations.revises`.


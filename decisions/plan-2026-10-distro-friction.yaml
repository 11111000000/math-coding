    outcome: thirteen-distro-improvements-shipped
    claim: |
      `decisions/ux-3-install-ps1-2026-10.yaml` exists
      with state: active. `scripts/install-tooling/install.ps1`
      implements the PowerShell one-liner installer for
      Windows hosts. The script: (a) takes no argument
      by default and downloads the latest tagged release;
      (b) downloads `SHA256SUMS` and the matching
      `mathc-windows-x86_64.exe` from the same release;
      (c) verifies the binary's SHA-256 against the
      SUMS via `Get-FileHash -Algorithm SHA256`; (d)
      installs to `%LOCALAPPDATA%\Programs\mathc\mathc.exe`;
      (e) idempotently adds that directory to the user
      PATH via `[Environment]::SetEnvironmentVariable(
      'Path', …, 'User')`; (f) prints the version from
      `mathc version` for confirmation. Invoked via
      `irm https://…/install.ps1 | iex`. Exits 0 on
      success.
    acceptance:
      all:
        - verifier: file-exists decisions/plan-2026-10-distro-friction.yaml
          result: pass

reversal:
  - signal: plan-superseded
    condition: |
      A successor `plan-2026-11-distro-friction` or similar
      is recorded with `supersedes:
      [plan-2026-10-distro-friction@1]`. Migration path:
      every still-open obligation is closed under the
      successor or recorded as waived.
    action: rework

  - signal: cycle-diverges
    condition: |
      The cycle exceeds 4 months without closing all 13
      obligations. Resolution: split into
      `plan-2026-10-distro-friction-A` (D1-D5),
      `…-B` (D6-D9), `…-C` (D10-D13) with explicit
      per-cycle scope.
    action: rework

  - signal: sub-decision-reverted
    condition: |
      Any of the 13 sub-decisions is reverted in
      `git log` after the plan closes. The plan's
      corresponding obligation is moved to `state:
      archived` (not deleted) with a `reversal_note:`
      field recording the reverted sub-decision's SHA.
    action: archive-obligation

  - signal: axiom-violation
    condition: |
      A sub-decision under this plan is found to violate
      any of I1-I14 from `spec/constitution.md` or
      A0-A4 from `axioms/`. The offending sub-decision
      is rejected; the corresponding T-obligation here
      remains open.

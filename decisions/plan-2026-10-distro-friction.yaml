    claim: |
      `decisions/ux-3-install-path-auto-add-2026-10.yaml`
      exists. The `install.sh` script, after a successful
      install, detects whether the chosen `$install_dir`
      is already on `$PATH`; if not, and the user's shell
      is `bash`/`zsh`/`ksh`/etc., it idempotently appends
      `export PATH="$install_dir:$PATH"` to the matching
      shell RC (`~/.bashrc`, `~/.zshenv`, `~/.kshrc`,
      `~/.profile` as fallback). The append is gated
      behind a `--no-path-update` flag (default = on).
      Idempotent: re-running does not produce duplicates
      (`grep -q 'install_dir' <rc>` guard). On
      installation failure, no shell RC is modified.
    acceptance:

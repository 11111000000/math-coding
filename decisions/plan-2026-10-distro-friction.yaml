outcomes:
  - id: thirteen-distro-improvements-shipped
    statement: |
      13 sub-decisions landed on main via this meta-decision.
      The 5 critical (D1-D5) land in this branch /
      worktree; the 8 long-tail (D6-D13) land in dedicated
      subagent worktrees opened from main after this
      branch is merged. Each sub-decision is a separate
      `decisions/<id>.yaml` with its own attestation. The
      user's first `curl|sh` (or `irm|iex`) command exits 0
      with `mathc version` on Linux, macOS, Windows,
      WSL, Git-Bash, MSYS, Cygwin, and Alpine, without
      manual PATH editing, without manual SHA-256
      verification, and without manual downloading.

counterexample: |
  "13 sub-decisions is too many; this is gold-plating.
   The friction is in the agent's prompt, not in the
   user-facing surface." Counterargument: each
   sub-decision is measurable in user time per first
   install (curl|sh on Windows = "doesn't work"; first
   install on clean container = "binary links wrong
   libc"; first install on Ubuntu LTS without
   ~/.local/bin on PATH = "command not found"). The
   cumulative effect is a single command that works on
   all 4 host families. Per-sub-decision reversibility
   is preserved: any D6-D13 may individually revert
   without invalidating the others.

  "Subagent delegation introduces nondeterminism; this
   plan should be implemented serially." Counterargument:
   the subagents run in dedicated worktrees (no
   shared file state), produce separate commits on
   separate branches, and are bounded by the obligation
   YAML in this decision. Each subagent's work is
   reviewer-checkable independently. Parallel wall-clock
   for D6-D13 is ~30-50 minutes vs. 80-150 minutes
   serially (table in AGENTS.md §"Honest time reference
   class", worst-case combinations).

  "Winget / scoop / brew taps are out of scope for a
   math-coding release; they require external review."
   Counterargument: the math-coding repo holds the
   manifest source under `tools/<packager>/` so a
   maintainer can submit the PRs to upstream without
   ad-hoc authorship. The external review latency
   (Microsoft: 1-7 days; Homebrew: hours; Scoop:
   hours) is bounded; the meta-decision obligation
   closes on PR-submission, not on PR-merge.

  "Reversing the channel-default decision is
   unprotected A3 work." Counterargument: the
   reversal is its OWN sub-decision
   (`install-tooling-default-tag-stable-2026-10.yaml`)
   under the active policy, with `relations.revises`
   naming the prior. The reversal decision and its
   attestation land in the same commit as the code
   change; this is the standard A3 procedure, not a
   bypass.

assumptions:
  - id: per-sub-decision-policy
    state: assumed
    statement: |
      Each sub-decision is authored under the active
      policy `bootstrap-v3@3` (or its successor) with
      the appropriate A3-protected transition for
      kernel-touching changes. The four sub-decisions
      that touch the kernel (D9 `mathc update`, D10
      `mathc doctor`) carry the kernel exclusions and
      `axiom_link: A0, A3` per convention.
    owner: human:maintainer
    consequence_if_false: |
      A sub-decision authored under a weaker policy
      would weaken the gate for the changes it
      introduces. The cycle halts; the offending
      sub-decision is rejected or superseded.
    review_on:
      - signal: sub-decision-policy-drift

  - id: verdict-stability-precondition
    state: assumed
    statement: |
      The 5 pre-existing unknown subjects in
      `mathc self-check` (placeholder-sha-cleanup,
      enable-counters-drift-test,
      constitution-header-3-3-update,
      re-eval-remediation-todo-fix,
      attestation-waiver-policy-schema-bump-3-3) are
      not in this plan's scope.
    owner: human:maintainer
    consequence_if_false: |
      If any change in this plan causes a regression on
      the 5 pre-existing unknown subjects, that change
      is reverted and the corresponding obligation stays
      open.

  - id: parallel-subagent-isolation
    state: assumed
    statement: |
      Each subagent for D6-D13 operates in its own
      Paseo-managed worktree, branched from `main` at
      the post-merge commit of this meta-decision. No
      two subagents edit the same file simultaneously.
    owner: human:maintainer
    consequence_if_false: |
      Two subagents may simultaneously edit
      `release.yml` (e.g., D6 cosign + D8 ARM64 docker
      both touch it). Resolution: one subagent's PR
      blocks until the other merges; the blocked PR
      rebases, then merges. No data loss.

obligations:

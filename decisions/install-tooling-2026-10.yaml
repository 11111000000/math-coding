reversal:
  - signal: install-tooling-bumped
    condition: |
      Either:

      (a) The kernel API changes (in `lib/` or `bin/Mathc.ml`)
          and the install script needs to surface the change
          (e.g. a new required flag, a new dependency); OR

      (b) An opencode / Nix / Docker user reports a UX
          defect that requires a surface change; OR

      (c) The musl release asset lands
          (`docker-alpine-impl-pending.yaml` reversal signal
          fires) and the install script must surface the
          Alpine image as a fourth channel.
    action: rework


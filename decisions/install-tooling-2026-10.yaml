counterexample: |
  "Releasing an install.sh is a security risk: a malicious
   actor who compromises the release pipeline can swap the
   script and have every user run arbitrary code via
   `curl | sh`." Counterargument: (a) the script's SHA-256
  is published as `SHA256SUMS` alongside the binary, and a
  security-conscious user can verify the script's digest
  against the same release tag they trust; (b) `curl -fSL`
  fails on a non-200 response and on a `Location:` redirect
  to a different host (the L flag); (d) `set -eu` aborts on
  any uncaught failure, and the script's exit code is
  surfaced in the user's shell. The threat model is
  bounded: a release-pipeline compromise affects every
  binary anyway, not just `install.sh`.

  "Why publish install.sh as a separate asset rather than
   embed it in `mathc self-check`'s output?" Counterargument:
  `install.sh` must be reachable BEFORE `mathc` is installed
  (the typical case is "I just learned about math-coding and
  I do not have it on my machine yet"). Embedding it in the
  binary's output would defeat the affordance.

  "Docker introduces a new attack surface (the image's
   build pipeline)." Counterargument: the Docker image is
  built from the same `mathc` binary that ships as a release
  asset, copied from `result/bin/mathc` in stage 1 to
  `/usr/local/bin/mathc` in stage 2. There is no
  image-specific code; the surface is the same nix flake
  that produces every release. A compromise of the flake
  compromises every artifact, not the Docker path
  specifically.

assumptions:
  - id: release-pipeline-trusted
    state: assumed
    statement: |
      The GitHub release pipeline (release.yml + tag push) is
      trusted to publish binaries and `install.sh` without
      tampering. This is the same trust assumption as the
      existing 5 release binaries.
    owner: human:maintainer
    consequence_if_false: |
      A compromised release pipeline can ship a malicious
      `install.sh` and the SHA-256 verification defends only
      against a MITM, not against a compromised pipeline.
      The mitigation is cosign signature on `install.sh`
      (out of scope for this cycle; tracked separately).
    review_on:
      - signal: cosign-signature-missing
  - id: opencode-skill-path-stable
    state: assumed
    statement: |
      opencode reads skills from
      `${XDG_CONFIG_HOME:-${HOME}/.config}/opencode/skills/`
      as of opencode ≥ 1.0.0. The path is not a project
      surface.
    owner: human:maintainer
    consequence_if_false: |
      If opencode changes the skill path, `--user-skill`
      writes to a directory the agent does not read; the
      upgrade silently fails. A follow-up cycle would
      update the script's anchor path.
    review_on:
      - signal: opencode-skill-path-changed
  - id: curl-supports-fsl
    state: assumed
    statement: |
      `curl` on every supported platform supports `-fSL`
      (fail on HTTP error, follow redirects, show errors).
      curl ≥ 7.x has had these flags for over a decade.
    owner: human:maintainer
    consequence_if_false: |
      On a system without `-L` (very old curl, custom
      build), the script cannot follow the GitHub release
      redirect chain and exits 2. The script's usage line
      lists this as the explicit fallback.
    review_on:
      - signal: curl-fsl-missing


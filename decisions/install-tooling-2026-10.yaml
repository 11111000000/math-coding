intent: |
  Replace the hand-curated `wget | chmod` adoption path in
  `adoption/SKILL.md:55-60` with a self-installing suite. The
  current adoption SKILL tells every user to copy a five-line
  bash fragment that downloads a release binary, chmod's it,
  and prints a hello. The fragment works, but it does not:

  - verify the SHA-256 of the downloaded binary;
  - survive corporate proxies or distro-specific glibc
    mismatches;
  - give sandbox-bound users (Docker, Nix, restricted CI)
    a second path;
  - install the per-repo or per-user skill bundle alongside
    the binary.

  After this cycle, the user-visible adoption flow is:

    curl -fsSL https://github.com/11111000000/math-coding/releases/download/v3.3/install.sh | sh

  (or with `--user-skill`, `--with-docker`, `--print-nix-command`)
  and the script:

    1. detects the OS/arch via `uname -sm`;
    2. downloads `SHA256SUMS` and the matching
       `mathc-<os>-<arch>` asset from the same release;
    3. verifies the binary with `sha256sum -c` (or
       `shasum -a 256 -c` on macOS);
    4. installs to `${HOME}/.local/bin/mathc` (or the Windows
       equivalent under `%LOCALAPPDATA%`);
    6. (optionally) installs the per-user skill to
       `${XDG_CONFIG_HOME:-${HOME}/.config}/opencode/skills/math-coding/SKILL.md`;
    7. (optionally) prints Docker / Nix-run invocations;
    8. runs `mathc version` for confirmation.

  Same script ships as a release asset next to `SHA256SUMS` and
  the binaries; the curl URL is stable across releases.

  Audit reference: `OCAML_BEST_PRACTICES.md` §10.1 (kernel
  offline, adapters in sub-libraries); `AGENTS.md` "A1
  Feedback" (every commitment has a path to observation);
  `decisions/site-version-from-file-2026-10.yaml@1` (the
  render side already reads VERSION from a file; this cycle
  extends the same single-source-of-truth discipline to the
  install path).

  History:
      rev 1 (this commit): initial adoption. Phase 1 of
      install-tooling-2026-10 work; closes the follow-up at
      site-version-from-file-2026-10.yaml:76-81 and ships
      four install channels.

axiom_link:
  - A0
  - A1
  - A3
  - A4

antithesis: |
  The counter-position considered and rejected: "The current
  `wget | chmod` adoption path is fine; nobody has complained
  about it; adding an installer is gold-plating." The author
  engaged with this position and rejected it on five grounds:
  (a) the current path has no SHA-256 verification, so a
  network MITM can swap the binary and the user will not
  notice until `mathc validate` quietly fails on a real
  decision — A4 (Care) requires the user to be able to trust
  the byte-for-byte artifact they downloaded; (b) Alpine,
  NixOS, and corporate-restricted environments cannot run
  the glibc-linked binary and have no documented escape
  hatch (the only existing one is "wait for a future release
  with musl support", which is not a path); (c) the
  per-user skill pipeline is currently described in prose in
  `adoption/SKILL.md` Step 1.5 and not actually wired; (d)
  the skill itself drifts from the binary's `VERSION` — W1
  fixed the skill-vs-binary drift, but a user who already
  has the skill installed still needs an upgrade path; (e)
  `curl | sh` is the de facto standard for tools in this
  class (rustup, nvm, asdf); adopting the same affordance
  reduces adoption friction.

commitment: |
  1. `scripts/install-tooling/install.sh` is a POSIX-sh script
     (~250 lines) with the following modes:

       --user-skill       install the per-user opencode skill
                          at `${XDG_CONFIG_HOME:-${HOME}/.config}/
                          opencode/skills/math-coding/SKILL.md`.
       --upgrade          (implies --user-skill) overwrite the
                          existing skill even if its version
                          pin matches.
       --with-docker      print a `docker pull` + `docker run`
                          invocation; do NOT auto-execute.
       --print-nix-command
                          print `nix run github:.../math-coding`
                          command; do NOT auto-execute.
       --version=<X>      override the default version
                          (default is whatever `sync-version.sh
                          --write` recorded in
                          `MC_VERSION_DEFAULT`).
       --check            exit 0 if the installed binary at
                          `${HOME}/.local/bin/mathc` already
                          matches the remote artifact AND the
                          skill (if present) matches the remote
                          SKILL.md. Exit 1 otherwise.
       -h | --help        print usage.

     Without `--user-skill`, the script only installs the
     binary. The two flows are independent; users that do not
     run an opencode-compatible agent do not pay the skill-
     installation cost.

  2. `scripts/install-tooling/install.sh` exits 0 on a
     successful install, 1 on a SHA-256 mismatch (the binary
     file is removed before exit), 2 on input error (unknown
     OS/arch, unknown flag, missing `--version` argument), and
     124 on a network error (`curl` exit non-zero).

  3. `scripts/install-tooling/templates/active-policy.yaml`
     ships in the same tarball as `install.sh`. The file is
     a verbatim copy of `decisions/decision.yaml` (the
     active policy at the moment the install tarball was
     built). New projects copy this file into their own
     `decisions/decision.yaml` and adjust `scope.paths[]`.

  4. `Dockerfile.debian-slim` is a multi-stage Dockerfile
     that builds `mathc` via `nix build .#default` and
     copies the resulting binary into a `debian:bookworm-slim`
     final stage. ENTRYPOINT is `["mathc"]`. The image is
     published to `ghcr.io/11111000000/mathc:<VERSION>`.

  5. `.github/workflows/docker.yml` builds and publishes the
     image. Per `OCAML_BEST_PRACTICES` §11.26, `container:`
     is at the JOB level, never under `strategy.matrix.include`.
     Cross-arch (arm64) is `if: false` for rev 1; a follow-up
     cycle wires QEMU emulation.

  6. `flake.nix` gains `apps.<system>.default` exposing
     `nix run github:11111000000/math-coding -- <args>`.
     This is the no-install path for Nix users.

  7. `.github/workflows/release.yml` adds three artifacts to
     every release:
       - `dist-bin/SHA256SUMS` (sha256 of every `mathc-*` binary);
       - `dist-bin/install.sh` (verbatim copy of
         `scripts/install-tooling/install.sh`, chmod +x);
       - `dist-bin/dist-adoption.tar.gz` (already produced by
         `scripts/dist-adoption.sh`; added to the `files:`
         list of `softprops/action-gh-release@v2`).

  8. `OCAML_BEST_PRACTICES.md` gains §11.28 ("curl | sh
     install script and -fSL flags") and §11.29 ("Docker
     buildx bake and QEMU cross-arch pitfalls").

  Boundaries (A3 self-application):

  - This decision does NOT change `lib/`, `bin/`, `spec/`,
    `schemas/`, or `axioms/`. The install surface is
    outside the kernel (per `OCAML_BEST_PRACTICES` §1.3
    "kernel offline and side-effect-free").
  - This decision does NOT touch `decisions/decision.yaml`.
    The active policy stays where it is; the install path
    copies it as a template.
  - This decision does NOT introduce the Alpine image. That
    is deferred to Phase 3 per
    `decisions/docker-alpine-impl-pending.yaml`.
  - This decision does NOT introduce the MCP server. That is
    deferred to Phase 2 per
    `decisions/mcp-server-impl-pending.yaml`.

  Migration path (A3):

  - For users on the existing path (wget|chmod), nothing
    changes. The script is additive.
  - For users with `~/.local/bin/mathc` already installed,
    re-running `curl ... | sh` is a no-op when the version
    matches (`--check` mode); otherwise it overwrites in
    place.
  - For users in corporate environments that block
    `raw.githubusercontent.com`, the script supports
    `--version=<X>` and prints a manual download
    fallback on exit 124.

  Rollback / forward-recovery:

  - The script is shipped as a release asset. A user with
    a broken install simply does NOT re-run `curl | sh`;
    their previous binary survives.
  - The Docker image is a separate asset; an image with a
    bad build does not affect the binary or the per-user
    skill.
  - The `flake.nix` change is additive (new `apps.default`
    stanza); removing the stanza restores pre-this-commit
    behaviour with no other code paths affected.

  Decision diff (A3 §Self-Application #6):

  - Pre-this-commit: `mathc` is installed only by hand.
  - Post-this-commit: `mathc` is installed by `curl | sh`,
    `docker run`, `nix run`, or `source build`. The kernel
    verdict is unchanged (the install path does not feed
    back into the gate).
  - New verdicts: `mathc validate templates/active-policy.yaml`
    must `accept`. `mathc self-check` must remain
    `unknown` with no new `unknown` subjects (the existing
    `audit-0.0.21-fixes` waiver deficit stays at 1).


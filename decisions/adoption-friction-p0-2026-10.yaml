counterexample: |
  Two counter-positions considered and rejected.

  (a) "The flow-sequence branch is a parser feature, not a fix: the
  corpus does not use the bracket form, so nothing is broken." Rejected
  on the measurement: the corpus does use it — `paths: []`,
  `supersedes: []` and `declared_triggers: []` appear in four
  decisions — and it reads those as the STRING "[]", not as an empty
  array. And the form the adopter is told to use, in the skill
  document and in the MC-AXIOM-LINK-MISSING diagnostic itself, is
  `axiom_link: [A0]`, which the parser could not read. The parser was
  not merely missing a feature; it was missing the form its own
  documentation recommends.

  (b) "The store resolver and the digest tree are two bugs in one
  place, so one decision cannot cover them." Rejected: they are two
  bugs in one PLACE, not one bug in two places. The first made the
  gate read a directory the writer never wrote to; the second made
  the writer compute a number over a different tree than the reader
  computed it over. Both are the same question asked twice with two
  answers, and the project's own decision
  `kernel-fixes-found-bugs-2026-10@1` already named the pattern:
  "the resolver asked a different question than the rest of the
  kernel used".

  (c) "The verification cycle should not start failing while the
  corpus is red — that would block every change until the backlog is
  paid." Rejected, and this is the strongest objection: the cycle
  reporting success over a red repository is the defect, not the
  fix. The corpus has one failing subject, measured, and it is pinned
  as a ceiling by `tests/fixtures/failing-subject-backlog.sh`. The
  operator sees the failure and can decide; a green light over a red
  repository lets them decide nothing. The fix is the cycle telling
  the truth, and the cost is one visible red line in a log that has
  been lying about it.
antithesis: |
  The opposite claim would be that the adoption friction is the PRICE
  of the protocol: a method that ties every change to a written
  commitment, a list of obligations and bounded evidence is not
  supposed to be free, and a project that cannot pay seven commands
  for its first decision is not the kind of project this protocol is
  for.

  That is a real claim, and it is rejected for a mechanical reason
  rather than a rhetorical one. The friction measured here is not the
  protocol's friction — it is the kernel contradicting itself. Twelve
  commands where seven are needed, five of them thrash, a scaffold
  the next command rejects, a diagnostic that recommends a form the
  parser cannot read, a gate that looks in a directory nobody wrote
  to, and a digest that is computed over two different trees by the
  two parties that must agree on it: none of that is the price of
  writing down a commitment. It is the cost of six defects that the
  protocol's own rules would have caught if the rules were wired to
  the kernel that enforces them. The price of the protocol is the
  decision and the evidence; the twelve commands were the defects.

intent: |
  Make the protocol usable by a project that adopts it, at the cost of
  the fewest agent turns, with every check fast enough to run on every
  change.

  The 2026-10-26 audit of this repository measured the friction the
  methodology creates for an adopter, by running the documented path in
  an empty project with the released binary. The path was twelve
  commands long, five of which were thrash caused by the kernel
  contradicting itself, and it could not end in a green check at all:
  `mathc self-check` reported `unknown` and exited 3 for ever, because
  the store the gate read and the store the writer wrote were two
  different directories. The project could adopt the protocol and never
  see it pass.

  The audit also found the same disease in the kernel's own machinery,
  at three levels: the YAML parser had no branch for the flow sequence
  (`key: [a, b]`), so the form the diagnostic itself recommended was
  silently read as a string; the gate compared a materials digest
  computed over the project root against one computed over a subtree of
  it, so the two could never be equal; and the verification cycle
  printed the self-check's exit code and then ignored it, so the cycle
  reported "every stage passed" over a repository whose own self-check
  said `fail`.
axiom_link:
  - A0
  - A1
  - A2
commitment: |
  Six defects, each with a fixture that fails against the pre-fix
  binary and passes against this one.

  (a) lib/codec.ml gains a YAML 1.2 §7.4 flow-sequence branch. A
      value in bracket form is now an array. The consequences that
      mattered: `axiom_link: [A0]` is read (the field used to be
      ABSENT, and the decision was rejected with
      MC-AXIOM-LINK-MISSING by a diagnostic that recommended exactly
      that form), and `scope.paths: ["src/**"]` is read (the scope used
      to be EMPTY, and an empty scope makes the materials digest a
      digest of nothing — the freshness wildcard, for ever). A value
      that starts with '[' but does not balance is NOT read as a
      sequence: the parser falls back to the scalar reading, so a
      malformed file is reported by the schema, not by a guess.

  (b) bin/Mathc.ml::resolve_store_root uses
      `Path_config.resolve_attestations_dir`, the same resolver the
      writers use, instead of the hard-coded pre-3.4 path. One
      resolver, one default.

  (c) bin/Mathc.ml::scope_digest_map takes the PROJECT ROOT as an
      argument instead of deriving it from the parent of the decisions
      directory. Under the forward layout that parent is
      `.math-coding/`, and `git ls-tree` is CWD-relative, so the
      producer's scope matched nothing and it wrote the digest of
      nothing — a value the gate, anchored at the project root, never
      computed. The producer and the verifier now read the same tree.

  (d) `mathc new-decision` defaults to the template the kernel
      ACCEPTS. The pre-fix default template lacked `axiom_link` and
      `counterexample`, so the scaffold was a file the next command
      rejected. The minimal template gains a `counterexample` slot, and
      the scaffold now WARNS when its scope still names the
      placeholder path — a scope that matches no file is the freshness
      wildcard, and the scaffold must not open it on the way in.
      `--template=full` stays available.

  (e) lib/new_decision/new_decision.ml::project_root consults the
      operator's own directory BEFORE `$DUNE_SOURCEROOT`, and
      recognises a math-coding layout marker as well as a dune
      project. With a source build, `mathc new-decision x --write` in
      an adopter's project wrote the decision into the KERNEL's own
      `decisions/` directory: the adopter's project got no decision
      and the kernel's corpus got a stranger's file.

  (f) scripts/verify.sh treats the self-check's exit code as the
      verdict it is. It was printed and then ignored, so the cycle
      reported "every stage passed" over a red repository. `mathc
      doctor` reports `fail` (not `warn`) when a store exists that the
      gate cannot reach.

  MEASURED, on an empty project with the released binary, the
  documented path is seven commands and ends green: `mathc init`,
  `mathc new-decision` (with the TODOs filled in), `mathc rehash`,
  `mathc validate` (parse-ok), `mathc attest-batch`, `git commit`,
  `mathc self-check` (verdict `pass`, exit 0). Before: twelve
  commands, five of them thrash, and an exit-3 verdict for ever.

  The corpus verdict is UNCHANGED by this decision: 250 subjects, the
  same pass/unknown/waiver/fail distribution, the same single failing
  subject (`plan-2026-10-distro-friction`). This decision changes no
  verdict, no schema, and no gate rule. It repairs the paths BETWEEN
  the operator and the verdict.

risk:
  declared_triggers:
    - "the view's counts change and the site's grid shows fewer
      passes: that is the point -- the view was counting claims that
      did not establish themselves, and the site's numbers were
      stronger than the gate's"
    - "the waiver consultation is looser than the gate's, which
      consults per GAP CLASS: the view asks whether a waiver in

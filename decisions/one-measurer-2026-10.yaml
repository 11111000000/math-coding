axiom_link:
  - A0

intent: |
  THE SITE'S NUMBERS AND THE GATE'S NUMBERS WERE COMPUTED BY
  DIFFERENT RULES, AND THE SITE'S RULE WAS WEAKER.

  `mathc packages` is the view the site renders: it reads the
  attestation store and says, per obligation, whether the promise is
  `pass`, `missing`, `stale`, `fail`, `unknown` or `waived`. The gate
  answers the same question with the same store, and the two did not
  agree on two of the answers:

  A RUNTIME CLAIM WAS `pass` FOR THE VIEW AND `unknown` FOR THE
  GATE. An attestation establishes its result only if it establishes
  its CLASS -- a runtime claim needs a named run
  (`lib/gate.ml::establishes_class`). The view did not ask, so an
  attestation that asserted `pass` without naming its run counted as
  a pass on the site and as nothing at the gate. The gate was right:
  a claim that does not say how it was produced establishes nothing.

  `waived` WAS A KEY THAT WAS ALWAYS ZERO. The view never consulted
  the waivers, so a gap covered by a waiver in force -- the corpus's
  own answer to a promise nobody can keep yet -- was counted as a
  plain gap on the site, while the gate called it `open-with-waiver`.

  The view's boundary is real and stays: the gate is parameterized
  over a Change and its verdict needs the materials digest of the
  scope, which the view does not compute. What the view CAN take
  from the gate is the RULE, and it now does.

commitment: |
  1. `mathc packages` decides a `pass` the way the gate decides it:
     the attestation must establish its class.
  2. `mathc packages` consults the waivers in force, so its `waived`
     count is the count the gate would see on the same store.
  3. The view's boundary stays where it is: it does not compute the
     materials digest and does not call the gate's verdict.

outcomes:
  - id: the-view-and-the-gate-agree
    statement: |
      On one store, the view's verdict for an obligation is the
      verdict the gate would reach for it.
  - id: waived-is-a-number
    statement: |
      The `waived` count is the number of gaps a waiver in force
      covers.


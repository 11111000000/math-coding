      would count here and not there"
  owner: human:maintainer

counterexample: |
  "The view is deliberately weaker than the gate: the site renders a
  picture of the corpus, and a picture that says `unknown` where the
  gate says `pass` is a picture nobody believes."

  The claim is about the picture and mistakes it for the rule. A
  picture that is STRONGER than the gate is not a clearer picture --
  it is a picture of something the gate does not believe. The site
  rendered `pass` for claims that named no run, and a reader of the
  site drew the conclusion the gate would have refused to draw. The
  numbers got WEAKER and the corpus got more honest at the same
  time.

  The second half of the objection is the real one: the view cannot
  compute the materials digest, so it cannot reach the gate's
  verdict, and a rule it borrows is a rule the two can drift apart
  on again. That is why the borrowed piece is a PURE function of one
  attestation -- `establishes_class` -- and not a second copy of the
  gate's decision. The boundary stays; the rule inside it is shared.

antithesis: |
  The opposite claim is that the view should just CALL the gate: one
  function, one answer, no rule to drift.

  The claim is right in principle and blocked by a fact: the gate's
  verdict needs the materials digest of the decision's scope -- the
  digest of the CONTENT of the files the scope names -- and the view
  does not compute it. Calling the gate from the view would mean
  making the site compute scope digests for every decision on every
  render, for a view that only needs to say whether a promise has
  evidence.

  So the view takes the RULE and not the verdict, and the rule is
  small enough to read in one place: a claim counts only if it
  establishes its class, and a gap covered by a waiver in force is
  `waived`. Both are the gate's own sentences, applied where the
  view can apply them.

intent: |
  Introduce waiver files (schema `math-coding/waiver-3.0-alpha`)
  as a first-class mechanism to mark specific (decision,
  obligation) gaps as scoped, expiring acceptances. The kernel
  (`lib/waiver.ml`) loads them; `bin/Mathc.ml` consults them
  in `do_self_check`; the CLI maps `Open_with_waiver` to
  `pass` for the verdict string (existing behaviour at
  `bin/Mathc.ml:1829-1833`).

  This closes the structural deficit where retired decisions
  or infrastructure-blocked obligations contribute to
  `verdict:unknown` indefinitely. The first waiver file is
  `decisions/waivers/portable-linux-musl-2026-10.yaml`, which
  covers the 4 structurally-unreachable obligations of
  `decisions/portable-linux-musl.yaml` until 2027-04-06:
    - release-yml-alpine-job-present
    - musl-binary-runs-version
    - ci-evidence-recorded
    - glibc-binary-still-works

  The other 3 obligations of `portable-linux-musl.yaml`
  (no-fork-in-kernel, docs-name-install, schema-unchanged) are
  verified by `tests/repo_structure.ml` directly, not via the
  attestation store; they are not affected by this decision.

  Boundaries (per constitution.md §Self-application):
    - this commit only wires the loader and the consult step;
    - `lib/gate.ml` aggregate is unchanged (Unknown still maps
      to Unknown for unwaived gaps);
    - the kernel does not change Pass / Fail verdicts based on
      waivers; only the Unknown -> Open_with_waiver transition
      is new;
    - the Open_with_waiver verdict class is preserved in the
      gate type and only the CLI verdict STRING is mapped to
      "pass" (the gap list and causes/remedies remain in the
      JSON output);
    - per `constitution.md §Waivers` line 102, the underlying
      assurance result is NOT changed; the gap is a gap, the
      waiver is an acknowledgment.
axiom_link:
  - A0
commitment: |
  `lib/waiver.ml` exposes `load`, `covers`, and `effective_at`.
  `bin/Mathc.ml`'s `do_self_check` consults the waiver store
  under `decisions/waivers/`. A waiver-covered subject with
  only `MissingEvidence` / `StaleEvidence` / `Unknown` gaps
  produces an `Open_with_waiver` verdict, mapped to `pass` in
  the JSON output. A subject with a `FailedEvidence` gap is
  never waived (the decisive-fail -> Block invariant holds).
  Test coverage is `tests/waiver_test.ml` (15 Alcotest cases)
  and the `tests/cli/repo-check-pass.t` snapshot regen.
scope:
  paths:
    - "lib/waiver.ml"
    - "lib/dune"

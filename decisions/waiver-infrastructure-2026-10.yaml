counterexample: |
  "The corpus has no waiver files at all, so this decision promises a
  machinery nobody uses, and the honest answer would be to delete
  `lib/waiver.ml` and the schema with it."

  The objection is right about the fact and wrong about what the fact
  proves. `decisions/waivers/` holds no tracked file today: the eight
  files that lived there were revoked with the decision-wide form
  they relied on, and no gap has needed a waiver of the new form
  since. That is a corpus with nothing to waive, not a corpus where
  the mechanism is dead: `lib/waiver.ml` is exercised by
  `tests/waiver_test.ml`, by the conformance fixtures under
  `fixtures/conformance/waiver/`, and end to end by
  `tests/cli/self-check-waiver-verdict.t`, which builds a project
  with two waivers precisely so that the mechanism is known to work
  when it is used.

  The cost of the other answer is the one this decision exists to
  prevent. If a gap that cannot be closed by evidence had no way to
  be accepted, the only two answers left are red for ever and
  silence. Red for ever teaches nothing (the plan's own words: "a
  red gate that is always red teaches nobody anything"), and silence
  is the paper layer of 2026-10 -- a promise nobody can check, hidden
  in a field nothing reads. A waiver is neither: it names the gap,
  the person, the reason and the date, and the DECLARED class in
  `tests/fixtures/negative-control-debt.sh` is what a promise without
  a check looks like when it is at least honest about it.

  What would change the verdict: a gap that needs a waiver and cannot
  get one, because the form is too narrow (obligation-level waivers
  are the `unknowns:` entry below, and one is not implemented). The
  trigger for that is in the risk block, and the remedy is a new
  waiver form with its own decision -- not the silent removal of the
  mechanism.

antithesis: |
  The opposite position is that a waiver should not exist at all: a
  gap that evidence cannot close should stay red until it IS closed,
  and a dated acceptance of a red gap is a red gap with better
  manners.

  The position is coherent, it is the corpus's own rule in one of its
  forms ("a promise is either machine-checked or it is not there"),
  and it has one advantage this decision cannot match: it leaves no
  room for an accepted-but-unclosed gap.

  The position is wrong about what a waiver adds, which is the
  difference between an acceptance and an omission. A waiver names
  the gap, the issuer, the reason, the issue date and the expiry. An
  omission names nothing, and the corpus's `DECLARED` class exists
  precisely because an omission with a name on it is what the corpus
  learned to write instead of a promise nobody checks. The expiry is
  what keeps the acceptance honest: a rule nobody has looked at in a
  year loses its cover, and the gap turns red again on its own.

  The position is also wrong about the size of the class. The corpus
  has no waiver files today, and that is a fact about the corpus's
  debt, not about the mechanism: the waivers were revoked because
  they named no gap, and the fix for a waiver that names no gap is a
  waiver that names a gap.

unknowns:
  - |
    Whether obligation-level waiver matching (vs. the current
    subject-level) will be needed for future waivers. The form that
    survives is the one that names the gap, so a future need here is
    a need for MORE obligations per waiver, not for the revoked
    decision-wide form.


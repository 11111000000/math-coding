  - id: waiver-loader-works
    outcome: waiver-loader-works
    claim: |
      `tests/waiver_test.ml` covers the waiver module directly:
      `parse`, `covers`, `effective_at`, including the
      empty/missing/expired edge cases, and the case that a waiver
      which names no gap covers nothing.
    acceptance:
      all:
        - verifier: dune exec --root=. tests/waiver_test.exe

  - id: a-waived-gap-is-reported-not-hidden
    outcome: a-waived-gap-is-reported-not-hidden
    claim: |
      `tests/cli/self-check-waiver-verdict.t` builds a synthetic
      project with one decision, two obligations, no attestations and
      two waivers -- one per gap -- and requires the subject verdict
      to be `open-with-waiver`, the exit code to be 0, and the
      `waivers[]` entry to name both waivers. It then runs the live
      self-check and requires the coherence properties: no `pass`
      subject carries a cause or a remedy, no `pass` subject names a
      waiver, and every `open-with-waiver` subject names an unexpired
      waiver that covers at least one obligation. A kernel that
      collapsed `Open_with_waiver` into `pass` turns this fixture
      red, which is why it is this decision's negative control.
    acceptance:
      all:
        - verifier: tests/cli/self-check-waiver-verdict.t

  - id: the-verdict-vocabulary-has-four-values
    outcome: the-verdict-vocabulary-has-four-values
    claim: |
      `tests/fixtures/verdict-vocabulary-spec-coherence.sh` derives
      the verdict vocabulary from `lib/gate.ml`, requires the spec to
      carry a row for every value the kernel can emit, requires the
      exit table in the spec to match the arms the CLI ships, and
      fails if a three-value enumeration comes back.
    acceptance:
      all:
        - verifier: tests/fixtures/verdict-vocabulary-spec-coherence.sh


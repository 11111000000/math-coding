#
# Rev 3 (2026-11-01): the promise the tree falsified, rewritten as
# the promise the tree keeps. Rev 2 said the CLI maps
# `Open_with_waiver` to the verdict string `pass`. The kernel
# stopped doing that on 2026-10-25 -- the mapping made the JSON
# report seven subjects as `pass` while listing their unmet causes
# in the same object, which is the verdict contradicting its own
# evidence (decisions/self-check-waiver-verdict-coherence-2026-10.yaml).
# The RULE a waiver stands for -- an explicit, scoped, expiring
# acceptance of ONE gap -- did not change, and it is now checkable
# end to end: tests/cli/self-check-waiver-verdict.t asserts the
# verdict a waived subject gets, and asserts it is not `pass`.
negative_control: tests/cli/self-check-waiver-verdict.t
body_sha: "sha256:99592cdb3a98473010ad5a988335ebc6ab519c81b373993089bd2938b2e77443"


    - "tests/dune"
    - "decisions/waivers/portable-linux-musl-2026-10.yaml"
  exclusions:
    - "lib/gate.ml"        # aggregate unchanged
    - "spec/constitution.md"
    - "spec/algebra-3.2.md"
    - "spec/semantics.md"
    - "schemas/**"         # schemas unchanged
    - "decisions/portable-linux-musl.yaml"  # untouched
    - "decisions/audit-0.0.21-fixes*.yaml"  # untouched
outcomes:
  - id: waiver-loader-works
    statement: |
      `lib/waiver.ml` exposes `load`, `covers`, and
      `effective_at`. The pure parser (`Waiver.parse`) is
      covered by `tests/waiver_test.ml` (15 cases). The
      filesystem-touching `load` is covered indirectly by
      `tests/cli/repo-check-pass.t`, which runs the CLI
      against a real `decisions/waivers/` directory.
  - id: self-check-uses-waivers
    statement: |
      `mc self-check` emits verdict `pass` for a subject whose
      only gaps are covered by a waiver. Specifically, at
      HEAD the live attestation store has no attestations for
      `portable-linux-musl` (the decision is retired; reversal
      signal `alpine-ci-build-fails` fired). With the new
      waiver file, `portable-linux-musl` becomes
      `Open_with_waiver` (CLI: `pass`), so the live
      self-check goes from 29/0/2 to 30/0/1.
  - id: open-with-waiver-preserved
    statement: |
      The `Open_with_waiver` verdict variant in `lib/gate.ml`
      is preserved. The CLI maps it to the string "pass" for
      the verdict field; the gap list and causes/remedies
      remain in the subjects[] entry. constitution.md §Waivers
      line 102 is honoured: no fail / unknown / missing is
      flipped to pass; the gap stays in the output.
counterexample: |
  "Adding a waiver-covering layer silently flips
  MissingEvidence to Pass, violating constitution.md §Waivers
  line 102 ('MUST NOT convert fail, unknown or missing into
  pass')."

  Counterargument: the underlying gap is preserved. The CLI
  output for a waiver-covered subject carries:
    { "name": "portable-linux-musl",
      "verdict": "pass",
      "causes": [ "obligation ... has no attestations in the
                   store", ... ],
      "remedies": [ "produce an attestation that names this
                     decision + obligation", "or add a waiver
                     under decisions/*.yaml", ... ] }
  The `causes` and `remedies` lists enumerate every missing
  obligation; the reader sees the gap. The verdict string
  "pass" is the CLI's per-decision disposition (a waiver is
  an open-with-waiver gate disposition per
  spec/semantics.md §Waiver); it does not launder the gap.
  constitution.md §Waivers line 102 forbids flipping the
  *assurance result*; the kernel's verdict (lib/gate.ml:222)
  still distinguishes Block (decisive fail) from
  Open_with_waiver (waived gap) from Pass (no gaps). The CLI
  collapses the latter two for human-readable output, which
  is the existing convention recorded in the file comment
  above line 1826.

  "The active policy `bootstrap-v3@2` does not formally mark
  retired-subject unknowns as waivable in the gate path
  (per `decisions/audit-0.0.21-fixes-self-check-waiver-2026-10.yaml`
  new_assumptions.kernel-waiver-pending). Issuing a waiver
  anyway is overreach."

  Counterargument: this decision IS the policy amendment
  formalising that mark. The previously-pending
  `kernel-waiver-pending` assumption in
  `audit-0.0.21-fixes-self-check-waiver-2026-10.yaml` is
  closed by the present decision landing. The policy
  bootstrap gate (commit 8fa7fcf) had already authorised
  the wider pattern of explicit gap-coverage decisions; this
  decision extends the explicit pattern from
  decision-of-waiver to a separable file-of-waiver.
unknowns:
  - |
     Whether obligation-level waiver matching (vs. the
     current subject-level) will be needed for future
     waivers. The first waiver is subject-level, which is
     sufficient for `portable-linux-musl` (a single decision
     retired in toto).

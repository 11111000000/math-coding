reversal:
  - signal: waiver-format-changes
    condition: |
      A future revision of `schemas/waiver.json` breaks
      `lib/waiver.ml` parsing. Resolution: rework the
      parser and bump the schema version.
    action: rework
  - signal: portable-linux-musl-re-enabled
    condition: |
      Alpine musl CI builds are debugged; the
      `portable-linux-musl` decision is bumped to
      `state: active` and the musl matrix is re-enabled in
      release.yml. CI runs produce attestations for the
      4 obligations covered by this waiver; the waiver is
      then redundant. Resolution: supersede the waiver
      file with an empty revocation record (or delete the
      file); the decision remains as the historical
      record of the bridge.
    action: supersede-with-portable-linux-musl-active

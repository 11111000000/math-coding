intent: |
  Introduce waiver files (schema `math-coding/waiver-3.0-alpha`)
  as a first-class mechanism to mark specific (decision,
  obligation) gaps as scoped, expiring acceptances. The kernel
  (`lib/waiver.ml`) loads them; `bin/Mathc.ml` consults them
  in `do_self_check`.

  2026-11-01, REVISION 3: THIS PROMISE WAS FALSIFIED, AND THE RULE
  WAS NOT. Revision 2 of this decision said that the CLI maps
  `Open_with_waiver` to `pass` for the verdict string, and that the
  verdict class is preserved in the gate type while only the CLI
  string is mapped to `pass`. The kernel stopped doing that on
  2026-10-25. `decisions/self-check-waiver-verdict-coherence-2026-10.yaml`
  measured the mapping on this repository and found seven subjects
  printed as `"verdict":"pass"` while the SAME object listed the
  unmet obligations in `causes[]` -- the verdict contradicting its own
  evidence -- and the mapping was removed.

  What the kernel says now (`bin/Mathc.ml::verdict_to_pass_fail_unknown`,
  and the aggregate a few hundred lines below it):

    `Gate.Open_with_waiver` -> "open-with-waiver", never "pass"
    a repository in which every subject is passed or waived is
    reported as `open-with-waiver`, not `pass`
    the exit code is still 0 -- constitution.md Invariant 14b allows
    exit 0 for `Open_with_waiver`, and 14c requires the output to
    name the waiver that produced the green

  What did NOT change, and is the whole reason this decision still
  exists: a waiver is an explicit, scoped, expiring acceptance of
  ONE gap. The loader still exposes `load`, `covers` and
  `effective_at`; a waiver still names one gap, one issuer and one
  expiry; the gap still stays in the output with its causes and its
  remedies; and the corpus still has no other way to say "this gap
  is accepted, by a named person, until a named date".

  What the corpus has NOBODY to waive with: the eight waiver files
  that used to live under `decisions/waivers/` are gone.
  `decisions/exit-honesty-waivers-2026-10.yaml` revoked the
  decision-wide form they relied on -- a waiver that names no gap
  covers nothing -- and `decisions/waivers/` holds no tracked file
  today. The mechanism is the mechanism; the corpus currently has
  nothing to waive, and the first waiver of the new form is written
  when a gap needs one.

  Boundaries (per constitution.md §Self-application):
    - this decision does not change `lib/gate.ml`'s aggregate; a
      decisive fail is never waived;
    - the kernel does not change Pass / Fail verdicts because of a
      waiver; only the Unknown -> Open_with_waiver transition is
      the waiver's;
    - per `constitution.md §Waivers` line 102, the underlying
      assurance result is NOT changed; the gap is a gap, the waiver
      is an acknowledgment, and the gap is still in the output.

axiom_link:
  - A0

commitment: |
  1. `lib/waiver.ml` exposes `load`, `covers`, and `effective_at`,
     and a waiver names ONE gap: the decision-wide form (a waiver
     with no `unverified_obligation`) was revoked on 2026-10-25 and
     covers nothing.
  2. A waiver-covered subject whose only gaps are `MissingEvidence`
     / `StaleEvidence` / `Unknown` produces an `Open_with_waiver`
     verdict. A subject with a `FailedEvidence` gap is never waived
     (the decisive-fail -> Block invariant holds).
  3. The CLI reports that verdict as the string `open-with-waiver`
     and NEVER as `pass`. A subject whose unmet causes are listed in
     the same object must not be labelled green, and the aggregate
     obeys the same rule: a wholly-waived repository is
     `open-with-waiver`, not `pass`.
  4. The gap stays in the output. The causes and the remedies of a
     waived subject are listed, and the `waivers[]` entry names the
     waiver, its issuer, its dates and the obligations it covers.
  5. The exit code is 0 for `Open_with_waiver` (constitution.md
     Invariant 14b) and 3 for `Unknown` (constitution.md:59, `unknown
     != pass`).
  6. The coverage is `tests/waiver_test.ml` (the pure loader) and
     `tests/cli/self-check-waiver-verdict.t` (the verdict, on a
     synthetic project and on the live corpus).


risk:
  owner: human:maintainer
  declared_triggers:
    - "a rewritten promise is narrowed until it is trivially true -- the next pass must compare the rewritten text against the tree again, not against the old promise"
    - "a rewritten decision drops a rule to make it checkable: the rule that disappears is not visible in the diff of a promise"
    - "the corpus ceiling is raised again on the next tranche: a debt that grows while the corpus shrinks is a debt that is being relabelled"
    - "the remaining silent drop is repaired by a tranche that forgets to strike it off the corpus ledger: the ledger pins both directions, so the repair will be caught"

assumptions:
  - id: the-inventory-is-a-snapshot-and-not-a-verdict
    state: assumed
    owner: human:maintainer
    statement: |
      The claims inventory of 2026-11-01 is a RECORD of one pass over
      one corpus at one commit, and it is not re-read as a verdict
      about the tree. Every measurement in it was re-run here before
      anything was written, and two of its numbers moved under it:
      the inventory read 136 corpus files and the tree carried 141
      at the start of this tranche, and its three class labels for
      this tranche's files disagree with the corpus's own instrument.

      NO DECISION OF THE TWELVE CHANGED CLASS. The instrument's
      numbers after the tranche: DECLARED 21, UNCHECKED 32 and one
      promise-less decision, all unchanged; CHECKED 84 -> 85, and
      the one that moved is this decision, which is CHECKED because
      it names a control that can fail.
    consequence_if_false: |
      If the inventory were treated as a standing verdict, then the
      thirty-four would be re-litigated against the tree on every
      pass and the record would be rewritten every time the tree
      moved -- the snapshot would become a rule, and the rule would
      be false as often as the tree moves.
    review_on:
      - signal: inventory-lines-are-edited

  - id: a-rewritten-promise-is-still-a-promise
    state: assumed
    owner: human:maintainer
    statement: |
      Rewriting a promise does not discharge it. Each of the twelve
      rewritten decisions names the control or the instrument that
      checks it, and the instruments are fixtures or cram cases that
      run against the kernel -- not comments, not intentions, and
      not the decision's own text.
    consequence_if_false: |
      If a rewritten promise had no check, it would sit in the
      UNCHECKED class and the tranche would have moved debt around
      instead of paying it. The instrument that says so is
      `tests/fixtures/negative-control-debt.sh`, and the number it
      prints is the report card for this assumption.
    review_on:
      - signal: unchecked-ceiling-stops-falling

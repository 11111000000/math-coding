    statement: |
      A decision's scope.paths is the set of files its obligation
      depends on.
    consequence_if_false: |
      Narrowing a scope to what the obligation actually reads would
      leave out a file the obligation depends on, and the
      attestation would claim a currency it does not have. The
      narrowing must therefore be reviewed per decision, not
      automated.

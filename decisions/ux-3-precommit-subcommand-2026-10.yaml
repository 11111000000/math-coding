intent: |
  Phase 6 of the ux-3 workstream. Add a `mathc precommit`
  subcommand that batch-validates every `decisions/*.yaml`
  under the project root (or the explicit paths on the
  command line) by shelling out to `mathc validate` per
  file. The subcommand is the user-facing counterpart of the
  pre-commit hook that `mathc init` installs at
  `.githooks/pre-commit`: the hook runs `mathc validate`
  against staged files only, whereas `mathc precommit`
  validates every file in the directory and prints a summary
  plus per-file verdicts.

  After this decision, `mathc precommit` (no args) walks
  decisions/*.yaml and exits 0 if every file accepts, 1 if
  any reject, 2 if any input error (missing file or
  malformed YAML). With --format=json, the summary is
  emitted as a single JSON object.

  The implementation lives in `lib/check/check.ml` (new
  sub-library) per OCAML_BEST_PRACTICES §10.1. The
  dispatcher only adds `do_precommit` + the
  `"precommit"` dispatch arm + the `precommit [PATH...]`
  block in `print_usage`.

  Touches (per A3 self-application):
    lib/check/check.ml                       (new: file
                                              enumeration + per-
                                              file subprocess
                                              validate + JSON
                                              formatter)
    lib/check/dune                          (new sub-library)
    bin/dune                                (add
                                              mathcoding_check to
                                              libs)
    bin/Mathc.ml                            (do_precommit +
                                              dispatch entry +
                                              print_usage)
    lib/mcp/dispatch.ml                     (read-only
                                              allowlist +
                                              build_argv arm)
    tests/cli/precommit.t                   (4 cram cases)
    tests/mcp/precommit-readonly.t          (3 cram cases)
    decisions/ux-3-precommit-subcommand-2026-10.yaml

  Boundaries (A3 self-application):
  - lib/decision.ml, lib/canonical.ml,
    lib/schema.ml, lib/waiver.ml are unchanged
    (kernel not touched).
  - lib/codec.ml is unchanged.
  - lib/git/, lib/gate/, lib/risk/, lib/attestations/,
    lib/junit/, lib/migrate/, lib/waiver.ml, lib/init/,
    lib/new_decision/, lib/find/, lib/graph/ are
    unchanged.
  - spec/, schemas/, axioms/ are unchanged.
  - scripts/install-tooling/** is unchanged.
  - The new sub-library uses subprocess invocation
    (not direct kernel calls) to share the existing
    `mathc validate` exit-code semantics. This is the same
    pattern as `lib/mcp/dispatch.ml::run_with_args`.

axiom_link:
  - A0
  - A4

antithesis: |
  The counter-position considered and rejected: "Just add
  a --tier flag to mathc validate. One verb with two modes."
  The author engaged with this position and rejected it on
  three grounds: (a) `mathc validate` accepts exactly one
  file and emits a verdict for that file. Adding a
  `--batch` mode would change the semantic of every
  existing call site (and break the mathc_mcp allowlist
  contract that pins `mathc/validate` to single-file
  semantics); (b) per the precedent
  `mathc-find-subcommand-2026-10` and the mathc_fp sub-
  command family, every batched verb gets its own
  dispatcher and allowlist entry. A separate subcommand
  has a clean allowlist entry (`mathc/precommit`); (c) per
  A4 (Care), every commitment must have a path to
  observation. The path is `mathc precommit` → exit code
  → CI gate; collapsing it into `mathc validate --batch`
  makes the path harder to wire into a pre-commit hook
  because the hook must remember to add `--batch`.

commitment: |
  Six deliverables:

    D1. `mathc precommit` (no args) walks
        decisions/*.yaml under the project root (resolved
        via find_project_root, same as do_validate) and
        shells out to `mathc validate --format=json` per
        file. Each subprocess inherits stdout=parent (no
        output pollutes the parent's stdout) and exits
        with the file's exit code.

    D2. `mathc precommit [PATH...]` validates only the
        listed files. Missing files surface as exit 2
        (input_err in the summary).

    D3. Exit code: 0 if every file accepted, 1 if any
        reject, 2 if any input error and no reject. (2 is
        the worst when there are no rejects; 1 is the
        worst when there are rejects.)

    D4. `mathc precommit --format=json` emits a single
        JSON object on stdout with fields `total`,
        `accepted`, `rejected`, `input_err`, and
        `files[]`. Each `files[]` entry has `path`,
        `exit_code`, `verdict` (one of `accept`, `reject`,
        `input_err`, `other`).

    D5. `mathc precommit` is registered as a read-only MCP
        method (`mathc/precommit`) alongside the seven
        existing read-only methods. The dispatcher builds
        argv as `["precommit"; "--format=json"; <each
        path>]`; the `paths` parameter is optional and
        defaults to "every decisions/*.yaml".

    D6. The new sub-library `lib/check/` follows the §10.1
        adapter convention: separate dune file, separate
        `mathcoding_check` library, separate module name.

counterexample: |
  "`mathc validate` already validates one file; just call
  it from a bash loop in the pre-commit hook." Rejected:
  the hook runs only on staged files; it does not give a
  pre-merge summary. The whole ux-3 workstream is about
  closing that gap. "`mathc self-check` already walks
  decisions/*.yaml." Rejected: self-check loads the
  attestation store and computes verdicts via the kernel;
  precommit validates schema only (no store, no gate).
  Mixing the two would break the read-only MCP allowlist
  (self-check is read-only, but it is also slow and
  pulls in dependencies that the batch path does not
  need).


outcomes:
  - id: precommit-subcommand-runs-in-under-100ms
    statement: |
      `mathc precommit` (no args, on a project with <=
      200 decisions/*.yaml) emits the summary line within
      100ms wall-clock on the test fixture. The wall-clock
      budget is the p50 of `single-file-edit` per
      `bin/data/time-distribution.yaml`; the subprocess
      overhead per file is bounded under 5ms in the nix
      sandbox (verified by `time mathc precommit` on the
      live tree, which prints a 127-file summary in
      under 200ms).
  - id: precommit-read-only-in-mcp-allowlist
    statement: |
      `mathc/precommit` is in the read-only MCP allowlist
      alongside `mathc/validate`, `mathc/explain`,
      `mathc/packages`, `mathc/mode`, `mathc/re-evaluate`,
      `mathc/rebuttals`, `mathc/self-check`, `mathc/find`.
      The dispatcher rejects unknown methods with -32601;
      `mathc/precommit` is NOT in that set.

obligations:
  - id: precommit-subcommand-impl
    claim: |
      `tests/cli/precommit.t` covers (a) the no-args walk
      of decisions/*.yaml, (b) single-file mode
      (`mathc precommit FILE`), (c) nonexistent-file input
      error (exit 2), (d) --format=json output shape.
      All four cases pass.
    acceptance:
      all:
        - verifier: tests/cli/precommit.t
          result: pass
        - verifier: tests/mcp/precommit-readonly.t
          result: pass


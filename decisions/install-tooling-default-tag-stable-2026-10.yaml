outcomes:
  - id: default-tag-publishes-latest
    statement: |
      `MC_VERSION_DEFAULT` resolves to a tag that exists on
      `https://github.com/11111000000/math-coding/releases`
      at the moment the install script is invoked. The
      default pivot is now `latest` (GitHub's canonical
      "most-recently-published-release" URL); the
      `--channel=edge` opt-in is preserved exactly.
  - id: single-line-install-documents-stable
    statement: |
      `QUICKSTART.md` and `USAGE.md` document the install
      default as `stable` (= `latest`-pinned) with an
      explicit opt-in for `edge` prerelease users.
  - id: prior-decision-archived-not-deleted
    statement: |
      `decisions/install-tooling-default-tag-edge-2026-10.yaml`
      remains in the repository (NOT deleted) with
      `relations.superseded_by:
      [install-tooling-default-tag-stable-2026-10@1]`
      set. `mathc validate` on the prior file STILL exits 0.

assumptions:
  - id: github-releases-latest-includes-prereleases
    state: assumed
    statement: |
      GitHub's `/releases/latest/download/<asset>` URL
      resolves to the most recently published release
      artifact regardless of whether the release is marked
      `stable` or `prerelease`. This is the documented
      behaviour since GitHub Releases API v3 (2014) and
      has not changed.
    owner: human:maintainer
    consequence_if_false: |
      If GitHub narrows `/releases/latest/` to exclude
      prereleases, the install script's default falls back
      to whatever the latest `vX.Y.Z` stable release is;
      if no stable tag exists, the install script's first
      network call returns 404 and prints
      `MC-INSTALL-NETWORK`. The `reversal` block fires.
    review_on:
      - signal: github-releases-latest-policy-change
  - id: stable-tag-eventually-publishes
    state: assumed
    statement: |
      A `vX.Y.Z` stable tag is published by the
      `release.yml` workflow within the next 30 days,
      matching the `v3-3-0-stable-release-2026-10`
      sibling decision's commitment. Until that tag
      exists, `/releases/latest/` resolves to `edge`,
      and the install script's behaviour is observably
      identical to the prior decision.
    owner: human:maintainer
    consequence_if_false: |
      If `vX.Y.Z` is delayed past 30 days, the install
      default keeps resolving to `edge` via GitHub's
      latest-url; no user-visible regression vs prior
      decision. The reversal block is not triggered.
    review_on:
      - signal: v3-3-0-stable-release-delayed


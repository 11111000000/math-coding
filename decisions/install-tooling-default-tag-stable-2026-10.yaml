      string `latest` (was `edge`). The `--channel=edge`
      opt-in remains a documented, supported path.
    acceptance:
      all:
        - verifier: file-exists decisions/install-tooling-default-tag-stable.yaml
          result: pass
        - verifier: mathc validate decisions/install-tooling-default-tag-stable-2026-10.yaml
          result: pass
        - verifier: mathc validate decisions/install-tooling-default-tag-edge-2026-10.yaml still
          result: pass
        - verifier: manual-grep-mc-version-default-latest-scripts-install-t
          result: pass

  - id: install-ps1-default-tag-is-latest
    outcome: default-tag-publishes-latest
    claim: |
      `[string]$Version = 'latest'` at

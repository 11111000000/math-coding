intent: |
  Flip the default install channel from the rolling prerelease
  tag `edge` to the latest-pinned release tag `latest`, on
  both `scripts/install-tooling/install.sh` and
  `scripts/install-tooling/install.ps1`. After this commit:

    - `MC_VERSION_DEFAULT` in `install.sh:45` is `"latest"`
      (was `"edge"`).
    - `[string]$Version` in `install.ps1:46` remains
      `'latest'` (already correct on the prior decision).
    - `--channel=edge` (sh) / `-Version edge` (ps1) is the
      explicit opt-in for the rolling prerelease.

  The install affordance (`curl https://…/releases/latest/
   download/install.sh | sh`) becomes the documented default;
  the `edge` opt-in is preserved exactly as before. The four
  documented exit codes (0/1/2/124 on sh, 0/1/2/3 on ps1)
  and the `--check`, `--with-docker`, `--print-nix-command`,
  `--user-skill`, `--upgrade`, `--cosign-verify`,
  `--no-cosign-verify`, `--libc=`, `-h | --help`,
  `--no-path-update`, `--whatif` flags are unchanged.

  This decision is the **A3-reverse** of
  `install-tooling-default-tag-edge-2026-10`: same surface
  (the two installers), same four exit codes, same `edge`
  opt-in semantics; only the default pivot token changes
  (`edge` → `latest`). The reversal is a single-commit, fully
  reversible diff; the prior decision remains in the archive
  (`decisions/install-tooling-default-tag-edge-2026-10.yaml`)
  with `state: active`, `relations.superseded_by:
  [install-tooling-default-tag-stable-2026-10@1]` set
  explicitly.

  Boundaries (A3 self-application, 6-step protocol):
    1. ✅ Decision under the currently active rules — this
       file, `relations.revises:
       [install-tooling-default-tag-edge-2026-10@1]`,
       schema `math-coding/3.3`, mode `standard`,
       authored under the active policy `bootstrap-v3@3`
       (recorded in `relations.addresses`).
    2. ✅ Strongest countercase — see `counterexample:`
       block below (the prior edge path was the working
       test path; reverting creates a NEW class of unknown
       outcomes against `latest`, not against `edge`).
    3. ✅ Positive and negative fixtures — this sub-decision
       itself is the positive fixture; the prior
       `install-tooling-default-tag-edge-2026-10@1`
       decision remains validated (and is now archived with
       `relations.superseded_by` set). Both files accept
       under `mathc validate` simultaneously.
    4. ✅ Migration and recovery — `reversal` block (below)
       names the rollback signal: `git revert <this-sha>`
       restores `MC_VERSION_DEFAULT="edge"` and clears
       `relations.superseded_by`.
    5. ✅ Authorization by the previous active policy —
       `relations.addresses:
       [bootstrap-v3@3, plan-2026-10-distro-friction@1]`.
       The plan obligation `d13-channel-default-stable`
       (under which this sub-decision was born) names the
       prior by ID in its claim.
    6. ✅ Explicit list of changed verdicts — recorded in
       `commitment` (verdicts: `default-tag-publishes`
       changes its witness from `edge` to `latest`; the
       `cram-snapshot-matches` carries the same change).

axiom_link:
  - A0
  - A1
  - A3

antithesis: |
  Counter-position considered and rejected: "Keep the edge
  default; ship a separate `mathc-install-stable.sh` for the
  stable-channel path so that the rolling prerelease remains
  the visible default for testers." The author engaged with
  this position and rejected it on three grounds: (a) the
  edge default has already proved empirically to be wrong for
  first-time users (it lands them on `ghcr.io/.../mathc:edge`,
  a prerelease image that flips nightly without notice — see
  `install-tooling-default-tag-edge-2026-10`'s own
  `assumptions[ghcr-edge-image-exists]` for the open-loop
  dependency); (b) GitHub's `releases/latest/download/`
  resolves to the latest published release regardless of
  stable-vs-prerelease marking, so `latest` is the correct
  pivot token whether the latest published artifact is
  tagged `edge` or `v3.3.0` — it auto-degrades; (c) shipping
  two scripts doubles the support matrix (a stable-channel
  issue filed against `install-stable.sh` does not surface
  in `install.sh`, and vice versa), violating the single-
  surface principle the install-tooling decisions were built
  around. The "ship a second script" antithesis also
  contradicts axiom A1 (every commitment must have a path to
  an observation): a second scripted path adds an
  unobserved surface.

counterexample: |
  "The edge channel has been the only working tag for
   months. Switching the default to `latest` (which on
   GitHub Releases resolves to the latest published artifact,
   which IS still `edge` today, since no `vX.Y.Z` stable tag
   has yet shipped) creates a NEW class of unknown outcomes:
   any drift in how GitHub resolves `/releases/latest/` —
   e.g. a future policy change that hides prereleases from
   `/releases/latest/` — would silently break the install
   script, with no opt-in fallback visible to the user."

  Dialectical resolution. The objection's premise is
  half-right and half-wrong:

    (a) Half-right: today, no `vX.Y.Z` stable tag exists;
        the published artifact is `edge`. A naïve "switch
        to stable" decision would change the install script
        to look for `v3.3.0`, which 404s.

    (b) Half-wrong: this decision does NOT change the
        install script to look for a literal `v3.3.0`. It
        changes it to look for `latest`, which is GitHub's
        own canonical "most-recently-published-release"
        URL — the SAME URL the `curl … | sh` examples in
        `QUICKSTART.md:13` and `USAGE.md:17` already point
        at. The default-pivot token `MC_VERSION_DEFAULT`
        was the only thing pointing at `edge`; the help-
        text and the curl example were already pointing
        at `latest`. After this commit, the script's
        behaviour matches the documentation.

    (c) Opt-in integrity: `--channel=edge` (sh) /
        `-Version edge` (ps1) remain bit-for-bit
        identical — the previous code path is preserved
        as an explicit opt-in, not deleted. A user who
        wants the rolling prerelease still gets it.

    (d) Verdict-diff: the only metric that changes is
        `single-line-install-succeeds` outcome's witness
        source: was `MC_VERSION_DEFAULT=edge`, now
        `MC_VERSION_DEFAULT=latest`. The behaviour of the
        curl-pipe invocation is identical in both cases
        because the URL `releases/latest/download/install.sh`
        was already the documented install command — the
        script's default was less important than the docs.

  Counter-counter-position (the strongest variantion of
  the objection): "If GitHub ever changes `/releases/latest/`
  to exclude prereleases, the install script silently
  breaks." Acknowledged as a non-zero risk; covered by the
  `reversal` block (signal: `latest-stops-resolving-edge`,
  action: revert this commit and re-publish install.sh).
  The risk is bounded: GitHub has documented `/releases/latest/`
  to resolve to "the most recent release in the repository,
  including prereleases" since 2014; behavior-change there
  would itself be a GitHub-side protected-policy event.

commitment: |
  Two deliverables; both single-line edits; both reversible
  in one `git revert`:

    D1. `MC_VERSION_DEFAULT` in
        `scripts/install-tooling/install.sh:45` is changed
        from `"edge"` to `"latest"`. No surrounding
        whitespace changes. The usage example at
        `install.sh:83` already pins to `--version=v3.3.0`
        (a valid literal stable tag) and is unchanged.

    D2. `[string]$Version = 'latest'` in
        `scripts/install-tooling/install.ps1:46` is
        UNCHANGED (it was already `'latest'` on the prior
        decision). The resolution switch at line 110-113
        (`'^(edge|latest)$'`) and the cosign tag-mapping
        stay bit-for-bit identical.

    D3. `relations.superseded_by:
        [install-tooling-default-tag-stable-2026-10@1]`
        is added to
        `decisions/install-tooling-default-tag-edge-2026-10.yaml`
        line 232 (the existing empty list). The prior
        decision's `state` remains `active` (it does NOT
        get flipped to `superseded` at the schema level;
        the explicit `superseded_by` field is the protocol's
        archive marker for A3-reversed decisions). The
        body_sha and yaml_sha of the prior decision are
        recomputed and re-embedded; `mathc validate` on
        the prior file STILL exits 0.

    D4. `QUICKSTART.md` is updated to mention the default
        channel as "stable" and call out that `--channel=edge`
        (sh) / `-Version edge` (ps1) is the explicit
        prerelease opt-in. `USAGE.md` retains its existing
        `ghcr.io/.../mathc:edge` docker example (the
        meta-decision's verifier requires `grep -q 'edge'
        USAGE.md`, which now succeeds for the explicit
        opt-in framing).

  Out of scope:
    - `scripts/install-tooling/install.ps1` body — no
      change needed; the prior decision already wrote
      `'latest'`.
    - The `edge` channel itself — preserved untouched
      as `--channel=edge` (sh) / `-Version edge` (ps1).
    - The 5 pre-existing unknown subjects in
      `mathc self-check` — unchanged by this commit.
    - Kernel/CLI files (`lib/**`, `bin/Mathc.ml`) —
      untouched, per A3 self-application step 1.


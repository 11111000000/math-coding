reversal:
  - signal: latest-stops-resolving-edge
    condition: |
      GitHub changes `/releases/latest/` to exclude
      prereleases AND no `vX.Y.Z` stable tag has been
      published within the same release cycle.
    action: revert
  - signal: install-tooling-default-tag-stable-bumped
    condition: |
      A successor decision (`install-tooling-default-tag-…-
      2026-11` or similar) is recorded with `revises:
      [install-tooling-default-tag-stable-2026-10@1]`.
      Migration path: the successor decision names its
      prior in `relations.revises`; the rollback is
      `git revert <successor-sha>`; the prior stable
      decision's `state` returns to `active` and
      `relations.superseded_by` is cleared.
    action: rework-with-stable-tag
  - signal: edge-channel-removed
    condition: |
      The rolling prerelease `edge` channel is retired
      (e.g., `release.yml` no longer publishes on every
      main push); users no longer need the opt-in
      because the default and the opt-in converge.
    action: archive-obligation


assumptions:
  - id: the-kernel-is-the-authority-on-schemes
    state: assumed
    owner: human:maintainer
    statement: |
      The kernel's `canonical_verifier_schemes` binding and the
      `known_verifier_scheme` predicate in bin/Mathc.ml are the
      authority on which verifier schemes exist. The diagnostic
      reports membership in that list; it does not define it.
    consequence_if_false: |
      The list would have two authorities, and the fixture would be
      asking one of them whether it agrees with itself. The
      canonical list is stated in three places, and this tranche's
      job was to make them say the same thing - not to make the
      kernel's copy the only one that matters, which is a larger
      change than this tranche is chartered for.
    review_on:
      - signal: the-kernel-adds-a-verifier-scheme

  - id: a-skipped-sibling-is-not-a-check
    state: assumed
    owner: human:maintainer
    statement: |
      A verifier whose scheme the kernel cannot read is `Skipped`,
      and a `Skipped` sibling is absorbed by a `Pass` sibling in an
      `all:` acceptance list (bin/Mathc.ml::aggregate_verifier_outcomes).
      A FAIL, a SETUP_FAIL and a MANUAL declaration outrank a PASS;
      a SKIPPED one does not.
    consequence_if_false: |
      The five obligations this tranche repaired would have been
      reported as `pass` with their checks unrun - which is the
      state the corpus was in. The repairs would still be correct,
      but nothing would have shown that the corpus's own verdict
      had been blind, and the next scheme outside the allowlist
      would be invisible again.
    review_on:
      - signal: the-kernel-changes-the-aggregation-order


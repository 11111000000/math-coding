outcomes:
  - id: every-broken-scheme-is-repaired
    statement: |
      No obligation in the live corpus names a verifier scheme the
      kernel cannot read, and the five obligations this tranche
      repaired are classified by the kernel as checks rather than as
      declarations.
  - id: the-allowlist-is-honest
    statement: |
      The diagnostic names the schemes the kernel accepts, because
      it renders the kernel's own binding instead of keeping a copy
      of it, and the convention decision names that binding as the
      authority instead of restating it.
  - id: the-promises-state-what-their-checks-check
    statement: |
      The two claims that were false state the facts that hold, and
      the checks that carry them can go red.

obligations:
  - id: the-allowlist-is-canonical
    outcome: the-allowlist-is-honest
    claim: |
      Every scheme the kernel's diagnostic names as canonical is a
      scheme the kernel accepts, and the list the diagnostic names
      is the list `decisions/verifier-scheme-convention-2026-11.yaml`
      documents. The list is read OUT of the kernel's own diagnostic
      definition and asked about one scheme at a time, so this
      fixture cannot hold a stale copy of the kernel's answers.

      The diagnostic holds no copy either: it renders the kernel's
      two bindings, so the list it prints cannot drift from the
      list the kernel executes. That is what the corpus's own
      history demands - the copy that used to live there named six
      exact schemes and omitted the seventh, and the omission is
      what put a quoted `shell-grep-absent` into the corpus.
    acceptance:
      all:
        - verifier: tests/fixtures/verifier-schemes-are-canonical.sh
  - id: no-obligation-names-a-scheme-outside-the-canon
    outcome: every-broken-scheme-is-repaired
    claim: |
      No decision in `decisions/` names a verifier scheme outside the
      canonical list. The question is asked of the kernel - the same
      `mathc validate` an author runs - and not re-implemented here.
      The five obligations this tranche repaired are among them, and
      the kernel now classifies them as checks rather than as
      declarations.
    acceptance:
      all:
        - verifier: tests/fixtures/verifier-schemes-are-canonical.sh
  - id: the-promises-state-what-their-checks-check
    outcome: the-promises-state-what-their-checks-check
    claim: |
      The two claims this tranche found to be false now state facts
      that hold: the retired `owner:` workaround is gone and the
      kernel's default replaced it, and the aggregator lists exactly
      the obligation ids the parent carries, in the same order. Both
      checks can go red: the aggregator's fixture reports a
      disagreement when there is one, and the retired-prefix fixture
      reports a retired prefix when there is one.
    acceptance:
      all:
        - verifier: tests/fixtures/aggregator-matches-parent.sh
        - verifier: tests/fixtures/decisions-have-no-mc-prefix.sh
  - id: a-fixture-that-measured-nothing-says-so
    outcome: the-promises-state-what-their-checks-check
    claim: |
      Each of the three fixtures this tranche adds answers
      "unknown" - exit 3 - when the thing it measures is not there:
      no kernel to ask the list, no corpus to scan, no obligation id
      to compare. A fixture that measured nothing and reported a
      clean result would be a green light for a question nobody
      asked, and the three fixtures prove their own unknown path by
      asking themselves in a child process.

      The control is inside the fixture, and it is not decoration:
      a promise no check can reach is not a promise, and the exit-3
      path of a fixture is exactly such a promise until something
      runs it.
    acceptance:
      all:
        - verifier: tests/fixtures/verifier-schemes-are-canonical.sh
        - verifier: tests/fixtures/aggregator-matches-parent.sh
        - verifier: tests/fixtures/decisions-have-no-mc-prefix.sh


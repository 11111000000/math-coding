obligations:
  - id: store-is-digest-current
    claim: |
      `mathc rehash` reports zero files needing a stamp: every decision
      under decisions/ carries the digest of its own bytes under
      algebra §7.1, except the waiver/obligations files that belong to
      other schema families and carry no body_sha by design. This is
      the one claim in this decision the kernel can decide entirely on
      its own, so it is the one stated as an obligation.
    acceptance:
      all:
        - verifier: mathc rehash
          result: pass

  - id: stale-digest-code-is-documented
    claim: |
      MC-SHA-DIGEST-STALE is registered and describable:
      `mathc explain-diagnostic MC-SHA-DIGEST-STALE` exits 0 with the
      documented envelope. A diagnostic the project cannot explain is
      a diagnostic its adopters will meet and not understand.
    acceptance:
      all:
        - verifier: mathc explain-diagnostic MC-SHA-DIGEST-STALE
          result: pass

  - id: this-decision-validates
    claim: |
      This decision itself parses and is digest-current under the
      enforcement it introduces. A decision that cannot pass its own
      validator is not a commitment.
    acceptance:
      all:
        - verifier: mathc validate decisions/enforce-body-sha-digest-2026-10.yaml
          result: pass

risk:
  declared_triggers:
    - "a decision is edited without running mathc rehash"
    - "a vendored or generated file under decisions/ is rewritten by a tool that does not recompute"
  owner: human:maintainer

assumptions:
  - id: single-prefix-is-correct
    claim: |
      §7.1's `placeholder = "sha256:" + "0"*64 + "\""` is substituted
      into the WHOLE matched field, so the prefix appears once. Confirmed
      by the Python reference (`scripts/axiom-link-seed.py:133-169`) and
      by the 103 stored digests that already matched under that rule
      before this change.

reversal: |
  Set the `?raw_bytes` argument to None at the one call site in
  `bin/Mathc.ml::validate_with_counts` and remove the dispatch entry for
  `rehash`. That restores exactly the previous behaviour, including its
  two known failure modes. The digest values written by `rehash --write`
  are self-consistent under either rule only for the single-prefix form,
  so reverting the enforcement without reverting the store re-breaks the
  114 files this branch refreshes.


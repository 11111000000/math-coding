    - "the trailing prose that left a verifier string is lost, and
      the claim it belonged to no longer says how the check is to be
      read"
  owner: human:maintainer

counterexample: |
  "The trailing prose in a verifier string is not noise: it says
  which scenario the promise is about, and deleting it makes the
  promise broader than it was."

  The claim is right about the intent and wrong about the form. The
  kernel cannot run `tests/cli/gate-waiver-scope.t scenario 1
  (positive)` -- there is no such command, and a check that cannot
  be set up is a check whose outcome is UNKNOWN, not a narrower
  check. The scenario label has to go somewhere the kernel reads, and
  the place is the claim, which is prose about the promise. The
  promise becomes broader (`the file passes`) and says so; what it
  never was is narrower.

  The second half of the objection is about the map form: maybe the
  kernel should learn to read it instead. It could, and the loader
  would then have two forms to keep in step with the validator's
  parser -- which is the defect this whole line of work is about.
  The schema has ONE form; the corpus now has one form; the loader
  reads that form.

antithesis: |
  The opposite claim is that these nineteen promises are the visible
  tip: the corpus's real problem is the 299 promises the kernel does
  not run, and polishing the spelling of nineteen is noise.

  The claim is right about the size and wrong about the order. The
  nineteen were promises the kernel COULD have run and could not, and
  they were invisible in the report precisely because they were
  invisible -- a promise the kernel cannot see is a promise no gate
  can hold, and it hides the ones it would have held. Fixing the
  spelling first is what makes the census of the 299 possible: a
  census that cannot tell a declaration from a broken spelling is a
  census of nothing.

axiom_link:
  - A0

intent: |
  THE WORKLIST FOUND NINETEEN PROMISES THE KERNEL CANNOT EVEN SEE.
  Every one of them is a promise the corpus makes and the kernel
  cannot decide, and the reason is never the promise -- it is the
  spelling.

  Eight of them name a scheme the kernel KNOWS and a string it cannot
  run: a path verifier with a trailing case label after it
  (`tests/cli/gate-waiver-scope.t scenario 1 (positive)`), a test
  selector with a trailing description
  (`tests/diagnostic_ux.ml::ambiguous_acceptance.has actions`). The
  promise is real, the file is there, and the string after the path
  is prose that belongs in the claim, not in the command.

  Nine of them use the acceptance form the schema does not have:
  `acceptance:` with `verifier:` as a MAP KEY instead of
  `acceptance.all[].verifier`. The loader reads the list form and
  silently finds no verifier, so those obligations look like promises
  with no check at all -- and nobody noticed, because a promise with
  no check is exactly what the corpus is full of.

  Two of them name no verifier at all, and say so in prose: the
  process-principles obligations P3 and P4, whose own claim says
  "Acceptance is manual". A promise that says "a human reviews
  this" should SAY IT in the field the kernel reads, not only in the
  sentence above it.

  MEASURED on this repository, 2026-10-28, through `mathc gaps`:

    before: 8 `cannot-be-set-up`, 11 `unidentified`
    after:  0 `cannot-be-set-up`,  0 `unidentified`

  The remaining `not-a-check` promises (299, of which most are
  `manual-` declarations) are a different matter: they are promises
  the corpus INTENDS not to keep by machine, and they belong to the
  census of promises, not to a spelling.

commitment: |
  1. A verifier string names a scheme and its arguments, and nothing
     else: the prose around a check belongs in the claim.
  2. Every obligation states its acceptance in the form the schema
     has (`acceptance.all[].verifier`), so the loader and the
     validator read the same field.
  3. An obligation that no program can keep says so in its verifier
     (`manual-...`), not only in the prose of its claim.
  4. The worklist reports no promise the kernel cannot see: the
     `cannot-be-set-up` and `unidentified` classes are empty.

outcomes:
  - id: every-promise-is-visible
    statement: |
      The worklist names every open promise, and no promise is
      invisible to the kernel because of how it is spelled.
  - id: the-scheme-convention-holds
    statement: |

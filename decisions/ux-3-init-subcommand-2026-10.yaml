    - mathc-init-subcommand
  paths:
    - "lib/init/dune"
    - "lib/init/init.ml"
    - "bin/Mathc.ml"
    - "bin/dune"
    - "tests/cli/init.t"
    - "decisions/ux-3-init-subcommand-2026-10.yaml"
  exclusions:
    - "lib/decision.ml"
    - "lib/policy.ml"
    - "lib/risk.ml"
    - "lib/gate.ml"
    - "lib/diagnostic.ml"
    - "lib/canonical.ml"
    - "lib/render.ml"
    - "lib/migrate.ml"
    - "lib/waiver.ml"
    - "lib/attestations/**"
    - "lib/git/**"
    - "lib/junit/**"
    - "lib/mcp/**"
    - "spec/**"
    - "schemas/**"
    - "axioms/**"
    - "scripts/install-tooling/**"
    - "decisions/decision.yaml"
    - "decisions/mcp-server-impl-2026-10.yaml"
    - "decisions/install-tooling-2026-10.yaml"

outcomes:
  - id: init-scaffolds-greenfield
    statement: |
      `mathc init [PATH]` in an empty (or `--merge`-bypassed)
      directory creates `decisions/`, `attestations/`, a valid
      `decisions/decision.yaml`, and (unless `--no-install`) a
      `.githooks/pre-commit` script. Exits 0 on success, 3 on
      brownfield refusal, 2 on input error.
  - id: init-refuses-brownfield
    statement: |
      `mathc init` in a directory containing `docs/arc42/`,
      `docs/adr/`, or `adr/` exits 3 with a stderr message that
      names the detected convention and points the user at
      `mathc import-adr` (Phase 1 follow-up). `--merge`
      overrides the refusal.
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-init-subcommand-2026-10.yaml` exits 0.

assumptions:
  - id: kernel-api-stable
    state: assumed
    statement: |
      The `lib/` kernel API (Domain, Decision, Memory, etc.) is
      stable for this slice. The new sub-library depends only
      on `mathcoding_core` plus standard library `Unix` and
      `Str` (per OCAML_BEST_PRACTICES §10.1 adapter rules).
    owner: human:maintainer
    consequence_if_false: |
      If a future kernel change breaks the init sub-library
      deps, the build fails and this decision is revised.
    review_on:
      - signal: init-build-broken
  - id: pre-commit-hook-format-stable
    state: assumed
    statement: |
      git's pre-commit hook format (a file at
      `.git/hooks/pre-commit` or `core.hooksPath/pre-commit`
      marked executable) is stable. The hook body uses only
      POSIX-sh features and `mathc` (assumed on PATH in the
      commit-time environment).
    owner: human:maintainer
    consequence_if_false: |
      If git changes the hook format or drops `core.hooksPath`
      semantics, the installed hook silently fails. Resolution:
      a follow-up decision updates the hook body and re-runs
      init on affected repos.
    review_on:
      - signal: git-hooks-path-changed

obligations:
  - id: cram-test-passes
    outcome: init-scaffolds-greenfield
    claim: |
      `tests/cli/init.t` exercises the four user-visible
      surfaces (empty dir, brownfield refuse, `--merge`,
      refuse-on-overwrite) and the `--agent` input-error
      surface. Each case asserts the right exit code and the
      right filesystem state.
    acceptance:
      all:
        - verifier: tests/cli/init.t
          result: pass

  - id: brownfield-detection-active
    outcome: init-refuses-brownfield
    claim: |
      `mathc init` in a directory with `docs/arc42/`,
      `docs/adr/`, or `adr/` exits 3 with a stderr line that
      contains the literal `refusing to init in brownfield
      project` and the literal `pass --merge`.
    acceptance:
      all:
        - verifier: tests/cli/init.t::Brownfield
          result: pass

  - id: this-decision-validates
    outcome: this-decision-validates
    claim: |
      `mathc validate
      decisions/ux-3-init-subcommand-2026-10.yaml` exits 0.
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-init-subcommand-2026-10.yaml
          result: pass

reversal:
  - signal: init-subcommand-removed
    condition: |
      The `mathc init` subcommand is removed (e.g. folded back
      into `install.sh --init` per an install-tooling follow-up).
      Resolution: this decision is superseded; the kernel
      surface (`lib/init/`, `bin/Mathc.ml::do_init`) is deleted
      via a follow-up decision.
    action: supersede-with-install-tooling-init
  - signal: pre-commit-hook-format-broken
    condition: |
      git's pre-commit hook format changes in a way that
      breaks the installed hook (e.g. core.hooksPath is
      removed). Resolution: update the hook body in
      `lib/init/init.ml::pre_commit_hook_body` and re-run
      init on affected repos; this decision is revised.
    action: rework

risk:
  declared_triggers:
    - init-build-broken
    - git-hooks-path-changed
    - brownfield-detector-false-positive
  owner: human:maintainer

relations:

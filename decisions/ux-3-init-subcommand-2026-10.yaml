schema: math-coding/3.2
id: ux-3-init-subcommand-2026-10
revision: 2
state: active
body_sha: "dface25df477573f125dfa6b0870d94e8f4ece64b65fc528b8b268acb693de40"
yaml_sha: "dface25df477573f125dfa6b0870d94e8f4ece64b65fc528b8b268acb693de40"
intent: |
  Phase 1 of the ux-3 workstream. Land a `mathc init` subcommand
  that scaffolds a new math-coding project in a target directory.
  The command creates `decisions/` and `attestations/` directories,
  writes a `decisions/decision.yaml` master policy from an
  in-binary minimal template, and installs a pre-commit hook at
  `.githooks/pre-commit` (unless `--no-install` is passed). The
  default flags `--agent` (opencode | claude-code | cursor |
  continue | generic) and `--from-adr` are accepted but `--from-adr`
  is a no-op stub in this slice; ADR import is the
  `ux-3-import-adr-subcommand-2026-10` decision.

  Brownfield behavior: refuses to scaffold on top of an existing
  arc42 (`docs/arc42/`), MADR (`docs/adr/`), or adr-tools
  (`adr/`) project unless `--merge` is passed. The refuse message
  names the detected convention and points the user at
  `mathc import-adr` (Phase 1 follow-up) as the brownfield path.
  This is the Q5 "Refuse + explicit --merge" answer.

  No kernel surface changes — the kernel under `lib/` stays pure
  per OCAML_BEST_PRACTICES §1.3. The init implementation lives in
  the new sub-library `lib/init/` (per §10.1 adapter convention),
  which is the only I/O surface for this slice. Touches:

    lib/init/dune                          (new sub-library)
    lib/init/init.ml                       (the implementation)
    bin/dune                               (add mathcoding_init to libs)
    bin/Mathc.ml                           (do_init + dispatch entry
                                            + print_usage update)
    tests/cli/init.t                       (cram fixture)
    decisions/ux-3-init-subcommand-2026-10.yaml   (this file)

axiom_link:
  - A0
  - A1
  - A3

antithesis: |
  The counter-position considered and rejected: "`mathc init` is
  shell-script territory; a 200-line OCaml sub-library is overkill
  for what amounts to `mkdir -p decisions attestations && cat
  >decision.yaml`. Keep the install path in `install.sh` (per
  `install-tooling-2026-10@1`) and skip the new subcommand." The
  author engaged with this position and rejected it on five
  grounds: (a) `install.sh` covers the *release tarball* flow
  (per-user install of the binary plus skill), not the
  *greenfield-project-scaffold* flow; today, a developer who
  wants to start a new project has to follow four manual
  steps in `adoption/SKILL.md:67-87` (mkdir, curl policy,
  $EDITOR scope.paths) — that is the gap `mathc init` closes;
  (b) the brownfield-detection rule (refuse on `docs/arc42/`
  etc.) needs the kernel to read the filesystem, not a POSIX
  shell script — `arc42` lives at `docs/arc42/`, but other
  variants live elsewhere, and a shell heuristic would
  silently miss them; (c) the sub-library pattern is the
  project convention (per OCAML_BEST_PRACTICES §10.1 — every
  new I/O surface gets `lib/<name>/dune`); a 200-line
  sub-library is the expected cost, not over-engineering;
  (d) A3 self-application requires a decision for any change
  to the kernel API (new subcommand + new sub-library), and
  the obligation pair is the only way to record and verify
  the scope; (e) the `install.sh` flow stays as the
  per-user install path and is unchanged by this decision —
  the two flows are complementary, not redundant.

commitment: |
  One kernel surface, one binary, one new sub-library. Six
  deliverables, each pinned by an obligation or fixture:

    D1. `mathc init [PATH]` creates `decisions/` and
        `attestations/` directories in PATH (default cwd).

    D2. `decisions/decision.yaml` is written with the minimal
        master-policy template (`schema: math-coding/3.2`,
        `id: bootstrap-v3`, `scope.paths` editable, one
        `acceptance: mathc self-check` obligation).

    D3. `.githooks/pre-commit` is installed (executable,
        validates every staged `decisions/*.yaml` then runs
        `mathc self-check`) unless `--no-install` is passed.

    D4. Brownfield detection: refuses with exit 3 on
        `docs/arc42/`, `docs/adr/`, or `adr/` presence unless
        `--merge` is passed. Error message names the
        detected convention and points at `mathc import-adr`.

    D5. Flags: `--agent` accepts generic|opencode|claude-code|
        cursor|continue (currently a no-op beyond printing the
        selection — full per-agent behavior is a follow-up);
        `--from-adr` is accepted but no-op (deferred to
        `ux-3-import-adr-subcommand-2026-10`); `--no-install`
        skips the pre-commit hook; `--merge` allows init in
        brownfield directories.

    D6. The kernel under `lib/` stays offline and pure per
        OCAML_BEST_PRACTICES §1.3. The init sub-library is
        the only I/O surface.

  Boundaries (A3 self-application):
    - `lib/init/` is the only new sub-library.
    - `bin/Mathc.ml` is touched only to add the `do_init`
      function, the `| "init" -> do_init ()` dispatch arm,
      and the `init` line in `print_usage`. No other
      subcommand is changed.
    - `bin/dune` is touched only to add `mathcoding_init`
      to the `mathc` executable's libraries list.
    - `spec/`, `schemas/`, `axioms/`, the existing
      `install.sh`, the existing `install-tooling-2026-10`
      flow, the per-user skill pipeline — all unchanged.
    - No telemetry, no live HTTP server, no new CLI flags
      outside the `init` subcommand's argv.

counterexample: |
  "`mathc init` is just `mkdir + cat`; an OCaml sub-library
   is over-engineering." The counterargument fails because the
   brownfield detection is the load-bearing feature: without
   it, a user running `mathc init` in a project that already
   has `docs/arc42/` would silently overwrite their master
   plan, and the resulting decisions/ would be inconsistent
   with arc42 — a silent-promotion violation of A1. The
   sub-library exists to keep the brownfield heuristic
   next to the kernel API where future agents (and tests)
   can reach it; a shell script would couple the heuristic
   to the install-tooling release artifact and make it
   impossible to evolve. "The four-step manual procedure in
   `adoption/SKILL.md` is fine; nobody needs a new
   subcommand." This fails because the user feedback that
   triggered the ux-3 workstream is exactly that the manual
   procedure is the adoption bottleneck. `mathc init`
   replaces four manual steps with one; the four-step doc
   stays as the educational artifact.

scope:

outcomes:
  - id: dev-shell-entry-avoids-store-lock
    statement: |
      `scripts/dev-env.sh` materialises `nix print-dev-env .#test`
      once and evals the cached file; a cache hit takes no Nix store
      lock.
  - id: cleanup-is-session-scoped
    statement: |
      `cleanup_dune_lock` terminates only descendants of its own
      shell process; no `pkill -f` command-line matching remains in
      `scripts/dev`.
  - id: regression-fixture-asserts-both
    statement: |
      `tests/fixtures/dev-cleanup-is-scoped.sh` fails against the
      pre-fix tree and passes against the post-fix tree.

obligations:
  - id: no-machine-wide-pkill
    claim: |
      `scripts/dev` contains no `pkill -f 'nix develop .#test'` in
      executable code, and a decoy process carrying that string in
      its `/proc/PID/cmdline` survives a `cleanup_dune_lock` call.
    acceptance:
      all:
        - verifier: tests/fixtures/dev-cleanup-is-scoped.sh
          result: pass

  - id: cache-invalidation-on-flake-edit
    claim: |
      `.dev/test-env.stamp` records a hash of `flake.nix` and
      `flake.lock`; editing either causes `mc_dev_env_ensure` to
      rebuild `.dev/test-env.sh`.
    acceptance:
      all:
        - verifier: tests/fixtures/dev-cleanup-is-scoped.sh
          result: pass

  - id: fallback-preserves-behaviour
    claim: |
      When the cache cannot be produced, `mc_run_in_shell` falls back
      to `nix develop .#test --command bash -c`, preserving the
      pre-change behaviour.
    acceptance:
      all:
        - verifier: shell-grep "nix develop .#test --command bash -c" scripts/dev-env.sh
          result: pass

  - id: upstream-documented
    claim: |
      `OCAML_KERNEL_CONVENTIONS.md` carries a §11.42 entry describing the
      store-lock stall with a reproduction, and it explicitly states
      that §11.41 (`_build/.lock`) is a different failure.
    acceptance:
      all:
        - verifier: shell-grep '^### 11.42' OCAML_KERNEL_CONVENTIONS.md
          result: pass

risk:
  declared_triggers:
    - stale-dev-env-cache
    - cache-path-collides-with-other-tooling
    - gc-window-still-blocks-cold-cache-build
  drift_recurs: |
    The cached environment can go stale if `flake.nix` or
    `flake.lock` changes without the content hash noticing. The
    stamp is a `cksum` of both files' bytes, so any edit invalidates
    it; the residual risk is a tool rewriting the store paths
    without touching either file (e.g. `nix store repair`), which
    the manual escape hatch (`rm -rf .dev/test-env.sh`) addresses.

    The residual known limitation is that the FIRST
    `mc_dev_env_ensure` after an invalidation still calls
    `nix print-dev-env`, which takes the store lock and can stall
    during a GC window. `MC_DEV_ENV_TIMEOUT` bounds that wait and
    the fallback keeps the command working. Closing this fully would
    require moving the timers, which is outside this repository.


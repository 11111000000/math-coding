  - id: materials-digest-required-for-runtime-kinds
    statement: |
      An attestation with kind_ in test/build/observation and
      materials_digest empty is rejected with
      MC-MATERIALS-DIGEST-EMPTY (Block). An attestation with
      kind_ review and materials_digest empty is accepted
      (humans may declare without runtime anchor).
  - id: revision-int-extractable
    statement: |
      Memory.decision_entry.revision is Some 1-string for a YAML
      decision whose revision value is the bare integer 1.
      The existing Schema.take_string path already handles Int; the
      behaviour is confirmed by hand (obligation
      `revision-int-extractable-direct`).
counterexample: |
  These are pedantic typo fixes. The kernel is fine. The brownfield
  authors should patch their YAML by hand.

  Counterargument: each of the six fixes closes a contract defect,
  not a usability nit. mathc init producing a non-validating file
  is a bootstrap blocker (REPORT.md §3.1). The kernel returning
  MC-MISSING-INTENT when the real cause is counterexample-missing
  is a diagnostic-correctness bug (§3.2). body_sha shell-template
  surviving equality check is a security-relevant failure -- the
  digest is supposed to anchor the document body. An empty
  materials_digest for a test-class attestation is review-laundering
  a runtime-evidence claim (§3.6). verifier = obligation-id in
  mathc packages is a placeholder violation of invariant 8 -- the
  verifier is supposed to bind the obligation to evidence. Each
  is an actionable defect with a one-line fix. Leave them is the
  brownfield-cost the experiment already paid (see §3.1 -- every
  agent hitting the bootstrap has to rediscover the counterexample
  rule before getting a green self-check).

  This is too much change for one slice. Split it into six PRs.

  Counterargument: the six fixes share a single commit because they
  share a single bootstrap gate -- the brownfield experiment
  mathc init && mathc validate path. Splitting into six PRs would
  require six mathc init runs, each one partial-fixing the
  bootstrap, and each partial fix has a window where
  mathc init && mathc validate still fails. A single commit
  collapses that window to zero. The commit subject uses
  Conventional Commits and lists all six sub-fixes in the body
  so a reviewer can audit each independently.

  Tightening materials_digest breaks every existing test
  attestation in the store -- 29 of 40 carry materials_digest empty.

  Counterargument: the existing attestations in attestations/ are
  kind_ build and were generated by ci-bot whose substrate-
  fingerprint does not capture a materials digest. Tightening the
  schema is a forward-only change. Old attestations remain
  readable -- their materials_digest empty is grandfathered by a
  one-line rule in load_decision_yaml. An attestation with
  kind_ build AND no materials_digest is accepted when its
  issued_at predates 2026-10-16, the bootstrap date of this
  decision. New attestations produced after this commit carry a
  non-empty digest. The migration is documented in decisions/
  attestation-materials-digest-2026-10 and the lib/attestations/
  attestations.ml migration note.

  Adding axiom_link A0 and A3 to the master template is
  cargo-culting -- most projects do not need A3 self-application.

  Counterargument: every active math-coding project is self-
  applying by construction. The kernel decides whether decisions
  are well-formed using its own; a future change to the kernel
  changes what counts as well-formed. A3 is the axiom that names
  this circularity as a feature; omitting it from the master
  template hides it from agents who follow SKILL.md literally.
  The counterexample field is A4 Care -- every project carries at
  least one rejected objection (the overhead-for-solo-developer
  objection is the most universal and least project-specific
  one). Without these two fields, the template cannot bootstrap
  self-application, which is the whole point of math-coding.

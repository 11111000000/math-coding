reversal:
  - signal: brownfield-repos-cannot-fix-non-pattern-sha
    condition: |
      A brownfield repo that already shipped body_sha as
      sha256-shell-template because the previous bootstrap did
      not enforce the pattern cannot migrate without losing the
      existing decision content.
    action: rework
    recovery: |
      A migration script at scripts/fix-non-pattern-sha.sh walks
      every decisions/*.yaml, replaces the non-pattern body_sha
      and yaml_sha with the SHA-256 of the actual decision body,
      and writes the new digest back. The script is idempotent.
      A decision whose body_sha already matches the pattern is
      left untouched.

  - signal: existing-test-attestations-break-self-check
    condition: |
      After the schema tightening, mathc self-check against the
      existing attestations/*.json store flips to a non-pass
      verdict because every existing kind_ test attestation
      carries materials_digest empty.
    action: rework
    recovery: |
      The migration note in lib/attestations/attestations.ml
      grandfathering kind_ build and test attestations whose
      issued_at predates 2026-10-16 is the recovery path. Newly
      produced attestations carry the digest; legacy ones are
      accepted by the loader. If the migration note is
      insufficient, the schema-level constraint is rolled back
      and the rule becomes a Warn (not Block) for a one-release
      deprecation cycle.

  - signal: cli-precheck-reordering-breaks-fixtures
    condition: |
      Reordering the axiom and counterexample and antithesis
      checks in bin/Mathc.ml validate_with_counts produces a
      different diagnostic code for an existing cram fixture
      (which was written against the prior ordering).
    action: rework
    recovery: |
      Update the affected cram fixtures to assert the new
      diagnostic code. The fixture diff is bounded to the
      tests/cli/counterexample-*.t and tests/cli/axiom-*.t
      family; no production code path is affected.
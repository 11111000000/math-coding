intent: |
  Close six kernel-level defects surfaced by the 2026-10-16 brownfield
  experiment on httpx and cobra (REPORT.md §3, PLAN.md §3). The defects fall
  into three buckets -- init ships a non-validating master template and
  the kernel returns MC-MISSING-INTENT when the real cause is the missing
  counterexample. body_sha and yaml_sha are equality-checked but not
  pattern-checked, so a literal sha256-shell-template survives parse.
  The attestation schema accepts an empty materials_digest for
  test/build/observation attestations, and mathc packages reports the
  obligation-id as the verifier instead of the actual one extracted from
  the YAML. Each fix carries a positive and a negative fixture, a
  counterexample that names the strongest objection considered and
  rejected, and a self-application closure (A3).
axiom_link:
  - A0
  - A3
commitment: |
  Apply six localized kernel changes. Each protected by an existing
  decision and a new attestation at attestations/kernel-bugs-v3.4-*.json.

  (a) lib/init/init.ml master_policy_template adds axiom_link A0 and A3
      and a counterexample block naming the overhead-for-solo-developer
      objection. After this commit, mathc init . --no-install followed
      by mathc validate decisions/decision.yaml exits 0 without edits.

  (b) lib/decision.ml parse_decision_value checks the counterexample
      and antithesis and axiom_link slots BEFORE the intent shape check.
      An YAML-form intent (block scalar) combined with a missing
      counterexample now yields MC-COUNTEREXAMPLE-MISSING (Block), not
      MC-MISSING-INTENT. The CLI pre-check in bin/Mathc.ml
      counterexample_violation is fixed in tandem so mode_exempt is
      true only for tiny and light; for modes >= standard the Block
      diagnostic surfaces before parse.

  (c) lib/decision.ml parse_decision_yaml rejects body_sha and
      yaml_sha that do not match sha256-colon-64-hex. The new
      diagnostic code MC-BODY-SHA-PATTERN-VIOLATION is Block. The
      httpx master policy (which carries sha256-shell-template
      because it was generated by a bash template literal) becomes
      invalid; the remediation is documented in the brownfield report
      and is one-line per affected repo.

  (d) lib/packages.ml obligation_view carries the real verifier
      string from the YAML acceptance block instead of the
      obligation-id placeholder. Memory.decision_entry grows a
      verifier_per_obligation field, populated during
      parse_decision_yaml on the memory side by walking each
      obligation acceptance.all/any verifier entry.

  (e) schemas/attestation.json tightens materials_digest so kind_
      in test/build/observation requires a non-empty digest. The
      kernel-side check lives in lib/codec.ml parse_attestation;
      a new dispatch in bin/Mathc.ml validate_with_counts surfaces
      MC-MATERIALS-DIGEST-EMPTY (Block) for affected files. kind_
      review remains exempt -- humans may declare without a runtime
      material anchor.

  (f) lib/memory.ml parse_decision_yaml already extracts revision
      as Int via Schema.take_string, which handles both String and
      Int. No dedicated regression fixture ships for it; the
      behaviour is confirmed by hand through `mathc context` and is
      carried by the manual obligation `revision-int-extractable-direct`.

  No schema-family change (the schema version remains 3.2); no
  gate verdict surface change; no new attestation kind. The change
  is purely a tightening of the kernel existing checks.

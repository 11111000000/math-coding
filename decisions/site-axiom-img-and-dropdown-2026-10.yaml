outcomes:
  - id: axiom-figure-renders
    statement: |
      On `dist/axioms.html`, `dist/axioms.ru.html`, and
      `dist/axioms.zh.html` every `<img>` inside a
      `.mathc-axiom-figure` resolves to a 200 response
      in the browser; the figure shows the axiom
      diagram, not the broken-image alt text. A Playwright
      snapshot confirms no 404s in the console.
  - id: per-axiom-icon-renders
    statement: |
      On each of the five `dist/axioms/<id>.html`
      pages, the `mathc-axiom-icon` resolves to a 200
      response and renders. The epistemic-separation
      figure at the bottom of `dist/axioms/separation.html`
      also resolves.
  - id: dropdown-survives-traversal
    statement: |
      Hovering the `.nav-group-toggle` opens the
      panel; moving the cursor down through the 0.4rem
      gap onto a panel item keeps the panel open. A
      Playwright snapshot of `axioms.html` with the
      cursor over the "FAQ" item inside the open
      "Adopt" dropdown shows the panel still visible.
  - id: build-still-clean
    statement: |
      `dune build --root .` exits 0; `mathc validate
      decisions/site-axiom-img-and-dropdown-2026-10.yaml`
      accepts; the existing `mathc self-check` verdict
      is unchanged.
assumptions:
  - id: base-href-stays-project-root
    state: assumed
    statement: |
      `<base href="/math-coding/">` remains the default
      in `lib/render.ml`. Self-hosted forks that deploy
      at a different path override via `Render.config.site_base`.
    owner: human:maintainer
    consequence_if_false: |
      A future change to the base href would re-derive
      the path arithmetic here. Reopen this decision and
      re-emit the corrected paths.
    review_on:
      - signal: base-href-default-changed
  - id: axiom-svgs-remain-80x80
    state: assumed
    statement: |
      The five hand-rolled 80x80 SVG illustrations
      under `assets/axiom-*.svg` are the canonical
      icons for the axiom index and per-axiom pages.
      A future redesign that introduces new icons will
      re-derive the CSS sizing rule.
    owner: human:maintainer
    consequence_if_false: |
      If a redesign introduces, e.g., 160x160 SVGs,
      the `width: 96px` rule would downscale them and
      look soft. Reopen and replace the explicit pixel
      sizes with `width: auto; height: 6em;` or similar
      viewBox-relative sizing.
    review_on:
      - signal: axiom-icon-redesigned

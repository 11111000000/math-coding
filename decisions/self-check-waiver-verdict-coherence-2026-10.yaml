reversal:
  - signal: consumer-requires-the-old-string
    condition: |
      A downstream tool (CI dashboard, adoption skill, release
      script) turns out to branch on `.verdict == "pass"` for a
      subject and now mis-handles `open-with-waiver`. Resolution:
      the consumer branches on `.verdict == "pass"` for a genuine
      pass and on `.waivers[]` for a waived one; the vocabulary is
      the documented one (`spec/semantics.md` §Merge Gate).
    action: rework
  - signal: waivers-expire-without-remediation
    condition: |
      `decisions/waivers/*.yaml` reach `expires_at` with their
      obligations still unmet. Then `Waiver.effective_at` returns
      false, the subject returns to `unknown`, and the exit code
      goes to 3 — which is the intended pressure, not a regression.
      The follow-up is attestation generation, not a code change.
    action: attest
  - signal: spec-vocabulary-contradiction-reopened
    condition: |
      `spec/semantics.md:418` is edited to re-affirm a three-value
      self-check vocabulary, or a conformance fixture is added that
      requires `pass` for a waived subject. Resolution: this
      decision and the spec line are reconciled in one cycle, with
      a migration note for consumers.
    action: rework

risk:
  declared_triggers:
    - consumer-requires-the-old-string
    - waivers-expire-without-remediation
    - spec-vocabulary-contradiction-reopened
    - cram-replays-stale-outcome-after-kernel-change
  drift_recurs: |
    The laundering came back once already, in a different shape:
    `path-probe-anchoring-2026-11` found an EMPTY obligation set
    reported as `pass`, this decision found a NON-empty one
    reported as `pass`. Both were "verdict says green, evidence in
    the same object says otherwise". The guard against a third
    shape is `tests/cli/self-check-waiver-verdict.t` scenario 2,
    which asserts the cross-field property ("no `pass` subject
    carries a cause") over the live tree rather than a count, so
    it fires for any future labelling of a non-empty gap as green
    and does not need updating when decisions come and go.

    Found while measuring `changed-verdicts`, and NOT fixed by
    this decision: `decisions/waiver-infrastructure-2026-10.yaml`
    declares the `obligations:` key twice, and the kernel's YAML
    reader keeps the first block. `mathc validate` therefore
    reports 1 obligation for a file that declares 6, and the gate
    silently stops enforcing `waiver-loader-tested` and
    `self-check-emits-pass-with-waiver`. This is the strongest
    available evidence that an attestation in the store is not
    evidence the gate consumed: the store held a `pass`
    attestation for an obligation no evaluator ever read. Repair
    belongs in a rev bump of that decision (merge the two blocks,
    recompute body_sha) and is deliberately out of this decision's
    `scope.exclusions`.

    Also pre-existing and observed while retiring the attestation:
    `mathc validate` rejects
    `attestations/waiver-infrastructure-2026-10-self-check-emits-pass-with-waiver.json`
    with `MC-MATERIALS-DIGEST-EMPTY` — a `kind_: test` attestation
    with an empty `materials_digest`. The file rejected identically
    at HEAD (`git show HEAD:...` piped to `mathc validate`), so
    this change neither causes nor fixes it. Recorded because the
    retirement touched the file and a reviewer will ask.

    Known residual, recorded rather than fixed here:
    `Waiver.effective_at` treats `expires_at` as INCLUSIVE
    (`issued_at <= now <= expires_at`, pinned by
    `tests/waiver_test.ml`), while constitution.md Invariant 14c
    requires `expires_at` to be "strictly greater than the
    evaluation time". The two disagree for the single instant at
    which `now == expires_at`. Closing it is a one-line change to
    `lib/waiver.ml` plus a fixture update, and it is left alone
    here because it is a different defect from the one this
    decision fixes and it has its own blast radius (every waiver
    boundary test).

    Harness caveat for anyone re-running the fixtures: dune
    replays a recorded cram outcome from
    `_build/**/.cram.<name>/cram.out` when it cannot observe that
    the binary moved (the binary reaches the sandbox through the
    `_build/install/default/bin/mathc` symlink, so rebuilding the
    kernel moves the target without changing the cache key). A
    green `dune runtest tests/cli` after a kernel edit may be a
    replay, not a run. `scripts/check.sh:136-146` documents this
    and starts its cram stage with `dune clean`; do the same
    before trusting a local cram result.
  owner: human:maintainer


outcomes:
  - id: waived-verdict-is-not-pass
    statement: |
      A subject whose gaps are accepted by a waiver reports
      `open-with-waiver`, never `pass`, at both the subject and
      the repository level. `pass` and a non-empty `causes[]` are
      no longer co-representable.
  - id: waiver-is-named-in-output
    statement: |
      Every `open-with-waiver` subject carries a `waivers[]` entry
      naming the waiver with its issuer, issue and expiry dates,
      its scope, and the obligations of that subject it covers.
      Every other verdict carries an empty array.
  - id: pure-aggregation-is-testable
    statement: |
      The waiver step is `Gate.aggregate_with_waivers`, a pure
      function whose decision table (waivable kinds, partial
      coverage, expiry, scope) is covered without a filesystem.
  - id: counters-drift-is-real
    statement: |
      A documentation counter claim is checked against the live
      value when, and only when, the claim is live-scoped and the
      paragraph is not a dated snapshot. Historical prose is
      exempt by anchor, not by pattern-narrowing.
  - id: stale-attestation-retired
    statement: |
      The attestation that recorded the old `pass`-with-waiver
      behaviour is `inconclusive` with a reason naming the
      supersession, so the store does not claim a behaviour the
      kernel no longer has.

changed-verdicts: |
  Measured on the same tree and the same attestation store (only
  committed + new, no `.gitignore`d test scratch), via
  `MATH_CODING_ATTESTATION_STORE` pointed at a store built from
  `git ls-files --cached --others --exclude-standard`:

      before:  subjects 206 | pass 198 | open-with-waiver 0 | unknown 8
      after:   subjects 206 | pass 191 | open-with-waiver 7 | unknown 8

      before:  7 subjects reported `pass` while carrying 33 causes
      after:   0 subjects report `pass` with a non-empty causes[]

  Zero subjects moved into `unknown` because of the code change.
  The seven were never `Unknown` at the kernel level — they were
  `Open_with_waiver` wearing the wrong label — so the fix relabels
  them and inflates nothing. The eighth unknown in both columns is
  this decision itself, before its own eight attestations are
  counted; once they are (they are generated in the same commit),
  the tree reads pass 192 | open-with-waiver 7 | unknown 7.

  The top-level verdict is `unknown` and the exit code is 3 before
  and after, for the same unrelated reason: seven other subjects
  (`forge-verify-principals-extension`,
  `stub-lint-fmt-conflict-telemetry-2026-10`,
  `path-probe-anchoring-2026-11`, `ci-cram-cleanup-batch2-2026-10`,
  `plan-2026-11-adoption-fixes-2026-10`, `ci-green-batch1-2026-10`,
  `nix-develop-store-lock-contention-2026-10`) are unknown for
  reasons no waiver touches.

  Commitment (g) has NO verdict effect, and the reason is itself a
  found defect. `decisions/waiver-infrastructure-2026-10.yaml`
  declares `obligations:` TWICE — once at line 7 with
  `trivial-obligation`, again at line 175 with `waiver-loader-
  tested` and `self-check-emits-pass-with-waiver`. The kernel's
  YAML reader keeps the first block, so `mathc validate` reports
  `obligations: 1` for a file that declares six `- id:` entries,
  and the gate has never evaluated `self-check-emits-pass-with-
  waiver` — the very obligation whose attestation this decision
  retires. Retiring it is still correct (the store must not claim
  a behaviour the kernel no longer has), but it will not move a
  verdict until that decision's duplicate key is repaired. That
  repair is another decision's body and is NOT taken here; see
  `risk.drift_recurs`.

  Exit codes: unchanged (0 / 1 / 3). CI impact: none.

obligations:
  - id: waived-verdict-is-not-pass
    outcome: waived-verdict-is-not-pass
    claim: |
      A synthetic project with one wholly-waived decision reports
      `"verdict":"open-with-waiver"` at the repository level and
      for the subject, and no subject reports `pass` while
      carrying a cause. On the live tree no subject reports `pass`
      with a non-empty `causes[]` or `remedies[]`.
    acceptance:
      all:
        - verifier: tests/cli/self-check-waiver-verdict.t
          result: pass

  - id: waiver-is-named-in-output
    outcome: waiver-is-named-in-output
    claim: |
      The synthetic `open-with-waiver` subject carries a
      `waivers[]` entry with id, issuer, issued_at, expires_at,
      scope and the two covered obligations; every live
      `open-with-waiver` subject names a waiver that is unexpired
      at the reported `now` and covers at least one obligation; no
      `pass` subject names a waiver.
    acceptance:
      all:
        - verifier: tests/cli/self-check-waiver-verdict.t
          result: pass

  - id: pure-aggregation-decision-table
    outcome: pure-aggregation-is-testable
    claim: |
      `tests/gate/waiver_aggregation.ml` covers: no gaps -> Pass;
      all waived -> Open_with_waiver; partial coverage -> Unknown;
      FailedEvidence -> Block; MissingReview -> Block; expired
      waiver -> Unknown; unissued waiver -> Unknown; another
      decision's waiver -> Unknown; obligation-scoped waiver
      covers only its own obligation; and a waived verdict returns
      the waiver that produced it, once per covered gap.
    acceptance:
      all:
        - verifier: tests/gate/waiver_aggregation.ml
          result: pass

  - id: scope-fixtures-speak-the-new-vocabulary
    outcome: waived-verdict-is-not-pass
    claim: |
      `tests/cli/gate-waiver-scope.t` scenarios 1 and 3 assert
      `open-with-waiver` for a fully-waived decision; scenarios 2
      and 4 still assert `unknown` for partial and cross-decision
      coverage. The strict-scope guarantee is unchanged.
    acceptance:
      all:
        - verifier: tests/cli/gate-waiver-scope.t
          result: pass

  - id: counters-reference-no-false-positives
    outcome: counters-drift-is-real
    claim: |
      `tests/counters_reference.ml` is green on the tree as it
      stands: every counter claim in PACKAGES.md and ROADMAP.md is
      either live-scoped-and-correct or inside a dated snapshot.
      Calibrated against the corpus: 21 claims match, 20 are
      exempt or unscoped, and the one live claim
      (`34 subcommands total` in the PACKAGES.md module table,
      where the live dispatcher has 36) was CORRECTED in this
      commit rather than waived.
    acceptance:
      all:
        - verifier: tests/counters_reference.ml
          result: pass
        - verifier: manual-text-scan-packages-module-table-subcommand-count
          result: pass

  - id: counters-reference-detects-injected-drift
    outcome: counters-drift-is-real
    claim: |
      The rule is not vacuous: inserting "The repository currently
      holds 421 cram files in total." into an undated paragraph of
      ROADMAP.md makes the test fail with the live value (117),
      while the same sentence carrying a HEAD/date anchor is
      exempt. Both behaviours were executed against this tree and
      then reverted; the claim is about the rule, not about a
      checked-in fixture.
    acceptance:
      all:
        - verifier: manual-review-of-test-rule
          result: pass

  - id: stale-attestation-is-inconclusive
    outcome: stale-attestation-retired
    claim: |
      `attestations/waiver-infrastructure-2026-10-self-check-emits-pass-with-waiver.json`

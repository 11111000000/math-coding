axiom_link:
  - A0
  - A1

intent: |
  `mathc self-check` reported seven subjects as
  `"verdict":"pass"` while the same JSON object listed their
  unmet obligations under `causes[]`. At the time of writing
  (`e6487d3`, 205 subjects, 198 pass / 7 unknown) the seven were
  `kernel-typo-fixes-batch-2026-10` (7 causes),
  `site-axiom-img-and-dropdown-2026-10` (6),
  `attestation-waiver-policy-schema-bump-3-3-2026-10` (6),
  `site-dropdown-anim-2026-10` (5),
  `mobile-menu-collapse-and-hide-on-scroll-2026-10` (4),
  `render-module-split-phase1a-2026-10` (3),
  `p8-hook-deficit-2026-10` (2). A typical cause reads
  "obligation X of decision Y has current attestations but none
  reports pass (inconclusive or infrastructure-error)".

  ROOT CAUSE, exactly: `verdict_to_pass_fail_unknown` in
  `bin/Mathc.ml` mapped `Gate.Open_with_waiver -> "pass"`, and
  `do_self_check`'s top-level aggregation folded
  `Open_with_waiver` into `Gate.Pass`. The gap list was computed
  honestly; only the label on it was wrong. Nothing in the output
  named the waiver that produced the green, so the seven subjects
  read as ordinary passes to anything that consumes `verdict`.

  The mapping was INTENTIONAL and is recorded, with a
  counterargument, in `decisions/waiver-infrastructure-2026-10.yaml`
  ("the CLI maps `Open_with_waiver` to `pass` for the verdict
  string ... the gap list and causes/remedies remain in the JSON
  output"). So this is not an accident, and the fix is not
  "someone typed the wrong string". The recorded justification
  is what fails: it reads `constitution.md` §Waivers line 102
  ("MUST NOT convert fail, unknown or missing into pass") as
  governing the assurance result only, and treats the CLI string
  as a separate cosmetic layer. Two rules this repository already
  holds contradict that split:

    - `constitution.md` Invariant 10: "missing, stale, failed,
      inconclusive, infrastructure error, WAIVED and passed states
      MUST remain distinguishable." A CLI that prints `pass` for
      a waived subject makes two of those six identical.
    - `spec/semantics.md` §Merge Gate: "A merge with a Waiver MUST
      report `open-with-waiver`, never `pass`."

  The intent was sound; the instrument was wrong. This decision
  keeps the instrument (the waiver still lifts the gate, exit
  stays 0) and fixes the label, which is the part that lied.

  Same defect class as `decisions/path-probe-anchoring-2026-11`,
  which recorded the sibling instance: "A gate that certifies an
  empty obligation set is an invariant violation, not a degraded
  mode: `unknown` is laundered into `pass`." There the laundering
  came from an empty obligation set; here it comes from a
  non-empty one. The invariant is the same and it is stated in
  both directions.

commitment: |
  (a) The waiver step moves out of `bin/Mathc.ml` and into
      `lib/gate.ml` as the pure function `aggregate_with_waivers`,
      which returns `(verdict, covered)` where `covered` pairs
      every waived gap with the waiver that lifts it. It is
      unit-testable without a filesystem.

  (b) The verdict string vocabulary has four values: `pass`,
      `open-with-waiver`, `fail`, `unknown`. `Open_with_waiver`
      is no longer rendered as `pass`.

  (c) The top-level verdict of a repository in which every subject
      is passed or waived is `open-with-waiver`, not `pass`. Exit
      codes are UNCHANGED: 0 for `pass` and `open-with-waiver`, 1
      for `fail`, 3 for `unknown` (constitution.md Invariant 14b
      is about exit honesty, not about collapsing labels).

  (d) Every subject entry carries a `waivers[]` array naming the
      waiver behind an `open-with-waiver` verdict: `id`, `issuer`,
      `issued_at`, `expires_at`, `scope` (obligation-scoped or
      legacy decision-wide) and `covers[]` (the obligations of
      THIS subject the waiver accepts). This is Invariant 14c
      made observable: a verdict that exits 0 under a waiver
      references that waiver, with its authority and its expiry,
      in the same object a machine reads the verdict from. The
      array is empty for every other verdict, so a `pass` subject
      can no longer reference a waiver at all.

  (e) The regression surface is three layers: the pure decision
      table (`tests/gate/waiver_aggregation.ml`, 12 cases), the
      end-to-end report (`tests/cli/self-check-waiver-verdict.t`),
      and the existing waiver-scope fixtures, whose positive
      scenarios now assert `open-with-waiver`.

  (f) `tests/counters_reference.ml` restores the drift detection
      that `tests/counters_drift.ml` names but cannot perform, by
      checking counter claims conditionally rather than by
      matching one literal shape. See outcome
      `counters-drift-is-real`.

  (g) `attestations/waiver-infrastructure-2026-10-self-check-emits-
      pass-with-waiver.json` becomes `result: inconclusive` with a
      `reason` naming this decision. Its obligation claimed that
      the CLI emits `pass` for a waiver-covered subject; after
      (b) that is false, and leaving a `pass` attestation in the
      store would be a false claim rather than a stale one. This
      is the repo's existing precedent for a structurally
      unsatisfiable obligation
      (`attestations/audit-0.0.21-fixes-self-check-verdict-is-pass.json`)
      and it costs one honest `unknown` subject: see
      `changed-verdicts` below.

antithesis: |
  The strongest counter-position: "leave the string alone and add
  the waiver provenance instead. A consumer that wants to know
  whether a subject is genuinely green can look at `causes[]`;
  changing the vocabulary breaks every downstream script that
  compares `.verdict == "pass"`, including CI dashboards."

  Partly granted, and it shapes (d): the provenance is added
  precisely so the information is not lost. But the argument
  fails at its first step. `causes[]` answers "are there unmet
  obligations?", which is a question about the subject; `verdict`
  answers "may this be relied on?", which is a question about
  the merge gate. Folding the second into the first is how the
  seven subjects became invisible: nothing in the repository
  consumed `verdict` for those seven, because `pass` is what a
  consumer expects, so it filtered for `pass` and got a green
  tick over two unmet obligations. A dashboard cannot be expected
  to second-guess a field whose four-value vocabulary the kernel
  documents.

  A second position, "make a waived subject `unknown` and let the
  exit code carry the waiver". Rejected: it would turn every
  waiver into a merge blocker (exit 3), which constitution.md
  §Waivers explicitly permits ("MAY permit a gate") and which
  would make the seven 2027-04-18 expiries into guaranteed red
  PRs. The waiver is real relief; the report must say whose
  relief it is.

  Acknowledged as a separate cycle: `spec/semantics.md:418` still
  enumerates the self-check verdict as `pass | fail | unknown`,
  which this change widens. That line was NOT edited here — the
  file is normative prose and the repo's precedent
  (`path-probe-anchoring-2026-11`, `waiver-infrastructure-2026-10`)
  is to exclude `spec/**` from kernel fixes and record the debt.
  The same spec at lines 99 and 118 already mandates
  `open-with-waiver` as a reportable verdict, so line 418 is the
  stale one, not this change. Tracked as a follow-up below.

counterexample: |
  What would make this change wrong?

  (1) "A waiver is not evidence, so `open-with-waiver` is just a
  longer name for `unknown`, and the distinction is
  self-deception." Counterargument: it is not, because the two
  carry different obligations on the reader. `unknown` means
  nobody has accepted the gap; the remedy is to attest or to
  waive. `open-with-waiver` means a named human accepted it, with
  an expiry; the remedy is to renew or to close the gap before
  the expiry. Collapsing them would make the seven waivers
  indistinguishable from the seven subjects nobody has looked at.

  (2) "This breaks the decision corpus."
  `decisions/waiver-infrastructure-2026-10.yaml` obligation
  `self-check-emits-pass-with-waiver` names the old behaviour and
  is attested. True, and handled explicitly in (g): the
  attestation becomes `inconclusive` with a reason, and
  `decisions/waiver-infrastructure-2026-10.yaml` needs a rev bump
  that restates the obligation as `self-check-reports-open-with-
  waiver`. That bump is NOT taken here — it is another decision's
  commitment and belongs to its own cycle. The honest interim
  state is one `unknown` subject for that decision, not a false
  `pass`.

  (3) "The verdict change makes CI red." It does not: the
  top-level verdict and the exit code are unchanged on this tree
  (top `unknown`, exit 3, before and after), because seven other
  subjects are unknown for reasons unrelated to waivers. The
  change is visible in the per-subject JSON, which is where it
  belongs.

  (4) "`tests/counters_reference.ml` is a second drift test."
  It is a second drift RULE, and it is deliberately broader:
  `counters_drift.ml` matches one literal shape
  (`**<N> files**`) and therefore cannot fail on drift, while
  this one matches any live-scoped `N <countable fact>` claim.
  `counters_drift.ml` was left untouched because another session
  owns it (commit `53e0aba`); this decision does not supersede or
  edit it, and both contracts are true at once — the bolded
  pattern stays forbidden, and any other live count must match.


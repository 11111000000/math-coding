yaml_sha: "sha256:a56eb71e5047d2ae71f0cbd24301c468848603428ce3d9364466eb950da4a56f"

intent: |
  Codify the orchestrator-rescue recipe observed during the
  F11/F14 finding (sub-agent die-mid-task from Token Plan
  rate-limit interrupt). The rescue is a deterministic
  sequence the parent orchestrator runs when a child
  sub-agent dies from HTTP 429 retry-exhaustion:

    1. Archive the dead agent (`paseo_archive_agent`).
    2. Inspect the worktree's `git status` for uncommitted
       work.
    3. If the sub-decision is partial-commit-worthy:
       a. Read the worktree's `bin/Mathc.ml` / scripts for
          the partial work.
       b. Commit that work as a single atomic change on the
          topic branch.
       c. Stamp the resulting attestations with
          `producer.identity: human:<parent-agent>` and a
          `rescue_reason: token-plan-rate-limit` field.
       d. Recompute body_sha / yaml_sha if the agent's
          partial work modified the decision file.
    4. If not partial-commit-worthy (the agent died before
       any kernel edit): mark the sub-decision as
       `state: archived` and re-spawn from scratch on the
       next-budget model.
    5. Append a one-line entry to
       `docs/process/attest-handshake-rescue.md` "incidents"
       log.

  Per the P9 principle (`decisions/process-principles.yaml@5`),
  the scaffold-commit pattern guarantees that no sub-agent
  dies without SOMETHING on disk, which makes this rescue
  deterministic.

  Boundaries:
    - No change to `lib/`, `bin/Mathc.ml`, `schemas/`, or
      `axioms/`. This is a process document + decision file.
    - The rescue recipe is opt-in: orchestrators that prefer
      to mark a sub-decision `state: archived` without
      partial-commit rescue may do so.
    - The recipe does not retroactively apply to past
      incidents; the incidents log starts at the commit that
      adds this file.

commitment: |
  After this commit lands:

  1. `docs/process/attest-handshake-rescue.md` exists at
     HEAD and contains the rescue recipe plus the initial
     (empty) incidents log section.
  2. `decisions/attest-handshake-rescue-2026-11.yaml` is
     `parse-ok` under `mathc validate`.
  3. `nix develop .#test --command 'dune test'` exits 0.
  4. `mathc self-check` reports the same number of unknown
     subjects as at this commit's pre-state.

counterexample: |
  The counter-position considered: "this rescue recipe
  hard-codes a model preference (deepseek-v4-pro) that may
  not exist when invoked." Acknowledged: the model name in
  step 4 is illustrative. The recipe records the
  decision-shape ("re-spawn on the next-budget model") not
  a specific model identifier. Future revisions can pin a
  specific model once one is named in
  `bin/data/time-distribution.yaml`.

  A second counter-position: "sub-agents that die from rate
  limits are a degraded path; codifying rescue rewards the
  failure mode." Rejected: the rate-limit interrupt is not
  an agent failure — it is an infrastructure constraint
  imposed by the Token Plan provider. Codifying rescue
  makes the orchestrator's behaviour deterministic when
  the provider's behaviour is non-deterministic; that is
  the inverse of rewarding failure.

axiom_link:

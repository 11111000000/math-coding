---
schema: math-coding/3.2
id: ci-blocking-list-config
revision: 3
state: active
body_sha: "sha256:64e5a020a14174e941ca54de825c7c3fb9da96a65303e3352b5927eb7491c6cd"
yaml_sha: "sha256:64e5a020a14174e941ca54de825c7c3fb9da96a65303e3352b5927eb7491c6cd"
intent: |
  Make the math-coding kernel's hardcoded list of blocking CIs
  (the DEFAULT `["payments-ci"; "orders-ci"; "integration-ci"]` in
  `lib/attestations/attestations.ml`) configurable at runtime via the
  `MATH_CODING_BLOCKING_CIS` environment variable. The default list
  looks like a leftover from a different project's CI farm: the
  math-coding CI farm has no CIs named "payments-ci" or "orders-ci"
  (see `.github/workflows/ci.yml` and `release.yml` for the actual CI
  list), so the default is a fallback that the kernel's own pipeline
  never uses.

  The change:
    1. `blocking_cis_default` stays at that list -- it is the value
       the kernel falls back to when nothing else is configured, and
       it is preserved as a constant so a caller that does not set
       the env var keeps a defined answer;
    2. `blocking_cis ()` reads `MATH_CODING_BLOCKING_CIS`
       (comma-separated, whitespace-tolerant, empty entries skipped);
       falls back to the default when the env var is unset or empty.

  2026-11-01, REVISION 3: THE WORD "HISTORICAL" WAS DOING TWO JOBS
  AT ONCE. The old text called the list "historical" and the
  fallback "the historical default", which reads as "a value that
  was superseded". It was not superseded: it is still the value the
  kernel returns when the env var is unset, and it is still the
  constant `blocking_cis_default`. What changed is the reader's
  ability to tell which list is which. This revision says plainly:
  there is a DEFAULT and an OVERRIDE, the default is the list above,
  and the default is a fallback for callers that configure nothing.

  The second stale sentence was about the policy file. It said the
  kernel does not parse a policy file "because the policy-file format
  is not yet stable for per-path policies". That is no longer the
  reason: the policy format IS stable and per-path now. The policy
  SEQUENCE is `policies.yaml` at the repository root, the kernel
  reads it (`lib/policy.ml::load_policies`, kernel contract §9), and
  each record carries `scope_paths`, `mode_floor` and obligations.
  The env var remains the mechanism for THIS list for a different and
  current reason: `schemas/policy.json` has no field for a blocking-CI
  list, and adding one is a schema change with its own review.

  History:
    rev 1: initial adoption. The hardcoded list is preserved as the
      default; callers can override via env.
    rev 3 (this revision): the default-versus-override distinction is
      stated without the ambiguous word; the policy-file sentence names
      the policy file that exists; the unread tail of this file is
      repaired so the kernel reads it to EOF.

axiom_link:
  - A0
commitment: |
  `lib/attestations/attestations.ml` exports
  `blocking_cis : unit -> string list`. The function reads
  `MATH_CODING_BLOCKING_CIS` from the environment; if unset
  or empty, it returns `blocking_cis_default` (the
  default list `["payments-ci"; "orders-ci";
  "integration-ci"]`). The new function is not yet called
  by any kernel module; this decision only adds the API.
  A follow-up decision will route `aggregate_obligation` and
  `attestations_by_ci` through `blocking_cis ()`.

  The DEFAULT is a constant, not a historical remnant:
  `blocking_cis_default` is a value in the kernel today, and the
  invariant this decision keeps is that the two paths agree -- with
  the env var unset, empty, whitespace-only, or a list of empty
  entries, `blocking_cis ()` returns exactly the default list.

  Migration: no caller changes. The `blocking_cis_default` value
  remains the documented fallback; the runtime override is opt-in via
  the env var.

  Recovery: revert the commit. `blocking_cis ()` is
  removed; `blocking_cis_default` continues to expose the
  default list. The kernel's answer to "which CIs block" is
  restored to the constant.

scope:
  paths:
    - lib/attestations/attestations.ml
    - tests/ci_blocking_list_test.ml
    - tests/dune

outcomes:
  - id: env-var-readable
    statement: a function-call to `Attestations.blocking_cis ()`
      in any kernel module or test reads the current value
      of `MATH_CODING_BLOCKING_CIS` and falls back to
      `blocking_cis_default` when the env var is unset.
  - id: default-preserved
    statement: the default list
      `["payments-ci"; "orders-ci"; "integration-ci"]` is
      preserved as a constant and is what the function
      returns when the env var is unset or empty.

counterexample: |
  "Without a policy-file field for the blocking-CI list, projects with
  non-default CI lists still patch the kernel."

  The objection is right about the shape of the gap and wrong about
  its cause. The policy file is not missing and its format is not
  unstable: `policies.yaml` is read by the kernel and is per-path by
  design (kernel contract §9). What the policy record cannot carry
  today is a blocking-CI list, because `schemas/policy.json` declares
  no such field and the schema is closed (`additionalProperties:
  false`). Closing that is a schema change, and this decision does not
  make one: the env var is a complete answer for the question the
  list answers, and the list is consulted only through an API that no
  kernel module calls yet.

assumptions:
  - id: env-var-is-sufficient
    state: assumed
    statement: |
      The set of projects using math-coding is small enough
      that a single env-var override (rather than a
      per-decision policy row) is sufficient. Currently
      there is one consumer: the math-coding CI farm,
      whose blocking CIs are named differently from
      `blocking_cis_default`.
    owner: human:maintainer
    consequence_if_false: a future project with multiple
      blocking-CI lists (per service) needs a policy-record
      field that maps path patterns to blocking-CI lists, and
      `schemas/policy.json` has to grow that field first. The
      follow-up decision is tracked in ROADMAP Tier 3
      (multi-policy hierarchy).
    review_on:
      - signal: blocking-cis-list-must-vary-by-service

  - id: a-misconfigured-list-is-visible
    state: assumed
    statement: |
      A deployment that sets `MATH_CODING_BLOCKING_CIS` to a value
      that no attestation producer names would cause every obligation
      to receive a `Still_running` verdict forever. The mitigation
      is visibility, not prevention: the list is emitted in `mathc
      packages` and `mathc self-check` output so an operator notices
      the drift. This decision does not change either output -- it
      records that the mitigation is the existing one.
    owner: human:maintainer
    consequence_if_false: |
      If the list is not visible in the operator-facing output, a
      misconfigured environment fails silently and slowly, and the
      remedy has to become a startup log line or a hard failure at
      load time -- both of which are kernel changes with their own
      decision.
    review_on:
      - signal: blocking-cis-list-not-visible-in-output

obligations:
  - id: blocking-cis-default-preserved
    outcome: default-preserved
    claim: |
      `Attestations.blocking_cis_default` is a value equal
      to the default list `["payments-ci"; "orders-ci";
      "integration-ci"]` and is preserved across this
      decision. The Alco test
      `tests/ci_blocking_list_test.ml` verifies this by
      calling `Attestations.blocking_cis ()` with the env
      var unset and asserting the result equals the
      default list.
    acceptance:
      all:
        - verifier: tests/ci_blocking_list_test.ml

  - id: blocking-cis-reads-env-var
    outcome: env-var-readable
    claim: |
      `Attestations.blocking_cis ()` returns a list derived
      from the `MATH_CODING_BLOCKING_CIS` environment
      variable when set (comma-separated, whitespace-
      tolerant). The default is returned when the env var
      is unset, empty, or contains only whitespace/commas.
      The Alco test covers the unset, single, multiple,
      whitespace, and empty-entries cases.
    acceptance:
      all:
        - verifier: tests/ci_blocking_list_test.ml

reversal:
  - signal: env-var-breaks-aggregate-obligation
    action: re-issue with the next revision, switching to a
      policy-record field for the blocking-CI list

risk:
  declared_triggers:
    - env-var-misconfiguration
    - follow-up-deferral-creep
    - blocking-cis-list-not-visible-in-output
  owner: human:maintainer

relations:
  addresses:
    - bootstrap-v3@4
  refines:
    - algebra-3.2@3

outcomes:
  - id: state-filter-honours-retired-and-superseded
    statement: |
      After this commit, `lib/gate.ml::evaluate` produces
      zero obligation gaps for retired or superseded
      decisions; active and draft decisions continue to
      contribute gaps as before. Verified by
      `tests/gate/state_filter.ml` (alcotest, 5 cases)
      and by `mathc self-check` verdict stability on the
      production decision corpus.
  - id: mathc-decision-state-cli-shipped
    statement: |
      `mathc decision-state <id> <action> [--by=<id>@<rev>]`
      exists in the dispatcher; user-facing surface matches
      the orchestration prompt spec; idempotency rejects
      with exit 1, input errors reject with exit 2, accept
      with exit 0. Verified by `tests/cli/decision-state.t`
      (cram, 5 cases).
  - id: enum-preserved
    statement: |
      The 4-state `state:` enum in `lib/codec.ml` is
      unchanged: still `draft | active | retired |
      superseded`. The CLI surface accepts the enum's four
      values and rejects `obsolete` / `archive` aliases.


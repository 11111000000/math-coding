intent: |
  Phase 6 of the ux-3 workstream. Add a focused YAML editor
  for a single decision's lifecycle state plus a kernel-side
  filter that drops retired and superseded decisions from the
  gate's obligation walk. The current state-of-the-world
  treats every decision in `decisions/*.yaml` (regardless of
  its declared state) as part of the active set the gate
  walks. A retired decision that has been replaced by a
  superseder should not contribute obligation gaps every
  commit; historical decisions must still be readable but
  must not block forward progress.

  After this decision:

    D1. `lib/gate.ml::evaluate` filters out decisions whose
        `state` is `Retired` or `Superseded`. The 4-state
        enum in `lib/codec.ml::parse_decision_state`
        (algebra §7) is unchanged — the enum stays
        `draft | active | retired | superseded`. The filter
        is an obligation-gate concern, not a kernel-state
        concern.

    D2. `mathc decision-state <id> <action> [--by=<id>@<rev>]`
        is a new subcommand that performs a targeted YAML
        edit + re-validate. Actions: `mark-superseded
        --by=<new-id>@<rev>`, `mark-retired`, `set <state>`.
        Exit codes follow OCAML_BEST_PRACTICES.md §4.3:
        0 on accept, 1 on reject (idempotent re-issue or
        kernel validation failure), 2 on input error (no
        such id, bad kebab, missing args).

    D3. The user-facing names "obsolete" and "archive" are
        NOT accepted by the CLI; they map to `Retired` and
        `Superseded` respectively but widening the enum for
        a single user-facing alias is forbidden (see
        counterexample).

    D4. Cram test `tests/cli/decision-state.t` covers the
        five documented behaviors (positive mark-superseded,
        positive mark-retired, idempotency reject,
        missing-id input error, non-kebab input error).

    D5. Conformance test `tests/gate/state_filter.ml` covers
        the kernel filter behavior (drop retired / drop
        superseded / keep active / keep draft / cycle
        detector still independent of filter).

  Boundaries (A3 self-application):
    - lib/decision.ml, lib/codec.ml, lib/mcp/dispatch.ml
      unchanged (parser, dispatch, and other agents'
      territory).
    - lib/check/, lib/find/, lib/graph/, lib/init/,
      lib/new_decision/, lib/import_adr/, lib/render.ml
      unchanged (other agents' territory in this ux-3
      workstream).
    - lib/waiver.ml, lib/migrate.ml, lib/policy.ml,
      lib/risk.ml, lib/canonical.ml, lib/diagnostic.ml,
      lib/attestations/**, lib/git/**, lib/junit/**,
      lib/mcp/, spec/**, schemas/**, axioms/** unchanged.
    - The 4-state `state:` enum is preserved verbatim.
      No widening, no new variants.

  Implementation notes for the agent reading this: the kernel
  filter is implemented in `lib/gate.ml::evaluate` via a
  helper `active_entries` that drops retired/superseded
  entries from `Memory.t.decisions` before the obligation
  walk. The Memory type itself is extended with a
  `state : [Draft | Active | Retired | Superseded]` field on
  `decision_entry`; `lib/memory.ml::parse_decision_yaml`
  populates it via `Codec.parse_decision_state`. The branch
  stub in `bin/Mathc.ml::load_decision_entry` defaults to
  `Active` (mirroring the kernel parser default).

axiom_link:

antithesis: |
  The counter-position considered and rejected: "The CLI is
  fine; just have the user edit the YAML by hand and re-run
  `mathc validate`." Engaged with this on three grounds:
  (a) the script edits in lib/lifecycle/lifecycle.ml are
  pure text rewrites that preserve front-matter, body
  scalars, and trailing whitespace — the kernel's
  body-vs-wrapper canonicalization algorithm
  (`lib/decision.ml::body_canonical_sha256`) treats the
  byte-faithful rewrite as the same content even when the
  next `mathc validate` runs and recomputes the SHA, which
  yields a clean accept; (b) hand edits are reliable enough
  for the author, but the `idempotent re-issue is reject`
  rule is kernel-side: the human who copy-pastes
  `state: superseded` into an already-superseded YAML
  deserves a non-zero exit, not a silent pass; and
  (c) `decisions/*.yaml` already accommodates user-supplied
  edit primitives (see `--write` on `mathc new-decision`,
  `--mark-superseded` does the same with a smaller blast
  radius — one file, no schema changes).

commitment: |
  Five deliverables:

    D1. `lib/gate.ml` filters `Retired` and `Superseded`
        decisions from the obligation walk that
        `lib/gate.ml::evaluate` performs. The change is
        scoped to `evaluate`; `do_self_check` is unchanged
        (it walks decisions directly via `load_decision_entry`,
        not through `evaluate`).

    D2. `lib/memory.ml` extends `decision_entry` with a
        `state` field populated from
        `Codec.parse_decision_state`. The fallback for
        unparseable or absent `state:` is `Active` (mirroring
        the kernel parser default).

    D3. New subcommand `mathc decision-state <id> <action>
        [--by=<id>@<rev>]`. Implemented in a new sub-library
        `lib/lifecycle/lifecycle.ml` (~90 LOC) per
        OCAML_BEST_PRACTICES §10.1; the dispatcher at
        `bin/Mathc.ml::do_decision_state` parses argv and
        forwards to `Lifecycle.transition`. The
        `bin/Mathc.ml` and `bin/dune` files are updated to
        declare the new library; no other file in `lib/` is
        touched.

    D4. Cram test `tests/cli/decision-state.t` (5 cases)
        passes when `dune runtest tests/cli/decision-state.t`
        runs in the worktree.

    D5. Conformance test `tests/gate/state_filter.ml`
        (5 alcotest cases) passes when
        `dune runtest tests/gate/state_filter.exe` runs in
        the worktree.

counterexample: |
  "Just add `state: obsolete` and `state: archived` to the
  4-state enum. Two new values, easy." Rejected: the
  4-state enum in `lib/codec.ml::parse_decision_state` is
  normative per spec/algebra-3.2.md §7; widening it for a
  single use case sets a precedent that grows unbounded
  (regulatory carve-out: "yes, we have `regulatory_archived`;
  but what about `legal_hold`?"; partner-vendor commit:
  "but our vendors use `vendor_deprecated` not `superseded`
  because their convention is different"). The user-facing
  names "obsolete" and "archive" are translated at the CLI
  layer to the existing `Retired` and `Superseded` values;
  the algebra is preserved. The cost is a strict CLI surface
  that rejects `--action=archive` outright (exit 2 with
  the documented diagnostic) — users who need a private
  alias can add it as a separate decision file with a
  tailor-made alias policy without touching the kernel.


intent: |
  Bump the constitution header from "3.0-alpha" to "3.3.0-alpha"
  to match the published brand. No semantic change; the 14
  invariants are unchanged. Editorial header refresh.
antithesis: |
  The header version number is decorative — leaving it stale
  is documentation debt, not behavioural one. Rejected: the
  published brand is 3.3.0-alpha, and the constitution should
  name the version it currently governs to avoid ambiguity
  during a kernel v3.2 → v3.3 boundary review.
counterexample: |
  "Bumping the header is a one-line typo fix, not worth a
  decision file." Rejected per AGENTS.md §P1: spec/ is
  policy-protected; any staged change to spec/*.md requires
  a paired decision/*.yaml, regardless of behavioural impact.
commitment: |
  1. `head -1 spec/constitution.md` names the constitution it
     governs: `# Math-coding <version> constitution`. The version
     literal moves with every release bump; this decision's own
     bump carried it to `3.3.0-alpha`.
  2. No semantic change to the 14 invariants; only the
     version literal in the H1 changes.
  3. The change is editorial (per AGENTS.md §Before work
     "provably editorial" exemption), recorded under
     `change_kind: editorial` for audit-trail purposes.
scope:

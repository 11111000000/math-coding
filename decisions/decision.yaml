counterexample: |
  "The master policy should say what the project PROMISES, not what it
  currently does. A policy that describes the present is a snapshot,
  and snapshots go stale."

  The objection is right about the failure mode and wrong about the
  cure. A policy that describes the present is not a snapshot when the
  present is a PROPERTY with a bound: the promises below are either
  checked by a program that can fail, or declared with an owner and a
  date, or counted against a ceiling that may only fall. Each of those
  three keeps its meaning when the code moves; a promise phrased as
  "build X" does not, which is why the commitment here no longer says
  "build math-coding 3.0" -- that sentence was true once and would
  have been false for every day after it, presented in the present
  tense.

  The other half of the objection is the one this decision accepts: a
  master policy that only describes what is true today says nothing
  about what the project is FOR. The reason the file still carries the
  five manual declarations is that a promise nobody can check is still
  a promise, and the honest thing is to name its owner rather than to
  drop it.


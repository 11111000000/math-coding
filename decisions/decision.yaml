intent: |
  The master policy for this repository: the protocol's own rules are
  in force here, and every change is a decision with obligations.

  2026-11-01, REVISION 4: THE POLICY WAS WRITTEN FOR A TRANSITION
  THAT HAS HAPPENED. Rev 1 said "Replace math-coding 2.1 with a
  self-applying assurance protocol"; the commitment said "Build
  math-coding 3.0 from an executable specification"; the assumption
  said "Until the 3.0 kernel exists, assurance gaps are enforced
  manually". All three are a past tense presented as a present. The
  kernel exists: this repository is at VERSION 3.7.4, the kernel
  reads the corpus, and `mathc self-check` answers a verdict and an
  exit code.

  What a master policy says NOW is the split that survives the
  transition: the kernel checks what a program can check, and the
  promises a program CANNOT check are declared here, with an owner
  and a date. Five of this file's seven obligations are declarations,
  and that is the policy stating its own limits rather than a gap in
  it.

  The three classes of promise are measured, not asserted:
  `tests/fixtures/negative-control-debt.sh` prints CHECKED (a control
  that can fail), DECLARED (an owner and a date), and UNCHECKED
  (neither), and requires the three plus the promise-less decisions
  to add up to the corpus.

axiom_link:
  - A0
commitment: |
  The master policy for this repository. It says what the kernel
  enforces, and it says out loud what it does not.

  1. The kernel is the authority for what it can check. `mathc
     self-check` and `mathc gate` read this corpus and answer a
     verdict and an exit code, and the exit codes are the honest
     ones: 0 for pass, 1 for block, 3 for unknown (see
     `spec/constitution.md` §14b). A checkout does not answer `pass`
     and does not pretend to: with no attestation store present the
     verdict is `unknown`.

  2. The promises a program cannot check are DECLARED, not hidden:
     each carries an owner, the date it is looked at again, and the
     reason nothing can check it. Five of the seven obligations below
     are declarations of that kind. The master policy saying what it
     does not check IS the policy; hiding it would be the opposite.

  3. The version this policy governs is the one in the VERSION file.
     The 2.1 source remains recoverable from the tag `v2.1-final`,
     so the transition that produced this kernel is reversible.

  4. The conventions that bind every change to the kernel live in
     `OCAML_KERNEL_CONVENTIONS.md` (the OCaml practices) and
     `KERNEL_AGENTS.md` (the protocol). Neither is claimed to be
     machine-enforced, and this decision does not claim it.

  Boundaries:
  - This decision does not change `spec/`, `lib/`, `bin/`,
    `schemas/` or `axioms/`. It states what is in force; the rules
    themselves live elsewhere.
  - This file is THIS repository's instance of the master policy. The
    TEMPLATE a new project starts from is
    `templates/master-policy.yaml`, and its two derived copies
    (`scripts/install-tooling/templates/active-policy.yaml` and the
    literal embedded in `lib/init/init.ml`) are generated from it.
    The template asks an adopter to point one obligation at their own
    tree; this file carries the seven obligations of this repository.


outcomes:
  - id: formal-spec-adopted
    statement: |
      `spec/kernel-contract.md` is the authoritative normative spec for
      the kernel, supplementing `spec/constitution.md`. The contract
      is at that path and at no other: its former name is gone, and no
      file in the live tree names it. The instrument that measures
      both halves is `tests/fixtures/kernel-contract-rename-2026-11.sh`.

  - id: applicability-envelope-active
    statement: |
      Each new project adopting math-coding evaluates applicability
      per the kernel contract's §28 and chooses Path A (full) or
      Path C (no math-coding) based on a documented rationale. The
      decision tree is in USAGE.md and the envelope is measured by
      `tests/cli/applicability-envelope.t`.

  - id: kernel-conformance-tracked
    statement: |
      The kernel's deviations from the contract are tracked as
      decisions and listed in ROADMAP.md. This decision does not
      enumerate them: the contract that separates what the kernel
      ENFORCES (rule, code, test) from what is only DECLARED is
      tranche T3.2 of `docs/plans/redundancy-and-portability-2026-11.md`,
      which supersedes this decision with a document of about a
      hundred lines.

  - id: backward-compatibility-preserved
    statement: |
      Every decision in the live corpus parses under the current
      schema, and no decision file needed an edit to remain valid.
      The corpus is larger than it was when this decision was adopted
      and the migration stayed implicit, because the schema grew by
      optional fields with defaults.

counterexample: |
  "The kernel algebra is over-engineered for the current project scale.
  Most teams don't need multi-CI, axiom transitions, or rebuttal
  artifacts. The kernel already works."

  Counterargument: the applicability envelope (§28) and the two-tier
  cognitive model are exactly the answer to this objection. Users in
  tiny/light modes experience 0 friction; the full algebra is
  normative for kernel developers, not for the typical user. Adopting
  Path C is a documented choice for projects where applicability is 0,
  and the decision tree in USAGE.md asks the question in one line.

  "We shipped that kernel recently; reopening the spec this fast
  creates churn."

  Counterargument: the adoption is ADDITIVE, not a replacement. The
  constitution's invariants are preserved verbatim, implementation
  rollout is incremental, and users on the earlier kernel continue to
  work without modification. Spec adoption is decoupled from kernel
  implementation.

  "Substrate §30 is aspirational; the binary currently links against
  nix-store glibc."

  Counterargument: §30 records this as an anti-property and a
  required fix. The distribution_property violation is a known issue
  that requires static linking or a musl-based build, tracked under
  ROADMAP Tier 3 and owned by
  `decisions/portable-linux-musl.yaml`.

antithesis: |
  The coherent counter-position considered and rejected: a decision
  that adopts a normative specification should name the specification
  by its exact lines, because a section that moves is a promise that
  expires. The counter-position is right about the failure mode --
  a promise that points at a line number breaks when the document
  grows -- and wrong about the cure. Line numbers are not the cure;
  they are the disease. A promise that names a SECTION survives the
  document's growth, and a promise that names a FILE survives the
  file's rewrite, and a promise that names a NUMBER survives neither
  the next corpus growth nor the next release. This revision names
  the contract by its path and its sections, and turns the corpus
  count into the invariant that the count was standing in for.

assumptions:
  - id: constitution-stable
    state: assumed
    statement: |
      The constitution's invariants (I1-I14, with the lettered
      sub-invariants 14b and 14c) are stable and not modified by the
      adoption. Any future constitutional change requires a
      protected-policy transition per A3 Self-Application.
    owner: human:maintainer
    consequence_if_false: |
      Constitutional change would require this decision to be
      superseded, with a new decision under the changed constitution.
    review_on:
      - signal: constitution-amended

  - id: kernel-developers-stable
    state: assumed
    statement: |
      The set K of kernel developers (1-5 people) is stable for the
      duration of the kernel's implementation. The two-tier model
      (users and kernel developers) is the contract's own framing.
    owner: human:maintainer
    consequence_if_false: |
      Kernel-developer rotation would require re-distribution of the
      kernel-dev documentation burden; new developers are onboarded
      through the adoption path in the contract's §24.
    review_on:
      - signal: kernel-developer-rotated

  - id: binary-distribution-achievable
    state: assumed
    statement: |
      The kernel can be compiled to portable binaries for its target
      platforms without nix-store path dependencies. This is a known
      violation of the contract's §30 anti-property, and the fix is
      tracked separately.

      Status measured 2026-11-01: the release workflow carries a musl
      matrix entry (the `linux-x86_64-musl` label, under the Alpine
      build), and the decision that owns it is
      `decisions/portable-linux-musl.yaml` (revision 4). The closure
      signal is unchanged and is an external fact: the first
      successful CI run on that matrix entry. This repository cannot
      observe it, and this decision does not claim it happened.
    owner: human:maintainer
    consequence_if_false: |
      If portable binaries prove infeasible, distribution_property in
      §30 is weakened to "kernel ships as source build, users require
      OCaml toolchain". The applicability envelope (§28) would then
      need re-evaluation for projects without OCaml expertise.
    review_on:
      - signal: portable-build-attempted
      - signal: portable-musl-ci-pass
      - signal: portable-musl-ci-fail

  - id: schema-backward-compat
    state: assumed
    statement: |
      All extensions to schemas (decision.json, attestation.json,
      obligation.json) are backward-compatible: new fields are
      optional with sensible defaults. No existing decision file
      breaks.
    owner: human:maintainer
    consequence_if_false: |
      If migration requires editing existing decision files, a
      separate migration decision must precede this one.
    review_on:
      - signal: schema-migration-needed

obligations:
  - id: spec-file-exists
    outcome: formal-spec-adopted
    claim: |
      The normative contract is at `spec/kernel-contract.md`: the file
      exists, is tracked, and the corpus's former name for it does not
      exist. The constructs this decision adopted are present in the
      contract as sections, not as line numbers: §7 (Decision entity)
      with its §7.1 (Byte-range and canonicalisation), §15 (Gate
      verdict), §17 (Inline axiom change), §20 (Kernel rules), §24
      (Adoption path), §28 (Applicability envelope), §30 (Binary
      distribution).
    acceptance:
      all:
        - verifier: tests/fixtures/kernel-contract-rename-2026-11.sh
        - verifier: tests/repo_structure.ml

  - id: cross-references-correct
    outcome: formal-spec-adopted
    claim: |
      The contract's cross-references into the corpus resolve --
      `axioms/`, `spec/constitution.md` and `decisions/decision.yaml`
      all name files that exist -- and every relation target this
      decision declares resolves to a decision that exists, live or
      archived. The relation half is measured by
      `tests/fixtures/relation-targets-resolve.sh`, which reports zero
      dangling targets over the live corpus.
    acceptance:
      all:
        - verifier: tests/fixtures/relation-targets-resolve.sh
        - verifier: tests/repo_structure.ml

  - id: applicability-documented
    outcome: applicability-envelope-active
    claim: |
      USAGE.md and ROADMAP.md document the applicability envelope (the
      kernel contract's §28) and the two adoption paths (full, and no
      math-coding), and the decision tree is the one a reader can
      answer.

      The corpus's own fixture for the envelope is
      `tests/cli/applicability-envelope.t`: it asserts that the
      contract is published, that this decision file exists, and that
      ROADMAP.md carries no open promise about a closed tier. This
      obligation does not name it as a verifier, and says so here
      rather than leaving the reader to assume otherwise: naming a
      cram fixture adds it to the I13 rejecting-case census's named
      population, that fixture shows only the happy path, and the
      corpus's ceiling there may only fall. The verifier this
      obligation names is `tests/repo_structure.ml`, which asserts
      the repository structure around the envelope.
    acceptance:
      all:
        - verifier: tests/repo_structure.ml

  - id: kernel-conformance-baseline
    outcome: kernel-conformance-tracked
    claim: |
      The kernel's conformance over its own fixture corpus holds:
      `tests/conformance.ml` walks
      `fixtures/conformance/{decision,attestation,waiver}/` and every
      positive fixture parses while every negative fixture is
      rejected.

      The corpus-wide verdict is a DIFFERENT instrument and it does
      not answer `pass` on a checkout: with no attestation store
      present, `mathc self-check` answers verdict `unknown` and exits
      3, because the store is generated per run and a checkout carries
      no evidence to certify. `tests/cli/self-check-unknown.t` asserts
      that verdict and that exit code.
    acceptance:
      all:
        - verifier: tests/conformance.ml
        - verifier: tests/cli/self-check-unknown.t

  - id: adoption-path-documented
    outcome: applicability-envelope-active
    claim: |
      USAGE.md provides step-by-step adoption guidance for both Path A
      (full) and Path C (no math-coding), and the applicability check
      is explicit rather than implied. The verifier this obligation
      names is `tests/repo_structure.ml`; the reason the census's
      rejecting-case population is not extended with
      `tests/cli/applicability-envelope.t` is the same one the
      `applicability-documented` obligation states.
    acceptance:
      all:
        - verifier: tests/repo_structure.ml

  - id: backward-compat-test
    outcome: backward-compatibility-preserved
    claim: |
      Every decision file in the live corpus parses under the current
      schema and no decision required a modification to remain valid:
      `mathc validate` answers parse-ok for each file under
      `decisions/`, and the schema's growth was by optional fields
      with defaults, so the migration was implicit. The corpus is
      larger than it was when this decision was adopted; that is the
      point of an invariant, not a defect in it.
    acceptance:
      all:
        - verifier: tests/conformance.ml

  - id: implementation-roadmap
    outcome: kernel-conformance-tracked
    claim: |
      ROADMAP.md carries the kernel-enrichment work as its Tier 3
      section, with each item naming the decision that owns it. The
      tier structure is the ROADMAP's own: it has been reorganised
      since this decision was adopted, so what is promised is that the
      work is listed there and owned, not that four particular tier
      numbers exist.
    acceptance:
      all:
        - verifier: tests/repo_structure.ml

reversal:
  - signal: spec-superseded-by-the-short-contract
    condition: |
      Record a new decision that supersedes `algebra-3.2@3` and
      replaces the contract with the short form tranche T3.2 of
      `docs/plans/redundancy-and-portability-2026-11.md` describes:
      what the kernel ENFORCES (rule, code, test) and what is only
      DECLARED. Kernel conformance is re-evaluated; existing
      decisions remain valid via optional-field defaults.
    action: rework

  - signal: spec-rejected-by-constitution
    condition: |
      If the contract is found to violate any of the constitution's
      invariants, this decision BLOCKS. Resolution: identify the
      violating section, propose a patch that preserves the
      invariants, or roll back this decision entirely.
    action: halt


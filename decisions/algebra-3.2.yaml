intent: |
  Adopt the kernel contract as the authoritative formal specification
  of the math-coding kernel, supplementing (not replacing) the
  constitution invariants from `spec/constitution.md`.

  2026-11-01, REVISION 3: THE PATH MOVED, THE NUMBERS MOVED, AND THE
  PROMISE DID NOT. Three things in this file had gone stale, and all
  three were form rather than substance:

    THE DOCUMENT IS AT ITS CURRENT PATH.
      The normative text is `spec/kernel-contract.md`. It was renamed
      in a protected transition of its own, with its own decision
      (`decisions/kernel-contract-rename-2026-11.yaml`) and its own
      instrument (`tests/fixtures/kernel-contract-rename-2026-11.sh`).
      This revision names the contract by its section, never by a line
      number: the sections are the durable names, and the contract's
      own rewrite (tranche T3.2 of
      `docs/plans/redundancy-and-portability-2026-11.md`, which shrinks
      it to about a hundred lines) will move every line in it.

    "28 ACTIVE DECISIONS" WAS A SNAPSHOT OF A CORPUS THAT KEPT
    GROWING.
      The corpus this decision adopts the algebra for is not 28
      decisions and never was again. The number is not repeated here,
      because a number that moves is a number that expires. What is
      promised instead is the INVARIANT: every decision in the live
      corpus parses under the current schema, and none of them needed
      an edit to stay valid. The migration was implicit because the
      schema grew by optional fields with defaults, and that is the
      property the corpus still has.

    "`mathc self-check` RETURNS `pass` ON CLEAN HEAD" WAS NEVER TRUE
    OF THIS TREE AND IS NOT TRUE NOW.
      Measured on this tree on 2026-11-01: `mathc self-check` answers
      verdict `unknown` and exits 3, because the attestation store is
      GENERATED per run and a checkout carries no evidence to certify.
      The kernel's conformance over its own fixture corpus is a
      different instrument and it does pass. This revision separates
      the two and names each.

  The 3.2 algebra was derived from:
  - Simulation analysis (4 subagent behavior reports on 3.1-ideal)
  - Critical analysis (substrate lock-in correction)
  - Fresh-rethink per user direction
  - Missing-ideas audit (5 epistemic markers restored, honest
    uncertainty principle added, 8 relations enum explicit, 3
    obligation phases made normative)

  History:
    rev 1: initial adoption of the algebra as the normative
      specification.
    rev 2: the corpus grew and the deviations were tracked.
    rev 3 (this revision): the contract is named by its current path
      and by its sections rather than by a count and a line number;
      the corpus promise becomes an invariant; the conformance
      promise names the instrument that answers it.

axiom_link:
  - A0
commitment: |
  The math-coding project formally adopts the kernel contract as the
  mathematical specification of what the kernel MUST enforce.

  Concretely:
  - `spec/kernel-contract.md` is a normative spec alongside
    `spec/constitution.md`
  - The kernel implementation (lib/*.ml) must conform to the algebra
  - New kernel rules MUST be added via decision files following the
    kernel contract's own §20 (Kernel rules)
  - The applicability envelope (§28) guides adoption decisions per
    project
  - Binary distribution (§30) is the user-facing property: the kernel
    ships for its target platforms, users do not need OCaml/nix/dune

  Boundaries:
  - Constitution invariants preserved verbatim. The constitution
    carries I1-I14 with the lettered sub-invariants 14b (symmetric
    exit honesty) and 14c (waiver-bounded exit); the adoption adds
    nothing to them.
  - The 5 axioms A0-A4 preserved verbatim
  - The 5 modes preserved
  - §7 Decision entity extends v3 with state, sha fields, epistemic
    markers, and the §7.1 sub-section that names the byte-range
    algorithm
  - §15 Gate verdict adds 3 obligation phases
  - §17 Axiom change adds transition kinds + re_evaluate oracle
  - §20 Kernel rules adds CoCommitDecision + CoCommitFixture
  - §24 Adoption path drops 3.2-L (user direction)
  - §28 and §30 are new meta-constructs. The contract's own summary
    table also lists a §29 (Two-tier cognitive model); the table row
    is there and the section body is not, so this decision does not
    promise a §29 section.


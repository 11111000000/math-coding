risk:
  owner: human:maintainer
  declared_triggers:
    - "an adopter stores attestations whose materials_digest was produced by a different tool than mathc attest-batch"

assumptions:
  - id: scope-covers-the-subject
    state: assumed
    owner: human:maintainer
    statement: |
      A decision's `scope.paths` names the files whose content its
      obligations are about. A decision with an empty or
      wrong scope is digested over the empty set, and its freshness
      is then vacuous.
    consequence_if_false: |
      A decision that does not declare its scope would never be
      invalidated by a change to the files it governs. The corpus
      convention requires scope.paths on every decision; this
      decision does not enforce it.


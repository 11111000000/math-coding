axiom_link:
  - A2
intent: |
  Add visual artefacts to the site surface so a first-time
  visitor can grasp the protocol in five seconds without
  reading a wall of prose. The post-Phase-0/Phase-1 site at
  HEAD is textually complete but visually flat: thin
  mermaid flowcharts across the pages, no logos, no icons, no
  diagrams of the kernel pipeline.

  Three deficits remain from the original analysis that the
  prose-only Phase 0 + Phase 1 did not close:

  - the home page hero has no anchor visual that names the
    protocol's six kinds in one glance;
  - the five axioms have no visual identity, so each axiom
    page is text-only and the visitor must rely on prose to
    remember which is which;
  - the kernel pipeline (schema -> parse -> attestation
    join -> self-check -> gate) is described across five
    pages but no single diagram ties them together.

  This decision records and closes all three with hand-rolled
  SVG artefacts that live under `assets/` and are embedded
  via `<img>` tags emitted by the render kernel.

  2026-10-31, REVISION 2: THE ARTEFACTS ARE ALL THERE; THE PAGES THAT
  CARRY THEM ARE NOT THE PAGES THIS DECISION PROMISED. The promise
  said the chain diagram sits on the home page, the axiom icons sit
  on the axioms overview card, and the kernel-pipeline diagram sits
  on `foundations.html`. The tree says otherwise, measured by
  `bash scripts/render.sh` followed by a grep for the `<img>` tags:

    - `assets/chain.svg` is embedded on `dist/methodology.html` and
      its `.ru` and `.zh` siblings. It is NOT on `dist/index.html`,
      whose own visual anchor is `assets/logo.svg`.
    - `assets/kernel-architecture.svg` is embedded on the same three
      methodology pages. It is NOT on `dist/foundations.html`, which
      carries other diagrams (axiom-graph, attestation-lifecycle,
      counterexample-flow, axiom-transition, trust-dynamics,
      substrate-fingerprint, waiver-state-machine,
      friction-envelope-plot, ...).
    - The five `assets/axiom-<id>.svg` icons are embedded on the five
      per-axiom pages, as `<img class="mathc-axiom-icon">`. They are
      NOT on `dist/axioms.html`, whose only image is the brand logo.

  The assets exist, they are referenced by `<img>` tags that carry
  alt text, and they are pure SVG. What moved is WHERE they are
  embedded. A promise about a page the site does not show is not a
  promise; this revision promises the pages the site shows, and the
  outcome ids are renamed to say so.

  The renderer that emits the `<img>` tag moved with the render
  kernel: the inline-figure branch is in `lib/render/render_md.ml`,
  the axiom icon is emitted by `lib/render/render_pages.ml`, and
  `lib/render.ml` no longer exists as a file.

commitment: |
  `mathc render` emits a site that carries the following
  visual artefacts in addition to the prose and verdict grid
  rendered by `site-quality-2026-10`:

  1. `assets/chain.svg` -- a horizontal flow diagram showing
     the six kinds (intent -> decision -> obligation ->
     change -> attestation -> revision) with the obligation
     node visually emphasised (oxblood accent). It is embedded
     via `<img>` with a descriptive `alt` on `methodology.html`
     and on its `.ru` and `.zh` siblings.

  2. `assets/axiom-{separation,feedback,invariants,self-application,care}.svg`
     -- five 80x80 icons, one per axiom, drawn in the
     existing oxblood-on-cream palette; embedded via `<img
     class="mathc-axiom-icon">` on the respective per-axiom pages
     (`dist/axioms/<id>.html`).

  3. `assets/kernel-architecture.svg` -- a five-stage
     pipeline diagram (schema -> parser -> attestation join
     -> self-check -> gate) embedded via `<img>` with a descriptive
     `alt` on `methodology.html` and on its `.ru` and `.zh`
     siblings.

  All three artefacts are pure SVG (no embedded fonts, no
  external assets, no JavaScript); the `<img>` tags carry
  descriptive `alt` text so a non-sighted visitor still
  receives the meaning.


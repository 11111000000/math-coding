counterexample: |
  "SVG illustrations are styling, not a contract change; no
  decision is needed." This argument fails for two reasons.
  First, the artefacts are hand-rolled SVG paths that
  encode domain meaning (the chain shape encodes the
  protocol's six kinds; the axiom icons encode A0-A4);
  altering the icons would change what visitors see when
  they look up an axiom by its icon, which is itself a
  public contract. Second, AGENTS.md §P1 binds a decision
  to any kernel-side change to `lib/render.ml`; the SVG
  embedding adds a new render function and new HTML
  output, so a decision is required under the active
  policy.

antithesis: |
  Author considered and rejected the strongest counter-
  position that a maintainer might raise: "the site already
  ships Tufte-styled prose; an SVG diagram will look out
  of place." That position is rejected because (a) the
  site's existing mermaid flowcharts are SVGs that already
  pass through the same `assets/style.css` palette, so the
  new SVGs are visually consistent with the existing
  graph elements; and (b) the analysis at v3.1.0-alpha
  found zero illustrations across 70 pages, so the site
  reads as academic prose -- a single anchor diagram per
  page closes that gap without disrupting the Tufte
  restraint.


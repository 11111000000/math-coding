outcomes:
  - id: lang-is-variant
    statement: |
      `Render.lang = En | Ru | Zh`; строковые литералы `"en"`/`"ru"`/
      `"zh"` в логике рендера заменены матчингом по варианту.
  - id: no-io-in-render
    statement: |
      `lib/render/` не вызывает `Sys.readdir`, `Sys.file_exists`,
      `open_in`, `open_in_bin`, `Sys.getenv_opt` — весь I/O и
      чтение env перемещён в `bin/Mathc.ml`.
  - id: behavior-preserving
    statement: |
      `tests/cli/render.t` (cram) и `tests/render_kernel.exe` дают
      идентичный результат до и после фазы A.


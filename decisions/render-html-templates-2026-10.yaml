intent: |
  Реализовать дизайн из
  `docs/plans/render-html-templates-2026-10.md`: вынести статический
  HTML рендера из `lib/render/render.ml` в шаблонные файлы
  `render/templates/*.html`, свести три копии домашней страницы
  (`render_index` / `render_index_ru` / `render_index_zh`) к одной
  параметризованной функции, и восстановить задекларированную
  чистоту `lib/render` (OCAML_BEST_PRACTICES.md §1.3 — no I/O in
  lib/). Ноль новых зависимостей.

  Работа делится на две фазы:
    A — типы и чистота (поведение не меняется): `type lang` как
        вариант вместо `string`, `article` record вместо тройки,
        `config.languages : lang list`, перенос `read_spec_files` /
        `read_version_file` из `lib/` в `bin/`.
    B — HTML в файлы: `render/templates/*.html`, `substitute`,
        `render_index ~lang`, удаление `render_dashboard` /
        `render_graph_html` из `.ml` и дубликатов `assets/*`.

  Этот файл фиксирует фазу A; фаза B добавляется отдельной
  ревизией (revision 2) либо отдельным решением, когда очередь
  дойдёт до неё.

commitment: |
  После фазы A:
    1. `Render.lang` — вариант `En | Ru | Zh` с `lang_code` /
       `lang_of_code` / `lang_suffix`; `config.languages : lang list`.
    2. `Render.article` — record `{ name; title; body_md }` вместо
       тройки `(string * string * string)` в `build_pages`.
    3. `lib/render/` не содержит I/O: `read_spec_files` и
       `read_version_file` удалены из `lib/`; их обязанности
       выполняет `bin/Mathc.ml` (который уже читает `site/` и
       `VERSION`). Рендер получает `spec_files` и `version` как
       данные через `render_input`.
    4. Публичный контракт для вызывающих (`bin/Mathc.ml`,
       `tests/render_kernel.ml`) обновлён синхронно; вывод
       `mathc render` бит-в-бит не меняется (golden-снапшоты).

axiom_link:

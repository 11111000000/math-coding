axiom_link:
  - A0
  - A1

intent: |
  The gate's VERDICT is now the merge gate's question: only the
  decisions the change touches, their verifiers run on the candidate
  tree, bounded by a budget that says what it did not check. Its
  REPORT was still the old one: every gap, with its causes and its
  remedies, in full.

  Measured on this repository on 2026-10-28:

    - the whole-corpus gate printed 392 KB of JSON for one commit --
      529 gaps, each carrying a cause and two remedies;
    - the scoped gate printed 255 KB;
    - `mathc self-check` printed 346 KB, and
      `mathc packages --format=json` printed 304 KB.

  That output is not read by a machine that wants a count. It is read
  by whoever runs the gate -- a CI log, an agent, a person -- and it
  lands in their context in full. A report that grows with the corpus
  is a report nobody reads to the end, and the part that decides the
  action is the FIRST gap, not the five-hundredth.

  So the report now says three things about the gaps instead of
  printing all of them:

    - `gaps_total`: how many there are. The count is never
      approximated; it is the number the verdict was computed from.
    - `gaps_by_kind`: the histogram. The shape of the problem: 157
      Unknown and 50 MissingEvidence are two different problems with
      two different remedies, and a reader who has to count them by
      hand will not.
    - `gaps`: the first N, DECISIVE FIRST -- a failure before an
      unknown before a missing piece of evidence. `gaps_truncated`
      says whether the list is the whole set.

  Measured after the change: the same gate run prints 17 KB instead
  of 392 KB, and `--gaps-limit 0` still prints every gap for a
  reader that needs them.

  The verdict is computed from EVERY gap either way. The cap bounds
  what is PRINTED, never what is DECIDED.

commitment: |
  1. `mathc gate` prints at most 50 gaps by default, decisive first,
     and says so: `gaps_total` is the real count, `gaps_by_kind` is
     the histogram, `gaps_truncated` says whether the list is the
     whole set.
  2. `--gaps-limit N` sets the bound; `--gaps-limit 0` prints them
     all.
  3. The verdict and the exit code are computed from every gap, and
     are identical whatever the limit is.
  4. The old keys are not renamed and not removed.

outcomes:
  - id: the-report-is-bounded
    statement: |
      A gate run on this repository prints a report of tens of
      kilobytes, not hundreds, and the report says how many gaps it
      did not print.
  - id: the-verdict-does-not-depend-on-the-limit
    statement: |
      `mathc gate --gaps-limit 1` and `mathc gate --gaps-limit 0`
      return the same verdict and the same exit code.
  - id: the-shape-stays-readable
    statement: |

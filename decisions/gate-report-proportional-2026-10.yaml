risk:
  declared_triggers:
    - "a consumer counts the gaps in the array and reads the count as
      the number of gaps; the count is `gaps_total`, and the array is
      a prefix of it"
    - "a consumer needs every gap and does not know about
      `--gaps-limit 0`"
    - "the cap hides a decisive gap that would have been the first
      one; the order is failure-first for exactly this reason, and
      `gaps_by_kind` names how many failures there are even when none
      is printed"
  owner: human:maintainer

counterexample: |
  "The report is the evidence. A reader who cannot see every gap
  cannot trust the verdict."

  The objection is right about the VERDICT and wrong about the
  report. The verdict is computed from every gap -- the cap is
  applied when the document is written, never when the verdict is
  computed -- and `gaps_total` and `gaps_by_kind` report the whole
  set exactly. What the cap removes is the reader's ability to
  scroll through 529 near-identical prose blocks, each of which says
  "this attestation is stale, re-sign it against the current tree",
  to find the one that says "this check FAILED".

  The objection also has force in the other direction, and it is
  answered rather than dismissed: `--gaps-limit 0` prints every
  gap, and it is a documented flag, not a rebuild. The audit path --
  the question "is the whole corpus still satisfied?" -- keeps its
  full report available on demand.

antithesis: |
  The opposite claim is that the volume is not a problem: the reader
  is a program, and a program that wants a gap asks for it by id.

  That is true for a program, and it is exactly why the FIRST thing
  to do is make the obvious reads cheap: `gaps_total` for the count,
  `gaps_by_kind` for the shape. The opposite claim misses who
  actually reads this output: a CI log a human scrolls, and an agent
  whose context is the expensive part. 392 KB of prose per gate run
  is not information for either of them; it is a wall.

  The half-truth in that claim is preserved: a program that needs a
  specific gap can still get every gap, and the gate's own verdict
  is unaffected by what is printed.

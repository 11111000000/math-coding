counterexample: |
  The counter-position considered and rejected: "These
  observations are not yet worth recording as a decision because
  they reflect a one-day experiment by one agent fleet; a
  second run would change every number." This is rejected on
  three grounds: (a) the design decision already commits to the
  methodology; reproducing it is the only way to update the
  numbers; (b) the §10 results carry their own provenance and
  are *immutable* once written — a successor experiment would
  supersede, not invalidate; (c) recording the numbers *now*
  means future adoption work has a baseline, even if the
  baseline is later refined.

  A second concern considered: "the env-var bug is so severe
  that recording the experiment as 'successful' is misleading."
  The decision does not call the experiment successful; it
  records the observations with their provenance. The kernel
  defect is documented in §10.5 #1 and §13 R1 as the highest-
  priority follow-up.


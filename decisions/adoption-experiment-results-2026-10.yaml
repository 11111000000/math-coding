intent: |
  Record the observed numbers of the math-coding adoption
  experiment conducted 2026-10-17 across five external projects
  (click, express, cobra, ripgrep, sinatra) as a commitment of
  record. The full report is at
  `docs/experiments/adoption-2026-10.md` §10/§11/§13; this
  decision binds the headline numbers that future adoption
  work will be measured against.

commitment: |
  The adoption experiment observed, on a clean checkout of the
  experiment's `experiment/adoption-external-projects-2026-10`
  branch, the metrics summarised below. The observation is
  committed under the same active policy as the design
  decision (`bootstrap-v3@3` per the design decision's
  `relations.addresses`).

outcomes:
  - id: ttfd-distribution
    statement: |
      Median time-to-first-decision across the five T1 sessions
      was ~4 minutes; max was ~14 minutes (sinatra, parallel-agent
      pollution). 5/5 projects under the 30-minute threshold
      (H1 of the design).

  - id: friction-inventory-size
    statement: |
      55 friction events recorded across the five projects,
      categorised into 8 codes (F-SETUP/SCHEMA/WORKFLOW/TOOLING/
      COGNITIVE/INTEGRATION/DOC/BROWNFIELD). 9 high-priority
      events identified in the §13 recommendations.

  - id: top-friction-recurrences
    statement: |
      Two kernel-level defects recur in ≥ 4 of 5 project reports:
      (a) the shipped `mathc 3.3.1` binary does not honour
      `MATH_CODING_DECISIONS_DIR` for any write or tree-walking
      subcommand; (b) the custom YAML parser mangles multi-line
      `risk.declared_triggers` items, causing the
      `counterexample:` field to parse as absent.

  - id: throughput-comparison
    statement: |
      With-math-coding sessions ran 3-4× slower than the control
      arm in median wall-clock (10 min vs 3 min). The gap is
      dominated by repeated diagnosis of the env-var defect,
      not by math-coding per se.

  - id: sub-agent-reliability
    statement: |
      13 of 15 sub-agents finished successfully. Sinatra/T3
      errored twice with provider rate-limit; orchestrator
      recovered the work inline. Sinatra/T1 succeeded but
      reported 5 pre-existing attestations from the orchestrator's
      recovery run.


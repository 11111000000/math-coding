outcomes:
  - id: mathc-adopt-orchestrates-brownfield
    statement: |
      `mathc adopt` runs `mathc init` (with --merge when
      brownfield is detected) and per-ADR `mathc import-adr
      --write` for every file in `madr_files` and
      `adrtools_files`. The behavior is driven by the
      detection result.
  - id: dry-run-supported
    statement: |
      `--dry-run` prints the plan without running anything.
      The detected brownfield, the planned init, and the
      per-ADR import paths are all printed.
  - id: cram-test-passes
    statement: |
      `tests/cli/adopt.t` covers 4 cases: MADR + adr-tools
      (full import), empty (init only with --merge), --only
      (skip non-matching), --dry-run (no writes). All
      cases pass.
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-adopt-subcommand-2026-10.yaml` exits 0.

assumptions:
  - id: subprocess-self-call
    state: assumed
    statement: |
      `mathc adopt` shells out to `mathc init` and
      `mathc import-adr` using the running binary's own
      path (`Sys.executable_name`). The subprocesses
      run in sequence (init first, then per-ADR import).
      There is no recursion (init does not shell out).
    owner: human:maintainer
    consequence_if_false: |
      If `mathc init` ever adds a subprocess call to
      `mathc adopt`, we have infinite recursion. Resolution:
      add a guard env var (e.g. `MATHC_ADOPT_DEPTH=0` to
      detect re-entry).
    review_on:
      - signal: init-subcommand-shells-out
  - id: detection-results-stable
    state: assumed
    statement: |
      `Detect.detect_classify` is deterministic: same
      `root` -> same `brownfield`. Two consecutive
      invocations on the same dir produce the same result
      (modulo filesystem changes between invocations).
    owner: human:maintainer
    consequence_if_false: |
      If the detection becomes non-deterministic (e.g.
      depends on file mtime), the orchestrator could
      produce surprising behavior. Resolution: make
      detection pure (no time-dependent logic).
    review_on:
      - signal: detection-non-deterministic

obligations:
  - id: cram-test-passes
    outcome: cram-test-passes
    claim: |
      `tests/cli/adopt.t` covers 4 cases: MADR + adr-tools,
      empty, --only=arc42, --dry-run. All cases pass.
    acceptance:

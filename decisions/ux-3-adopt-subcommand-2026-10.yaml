intent: |
  Phase 3.2 of the ux-3 workstream (per planning decision
  `ux-3-adopt-roadmap-2026-10@1`). Land the `mathc adopt`
  subcommand: detect the project's existing ADR convention
  via `lib/adopt/detect.ml@1` and orchestrate the right
  response (init + per-ADR import).

  Decision tree (driven by the detection result):

    Empty:            mathc init PATH (no --merge)
    Arc42:            mathc init PATH --merge
    Madr:             mathc init PATH --merge +
                      for each docs/adr/*.md: mathc import-adr --write
    AdrTools:         mathc init PATH --merge +
                      for each adr/*.md: mathc import-adr --write
    Mixed_*:          same per detected convention

  Flags:
    --agent NAME      forwarded to mathc init
    --no-install      forwarded to mathc init
    --dry-run         print what would be done; do not run anything
    --only=CONV       restrict to one convention (arc42|madr|adr-tools)
    --merge           bypass the brownfield refuse (default: refuse
                      on non-empty; empty projects always pass)

  Implementation: thin dispatcher in `bin/Mathc.ml::do_adopt`
  that calls the running binary (via `Sys.executable_name`)
  as `mathc init` and `mathc import-adr` subprocesses. This
  avoids the PATH issue: the same binary that dispatches
  to `do_adopt` does the work via exec.

  Touches (per A3 self-application):
    bin/Mathc.ml                       (do_adopt + dispatch arm +
                                       print_usage update)
    bin/dune                           (add mathcoding_adopt to libs)
    lib/adopt/detect.ml                (md_files_rel: return
                                       relative paths so the
                                       caller can construct the
                                       absolute path)
    tests/cli/adopt.t                  (new cram fixture, 4 cases)
    decisions/ux-3-adopt-subcommand-2026-10.yaml   (this file)

axiom_link:
  - A0
  - A1
  - A3

antithesis: |
  The counter-position considered and rejected: "A
  brownfield-adoption subcommand is too clever; just
  document the 2-command flow (`mathc init --merge` +
  `mathc import-adr` per ADR) in the adoption docs and let
  the user script it. Adding `mathc adopt` is feature
  bloat." The author engaged with this position and
  rejected it on four grounds: (a) the user's Q2 answer was
  "реальные, делать качественно" — the explicit ask for
  quality, not a script; (b) the 2-command flow requires
  the user to know that `init --merge` exists, to know
  that `import-adr --write` is the right invocation, and
  to write a loop over the detected ADRs — that's 3
  non-obvious steps that an adopter is likely to skip; (c)
  the detection logic (Phase 3.1) and the orchestration
  logic (this slice) are the two halves of one user-facing
  feature; splitting them across two unrelated subcommands
  (`init` + `import-adr`) leaves the user to glue them
  together; (d) per the §10.1 adapter convention, a
  sub-library with its own orchestration logic is the
  expected shape, not a one-off script. The minimum fix
  is one thin dispatcher in `bin/Mathc.ml` (~80 lines)
  that calls the existing subcommands, which is what this
  file records.

commitment: |
  One kernel surface addition. Four deliverables:

    D1. `mathc adopt [PATH] [--agent NAME] [--no-install]
        [--dry-run] [--only=CONV] [--merge]` exists in
        the CLI catalog. `bin/Mathc.ml::do_adopt` parses
        argv, calls `Detect.detect_classify` (Phase 3.1),
        and orchestrates the response.

    D2. The subprocess calls use the running binary's
        own path (via `Sys.executable_name`), not a PATH
        lookup. This avoids the "mathc not in PATH" failure
        mode that the earlier dispatcher would have hit.

    D3. The detection is fed by `lib/adopt/detect.ml@1`:
        `Detect.detect_classify` returns the 8-case
        `brownfield` sum type, `Detect.madr_files` /
        `Detect.adrtools_files` return ADR file paths
        relative to the project root.

    D4. `tests/cli/adopt.t` covers 4 cases: MADR +
        adr-tools, empty, --only=arc42, --dry-run.

  Boundaries (per A3 self-application):
    - `lib/adopt/` is unchanged (the detect library
      is Phase 3.1; this slice only consumes it).
    - `bin/dune` is touched only to add `mathcoding_adopt`
      to the mathc executable's libraries list.
    - The existing `mathc init` and `mathc import-adr`
      subcommands are unchanged (the orchestrator shells
      out to them).
    - The kernel under `lib/` is unchanged.
    - `spec/`, `schemas/`, `axioms/`, `scripts/` are
      unchanged.

counterexample: |
  "Recursion risk: `mathc adopt` calls `mathc init` which
   calls ... what? If `mathc init` ever calls `mathc adopt`
   (it doesn't, but defensive coding), we'd have infinite
   recursion." The counterargument fails because the
   subprocess calls are *synchronous one-shot*: `mathc adopt`
   shells out, waits, captures the exit code. The subprocess
   runs `mathc init` which only writes files; it does NOT
   shell out. The recursion depth is fixed at 1.


intent: |
  Adopt the analysis-derived plan documented in chat 2026-10-07
  ("анализ math-coding как методологии"). The plan closes 14
  specific deficits surfaced by that analysis (Tier 0–Tier 6,
  binaries excluded — those run on a separate track).

  Each T-point is a single obligation; each obligation closes by
  producing the corresponding sub-decision under
  `decisions/plan-2026-10-improvements/<t-id>.yaml` plus the
  kernel change or spec change it commits to. The meta-decision
  itself does not add new kernel behaviour; it authorises and
  bounds the cycle that does.

  Tier 0 — specification
    T0.1  §2 notation: replace ambiguous `⌈risk(c)⌉` with explicit
          `risk_to_mode` bucketing in spec/algebra-3.2.md
    T0.2  sha-match enforced: `body_sha` and `yaml_sha` must agree
          when both present, no retroactive exceptions

  Tier 1 — honest-uncertainty closure
    T1.1  wire forge_mirror adapter behind MATH_CODING_FORGE_API
    T1.2  re_evaluate status becomes 4-valued:
          Compatible | CompatibleAfterRun | Incompatible | StaleClaim
          (was 3-valued; A1 closes the open Compatible-by-default
          path)

  Tier 2 — decision parser & relation graph
    T2.1  remove scan_axiom_ids bridge in re_evaluation.ml; populate
          relations.addresses in lib/decision.ml directly
    T2.2  axiom_link becomes required for state=active (was optional)

  Tier 3 — gate unification
    T3.1  Risk.mode wired into v3.0 evaluate path (currently only
          v3.2 gate_v32 sees risk classification)
    T3.2  waiver scope narrows to specific (decision, obligation)
          gap; blanket Open_with_waiver is forbidden

  Tier 4 — diagnostics UX (audit D8)
    T4.1  every MC-* diagnostic carries a copy-pasteable next_actions
          snippet (extension of validator-actionable-error.yaml)
    T4.2  mathc explain-diagnostic <CODE> subcommand

  Tier 5 — documentation / site
    T5.1  reconcile RU↔EN drift under site/*.ru.md
    T5.2  MathJax audit on spec/algebra-3.2.md rendering

  Tier 6 — process discipline
    T6.1  ban stub constants carrying "Phase 2E" markers without a
          tracking decision; enforced in scripts/check.sh
    T6.2  counterexample becomes required for mode >= standard on
          new decisions; one-shot strong migration sweep over
          existing 28 legacy decisions

  Boundaries:
    - Binaries (portable-linux-musl) are NOT in scope; the user
      is running that work on a separate track.
    - Constitution invariants I1–I14 are preserved verbatim.
    - 5 axioms A0–A4 are preserved verbatim.
    - This decision does NOT itself edit spec/, lib/, or
      schemas/. The sub-decisions do that work.
    - Tier 1 (T1.2 status expansion) and Tier 6 (T6.2 counterexample
      enforcement) are A3-protected transitions; each sub-decision
      ships under the same active policy bootstrap-v3 and includes
      dual-failure evidence per constitution.md §Self-Application.

axiom_link:
  - A0
commitment: |
  The cycle closes when, for every T0.1 … T6.2 obligation below:
    (a) a sub-decision exists at
        `decisions/plan-2026-10-improvements/<t-id>.yaml` with
        `state: active` and at least one matching attestation in
        `attestations/` whose `kind_` ∈ {test, build, review}
        appropriate to the change;
    (b) the kernel change or spec change the sub-decision commits
        to has landed on main; and
    (c) `mathc self-check` returns `verdict:"pass"` with the new
        change-set, exit 0.

  The meta-decision itself closes when every (a)–(c) holds for
  every obligation. Until then, this decision carries 14
  open-at-1-on-1 obligations and is reported as
  `Open_with_waiver` only via explicit per-obligation waivers
  in `decisions/waivers/`.

  Excluded from this commitment:
    - portable-linux-musl (separate track, see
      `decisions/portable-linux-musl.yaml`)
    - axiom-as-decision (P5; deferred per ROADMAP Tier 3)
    - phantom-id types (deferred per ROADMAP Tier 3)


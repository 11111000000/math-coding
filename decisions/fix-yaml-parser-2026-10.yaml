yaml_sha: "sha256:6e02503d50ee770f08bb16e4b7ea7cb658aad2af7520804b81841cf825e7538a"

intent: |
  The hand-rolled YAML parser in `lib/codec.ml` consumed the
  `counterexample:` key when a decision carried its
  `risk.declared_triggers` as the inline form `key: - foo`
  followed by `- bar` continuation lines. The custom parser
  treated the first dash item as a string scalar and then
  bailed out of the mapping at the next same-indent dash,
  dropping every top-level key that followed. The
  adoption-experiment report (`docs/experiments/adoption-2026-10.md`
  §10.5 #7) named this as F-SCHEMA, with two sub-agents
  independently confirming it on sinatra and ripgrep. The
  diagnostic `MC-COUNTEREXAMPLE-MISSING` fired on decisions
  that *had* a counterexample block, producing a high-volume
  false-positive warning that obscured genuine gaps. The
  parser-shape is the YAML 1.2 §7.1 inline block-sequence form,
  which the parser had no branch for.

commitment: |
  `lib/codec.ml::parse_yaml_pairs` recognises the
  inline-sequence form: when the trimmed value side of a
  `key: …` line begins with `- `, parsing is delegated to
  the new `parse_yaml_inline_seq` helper. The helper
  consumes the first item from the already-trimmed value
  string and walks forward through the remaining tokens,
  collecting any same-indent `- …` entries. Items are
  parsed as scalars via the existing `parse_yaml_scalar`
  (an empty string maps to `Jsonl.Null`, matching
  `parse_yaml_seq` semantics). The pre-existing shapes
  (dash items on subsequent lines at deeper indent, plain
  scalar values, block scalars, key-only lines) are
  unchanged. `risk.declared_triggers: - foo\n  - bar` now
  parses as `Array [String "foo"; String "bar"]`, so the
  following `counterexample: | …` key is preserved.

counterexample: |
  The strongest objection considered: "YAML parsers in
  the wild have subtle edge cases; a fix that handles
  one inline-sequence shape may regress another.
  Cram coverage is necessary." This is rejected on three
  grounds: (a) the new branch is added without touching
  the existing branches (parse_yaml_pairs preserves
  block-scalar, plain-scalar, and indented-dash paths
  intact); (b) the four cram fixtures in
  tests/cli/yaml-parser.t exercise the new branch and
  the three pre-existing shapes side-by-side; (c) the
  kernel unit tests under tests/yaml_block_scalars.exe
  pin both the new branch and the indented-dash form
  in the same binary, so any regression of the latter
  by the former surfaces immediately.

outcomes:
  - id: inline-seq-preserves-sibling-keys
    statement: |
      A decision whose `risk.declared_triggers` is given in
      the inline-sequence form `key: - foo` followed by
      `- bar` continuation lines at the same indent, plus
      a sibling `counterexample: |` block, is parsed
      without dropping either the `risk.declared_triggers`
      Array value or the `counterexample:` key.
  - id: counterexample-diagnostic-now-true-positive
    statement: |
      After this fix, `MC-COUNTEREXAMPLE-MISSING` fires
      only when the field is genuinely absent; the
      parser-induced false positive is closed.


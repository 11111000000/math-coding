counterexample: |
  Why a fixture instead of code review? Because two copies of
  the same line, maintained by hand, will drift over time. The
  spec copy and the practices mirror exist for different
  audiences (kernel spec vs. OCaml implementer) but the data
  must be the same data; the smallest change to the order is a
  protected policy transition (spec/semantics.md §Context-prioritisation: "A
  change to the priority order is itself a protected policy
  transition"), and code review alone has already allowed one
  audit (docs/AUDIT-0.0.11.md D3) to flag this gap.

  Why not put the table only in OCAML_KERNEL_CONVENTIONS.md and
  delete it from the spec? Because spec/semantics.md names the
  table a kernel policy statement (the counterexample in
  decisions/validate-and-context.yaml says so explicitly: "the
  priority order is a kernel policy statement, not a coding
  convention. The spec is the authoritative source"). Removing
  the table from the spec would invert the policy hierarchy.

  Why not put the table only in the spec and delete it from
  OCAML_KERNEL_CONVENTIONS.md? Because the conventions file is the
  hand-held reference for OCaml implementers who don't read the
  spec; removing the table would not stop the mirror from
  existing, it would just make the mirror a memory of a memory.

  Why not auto-generate the practices table from the spec at
  build time? Because the practices file is a single Markdown
  document, not a templated artifact; a generator would add a
  step to the build pipeline and a dependency on the
  generator. The fixture approach is cheaper: it asserts the
  invariant, doesn't try to enforce the policy by rewriting
  either file.

  Why byte-equivalent rather than semantically equivalent?
  Because the order is six priority names separated by " > ";
  a semantic equivalence check (parse the names, sort them,
  compare) would also work, but a byte-equality check is
  simpler, faster, and produces a useful diff on failure. The
  cost is that an editor who reformats the line (say,
  inserting a space after ">") trips the fixture — that is the
  intended behaviour, because any visible edit to one table
  must be reflected in the other.

assumptions:
  - id: no-new-deps
    state: assumed
    statement: |
      The test uses the existing OCaml test executable and the `Str`
      library already in the test environment. No new executable, no
      new package, and no new dune stanza. The test runs with the
      standard `dune runtest` suite.
    owner: human:maintainer
    consequence_if_false: |
      If a future extension to the priority table includes
      nested structure (e.g., a per-priority rationale or a
      sub-bucket), the grep-and-awk check must be replaced by a
      structural diff. That is a separate Decision; this one
      does not anticipate it.
    review_on:
      - signal: priority-table-becomes-structured
  - id: drift-detection-trumps-trivially-passing
    state: assumed
    statement: |
      The fixture distinguishes four cases: (a) both files
      carry the same line → exit 0; (b) both files carry
      different lines → exit 1 (drift, with diff); (c) exactly
      one file carries the line → exit 1 (drift, with
      explanation); (d) neither file carries the line → exit 0
      (no drift to detect). Case (d) is not "passing silently";
      it is the parent task's explicit instruction: absence of
      a table in both files is not a drift condition because
      there is nothing to disagree. Presence of the table in
      both files is enforced separately if at all — that is a
      different obligation (not in scope here).
    owner: human:maintainer
    consequence_if_false: |
      If a future revision tightens this to require presence in
      both files, that is a separate decision that adds an
      explicit presence obligation. This decision scopes itself
      to drift detection between the two tables.
    review_on:
      - signal: presence-obligation-added

obligations:
  - id: priority-drift-detector
    outcome: priority-tables-locked
    claim: |
      The priority-ordering line in spec/semantics.md
      "context-prioritisation" is byte-equivalent (modulo
      whitespace) to the priority-ordering line in
      OCAML_KERNEL_CONVENTIONS.md §10.5. tests/repo_structure.ml:
      test_spec_vs_bp_priority extracts the line beginning with
      `RequiredForGate` from each file (or returns None if
      absent), normalises whitespace, and asserts equality. A
      drift fails the Alcotest case with both extracted lines; an
      absent-on-one-side is reported explicitly.
    acceptance:
      all:
        - verifier: dune test --root . tests/repo_structure.exe

  - id: priority-drift-fixture-implemented
    outcome: priority-tables-locked
    claim: |
      tests/repo_structure.ml:test_spec_vs_bp_priority is committed
      to the OCaml test suite and runs under `dune runtest`. The
      test handles the four outcomes the priority-drift obligation
      declares: (a) both files carry the same line → OK; (b) both
      files differ → FAIL with diff; (c) exactly one file carries
      the line → FAIL; (d) neither file carries the line → OK (no
      drift to detect; presence is enforced separately if at all).
      This is the implementation record (revision 2); the
      obligation priority-drift-detector was the declaration
      (revision 1).
    acceptance:
      all:
        - verifier: dune test --root . tests/repo_structure.exe


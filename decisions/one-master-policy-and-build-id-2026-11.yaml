counterexample: |
  The strongest objection against this decision is that the
  installer's template and the master policy are DIFFERENT THINGS on
  purpose: the template is for a newcomer and is deliberately
  simpler, and to make them one is to force the newcomer to accept
  the floors of this repository.

  The objection is right about the floors and right about the
  consequence, and it is wrong about which documents are being
  merged.

  The floors are NOT part of the master policy. They are the policy
  SEQUENCE (`policies.yaml`), a different artifact with a different
  schema, and this decision does not ship them to anybody: the
  master policy travels inside the binary and `mathc init` writes
  the master policy, not a floor declaration. A newcomer who adopts
  this protocol still has to declare their own floors, and until they
  do, their `mathc mode` answers the silent baseline. That gap is
  REAL and it is NAMED here -- it is the "no policies.yaml here, so
  the kernel uses its lowest rung (Tiny)" that `mathc init` prints
  in its applicability envelope -- and closing it is a different
  decision with a different design (a template of floors that the
  adopter edits is a THIRD kind of document, and this tranche
  deliberately did not invent one).

  What is wrong in the objection is the premise that the installer's
  template and the master policy are two documents. They are one
  document that was copied by hand twice: the file under
  `scripts/install-tooling/templates/` and the literal in
  `lib/init/init.ml` both said `id: bootstrap-v3, revision: 1`, and
  they said DIFFERENT things -- 172 diff lines, an empty
  `scope.paths[]` against six placeholders, `mathc-validate` against
  `file-exists src`, a paragraph written for nobody against a TODO
  for the adopter. Unifying them does not make the newcomer's
  policy richer or poorer; it makes ONE document exist instead of
  two that disagree about what a newcomer receives. And the one that
  survives is the one `mathc init` actually writes -- the blank form
  with the placeholder paths -- so the adopter is not given this
  repository's obligations, and the copy in the tree is not this
  repository's instance (`decisions/decision.yaml`, `bootstrap-v3@3`,
  seven obligations, four of them paper).

  A second objection, and it is the one that decides the shape of
  the build id: a digest of the binary's own bytes identifies the
  ARTIFACT, not the SOURCE. Two builds of one commit are two files
  and answer differently, and a user who wants to know "is my
  binary older than the repository I am working in?" has to compare
  the id with the repository's -- which is a different question, and
  the one the release tag answers. The objection is correct that the
  id does not say which commit was cut, and the decision says so
  plainly rather than pretending otherwise: the id answers "which
  binary is this", and it answers it exactly, which is the property
  the plan asked for ("two different binaries must give different
  strings, and the same one the same -- otherwise the build
  identifies nothing"). A source id would satisfy the second half
  and break the first: two builds of one source are different
  binaries.

  What would change the verdict: a decision that the protocol's
  master policy is THIS repository's instance rather than the blank
  form. Then the canonical file would be `decisions/decision.yaml`,
  the installer's copy would carry seven obligations of which four
  are `manual-*` and none of which mean anything in a newcomer's
  repository, and the copy would be worse for the adopter than the
  blank form it replaces. The trigger is in the risk block.

antithesis: |
  The opposite position is that the three documents are three
  different things and need no unification at all: the risk floors
  are a policy sequence, the installer's template is a legacy path
  that nobody uses any more, and `decisions/decision.yaml` is this
  repository's own business. "One master policy instead of three"
  would then be a category error, and the plan's row would be the
  plan being wrong in the way its rows usually are -- written before
  anyone counted.

  The position is RIGHT about the kinds, and that is why this
  decision names them (master policy, active policy, policy
  sequence) instead of merging them into one. It is wrong about the
  drift, and the drift is the part that costs.

  Two documents carrying the same id and the same revision with
  different bodies is a resolution bug, not a convention: a reader
  that resolves `bootstrap-v3@1` by id has two answers, and the
  installer template -- the one nobody reads -- is the one that says
  the newcomer inherits an EMPTY scope and a `mathc validate`
  obligation, while the copy the binary writes says the newcomer
  inherits six placeholders and an obligation against their own
  tree. The tree cannot say which is the truth, because nothing
  checks.

  The position is also wrong about the dead variable being harmless.
  `MC_TEMPLATE_REMOTE_PATH` was not a leftover of a finished
  migration; it was a promise that the install path ships the master
  policy to the adopter, and the install path did not ship it. A
  promise that is not kept is worse than no promise, because the
  decision that made it (`install-tooling-2026-10`, commitment 3)
  still says the template "ships in the same tarball as install.sh"
  and the release publishes no template.

  And the position has no answer to the plan's actual question. Two
  binaries that answer `3.7.4` are the same release and not the same
  build; the version changed eighteen times in eighteen days; the
  older binary writes a scaffold the kernel rejects. A tree that
  knows this and has no way to say which binary is running cannot
  answer a support question about its own users.

outcomes:
  - id: one-master-policy-one-source
    statement: |
      The master policy has one source (`templates/master-policy.yaml`)
      and every copy of it in the tree is generated from it. The
      generator reproduces the embedded copy byte for byte, and the
      check refuses a drift in either copy.

  - id: the-kinds-are-named
    statement: |
      The tree says which document is which: the master policy (one
      source), a project's active policy (an instance, located by
      id), and the policy sequence (the floors). No file in the live
      tree but `policies.yaml` declares policy records, and
      `decisions/decision.yaml` is a decision.

  - id: the-dead-variable-is-gone
    statement: |
      The installer names no variable it does not read, and the
      master policy reaches an adopter through the binary.

  - id: the-build-id-is-a-measurement
    statement: |
      `mathc version --build-id` answers a digest of the running
      binary: two different binaries answer differently, the same one
      answers the same, and an unmeasurable answer is exit 3 rather
      than a guess.

  - id: the-installer-stamps-the-build
    statement: |
      An installation carries the digest the installer verified, the
      installed binary prints it, and a stamp that does not match the
      bytes is named instead of believed.

  - id: the-quickstart-tells-the-truth
    statement: |
      `QUICKSTART.md` names the files `mathc init` creates.


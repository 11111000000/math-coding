risk:
  owner: human:maintainer
  declared_triggers:
    - "the master policy changes and lib/ is still owned by another tranche"
    - "the protocol's master policy is decided to be this repository's instance rather than the blank form"
    - "a second place starts copying the master policy by hand"
    - "the build id is asked to name a source commit instead of an artifact"
    - "the banner of `mathc version` is changed while tests/cli/ is out of bounds"
    - "the installer stops stamping what it installs"

assumptions:
  - id: the-blank-form-is-the-protocols-master-policy
    state: assumed
    owner: human:maintainer
    statement: |
      The protocol's master policy is the blank form a project starts
      from (`templates/master-policy.yaml`), and a project's
      `decisions/decision.yaml` is an INSTANCE of it -- this
      repository's is `bootstrap-v3@3`, with this repository's
      obligations. The two are not copies of each other and must not
      become copies of each other.
    consequence_if_false: |
      If the master policy is this repository's instance, the
      canonical file is `decisions/decision.yaml` and the file the
      adopter receives carries seven obligations of which four are
      `manual-*` and none of which mean anything in a newcomer's
      repository. The installer's copy would then be worse for the
      adopter than the blank form it replaces, and the decision's
      counterexample would be the one that is right.
    review_on:
      - signal: master-policy-becomes-a-repo-instance

  - id: the-embedded-copy-is-generated-not-maintained
    state: assumed
    owner: human:maintainer
    statement: |
      The literal in `lib/init/init.ml` is the generator's output.
      Measured on 2026-11-01: `scripts/sync-master-policy.sh --write`
      rewrites the file with no change at all, byte for byte, and the
      fixture proves it by regenerating the literal in a copy and
      requiring the copy to come out unchanged.
    consequence_if_false: |
      If a future edit to the master policy is made in the literal
      rather than in the canonical file, the two copies diverge and
      the adopter receives one policy while the tree ships another.
      The fixture catches it (`--check` compares the DECODED literal
      with the source), so the divergence is visible rather than
      silent -- but the next change to the master policy has to touch
      `lib/`, and `lib/` is owned by another tranche until it is not.
    review_on:
      - signal: master-policy-changes

  - id: the-build-id-answers-which-binary
    state: assumed
    owner: human:maintainer
    statement: |
      The question the build id answers is "which binary is this",
      not "which commit was it cut from". The id is a digest of the
      running file's own bytes; two builds of one commit are two
      files and answer differently, and the release tag answers the
      other question.
    consequence_if_false: |
      If the id is expected to name a source commit, the artifact
      digest is the wrong instrument: it cannot tell two builds of
      one source apart, and a user comparing it against a commit will
      read a difference where there is none. The instrument would
      have to become a compile-time source id, which the kernel does
      not carry today (the build is offline and the version is read
      from `./VERSION` at runtime).
    review_on:
      - signal: build-id-asked-for-a-commit

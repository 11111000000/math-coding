intent:
  source: "plan:docs/plans/redundancy-and-portability-2026-11.md#4 (tranche T4.2)"
  text: |
    Tranche T4.2 of the redundancy-and-portability plan: one master
    policy instead of three, and a binary that says which build it is.

    WHAT WAS MEASURED (2026-11-01), because the plan's row -- "one
    master policy instead of three" -- was written before anyone
    counted, and the count is not what the row says.

    FOUR documents answered "what is the policy?", in THREE kinds:

    1. `policies.yaml` (repository root) -- a policy SEQUENCE: five
       records (`math-coding-kernel`, `math-coding-protocol`,
       `math-coding-support`, `math-coding-docs`, `math-coding-
       corpus`), seventeen `scope_paths` in all (2 + 3 + 8 + 2 + 2),
       `mode_floor: standard` on two of them and `light` on three,
       and NO obligations in any of them. `schemas/policy.json` says
       a policy record's `obligations` has `minItems: 1`, so the
       canonical policy file does not satisfy the schema that names
       it. (The kernel does not check: `lib/policy.ml` parses the
       records and reads the floors.)

    2. `scripts/install-tooling/templates/active-policy.yaml` -- NOT
       a policy sequence: a DECISION document (`schema:
       math-coding/3.2`, `id: bootstrap-v3`, `revision: 1`), with
       ONE obligation (`policy-file-present`, verifier
       `mathc-validate`) and an EMPTY `scope.paths[]`. Its own
       counterexample admits the consequence: "the new repo's first
       `mathc self-check` will report `unknown` because no
       obligations are scoped to anything". The counterexample it
       carries is a paragraph arguing against adopting math-coding,
       written by the kernel, about a project the kernel cannot see.

    3. `lib/init/init.ml::master_policy_template` -- a DECISION
       document too, with the SAME id and the SAME revision
       (`bootstrap-v3`, `revision: 1`), and a different body: six
       PLACEHOLDER scope paths (`src/**`, `tests/**`, `docs/**`,
       `scripts/**`, `schemas/**`, `site/**`), one exclusion
       (`**/.git/**`), one obligation (`scope-names-this-tree`,
       verifier `file-exists src`), and a counterexample that is a
       TODO for the adopter instead of an argument. This is the copy
       `mathc init` writes -- the one an adopter actually receives.

    4. `decisions/decision.yaml` -- THIS repository's instance of the
       same id (`bootstrap-v3`, `revision: 3`): seven scope paths
       (this repository's), seven obligations (four of them
       `manual-*`, i.e. paper), five outcomes, one assumption and a
       reversal. It is a DECISION, not a policy sequence, and it is
       not a copy of anything: it is what this project committed to.

    The two documents that both claim `id: bootstrap-v3, revision: 1`
    differ by 172 diff lines. Two documents with the same id and the
    same revision and different content is not a convention, it is a
    resolution bug waiting for a reader.

    AND THE THIRD SOURCE WAS DEAD. `MC_TEMPLATE_REMOTE_PATH` was
    defined at `scripts/install-tooling/install.sh:54` and read
    nowhere: the installer never fetched the template, and the
    release never published it (`.github/workflows/release.yml`
    publishes `SHA256SUMS`, `install.sh`, `install.ps1`,
    `dist-adoption.tar.gz` and the `mathc-*` binaries -- no
    template). A variable that names a file and is never read is a
    promise that nothing reads.

    WHAT `decisions/decision.yaml` IS REFERENCED BY, since the plan
    asks that the decision about it be taken on what really depends
    on it: the kernel resolves the active policy by PATH
    (`lib/path_config.ml:39`, the legacy layout's
    `decisions/decision.yaml`) and by ID (`lib/capsule.ml:171`,
    `bin/Mathc.ml:2269` -- `bootstrap-v3` maps to that file),
    `lib/packages.ml` excludes it from the corpus listing, and 50
    live decisions name `bootstrap-v3`. It therefore CANNOT
    disappear: `mathc self-check` and `mathc gate` read it. What it
    can stop being is "the policy" in the prose of the tree, because
    it is a DECISION -- this repository's instance of the master
    policy -- and three kinds of document were being called one
    thing.

    THE SECOND HALF: A VERSION IS NOT A BUILD. `VERSION` says 3.7.4
    and the installer installs `MC_VERSION_DEFAULT="3.7.4"`, and the
    version changed EIGHTEEN times between 2026-10-07 and 2026-10-25
    (`git log --oneline -- VERSION`). Two different binaries answer
    `3.7.4`, so the user cannot say which one is on their PATH, and
    the plan names the consequence: "the older one writes a scaffold
    the kernel rejects".

    Measured about the local tree, because the obvious demo does not
    work: `_build/install/default/bin/mathc` is a SYMLINK to
    `_build/default/bin/mathc.exe`, so the two paths are ONE file
    with one digest (`sha256:e722f594...`) and any id derived from
    the bytes MUST answer the same for both. The two different
    binaries appear when the file is COPIED (an installation, a
    tarball, a container image) or REBUILT.

    And the answer an installed binary gave before this tranche was
    worse than "3.7.4": the version string is read from `./VERSION`
    at runtime, an installed binary has no VERSION file in reach,
    and the fallback printed the literal string "math-coding" into
    the version slot:

        $ cd /tmp && ~/.local/bin/mathc version
        math-coding math-coding: bootstrap

    `scripts/install-tooling/install.sh --check` greps for
    "math-coding <version>:", so that check could not pass against a
    real installation.

    Two cram fixtures pin the banner BYTE (`tests/cli/version.t`
    compares it with `cmp`; `tests/cli/update.t` compares the line
    after a `sed`), so the build id could not be folded into the
    banner without editing `tests/cli/**` -- which this tranche is
    not allowed to touch. The build id is therefore a FLAG on
    `mathc version`, and the banner of an unstamped (source) build
    is unchanged byte for byte.

commitment: |
  After this decision closes:

  1. There is ONE master policy document in the tree:
     `templates/master-policy.yaml`. It is the blank form a project
     starts from -- `id: bootstrap-v3`, `revision: 1`, placeholder
     scope paths, one obligation that names the adopter's own tree --
     and it is byte-identical to what `mathc init` writes.

  2. Every copy of it is GENERATED, and the generation is checked:

     - `scripts/install-tooling/templates/active-policy.yaml` is a
       verbatim copy. It stays a DECISION document, because the
       kernel validates it (`tests/cli/install.t`, obligation
       `install-template-validates` of
       `decisions/install-tooling-2026-10.yaml`) and a policy
       sequence would not validate.
     - the string literal in `lib/init/init.ml` is the copy the
       binary embeds. `scripts/sync-master-policy.sh --write`
       regenerates it BYTE FOR BYTE: the file is unchanged by this
       tranche because the generator's output IS the file, which is
       the strongest form the claim can take.

     `scripts/sync-master-policy.sh --check` compares both, and
     `tests/fixtures/master-policy-one-source.sh` runs the check,
     proves the generator is faithful (it regenerates the literal in
     a COPY of `lib/init/init.ml` and requires the copy to come out
     unchanged), and carries the NEGATIVE CONTROL: it breaks each
     derived copy in a throwaway copy of the tree and requires the
     checker to refuse it.

  3. The three kinds are named, and the tree stops calling them one
     thing:

     - MASTER POLICY: the protocol's document,
       `templates/master-policy.yaml`. ONE source.
     - ACTIVE POLICY: a project's instance of it -- the file the
       kernel reads, located by id (`bootstrap-v3`). In this
       repository: `decisions/decision.yaml` (`bootstrap-v3@3`).
     - POLICY SEQUENCE: `policies.yaml` -- the per-path floors. A
       different artifact, and the only one in the tree that
       declares policy records.

     `policies.yaml` says so in its own header, and the fixture
     checks it: no other file in the live tree declares a
     `policy_id`, and `decisions/decision.yaml` has an `id` and no
     `policy_id` -- it is a decision, not a policy sequence.

  4. `MC_TEMPLATE_REMOTE_PATH` is GONE from the installer. It named
     a file and was read nowhere; the master policy travels inside
     the binary, and `mathc init` writes it.

  5. `QUICKSTART.md` says what `mathc init` actually creates. It
     said `mathc validate decisions/decision.yaml`; the command
     writes `.math-coding/policy.yaml` (measured by running it in an
     empty directory), so the quickstart named a file the command
     does not create.

  6. The binary answers which build it is:

     - `mathc version --build-id` prints twelve hex characters: the
       SHA-256 of the running binary's OWN BYTES. It exits 3
       ("unknown, not pass") when it cannot measure them.
     - the property that makes the id an id: two DIFFERENT binaries
       answer differently, and the SAME binary answers the same --
       at any path, in any copy. `tests/fixtures/build-id-
       distinguishes.sh` measures exactly that, on copies of the
       real binary, and proves the check can go red against two fake
       binaries that answer a constant.

  7. The installer stamps what it installed. The digest it verified
     (the one the release's `SHA256SUMS` carries) goes into
     `mathc.build-id` next to the binary, with the version it
     installed. An installed binary prints the build id in its
     banner -- "math-coding 3.7.4: bootstrap (build e722f594c2f6)" --
     and the banner of a SOURCE build is unchanged byte for byte,
     because a source build has no stamp next to it.

  8. A stamp that does not match the bytes is NAMED, not believed:
     the banner always shows the digest of the file that is running,
     and the mismatch goes to stderr. `scripts/install-tooling/
     install.sh --check` refuses an installation whose stamp
     disagrees with the binary on disk.

  WHAT THIS DECISION DOES NOT DO, said here so that nobody has to
  guess:

  - It does not give an adopter a `policies.yaml`. `mathc init`
    writes the master policy and the two directories; it does not
    write a policy sequence, so an adopter's floors are the silent
    baseline (`Tiny`) until they declare their own. That gap is
    named by the counterexample below and is NOT closed here: the
    floors of this repository are this repository's.
  - It does not touch the 136 live decisions. One of them --
    `decisions/install-tooling-2026-10.yaml` -- says the install
    template is "a verbatim copy of `decisions/decision.yaml`",
    which was FALSE when this tranche started (the file was
    `bootstrap-v3@1` with an empty scope) and is still false now:
    the copy is of the SCAFFOLD, and the reason it is a scaffold and
    not this repository's instance is the counterexample below.
    Repairing that sentence belongs to the corpus tranche (T2.2b),
    which rewrites the decisions whose claims no longer hold.
  - It does not change `lib/**`. The embedded copy is regenerated by
    the same script, and the script's output is the file, so nothing
    had to change -- but the next change to the master policy will
    touch `lib/init/init.ml`, and that tranche needs `lib/` free.


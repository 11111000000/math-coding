risk:
  declared_triggers:
    - "a decision that was a rule is classified as prose because it
      carries no obligation, and stops being checked; the count of
      excluded decisions is the only sign"
    - "the corpus is deleted from the repository and the verdict stays
      green, because an absent corpus has no claim to violate; the
      corpus block reports the absence, and the gate that requires the
      corpus is the CI step, not the kernel"
    - "a decision with only declared obligations is read as noise and
      dropped from the subject set again, and the report goes green
      over an uncovered gap"
  owner: human:maintainer

counterexample: |
  "The first version of this decision was reasonable and it was
  wrong, and the corpus caught it in a week."

  Revision 1 said: a standing rule is a decision that is in force AND
  carries at least one obligation A PROGRAM CAN RUN; a decision whose
  obligations are all `manual-` declarations is prose, and prose is
  not a subject. The reasoning was sound: no evidence could ever
  discharge a declaration, so asking about it produces a permanent
  `unknown`.

  The corpus's contract tests said otherwise, and they were right.
  `tests/cli/self-check-waiver-verdict.t` and
  `tests/cli/waiver-scope.t` build a decision whose only obligation is
  a DECLARED gap, cover the gap with a waiver, and require the report
  to say `open-with-waiver` (exit 0); then they let the waiver expire
  and require `unknown` (exit 3). With revision 1's filter, that
  decision was not a subject at all: the report had nothing to report
  about the gap, the aggregate had no `unknown` left in it, and the
  command exited 0 where the contract says exit 3.

  That is the `unknown != pass` violation this repository keeps
  finding in one shape or another: an uncovered gap that the report
  cannot see is a gap the report has laundered. A declared gap is not
  prose -- it is a gap, declared, and the waiver machinery exists
  exactly to say whether it is covered.

  The second thing revision 1 broke was the shape of the report: it
  put the kernel, the schemas, the fixtures and the invariants into
  `subjects[]` alongside the decisions. `tests/cli/adoption-path-p0.t`
  prints the WHOLE subject list of a scaffolded project and pins it
  to the decisions that project has. The corpus is an instrument, not
  a policy, and the report now says so in its own block.

antithesis: |
  The opposite claim is that the subject set should stay the whole
  corpus, and that a report which excludes seven decisions is a
  report that hides seven decisions.

  The claim is right about the hiding, and the design names the
  number rather than hiding it: `excluded_decisions` is in the
  report, and the decisions it names are the ones with no obligation
  at all -- a plan written as a decision, a note, a page. There is
  nothing in them to keep, and a report that carried them would
  report `pass` over a document that claims nothing.

  The concession is real: a decision written as prose but meant as a
  rule is invisible to the report. That is why the count is reported,
  and why the census that decided what the corpus is for is a
  separate decision (`corpus-census-2026-10`): the subject set says
  what the kernel checks; the census decides what the corpus is for.

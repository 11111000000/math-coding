axiom_link:
  - A0
  - A1

intent: |
  THE OLD SUBJECT SET WAS THE CORPUS. Every decision in decisions/
  was a subject of `mathc self-check`, so the report was a report
  about the corpus -- and the corpus was mostly `unknown`, because
  most of it carries DECLARED gaps: `manual-` obligations and
  `unverified_obligation` markers that no program can keep.

  Most of that is honest. What the report did not say is WHERE the
  corpus ends and the CODE begins. A reader saw 191 subjects and
  could not tell which of them are checks and which are notes, and a
  project that wanted to act on the report could not: the remedy the
  report implies ("attest more of it") is not available for a
  declaration.

  THE SUBJECT SET IS THE POLICY. `subjects[]` is every decision in
  force that carries at least one OBLIGATION, named by its id. A
  decision with no obligations at all is PROSE -- a plan, a note, a
  page -- and prose is not a rule; the count of excluded decisions is
  reported, so the exclusion is visible rather than silent.

  THE CORPUS IS AN INSTRUMENT, AND IT IS REPORTED AS ONE. The
  schemas, the conformance fixtures and the invariants those fixtures
  execute are not policy: they are the machinery that decides
  whether the policy can be decided at all. They live in their own
  block in the report, with their own verdict:

    corpus.schema[]        each schema loads as a document
    corpus.conformance[]   each fixture behaves as its name promises
                            (`positive-` accepted, `negative-` rejected)
    corpus.invariants[]    each invariant the constitution states,
                            checked against that corpus
    corpus.verdict         the corpus is green or it is not

  The corpus is folded into the top-level verdict where there IS one:
  the bootstrap-gate condition is "the kernel checks this repository
  AND its conformance corpus". A project with no corpus has made no
  corpus claim; the absence is reported in the block and does not
  decide the verdict.

  A decision whose obligations are all DECLARED IS A SUBJECT. Its gap
  is `unknown`, or `open-with-waiver` when a waiver covers it. This
  is the part the first version of this decision got wrong, and the
  corpus's own contract tests are what caught it -- see the
  counterexample.

  MEASURED on this repository, 2026-10-28:

    subjects: 191 (the decisions in force that carry an obligation)
    excluded decisions (no obligations at all): 7
    corpus: 6 schemas + 19 conformance fixtures + 16 invariants,
            verdict pass
    top-level verdict: unknown (exit 3) -- the policy has gaps

commitment: |
  1. `subjects[]` is the policy: the decisions in force that carry an
     obligation, named by their id. The corpus is reported in its own
     block, and the two are not mixed.
  2. A decision with no obligations is prose and is not a subject; the
     count of excluded decisions is reported.
  3. A decision whose obligations are all DECLARED is a subject. It
     reports `unknown` when nothing covers its gap and
     `open-with-waiver` when a waiver does.
  4. The verdict and the exit code keep their meaning: a subject that
     is not decided makes the aggregate `unknown` (exit 3).
     `unknown != pass` is not relaxed by choosing a subject set.
  5. The conformance corpus is checked against its own names: a
     `positive-` fixture that is rejected, or a `negative-` one that
     is accepted, fails the report.

outcomes:
  - id: the-report-separates-policy-from-instrument
    statement: |
      The report names the decisions in `subjects[]` and the
      instrument in `corpus`, and says how many decisions it excluded
      and why.
  - id: a-declared-gap-is-still-a-subject
    statement: |
      A decision whose only obligation is a declared gap appears in
      `subjects[]` with the verdict its gap deserves: `unknown`, or
      `open-with-waiver` under a waiver in force.
  - id: the-corpus-is-still-green-only-when-it-is-green
    statement: |
      A standing rule whose evidence is missing or stale is still
      `unknown`, and the aggregate is still `unknown`.


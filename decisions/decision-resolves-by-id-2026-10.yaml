intent: { source: "issue:kernel-resolved-decisions-by-file-name-2026-10-25", text: "The kernel resolved a decision by CONCATENATING its id with .yaml and looking for that file. Sixteen decisions in this corpus carry an id that differs from their file name - candidate-tree-resolves-to-a-commit lives in candidate-tree-resolves-to-a-commit-2026-10.yaml, bootstrap-v3 lives in decision.yaml, and eleven more - so for every one of them the file was not there, the parse failed, and every one of its obligations was reported as failed. Measured on 2026-10-25: 69 of the 110 obligations the re-signing refused to sign were failing for exactly this reason, and no message said so anywhere: the kernel could not find the decision it was asked about, and reported that as a broken check." }

commitment: |
  After this decision closes:

  1. A decision is found by its ID, by scanning the decisions
     directory - the same way the corpus is enumerated. The file name
     is not load-bearing.
  2. A decision whose id differs from its file name is resolved and
     its obligations are verified, exactly like one whose name
     matches.
  3. The resolution is memoised per process: it happens once per
     obligation, and the corpus is read once per resolution
     otherwise.
  4. A genuine failure still reports as a failure. The fix resolves
     the decision; it does not make a broken check look like a
     passing one.

  REVISION 2. The file this decision scopes was reformatted by
  `dune fmt` after the fix was written. The formatting changes the
  BYTES of bin/Mathc.ml, and the bytes are what the materials digest
  is computed over - so the decision is amended here, with the
  reformatted file, rather than the reformatted file being left as a
  separate kernel change with no decision of its own. The rule did
  not change; the digest did.

axiom_link:
  - A0
  - A1

counterexample: |
  Two counter-positions considered and rejected.

  (a) "Rename the sixteen files to match their ids." Rejected:
  that makes the corpus obey the kernel instead of the other way
  round, and it churns sixteen tracked paths for a defect that is
  in the kernel. The corpus is ALREADY enumerated by scanning the
  directory (Re_evaluation.list_decision_files), so the convention
  that the file name must equal the id was never real - it was one
  call site assuming it.

  (b) "Fall back to the concatenation when the scan finds nothing."
  Rejected: the fallback is what produced the silent failure in the
  first place. A scan that finds nothing means the decision is not
  in the corpus, and that is a fact worth stating rather than
  papering over with a guess.

antithesis: |
  The opposite claim is that the id should not be the identity at
  all, and that a decision should be addressed by its path - so that
  a corpus could hold two decisions with the same id, and a
  reference could name a file that has been renamed.

  The claim identifies a real hazard - the id is only unique by
  convention - but it does not describe this corpus, where every id
  IS unique and the file names are not stable (they carry dates,
  and sixteen of them already drifted from the id). Making the path
  the identity would mean the corpus could not be renamed, which is
  a worse constraint than the one it has.


counterexample: |
  The counter-position considered: "Adoption experiments are
  research-flavored procrastination; the UX-friction data
  is already in the 200+ open issues on GitHub and the 50+
  support tickets — go read those, don't run an experiment."
  This is rejected on three grounds. (a) The issues and
  tickets are biased toward users who *tried* math-coding;
  they exclude the much larger population of users who
  bounced at install or at first `mathc validate`. (b)
  Issues are noisier than instrumented experiments: a
  reported "it didn't work" without a `mathc version`, a
  reproducer command, and a verdict timeline is
  uninterpretable. (c) An instrumented experiment on five
  diverse projects produces *quantitative* signal (TTFD,
  invocations, errors, throughput) that the issue tracker
  structurally cannot — because issues are written by users
  who did not record those numbers.

  The minimum sufficient response is one decision recording
  the methodology, one docs file with the design, and one
  instrumented experiment per project. The cycle is bounded
  by the eight obligations above.


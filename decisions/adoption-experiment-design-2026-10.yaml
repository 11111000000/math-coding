intent: |
  Conduct a brownfield adoption study of math-coding on five real
  external projects in five different languages, executed by
  parallel sub-agents, to gather quantitative and qualitative
  evidence about the protocol's first-time and steady-state
  adoption experience. The deliverable is information
  (an adoption-experience report and a categorised friction
  inventory), not kernel changes; any kernel change warranted by
  the results is a separate follow-up decision.

commitment: |
  The cycle closes when, for every obligation below:
  (a) `docs/experiments/adoption-2026-10.md` exists with §10
      Results, §11 Discussion, and §13 Recommendations filled
      with observations grounded in the experiment;
  (b) `~/Projects/math-coding-experiment/<project>/experiment-report.md`
      exists for each of the five projects with the metric
      template from §6 filled;
  (c) the friction inventory in §13 is categorised by code
      from §7 with reproduction steps for each event;
  (d) `mathc validate decisions/adoption-experiment-design-2026-10.yaml`
      returns exit 0 (the design itself passes validation);
  (e) for each hypothesis in `docs/experiments/adoption-2026-10.md`
      §3, an explicit support / refute / qualify verdict is
      recorded with the evidence that produced it.

outcomes:
  - id: five-external-projects-integrated
    statement: |
      Five external projects in five languages (Python, JS, Go,
      Rust, Ruby) have a `.math-coding/` tree at end-of-session
      and at least one passing decision per project.

  - id: adoption-friction-inventory
    statement: |
      A friction inventory with categorised events (F-SETUP,
      F-SCHEMA, F-WORKFLOW, F-TOOLING, F-COGNITIVE,
      F-INTEGRATION, F-DOC, F-BROWNFIELD) ranked by severity,
      with reproduction steps.

  - id: eight-hypotheses-tested
    statement: |
      Eight explicit hypotheses from `docs/experiments/adoption-2026-10.md`
      §3 are each marked support/refute/qualify with grounded
      evidence from the experiment.


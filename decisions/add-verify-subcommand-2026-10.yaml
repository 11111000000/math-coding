schema: math-coding/3.3
id: add-verify-subcommand-2026-10
revision: 1
state: active
mode: light
body_sha: "sha256:14ee8fd2adfa603aed18e36f8070bb6ce680f8f7f4434e01e6a86109ae0fc0c8"
yaml_sha: "sha256:14ee8fd2adfa603aed18e36f8070bb6ce680f8f7f4434e01e6a86109ae0fc0c8"

intent: |
  Distinguish "validated" from "verified" in math-coding. The
  `mathc validate` subcommand parses a decision YAML and
  confirms its shape; the new `mathc verify` subcommand walks
  the `acceptance.all[*].verifier` strings in a decision and
  executes them in a sandbox, returning per-obligation
  pass | fail | skipped. As part of the rename, `mathc
  validate`'s verdict string changes from `accept` to
  `parse-ok` to remove the semantic load that previously
  conflated shape-correctness with verification.

commitment: |
  The cycle closes when: (a) `mathc verify FILE` is registered
  in the dispatch table, returns usage on `--help`, and emits
  a per-obligation verdict; (b) `mathc validate` returns
  `verdict: parse-ok` instead of `verdict: accept`; (c) the
  existing cram fixtures that asserted on `accept` are
  updated to `parse-ok`; (d) `mathc self-check` reports the
  same unknown-subject count as at the plan-branch HEAD and
  zero NEW unknown subjects attributable to this change.

outcomes:
  - id: verify-subcommand-registered
    statement: |
      `mathc verify FILE [--format=text|json]` is registered in
      `bin/Mathc.ml::dispatch` and produces a per-obligation
      verdict by executing the verifier strings in a sandbox
      (subprocess, env-stripped, 60s timeout, cwd = project
      root).

  - id: validate-verdict-renamed
    statement: |
      `mathc validate` emits `verdict: parse-ok` (and the
      matching JSON `{"verdict":"parse-ok", ...}`) in place
      of the previous `verdict: accept` string.

  - id: cram-fixtures-migrated
    statement: |
      Every cram fixture under `tests/cli/` that asserted on
      the `accept` verdict string is updated to `parse-ok`; a
      grep across `tests/cli/` for `"verdict":"accept"` returns
      zero hits.

scope:
  paths:
    - "bin/Mathc.ml"
    - "tests/cli/*.t"
    - "decisions/add-verify-subcommand-2026-10.yaml"
    - "attestations/add-verify-subcommand-2026-10-*.json"
  exclusions:
    - "lib/**"
    - "spec/**"
    - "schemas/**"
    - "axioms/**"
    - "decisions/decision.yaml"

obligations:
  - id: verify-subcommand-shipped
    claim: |
      `mathc verify FILE` is registered; `mathc verify --help`
      exits 0 with usage; `mathc verify decisions/foo.yaml`
      returns a per-obligation JSON object.
    acceptance:
      all:
        - verifier: manual-file-exists-unqualified
          path: bin/Mathc.ml
          needle: do_verify
          result: pass
        - verifier: manual-file-exists-unqualified
          path: bin/Mathc.ml
          needle: '"verify" -> do_verify ()'
          result: pass
        - verifier: mathc verify --help
          result: pass

  - id: validate-verdict-parse-ok
    claim: |
      `mathc validate decisions/foo.yaml` returns
      `verdict: parse-ok` in both text and JSON output.
    acceptance:
      all:
        - verifier: mathc-validate-verdict-is-parse-ok
          result: pass

  - id: cram-fixtures-migrated-to-parse-ok
    claim: |
      A grep across `tests/cli/` for `"verdict":"accept"`
      returns zero hits; a parallel grep for
      `"verdict":"parse-ok"` returns ≥ 14 hits (one per
      modified cram test).
    acceptance:
      all:
        - verifier: manual-file-grep-zero-unqualified
          path: tests/cli/
          needle: '"verdict":"accept"'
          result: pass
        - verifier: manual-file-grep-non-zero-unqualified
          path: tests/cli/
          needle: '"verdict":"parse-ok"'
          min: 14
          result: pass

  - id: no-self-check-regression
    claim: |
      `mathc self-check` on this branch returns the same
      unknown-subject count as at HEAD `plan/adoption-fixes-2026-10`
      and zero NEW unknown subjects attributable to this
      commit.
    acceptance:
      all:
        - verifier: mathc-self-check-no-new-unknowns
          result: pass

counterexample: |
  The counter-position considered and rejected: "the rename
  from `accept` to `parse-ok` is a breaking change for any
  external tool that parses the verdict string." This is
  rejected on three grounds: (a) the v3.4 release notes
  document the rename explicitly; (b) `mathc explain-diagnostic`
  and `mathc` output machinery are the only producers of
  the string and they are updated in the same commit; (c)
  the project's `USAGE.md` is updated to match. A successor
  commit that ships a wrapper for legacy scripts lives
  outside this decision.

  A second counter-position: "`mathc verify` is a new attack
  surface — verifier strings may be attacker-controlled and
  run with the user's privileges." The verify path runs the
  verifier as a subprocess with a stripped environment
  (only `PATH`, `HOME`, `LANG` inherited) and a 60-second
  timeout. The current execution model is **not** sandboxed
  at the OS level (no seccomp / no jail); a follow-up decision
  may add that, but it is out of scope here.


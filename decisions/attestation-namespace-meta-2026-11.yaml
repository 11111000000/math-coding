intent: |
  Codify the rule that plan-decision attestation filenames are
  reserved for plan-decision attestations only. Sub-decisions may
  not share the same filename stem as the plan-decision they
  belong to. The rule lives in a reusable sub-agent prompt
  template (`docs/plans/plan-sub-agent-prompt-2026-11.md`) so
  future plan-doc authors can copy it without rediscovering the
  conflict.

  Why now: a plan-decision with several sub-decisions will
  produce plan-meta attestations under the
  `attestations/plan-<id>-<obligation>.json` filename stem, and
  each sub-decision's own obligations produce attestations under
  `attestations/<sub-decision-id>-<obligation>.json`. When a
  sub-agent reuses the plan-decision's filename stem for its own
  obligations, `mathc packages` and any per-(decision,
  obligation) listing become ambiguous: which obligation belongs
  to which decision? The kernel's id-collision algorithm in
  `lib/attestations/` de-duplicates on first occurrence. The
  ambiguity is correctness-shaped, not just stylistic.

  Boundaries:
    - This commit does NOT change `lib/`, `bin/Mathc.ml`,
      `schemas/`, or `axioms/`. It is documentation-only.
    - This commit does NOT retro-rename existing attestations.
      Re-naming would invalidate SHA-256 ids and require
      re-stamping; that is a separate plan-decision.
    - The codified rule applies prospectively to plan-decisions
      authored after this commit lands.

commitment: |
  After this commit lands, the prompt template
  `docs/plans/plan-sub-agent-prompt-2026-11.md` exists and
  carries the attestation-namespace rule, the three
  sub-section guidance blocks (A. P9 empty-scaffold, C. reorder
  principle, D. atomic commits), the F11-B "deferred-to-followup"
  waiver pointer, and the Conventional-Commits commit-message
  note. Future plan-doc authors who reach for a sub-agent
  prompt template can copy from this file.

counterexample: |
  The strongest argument against codifying this rule:
  "no collision has been observed; codification is premature."
  Rejected on three grounds. (a) The kernel's
  id-collision algorithm in `lib/attestations/` is
  occurrence-order-dependent: it de-duplicates on first
  occurrence without warning, so a silent drop is the failure
  mode, not a hard error. (b) The rule is one sentence; it
  carries no implementation cost and adds zero decisions, so
  the cost of "codify now" is dwarfed by the cost of a
  future agent rediscovering the conflict mid-batch. (c) A
  future plan with a longer batch (≥ 6 sub-decisions) almost
  certainly will reproduce the conflict, because the
  filename-stem shorthand is the natural way to label
  per-obligation evidence. Codification removes the trap
  before it bites, not after.

  A second argument considered: "the kernel should enforce
  namespace uniqueness, not the prompt template." Acknowledged
  as the durable fix. Out of scope here: this commit codifies
  the rule at the documentation layer where the cost of
  enforcement is zero and reversibility is full. A follow-up
  decision (kernel-change-class) can move the rule into
  `lib/attestations/` once the rule has been exercised against
  at least one real plan-doc.


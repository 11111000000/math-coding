intent: |
  Phase 8 of the ux-3 workstream. Land a
  `scripts/hotfix-cve.sh` POSIX-sh wrapper that stamps a
  24h waiver under `decisions/waivers/` for urgent CVE /
  SLA-bound commits. The waiver follows the
  `math-coding/waiver-3.3` schema already understood by
  `lib/waiver.ml`; no kernel change is required.

  Today's path: an urgent CVE merge must land in < 1h,
  but `mathc gate` rejects the tree because the post-hoc
  decision + attestation do not yet exist. The developer
  has no documented escape valve; the existing waiver
  infrastructure (`decisions/waiver-infrastructure-2026-10.yaml@1`)
  requires hand-authoring a YAML that matches
  `schemas/waiver.json`, which is too slow for a CVE
  response.

  After this decision, the developer runs:

    scripts/hotfix-cve.sh CVE-2026-1234

  and the script writes
  `decisions/waivers/hotfix-CVE-2026-1234.yaml` with a
  24h `expires_at`. The waiver satisfies the schema and
  is loaded by `lib/waiver.ml::load` on the next
  `mathc self-check`. The developer MUST follow up with a
  post-hoc `decisions/<id>.yaml` + `attestations/<id>-<obligation>.json`
  pair within the 24h window. Once `expires_at` passes,
  the waiver is no longer effective_at and the next
  `mathc gate` returns Block on this subject.

  Touches (per A3 self-application):
    scripts/hotfix-cve.sh       (new POSIX-sh, 121 LOC)
    tests/cli/install.t         (2 new cram cases: positive
                                  + invalid-id negative)
    USAGE.md                    (§"Hotfix procedure" 15-20
                                  lines)
    OCAML_BEST_PRACTICES.md     (§11.35 "hotfix-cve.sh
                                  waiver pattern" trap entry)

  Boundaries (A3 self-application):
    - lib/waiver.ml, lib/decision.ml, lib/gate.ml
      unchanged. The waiver schema and the gate consult
      step are not touched.
    - The script is a POSIX-sh wrapper around printf +
      mkdir + the `date` command; no OCaml, no Python.
    - The `unverified_obligation: post-hoc-attestation-required`
      is a new obligation-id that the gate treats as
      covered while the waiver is effective_at. The
      obligation-id is namespaced under `post-hoc-` to
      distinguish from regular `obligation-` ids.
    - Per OCAML_BEST_PRACTICES §11.34, the binary
      `ocamlmerlin` (Merlin LSP) and `ocamllsp` (OCaml
      LSP) are correctly named; the hotfix script does
      not introduce new tooling.

axiom_link:

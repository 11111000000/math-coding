  - A1
  - A4

antithesis: |
  The counter-position considered and rejected: "A 24h
  waiver is just an excuse to ship without verification; the
  right answer is to forbid urgent merges until the
  post-hoc decision is ready." The author engaged with
  this position and rejected it on three grounds: (a)
  per spec/algebra-3.2.md §Waivers, waivers are a
  documented escape valve for the same scope
  (unreachable, infrastructure-blocked, or
  time-blocked obligations); a CVE response is a textbook
  time-blocked obligation; (b) per
  `decisions/waiver-infrastructure-2026-10.yaml@1`, the
  kernel already understands the waiver schema; without
  a CLI wrapper the developer has to hand-write a YAML
  matching 8 required fields under SLA pressure; (c) the
  24h expiry is a hard self-imposed ceiling: the waiver
  stops being effective_at when the deadline passes, so
  the post-hoc decision is still enforced, just with a 24h
  grace window.

commitment: |
  Three deliverables:

    D1. `scripts/hotfix-cve.sh <ticket-id>` writes a
        valid waiver at
        `decisions/waivers/hotfix-<ticket-id>.yaml`.
        The waiver passes `mathc validate` (exit 0,
        verdict `accept: kind=waiver`).

    D2. The default waiver window is 24h
        (`--expires-in=24h`). Override via
        `--expires-in=<duration>` accepts GNU date
        syntax (`24h`, `30m`, `7d`) with a BSD
        fallback (`+24H`, `+30M`, `+7D`).

    D3. Invalid ticket-id syntax (shell metacharacters,
        leading-dash, empty) exits 2 with the
        `MC-HOTFIX-INVALID-ID` diagnostic. No file is
        written.

counterexample: |
  "A 24h grace window is too long; CVE response should be
  ≤ 4h." The author considered and rejected because
  per OWASP/SANS CVSS scoring, a CVE patch typically
  requires: reproduction (1h), fix development (4-8h),
  review (1h), CI validation (1h), deploy coordination
  (2h). A 4h window would force the developer to ship
  before the fix is reviewed; a 24h window matches the
  documented CVE SLA for the median CVSS-High patch.

  The gap: if the developer forgets to follow up with the
  post-hoc decision + attestation, the waiver expires
  and the next `mathc gate` returns Block. Closure path:
  the project status board surfaces unexpired
  `decisions/waivers/hotfix-*.yaml` files in the
  `next-actions` report.


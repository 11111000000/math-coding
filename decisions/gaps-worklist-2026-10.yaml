risk:
  declared_triggers:
    - "the worklist's classes are treated as a verdict, and a reader
      forgets that a `declaration` is a PROMISE, not a failure, and
      starts deleting obligations instead of keeping or dating them"
    - "the worklist is used as a substitute for the verdict, it lists
      the gaps, and a reader concludes the repository passes because
      the list is short"
    - "the exact loader makes the command slow enough that people
      stop running it, and the worklist goes stale"
  owner: human:maintainer

counterexample: |
  A worklist is a to-do list, and to-do lists get closed by deleting
  things.

  The risk is real, and it is the reason the tool names an ACTION per
  entry rather than a verdict. A `declaration` is not a failure: it is
  a promise the corpus made and no program keeps. The three honest
  answers are to write the check, to cover the gap with a waiver that
  EXPIRES, or to drop the promise -- and the third one is a deletion,
  which is exactly what the tool's owner must be able to choose
  deliberately. What the tool must not do is decide, and it does not:
  the kernel's authority boundary says it MUST NOT determine whether
  obligations are complete or whether an intent is desirable.

  The second objection is sharper: the worklist says what is open, so
  a reader might take it for the verdict. It is not one. The verdict
  is `mathc self-check`'s, and it is `unknown` while 281 promises rest
  on declarations. The worklist is the map of the way out, not the
  map of where you are.

antithesis: |
  The opposite claim is that the corpus does not need a worklist: the
  right number of open promises is ZERO, and a tool that enumerates
  them gives the debt a shape and the debt a life.

  The claim is right about the zero and wrong about the shape. The
  281 declarations are not a list to be worked through; most of them
  are the corpus's way of saying something that was true once. The
  worklist's value is not that it gives them an order -- it does not
  -- but that it says, per promise, WHICH of the three answers is
  available. A declaration with a live check behind it wants the
  check; a declaration with an owner and a date wants a waiver; a
  declaration with neither wants to be deleted. That distinction is
  invisible in a count and visible in a list.

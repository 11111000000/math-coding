intent: |
  `mathc self-check` says HOW MANY obligations are undecided. It is a
  report about the corpus, and a report about a corpus of 191 rules
  that are 58% unknown is a report nobody can act on: the remedy it
  implies ("attest more of it") is not available for a declaration,
  and it does not say WHICH promise to touch first.

  `mathc gaps` is that list. For every open promise it names the
  decision, the obligation, the CLASS of the promise, its state, and
  what can be done about it. The classes are the kernel's own
  dispatch, not a guess:

  checkable          the kernel can run it here. The gap is about
  EVIDENCE: missing, stale, or failed.
  not-a-check        the kernel does not run it at all: a `manual-`
  declaration, or a scheme with no execution rule. The
  pseudo-commands named after `mathc self-check` subcommands
  that were never commands belong here.
  cannot-be-set-up   it IS a check and it could not be set up: the
  scheme is unknown, the arguments are malformed, or the file
  it names is missing.
  unidentified       the obligation carries no id, so the gate
  never decides it and no verdict can ever mention it.

  The classes are the kernel's OWN (`Executable`, `Not_a_check`,
  `Cannot_be_set_up` -- the classification the sweep's runner
  uses). The runner's dispatch was lifted out of it into
  `classify_verifier` so that the worklist and the sweep call the
  SAME function: two copies of that dispatch is how a corpus ends
  up with two answers to one question.

  MEASURED on this repository, 2026-10-28, against the store of a
  tree two commits behind:

  332 open promises, against a store signed for this tree:
  not-a-check        270   a promise the kernel does not run
  checkable           43   the evidence is missing or stale
  unidentified        11   a promise no gate can name
  cannot-be-set-up     8   a check that could not be set up
  by state: missing 49, unknown 283

  The earlier measurement of 578 was taken against a store two
  commits behind this tree, so 441 of those were stale evidence
  rather than open promises. The number that survives a sweep is
  the one above.

  WHAT THE TOOL DOES NOT DECIDE. It does not say which promises the
  project intends to keep. That is the owner's call, and the corpus's
  own doctrine reserves it: the kernel MUST NOT determine "whether
  obligations are complete" or "whether an intent is desirable"
  (spec/constitution.md §Authority Boundary). The tool's job is to
  make the choice POSSIBLE: every entry carries the action that the
  class admits -- write the check, cover the gap with a dated waiver,
  or drop the promise.

  The evidence state is read by `Gate.obligation_gap`, the same
  function the gate uses, so the worklist cannot disagree with the
  verdict about what is missing. And the corpus is read by the EXACT
  loader (`Memory.load_decisions`), not the line scanner the fast
  commands use: this command makes a claim about every individual
  obligation, and a scanner's mistake would put the wrong promise on
  the list.

commitment: |
  1. `mathc gaps [--format=json|text]` lists every open promise with
  its decision, obligation, class, state and action, and reports the
  corpus's DECLARED promises -- the count of the in-force obligations
  the kernel does not run -- beside the open ones. The declared count
  is a property of the CORPUS and does not move with the store's
  freshness, so it is the number a ratchet can pin.
  2. The four classes are the kernel's own dispatch, and the state
  comes from the same function the gate uses.
  3. The corpus is read by the exact loader, so no individual
  obligation can be misread.
  4. A gap covered by a waiver in force is not an open gap: it is
  reported apart, with the waiver, its issuer and its expiry --
  because the number of those is a measure of how much of the
  corpus rests on time.
  5. The command is read-only and is in the allowlist a verifier may
  invoke.
  6. The worklist's code is `dune fmt` clean: it was written by hand
  and the formatter rewrapped it, and the formatter's output is the
  tree's shape.
  7. The classification was lifted out of the runner by hand and the
  formatter rewrapped it; the formatter's output is the tree's shape.
  8. The CLASS of a promise is the kernel's own classification --
  the one the sweep's runner uses (`classify_verifier`, extracted
  from it so that there is ONE dispatch). Two copies of that
  dispatch is how a corpus ends up with two answers to one question:
  the worklist and the sweep must not disagree about what a check is.

outcomes:
  - id: every-open-promise-is-named
    statement: |

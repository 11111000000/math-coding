---
schema: math-coding/3.2
id: process-principles
revision: 6
state: active
body_sha: "sha256:db1ad1ac0bf4e898fab65401bf3804f6c7c944e5232f469ec0de4b330a5aeffa"
yaml_sha: "sha256:db1ad1ac0bf4e898fab65401bf3804f6c7c944e5232f469ec0de4b330a5aeffa"
intent: |
  The process principles are recorded obligations, not only prose. The
  current instrument `tests/process_principles.ml` has eleven passing
  cases; it structurally checks P1, P2, P5 and P6, exercises the P8
  stub-lint control, and leaves P3, P4 and P7 as explicit human
  declarations.

  2026-10-31, REVISION 6: THE CORPUS MOVED AND THE PROMISES BECAME
  CURRENT. The decision still described a bootstrap-only corpus and
  said that the principles were documentation-only. The live corpus is
  under `decisions/`, the protocol document is `KERNEL_AGENTS.md`, and
  machine cases already exist. This revision keeps P1-P7 as the
  promised set, distinguishes the machine-checked subset from the
  declared subset, and updates P5 to the live cram layout.

  History:
    rev 1: recorded P1-P7 as formal obligations.
    rev 2: reconciled the obligation ids with the parent policy.
    rev 3: added the executable checks and manual declarations.
    rev 4: updated the corpus-walk assumptions.
    rev 5: kept the machine and manual split explicit.
    rev 6 (this revision): re-pointed the corpus and protocol paths,
      described the current eleven-case instrument, and made P5 and P7
      say what the tree does today; the principle set is unchanged.

  Lock down the seven process principles P1-P7 recorded in
  ROADMAP.md §"Process principles (binding on all agents)" as
  formal obligations under the active policy (bootstrap-v3).
  The yaml-block-scalars and priority-drift
  sessions (D1, D2, D3) showed that principle-drift is a real
  failure mode: decisions were retro-fitted after the kernel
  changed, and a fixture appeared in `tests/fixtures/` without a
  paired decision in `decisions/`. Recording the principles as
  obligations makes them visible in PACKAGES.md; the checkable
  subset (P1, P2, P5 and P6) is asserted by the OCaml/Alcotest
  test `tests/process_principles.ml` (registered with
  `dune runtest` via tests/dune); the non-checkable subset
  (P3, P4 and P7) is recorded as manual-acceptance obligations with
  the explicit acknowledgement that they cannot be machine-checked
  (per KERNEL_AGENTS.md §Bootstrap gate).

axiom_link:
  - A0
commitment: |
  Each of P1-P7 is recorded as a separate obligation in this
  decision file. For P1, P2, P5 and P6 the obligation's
  acceptance predicate references the OCaml test
  `tests/process_principles.ml` (one shared test executable;
  each principle is its own Alcotest case). P7 carries an explicit
  human-review marker in the same executable; it is not dressed up as
  a machine assertion. For P3 and P4 the
  obligation carries `evidence: manual-acceptance` and names
  the human maintainer as the reviewer, because the principle
  is a declaration of agent conduct, not a property of the tree.

  The test `tests/process_principles.ml` is registered with
  `dune runtest` via tests/dune. It exits 0 when all checkable
  principles hold and exits 1 with the offending principle name
  on the first violation. The test must be a real check, not a
  self-referential pass (P7).

scope:
  capabilities:
    - process-principles-enforced
  paths:
    - "tests/process_principles.ml"
    - "tests/dune"
    - "PACKAGES.md"
    - "docs/AUDIT-0.0.11.md"
    - "decisions/process-principles.yaml"
  # 2026-10-31: the decision file moved from bootstrap/ to decisions/;
  #   the scope names the path that exists.
  exclusions:
    - "ROADMAP.md"
    - "lib/**"
    - "bin/**"
    - "spec/**"
    - "schemas/**"

outcomes:
  - id: principles-recorded-as-obligations
    statement: |
      Each of P1-P7 is a discrete obligation in
      decisions/process-principles.yaml with its own claim,
      countercase (where applicable), and acceptance predicate.
      The obligations are visible in PACKAGES.md under
      "Bootstrap packages (by file)" once that table is updated.
  - id: checkable-principles-asserted-by-fixture
    statement: |
      tests/process_principles.ml asserts P1, P2, P5,
      and P6 by reading the repository state and exits 1 with the
      principle name on any violation. P7 is represented by an
      explicit human-review marker in the same executable. P3 and P4
      are recorded as manual-acceptance obligations and are NOT
      asserted by the fixture, with the rationale recorded
      alongside each obligation.
  - id: declared-principles-carry-an-owner
    statement: |
      P3, P4 and P7 are explicit declarations: each carries a named
      owner, a review date, and the reason a program cannot decide the
      principle for itself.

counterexample: |
  "These principles are already documented in ROADMAP.md; the
  decision duplicates them without changing behavior." The
  counterargument fails for three reasons:
  (a) ROADMAP.md is a priority queue and process-norms
      document; it is read once on agent entry and not re-read on
      every commit. An obligation in `decisions/` is read by
      every fixture invocation and surfaced in PACKAGES.md, so a
      principle listed there is visible to every new agent.
  (b) The checkable subset (P1, P2, P5, P6) is asserted by
      a fixture that runs on every `./scripts/check.sh`; the
      principle is enforced, not just stated.
  (c) ROADMAP.md names the principles but does not bind them
      to a specific failure mode or remediation. An obligation
      carries a `claim`, a `countercase`, and an `acceptance`
      predicate; the principle becomes actionable rather than
      advisory.

  "P3 (time-box) and P4 (merge order) cannot be enforced, so
  the decision adds obligations the kernel can never check."
  The counterargument fails: per KERNEL_AGENTS.md §"Bootstrap gate",
  process principles that are not machine-checkable are
  acceptable as honest declarations of conduct. The decision
  records them with `evidence: manual-acceptance` and names the
  reviewer. This is not a regression; it is the same honesty
  norm that `decisions/decision.yaml` already applies to its
  own obligations (e.g., `preserve-v2`, `conformance-coverage`).

  "If a fixture must catch every violation, the fixture
  becomes brittle and is skipped." The counterargument fails:
  the fixture is structural (frontmatter fields exist;
  obligation IDs are referenced; cram files are absent;
  scripts/check.sh is executable). None of these checks
  produce false positives on the current tree; all of them
  fail on a hypothetical violation. The fixture is the
  smallest check that catches the P1-P7 failure modes.

assumptions:
  - id: frontmatter-schema-is-stable
    state: assumed
    statement: |
      The required frontmatter fields (schema, id, revision)
      and the required body sections (intent, commitment,
      scope, obligations, risk) are stable across all current
      and future decision files. A future revision of this
      decision may extend the required-fields list (e.g., to
      add `outcomes`), but no current file would fail such an
      extension without an explicit reason.
    owner: human:maintainer
    consequence_if_false: |
      If a future revision adds a required field that current
      files lack, the fixture will report every existing file
      as failing. That is the intended behavior (a forcing
      function), not a regression; the parent task that
      proposes the new field must update every file in the
      same commit.
    review_on:
      - signal: frontmatter-schema-extends
  - id: meta-policy-skipped-by-fixture
    state: assumed
    statement: |
      decisions/decision.yaml (the active policy),
      decisions/obligations.yaml (the cross-reference
      aggregator), and decisions/rationale.md (free-form
      rationale prose) are NOT subject to the P1 schema check.
      They carry their own formats (the active policy has no
      `obligations:` block; the aggregator uses a different
      schema; rationale.md is documentation, not a decision).
      The fixture skips these by name.
    owner: human:maintainer
    consequence_if_false: |
      If a new meta-file appears in decisions/ without a
      schema check exemption, the fixture must be updated to
      either skip the new file or include it in the check.
      This is a maintenance contract, not a bug.
    review_on:
      - signal: new-decision-meta-file-added
  - id: manual-acceptance-is-honest
    state: assumed
    statement: |
      For P3, P4 and P7, manual-acceptance is not a euphemism for
      "skip"; it means the human maintainer (named in
      `risk.owner`) reviews adherence to the principle on
      every change. A waiver mechanism for these violations
      does not exist (and per A3 self-application, would
      itself require a decision under the current rules).
    owner: human:maintainer
    consequence_if_false: |
      If the human maintainer becomes unavailable, the
      principle has no replacement reviewer; the principle
      either lapses (no enforcement, no acceptance) or the
      kernel-side enforcement must be implemented. A future
      revision can extend the fixture to assert structural
      proxies for P3/P4/P7 (e.g., commit timestamps for P3,
      merge-order in commit messages for P4) without
      changing the principle itself.
    review_on:
      - signal: maintainer-rotation

  - id: P8
    state: assumed
    statement: |
      An agent MUST detect when it is in an edit-loop. After 3
      consecutive failed `dune build` attempts with the same
      error class on the same file, the agent MUST stop editing
      that file and switch to probe-driven debugging: write a
      `tests/probe_X.ml` executable that calls the failing
      function with debug prints, run it via `dune build`, and
      use the output to identify whether the issue is a
      structural refactor (deeply nested match) or a 1-3 line
      content fix.
    owner: human:maintainer
    consequence_if_false: |
      The agent spends hours on the same edit cycle, producing
      no progress and risking merge conflicts. A 5+ attempt cycle
      on the same file is a strong signal the approach is wrong.
    evidence: manual-acceptance
    review_on:
      - signal: edit-loop-detected

  - id: P8.5
    state: assumed
    statement: |
      Sub-agent dependencies. A sub-agent whose sub-decision
      declares dependencies on prior sub-decisions MUST NOT
      launch until every declared dependency has landed on the
      integration branch. Check:
        git merge-base --is-ancestor <dep-branch> <integration-branch>
      If the exit code is 1 (NOT ancestor), abort with a
      structural dependency error and ask the orchestrator to
      retry once the dependency has merged.
    owner: human:maintainer
    consequence_if_false: |
      A sub-agent whose declared dependency has not yet merged
      may run against stale integration HEAD, edit against the
      wrong base, and produce work that fails to land. The
      orchestrator then has to retry, doubling wall-clock and
      token-budget cost.
    evidence: manual-acceptance
    review_on:
      - signal: structural-dependency-not-merged

  - id: P9
    state: assumed
    statement: |
      Scaffold + checkpoint cadence. Sub-agents whose
      sub-decision has kernel-touching scope MUST commit an
      empty skeleton (decision YAML only, no kernel changes)
      as the FIRST commit before any kernel edit. This
      guarantees a recoverable scaffold if the sub-agent's
      run is interrupted by Token Plan rate limits. The
      scaffold-commit message format is
        scaffold(<id>): <description>
      The kernel commit(s) follow after the scaffold commit. P9
      closes the F14 finding (sub-agent die-mid-task without
      committed scaffold). Order: scaffold -> kernel ->
      attest (3 commits minimum per kernel-touching
      sub-decision).
    owner: human:maintainer
    consequence_if_false: |
      A sub-agent that dies mid-task after editing the kernel
      but before committing leaves recoverable evidence on
      disk but no checkpoint in git; the orchestrator's rescue
      recipe must guess what work was attempted. With the
      scaffold commit, the orchestrator can inspect the
      difference between scaffold commit and HEAD and recover
      the agent's intent from at least one committed file.
    evidence: manual-acceptance
    review_on:
      - signal: sub-agent-rate-limit-interrupt

obligations:
  - id: p1-decisions-before-kernel-changes
    outcome: principles-recorded-as-obligations
    claim: |
      A change to `lib/*.ml`, `spec/*.md`, `schemas/*.json`,
      or `bin/Mathc.ml` ships with a `decisions/*.yaml` (or
      `.md`) decision under the active policy. The acceptance
      proxy is structural: every non-meta decision file in
      `decisions/` has the required frontmatter fields
      (`schema`, `id`, `revision`) and the required body
      sections (`intent`, `commitment`, `scope`, `obligations`,
      `risk`). A future file added to `decisions/` that
      omits any required field violates P1 and trips the
      fixture.
    acceptance:
      all:
        - verifier: tests/process_principles.ml
  - id: p2-decisions-paired-with-fixtures
    outcome: principles-recorded-as-obligations
    claim: |
      Every obligation in a non-meta decision file references
      a test fixture via `acceptance.all[].verifier`, either
      as a path under `tests/fixtures/*.sh` (file exists), a
      path under `tests/cli/*.t` (dune cram file exists), a
      kernel-test reference (`tests/conformance.ml ...`),
      or an explicit manual-style verifier (e.g., `text-scan-`,
      `cram-fixture-`, `script-runs-and-is-deterministic`,
      `dune test`, `manual-`, `review`, `practice-review`,
      `mathc-`). The check is structural: every obligation
      declares a verifier; the verifier is either present
      (file exists or kernel-test reference is well-formed)
      or is in the manual-style prefix list. An obligation
      with no verifier declaration, or with a verifier
      pointing to a non-existent fixture file, trips the
      OCaml test.
    acceptance:
      all:
        - verifier: tests/process_principles.ml
  - id: p3-time-box-on-detailed-work
    outcome: declared-principles-carry-an-owner
    claim: |
      If a single change exceeds 10 minutes without a passing
      build, the agent switches to WIP commit + decision-record
      + next task. This principle is an honest declaration of
      agent conduct (KERNEL_AGENTS.md §"Bootstrap gate"); the kernel
      cannot measure wall-clock against a single session.
      Acceptance is manual: the human maintainer reviews
      commit messages and the `git log --since=<session-start>`
      sequence on demand.
    evidence: manual-acceptance
    owner: human:maintainer
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: how long the work took is an observation, not a property of a file
    acceptance:
      all:
        - verifier: manual-agent-conduct-review
  - id: p4-merge-order-time-budget-kernel
    outcome: declared-principles-carry-an-owner
    claim: |
      When multiple parallel agents commit, integration
      follows the order: decisions/*.yaml (decisions) ->
      tests/fixtures (additive) -> lib/ pure helpers ->
      bin/Mathc.ml (dispatcher) -> build artifacts. This
      principle is an honest declaration of agent conduct;
      the kernel cannot observe the merge order without
      rewriting git history. Acceptance is manual: the human
      maintainer reviews `git log --graph` and the merge
      pull-request ordering on demand.
    evidence: manual-acceptance
    owner: human:maintainer
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the merge order and the time budget are decided by a person
    acceptance:
      all:
        - verifier: manual-agent-conduct-review
  - id: p5-cram-retired-shell-fixtures-only
    outcome: checkable-principles-asserted-by-fixture
    claim: |
      The old `tests/cram/*.t` directory was retired in `dc78bcd`.
      Live CLI cram tests live in `tests/cli/*.t`; the former
      per-CLI shell-fixture convention in `tests/fixtures/` was also
      retired. The acceptance proxy is structural: `tests/cram/*.t`
      does not exist, while `tests/cli/` carries the live cram
      suite. A future commit that adds `tests/cram/*.t` violates P5
      and trips the fixture.
    acceptance:
      all:
        - verifier: tests/process_principles.ml
  - id: p6-pre-commit-verification
    outcome: checkable-principles-asserted-by-fixture
    claim: |
      Before `git commit`, the agent runs
      `./scripts/dev verify`, which in turn runs
      `scripts/check.sh`. The acceptance proxy is
      structural: `scripts/check.sh` exists, is executable,
      and is the aggregator the fixture itself uses. A
      future commit that removes the file or strips the
      executable bit violates P6 and trips the fixture.
    acceptance:
      all:
        - verifier: tests/process_principles.ml
  - id: p7-honesty-in-fixture-assertions
    outcome: declared-principles-carry-an-owner
    claim: |
      A passing fixture must assert SOMETHING meaningful.
      Self-referential tautologies (e.g., "the fixture exits
      0" asserting on its own exit code, or matching a
      captured failure output verbatim) violate the principle.
      The acceptance proxy for P7 is an explicit human-review marker
      in `tests/process_principles.ml`; the other shell fixtures it
      does not subsume are checked independently by `./scripts/check.sh`.
      P7 is not dressed up as a machine assertion: whether a fixture
      asserts something meaningful is a review question. A future
      revision that weakens the marker would itself require a new
      decision (a forbidden self-amendment per A3 self-application).
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: whether a fixture is meaningful is a human judgment, not a predicate the kernel can infer
    acceptance:
      all:
        - verifier: tests/process_principles.ml

reversal:
  - signal: kernel-can-enforce-p3-p4
    action: |
      supersede-with-kernel-side-p3-p4-checks (e.g., commit
      timestamps for P3, merge-order scan for P4) without
      changing the principle itself.
  - signal: frontmatter-schema-extends
    action: |
      update-tests/process_principles.ml to require
      the new field, and update every decision file in the
      same release.

risk:
  declared_triggers:
    - process-principle-drift
    - manual-acceptance-without-reviewer
  owner: human:maintainer

relations:
  addresses:
    - bootstrap-v3
    - ./ROADMAP.md#process-principles-binding-on-all-agents
  supersedes: []
  superseded_by: []

counterexample: |
  The strongest objection is that the corpus is now UNMEASURED, and
  that this decision trades a real capability for a real number.

  Three things were visible before this change and are not visible
  now:

  (a) A CEILING could grow. `tests/fixtures/*.sh` pins its debt
      ceilings, and a ratchet compared every `CEILING_*` against the
      base commit and failed when one grew. That ratchet is gone. A
      ceiling in the corpus may now be raised, silently, by a diff that
      changes a number and nothing else — which is the exact failure
      the ratchet was written to catch, measured on this corpus on
      2026-10-23: seven raises in three days, six of them
      unrecorded.

  (b) A CEILING could stop being a ceiling. A declared ceiling whose
      comparison was deleted while its number stood used to be
      detected mechanically, because the checker required a ceiling to
      be COMPARED and not merely declared. On 2026-10-23 two such
      comparisons were deleted, both numbers kept, and the fixture
      stayed GREEN for four days because the debt happened to be under
      the ceiling. Nothing in the corpus now distinguishes a ceiling
      that is bound from a ceiling that is only written down.

  (c) A SCOPE PATH could name nothing. A path that matches no
      tracked file is not a weaker claim, it is no claim: it
      contributes nothing to the materials digest and says nothing
      about what the obligation depends on. The corpus had 162 such
      entries across 81 decisions; they were pruned, and the check
      that kept them pruned is gone. The next one will stay.

  That is the loss, and it is real. What makes it defensible is that
  none of the three is a property of the KERNEL: each of them is a
  property of the corpus's bookkeeping, and the corpus's bookkeeping
  is what this decision found to be a copy of itself. A measurement
  of a snapshot, kept in the tree, is a snapshot.

antithesis: |
  The counter-position this decision rejects is the obvious one:
  keep the census, keep the mirror, and pay for both.

  The case for keeping them is not silly. The census is what made
  the corpus's debt visible; the mirror is what made a corpus-wide
  store possible at all, given that the live store is untracked
  evidence; and the ceiling ratchet is the one mechanism that caught
  a class of regression the corpus's other checks do not cover. A
  reader who believes the corpus is better off with a 1124-line
  report generator and a 3.6 MB mirror than without them is making a
  defensible choice about a different trade.

  It is rejected on three measurements, not on taste.

  First, the census and the mirror measured the SAME thing twice, and
  the copy was always behind. The mirror's own coverage check said 91
  required pairs had no fixture file; the enumeration grew to 978
  required pairs while the mirror stayed at 887 files. A committed
  census of a corpus that is still moving is a snapshot, and the
  corpus was still moving: 97.9% of the last 60 commits' file touches
  were under the store the census counted.

  Second, the corpus's file touches are the cost. 10610 of 10842
  touches in 60 commits went to `attestations/`. A corpus that spends
  almost all its attention re-signing evidence about a tree that has
  since moved has less attention left for the kernel. The gate is
  1150 lines and it decides whether a change may land; the census is
  1124 lines and it reports that a number is large.

  Third, the questions the census answered are now answered by a
  program that is not a census. `mathc gate --scope` asks which
  decisions a change touches and evaluates them; `mathc gate
  --execute` runs their verifiers against the candidate tree instead
  of reading a store about an older one. A census of unmet
  obligations is a job you run, and a report you keep, and neither
  belongs in the repository that is being measured.

  What this decision does NOT claim: that the corpus is now tidy, or
  that the ceilings are now honest, or that the three losses above
  are compensated. It claims only that the meta-layer was measuring
  the corpus's bookkeeping, that the bookkeeping was a copy of the
  corpus, and that the copy cost more than the measurement was worth.

outcomes:
  - id: the-shadow-corpus-is-gone
    statement: |
      The committed mirror of the live store is not in the tree, and
      the corpus's attention is no longer spent keeping it in step.
  - id: the-census-is-on-demand
    statement: |
      A corpus-wide census is a CI artefact produced on demand, not a
      script and a report kept in the tree. The gate answers the same
      question live, per change, over the decisions that change
      touches.
  - id: the-losses-are-named
    statement: |
      The three things that are no longer detected — a ceiling that
      grows, a ceiling that stops being a ceiling, a scope path that
      names nothing — are named in the counterexample, so that a
      reader knows what is no longer watched.


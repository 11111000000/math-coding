obligations:
  - id: the-shadow-corpus-and-the-meta-layer-are-gone
    claim: |
      Every path in this decision's `removed:` list is absent from the
      tree, and no tracked file names any of them except this
      decision. The guard reads the list from this file, so the list
      cannot drift away from the check.
    acceptance:
      all:
        - verifier: tests/fixtures/no-shadow-corpus.sh
  - id: the-positive-control-still-proves-the-property
    claim: |
      `tests/cli/self-check-pass.t` still proves what it proved when
      the mirror was the store it read: a populated store reports
      `pass` for the subjects it covers, `unknown` for the rest, the
      aggregate refuses to certify the uncovered remainder, and the
      verdict vocabulary has four values and not three. It now reads
      ten hand-written files instead of 887 generated ones.
    acceptance:
      all:
        - verifier: tests/cli/self-check-pass.t
  - id: the-negative-controls-remain
    claim: |
      The negative controls of the kernel are still in the tree: the
      fail store, the unknown store and the waiver-verdict store. The
      corpus-debt meta-layer was not one of them, and removing it did
      not take them with it.
    acceptance:
      all:
        - verifier: tests/cli/self-check-fail.t
        - verifier: tests/cli/self-check-unknown.t
  - id: this-decision-validates
    claim: |
      `mathc validate decisions/corpus-meta-layer-2026-10.yaml` exits
      0 with verdict `parse-ok`, and `tests/process_principles.exe`
      passes P1 (frontmatter plus the five body sections) and P2
      (every obligation carries a verifier that exists or is a real
      command).
    acceptance:
      all:
        - verifier: mathc validate decisions/corpus-meta-layer-2026-10.yaml
        - verifier: tests/process_principles.exe

risk:
  owner: human:maintainer
  declared_triggers:
    - a-ceiling-grows-without-a-recorded-reason
    - a-ceiling-is-declared-and-never-compared
    - a-scope-path-names-nothing
    - the-mirror-is-reintroduced-because-someone-wants-a-full-corpus-store
  a-ceiling-grows-without-a-recorded-reason: |
    Expected. The ratchet that caught it is gone. A ceiling is now
    moved by a diff that changes a number, and a reader of the diff
    is the only mechanism left. The corpus's own convention — a
    `ceiling-raise:` comment next to the number — survives as prose
    and is not checked.
  a-ceiling-is-declared-and-never-compared: |
    Expected, and the more dangerous of the two: the number stays,
    the comparison goes, and the diff shows a number that did not
    move. The three legacy ceilings are still compared, by
    `tests/fixtures/legacy-attestation-debt.sh`; no other ceiling is.
  a-scope-path-names-nothing: |
    Expected. A scope path that matches no tracked file contributes
    nothing to the materials digest, so it is harmless until the day
    somebody creates a file with that name — and then it silently
    invalidates the attestations of every decision that names it.
  the-mirror-is-reintroduced-because-someone-wants-a-full-corpus-store: |
    Then the corpus has learned nothing from this decision, and the
    guard will say so: `tests/fixtures/no-shadow-corpus.sh` fails the
    day any path in the `removed:` list exists again, or the day any
    file other than this decision names one.

reversal:
  - signal: |
      a full-corpus store is needed again, and the answer is a mirror
    condition: |
      A caller needs a committed store covering every obligation, and
      the answer being considered is to bring the mirror back.
    action: |
      Do NOT restore the mirror. The gate is the answer: `mathc gate
      --execute` runs the verifiers against the candidate tree, which
      is what a committed mirror can never be. Re-issue this
      decision with the new caller named.
  - signal: |
      the corpus's debt is no longer visible
    condition: |
      Nobody can say which obligations are unmet without running a
      census by hand, and the ceiling numbers have drifted.
    action: |
      Re-issue this decision with the audit as a CI job that runs on
      demand and publishes its report as an artefact, not as a
      committed file. The corpus does not need to CARRY the census to
      be able to RUN it.


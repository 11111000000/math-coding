intent: |
  Remove the meta-layer that measured the corpus's tidiness and kept
  the corpus's tidiness in step, and pay the difference honestly.

  The corpus carries a second copy of itself. `attestations/` is the
  live evidence store: one file per (decision_id, obligation_id) pair,
  signed, and about a tree that has since moved. `tests/fixtures/
  self-check-pass/attestations/` was a MIRROR of that store, committed
  to the repository, 887 files and 3.6 MB, regenerated by a script
  whenever the corpus changed, and pulled into every cram build as a
  dune `source_tree`. The mirror existed so that a corpus-wide store
  would exist at all: the live store is untracked evidence, so without
  the mirror there was no committed full-corpus store for a fixture to
  point at.

  The mirror's own coverage check reported, on 2026-10-27, that 91
  required pairs had no fixture file. The enumeration is 985 pairs
  today (978 required, after the 7 `portable-linux-musl` pairs the
  waiver exempts); the mirror held 887 files, one of them exempt, so
  it covered 886 of 978 — 92 missing, one more than the check
  reported when it last ran. The gap GROWS with the corpus and never
  shrinks on its own: every decision added to the corpus widens it.

  The mirror cost 3.6 MB in every cram build, and it cost 97.9% of
  the corpus's attention. Over the last 60 commits, 10610 of 10842
  file touches (97.9%) are under `attestations/`. The corpus is
  spending its file touches on evidence, not on the kernel.

  The nine scripts that came with the mirror are a census, not a
  check. Between them they are 3377 lines; `report-unmet-obligations.py`
  alone is 1124, which is 97.7% of the size of `lib/gate.ml` (1150
  lines) — the entire merge gate, whose job is to decide whether a
  change may land. Not one line of them can find a bug in the kernel.
  Their job was to REPORT how tidy the corpus is, which is a thing a
  reader can also do, once, on demand.

  The merge gate is where the same corpus-wide question is already
  answered, better. Measured on this branch at 83b433a1:

      mathc gate HEAD~1 HEAD            956 obligations   838 gaps   block
      mathc gate --scope HEAD~1 HEAD    477 obligations   468 gaps   unknown

  The same commit, half the corpus, and a verdict that no longer
  claims to have checked the half it did not look at. The gate
  evaluates the decisions whose scope covers what changed, and
  `mathc gate --execute` runs their verifiers against the candidate
  tree instead of reading a store about an older one. A census of the
  corpus is a thing you ASK the gate for, not a thing the repository
  carries.

commitment: |
  After this decision closes:

  1. The thirteen paths in `removed:` are not in the tree, and no
     tracked file names any of them except this decision. The guard is
     `tests/fixtures/no-shadow-corpus.sh`, which reads the list from
     this decision and checks both halves — the paths are gone, and
     nothing else refers to them.

  2. The cram build no longer carries the mirror. `tests/cli/dune`
     names no `source_tree` under `tests/fixtures/self-check-pass/`,
     so 3.6 MB of committed evidence stops being copied into every
     cram build.

  3. The property the mirror existed to prove is proved by ten files.
     `tests/cli/self-check-pass.t` reads the same hand-written store
     that `tests/cli/gate-pass.t` gates against, and still asserts
     what it asserted: a populated store reports `pass` for the
     subjects it covers, `unknown` for the rest, the aggregate
     refuses to certify the uncovered remainder, and the verdict
     vocabulary has four values and not three.

  4. The negative controls are untouched. `tests/fixtures/
     self-check-fail/`, `tests/fixtures/self-check-unknown/`,
     `tests/fixtures/self-check-waiver-verdict/` and the gate's three
     stores stay; the negative controls of the kernel are quality,
     not ceremony, and the corpus-debt meta-layer was not one of
     them.

  5. The decisions that named a removed script are fixed, not left
     dangling. `ceiling-monotonic-2026-10`, `dead-scope-paths-2026-10`,
     `scope-invalidation-breadth-2026-10` and
     `self-check-fixture-coverage-honest-2026-10` are superseded by
     this decision; `audit-0.0.21-fixes`, `decision-resolution-2026-10`,
     `decision-required-attestations-2026-10`, `exit-code-symmetry-2026-10`,
     `failing-verifier-is-named-2026-10`,
     `mathc-self-check-subcommand`, `unmet-obligations-inventory-2026-10`,
     `verifier-honesty-migration-2026-10` and
     `verify-path-forms-and-signed-attestations-2026-10` name no
     removed path any more.


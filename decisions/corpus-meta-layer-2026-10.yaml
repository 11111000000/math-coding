# The paths this decision removed, 2026-10-28. The fixture that guards
# the removal reads this list, so the list lives in ONE place and the
# guard does not have to repeat the names.
removed:
  - "tests/fixtures/self-check-pass"
  - "scripts/regenerate-self-check-fixture.sh"
  - "scripts/check-self-check-fixture-coverage.sh"
  - "scripts/check-regenerate-preserves-live-store.sh"
  - "scripts/report-unmet-obligations.py"
  - "scripts/prune-dead-scope-paths.py"
  - "scripts/migrate-verifiers.py"
  - "scripts/classify-failed-verifiers.py"

intent: |
  Record the structural deficit that prevents
  `decisions/audit-0.0.21-fixes.yaml` obligation
  `self-check-verdict-is-pass` from being satisfied at HEAD, and
  document the named exception that the decision's own outcome
  statement already contemplates (`unknown_count == waived_count`).

  The deficit:
    - `mathc self-check` on a clean tree currently returns `verdict:unknown`
      with 30 pass + 2 unknown subjects.
    - The two unknown subjects are `portable-linux-musl` (state:retired,
      reversal signal `alpine-ci-build-fails` fired after CI runs
      #81/#83/#84/#85 broke on the Alpine musl container) and
      `audit-0.0.21-fixes` itself (whose `self-check-verdict-is-pass`
      obligation is structurally unsatisfiable while any other subject
      contributes to `unknown`).
    - `audit-0.0.21-fixes` has 9 obligations; 8 are attestable as
      satisfied at HEAD (this PR adds the 8 attestations), and 1
      (`self-check-verdict-is-pass`) cannot be truthfully attested as
      pass while `portable-linux-musl` is unknown.
    - An `inconclusive` attestation is added for that obligation
      (see `attestations/audit-0.0.21-fixes-self-check-verdict-is-pass.json`).

  Why a waiver file (not a rev-bump of audit-0.0.21-fixes):
    - The original decision's outcome statement
      (`decisions/audit-0.0.21-fixes.yaml:96-101`) already permits
      `unknown_count == waived_count` when waivers are issued for
      retired subjects. This decision is therefore a structural
      amendment, not a content amendment.
    - Per `constitution.md §Waivers`, a waiver MUST identify
      authority, rationale, scope, issue time, expiry, and
      recovery/follow-up action. This file provides all six.
    - Per `constitution.md §Waivers`: a waiver "MAY permit a gate only
      when the active policy marks that gap class waivable at that
      gate". The active policy `bootstrap-v3@2` (rev 2) does not yet
      explicitly mark retired-subject unknowns as waivable in the gate
      path. This is a known deferred item; see `new_assumptions` below.

  Kernel waiver infrastructure status:
    - `lib/gate.ml` (lines 41, 67) declares a `Open_with_waiver`
      verdict variant but the aggregate function does not produce it
      (gap kinds remain `MissingEvidence` / `StaleEvidence` /
      `FailedEvidence` / `Unknown`).
    - `lib/packages.ml:53-58` notes "v1 of the module does not yet
      consult waivers; that is a v3.0.0.30 task once `lib/waiver.ml`
      lands (Tier-3 close-out per ROADMAP)".
    - Until `lib/waiver.ml` lands and `lib/gate.ml:aggregate` consults
      it, the kernel-level verdict for `audit-0.0.21-fixes` stays
      `unknown` because of the 1 inconclusive / missing attestation.


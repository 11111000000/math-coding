counterexample: |
  "Issuing an `inconclusive` attestation with a `reason` field
  circumvents the gate by signalling 'not pass' but still letting the
  obligation count as attested, which is dishonest."

  Counterargument: the attestation schema (`schemas/attestation.json`)
  does not require a `reason` field, but it permits one. The
  attestation result is `inconclusive`, which `lib/gate.ml:175-185`
  maps to a `Unknown` gap kind — the same gap kind produced by a
  missing attestation. The kernel verdict for `audit-0.0.21-fixes`
  therefore stays `unknown` until `lib/waiver.ml` lands. The
  attestation is a human-readable record of the structural cause;
  it does not flip any gate to pass.

  "The decision's outcome statement permits `unknown_count ==
  waived_count` but the active policy does not formally mark retired
  subjects as waivable. Issuing this waiver anyway is overreach."

  Counterargument: this waiver does not promote `passive` to
  `pass`. It records the structural cause and adds an `inconclusive`
  attestation (which the gate treats the same as missing). When
  `lib/waiver.ml` lands, the active policy will be amended to mark
  retired-subject unknowns as waivable; this waiver file is the
  pre-existing record that justifies that future amendment.

  "Why not bump `audit-0.0.21-fixes` to remove the
  `self-check-verdict-is-pass` obligation entirely?"

  Counterargument: the obligation is the master criterion of the
  integrity-fixes cycle. Removing it would defeat the decision's
  purpose. The honest path is to record why the criterion cannot be
  satisfied today and let the kernel waiver infrastructure (when it
  lands) close the loop structurally.


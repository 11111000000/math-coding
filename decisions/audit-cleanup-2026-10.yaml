counterexample: |
  Adding `mode: light` to `considered-mode-migration-2026-10.yaml`
  is a one-line change to a retired decision. Strongest objection:
  silently weakening the dialectical-slot contract for retired
  decisions. Mitigation: the decision is `state: retired`
  (a historical record, not active guidance); the spec at
  `spec/algebra-3.2.md` §11 only requires counterexample for
  `mode >= standard` in `state: active` decisions. Adding
  `mode: light` to a retired file preserves the contract for
  active decisions; the dialectical-slot content remains in
  the `commitment` block (line 24-27 of the YAML).


intent: |
  Phase 6 of the ux-3 workstream. Land the activation
  surface for `mathc init --with-ci-workflow`: the flag
  copies `templates/ci.yml` (shipped at this commit) into
  `<root>/.github/workflows/ci.yml` of the adopter repo.
  After this decision, `mathc init . --with-ci-workflow`
  produces a project that is wired end-to-end: decisions/,
  decisions/decision.yaml, the pre-commit hook (unless
  --no-install), AND a workflow that runs `mathc
  self-check` on every push.

  The flag is OFF by default (matches the v1.0.0 init
  contract: nothing surprising gets written to disk
  without an explicit flag). The maintainer who passes
  --with-ci-workflow is opting into one extra write; the
  print_summary at the end of init surfaces the wire.

  Today (without this slice) the maintainer has to copy
  `templates/ci.yml` to `.github/workflows/ci.yml` by
  hand after `mathc init`. That is a manual step that
  first-time adopters routinely forget; the merged result
  is a repo that has decisions/ but no CI gate.

  Touches (per A3 self-application):
    lib/init/init.ml                  (options record +
                                       --with-ci-workflow
                                       parsing +
                                       install_ci_workflow)
    bin/Mathc.ml                      (do_init: parse
                                       --with-ci-workflow
                                       + pass to Init.run +
                                       print_usage block)
    tests/cli/init.t                  (2 cram cases: with
                                       and without the flag)
    decisions/ux-3-init-copies-ci-workflow-2026-10.yaml
                                      (rev 1 -> rev 2: state
                                       deferred -> active)
    decisions/ux-3-init-with-ci-workflow-2026-10.yaml
                                      (this file)

  Boundaries (A3 self-application):
  - `lib/init/init.ml` is the only sub-library touched.
  - `bin/Mathc.ml` is touched only to add the
    --with-ci-workflow arg + the Init.options field
    + the print_usage line. No other subcommand is
    changed.
  - `lib/decision.ml`, `lib/canonical.ml`,
    `lib/codec.ml`, `lib/schema.ml`, `lib/waiver.ml`
    are unchanged (kernel not touched).
  - `lib/git/`, `lib/gate/`, `lib/attestations/`,
    `lib/junit/`, `lib/mcp/`, `lib/risk/`,
    `lib/new_decision/`, `lib/find/`, `lib/graph/`,
    `lib/import_adr/`, `lib/render.ml`, `lib/check/`
    are unchanged.
  - `spec/`, `schemas/`, `axioms/` are NOT touched.
  - `templates/ci.yml` content is unchanged; this slice
    only adds the wiring.

axiom_link:
  - A0
  - A4

antithesis: |
  The counter-position considered and rejected: "Adopters
  can copy the workflow by hand; `mathc init` should not
  install blueprints from outside the four canonical
  directories (decisions/, attestations/, .githooks/).
  Adding CI to init breaks the principle of init = 4 seed
  files." The author engaged with this position and
  rejected it on four grounds: (a) the principle is not
  four directories; it is "the minimum to pass `mathc
  self-check`"; a project without CI does not pass
  self-check on every push, only locally; (b) per axiom
  A4 (Care), every commitment must have a path to
  observation; copying the workflow by hand is the
  absence of a path; (c) the cost of copying is ~30
  lines of YAML; the cost of forgetting is a repo that
  passes local self-check but fails CI; (d) `--no-install`
  already covers the maintainer's preference for skipping
  the pre-commit hook; a separate `--with-ci-workflow`
  flag gives the same opt-in/opt-out shape for the CI
  workflow.

commitment: |
  Two deliverables:

    D1. `mathc init [PATH] --with-ci-workflow` (default
        `--no-install` retained) walks up from the
        binary's directory to find `templates/ci.yml`
        (same walk as `find_source_skill`); when the
        source is found, copies it byte-for-byte to
        `<PATH>/.github/workflows/ci.yml`, creating
        parent directories as needed. Skips when the
        destination already exists (one-line note to
        stdout). Skips when the source is not found
        (release-binary case; same split as
        `--agent opencode`).

    D2. `mathc init [PATH]` (default, no flag) does NOT
        write to `.github/`. The flag is opt-in: a
        pre-init adopter with an existing CI workflow
        is not silently overwritten. The print_summary
        surfaces "ci workflow: installed at
        .github/workflows/ci.yml" only when the flag is
        set.

  Implementation note: the source template is resolved
  relative to `Sys.executable_name` (same walk as
  `find_source_skill`). For an in-source build, the
  source is at `<repo>/templates/ci.yml` (3 levels up
  from `_build/default/bin/mathc.exe`). For a release
  binary, the source is NOT bundled with the binary;
  the user copies the template by hand or by re-running
  `mathc init` from a source-build binary. This is the
  same split as `init --agent opencode` per
  `ux-3-init-release-binary-noop-skill-2026-10@1`.

counterexample: |
  "Use a --profile=service|library flag. Profiles are
  more flexible." Rejected: profiles multiply the surface
  area; a single boolean flag is bounded to one feature
  (CI workflow). Library vs service is a policy
  distinction, not a CLI surface distinction; the kernel
  already supports per-directory `mathc init`. Future
  flags that need to bundle multiple surfaces can revisit
  the profile idea. "Re-use --no-install (the existing
  flag) to mean both no-hook and no-ci-workflow."
  Rejected: --no-install is the user's explicit "do NOT
  touch my git config" signal; --with-ci-workflow is the
  positive counterpart. Mixing them loses information at
  the call site.


risk:
  declared_triggers:
    - "the debt grows and the ratchet is not run, the audit step
      reports green and the corpus rots in silence. The fixture is
      run by the audit step itself, not by a step that can be
      skipped"
    - "a decisive failure stops being decisive, and if the verdict
      `fail` is ever folded into `unknown`, the red case disappears
      and the step is green for a broken promise"
    - "the pin is raised to make the build green, and the raise is
      visible in the fixture's header, and the convention in this
      repository is that a raise is recorded with its reason"
  owner: human:maintainer

counterexample: |
  "Making the audit non-blocking is how a project decides its debt
  does not matter, and the next thing to happen is a promise nobody
  keeps."

  The objection is the right one to fear, and the answer is in the
  shape of the step rather than in its colour. A DECISIVE FAILURE is
  still red: if the corpus contains a promise that the evidence
  contradicts, the build stops. What stops being red is the `unknown`
  -- a promise with no evidence, which is a fact about the corpus's
  history and not about the change being pushed. And the debt is not
  merely tolerated: it is PINNED, and the pin fails the build when it
  rises. A project that lets its debt grow cannot get a green build
  after this change; it can only get a green build by lowering the
  number.

  The second half of the objection is about the alternative: keeping
  the step red does not make anyone discharge a promise. It makes
  everyone stop reading the step.

antithesis: |
  The opposite claim is that the corpus-wide check IS the merge gate
  -- that a repository whose policy is not covered by evidence has no
  business merging anything, because the evidence is what makes the
  policy mean anything.

  The claim is a real position, and the project held it for months:
  every push was red, the reason was always the same, and the
  consequence was that the red step taught nobody anything. A gate
  that says the same thing on every push is not a gate, it is a
  background colour.

  What the claim is right about is that the evidence has to come from
  somewhere. It comes from the scoped gate, which runs the change's
  own verifiers against the candidate tree, and from the sweep, which
  signs what it observed. The corpus-wide audit remains as the
  statement about the whole, and the ratchet makes it a claim with
  teeth: the whole may get better, and it may not get worse.

axiom_link:
  - A0
  - A1

intent: |
  THE CI STEP THAT ANSWERED THE WRONG QUESTION WAS RED ON EVERY PUSH
  FOR WEEKS, AND NOBODY COULD MERGE BECAUSE OF IT.

  `mathc self-check` asks: how much of the corpus is covered by
  evidence observed at this commit? That is an AUDIT of the corpus.
  The merge gate asks a different question: does THIS change break
  the commitments it claims to implement? The project already
  answered that -- `decisions/gate-by-diff-2026-10.yaml` replaced the
  corpus-wide gate with a scoped one, because a gate that answers the
  wrong question makes every change red for the same unrelated
  reason.

  The CI kept asking the old question anyway. The step ran the
  corpus-wide self-check and took its exit code as the step's status:
  exit 3 (`unknown`) was a red step. The corpus had 112 undecided
  subjects and every push was blocked by debt that no push had
  created.

  This decision gives the step its proper shape:

    exit 0  pass | open-with-waiver   green
    exit 1  fail                      RED -- a decisive failure is a
                                        defect in the code or in a
                                        promise, and it blocks
    exit 3  unknown                   green, and the number is PINNED

  The pin is the ratchet:
  `tests/fixtures/self-check-debt-ceiling.sh` measures the number of
  undecided subjects and fails when it RISES. The number is the truth
  as of the day it was written (112), and it may only fall: a promise
  the corpus discharges lowers the truth, and a lower truth is a pin
  someone has to lower by hand -- which is the point. The debt is
  paid down in public or not at all.

  The report is uploaded as an artefact in every run, so the corpus's
  state is visible even in the green ones. A red step is a signal; a
  number nobody sees is not.

commitment: |
  1. The CI step `mathc self-check` is an audit: a decisive failure
     (exit 1) is red, and the corpus's debt (exit 3) is measured, not
     blocked.
  2. The debt is pinned by
     `tests/fixtures/self-check-debt-ceiling.sh`, and the pin may
     only fall. The ratchet runs in the audit step, against the same
     report the step prints.
  3. The merge gate remains `mathc gate` over the pushed diff
     (`decisions/gate-by-diff-2026-10.yaml`), and it is the step that
     blocks a merge.
  4. The self-check's report is uploaded as an artefact in every run.

outcomes:
  - id: a-push-is-blocked-by-its-own-change
    statement: |
      A push that breaks nothing it claims is not blocked by the
      corpus's debt; a push that breaks what it claims is blocked by
      the scoped gate.
  - id: the-debt-may-not-grow
    statement: |
      The number of undecided subjects is pinned and fails the build
      when it rises.
  - id: the-corpus-is-visible
    statement: |
      Every CI run carries the corpus's report as an artefact.

scope:

  The archive's active count did not move because every record that
  entered it says `state: retired`. The ceilings in the census
  fixture are unchanged here; the orchestrator lowers them when the
  branch is merged.

commitment: |
  1. A decision moves when nothing DEPENDS on it. An ID mention is
     not a dependency when the corpus resolves IDs across the live
     tree and the archive.
  2. Before every move, path pointers are retargeted to the archive.
     Historical prose and ID-only mentions are not rewritten merely
     to contain the word "archive".
  3. A machine-readable fixture that only needs a historical YAML
     shape may follow the archived path. A fixture that needs a
     decision to remain in the live corpus keeps it there.
  4. Normative text is not edited under this tranche. A candidate
     named by `spec/**` or `axioms/**` stays live until an A3
     transition changes the normative pointer.
  5. Every moved file says `state: retired`, carries a one-line
     archive reason, is rehashed, and validates as `parse-ok` from
     its archived path.
  6. This is revision 2 of the same tranche, not a new tranche. It
     changes no ceiling, threshold, kernel semantics, or normative
     text.

axiom_link:
  - A0
  - A4

counterexample: |
  The strongest objection against moving a file named only by prose is
  navigation rather than dependency: "указатель в changelog — не
  зависимость, но читатель идёт по нему и не находит файла: тихая
  потеря".

  The objection is correct about the reader and does not establish a
  dependency. A dependency is a machine or live contract that needs
  the decision in the active corpus. A historical story remains true
  after the file moves, but a path embedded in that story can still
  become a broken navigation affordance. Those are two different
  claims, and this revision does not collapse them into one.

  The response is therefore neither "every mention blocks the move"
  nor "every mention is harmless". Explicit pointers to a CURRENT
  file were corrected in this tranche, while CHANGELOG.md and
  ROADMAP.md retain their historical coordinates. The residual
  navigation cost of those historical paths is real and is declared
  here rather than pretended away. Fixing the whole narrative-link
  policy is a separate design problem; using it to keep completed
  records in the live corpus would confuse history with rule.

  A second objection is arithmetic: eleven files left and this
  decision remained live, so the corpus shrank by ten, not eleven.
  True. The corpus count measures decision files; the archive count
  measures archived files. The eleven moves are visible in both
  directions, and the tranche decision is itself the live record of
  the operation. A larger corpus is not evidence that the archive is
  empty; it is evidence that the accounting includes the account.

antithesis: |
  The opposite position is that every path mention is a dependency and
  every historical record must therefore stay live until all prose is
  rewritten. That position preserves navigability but confuses a
  record with a rule: the gate would keep re-reading completed work,
  and the corpus would remain large because history is easier to keep
  than to classify.

  The position this revision rejects is not the desire for navigable
  references; it is the inference that navigability can only be bought
  by keeping files active. The archive and the ID resolver give a
  better route: the record leaves the rule set, remains addressable,
  and explicit current-file pointers can name its archived path.

assumptions:
  - id: ids-resolve-across-live-and-archive
    state: assumed
    owner: human:maintainer
    statement: |
      The corpus's relation-target and census instruments resolve
      decision IDs across both the live tree and archive/decisions.
      An ID-only mention therefore remains resolvable after a move.
    consequence_if_false: |
      If the instruments stopped reading the archive, ID-only
      relations would become dangling and this criterion would have
      to be re-evaluated tranche by tranche.
    review_on:
      - signal: the-relation-lint-stops-reading-the-archive

  - id: archive-is-not-walked-by-the-gate
    state: assumed
    owner: human:maintainer
    statement: |
      The live gate walks decisions/ and excludes retired and
      superseded states. A retired record in archive/decisions/ does
      not contribute an open obligation.
    consequence_if_false: |
      If the gate began walking the archive, moving a file could hide
      an obligation instead of closing the record, and the tranche
      would need a different retirement protocol.
    review_on:
      - signal: the-gate-walks-the-archive


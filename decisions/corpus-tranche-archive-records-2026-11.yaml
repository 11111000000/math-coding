intent: |
  Revision 2 continues the same archive tranche T2.1 whose first
  pass was already merged into main. The first pass used the brief's
  stricter wording -- "if a file is mentioned, do not move it" -- and
  moved only `kernel-format-2026-10`. This revision corrects the
  criterion to the plan's principle 4: a record moves when NOTHING in
  the tree DEPENDS on it.

  A mention is not a dependency. The distinctions are now explicit:

    1. An ID mention without a path resolves against both the live
       corpus and the archive. It remains true after the move and is
       left alone.
    2. A path pointer to a file that will move must be retargeted to
       `archive/decisions/<file>.yaml`, or reworded when the prose is
       about a current file rather than a path.
    3. A historical story in CHANGELOG.md or ROADMAP.md stays true
       wherever the file lives; it is not a live dependency.
    4. A machine that reads a decision is a dependency only when it
       needs the decision to remain in the LIVE corpus. A parser or
       regression fixture that pins a historical YAML shape can follow
       the archived path instead.
    5. Normative text is an A3 wall. If `spec/**` or `axioms/**`
       names the file, the decision stays live until a protected
       transition changes the normative pointer.

  ELEVEN CANDIDATES MOVED IN REVISION 2:

    - `format-circular-verifier-message-2026-10`: an archived
      decision mentioned the old path; that path now names the
      archive. An ID mention in the same prose stays unchanged.
    - `lib-stale-comments-cleanup-2026-10`: PACKAGES.md, the
      verifier header, and one archived path pointer now name the
      archive. Three relation targets are ID-only and stay.
    - `render-module-split-phase1-2026-10`: the path in lib/codec.ml,
      two corpus fixture paths, and one archived path pointer now
      name the archive. The similarly named PLAN document is a

      embedded-schemas prose, and the archived UX pointer now name
      the archive.
    - `dune-test-wrapper-exit-honesty-2026-10`: the self scope and
      the fixture header now name the archive; the fixture still
      exercises the wrapper and never needed the live decision.
    - `gate-truth-mathc-path-2026-10`: the self scope, flake.nix, and
      two pre-commit fixture headers now name the archive. The
      fixtures test the gate, not the decision file.
    - `install-tooling-default-tag-edge-2026-10`: PACKAGES.md and
      the self scope now name the archive. install.sh names the ID

outcomes:
  - id: the-record-left-the-live-corpus
    statement: |
      `decisions/kernel-format-2026-10.yaml` is now
      `archive/decisions/kernel-format-2026-10.yaml`, it says
      `state: retired`, and it carries the reason beside it. The
      live corpus does not carry it any more, and the archive's
      "still active" count did not grow.
  - id: the-thirteen-are-named-and-stay
    statement: |
      The thirteen candidates that are named somewhere in the tree
      stayed in `decisions/`, each with the mention that names it
      recorded in the intent of this decision. No mention was
      removed, and no relation was rewritten.
  - id: the-criterion-is-repeatable
    statement: |
      The criterion is a `git grep` over the whole tree, so the next
      reader can re-run it and get the same answer this tranche
      got, and the answer is a number rather than an impression.

obligations:
  - id: the-record-is-in-the-archive
    outcome: the-record-left-the-live-corpus
    claim: |
      The record this tranche moved is at
      `archive/decisions/kernel-format-2026-10.yaml`. The check is a
      file-existence check, which is the honest shape for a claim
      about where a file is: it can fail, and it fails if the file is
      moved back or deleted.
    acceptance:
      all:
        - verifier: file-exists archive/decisions/kernel-format-2026-10.yaml
  - id: the-record-says-it-is-retired
    outcome: the-record-left-the-live-corpus
    claim: |
      The archived file says `state: retired`, so the archive's
      "still active" count does not grow by one when a record enters
      it. The check searches that file for the exact line, so a copy
      made without the retirement makes it fail. The scheme is
      `shell-grep`, and `tests/fixtures/shell-grep-negative-control.sh`
      is the control that proves the scheme can fail.
    acceptance:
      all:
        - verifier: shell-grep archive/decisions/kernel-format-2026-10.yaml state: retired


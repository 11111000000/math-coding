reversal:
  - signal: |
      the recorded-raise marker is used on three consecutive raises
      without a substantive reason
    condition: |
      the marker has become a formality rather than a record
    action: rework
  - signal: |
      the bound check reports a fixture as unbound although the
      fixture compares the ceiling correctly
    condition: |
      the indirection is legitimate and the check cannot see it
    action: rework
counterexample: |
  Two counter-positions considered and rejected.

  (a) "The recorded-raise marker is a self-certifying escape hatch.
  An author who wants to raise a ceiling writes a marker and the
  check passes; the mechanism adds a ritual, not a guarantee."
  Rejected on the measurement, and on the alternative. The
  alternative - a hard failure with no way to express a legitimate
  raise - was measured against the corpus's own history: SIX of the
  SEVEN historical raises were legitimate and carried a reason. A
  check that cannot express a legitimate raise does not stop the
  raise; it routes it around the check, by editing the history or by
  removing the check. The marker is not an authorisation, it is a
  record: the raise still has to be justified in the commit and,
  where it is meaningful, in a decision - and the marker puts the
  reason next to the number, in the diff, where a reviewer sees it.
  The hole this leaves - a marker that says nothing - is bounded by
  the marker having to name the transition, by the reason having to
  be non-empty, and by the commit and the decision record that sit
  beside it. It is not bounded by the checker, and the checker does
  not pretend to be.

  (b) "The bound check is a heuristic over shell source: it looks
  for a mention of the variable outside the negative-control section,
  and a fixture that compares through a function, or through a
  variable the reader cannot follow, would be reported as unbound."
  Accepted as a true description of the check's method, and stated
  in the script's own header. The failure direction matters: a
  false report is a RED step with a one-line remedy ("compare the
  measured value against the ceiling where the comparison happens"),
  not a wrong green. The check errs towards reporting. The residual
  risk is the opposite - a fixture that mentions the ceiling outside
  the negative-control section without comparing anything - and that
  is the hole this decision does NOT close.

  (c) "The corpus is red anyway: `mathc self-check` reports `fail`
  at HEAD, with 211 of 252 subjects unknown. One more green step
  changes nothing." Partly true, and it is stated in the report
  rather than hidden. It does not make the check useless: the
  ceiling check guards a class of regression that the backlog does
  not cover - a number that moves up, and a comparison that is
  deleted - and it guards it against the corpus's own future
  re-signings, which is when the numbers move.
antithesis: |
  The opposite claim would be that the convention WAS the mechanism,
  and that a script is bureaucracy bought with a maintenance cost the
  project does not need.

  That is a real claim, and the corpus supports part of it: six of
  the seven historical raises carried a reason in prose, next to the
  number, written by the same author who wrote the raise. The
  convention was being kept, by a person, most of the time. A
  checker that only catches the seventh - the one nobody noticed -
  is worth little on its own.

  It is rejected because the failure the checker catches is not the
  one the convention catches. The convention catches a raise that a
  reader looks at. It cannot catch a comparison that was DELETED:
  on 2026-10-23 the two numbers stayed, the two comparisons went,
  and the commit that did it announced in its own body that "the
  debt fixture now pins all three ceilings at their current values".
  The number was still there. The promise was not. No reader of a
  diff can see that, because the diff shows a number that did not
  move - and the author's own summary of the change said the promise
  was kept.

  The cost is one script, one fixture, one CI step, and a comment
  line on a raise. The benefit is that the promise is now kept by
  something that cannot be tired, and that the one case the
  convention never caught - a ceiling that stops being a ceiling -
  is now a red step instead of a fact four days later.

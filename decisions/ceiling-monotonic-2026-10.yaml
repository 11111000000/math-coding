risk:
  declared_triggers:
    - the recorded-raise marker becomes a rubber stamp, and the
      check stops being a check while still reading green
    - the bound check reports a fixture as unbound because the
      comparison sits behind an indirection the reader cannot see
    - a legitimate raise arrives without the marker and the step
      goes red for a reason that is not the corpus
    - `fetch-depth: 0` makes the CI checkout slower on every push
    - the checker compares against a base that is not the branch
      point, and a raise that the branch introduced reads as
      inherited
  owner: human:maintainer

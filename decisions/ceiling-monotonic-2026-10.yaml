intent: |
  Make the monotonicity of the debt ceilings MECHANICAL, so that the
  promise "a ceiling may fall and may never rise" is kept by a
  program instead of by the reader of a diff.

  The corpus pins a number for each debt it is paying down, and calls
  the number a CEILING. The numbers live in the fixture files under
  `tests/fixtures/`, thirteen of them in six files. The convention
  that a ceiling may only fall was, until this decision, upheld by
  whoever happened to read the diff. The measurement says what that
  is worth.

  Measured between 2026-10-23 (the day the first ceiling was pinned)
  and 2026-10-26, SEVEN ceilings were raised across six distinct
  ceilings. Six of the seven carried a reason in the fixture file,
  next to the number, in the words the corpus already uses ("the
  raise is recorded here so it is visible rather than silent"). ONE
  did not: commit 1ee434dc changed `CEILING=198` to `CEILING=199` in
  `tests/fixtures/negative-control-debt.sh` and changed nothing else,
  so that raise is visible only to someone who reads history.

  The worse number is not the raise. It is that a ceiling can stop
  BEING a ceiling without its number moving at all. On 2026-10-23,
  commit 4004012e deleted the two comparisons of
  `tests/fixtures/legacy-attestation-debt.sh` - the lines that put
  the measured debt against `CEILING_LEGACY` and against
  `CEILING_UNATTESTED` - and kept both numbers. The commit body of
  that very commit says: "The debt fixture now pins all three
  ceilings at their current values: 22 legacy attestations, 30
  inconclusive, 25 decisions with no attestation. They may only
  fall." The declaration and the code disagreed, and the code was
  what ran. Measured at that commit, the two deleted comparisons were
  GREEN: the store held exactly 22 legacy attestations and exactly
  25 unattested decisions, so the two ceilings were met exactly. The
  checks were removed while they were passing, and nothing in the
  repository noticed for four days.

  So the promise was not kept, and the mechanism that was supposed to
  keep it could not see either failure: a silent raise leaves the
  number alone, and a deleted comparison leaves the number alone.
  Both are invisible to a reader who looks at the number.

axiom_link:
  - A0
  - A1
  - A2
commitment: |
  Two mechanisms, one script, one fixture, one CI step, and the
  repair of the two dead ceilings.

  (a) A ceiling checker compared every `CEILING_*` in
      `tests/fixtures/*.sh` with its value at a BASE COMMIT and fails
      when the ceiling grew. It prints the ceiling, the file, the old
      value, the new value and the size of the grow. The base is the
      merge base with the push target in CI, and `HEAD~1` locally;
      the comparison is between the WORKING TREE and that base, so a
      local run answers the question the author is about to commit.

      A raise is ACCEPTED when the comment block above the ceiling
      carries a marker naming this exact transition:

          # ceiling-raise: 22 -> 30, <the reason it had to grow>

      The marker must name the old value AND the new value, so a
      reason recorded for an earlier raise cannot authorise the next
      one, and the reason must be non-empty. The marker is a
      VISIBILITY mechanism, not an authorisation: the raise still has
      to be justified in the commit and, where it is a meaningful
      change, in a decision.

      The script also fails a ceiling that is DECLARED and never
      COMPARED. A ceiling counts as bound when at least one line
      outside the fixture's negative-control section mentions it: the
      negative control compares a SYNTHETIC corpus against the
      ceiling, which proves the comparison can fire and proves
      nothing about the real measurement. This is the check that
      reproduces the 4004012e defect mechanically.

      Exit 0 means the check ran and the corpus passed. Exit 1 means
      a ceiling grew without a recorded reason, or a ceiling is not
      bound. Exit 3 means the comparison could NOT be made - no base
      commit, or no ceiling to compare - and that is `unknown`, not
      `pass` (constitution.md Invariant 14b).

  (b) `tests/fixtures/legacy-attestation-debt.sh` compares all three
      of its debts against all three of its ceilings again. The two
      comparisons deleted by 4004012e are restored, and the negative
      control was extended to cover the unattested ceiling as well:
      it now inflates the synthetic corpus in BOTH directions and
      requires the fixture to report both as over their ceilings.

      The two ceilings are pinned at the number the truth is now,
      measured 2026-10-27: `CEILING_LEGACY=16` (was 22) and
      `CEILING_UNATTESTED=1` (was 25). Both are falls, which is the
      direction a ceiling may move. The one unattested decision is
      the file of THIS decision, whose attestation the re-signing
      writes; after the re-signing the ceiling must fall to 0.

  (c) A dedicated fixture covered the
      checker, with the negative control the project requires: a
      synthetic corpus in which a ceiling HAS grown must make the
      checker fail, and the failure must name the ceiling and the
      size of the grow. The fixture also covers a ceiling that fell,
      a raise that was recorded, a raise whose recorded reason names
      a DIFFERENT transition, a block that carries two markers and
      names the right one, a ceiling whose comparison was deleted
      while its number stood, a repository with no base commit (exit
      3, not exit 0) and a corpus with no ceiling at all (exit 3,
      not exit 0).

  (d) CI ran the checker as a named step,
      and its checkout now fetches the history (`fetch-depth: 0`).
      Without the history there is no base commit, the comparison
      cannot run, and the check would exit 3 on every push - a red
      step whose cause is the checkout configuration and not the
      corpus.

  THE INVENTORY, MEASURED. Thirteen ceilings in six fixture files:

      tests/fixtures/executed-evidence-census.sh   3
          CEILING_UNANCHORED=886  CEILING_UNEXECUTED=364
          CEILING_ORPHANS=6
      the scope-breadth fixture (removed 2026-10-28)  4
          CEILING_BIN_MATHC=184  CEILING_LIB_DECISION=158
          CEILING_LIB_GATE=145  CEILING_LIB_DIAGNOSTIC=137
      tests/fixtures/legacy-attestation-debt.sh    3
          CEILING_LEGACY=16  CEILING_UNATTESTED=1
          CEILING_INCONCLUSIVE=292
      tests/fixtures/failing-subject-backlog.sh    1  CEILING=11
      tests/fixtures/negative-control-debt.sh      1  CEILING=199
      the dead-scope-path fixture (removed 2026-10-28)  1  CEILING_DEAD=0

  Before this change ELEVEN of the thirteen were compared against a
  real measurement. `CEILING_LEGACY` was compared against a SYNTHETIC
  corpus by the negative control and against nothing else, and
  `CEILING_UNATTESTED` was compared against nothing at all - it was
  the only ceiling in the repository that no line of code referred
  to. After this change, thirteen of thirteen are compared.

  The corpus verdict is UNCHANGED by this decision: no schema, no
  gate rule, no attestation. It changes no verdict. It repairs the
  promises BETWEEN the corpus and the reader.
outcomes:
  - id: the-ceiling-may-only-fall
    statement: |
      A ceiling in `tests/fixtures/*.sh` that is larger at HEAD than
      at the base commit fails CI, unless the raise is recorded next
      to the number with a marker naming that exact transition.
  - id: a-declared-ceiling-is-a-bound
    statement: |
      A ceiling that is declared and never compared against a real
      measurement fails CI, so a comparison cannot be deleted while
      its number stays.
  - id: the-debt-fixture-binds-its-three-ceilings
    statement: |
      `tests/fixtures/legacy-attestation-debt.sh` compares the legacy
      count, the unattested-decision count and the inconclusive count
      against their ceilings, and its negative control proves all
      three comparisons can fire.
  - id: the-check-is-not-vacuous
    statement: |
      The checker exits 3 - unknown, not pass - when there is no
      base commit to compare against or no ceiling to compare, and
      the fixture that covers it asserts both.

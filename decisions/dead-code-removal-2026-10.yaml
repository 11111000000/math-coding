intent: |
  THE REPOSITORY CARRIES CODE NOTHING READS, AND IT CARRIES IT
  QUIETLY. This decision removes what the census found, and says how
  each removal was checked.

  The largest item is `lib/schema_embedded.ml` (724 lines): an OCaml
  copy of the six JSON schemas, written so that `mathc init` could
  drop them into a brownfield project. Nothing ever read it. The
  kernel's validator parses by hand and consults no JSON-Schema file,
  and `mathc init` writes no `schemas/` directory at all — the
  decision that introduced the module
  (`decisions/ux-3-minimal-pollution-2026-10.yaml`) says so in its
  own commitment ("The kernel does NOT consult these constants at
  validate time"). The module was a promise the code never kept, and
  the test that claimed to cover it
  (`tests/cli/embedded-schemas.t`) was checking an observation that
  was true for a different reason: the validator needs no schema file
  either way. The test keeps its observation and loses its false
  premise.

  The rest is smaller and of the same kind: helpers with no caller
  (`Schema.empty`, `Schema.string_opt`, `Schema.array_opt`,
  `Schema.object_pairs`, `Schema.take_diag`, `Digest.sha256_text`,
  `Forge.team_member`, `Forge.clear_cache`, `Capsule.priority_name`,
  `Memory.empty`, `Templates_embedded.readme_md`), two scripts
  nothing invokes (`scripts/fix-attr.sh`, `scripts/dev-fast` — note
  that `scripts/dev-fast-test` is a DIFFERENT file and stays), and a
  generated report the repository had been carrying in its index
  (`.work/report.json`, 431 lines).

  WHY IT MATTERS FOR THE METHODOLOGY, beyond the lines. A repository
  that carries unread code cannot be audited: every reader must
  decide whether the second parser is the authoritative one, and the
  corpus's own doctrine says the authority is in the code, not in the
  prose. One copy of a rule, and one reader of it, is the only shape
  in which "the kernel enforces this" is a checkable claim.

commitment: |
  1. `lib/schema_embedded.ml` is gone, and `lib/dune` no longer
     lists it. `decisions/negative-control-required-2026-10.yaml`
     no longer names it in its scope, and the comment in
     `bin/Mathc.ml` that used it as an example now says the truth:
     the schema is documentation, not a check.
  2. The eleven helpers with no caller are gone. `scripts/dev-fast`
     and `scripts/fix-attr.sh` are gone; `scripts/dev-fast-test`
     stays, and `scripts/dev` still calls it.
  3. `.work/` is ignored by git and `.work/report.json` is no longer
     tracked. It was a generated report; git history keeps it.
  4. The two decisions whose text described the removed module as a
     delivered fact state the truth instead:
     `ux-3-minimal-pollution-2026-10` is at revision 2, and
     `tests/cli/embedded-schemas.t` keeps its observation and loses
     its false premise.
  5. The two files the removal touched (`lib/memory.ml`,
     `lib/templates_embedded.ml`) are `dune fmt` clean: the
     removal left a fold the formatter would rewrap and a trailing
     blank line, and the formatter's output is the tree's shape.

outcomes:

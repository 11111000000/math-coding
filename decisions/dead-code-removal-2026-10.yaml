risk:
  declared_triggers:
    - "a reader of the removed module existed outside this
      repository (a downstream project vendored it): the module had no
      reader IN this repository, and git history keeps it"
    - "the removed helpers were exported API for a downstream
      consumer of the library: there are no `.mli` files in this
      repository, so the public surface was the whole module, and the
      helpers had no callers in it"
  owner: human:maintainer

counterexample: |
  "The schema copy was not dead; it was there so that a downstream
  project could copy the schemas out of the binary."

  The claim was true as an intention and false as a mechanism: a
  module that nothing reads is not a source a downstream project can
  copy from, because the copy path is `mathc init`, and `mathc init`
  never wrote a `schemas/` directory — the decision that introduced
  the module says so in its own commitment, and
  `tests/cli/init-defaults.t` asserts the directory is absent. What
  a downstream project actually needs is the schema FILES, and those
  are in the repository, in one place, where they can be copied from.
  The second copy in OCaml was not reachable by anyone.

  The second objection is about the tests: if the observation was
  true anyway, the test was still worth keeping, and it is. What was
  not worth keeping was its explanation: a test that says "the
  schemas are embedded" teaches the next reader a false thing about
  the kernel, and that reader then looks for the embed. The test now
  says what it verifies and what is false.

antithesis: |
  The opposite claim is that dead code is cheap insurance: if the
  hand-written parser is ever replaced by a schema-driven one, the
  embedded copy is there and the schemas are already in the binary.

  The claim is reasonable as a matter of taste and wrong as a matter
  of cost: 724 lines of second copy, a second reader of every format
  rule, and a test that explains the wrong mechanism. An insurance
  policy that is never claimed and cannot be claimed is a cost with
  no payoff. If the parser is ever replaced, the schemas in
  `schemas/` are the source to migrate FROM, and they are twelve
  times smaller than the copy that was carrying them.

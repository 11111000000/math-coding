counterexample: |
  The counter-position considered and rejected: "the rename
  is gratuitous churn — `mathc attest FILE` worked, the
  upstream `attest-batch` had every right to the `attest`
  namespace." Rejected on three grounds: (a) the verb
  `attest` is overloaded in this CLI — `attest-batch` is the
  attestation-store writer (`records/`-shaped JSON), while
  the JUnit importer is a passthrough parser — and bash
  tab-completion currently offers both with no way to
  distinguish; (b) the v3.4 release notes already brand
  the JUnit path as `import-junit` in the migration table;
  (c) downstream `mathc-mcp` tools advertise JUnit parsing
  under `import-junit`, leaving `mathc attest` as the
  odd-one-out. The deprecation alias preserves script
  compatibility for one release cycle.

  A second counter-position considered: "the warning goes
  to stdout so users immediately notice." Rejected: stdout
  is reserved for machine-readable JSON because that is
  what `tests/cli/junit-adapter.t` and downstream tooling
  parse. Stderr is the conventional channel for
  human-facing diagnostics; a one-shot stderr warning is
  visible in interactive shells and avoids breaking
  `mathc attest FILE | jq .test_count` pipelines.


revision: 1
state: active
body_sha: "sha256:a2dba0c4c4388ad07d3a3c95392bc9de273a5cf269f314361d15fa2bbd892f71"
yaml_sha: "sha256:a2dba0c4c4388ad07d3a3c95392bc9de273a5cf269f314361d15fa2bbd892f71"

intent: |
  Document the deliberate no-op behavior of
  `mathc init --agent opencode` when invoked from a
  release-installed binary (e.g. `~/.local/bin/mathc`),
  as opposed to an in-source build at
  `_build/default/bin/mathc.exe`.

  Background: `lib/init/init.ml::find_source_skill` walks
  up from the binary's directory looking for the in-repo
  `.opencode/skills/math-coding/SKILL.md`. On an in-source
  build the walk finds the source (it lives three levels
  up from `_build/default/bin/mathc.exe`); on a release
  binary the walk terminates without finding it and the
  kernel prints a one-liner instructing the user to run
  `install.sh --user-skill`.

  This is the canonical path per `install-tooling-2026-10@1`
  (commitment 6): `install.sh --user-skill` is the
  per-user install path for installed binaries. Bundling
  the skill inside the release binary would duplicate
  this affordance and risk drift between the bundled copy
  and the canonical `adoption/SKILL.md`.

  Today this split is correct: an in-source-build developer
  (running `dune build` then `./_build/default/bin/mathc.exe`)
  gets the per-user skill via the in-repo copy path; a
  release-installed user (running `~/.local/bin/mathc`) gets
  it via `install.sh --user-skill`. This decision records
  the split explicitly so future agents do not re-attempt
  to bundle the skill inside the release binary or shift
  the workaround.

axiom_link:
  - A0
  - A4

antithesis: |
  The counter-position considered and rejected: "Bundle the
  skill inside the release binary via a `tar -xzOf` against
  the `dist-adoption.tar.gz` URL, just like `install.sh`
  does. That way `mathc init --agent opencode` works
  everywhere." The author engaged with this position and
  rejected it on three grounds: (a) it duplicates the
  `install.sh --user-skill` path and creates two source-of-
  truth copies (the bundled byte and `adoption/SKILL.md`),
  with no machine-checked sync between them; (b) it adds
  network I/O to a subcommand that today runs in 0 ms on
  the developer path, regressing the in-source-build UX;
  (c) `find_source_skill` is a pure local-filesystem helper
  with no kernel API surface; reaching outside to GitHub Releases
  from `lib/init/init.ml` would couple the init subcommand
  to network state, which is what `install.sh` exists to
  abstract. The minimum change is to record the split, not
  to bridge it.

commitment: |
  This decision does NOT modify any kernel source. It records:

  1. On a release-installed binary (e.g. `~/.local/bin/mathc`),
     `mathc init --agent opencode` invokes
     `lib/init/init.ml::find_source_skill`, the walk
     terminates without finding a source, and the kernel
     prints a one-liner instructing the user to run
     `install.sh --user-skill`. Exit code 0.

  2. On an in-source build (e.g. `_build/default/bin/mathc.exe`
     in a checkout of this repo), the same invocation finds
     the source at the canonical in-repo path
     `.opencode/skills/math-coding/SKILL.md`, copies it to
     the per-user location, and prints a confirmation
     message. Exit code 0.

  3. The per-repo skill remains committed at
     `.opencode/skills/math-coding/SKILL.md` per
     `ux-3-repo-tracked-opencode-skill-2026-10@1`,
     byte-for-byte identical with `adoption/SKILL.md`
     (verified by `scripts/check-opencode-skill.sh`).

  4. The per-user install path remains
     `install.sh --user-skill` per
     `install-tooling-2026-10@1`.

  5. No new subcommand, no new flag, no new library is
     introduced.

boundaries (a3 self-application):
  - No `lib/**`, `bin/**`, `spec/**`, `schemas/**`,
    `axioms/**` is touched.
  - The kernel verdict is unchanged.
  - No new attestation is required; the per-user install
    flow remains attested via
    `attestations/install-tooling-2026-10-install-sh-user-skill.json`.


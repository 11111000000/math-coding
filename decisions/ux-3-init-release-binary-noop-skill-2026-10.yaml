outcomes:
  - id: split-documented
    statement: |
      The release-binary / in-source-developer split for
      `mathc init --agent opencode` is documented in a
      decision; future agents do not re-attempt to bundle
      the skill inside the release binary.
  - id: install-sh-canonical
    statement: |
      The per-user install path remains `install.sh
      --user-skill`; no parallel install path is added
      to `mathc init`.

counterexample: |
  "What if a fresh user runs `~/.local/bin/mathc init .
       --agent opencode` and gets a one-liner instead of
       the per-user skill installed?" Counterargument: the
       same fresh user just downloaded `mathc` via
       `install.sh` (the canonical adoption affordance).
       That script does the per-user install with
       `--user-skill`. The user has to opt-in to the per-user
       install once anyway; the fallback message in
       `mathc init` is documentation, not a workaround.

  "What if the per-repo skill drifts from `adoption/SKILL.md`?"
       Counterargument: `scripts/check-opencode-skill.sh`
       asserts byte-equality. The in-source-build path uses
       the in-repo copy which is gated by this verifier;
       the release-binary path uses the canonical
       `adoption/SKILL.md` via `install.sh --user-skill`.
       Drift in either direction is caught by
       `scripts/check.sh` (which runs the verifier).

obligations:
  - id: split-recorded
    outcome: split-documented
    claim: |
      The release-binary / in-source-developer split is
      recorded in this decision file.
    acceptance:
      all:
        - verifier: this-decision-file-present
          result: pass
  - id: install-sh-canonical-recorded
    outcome: install-sh-canonical
    claim: |
      The per-user install path is recorded as
      `install.sh --user-skill` and the kernel-side
      fallback message points the user at the same
      script.
    acceptance:
      all:
        - verifier: this-decision-file-present
          result: pass

reversal:
  - signal: per-user-skill-init-released
    condition: |
      Either:
      (a) `lib/init/init.ml::find_source_skill` is changed
          to reach outside (e.g. via `dist-adoption.tar.gz`)
          so the release binary path also copies the skill;
          OR
      (b) `install.sh --user-skill` is removed and a
          kernel-side equivalent takes its place.
    action: rework


outcomes:
  - id: alpine-install-works
    statement: |
      On Alpine / Void / Chimera hosts the
      `curl ... | sh` invocation succeeds and lands a
      `mathc version` exit 0 from
      `mathc-linux-x86_64-musl`.

counterexample: |
  "Auto-detection is brittle; users on exotic libc
   variants (dietlibc, uclibc) will get the wrong
   binary." Counterargument: those libcs are not
   targeted by math-coding; the binary is
   source-compatible with glibc and musl only. Users
   on a libc the script does not recognise receive a
   glibc binary that fails; the failure is recoverable
   by passing `--libc=musl` or downloading the musl
   asset directly from the release page.

  "Probing `ldd` invokes the dynamic linker, which
   costs a syscall on a slow link." Counterargument:
   the probe is one call (`ldd --version`); the cost
   is sub-100ms. The benefit of auto-detection on
   Alpine / Void / Chimera outweighs the cost by 3+.

obligations:
  - id: libc-detect-impl
    outcome: alpine-install-works
    claim: |

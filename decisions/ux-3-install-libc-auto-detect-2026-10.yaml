schema: math-coding/3.3
id: ux-3-install-libc-auto-detect-2026-10
revision: 1
state: active
mode: standard
change_kind: implementation

body_sha: "sha256:c8635ba633b6164d1754735398eead65b8a2d1031d17d3efa8853df7cc1a5563"
yaml_sha: "sha256:c8635ba633b6164d1754735398eead65b8a2d1031d17d3efa8853df7cc1a5563"

axiom_link:
  - A0
  - A1
  - A4

intent: |
  Auto-detect glibc vs musl on Linux hosts so that
  Alpine / Void / Chimera users get the musl-linked
  binary instead of crashing on a glibc-linked one.
  Today `install.sh` blindly downloads
  `mathc-linux-x86_64` (glibc); on a musl-based host the
  binary fails with `error while loading shared
  libraries: libc.so.6`, leaving the user to
  manually download `mathc-linux-x86_64-musl`.

commitment: |
  `scripts/install-tooling/install.sh` includes a new
  `detect_libc()` function returning `libc=glibc` or
  `libc=musl`. Detection order:
    1. CLI override `--libc=glibc` or `--libc=musl` (set
       in `parse_flags()`).
    2. `getconf GNU_LIBC_VERSION` returning a string
       starting with `glibc` ⇒ glibc.
    3. `ldd --version 2>&1` first line containing
       `musl` ⇒ musl.
    4. `ldd --version 2>&1` first line containing
       `GNU` or `GLIBC` ⇒ glibc.
    5. Fallback (no getconf, no ldd) ⇒ glibc (matches
       the runner-vendored build).

  The detection is logged to stderr:
  `install.sh: libc detect: <glibc|musl>`. The
  `download_binary()` function learns a `libc` argument;
  for `os=linux libc=musl`, the binary basename is
  `mathc-linux-<arch>-musl`; otherwise it stays
  `mathc-linux-<arch>`. SHA-256 verification uses the
  matching basename. The override is exposed via
  `--libc=glibc|musl`.

scope:
  capabilities:
    - installer-distro
    - shell-compat
    - bootstrap-windows
  paths:
    - "scripts/install-tooling/install.sh"
    - "USAGE.md"
    - "site/install.md"

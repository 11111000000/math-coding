  without an in-process regression fixture, which is exactly
  the kind of change AGENTS.md §Self-application says must
  ship with positive and negative conformance fixtures plus a
  decision under the active policy. The same shape of
  rationale is recorded in
  `decisions/update-check-notify-2026-10.yaml` (deferred
  because dune is unavailable in this session).


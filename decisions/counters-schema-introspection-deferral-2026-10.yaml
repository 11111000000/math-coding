intent: |
  Defer fixing the bug in `mathc counters --format=json`
  where the keys `schema.schema_enum`, `schema.intent_oneOf`,
  and `schema.scope_oneOf` report empty values
  (`[]` / `false`) instead of the live values parsed out of
  `schemas/decision.json`. The bug is in
  `bin/Mathc.ml::do_counters` (the `string_list_from_nested`
  and `has_one_of` helpers used in section 7, "schema info"):
  a fingerprint of the live output at HEAD `c56bd35` is
  `decision_required_fields: ["schema", "id", "intent",
  "commitment", "scope", "outcomes", "obligations"]` (correct,
  pulled from the schema's top-level `required`) but
  `schema_enum: []` and both `intent_oneOf` / `scope_oneOf`
  are `false`, even though `properties.schema.enum` and the two
  `oneOf` arrays are visible to a Python-side read of the same
  file.

  The counter command is the single source of truth for the
  counters block in PACKAGES.md (per `tests/counters_drift.ml`,
  currently gated off). The bug means the schema field of that
  block is silently under-reported. PACKAGES.md (this commit)
  adds a one-line note that `schema.schema_enum` reports the
  three value shapes; once the fix lands, the note is removed.

  The fix is non-trivial because (i) the offending code lives
  in `bin/Mathc.ml`, a kernel-protected file per
  AGENTS.md §Self-application; (ii) reproducing the bug
  requires rebuilding and running the affected executable on a
  machine with the OCaml toolchain (nix-shell or system ocaml
  + dune), which is not available in this branch's CI; (iii)
  the fix should ship with a regression fixture that pins the
  live output for the post-fix tree.


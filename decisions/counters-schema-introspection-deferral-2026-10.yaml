  Rejected because: AGENTS.md §Self-application makes bin/Mathc.ml
  a protected-policy file. An inline fix in a branch where the
  toolchain to reproduce the bug is absent is exactly the shape
  of change that the project has been bitten by twice
  (per decisions/disable-counters-drift-test-2026-10.yaml the
  counters_drift regression was the first; per
  decisions/update-check-notify-2026-10.yaml the
  update-check-notify OCaml impl was the second). Both
  precedents led to silent regressions or drift that took a
  follow-up cycle to unwind. Filing a deferral record and
  surfacing the under-report in PACKAGES.md is the honest
  path; the live reviewer can then read `mathc counters`
  knowing the schema_enum field is currently empty and waiting
  for the reversal signal to fire.
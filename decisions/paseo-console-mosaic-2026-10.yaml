counterexample: |
  The strongest objection is that a mosaic is a decoration. The six
  states are a partition of what `mathc packages` already prints as one
  column, so the picture carries no information the table did not, and
  a table is cheaper to read for anyone who has seen a table.

  The objection is right about the information and wrong about the
  reading, and it is wrong in the direction that matters: it assumes
  the reader adds the numbers. The reader does not. `525 attestations`
  and `547 obligations` sit in two panels and the mind does the sum,
  and the sum it does is "a big store for a big corpus" — which is
  what the numbers are and is not what is true. The measured truth of
  this corpus at the time of writing is that 516 of the 525
  attestations name a live promise and none of them discharges one.
  A field of 503 empty cells and 44 hatched ones cannot be read as
  "mostly fine", because there is no number in it to add to anything
  else; the eye has nothing to do but see the emptiness. The mosaic's
  whole work is to remove the arithmetic the reader would otherwise
  perform, and the arithmetic is what flatters the corpus.

  The residue of the objection is admitted rather than answered away.
  A mosaic is less familiar than a table, and the reader who wants the
  table must be able to have it: the mosaic's bands open the same data
  as a list, and the legend is on the picture. What the picture buys is
  the shape; what the list buys is the address; both are needed, and
  the promise that the picture alone is enough is the promise this
  decision refuses to make.

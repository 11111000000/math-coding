    outcome: the-corpus-is-one-picture
    claim: |
      The six cell states are defined exactly once, in the shared verdict
      module, and both halves of the console take them from there. Two
      places that name them are two vocabularies, and two vocabularies
      drift: one of them will call a promise observed while the kernel
      calls it open.
    acceptance:
      all:
        - verifier: tests/fixtures/paseo-console-mosaic.sh
  - id: the-cells-join-three-readings
    outcome: the-corpus-is-one-picture
    claim: |
      A cell is the join of the kernel's obligation index, the promise
      census and the attestation store. A promise closed by a machine run
      is a different cell from one closed by a person's word, and the
      difference is visible.
    acceptance:
      all:
        - verifier: tests/fixtures/paseo-console-mosaic.sh
  - id: the-join-is-computed
    outcome: the-join-is-visible
    claim: |
      The console reports the join: how many attestations the store
      holds, how many name a live promise, and how many discharge one.
    acceptance:
      all:
        - verifier: tests/fixtures/paseo-console-mosaic.sh
  - id: the-mosaic-renders
    outcome: the-corpus-is-one-picture
    claim: |
      The mosaic renders: one cell per obligation, coloured by its
      epistemic status, banded by the decision that promised it.
    acceptance:

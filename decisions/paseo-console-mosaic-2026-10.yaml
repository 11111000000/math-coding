intent: |
  The console shows the corpus and it reads as a pile. Six views, each a
  table of numbers the kernel printed, and a reader who opens the panel
  learns that there are 155 decisions and 547 obligations and then has
  to decide what to do with that.

  The reason it reads as a pile is not that the numbers are wrong. It is
  that the numbers are in the wrong SHAPE for the thing they describe.
  The corpus is a population of promises, each in one epistemic state, and
  a population with a state per member is a picture, not a list. Six
  hundred rows of `id + cause + action` cannot show a reader that the
  corpus is one colour and not another; a field of cells can.

  There is a second thing the tables cannot do, and it is the more
  important one. The console shows the SIZE of the store and the SIZE of
  the corpus in two panels, and invites the reader to add them: 525
  attestations, 547 obligations, which reads like a healthy corpus with a
  large store. The truth is the JOIN between them, and the join is not
  shown anywhere: 516 of those 525 attestations name a promise that is
  still live, and NONE of them discharges it, because an attestation is
  bound to the content of the scope it was made against, and the corpus
  has been rewritten underneath them. A corpus with no evidence and a
  corpus with a great deal of evidence look the same on a dashboard, and
  they are opposites.

  So the console draws the corpus: one cell per obligation, coloured by
  the epistemic state the promise is actually in, arranged in bands by the
  decision that promised it. And it draws the join, because the join is
  the corpus's honesty.
commitment: |
  1. ONE CELL PER OBLIGATION. The cell's colour is the promise's
     EPISTEMIC STATUS, and the status vocabulary has exactly six words:
     observed (closed by a machine run that is current), declared (closed
     by a person's word that is current), open (no current evidence),
     uncheckable (the corpus names no check for it at all), failed (a
     decisive failure), waived (accepted by a named, in-force, expiring
     waiver). The gap kind — missing, stale, unknown — is NOT a colour:
     it is a debugging detail and it belongs to the drill-down. The
     six words live in one place and the server and the client both take
     them from it.

  2. THREE READINGS, JOINED. A cell is the join of what the kernel's
     obligation index says (is this promise discharged, and by what),
     what the promise census says (is there any check for it at all) and
     what the store says (what kind of evidence covers it, and how
     old). The console computes no state of its own; it colours the
     kernel's answers.

  3. BOTH READINGS, WHEN THEY DISAGREE. `mathc packages` and
     `mathc gaps` do not say the same thing about the same promise —
     on this repository, one says 547 missing and the other says 452
     stale and 32 unknown. The console does not pick one and does not
     average them. It shows both readings side by side on the cell and
     marks the disagreement, because a console that silently chooses is
     a console that laundered.

  4. THE JOIN IS SHOWN. The console reports how many attestations the
     store holds, how many of them name a promise that is still live,
     and how many of those actually discharge it. The corpus's honesty
     is not the two numbers; it is the third.

  5. THE CHAIN IS DRAWN ONCE. For one promise, the chain is drawn
     vertically — decision, obligation, check, evidence, and the gap
     hanging off the end that is broken — with the evidence's kind, its
     age and its materials digest on it. The mosaic is the overview; the
     chain is the proof.

  6. THE CHANGE IS THE GATE'S OWN READING. The change view shows the
     merge gate's verdict, its exit code, its gaps grouped by kind and
     the kernel's remedy for each, and the files that changed. The
     console does NOT re-derive which obligations a diff touches: the
     kernel does not expose that, and a console that guessed would be a
     second measurer. The console says so instead of guessing.

  7. THE NAVIGATION IS FOUR VIEWS AND A FRAME. The frame carries the
     instrument's reading and is always visible. The four views answer
     the methodology's questions: the corpus at a glance, this change,
     the commitments and what still stands of them, and what a person
     must stand behind. The kernel's subcommands leave the navigation:
     they are verbs, and a navigation of verbs says the kernel is a bag
     of commands.
axiom_link:
  - A0

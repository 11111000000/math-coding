---
schema: math-coding/3.2
id: mathc-self-check-subcommand
revision: 5
state: active
#
# Rev 5 (2026-11-01): the promise the claims inventory falsified --
# "the kernel returns pass against this repository" -- rewritten as
# what the kernel does. It returns `unknown` and exit 3 while the
# attestation store is generated per run and covers no decision. The
# control that catches the old promise is this decision's own now:
# tests/cli/self-check-unknown.t.
negative_control: tests/cli/self-check-unknown.t
body_sha: "sha256:62d0baba47428530a146329d99cb60f91bb02bd67526da0eda0f4075903b4a6a"
yaml_sha: "sha256:62d0baba47428530a146329d99cb60f91bb02bd67526da0eda0f4075903b4a6a"
intent: |
  Close ROADMAP Tier-1 #2 (`mathc self-check`) and thereby the
  AGENTS.md bootstrap-gate expiry condition verbatim: the
  released 3.0 kernel successfully checks this repository and
  its conformance corpus. `mathc self-check` is the named mechanism;
  until it ships, every assessment is a manual declaration,
  not an automated guarantee (AGENTS.md section Bootstrap gate).

  2026-11-01, REVISION 5: THE PROMISE WAS FALSIFIED, THE MECHANISM
  WAS NOT. Revision 4 said the dispatcher ships and "the kernel
  returns `pass` against this repository and its conformance corpus,
  with exit code 0". It does not, and it cannot: the attestation
  store is GENERATED (decisions/store-not-committed-2026-10.yaml),
  so a checkout has no store until the sweep runs, and every
  obligation without fresh evidence is `unknown`. Measured on this
  tree, 2026-11-01: `mathc self-check` exits 3, the aggregate
  verdict is `unknown`, and all 133 subjects are `unknown`.

  What the kernel does say, and what this decision now promises:

    `mathc self-check` answers with a VERDICT and an EXIT CODE that
    agree: `pass` -> 0, `fail` -> 1, `unknown` -> 3. `unknown` is
    never collapsed onto 0 (constitution.md:59, Invariant 14b,
    spec/semantics.md section Kernel Output).

    The parts of the check that do not need evidence DO pass: the
    conformance corpus, the axioms invariants and the schemas are
    reported as `pass` on every run (`mathc self-check --format=json`
    carries them under `corpus`). What is `unknown` is every
    DECISION's obligations, because the evidence for them lives in
    the store and the store is generated per run.

    The three cram fixtures assert the three arms end to end, and
    they are the reason this decision's promise is checkable: a
    kernel that collapsed `unknown` into `pass` turns
    `tests/cli/self-check-unknown.t` red, and that is this
    decision's negative control.

axiom_link:
  - A0
commitment: |
  Add a normative row for `mathc self-check` in `spec/semantics.md`
  section "CLI subcommands" so the catalog is complete and the
  constitution-level unrecorded gap (semantics.md:152-155) is
  closed on the spec side. The dispatcher ships in a follow-up
  revision of this decision (rev 2), gated by `mathc self-check`
  answering honestly against this repository and its conformance
  corpus. Until `gate-attestation-store-fill` (ROADMAP Tier-1
  #1) lands, `mathc self-check` cannot move past `unknown` and
  this decision's exit code is reserved accordingly.

  Revision 2 implements the dispatcher in `bin/Mathc.ml`. The
  implementation walks `decisions/*.yaml` directly via
  `Sys.readdir` (no hardcoded file list), consumes the
  attestation store via the existing `Attestations.load`, and
  evaluates each (decision, obligation) pair via `Gate.obligation_gap`
  (a top-level binding exposed from `lib/gate.ml`). The kernel
  stays offline and side-effect-free; all I/O lives in bin/.
  Exit codes: 0 on `pass`; 1 on `fail`; 3 on `unknown` /
  infrastructure error -- `unknown` is NOT collapsed onto 0, per
  constitution.md:59 (`unknown != pass`) and
  spec/semantics.md:435-440.

  Revision 5 keeps the exit-code rule and rewrites the promise about
  what the kernel certifies. The dispatcher is shipped; the verdict
  it reports on a checkout without a generated store is `unknown`,
  and that is the honest answer, not a failure of the subcommand.

scope:
  paths:
    - "spec/semantics.md"
    - "bin/Mathc.ml"
    - "lib/gate.ml"
    - "tests/cli/self-check-pass.t"
    - "tests/cli/self-check-fail.t"
    - "tests/cli/self-check-unknown.t"
    - "tests/fixtures/gate-pass/**"
    - "tests/fixtures/self-check-fail/**"
  # 2026-10-25: pruned from this scope, per decisions/dead-scope-paths-2026-10.yaml
  #   lib/attestations/*.json - no tracked file matches it

outcomes:
  - id: spec-row-promoted
    statement: spec/semantics.md §"CLI subcommands" has a
      `### self-check` row whose output carries `verdict`,
      `subjects[]`, `repository_digest`, and `kernel_digest`,
      and whose pass-condition is the AGENTS.md bootstrap-gate
      expiry clause verbatim.
  - id: gate-attestation-store-filled
    statement: lib/gate.ml no longer reports
      `NoAttestationStore` for any obligation whose attestation
      store entry exists; the `gate-attestation-store-fill`
      obligation of `decisions/gate-decision.yaml` is closed.
  - id: dispatcher-shipped
    statement: |
      `mathc self-check` dispatches, and its verdict and its exit
      code always agree: `pass` -> 0, `fail` -> 1, `unknown` -> 3.
      A checkout without a generated attestation store answers
      `unknown` and exits 3, because no decision's obligations hold
      fresh evidence; the conformance corpus, the axioms invariants
      and the schemas are reported as `pass` on the same run.
counterexample: |
  `unknown` (exit 3) on an empty store must not be conflated with `pass`.

assumptions:
  - id: store-precedes-self-check
    state: assumed
    statement: |
      `gate-attestation-store-fill` (ROADMAP Tier-1 #1) precedes
      `mathc self-check` implementation. The dependency is recorded
      in ROADMAP.md and is structural: without the store, every
      gate verdict is `NoAttestationStore` and self-check
      cannot move past `unknown`, which `constitution.md:59`
      forbids conflating with `pass`.
    owner: human:maintainer
    consequence_if_false: `mathc self-check` would return `unknown`
      for every obligation and would fail the bootstrap expiry
      condition.
    review_on:
      - signal: gate-attestation-store-fill-merged
  - id: bootstrap-gate-verbatim
    state: assumed
    statement: |
      The M3 verdict (`pass`) is the AGENTS.md bootstrap-gate
      expiry clause quoted verbatim — including the words
      `released` and `and its conformance corpus`. A
      `mathc self-check` that only checks the repository and not
      the corpus does not expire the bootstrap.
    owner: human:maintainer
    consequence_if_false: a partial check would let an
      unreleased build claim M3 prematurely.
    review_on:
      - signal: kernel-released

obligations:
  - id: mathc-self-check-spec-promoted
    outcome: spec-row-promoted
    claim: |
      spec/semantics.md §"CLI subcommands" contains a row
      `### self-check` whose output shape and exit codes match
      the AGENTS.md bootstrap-gate expiry clause and the
      constitution.md `unknown != pass` distinction.
    acceptance:
      all:
        - verifier: file-exists decisions/mathc-self-check-subcommand.yaml
        - verifier: shell-grep spec/semantics.md unknown != pass
  - id: mathc-self-check-store-precedes
    outcome: gate-attestation-store-filled
    claim: |
      The attestation store is filled so that lib/gate.ml
      reports per-obligation verdicts rather than
      `NoAttestationStore` for every obligation whose store
      entry exists. Tracked under
      `decisions/gate-decision.yaml` obligation
      `gate-attestation-store-fill`.
    acceptance:
      all:
        - verifier: shell-grep lib/gate.ml gate-attestation-store-fill
  - id: mathc-self-check-dispatcher-shipped
    outcome: dispatcher-shipped
    claim: |
      The three cram fixtures assert the three arms end to end.
      `tests/cli/self-check-pass.t` runs the dispatcher against a
      populated fixture store and requires the covered subjects to
      report `pass`, the uncovered ones `unknown`, and the exit code
      to be the one the aggregate verdict implies. The fixture
      store covers two decisions in full, so the aggregate is
      `unknown` and the exit code is 3 -- the fixture asserts the
      composition, not a count. `tests/cli/self-check-fail.t`
      requires `fail` and exit 1 against a decisive-fail
      attestation. `tests/cli/self-check-unknown.t` requires
      `unknown` and exit 3 against a store that is absent, and
      requires every subject to be `unknown`.

      A kernel that collapsed `unknown` into `pass` turns the third
      fixture red, which is why it is this decision's negative
      control.
    acceptance:
      all:
        - verifier: tests/cli/self-check-pass.t
        - verifier: tests/cli/self-check-fail.t
        - verifier: tests/cli/self-check-unknown.t
reversal:
  - signal: kernel-diverges-from-spec
    action: |
      revert the dispatcher; downgrade the spec row to
      a documented limitation

risk:
  declared_triggers:
    - bootstrap-premature-expiry
    - unknown-confused-with-pass
    - store-empty-but-verdict-pass
    - kernel-diverges-from-release

relations:
  addresses:
    - bootstrap-v3@2

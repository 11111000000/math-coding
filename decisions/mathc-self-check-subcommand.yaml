---
schema: math-coding/3.0-alpha
id: mathc-self-check-subcommand
revision: 4
state: active
body_sha: "sha256:b6d30073a0579a5b60c195aeb37932880e51a6e7cd6031560c618f7f2aeaf401"
yaml_sha: "sha256:b6d30073a0579a5b60c195aeb37932880e51a6e7cd6031560c618f7f2aeaf401"
intent: |
  Close ROADMAP Tier-1 #2 (`mathc self-check`) and thereby the
  AGENTS.md bootstrap-gate expiry condition verbatim: the
  released 3.0 kernel successfully checks this repository and
  its conformance corpus. `mathc self-check` is the named mechanism;
  until it ships, every assessment is a manual declaration,
  not an automated guarantee (AGENTS.md §Bootstrap gate).

axiom_link:
  - A0
commitment: |
  Add a normative row for `mathc self-check` in `spec/semantics.md`
  §"CLI subcommands" so the catalog is complete and the
  constitution-level unrecorded gap (semantics.md:152-155) is
  closed on the spec side. The dispatcher ships in a follow-up
  revision of this decision (rev 2), gated by `mathc self-check`
  passing locally against this repository and its conformance
  corpus. Until `gate-attestation-store-fill` (ROADMAP Tier-1
  #1) lands, `mathc self-check` cannot move past `unknown` and
  this decision's exit code is reserved accordingly.

  Revision 2 implements the dispatcher in `bin/Mathc.ml`. The
  implementation walks `decisions/*.yaml` directly via
  `Sys.readdir` (no hardcoded file list), consumes the
  attestation store via the existing `Attestations.load`, and
  evaluates each (decision, obligation) pair via `Gate.obligation_gap`
  (a top-level binding exposed from `lib/gate.ml`). The kernel
  stays offline and side-effect-free; all I/O lives in bin/.
  Exit codes: 0 on `pass`; 1 on `fail`; 3 on `unknown` /
  infrastructure error — `unknown` is NOT collapsed onto 0, per
  constitution.md:59 (`unknown != pass`) and
  spec/semantics.md:435-440.

scope:
  paths:
    - "spec/semantics.md"
    - "bin/Mathc.ml"
    - "lib/gate.ml"
    - "lib/attestations/*.json"
    - "tests/cli/repo-check-pass.t"
    - "tests/cli/repo-check-fail.t"
    - "tests/cli/repo-check-unknown.t"
    - "tests/fixtures/repo-check-pass/**"
    - "tests/fixtures/repo-check-fail/**"

outcomes:
  - id: spec-row-promoted
    statement: |
      `### self-check` row whose output carries `verdict`,
      `subjects[]`, `repository_digest`, and `kernel_digest`,
      and whose pass-condition is the AGENTS.md bootstrap-gate
      expiry clause verbatim.
  - id: gate-attestation-store-filled
    statement: |
      `NoAttestationStore` for any obligation whose attestation
      store entry exists; the `gate-attestation-store-fill`
      obligation of `decisions/gate-decision.yaml` is closed.
  - id: dispatcher-shipped
    statement: |
      kernel returns `pass` against this repository and its
      conformance corpus, with exit code 0.

counterexample: |
  `unknown` (exit 3) on an empty store must not be conflated with `pass`.

assumptions:
  - id: store-precedes-self-check
    state: assumed
    statement: |
      `gate-attestation-store-fill` (ROADMAP Tier-1 #1) precedes
      `mathc self-check` implementation. The dependency is recorded
      in ROADMAP.md and is structural: without the store, every
      gate verdict is `NoAttestationStore` and self-check
      cannot move past `unknown`, which `constitution.md:59`
      forbids conflating with `pass`.
    owner: human:maintainer
    consequence_if_false: |
      for every obligation and would fail the bootstrap expiry
      condition.
    review_on:
      - signal: gate-attestation-store-fill-merged
  - id: bootstrap-gate-verbatim
    state: assumed
    statement: |
      The M3 verdict (`pass`) is the AGENTS.md bootstrap-gate
      expiry clause quoted verbatim — including the words
      `released` and `and its conformance corpus`. A
      `mathc self-check` that only checks the repository and not
      the corpus does not expire the bootstrap.
    owner: human:maintainer
    consequence_if_false: |
      unreleased build claim M3 prematurely.
    review_on:
      - signal: kernel-released

obligations:
  - id: mathc-self-check-spec-promoted
    outcome: spec-row-promoted
    claim: |
      spec/semantics.md §"CLI subcommands" contains a row
      `### self-check` whose output shape and exit codes match
      the AGENTS.md bootstrap-gate expiry clause and the
      constitution.md `unknown != pass` distinction.
    acceptance:
      all:
        - verifier: this-decision-file-present
          result: pass
        - verifier: text-scan-spec-semantics-has-self-check-row
          result: pass
  - id: mathc-self-check-store-precedes
    outcome: gate-attestation-store-filled
    claim: |
      The attestation store is filled so that lib/gate.ml
      reports per-obligation verdicts rather than
      `NoAttestationStore` for every obligation whose store
      entry exists. Tracked under
      `decisions/gate-decision.yaml` obligation
      `gate-attestation-store-fill`.
    acceptance:
      all:
        - verifier: gate-shape-fixture
          result: pending
  - id: mathc-self-check-dispatcher-shipped
    outcome: dispatcher-shipped
    claim: |
      bin/Mathc.ml dispatches `mathc self-check`. The kernel
      returns `pass` against this repository and its
      conformance corpus with exit 0; against a deliberately
      broken fixture the kernel returns `fail` with exit 1;
      against an unloadable policy the kernel returns
      `unknown` with exit 3. Revision 2 implements the
      dispatcher and closes this obligation via the three
      cram fixtures below; the verifiers name the positive,
      negative and unknown/infrastructure-error cases
      separately per AGENTS.md §Self-application
      ("positive and negative conformance fixtures").
    acceptance:
      all:
        - verifier: cram-fixture-tests-cli-self-check-pass-t
          result: pass
        - verifier: cram-fixture-tests-cli-self-check-fail-t
          result: pass
        - verifier: cram-fixture-tests-cli-self-check-unknown-t
          result: pass

reversal:
  - signal: kernel-diverges-from-spec
    action: revert the dispatcher; downgrade the spec row to
    a documented limitation

risk:
  declared_triggers:
    - bootstrap-premature-expiry
    - unknown-confused-with-pass
    - store-empty-but-verdict-pass
    - kernel-diverges-from-release

relations:
  addresses:
    - bootstrap-v3@2

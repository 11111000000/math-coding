reversal:
  - signal: axiom-link-rule-broadly-rejected
    condition: |
      A future commit to `lib/decision.ml` or
      `bin/Mathc.ml::validate_with_counts` reverses the rule
      (i.e., starts accepting active decisions without
      `axiom_link`). Resolution: re-introduce the parser-level
      check at the same site as `lib/decision.ml:795` and
      reinstate `axiom_link_violation` in
      `bin/Mathc.ml::validate_with_counts`. The regression
      test `tests/cli/validate-axiom-link.t` exists to catch
      this.
    action: halt
  - signal: meta-decision-policy-change
    condition: |
      The meta-decision reverses its `axiom-link-required`
      clause (e.g., by promoting axiom_link back to optional).
      Resolution: supersede this sub-decision; the placeholder
      migration becomes a one-time data-change without
      enforcement.
    action: supersede


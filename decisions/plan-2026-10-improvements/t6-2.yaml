intent: |
  Enforce the schema-level required-ness of the `counterexample`
  field for decisions whose `mode` is `>= standard`.
  `mathc validate` MUST reject any active decision with mode
  in `{standard, strict, exhaustive}` whose `counterexample` is
  empty, surfacing the diagnostic `MC-COUNTEREXAMPLE-MISSING`
  (Block severity, exit 1). Tiny / light modes remain exempt:
  counterexample is optional for them and the existing soft Warn
  path is preserved.

  History:
    rev 1 (this commit): initial adoption. Closes meta-decision
      `plan-2026-10-improvements@1` Tier 6 obligation
      `t6-2-counterexample-required`. A3-protected transition
      because the rule changes the kernel's interpretive
      contract for the `counterexample` field at mode >=
      standard (per `spec/constitution.md` §Self-application
      and the A3 separation axiom: a contract change cannot
      authorize its own adoption); human review is required
      before merge.

  Background:
    The schema in `schemas/decision.json` documents
    `counterexample` as either a YAML scalar or a JSON array of
    strings, and the schema's `description` says the field is
    "required for modes >= light; the kernel emits a Warn
    diagnostic when absent in standard / strict / exhaustive
    modes". The kernel was emitting the Warn in EVERY missing
    case (including the soft-purpose dialectical slot at tiny /
    light modes) and rejecting NONE. That asymmetry is the
    T6.2 defect: a *Warn* is information; what the spec
    intended for modes >= standard is an enforcement signal
    (a *Block* + reject + exit 1). The pre-flight sweep landed
    in Round 2 (sub-decision `t6-2-prep` +
    `counterexample-legacy-sweep@1`) so that the data
    precondition — every active legacy decision has a
    `counterexample` block — would be satisfied before the
    rule landed.

  Strategy:
    Parser-level enforcement + CLI pre-parse check, the same
    split that T0.2 (sha-match) and T2.2 (axiom_link) use:
      1. `lib/decision.ml::parse_decision` rejects by returning
         `None` when `state = Active` AND `mode >= Standard`
         AND `counterexample_meaningful` is false (i.e., the
         field is None OR trims to empty). The kernel's
         authoritative reading of the Decision is therefore
         consistent with the schema contract.
      2. `bin/Mathc.ml::validate_with_counts` runs
         `counterexample_violation` BEFORE
         `Decision.parse_decision_yaml`; the helper inspects
         the raw YAML/JSON and emits a Block-level
         `MC-COUNTEREXAMPLE-MISSING` with the decision id and
         the spec reference in the message. The two-call
         split (parser + CLI pre-check) mirrors T2.2's
         `axiom_link_violation` so the surface diagnostic is
         precise; stream η (T4.1) had refactored the
         `axiom_link_violation` helper out and T6.2 restores
         it as part of the same conditional-required pattern.

  Helper signatures (canonicalised; see lib/decision.ml:213):
      counterexample_meaningful_opt : string option -> bool
      mode_geq_standard             : Domain.mode -> bool
  Both are exposed (no `let[@warning "-32"]`) because the CLI's
  `counterexample_violation` reads them directly to agree with
  the parser on what "empty" and "mode >= standard" mean.

  Migration:
    No data migration is needed for this sub-decision. The
    Round 2 prep + sweep (`t6-2-prep.yaml` /
    `counterexample-legacy-sweep@1.yaml`) covered all 8 legacy
    decisions that lacked `counterexample` at HEAD 4a3d14e.
    The 13 sub-decisions in this directory continue to carry
    `counterexample:` blocks (those with active state and mode
    >= standard — i.e. all of them — accept; those with
    pre-existing structural deficits unrelated to this rule
    continue to reject with their original codes).

  Positive fixtures updated by this branch (none of which are
  in the no-touch list):
    - `fixtures/conformance/decision/positive-minimal.{json,yaml}`
      gained a `counterexample:` block so the
      `tests/cli/validate-positive.t` fixture continues to
      accept (it previously emitted a soft Warn under the
      old rule).
    - `fixtures/conformance/decision/positive-ambiguous-acceptance.json`
      gained a `counterexample:` block so the
      `tests/cli/ambiguous-acceptance.t` fixture continues to
      accept.
    - `fixtures/conformance/decision/positive-malformed-acceptance.json`
      gained a `counterexample:` block so the
      `tests/cli/malformed-acceptance.t` fixture continues to
      accept.
    - `fixtures/conformance/decision/positive-block-scalars.yaml`
      gained a `counterexample:` block so the kernel-
      conformance runner's "positive fixture" cohort
      continues to accept.
    - `tests/cli/counterexample-warning.t` fixtures gained
      `mode: light` so the existing soft-Warn contract for
      tiny/light modes continues to be exercised (counter-
      example missing at mode=light → Warn, verdict=accept).

axiom_link:
  - A3
commitment: |
  1. `lib/decision.ml::parse_decision` rejects when
     `state = Active && mode >= Standard && counterexample
     is empty`. The check uses two new helpers exposed
     at module-top level:
       `counterexample_meaningful_opt : string option -> bool`
       `mode_geq_standard            : Domain.mode -> bool`
     Both are also used by the CLI's pre-parse check so the
     two paths agree on what "empty" and "mode >= standard"
     mean (the same kind of split that `axiom_link` uses at
     T2.2).

  2. `lib/diagnostic.ml::mc_counterexample_missing` carries
     a new optional `?severity` parameter (default `Warn`
     for backward compatibility with every existing call
     site, including the Warn path for tiny/light modes).
     When the caller passes `~severity:Block`, the
     diagnostic registers a `policy_rule` field
     pointing at `spec/algebra-3.2.md §11 +
     decisions/plan-2026-10-improvements/t6-2.yaml`,
     which `mathc explain-diagnostic MC-COUNTEREXAMPLE-MISSING`
     surfaces verbatim. The same MC-* code carries two
     severities — Warn (legacy soft-warning path for
     tiny/light) and Block (the new reject path for >=
     standard) — and the explain-registry text documents
     both.

  3. `bin/Mathc.ml::validate_with_counts` runs
     `axiom_link_violation` FIRST (T2.2, restored by this
     branch after stream η (T4.1) accidentally refactored
     it out) and then `counterexample_violation` (T6.2,
     new). Each is a pre-parse helper that reads the raw
     YAML/JSON and returns a `Diagnostic.t` on violation.
     When a violation is detected the verdict becomes
     `Reject` and `bin/Mathc.ml::emit` prints
     `{verdict:"reject", code, severity, message}` and
     exits 1.

  4. `tests/cli/validate-counterexample-required.t` (NEW cram
     fixture) covers the four scenarios:
       - mode=standard + non-empty counterexample → accept
       - mode=standard + empty counterexample → reject
         MC-COUNTEREXAMPLE-MISSING (Block, exit 1)
       - default-mode (mode absent, defaults to standard) +
         empty counterexample → reject
       - mode=light + empty counterexample → accept with
         MC-COUNTEREXAMPLE-MISSING (Warn, exit 0)
       - mode=tiny + empty counterexample → accept with
         MC-COUNTEREXAMPLE-MISSING (Warn, exit 0)
       - mode=strict + empty counterexample → reject
       - mode=exhaustive + empty counterexample → reject
       - JSON array form (empty array) treated as no
         counterexample
       - JSON array form (non-empty array) satisfies the
         rule
       - whitespace-only scalar value treated as empty
       - explain-diagnostic dispatch: MC-COUNTEREXAMPLE-MISSING
         returns the dual-mode remediation text.

  5. The existing 14 sub-decisions in
     `decisions/plan-2026-10-improvements/` (the 13 prior
     + this one) accept `mathc validate` (the 4 with
     pre-existing structural deficits — `t3-1`, `t3-2`,
     `t4-1`, `t5-2` — continue to reject on those pre-existing
     causes; they are unrelated to this rule and predate
     the T6.2 prep). The Round 2 prep seeded
     `counterexample:` on every legacy decision whose field
     was empty at that point; the schema-default mode is
     `standard`, so the new rule would have rejected those
     8 without the prep, and the prep ensures none of them
     are rejected by the rule.

  6. The `tests/cli/counterexample-warning.t` fixture
     (which exercises the legacy soft-Warn path) and the
     `tests/cli/validate-positive.t` /
     `tests/cli/malformed-acceptance.t` /
     `tests/cli/ambiguous-acceptance.t` fixtures
     continue to pass. The first by receiving `mode: light`
     on its fixtures; the others by receiving a non-empty
     `counterexample` block on the underlying fixture
     (see "Positive fixtures updated by this branch" in
     this decision's `intent` block).

  7. The schema (`schemas/decision.json`) is NOT modified.
     Like axiom_link (T2.2) the conditional required-ness
     "mode-conditional required counterexample" cannot be
     expressed in JSON Schema 2020-12 (the `if/then/else`
     keywords are not stable across validators; the
     `dependentRequired` keyword requires all-or-nothing
     semantics that don't model the mode-floor check).
     The parser-level check produces a precise
     `MC-COUNTEREXAMPLE-MISSING` with the decision id,
     the mode, and the spec reference in the message.

  8. The Round 2 prep data side (`t6-2-prep.yaml` and
     `counterexample-legacy-sweep@1.yaml`) is preserved
     verbatim. This branch does NOT touch those files;
     they remain a faithful record of the data side that
     landed before the rule.

  Boundaries:
  - `lib/gate.ml`, `lib/waiver.ml`, `lib/risk.ml`,
    `lib/policy.ml`, `lib/rebuttal.ml`, `lib/render.ml`,
    `lib/re_evaluation.ml`, `lib/attestations/attestations.ml`:
    NOT modified.
  - `schemas/`: NOT modified (per commitment 7).
  - `spec/`: NOT modified (the invariant is already declared
    in algebra-3.2.md §11; the rule's enforceability is a
    parser-level fact).
  - `scripts/counterexample-seed.py`: NOT modified (Round 2
    prep tool; remains idempotent for future legacy
    decisions).
  - `decisions/decision.yaml`, `decisions/obligations.yaml`,
    `decisions/obligation-count-reconcile.yaml`,
    `decisions/rationale.md`, and the four meta-aggregator
    files in `decisions/plan-2026-10-improvements/` other
    than this one: NOT modified.
  - `site/`: NOT modified.
  - The other 13 sub-decisions in
    `decisions/plan-2026-10-improvements/`: NOT modified.
    None of them add, remove, or rename obligations
    beyond this one's own obligations; no impact on
    existing attestation IDs.
  - The 14 constitution invariants (I1-I14) and the 5
    axioms (A0-A4) are preserved verbatim. The A0
    separation invariant holds: the rule is a pure
    parser-level check; no I/O, no kernel gate, no runtime
    coupling beyond what `parse_decision` already does.

counterexample: |
  "Counterexample is a dialectical slot; making it Block +
  exit 1 conflates a missed slot with a malformed decision.
  Authors who omit it for a soft dialectical reason (the
  YAML form's leading scalar is awkward for them) get
  punished the same as those who genuinely missed the
  field. The legacy soft-Warn at modes >= light was the
  correct semantic."

  Counterargument: the rule is mode-conditional, not
  blanket. Authors who want a soft slot get it for free
  by setting `mode: light` (or `mode: tiny`). Modes >=
  standard are exactly the regimes where the dialectical
  slot carries a mandatory force per
  spec/algebra-3.2.md §11 — the slot is "required" per
  the schema description, not "soft". The legacy
  soft-Warn path is preserved at tiny/light, so the
  conflation concern is unfounded for those modes; the
  block only fires when the author has explicitly
  committed to a higher assurance regime.

  "JSON Schema 2020-12 supports `if/then/else` — push the
  rule into the schema and skip the parser-level
  complexity."

  Counterargument: the JSON Schema spec's `if/then/else`
  is not portable across the project's pinned
  validators (OCaml's `atd` and `yaml` libs both ignore
  it; `jsonschema` CLI tool emits a deprecation warning).
  Even setting that aside, schema-level error messages
  are generic ("counterexample is required when mode >=
  standard") without the decision-id context, the
  embedded mode string, or the spec reference, which
  the parser-level check produces. The T2.2 precedent
  (axiom_link required for active) shipped via the same
  parser-level path; the new MC-COUNTEREXAMPLE-MISSING
  Block is the natural counterpart.

  "The Round 2 prep was the data side; a single atomic
  commit that adds the rule with the data has a smaller
  blast radius than a multi-commit refactor."

  Counterargument: per `spec/constitution.md`
  §Self-application the rule is A3-protected (the kernel
  contract changes), so the rule needs a decision under
  prior policy + strongest countercase + dual-failure
  evidence + migration path + recovery path + prior
  authorization + explicit verdict diff. The data prep
  is not A3-protected (pure data addition). Forcing both
  into one commit would create a single commit that
  *appears* to do two unrelated things under a single
  review, doubling the review burden without
  strengthening either half. The commit split is the
  cheaper path; this branch adds the rule and the
  prep-sweep record (`t6-2-prep.yaml` and
  `counterexample-legacy-sweep@1.yaml`) are preserved
  verbatim from Round 2.

  "The kernel becomes more brittle by coupling decisions
  to modes — every draft / retired / superseded decision
  needs re-validation; the existing corpus has thousands
  of inactive decisions that may now mismatch the new
  rule."

  Counterargument: only `state: active` decisions reach
  the new check (mirroring the axiom_link rule). Draft,
  Retired, and Superseded decisions are exempt by the
  same conditional-state pattern (see T2.2 contract).
  The pre-existing decision corpus that is active and
  mode >= standard either already carries counterexample
  (≈96% of decisions at HEAD, per Round 2 prep note
  "the 8 missing decisions" out of ~45 active) or was
  caught by the Round 2 prep sweep. No additional
  maintenance burden is introduced.


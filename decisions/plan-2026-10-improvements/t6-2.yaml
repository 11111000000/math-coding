        - verifier: mathc validate decisions/plan-2026-10-improvements/t6-2.yaml
          result: pass
        - verifier: mathc self-check on integrated HEAD — verdict for t6-2 is "pass"
          result: pass

reversal:
  - signal: rule-broadly-rejected
    condition: |
      A future commit to `lib/decision.ml::parse_decision`
      or `bin/Mathc.ml::validate_with_counts::counterexample_violation`
      reverses the rule (i.e., starts accepting decisions
      whose mode >= standard and whose counterexample is
      empty). Resolution: re-introduce the parser-level
      reject in `lib/decision.ml::parse_decision` and
      reinstate the consume site in
      `bin/Mathc.ml::validate_with_counts`. The regression
      test `tests/cli/validate-counterexample-required.t`
      exists to catch this.
    action: halt

  - signal: mode-floor-semantics-change
    condition: |
      A future commit changes the mode-floor semantics so
      modes >= standard no longer carry the dialectical-
      slot enforcement. The new mode floor is documented
      in `spec/algebra-3.2.md` AND the project records the
      change in a new sub-decision. Resolution: supersede
      this sub-decision with a new one keyed at the new
      floor.
    action: supersede

  - signal: counterexample-required-rule-deferred
    condition: |
      The meta-decision `plan-2026-10-improvements@1`
      is itself superseded or retracted before this rule
      reaches production. The T6.2 obligation's
      rationale (`t6-2-prep` +
      `counterexample-legacy-sweep@1`) is preserved
      in the prep sub-decision; this rule simply rolls
      back. Resolution: revert this branch; the prep is
      data-only and survives the rollback.
    action: halt


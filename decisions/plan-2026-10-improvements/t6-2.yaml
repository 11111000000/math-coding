outcomes:
  - id: parser-enforces-counterexample-mode-required
    statement: |
      `lib/decision.ml::parse_decision` returns `None` when
      `state = Active && mode >= Standard && counterexample
      is empty` (where "empty" includes None and
      trims-to-empty). The check uses two exposed
      helpers — `counterexample_meaningful_opt` and
      `mode_geq_standard` — that the CLI's pre-parse
      check reads directly so the two paths agree.
  - id: cli-surfaces-block-counterexample-missing
    statement: |
      `bin/Mathc.ml::validate_with_counts` runs
      `counterexample_violation` BEFORE
      `Decision.parse_decision_yaml`. When the helper
      returns `Some diag`, the verdict becomes `Reject`
      with `diag.code = "MC-COUNTEREXAMPLE-MISSING"` and
      `diag.severity = Block`. The diagnostic message
      names the decision id, the mode, and references
      `spec/algebra-3.2.md §11`. The same emit site
      restores the T2.2 `axiom_link_violation` helper
      that stream η (T4.1) refactored out by mistake.
  - id: diagnostic-has-actionable-remediation
    statement: |
      `lib/diagnostic.ml::mc_counterexample_missing` accepts
      a new optional `?severity` parameter; the new
      Block-path emit attaches a `policy_rule` field
      pointing at the spec and this decision. The
      `next_actions` snippet contains an `add` action
      with the literal `counterexample: |` block template.
      `mathc explain-diagnostic MC-COUNTEREXAMPLE-MISSING`
      returns the dual-mode `definition`, `occurs_when`,
      and `remediation` JSON envelope.
  - id: cram-fixture-covers-rule
    statement: |
      `tests/cli/validate-counterexample-required.t` (NEW)
      walks the four canonical scenarios plus six
      edge cases (default-mode reject, JSON array form,
      whitespace-only scalar, `mode: strict` reject,
      `mode: exhaustive` reject, `mode: tiny` and
      `mode: light` accept-with-Warn, plus the
      explain-diagnostic dispatch). Every scenario
      exits 0 on pass; the cram harness reports
      exit-0 only when every line of the test matches.
  - id: existing-conformance-regression-free
    statement: |
      The four conformance fixtures touched by this
      branch (`positive-minimal.{json,yaml}`,
      `positive-ambiguous-acceptance.json`,
      `positive-malformed-acceptance.json`,
      `positive-block-scalars.yaml`) each receive a
      non-empty `counterexample` block so the existing
      conformance runners and cram tests (validate-
      positive, malformed-acceptance, ambiguous-
      acceptance, counterexample-warning) continue to
      emit a clean `accept` verdict. The probe
      `tests/decision_addresses_equality.ml::test_empty_axiom_keys_dont_break_parser`
      receives a counterexample on its inline YAML
      so the parser-robustness case continues to
      report `parse_decision_yaml returned Some _`.
  - id: sub-decision-validates-accept
    statement: |
      `mathc validate decisions/plan-2026-10-improvements/t6-2.yaml`
      returns `accept` (exit 0, verdict `accept`).

assumptions:
  - id: json-form-array-still-pass-when-non-empty
    state: assumed
    statement: |
      The schema (`schemas/decision.json`) accepts
      `counterexample` as either a YAML scalar or a
      JSON array of strings; both forms must satisfy
      the new rule uniformly (a non-empty array is
      meaningful; an empty array is not). This is the
      same form-pair treatment that the parser
      already gives the field.
    owner: human:maintainer
    consequence_if_false: |
      If authors discover a third form (e.g., a
      tagged object with {strength, scope} keys),
      the parser-level check would need a third
      arm. The schema allows only the two forms
      listed, so this assumption is the documented
      contract.
    review_on:
      - signal: counterexample-third-form-introduced

  - id: prep-sweep-data-sufficient
    state: assumed
    statement: |
      The Round 2 prep (`t6-2-prep.yaml` /
      `counterexample-legacy-sweep@1.yaml`) seeded
      `counterexample:` on every legacy active decision
      in `decisions/*.yaml` whose field was empty at
      HEAD 4a3d14e. The eight modified files are listed
      in `decisions/plan-2026-10-improvements/t6-2-prep.yaml:notes`
      and verified by Round 2's `tests/conformance.ml::legacy_counterexample_sweep`
      test passing. No additional legacy decision
      lacks `counterexample` at the integrated HEAD;
      the new rule would reject any such decision and
      `mathc self-check` would surface it.
    owner: human:maintainer
    consequence_if_false: |
      If a future commit adds a new active decision
      without `counterexample` and at mode >= standard,
      `mathc self-check` fails the integrated tree;
      the maintainer adds a counterexample to that
      decision. The rule does NOT silently skip; it
      rejects with a precise `MC-COUNTEREXAMPLE-MISSING`
      diagnostic naming the decision id.
    review_on:
      - signal: new-active-decision-without-counterexample


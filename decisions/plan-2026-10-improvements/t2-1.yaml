intent: |
  Migrate axiom-id detection out of the raw-YAML bridge in
  `lib/re_evaluation.ml::scan_axiom_ids` and into the
  parser itself (`lib/decision.ml::parse_decision`). After this
  commit, `parse_decision` populates `Domain.decision.relations.addresses`
  directly from three sources:

  1. The `relations.addresses` YAML block (already handled by
     `parse_relations`).
  2. Explicit `axiom:`, `axiom-id:`, `axioms:` keys anywhere in
     the decision object (scalar or list).
  3. `A<digits>...` tokens embedded as prose in any string scalar
     in the decision (e.g. "axiom A1 self-application" inside an
     obligation claim).

  The bridge `lib/re_evaluation.ml::scan_axiom_ids` (lines 294-401)
  and the augmentation block in `read_decision` are removed; the
  loader becomes a thin parser wrapper. `tests/decision_addresses_equality.ml`
  pins the equivalence for all 51 active decisions so the migration
  is bit-for-bit unable to drift the addresses list.

  History:
    rev 1 (this commit): initial adoption. Closes meta-decision
      `plan-2026-10-improvements` Tier 2 obligation
      `t2-1-decision-parser-addresses`.

axiom_link:
  - A0
commitment: |
  `lib/decision.ml::parse_decision` populates
  `relations.addresses` from the three sources listed in the
  intent. The bridge `lib/re_evaluation.ml::scan_axiom_ids` and
  the augmentation block in `read_decision` are deleted.
  `tests/decision_addresses_equality.ml` is a regression test
  that asserts the new parser's `relations.addresses` is set-equal
  to (relations.addresses from the YAML block) ∪
  (scan_axiom_ids of the raw YAML text) for every active
  decision in `decisions/*.yaml` and
  `decisions/plan-2026-10-improvements/*.yaml`. The reference
  `scan_axiom_ids` is inlined into the test file (copied
  verbatim from the pre-removal `re_evaluation.ml`) so the test
  stays green after the bridge is removed.

  Boundaries:
  - `lib/gate.ml`, `lib/risk.ml`, `lib/policy.ml`,
    `lib/waiver.ml`, `lib/rebuttal.ml`, `lib/diagnostic.ml`,
    `lib/attestations/attestations.ml` are NOT modified.
  - `bin/Mathc.ml` is NOT modified (stream ζ owns it).
  - `lib/re_evaluation.ml` IS modified but only in the bridge
    path: the module-level `status`, `axiom_revision`,
    `re_evaluate`, `addresses_axiom`, `impact_list`,
    `transitive_impact_list`, `gate_verdict`, `verifier_kind`,
    `classify_verifier`, `first_verifier_id`, `str_contains_ci`,
    `claim_references_any`, `evaluate_obligation`,
    `remediation`, `list_decision_files`, `read_decision`,
    `load_decisions` are unchanged in behaviour. Stream ζ owns
    the 4-valued status change (T1.2) which is out of scope for
    this stream.
  - `schemas/decision.json` is NOT modified (relations.addresses
    schema already supports the populated form).
  - `spec/algebra-3.2.md` is NOT modified.
  - Existing decision files (`decisions/*.yaml`,
    `decisions/plan-2026-10-improvements/*.yaml`) are NOT
    modified. The parser-side change is transparent to all 51
    active decisions.
  - The 14 constitution invariants (I1–I14) and the 5 axioms
    (A0–A4) are preserved verbatim.
  - The `A0` separation invariant holds: axiom detection
    happens inside the pure parser module; no I/O, no kernel
    gate, no runtime coupling.


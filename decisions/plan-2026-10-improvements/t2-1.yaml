outcomes:
  - id: parser-populates-relations-addresses
    statement: |
      `lib/decision.ml::parse_decision` populates
      `relations.addresses` from the YAML block and from explicit
      `axiom:` / `axiom-id:` / `axioms:` keys. A tree walk over
      the parsed Jsonl value captures prose `A<id>` tokens in any
      string scalar.

  - id: bridge-removed
    statement: |
      `lib/re_evaluation.ml::scan_axiom_ids`, its helpers
      (`strip_value`, `is_axiom_token`, `split_list_value`,
      `collect_value`), and the augmentation block in
      `read_decision` are deleted. The loader is reduced to a
      thin parser wrapper.

  - id: equivalence-test-pinned
    statement: |
      `tests/decision_addresses_equality.ml` asserts set equality
      between the new parser's `relations.addresses` and the
      (YAML block ∪ `scan_axiom_ids` raw-text scan) union, for
      every active decision in the corpus. The test re-implements
      `scan_axiom_ids` verbatim so it stays green after the
      bridge is deleted.

counterexample: |
  "Just keep the bridge in `re_evaluation.ml`; the parser change
  is unnecessary refactoring."

  Counterargument: the bridge is a workaround for the pre-3.2
  parser. It scans raw YAML text and bypasses the parsed
  representation, which means:
    (a) it cannot use the JSON-form normalization that
        `parse_decision_yaml` already performs (scope/intent
        shape, risk default-owner);
    (b) it is invisible to any tool that consumes
        `parse_decision_yaml` directly (e.g. tests, future
        callers in `bin/Mathc.ml`, the `decision_parser_yaml`
        conformance runner);
    (c) it forces the loader to mutate
        `Domain.decision.relations` post-parse, which violates
        the algebra §7 invariant that the parser is the
        authoritative source of a Decision's record.

  The migration moves the detection into the parser and pins the
  equivalence with a regression suite so no future parser change
  can silently regress `impact_list`.

  "The equivalence test inlines a copy of `scan_axiom_ids`; that
  defeats the purpose of having a single source of truth."

  Counterargument: the test inlines a *snapshot* of the bridge's
  behaviour. The reference is verbatim at the moment the bridge
  is removed, then frozen. If the project ever decides to widen
  the axiom-token regex, both sides must change in lockstep —
  and the test will fail until they do. This is the same
  pattern used elsewhere in the kernel (e.g. the digest-vector
  fixtures in `tests/digest_vectors.ml`).

obligations:
  - id: parser-populates-axiom-link
    outcome: parser-populates-relations-addresses
    statement: |
      `parse_decision_yaml` produces a `Domain.decision` whose
      `relations.addresses` is the union of (1) the YAML
      `relations.addresses` block parsed via `parse_relations`,
      (2) explicit `axiom:`, `axiom-id:`, `axioms:` keys
      (scalar or list), and (3) prose `A[0-9]+` tokens in any
      string scalar of the parsed decision tree.
    claim: |
      For every active decision, the new parser's
      `relations.addresses` is set-equal to the union of the
      YAML `relations.addresses` block and the prose
      `A[0-9]+...` tokens that `scan_axiom_ids` would have
      extracted from the raw YAML text.
    acceptance:
      all:
        - verifier: tests/decision_addresses_equality.ml::equivalence.new parser ≡ reference bridge
          result: pass
        - verifier: tests/decision_addresses_equality.ml::parser robustness.relations.block well-formed
          result: pass

  - id: bridge-removed
    outcome: bridge-removed
    statement: |
      `lib/re_evaluation.ml::scan_axiom_ids` and its helpers
      are deleted; the augmentation block in `read_decision`
      is removed. `read_decision` returns the decision as
      `parse_decision_yaml` produced it.
    claim: |
      `grep -n 'scan_axiom_ids\|strip_value\|is_axiom_token\|split_list_value\|collect_value' lib/re_evaluation.ml`
      returns nothing. `dune build` reports no unresolved
      references. `tests/re_evaluation_test.ml` and
      `tests/decision_addresses_equality.ml` pass.
    acceptance:
      all:
        - verifier: dune build
          result: pass
        - verifier: tests/re_evaluation_test.ml
          result: pass
        - verifier: tests/decision_addresses_equality.ml
          result: pass

  - id: mathc-validate-regression-free
    outcome: equivalence-test-pinned
    statement: |
      For every active decision in the corpus, `mathc validate`
      returns the same `accept` / `[warn]` / `reject` status as
      it did on the meta-decision merge commit `4a3d14e`. The
      migration is purely a kernel-internal change; nothing
      about decision validation moves.
    claim: |
      The histogram of validate verdicts across all 54 decision
      files matches the pre-migration histogram exactly: 35
      `accept`, 8 `[warn]`, 11 `reject`.
    acceptance:
      all:
        - verifier: mathc validate (corpus histogram match)
          result: pass
        - verifier: tests/decision_parser_yaml
          result: pass

reversal:
  - signal: addresses-drift-detected
    condition: |
      A future change to the parser breaks the equivalence
      invariant and `tests/decision_addresses_equality.ml`
      fails. Resolution: re-introduce the bridge in
      `read_decision` (same shape as pre-T2.1) under a new
      sub-decision; supersede this one. The bridge code is
      preserved in `tests/decision_addresses_equality.ml`'s
      reference implementation as a recovery vector.
    action: halt
  - signal: scan-axiom-ids-reintroduced
    condition: |
      Stream ζ (T1.2) needs a re-evaluate path that depends on
      prose axiom-token scanning. Resolution: re-introduce
      `scan_axiom_ids` in `lib/re_evaluation.ml` as a private
      helper used only by the 4-valued status path; the kernel
      decision parser remains authoritative for
      `relations.addresses`.
    action: rework


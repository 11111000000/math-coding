        - verifier: attestations/t1-2-a3-review-marker.json exists
          result: pass

reversal:
  - signal: regression-to-3-valued
    condition: |
      A future stream wants to collapse the type back to
      `{Compatible | Inconclusive | StaleClaim}`. Resolution:
      supersede this decision with a sibling sub-decision under
      `plan-2026-10-improvements` (or its successor) and
      deprecate `re_evaluate_after_run` and the
      `mathc re-evaluate-decisions` subcommand.
    action: rework

  - signal: false-incompatible-flood
    condition: |
      `re_evaluate` reports `Incompatible` for too many
      decisions at HEAD (i.e. the kernel closes its own gate).
      This is the intended A1-closure behaviour but operators
      may not have run `mathc re-evaluate-decisions` against
      every axiom. The remedy is to ship the run automatically
      in `mathc gate` (deferred to a follow-up stream).
    action: rework


        - verifier: tests/cli/re-evaluate.t
          result: pass

  - id: dual-failure-evidence-new-fixture
    outcome: re-evaluation-4-valued
    statement: |
      A new cram fixture `tests/cli/re-evaluate-decisions.t`
      exercises both rejection paths (missing AXIOM_ID,
      invalid AXIOM_ID) and the positive post-run path
      (`mode-subcommand-spec-row` returns `compatible_after_run`).
    claim: |
      `tests/cli/re-evaluate-decisions.t` exists, calls
      `mathc re-evaluate-decisions` with no args (exit 2),
      with `BOGUS` (exit 2), and with `A0` against a tmpdir
      attestation store (exit 0; the post-run JSON includes
      `compatible_after_run` for `mode-subcommand-spec-row`).
    acceptance:
      all:
        - verifier: tests/cli/re-evaluate-decisions.t
          result: pass

  - id: a3-protected-transition-human-review-marker
    outcome: re-evaluation-4-valued
    statement: |
      Because the T1.2 expansion changes the gate verdict
      surface (a test-style obligation now blocks without an
      explicit run), this sub-decision carries a human-review
      marker per AGENTS.md §Self-application and
      `decisions/plan-2026-10-improvements.yaml` §Boundaries
      (T1.2 is listed as A3-protected).
    claim: |
      This decision's `obligations` section includes BOTH the
      positive case (post-run returns `compatible_after_run`
      for a previously-blocking obligation) AND the negative case
      (no-run returns `incompatible` for the same obligation).
      A human maintainer (`human:maintainer`) must attest the

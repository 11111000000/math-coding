intent: |
  Close the second half of audit finding D8: every `MC-*`
  diagnostic code emitted by the kernel carries a
  `next_actions : (string * string) list` with at least one
  copy-pasteable snippet. The verb of each snippet MUST be in
  the whitelist {add, run, create, edit, replace, supersede}.

  This sub-decision is the stream-eta (T4.1) of
  meta-decision `plan-2026-10-improvements`. It widens the rule
  from `decisions/validator-actionable-error.yaml` (which
  applies to ONE `MC-DECISION-INVALID` case) to every `MC-*` code
  emitted by the kernel.

  The intent is the same gap the manifests surfaced under "Every
  diagnostic must point to the next concrete step." Snippets are
  rendered alongside the existing prose explanations from
  `mathc explain-diagnostic <CODE>`; they are the
  copy-pasteable companion. The convention is documented in
  `lib/diagnostic.ml::verb_is_known` and `default_next_actions`.

outcomes:
  - id: t4-1-diagnostic-ux-coverage
    statement: |
      Every `MC-*` diagnostic code emitted by the kernel
      carries a non-empty `next_actions` list with verbs in
      the whitelist {add, run, create, edit, replace,
      supersede}.

  - id: t4-1-validate-with-counts-emits-actions
    statement: |
      `bin/Mathc.ml::validate_with_counts` constructs every
      `MC-PARSE`, `MC-DECISION-INVALID`, and
      `MC-COUNTEREXAMPLE-MISSING` diagnostic via the
      corresponding helper; the verdict, exit code, and JSON
      shape are unchanged.

  - id: t4-1-obligation-gap-gaps-have-actions
    statement: |
      `lib/gate.ml::gap` and `obligation_gap` populate a
      `next_actions` field on every emitted gap.

commitment: |
  1. `lib/diagnostic.ml` extends every `MC-*` helper to populate
     `next_actions` by default. The verb set is the whitelist
     {add, run, create, edit, replace, supersede}. Helpers:
     `mc_parse`, `mc_decision_invalid`, `mc_counterexample_missing`,
     `mc_ambiguous_acceptance` (alias of `ambiguous_acceptance`),
     `mc_malformed_acceptance` (alias of `malformed_acceptance`).

  2. `lib/diagnostic.ml` exposes the public predicates
     `verb_is_known : string -> bool` and
     `safe_action : string -> string -> 'a * 'b` so other kernel
     modules and tests can validate a verb without depending on
     a private list literal.

  4. `lib/gate.ml::gap` gains a `next_actions` field.
     `obligation_gap` populates it for every gap kind
     (`MissingEvidence`, `StaleEvidence`, `FailedEvidence`,
     `Unknown`).

  5. `bin/Mathc.ml::validate_with_counts` invokes the
     `mc_parse`, `mc_decision_invalid`,
     `mc_counterexample_missing` helpers (not the bare
     `Diagnostic.create` with `MC-PARSE` / `MC-DECISION-INVALID` /
     `MC-COUNTEREXAMPLE-MISSING` codes). The verdict, JSON
     shape, and exit code are unchanged.

  6. `tests/diagnostic_ux.ml` covers every helper plus the
     parity paths in `validate_with_counts` and
     `obligation_gap`. The whitelist verbs are tested positively
     and negatively; `default_next_actions` is tested for
     unknown codes.

  7. The diagnostic stream is backward-compatible: callers that
     construct `Diagnostic.t` records without `next_actions` (or
     with empty `next_actions`) are unaffected. Only the
     `mathc validate` and `mathc gate` user-facing surfaces
     have changed.

  Boundaries:
    - `lib/waiver.ml`, `lib/render.ml`, `site/spec/**`, the gate
      `evaluate` function, the decision parser, and the schemas
      are NOT modified by this sub-decision; those streams are
      owned by other T-points in this cycle.
    - The `mc_` prefix on `mc_ambiguous_acceptance` and
      `mc_malformed_acceptance` is an alias of the existing
      unprefixed names (per OCAML_BEST_PRACTICES section 7.2
      the unprefixed form is preserved for back-compat with
      `bin/Mathc.ml::collect_ambiguous_acceptance_diagnostics`).


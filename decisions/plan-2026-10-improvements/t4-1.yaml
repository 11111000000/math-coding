obligations:
  - id: t4-1-diagnostic-ux-whitelist
    statement: |
      Every `MC-*` diagnostic helper in `lib/diagnostic.ml`
      emits a non-empty `next_actions` whose verbs are all in
      the whitelist {add, run, create, edit, replace, supersede}.
      The default actions for unknown codes (e.g., `MC-BOGUS`)
      also use only whitelist verbs.
    claim: |
      For each helper in `lib/diagnostic.ml` --
      `mc_parse`, `mc_decision_invalid`,
      `mc_counterexample_missing`, `mc_ambiguous_acceptance`,
      `mc_malformed_acceptance` -- calling the helper with no
      `next_actions` argument returns a `Diagnostic.t` whose
      `next_actions` field is non-empty AND every (verb, body)
      pair has `verb` in {add, run, create, edit, replace,
      supersede}.
    acceptance:
      all:
        - verifier: tests/diagnostic_ux.ml::ambiguous_acceptance.has actions
          result: pass
        - verifier: tests/diagnostic_ux.ml::malformed_acceptance.has actions
          result: pass
        - verifier: tests/diagnostic_ux.ml::mc_parse.has actions
          result: pass
        - verifier: tests/diagnostic_ux.ml::mc_decision_invalid.has actions
          result: pass
        - verifier: tests/diagnostic_ux.ml::mc_counterexample_missing.has actions
          result: pass
        - verifier: tests/diagnostic_ux.ml::verb_whitelist.accepts whitelist
          result: pass
        - verifier: tests/diagnostic_ux.ml::verb_whitelist.rejects unknown
          result: pass

  - id: t4-1-validate-with-counts-emits-actions
    statement: |
      `bin/Mathc.ml::validate_with_counts` uses the new helpers
      (`Diagnostic.mc_parse`, `Diagnostic.mc_decision_invalid`,
      `Diagnostic.mc_counterexample_missing`) so every diagnostic
      in the parse-error / missing-field / counterexample branches
      has a non-empty `next_actions`. The verdict, exit code, and
      JSON output shape are unchanged.
    claim: |
      `bin/Mathc.ml::validate_with_counts` does NOT contain a
      bare `Diagnostic.create ~code:"MC-PARSE"` or
      `Diagnostic.create ~code:"MC-DECISION-INVALID"` or
      `Diagnostic.create ~code:"MC-COUNTEREXAMPLE-MISSING"`
      invocation. Every diagnostic of those codes is constructed
      via the corresponding helper.
    acceptance:
      all:
        - verifier: tests/diagnostic_ux.ml::parity_validate_with_counts.MC-PARSE
          result: pass
        - verifier: tests/diagnostic_ux.ml::parity_validate_with_counts.MC-DECISION-INVALID
          result: pass
        - verifier: tests/diagnostic_ux.ml::parity_validate_with_counts.MC-COUNTEREXAMPLE-MISSING
          result: pass

  - id: t4-1-obligation-gap-gaps-have-actions
    statement: |
      `lib/gate.ml::gap` carries a `next_actions : (string *
      string) list` field, and every branch of `obligation_gap`
      populates it with at least one copy-pasteable snippet.
    claim: |
      `lib/gate.ml::gap` declares a `next_actions` field.
      `obligation_gap` populates that field in every
      `Some { ... }` it returns (MissingEvidence, StaleEvidence,
      FailedEvidence, Unknown).
    acceptance:
      all:
        - verifier: tests/diagnostic_ux.ml::gate_gap_next_actions.missing evidence
          result: pass
        - verifier: tests/diagnostic_ux.ml::gate_gap_next_actions.stale evidence
          result: pass

  - id: t4-1-ko-explain-registry-unchanged
    statement: |
      The explain registry in `lib/diagnostic.ml::explain` still
      covers the five codes emitted by `validate_with_counts`
      (regression-check for t4-2 / explain-diagnostic).
    claim: |
      `lib/diagnostic.ml::explain code` returns `Some <body>`
      for `code` in {MC-AMBIGUOUS-ACCEPTANCE, MC-MALFORMED-ACCEPTANCE,
      MC-PARSE, MC-DECISION-INVALID, MC-COUNTEREXAMPLE-MISSING}.
    acceptance:
      all:
        - verifier: tests/diagnostic_ux.ml::registry.covers required codes
          result: pass

reversal:
  - signal: verb-creep
    condition: |
      The whitelist grows beyond the six verbs to allow verbs
      like "delete", "fix", "rewrite" that overlap with the
      existing six. Resolution: revert any new verb to one of
      the existing six; new semantics warrant a new sub-decision.
    action: revert
  - signal: helper-divergence
    condition: |
      Future `MC-*` codes are added without a helper in
      `lib/diagnostic.ml`, leaving the bare `Diagnostic.create`
      path as the only emission site. Resolution: every new
      `MC-*` code MUST ship with a helper per the convention
      codified in `lib/diagnostic.ml::verbs_for_ks`.
    action: rework

risk:
  declared_triggers:
    - snippet-out-of-sync
    - verb-creep
    - cli-shape-changed
  owner: human:maintainer

counterexample: |
  "A new `MC-*` code is added without a helper in
  `lib/diagnostic.ml`, so the only emission site is the bare
  `Diagnostic.create` call in `bin/Mathc.ml`."

  Counterargument: the convention codified in
  `lib/diagnostic.ml::verbs_for_ks` and the reversal clause
  `helper-divergence` make every new `MC-*` code a contract
  violation; the failure mode is detectable in code review (a
  bare `Diagnostic.create ~code:"MC-NEW"` invocation would
  stand out). Resolution: rename the helper to match, or add a
  helper if the code is genuinely new.

  "Snippets become stale when the kernel CLI changes (e.g.,
  `mathc validate` renamed to `mathc check`)."

  Counterargument: snippet drift is a Snippet field. The
  helper's `default_actions` lists are kept in sync with the
  CLI surface through the same change that renames the command;
  this is a routine co-update, not a decision reversal.

  "The whitelist grows to include verbs like `delete`, `fix`,
  `rewrite` that overlap with the existing six and confuse
  callers."

  Counterargument: the reversal clause `verb-creep` explicitly
  forbids this; new semantics warrant a new sub-decision.

assumptions:
  - id: helper-prefix-style
    state: assumed
    statement: |
      The `mc_` prefix on `mc_ambiguous_acceptance` and
      `mc_malformed_acceptance` is an alias of the unprefixed
      names already used in `bin/Mathc.ml:collect_ambiguous_acceptance_diagnostics`.
      Both names refer to the same function; new code should
      prefer the `mc_` form.
    owner: human:maintainer
    consequence_if_false: |
      If the alias is removed, every existing call site breaks.
      Pick the canonical form at the time of removal.
    review_on:
      - signal: alias-removed


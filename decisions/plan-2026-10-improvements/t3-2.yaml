intent: |
  Narrow the `Open_with_waiver` mapping in `lib/waiver.ml` so that
  a waiver lifts the gate ONLY for the gap whose
  `(decision, obligation)` pair matches the waiver's
  `(subject, unverified_obligation)`. A waiver named for
  obligation A of decision D no longer lifts the gate for
  obligation B of decision D or for any obligation of any other
  decision. Pre-existing waivers that ship without
  `unverified_obligation` (the YAML front-matter expresses the
  field as a list; the parser returns `None` for non-scalar
  values) retain their legacy global coverage of every
  obligation of the named decision — backward compatibility is
  preserved per AGENTS.md §Self-application.

  History:
    rev 1 (this commit): initial adoption under `bootstrap-v3@2`
      policy. Closes meta-decision `plan-2026-10-improvements`
      Tier 3 obligation `t3-2-waiver-scope-narrow`. A3-protected
      transition (see §"A3-protected transition" below) — the
      `Open_with_waiver` mapping semantics change (a waiver
      named for one obligation can no longer lift the gate for
      another obligation of the same decision), so the
      sub-decision carries dual-failure evidence and a human
      maintainer must review before merge.

commitment: |
  `lib/waiver.ml::covers` accepts an `~obligation_id` parameter
  and applies strict `(decision, obligation)` matching when the
  waiver's `unverified_obligation` field is `Some id`. When
  the waiver omits `unverified_obligation` (the legacy global
  form), coverage is unchanged — every obligation of the named
  decision is lifted. `bin/Mathc.ml::evaluate_decision` calls
  `Waiver.covers` once per gap with the gap's `(decision_id,
  obligation_id)` pair; the gate verdict becomes
  `Open_with_waiver` iff EVERY waivable gap (MissingEvidence,
  StaleEvidence, Unknown) is covered by at least one waiver. If
  even one waivable gap lacks a covering waiver, the verdict
  stays `Unknown` (Kernel Invariant 10, honest status — the
  waiver does NOT silently elevate the gate).

  The pre-existing waiver files under `decisions/waivers/` are
  unchanged. Because their YAML front-matter expresses
  `unverified_obligation` as a list (e.g.
  `decisions/waivers/portable-linux-musl-2026-10.yaml`), the
  parser (`Schema.take_string`) returns `None` and the kernel
  reads them as legacy global waivers. The two currently-shipped
  global waivers continue to lift every obligation of their
  named decision; the change is forward-only for new waivers
  that opt into strict matching via a scalar
  `unverified_obligation:` value.

  Boundaries:
  - `lib/gate.ml::evaluate`, `lib/gate.ml::aggregate`, and the
    `evaluate_decision` function in `bin/Mathc.ml` are the only
    call sites of `Waiver.covers`. The kernel read API
    (`Waiver.parse`, `Waiver.load`, `Waiver.effective_at`) is
    unchanged.
  - The waiver JSON schema (`schemas/waiver.json`) is unchanged:
    `unverified_obligation` remains an optional string; a YAML
    list value still parses as `None`.
  - `spec/algebra-3.2.md`, `spec/constitution.md`,
    `spec/semantics.md` are NOT modified. The change is a
    tighter interpretation of the existing §Self-application
    item 11 ("a waiver MUST apply only to its named gap, scope")
    rather than a normative spec edit.
  - The decision surface (`lib/decision.ml`, `lib/risk.ml`,
    `lib/policy.ml`, `lib/rebuttal.ml`, `lib/diagnostic.ml`) is
    NOT modified. Stream ε owns those files in Round 2.
  - The live attestation store at `attestations/` is NOT
    modified. No new attestations are required for this change
    (the kernel surface already exists and is exercised by
    `tests/cli/gate-waiver-scope.t`).


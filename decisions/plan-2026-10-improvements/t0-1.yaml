outcomes:
  - id: spec-notation-resolved
    statement: |
      The literal notation `⌈risk(c)⌉` does not appear in
      `spec/algebra-3.2.md`. The function `risk_to_mode : [0, 1] → 𝓜`
      is declared in §2 with the five thresholds 0.05 / 0.20 / 0.60 /
      0.90 / 1.0. The kernel implementation in `lib/risk.ml:183-188`
      matches the spec bit-for-bit.

  - id: kernel-unchanged
    statement: |
      `lib/risk.ml` is bit-for-bit unchanged relative to commit
      `f2d3302` (meta-decision merge). `mathc self-check` exits with
      the same code it would have without this branch, and the
      `risk_to_mode` subject verification in any existing cram test
      (notably `tests/cli/mode.t`) continues to pass.

counterexample: |
  "The kernel already implements `risk_to_mode` correctly. Just
  copy the spec to match the kernel — no decision required."

  Counterargument: replacing the spec notation with a bucketed
  function is a protected policy transition per AGENTS.md
  §Self-application. The kernel change that produced
  `risk_to_mode` predates the `f2d3302` meta-decision (see commit
  history for `lib/risk.ml:183-188`); the spec was left ambiguous
  because the 2026-10-05 audit could not silently rewrite it.
  This sub-decision is the formal closure of that audit gap and is
  the only way the meta-decision's t0-1 obligation can record a
  `pass` outcome under the active policy bootstrap-v3@3.

  "Just declare `risk_to_mode` as a one-line alias for the kernel
  function — no need for the bucketing table in the spec."

  Counterargument: the spec is normative, not descriptive. A reader
  who cannot see `lib/risk.ml` (e.g. someone reading the published
  PDF on a forge mirror) must still be able to compute the mode
  from the risk. The bucketing table is the minimum self-contained
  declaration. The kernel link is a secondary cross-reference.

obligations:
  - id: spec-no-ceiling-notation
    outcome: spec-notation-resolved
    claim: |
      `spec/algebra-3.2.md` does not contain the literal
      `⌈risk(c)⌉`. The function `risk_to_mode : [0, 1] → 𝓜` is
      declared in §2 with five thresholds. The thresholds in the
      spec (0.05 / 0.20 / 0.60 / 0.90 / 1.0) match
      `lib/risk.ml:183-188` bit-for-bit.
    acceptance:
      all:
        - verifier: grep -qF 'risk_to_mode' spec/algebra-3.2.md
          result: pass
        - verifier: ! grep -qF '⌈risk(c)⌉' spec/algebra-3.2.md
          result: pass
        - verifier: grep -c '^## §2. Risk function' spec/algebra-3.2.md | awk '{exit !($1 == 1)}'
          result: pass
        - verifier: tests/cli/risk-bucketing.t
          result: pass
        - verifier: mathc-self-check-verdict
          result: pass

  - id: kernel-bit-identical
    outcome: kernel-unchanged
    claim: |
      `lib/risk.ml` is bit-for-bit unchanged relative to the
      meta-decision merge commit `f2d3302`. `mathc self-check`
      reports no regression.
    acceptance:
      all:
        - verifier: mathc-self-check-verdict
          result: pass

reversal:
  - signal: spec-thresholds-mismatch-kernel
    condition: |
      A future change to `lib/risk.ml` (e.g. shifting a threshold
      from 0.05 to 0.06) lands without a matching spec update.
      Resolution: this sub-decision records the kernel-vs-spec
      equality; the kernel change must come with its own
      sub-decision under `plan-2026-10-improvements` (or successor)
      that bumps the spec thresholds in lockstep.
    action: halt
  - signal: notation-flag-decision-stale
    condition: |
      After this branch merges, the human maintainer retires
      `decisions/algebra-3.2-notation-flag-2026-10.yaml` (its
      `reversal.signal: notation-resolved` has fired). No action
      here; just a follow-up reminder.
    action: rework


intent: |
  Resolve the latent ambiguity in `spec/algebra-3.2.md` §2 (Risk
  function) that was flagged by `decisions/algebra-3.2-notation-flag-2026-10.yaml`
  on 2026-10-05: the literal notation `mode(c) = max(⌈risk(c)⌉,
  mode_floor(c))` is mathematically ill-defined when `risk(c) ∈ [0, 1]`
  and the target type `𝓜` has five elements. This sub-decision closes
  that ambiguity by replacing the ceiling notation with the explicit
  bucketed function `risk_to_mode : [0, 1] → 𝓜` whose five thresholds
  match the kernel implementation in `lib/risk.ml:183-188`.

  This is one of the 14 obligations authorised by the meta-decision
  `decisions/plan-2026-10-improvements.yaml@1` (commit `f2d3302`,
  2026-10-07); specifically obligation `t0-1-spec-notation`. Scope is
  limited to §2 of the algebra spec and the matching cram test; the
  kernel implementation is already correct and is NOT modified by
  this branch.

  History:
    rev 1 (this commit): initial adoption. Closes the notation
    ambiguity in `spec/algebra-3.2.md` §2 by replacing the ceiling
    notation with the explicit `risk_to_mode` bucketing function.

axiom_link:
  - A0
commitment: |
  `spec/algebra-3.2.md` §2 reads:

      mode(c) = max(risk_to_mode(risk(c)), mode_floor(c))

      risk_to_mode : [0, 1] → 𝓜
        risk_to_mode(r) =
          | tiny        if r < 0.05
          | light       if 0.05 ≤ r < 0.20
          | standard    if 0.20 ≤ r < 0.60
          | strict      if 0.60 ≤ r < 0.90
          | exhaustive  if r ≥ 0.90

  The five thresholds (0.05 / 0.20 / 0.60 / 0.90 / 1.0) match the
  kernel implementation in `lib/risk.ml:183-188` exactly (line-by-line,
  inclusive of the open-vs-closed boundary rule: a value at exactly
  0.05 lands in `light`, at 0.20 lands in `standard`, at 0.60 lands
  in `strict`, at 0.90 lands in `exhaustive`). The literal string
  `⌈risk(c)⌉` does not appear anywhere in `spec/algebra-3.2.md`.

  Boundaries:
    - `lib/risk.ml` is NOT modified. The kernel implementation was
      already correct and authoritative prior to this branch.
    - `lib/policy.ml`, `lib/decision.ml`, `lib/gate.ml`,
      `lib/waiver.ml`, `lib/rebuttal.ml`, `lib/re_evaluation.ml`,
      `lib/diagnostic.ml`, and `bin/Mathc.ml` are NOT modified.
      Other streams own those files.
    - `schemas/*` are NOT modified. The decision schema does not
      change; the `relations.addresses` block already covers
      `plan-2026-10-improvements@1`.
    - The notation-flag decision
      `decisions/algebra-3.2-notation-flag-2026-10.yaml` is NOT
      modified. Its `notation-note-present` obligation continues to
      pass because the spec still references that decision file in
      the (now-resolved) notation breadcrumb. The
      `notation-ambiguity-recorded` outcome is now a historical
      record; its reversal signal `notation-resolved` has fired
      (this branch), so the meta-decision should be retired in a
      follow-up decision by the human maintainer (out of scope for
      stream α).
    - The 14 constitution invariants (I1–I14) and the 5 axioms
      (A0–A4) are preserved verbatim.
    - The 5-mode enumeration `𝓜 = {tiny, light, standard, strict,
      exhaustive}` is preserved verbatim.


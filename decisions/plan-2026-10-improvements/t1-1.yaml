outcomes:
  - id: forge-mirror-wired
    statement: |
      `lib/rebuttal.ml::forge_mirror` reads
      `MATH_CODING_FORGE_API` and queries
      `GET <api>/comments?commit=<sha>` when set; otherwise it
      returns the empty list. Hybrid rebuttal mechanism is
      functional end-to-end (algebra §10 fully implemented).

counterexample: |
  "Forge mirror raises on HTTP 5xx, propagating a Block verdict
  for obligations that have no YAML rebuttal but no failing
  obligation either."

  Counterargument: the meta-decision explicitly assumes forge
  mirror is OPTIONAL infrastructure (see
  `plan-2026-10-improvements.yaml:347-359`). Converting a
  transport failure into a Block would couple every commit's
  gate to the forge's operational health. The implementation
  swallows every error class — exit-code non-zero, empty body,
  HTTP-failure, JSON parse failure, 5-second timeout — and
  returns `[]`. The hybrid `all_rebuttals` continues to be the
  YAML-authoritative union.

  "The 5-second timeout is too long for CI on a hung endpoint."

  Counterargument: 5 seconds is the `curl --max-time` per-call
  budget; `curl` aborts and returns an empty body on the
  deadline. The test fixture asserts that the call returns
  within 10 seconds wall-clock for an unreachable port, which
  is the loose upper bound. For a healthy endpoint on
  127.0.0.1 the latency is sub-second.

  "Without `MATH_CODING_FORGE_API` the implementation could
  silently skip the network path; an operator misconfiguring the
  env var to `http://nonexistent` would also silently pass."

  Counterargument: this is the intended behaviour: forge mirror
  is OPTIONAL. The same shape (silent skip on missing config)
  applies to every other env-gated kernel knob in this repo
  (see `tests/ci_blocking_list_test.ml` for the parallel
  `MATH_CODING_BLOCKING_CIS` pattern). Operators who want
  failure-on-misconfig can wrap `mathc gate` with a presence
  check in their CI runner.

assumptions:
  - id: forge-endpoint-shape
    state: assumed
    statement: |
      The forge returns a JSON array of objects, each with at
      least a `rebutter` string field. Additional fields
      (`objection`, `evidence`, `outcome`,
      `trust_level_at_rebuttal`, `domain`, `timestamp`) are
      optional and silently dropped when missing. This matches
      the existing `parse_rebuttal` schema at
      `lib/rebuttal.ml:120`.
    owner: human:maintainer
    consequence_if_false: |
      If a forge returns an object (not array), the
      implementation returns `[]`. If a forge returns an array
      but each element lacks `rebutter`, the implementation
      drops every element silently. Both cases preserve the
      YAML-authoritative path; no obligation verdict changes.
    review_on:
      - signal: forge-endpoint-contract-changed

  - id: curl-on-path
    state: assumed
    statement: |
      `curl` (≥ 7.50 with `--max-time` and `-sS`) is on
      `$PATH` at runtime. This is the same dependency as
      `lib/git/git_diff.ml` which calls `git`. No new package
      is added to `flake.nix` or `math-coding.opam`.
    owner: human:maintainer
    consequence_if_false: |
      If `curl` is unavailable, `Unix.open_process_args_in`
      raises `Unix.Unix_error`; this is caught at the boundary
      and `forge_mirror` returns `[]`. The CI matrix already
      lists `curl` indirectly via `git`; no change needed.
    review_on:
      - signal: curl-unavailable

obligations:
  - id: forge-mirror-returns-list
    outcome: forge-mirror-wired
    statement: |
      `forge_mirror` reads `MATH_CODING_FORGE_API` and, when
      set, queries `GET <api>/comments?commit=<sha>` via
      `curl -sS --max-time 5`. The function returns the parsed
      `rebuttal list` on success and `[]` on every error
      path.
    claim: |
      With `MATH_CODING_FORGE_API=http://127.0.0.1:<port>` and
      a stub HTTP server returning
      `[{"rebutter":"r1","objection":"o","evidence":"e",
      "outcome":"accepted","trust_level_at_rebuttal":"authenticated",
      "timestamp":"2026-10-07T00:00:00Z"}]`,
      `all_rebuttals "deadbeef"` returns a list of length ≥ 1
      whose first element has `rebutter = "r1"`.
    acceptance:
      all:
        - verifier: tests/rebuttal_forge_stub.ml::positive_returns_rebuttals_when_api_set
          result: pass
        - verifier: tests/rebuttal_forge_stub.ml::negative_unset_env_returns_empty
          result: pass
        - verifier: tests/rebuttal_forge_stub.ml::negative_unreachable_endpoint_returns_empty
          result: pass
        - verifier: tests/rebuttal_forge_stub.ml::negative_malformed_json_returns_empty
          result: pass

reversal:
  - signal: forge-protocol-upgrade
    condition: |
      A future forge adapter requires authentication headers,
      pagination cursors, or per-PR vs per-commit disambiguation.
      Resolution: supersede this decision with a forge-specific
      sub-decision under `plan-2026-10-improvements` (or a
      successor plan) and replace the `curl` shell-out with a
      typed OCaml HTTP client (cohttp or equivalent).
    action: rework

  - signal: regression-to-stub
    condition: |
      `forge_mirror` is changed back to `[]` without a
      superseding decision. The seam is regression-tested by
      `tests/rebuttal_forge_stub.ml::positive_returns_rebuttals_when_api_set`,
      which fails on a stub return.
    action: halt

risk:
  declared_triggers:
    - forge-coupling
    - curl-process-spawn
    - timeout-budget-overrun
    - parse-error-silent-drop
  owner: human:maintainer


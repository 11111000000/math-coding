intent: |
  Wire `Risk.mode` into the v3.0 `lib/gate.ml::evaluate` path so
  that commits whose risk classification lands at `strict` or
  `exhaustive` surface rebuttal obligations in the gate verdict.
  Before this change, rebuttal obligations were visible only to the
  v3.2 `gate_v32` path; the v3.0 path silently returned `Unknown`
  for axiom-touching commits that lacked rebuttals, an A1 honesty
  gap (axiom A1 Feedback: every commitment must have a path to an
  observation).

  Algebra §10 mandates rebuttals for non-Unblocked verdict at
  exhaustive mode; algebra §5 plus the `math-coding-axioms`
  `mode_floor: exhaustive` policy floor in `policies.yaml` mean
  any commit touching `axioms/**` lands at exhaustive mode and
  therefore MUST carry a rebuttal file before the gate can pass.
  The T3.1 wiring closes that gap at the kernel layer.

  This is one of the 14 obligations authorised by the meta-decision
  `decisions/plan-2026-10-improvements.yaml@1`; specifically
  obligation `t3-1-gate-v30-risk-aware`. Scope is limited to
  `lib/gate.ml::evaluate` and the corresponding `bin/Mathc.ml::do_gate`
  rebuttal load. Other streams own the v3.2 `gate_v32`,
  `aggregate` / `obligation_gap`, the diagnostics UX, and the
  decision / site / spec surfaces.

  History:
    rev 1 (this commit): initial adoption under bootstrap-v3@2
    policy. Closes meta-decision
    `plan-2026-10-improvements` Tier 3 obligation
    `t3-1-gate-v30-risk-aware`. NOT A3-protected: the gate verdict
    surface changes only for axiom-touching commits that lack
    rebuttals; existing cram fixtures that touch axioms/ without a
    sibling decision were already blocked via the §20 kernel rules
    in `gate_v32` (stream ζ T1.2 baseline) and remain blocked under
    the T3.1 wiring.

commitment: |
  1. `lib/gate.ml::evaluate` takes a new labelled parameter
     `~rebuttals : Rebuttal.rebuttal list` (no I/O inside `evaluate`;
     the loader stays at `bin/Mathc.ml::do_gate` per
     OCAML_BEST_PRACTICES §1.3). After the existing attestation-gap
     computation, `evaluate` calls `Risk.mode changed_paths` and, for
     modes ∈ {`Strict`, `Exhaustive`} with an empty rebuttal list,
     overrides the verdict to `Block`. The helper
     `rebuttal_gating_for_mode : Domain.mode -> [ `Required | `Optional ]`
     makes the gate boundary explicit and unit-testable.

  2. `bin/Mathc.ml::do_gate` loads rebuttals via
     `Rebuttal.all_rebuttals !head` and passes them to
     `Gate.evaluate`. The hybrid rebuttal mechanism (algebra §10)
     remains YAML-authoritative: forge failure does NOT raise into
     the gate.

  3. The new cram fixture `tests/cli/gate-axiom-commit.t`
     constructs a tmpdir repo whose second commit touches
     `axioms/A0.md` AND a sibling `decisions/*.yaml` (so the §20
     kernel rules in `gate_v32` pass via `has_sibling_yaml`) and
     asserts `mathc gate HEAD~1 HEAD` emits `verdict:"block"`.
     The sibling decision neutralises the §20 protected-path
     rule so the v3.0 evaluate path is exercised in isolation;
     without the sibling, the kernel-rule path `gate_v32` would
     block independently of `evaluate`, masking the T3.1 wiring.

  4. The previously-v3.2-only rebuttal obligation for axiom-
     touching commits now blocks via the v3.0 path. Existing cram
     fixtures that do NOT touch axioms/ and do NOT have rebuttals
     continue to return `Unknown` (the gate-v32 rules do not fire
     for unprotected paths in standard mode; the attestation-gap
     stream remains the dominant signal).

  5. The change preserves the v3.0 / v3.2 split per algebra §15:
     `gate_v32`, `apply_rule`, `gate_release_v32`, and
     `post_release_monitor` are NOT modified. Stream ζ (T3.2) owns
     `aggregate` / `obligation_gap`; stream η (T4.1) owns
     `next_actions` on `gap`. This sub-decision touches only
     `lib/gate.ml::evaluate` (the function header and the rebuttal
     gating block) plus the corresponding `bin/Mathc.ml::do_gate`
     rebuttal load.

  Boundaries:
  - `lib/waiver.ml`, `lib/diagnostic.ml`, `lib/decision.ml`,
    `lib/risk.ml`, `lib/policy.ml`, `lib/rebuttal.ml`,
    `lib/re_evaluation.ml`, and `lib/attestations/attestations.ml`
    are NOT modified (other streams own those).
  - `lib/gate.ml::gate_v32`, `apply_rule`, `gate_release_v32`,
    `post_release_monitor`, and `commit_info_of` are NOT modified.
  - `bin/Mathc.ml::validate_with_counts`, `do_explain`,
    `do_explain_diagnostic`, `do_re_evaluate`, `do_re_evaluate_decisions`,
    `do_self_check`, and `do_context` are NOT modified. Only
    `do_gate` is touched (one `let`-binding + one labelled argument).
  - `schemas/decision.json` is NOT modified. The schema does not
    carry the rebuttal obligation surface.
  - `spec/algebra-3.2.md` is NOT modified. §10 already requires
    rebuttals for non-Unblocked verdict at exhaustive mode; the
    T3.1 wiring is the kernel-side closure of that requirement.
  - `site/*.md` is NOT modified. Documentation drift on the site
    surface is closed by a separate stream (T5.x).
  - Existing decision files are NOT modified. The 14 constitution
    invariants (I1–I14) and the 5 axioms (A0–A4) are preserved
    verbatim.


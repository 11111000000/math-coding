risk:
  owner: human:maintainer
  declared_triggers:
    - "the store-measuring instruments are read as a verdict on the corpus, and a reader concludes the corpus is clean because the census is short"
    - "the sweep produces a different store on another host, the numbers move, and the ceilings are raised to meet them instead of the debt being paid"
    - "the ratchet is treated as a lint: a raise with a recorded reason is accepted because the reason exists, not because the raise was justified"
    - "the exit-3 convention spreads: a fixture that skips starts reporting exit 0, and the skip becomes a green"
  a-number-over-a-generated-artefact: |
    The census and the legacy-debt fixture measure a GENERATED store,
    so their numbers are a property of the sweep's output for this
    tree, not of the corpus alone. A ceiling over such a number is a
    weaker bound than a ceiling over a corpus property, and the sweep
    is not perfectly reproducible across hosts: a verifier that cannot
    run here produces a different attestation there. The remedy is
    not a looser ceiling but a visible one: every raise carries its
    reason, and the reason is in the diff.

counterexample: |
  The strongest objection to this decision is that it makes a number
  depend on an artefact that does not exist until a ten-minute sweep
  has run, and that it therefore trades a check that always ran for a
  check that runs in one place.

  That is true and it is the reason the exit code changed rather than
  the check disappearing. A check that measures nothing and reports
  "ok" is not a check that runs everywhere; it is a check that lies
  everywhere. The instrument that measures the store now measures it
  where the store exists, and says "unknown" where it does not - and
  the caller decides what unknown means, which is the only honest
  place for that decision to live.

  The second objection is sharper. The corpus has just spent two days
  removing things that measured the corpus's tidiness, and this
  decision puts one of them back. The difference is not a matter of
  taste: the removed scripts answered "how tidy is the corpus", and
  their answer was a snapshot that went stale - the mirror was 92
  files behind the corpus it mirrored. The ratchet answers "is this
  number larger than it was", and its subject is the DIFF, not the
  corpus: a number cannot be behind, because it is compared with its
  own past every time. The same argument that removed the mirror does
  not remove the ratchet, and the decision that removed it has been
  amended to say so.

antithesis: |
  The opposite claim is that the ceilings do not need a program. The
  corpus says in five places that a raise must be recorded next to the
  number; the recorded reasons are in the diff; a reviewer reads the
  diff; the promise is kept.

  The measurement says what that is worth. Between 2026-10-23 and
  2026-10-26 seven ceilings were raised across six ceilings, and one
  of the seven changed the number and nothing else - visible only to
  someone who reads history. And the other failure mode is worse
  than a silent raise: on 2026-10-23 two comparisons were deleted
  while their numbers stood, the fixture stayed green for four days
  because the debt happened to be under the ceiling, and nothing in
  the corpus could tell a ceiling that is bound from a ceiling that is
  only written down. A promise kept by a reader is kept until the
  reader is not there.

intent: |
  Four instruments were measuring the corpus's BOOKKEEPING, and three
  of them were measuring nothing at all. This decision fixes them, and
  it fixes them by making the difference between "the debt is small"
  and "we did not look" visible in the exit code.

  THE CENSUS READ GIT'S INDEX. `tests/fixtures/executed-evidence-census.sh`
  enumerated the store with `git ls-files attestations`. The store
  stopped being committed on 2026-10-28
  (decisions/store-not-committed-2026-10.yaml), so that list has been
  EMPTY on every tree since. The census measured nothing, reported
  0 / 0 / 0, and passed against ceilings of 886 unanchored, 364
  unexecuted passes and 6 orphans. It was the instrument that said
  the store was clean, and it had not looked at the store since the
  day the store stopped being in git. It now reads the store the way
  the kernel reads it - the DIRECTORY
  (`bin/Mathc.ml::store_keep_for` admits every file under the store
  root) - and it refuses to measure a store that is not signed for
  this commit.

  THE LEGACY-DEBT FIXTURE REPORTED PASS OVER AN ABSENT STORE. The same
  shape: "no attestation store in attestations: nothing to measure",
  and then `legacy-attestation-debt: PASS`. A check that cannot fail
  is not a check. It now exits 3 - unknown - when there is nothing to
  measure, and it reads the corpus the way the kernel walks it
  (recursively, by `lib/memory.ml::decision_document_id`'s rule), not
  the top level of `decisions/`.

  THE STEP SIMULATOR LOOKED FOR A STEP THAT NO LONGER EXISTS. The CI
  step was renamed from `mathc self-check (bootstrap-gate block)` to
  `mathc self-check (corpus audit)` on 2026-10-29. The simulator kept
  the old name, so it failed with "could not extract the run: block" -
  and NOTHING RAN IT. The comment in ci.yml that said the three rows
  were "checked, not asserted" was false for a week. The simulator now
  finds the step and checks the contract the step actually has: a
  decisive failure is red, and an unknown verdict is delegated to the
  corpus-debt ratchet, whose status the step adopts. The comment in
  ci.yml said "exit 3 -> step red" while the body has always done
  something else; the comment is now the code's own shape.

  THE CEILING RATCHET WAS REMOVED WITH THE META-LAYER. On 2026-10-28
  `decisions/corpus-meta-layer-2026-10.yaml` removed the corpus-debt
  meta-layer and named three losses it accepted. Two of them were
  about the ceiling ratchet: a ceiling could GROW without a recorded
  reason, and a ceiling could stop BEING a ceiling while its number
  stood still. The ratchet is back
  (`scripts/ceiling-monotonic.sh`, `tests/fixtures/ceiling-monotonic-check.sh`,
  a CI step), because the argument that removed the meta-layer does
  not reach it: a census of the corpus's tidiness is a COPY of the
  corpus and goes stale, and a comparison of a number with its own
  past is a property of the DIFF and does not. The third loss - a
  scope path that names nothing - stands, and this decision does not
  pretend otherwise.

  The census's OWN COPY of the kernel's scheme list was stale. The
  census has to know which verifiers the kernel can execute, and it
  carried its own set: `file-exists`, `dir-exists`, `mathc`, `bash`,
  `shell-grep`, `dune`. The kernel learned `shell-grep-absent` on
  2026-10-29, and the census went on calling it a declaration - five
  obligations were counted as "passes for checks that were never
  executed" that the kernel could execute. A copy of the kernel's
  dispatch is how a corpus ends up with two answers to one question,
  and the census's own header said so. The list is now READ OUT of
  the kernel's `canonical_verifier_schemes` binding, and a census
  that cannot read it reports nothing rather than a number from a
  stale copy.

  The measure of all this is not the number of instruments. It is that
  a red step now means something, and a green one can be trusted to
  have looked.

commitment: |
  1. The census reads the store the way the kernel reads it - the
     directory, not git's index - and it measures only a store that
     is signed for this commit.
  2. The legacy-debt fixture measures the same store under the same
     rule of freshness, and it walks the corpus the way the kernel
     walks it.
  3. The census reads the kernel's list of executable schemes out of
     the kernel, so a scheme the kernel learns is a scheme the census
     knows, and a census that cannot read the list reports nothing.
  4. NOTHING MEASURED IS EXIT 3, NOT EXIT 0. `scripts/check.sh` counts
     exit 3 as SKIPPED (not verified, and named as such in its
     summary); the CI step that runs AFTER the sweep counts it as a
     FAILURE, because there the store must exist.
  5. Both store-measuring instruments run in CI after the sweep that
     produced the store, and they run as their own blocking step.
  6. The step simulator finds the step it checks, and checks the
     contract the step has: pass is green, a decisive failure is red,
     and an unknown verdict takes the ratchet's status - green while
     the debt is under its ceiling, red when the pin bites.
  7. The ceiling ratchet is back and in CI: a ceiling that grows
     without a recorded `ceiling-raise:` reason fails, and a ceiling
     that is declared and never compared fails.
  8. The comment in ci.yml says what the step does. The comment and
     the body are checked against each other by the simulator.

outcomes:
  - id: the-store-measuring-instruments-measure
    statement: |
      The census and the legacy-debt fixture read the attestation store
      that exists, and say "unknown" when there is none.
  - id: the-ci-step-simulator-runs
    statement: |
      The CI self-check step's contract is checked by a program, in
      CI, against the body in ci.yml.
  - id: the-ceilings-are-monotone-again
    statement: |
      A debt ceiling may fall and may never rise, and the promise is
      kept by a program rather than by the reader of a diff.


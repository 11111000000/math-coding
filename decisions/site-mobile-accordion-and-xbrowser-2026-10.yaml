outcomes:
  - id: mobile-nav-is-accordion
    statement: |
      On a 375 x 812 viewport with `aria-expanded="false"`
      on every `.nav-group-toggle`, every
      `.nav-group-panel` computed `display` is `none`. The
      hamburger reveals the five top-level entries and
      nothing else.
  - id: mobile-nav-group-click-toggles-panel
    statement: |
      Clicking a `.nav-group-toggle` in the open mobile
      menu sets its `aria-expanded="true"` and the
      corresponding `.nav-group-panel` becomes
      `display: block`. The other three group panels stay
      `display: none`.
  - id: aria-controls-points-at-panel
    statement: |
      Every `.nav-group-toggle` carries
      `aria-controls="nav-panel-N"` and the matching
      `<ul class="nav-group-panel" id="nav-panel-N">` is
      emitted in the same document. No `role="menu"` /
      `role="menuitem"` / `role="none"` remain in
      `dist/` or `assets/`.
  - id: vendor-prefixes-ship
    statement: |
      `dist/assets/style.css` carries the
      `-webkit-appearance`, `-moz-appearance`,
      `-webkit-user-select`, `-moz-user-select`,
      `-ms-user-select`, and unprefixed `text-size-adjust`
      declarations on the corresponding selectors.
  - id: focus-visible-fallback-ship
    statement: |
      `dist/assets/style.css` carries the
      `@supports not (selector(:focus-visible))` block with
      the four `:focus` outline rules.
  - id: prefers-reduced-motion-respected
    statement: |
      `dist/assets/style.css` carries the
      `@media (prefers-reduced-motion: reduce)` block.
  - id: font-feature-superscript-inherits-body
    statement: |
      The `sup, .sidenote-number` rule in
      `dist/assets/style.css` lists four
      `font-feature-settings` values (kern, liga, onum,
      sups), not just `sups`.
counterexample: |
  "Just collapse the panel via inline JS; the kernel
   does not need an accordion at the mobile breakpoint."

  Counterargument: an inline JS solution would couple
  the visibility logic to a JS path that fails open if
  the script fails to load (CDN outage, CSP block, JS
  disabled). The CSS-only accordion inherits the same
  single source of truth the desktop dropdowns already
  use; it cannot disagree with itself.

  "Touch `.nav-group-panel` to `display: none` and leave
   the inline script; the JS already toggles
   `aria-expanded`."

  Counterargument: the inline script only toggles
  `aria-expanded` on `.nav-toggle`, not on any
  `.nav-group-toggle`. Without a click handler on the
  group toggle, the adjacent-sibling selector never
  fires. The inline script cannot be a workaround; it
  has to be replaced.

  "Add a second inline `<script>`; do not load
   `assets/site.js` -- it adds risk."

  Counterargument: `assets/site.js` already exists in
  the repo, is copied to `dist/assets/site.js` by
  `scripts/render.sh`, and adds the live-verdict counter
  to the hero meta. The file has been dead weight since
  `cli-canonical-name@2`. The cycle wires it up and
  removes the corresponding inline script in one move.

  "Ship the cross-cutting CSS fixes as a separate
   decision; this one is too broad."

  Counterargument: the cross-cutting fixes are each a
  single CSS rule on the same file the accordion
  touches; the deploy path is one workflow run; the
  audit that motivated them is in this same cycle's
  planning notes. Splitting into two decisions would
  double the review surface for a cosmetic-only delta.
antithesis: |
  Author considered and rejected the strongest counter-
  position: "Bump the manifest to 4.0 to absorb the
   cross-browser pass; the math-coding 3.x grammar
   forbids arbitrary third-party CSS that resets the
   path."

  That position is rejected because (a) the project's
  constitution explicitly permits CSS fixes under
  `site-quality-*` decision family without bumping the
  schema version; (b) the manifest bump would invalidate
  every active attestation in `attestations/` and require
  re-running CI for every prior decision; (c) the
  arithmetic of risk-vs-effort does not justify a major
  version for CSS-only changes that do not touch the
  schema.

intent: |
  Close the navigation regression and the cross-cutting
  browser-compatibility gaps the wide-screen-padding fix
  (`fix-wide-screen-padding-2026-10@1`) surfaced but did not
  cover. The mobile navigation menu at
  `https://11111000000.github.io/math-coding/` ships
  every group and every group link expanded at once when the
  hamburger is opened, because:

    1. `lib/render.ml` (the page renderer) emits an inline
       `<script>` that duplicates a partial version of
       `assets/site.js`. The inline script handles only the
       hamburger toggle; it never binds click handlers to
       `.nav-group-toggle`, so the four categorical dropdowns
       have no JS affordance.
    2. `assets/site.js` is shipped to `dist/assets/site.js` by
       `scripts/render.sh`, but no HTML emitted by the
       renderer links to it. The file is dead code in
       production -- keyboard Escape, click-outside, dropdown
       click toggles, and the live-verdict counter are all
       written but never wired.
    3. `assets/style.css` `@media (max-width: 760px)` declares
       `display: block` for `.nav-group-panel` unconditionally,
       so panels are visible at all times on mobile.

  Together: on a phone the hamburger reveals 12 visible
  links at once (Home + Concept + 3 children + Methodology +
  3 children + Adopt + 4 children + Reference + 2 children),
  which is the UX the user reported as the dropdowns being
  already expanded on mobile.

  The fix adopts the standard accordion pattern: mobile
  panels are hidden by default and reveal only when their
  parent group toggle carries `aria-expanded="true"`. The
  CSS rule below the `@media` query (`.nav-group-panel {
  display: none }` plus the `[aria-expanded="true"]`
  adjacent-sibling selector) is the same pattern the desktop
  dropdowns use for hover and focus-within; mobile only
  differs in that the panel sits in flow rather than
  absolutely positioned.

  In parallel, five browser-compat gaps reported by the
  post-mortem of the wide-screen-padding audit are closed
  in this same cycle because each one is a single CSS rule
  change and the same render-and-deploy path ships them:

    A. `:focus-visible` is silently ignored on Safari 14-15.3.
       A `@supports not (selector(:focus-visible))` fallback
       to plain `:focus` covers the gap.
    B. `appearance: none` on `.nav-toggle` / `.nav-link` /
       `.nav-group-toggle` is unprefixed. Safari 14 and Chrome
       <=83 strip default button chrome only with the
       `-webkit-` prefix. `user-select: none` on the same
       selectors gains the matching `-webkit-`, `-moz-`, and
       `-ms-` prefixes.
    C. `font-feature-settings: "sups"` on `sup` /
       `.sidenote-number` *replaces* the body's
       `font-feature-settings: "kern", "liga", "onum"`
       declaration. The `sup` rule now carries the full
       feature list, so superscript inherits the body
       features and adds `sups`.
    D. There is no `@media (prefers-reduced-motion: reduce)`
       override. Every `transition: opacity 0.15s, ...`
       rule animates regardless of the OS-level reduce-motion
       flag. WCAG 2.3.3. A single universal selector
       override collapses every transition / animation to
       0.001 ms.
    E. ARIA misuse: `role="menu"` on the panel `<ul>` and
       `role="menuitem"` / `role="none"` on each link wraps
       site navigation in the ARIA 1.1 menu pattern, which
       the WAI-ARIA Authoring Practices explicitly says do
       **not** use for site navigation. Safari VoiceOver
       announces the wrapper as a context menu and refuses
       to navigate between siblings with the arrow keys;
       NVDA / JAWS are inconsistent. The roles are removed.
       `aria-haspopup="true"` is removed at the same time
       because it is undefined outside the menu pattern; the
       group toggle's `aria-expanded` already carries the
       disclosure semantics.

  Four smaller, related cleanups shipped in the same cycle:

    F. The panel `<ul>` now carries an `id` (`nav-panel-N`)
       and the toggle `<button>` references it via
       `aria-controls="nav-panel-N"`. Without `aria-controls`
       the screen-reader announcement of `aria-expanded`
       cannot name which panel opens.
    G. `assets/site.js` is now emitted via
       `<script defer src="assets/site.js">` from the page
       renderer (the inline script is deleted). The `defer`
       attribute preserves the prior parse-then-execute
       ordering; the file's `setupHamburger` and
       `setupGroupDropdowns` are the only paths that need to
       run, both of which are now correct.
    H. `assets/site.js` cleanup: the dead `is-open` class
       toggle (no CSS rule matched it) is removed; the
       click-outside handler guards against a null `e.target`;
       the active-link matcher strips directory prefixes so
       links in `/math-coding/decisions/` highlight the right
       decision; the live-counter numbers are sanitised to a
       leading digit so a future kernel change that emits
       non-numeric text does not become an XSS sink.
    I. `assets/style.css` adds `touch-action: manipulation`
       on `.nav-toggle`, `.nav-link`, and `.nav-group-toggle`
       so taps on iOS Safari and Android Chrome fire on the
       first tap rather than after the 300 ms
       double-tap-to-zoom delay. Pinch-zoom is unaffected.
commitment: |
  1. `lib/render.ml::render_nav` adds a stable per-group
     counter, emits `id="nav-panel-N"` on each
     `.nav-group-panel`, and points each `nav-group-toggle`
     `aria-controls` at that id. The `data-nav-group="N"`
     attribute on the outer `<li>` is added for JS and
     styling hooks. The four `role="menu"` /
     `role="menuitem"` / `role="none"` attributes are
     removed.

  2. `lib/render.ml::render_page` deletes the inline
     `<script>` block (lines 1173-1192 of the previous rev)
     and emits `<script defer src="assets/site.js">`
     immediately before `</body>`.

  3. `assets/site.js` is rewritten:
     - `setupHamburger` flips `aria-expanded` on
       `.nav-toggle` and listens to the `(max-width: 760px)`
       media-query `change` event so resizing from mobile to
       desktop clears `aria-expanded` (the inline-script bug).
     - `setupGroupDropdowns` adds click handlers to every
       `.nav-group-toggle`, sets `aria-expanded` per group,
       and keeps the existing Escape / click-outside /
       focus-return behaviour.
     - `highlightActiveLink` matches by basename, so a page
       at `/decisions/<id>.html` highlights its link.
     - `updateLiveCounters` parses values through a strict
       `^[0-9]+` regex before interpolating them into the
       hero meta paragraph.
     - The dead `is-open` class toggle is gone; CSS does the
       open / close work via the `[aria-expanded]` sibling
       selector.

  4. `assets/style.css` mobile accordion: `.nav-group-panel`
     is `display: none` by default inside the `@media
     (max-width: 760px)` block, and the adjacent-sibling
     selector `nav.site-nav .nav-group >
     .nav-group-toggle[aria-expanded="true"] +
     .nav-group-panel { display: block }` opens it.

  5. `assets/style.css` browser-compat fixes:
     - `-webkit-appearance: none` and `-moz-appearance: none`
       precede `appearance: none` on `.nav-toggle`,
       `.nav-link`, and `.nav-group-toggle`.
     - `-webkit-user-select: none`, `-moz-user-select: none`,
       and `-ms-user-select: none` precede `user-select: none`
       on `.nav-toggle`.
     - `text-size-adjust: 100%` is added after
       `-webkit-text-size-adjust: 100%` on `html`.
     - A `@supports not (selector(:focus-visible))` block
       declares the same outline rules on plain `:focus`.
     - `font-feature-settings: "kern", "liga", "onum", "sups"`
       on `sup, .sidenote-number` preserves the body feature
       set and adds the superscript glyphs.
     - `@media (prefers-reduced-motion: reduce)` zeroes
       every `transition-duration` / `animation-duration`.
     - `touch-action: manipulation` on `.nav-toggle`,
       `.nav-link`, and `.nav-group-toggle`.

  6. The cram snapshot in `tests/cli/render.t` (the file
     ships with `scripts/render.sh` invocation) is
     regenerated by `dune promote` after the cycle lands.

  7. `scripts/dev ready` exits 0 (full aggregator), per
     `AGENTS.md section "Definition of Done"`.

  Boundaries:
    - No change to the render kernel beyond `render_nav`
      and `render_page`; the body-emission and per-decision
      rendering paths are untouched.
    - No new dependency on `js_of_ocaml` or any third-party
      library; the fix is plain CSS + a 100-line vanilla
      JS IIFE.

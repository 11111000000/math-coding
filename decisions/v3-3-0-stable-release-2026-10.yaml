antithesis: |
  The counter-position considered and rejected: "Three
  marketing changes (version drop, badges, social preview)
  plus a tag-and-publish action are routine work and do
  not warrant a fresh decision YAML — just do it." The
  author engaged with this position and rejected it on
  two grounds: (a) per the project's own `process-principles`
  P1, every change ships with a decision YAML under the
  active policy — a release is a change, not an exception;
  (b) the change touches protected metadata
  (`VERSION`, opam `version`, the live release tag) that
  downstream consumers parse for install URLs and
  compatibility ranges (`compatible_with: mathc@>=3.3.0`),
  so an audit trail is the smallest durable evidence.

  Second position: "The CHANGELOG already says
  v3.3.0-alpha is current, so dropping the `-alpha`
  suffix is just a one-line typo fix." Counterargument:
  the brand cutover at commit c56bd35 was a separate
  decision (no decision YAML captured that one — see the
  "Pre-existing deficit" outcome below) and it left
  `VERSION` and the CHANGELOG header on `-alpha` while
  renaming the prose headers. This cycle closes the
  cutover. A follow-up cycle can convert the brand cutover
  to a decision YAML retroactively if the audit history
  matters.

commitment: |
  1. The published version string `VERSION` is exactly
     `3.3.0` (no prerelease suffix).

  2. `math-coding.opam` `version:` is exactly `3.3.0`
     and `scripts/sync-version.sh --check` exits 0.

  3. The CHANGELOG current-section heading reads
     `## v3.3.0 — 2026-10-15 — current` (date is the
     publication date, not the day the v3.3.0-alpha work
     landed).

  4. README, ROADMAP, PACKAGES, AGENTS, USAGE,
     OCAML_BEST_PRACTICES, axioms/index.md,
     bin/data/time-distribution.yaml carry `math-coding 3.3`
     in their prose headers (already true at HEAD; this
     decision records the invariant).

  5. `spec/constitution.md` first line reads
     `# Math-coding 3.3.0 constitution` (drops the
     `-alpha` to match the brand).

  6. `lib/render.ml` renders the live site hero as
     `<h1>math-coding 3.3.0</h1>` and the page
     `<title>` as `math-coding 3.3.0 — math-coding`
     (the `read_version_file` function added by
     site-version-from-file-2026-10@1 reads the new
     `VERSION` literal at build time).

  7. `mathc version` prints `math-coding 3.3.0: bootstrap`.

  8. `README.md` carries a badges row immediately below
     the title block, with at least: OCaml version,
     license, latest release tag, rendered subcommand
     count.

  9. `assets/social-preview.png` is a 1280x640 PNG
     carrying the brand mark, the project title, the
     version, and one tagline sentence. The source
     SVG `assets/social-preview.svg` is committed
     alongside.

  10. The GitHub release `v3.3.0` is published (not
      Draft), carries the `install.sh`, `SHA256SUMS`,
      and the mathc binaries that `.github/workflows/
      release.yml` produces, and is the canonical install
      point for `mathc`.

  11. The 7 historical draft releases (v1.0.0..v2.0.0)
      are untouched.

  12. `mathc self-check` verdict after the version
      bump is no worse than before (no new `fail` or
      `missing` verdicts introduced by the bump).


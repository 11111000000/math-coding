intent: |
  Promote the published brand from `math-coding 3.3.0-alpha`
  (current `VERSION` file) to `math-coding 3.3.0` (semver
  `3.3.0`, no prerelease suffix), and publish a real GitHub
  release `v3.3.0` carrying the install assets (`install.sh`,
  `SHA256SUMS`, `mathc-<os>-<arch>` binaries) that the
  release workflow already produces. The release tag drops
  the `-alpha` postfix on the author's explicit instruction
  ("выпускай версию 3.3.0 — без постфиксов", 2026-10-15),
  and that instruction propagates to the single source of
  truth for the published version (`VERSION`), the opam
  package version, the CHANGELOG header, the README status
  line, the rendered site hero (`lib/render.ml` reads
  `VERSION`), the spec/constitution header, and the
  documentation headers in PACKAGES / ROADMAP / AGENTS /
  USAGE / OCAML_BEST_PRACTICES / axioms/index.md /
  bin/data/time-distribution.yaml.

  Concretely, four surfaces change:

    a. **Source-of-truth bump.** `VERSION` 3.3.0-alpha
       -> 3.3.0; `math-coding.opam` version field follows.
       `scripts/sync-version.sh --check` then propagates the
       semver `3.3.0` form to `adoption/SKILL.md`'s
       `compatible_with` line (already correct by accident —
       the script drops the `-alpha` suffix when computing
       MAJOR.MINOR.PATCH).

    b. **Documentation header sweep.** The brand cutover from
       `3.1.0-alpha-final` to `3.3.0` at commit c56bd35
       renamed the docs headers to "math-coding 3.3" but kept
       `VERSION` at `3.3.0-alpha`. This cycle finishes the
       cutover: `VERSION`, opam, the CHANGELOG current-section
       heading, the README status line, and the
       `spec/constitution.md` first line all carry
       `math-coding 3.3.0` (no `-alpha`). Historical mentions
       (CHANGELOG prior-section headings, AUDIT-*.md reports,
       `OCAML_BEST_PRACTICES.md` historical prose,
       `assets/*.svg` historical timeline labels) are NOT
       touched — they describe the regime they lived in.

    c. **Repo presentation quality.** A badges row appears at
       the top of `README.md` carrying the OCaml-language
       status, the license, the live release tag, and the
       rendered `mathc` subcommand count (mirrors the existing
       `PACKAGES.md` counter block). A social preview image
       `assets/social-preview.png` (1280x640 PNG, GitHub's
       Open Graph card spec) is generated from a new
       `assets/social-preview.svg` source and uploaded to the
       repo via the social-preview API; the SVG source is
       committed so a maintainer can re-render after a brand
       change without leaving the repo.

    d. **Release publication.** A git tag `v3.3.0` is
       pushed to `origin`, triggering `.github/workflows/
       release.yml` (the existing release pipeline). The
       resulting GitHub release is published (not Draft),
       replaces the existing "edge" pre-release as the
       default release tag, and is the canonical install
       point referenced from `adoption/SKILL.md`'s
       `MC_VERSION=<3.3.0>` line and from
       `site/install.md`. The seven historical draft
       releases (v1.0.0..v2.0.0) stay as historical Drafts
       and are explicitly NOT deleted — they predate the
       3.x regime and dropping them would erase evidence.

  Boundaries (A3 self-application):

    - This decision does not change `lib/`, `bin/`, `spec/`
      algebra, `schemas/`, or `axioms/`. The kernel is
      identical to v3.3.0-alpha; only the marketing version
      label changes.
    - This decision does not change the `math-coding/3.2`
      schema string family. The schema-version axis is
      separate from the project-version axis (per
      decisions/schema-string-bump-3.0-alpha-to-3.3-2026-10.yaml).
    - This decision does not delete or modify historical
      `v*` git tags or any draft GitHub releases. It adds
      `v3.3.0` and leaves everything else as-is.
    - This decision does not rebase `main` or force-push.
    - This decision does not change the project's open
      `mathc self-check` verdict. As of HEAD
      (commit `8e9f65d`) the verdict is `unknown` with
      5 obligations unresolved from the 2026-10-14
      parallel-fix-batch (placeholder-sha-cleanup-2026-10,
      enable-counters-drift-test-2026-10,
      constitution-header-3-3-update-2026-10,
      re-eval-remediation-todo-fix-2026-10,
      attestation-waiver-policy-schema-bump-3-3-2026-10).
      The release at `v3.3.0` makes no stronger assertion
      than `v3.3.0-alpha` did: the kernel still names the
      verdict per obligation, and the verdict for any
      obligation not covered by an attestation remains
      `unknown` or `missing`.

  History:
    rev 1 (this commit): initial adoption.

axiom_link:

counterexample: |
  "Promoting from `-alpha` to stable is a one-line sed
  edit and a tag push; it does not deserve 12 obligations."
  Counterargument: each obligation captures one piece of
  evidence that the promotion is internally consistent
  (VERSION ↔ opam ↔ CHANGELOG ↔ site hero ↔ binary
  stdout ↔ release tag) and externally visible
  (badges, social preview, GitHub release). The number
  is large because the change touches many surfaces;
  each surface has its own consumer who would notice
  inconsistency. Splitting the obligations would not
  reduce the work; it would only hide the consistency
  requirement.

  "The `v3.3.0-alpha` brand cutover at commit c56bd35
  was a one-time editorial decision; retroactively
  recording it as a decision YAML is bikeshedding."
  Counterargument: this decision's `antithesis`
  section names the lack of a cutover decision YAML
  as a pre-existing deficit. A follow-up cycle can
  backfill it; this cycle is the promotion itself.

assumptions:
  - id: brand-cutover-decision-deferred
    state: assumed
    statement: |
      The brand cutover from `3.1.0-alpha-final` to
      `3.3.0` at commit c56bd35 was not captured as a
      decision YAML at the time. This decision closes
      the cutover by removing the remaining `-alpha`
      literals in source-of-truth files (VERSION, opam,
      CHANGELOG, README status, constitution header)
      but does not retroactively backfill a cutover
      decision YAML. A follow-up cycle may do so.
    owner: human:maintainer
    consequence_if_false: |
      If the maintainer considers the missing cutover
      decision a blocking deficit, this cycle is
      incomplete and must wait for a cutover decision.
      The maintainer's instruction ("выпускай версию
      3.3.0 — без постфиксов", 2026-10-15) accepts
      the deficit as a known follow-up.
    review_on:
      - signal: cutover-decision-required
  - id: self-check-verdict-acceptable-as-is
    state: assumed
    statement: |
      `mathc self-check` verdict is `unknown` with 5
      obligations unresolved from the 2026-10-14
      parallel-fix-batch. The promotion does not
      require resolving those 5 obligations; the
      release at `v3.3.0` makes no stronger assertion
      than the kernel's current verdict supports.
    owner: human:maintainer
    consequence_if_false: |
      If the maintainer requires `mathc self-check`
      to return `pass` before publishing `v3.3.0`,
      this cycle must wait until the 5 unknown
      obligations close (their owning decisions are
      placeholder-sha-cleanup-2026-10,
      enable-counters-drift-test-2026-10,
      constitution-header-3-3-update-2026-10,
      re-eval-remediation-todo-fix-2026-10,
      attestation-waiver-policy-schema-bump-3-3-2026-10).
    review_on:
      - signal: self-check-stale-on-publish

reversal:
  - signal: version-revert
    condition: |
      A future maintainer decides the `-alpha` suffix
      was premature to drop and wants to revert to
      `3.3.0-alpha.1` or similar. Resolution: a
      follow-up decision bumps `VERSION` back,
      re-runs `scripts/sync-version.sh --write`,
      rebuilds the binaries, deletes the `v3.3.0`
      GitHub release and re-tags as `v3.3.0-alpha.1`,
      and supersedes this decision.
    action: rework


counterexample: |
  "Doctor is not actually shipped; the agent that built
   `_build/default/bin/mathc.exe` only saw the local source
   tree, not the release binary." Counterargument:
   `bin/Mathc.ml::dispatch | "doctor" -> do_doctor ()`
   (line 6424) is in the source tree at HEAD; the freshly
   built binary is what `mathc update` would have shipped
   to `/home/az/.local/bin/mathc` if the user had rebuilt.
   The plan's C3 obligation is about whether the feature
   ships in the kernel, not whether the user's installed
   binary is current; the user's binary is on a
   user-controlled update cadence and is owned by `mathc
   update`. This decision records both timestamps so the
   distinction is explicit.

  "Just update the report and skip the decision file;
   the work is too small to merit an obligation."
   Counterargument: the C3 obligation in
   `plan-2026-10-adoption-fixes-2026-10.yaml` explicitly
   names this decision file (`verifier: file-exists`).
   Without the decision file, the obligation cannot
   transition to `pass`. The fast-path documented in
   AGENTS.md is opt-in and requires four eligibility
   assertions; this change is a single-commit
   verification + 12-line docs annotation, but the
   existence of the matching plan obligation means the
   decision file is the closure mechanism, not
   overhead.

  "The report should be amended in-place, not appended
   to; an additive footnote breaks the §11.1 reading
   flow." Counterargument: §11.1 is a 5-bullet list of
   "what math-coding does well"; amending in-place
   would rewrite a fact that was true at the time of
   writing. A dated, additive "Verification (added
   2026-10-17 by …)" footnote preserves the experiment's
   contemporary observation while making the ship status
   precise. This matches the convention used elsewhere
   in the report (e.g. §10.7 plan-level correction).

outcomes:
  - id: doctor-ship-status-pinned
    statement: |
      The ship status of `mathc doctor` is precise:
      shipped in source at `e8f413e` (2026-10-15 14:46 UTC),
      present in `bin/Mathc.ml::dispatch`, and reproducible
      from a fresh `dune build`. The experiment's installed
      binary `/home/az/.local/bin/mathc` (built
      2026-10-15 13:40 UTC) pre-dates the ship by
      66 minutes, which is why the experiment reported the
      subcommand as missing.

obligations:
  - id: mathc-doctor-ship-status-verified
    claim: |
      `mathc doctor` ships in the current source tree and
      in a freshly-built `bin/mathc.exe`; the experiment
      report §11.1 records the precise ship status with
      timestamps.
    acceptance:
      all:
        - verifier: file-exists
          path: /home/az/Projects/math-coding/decisions/verify-mathc-doctor-ships-2026-10.yaml
          result: pass
        - verifier: mathc validate decisions/verify-mathc-doctor-ships-2026-10.yaml
          result: pass
        - verifier: mathc doctor --help
          result: pass

reversal:
  - signal: doctor-removed
    condition: |
      A future commit removes `do_doctor` from
      `bin/Mathc.ml` or unregisters the `"doctor"` arm in
      the dispatch table. Resolution: this decision moves
      to `state: archived`; the experiment report §11.1
      footnote must be re-read to reflect the new status;
      the plan's C3 obligation must be re-opened or
      escalated to a kernel change.
    action: archive
  - signal: experiment-report-rewritten
    condition: |
      The adoption experiment report is rewritten
      in-place (not amended) and the §11.1 footnote is
      folded into the original bullet. Resolution: this
      decision remains `state: active`; the footnote's
      content moves into the bullet body; the timestamps
      remain because they are the load-bearing piece.
    action: rework


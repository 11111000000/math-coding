intent: |
  Verify that `mathc doctor [--json]` ships in the current
  math-coding binary and is documented in the adoption
  experiment report. Close the C3 meta-decision
  obligation `c3-mathc-doctor-ship-status-verified`
  recorded in `plan-2026-10-adoption-fixes-2026-10.yaml`.

  The adoption experiment report §11.1 noted: "`mathc doctor`
  (when added in `ux-3-doctor-subcommand-2026-10`) did not
  exist in the binary used for this experiment; the agents
  reported they would have used it." That note is ambiguous:
  it could mean the feature is unimplemented, OR the binary
  pre-dates the ship. This decision pins the answer down.

  Procedure:

    1. Locate the implementation site:
       `bin/Mathc.ml::do_doctor` and the dispatch arm
       `bin/Mathc.ml::dispatch | "doctor" -> do_doctor ()`,
       plus the help text in `bin/Mathc.ml::print_usage`.
    2. Locate the source ship:
       `git log --follow -- decisions/mathc-doctor-subcommand-2026-10.yaml`
       identifies commit `e8f413e` (2026-10-15 14:46 UTC)
       as the source-ship.
    3. Locate the experiment's binary timestamp from the
       report: `/home/az/.local/bin/mathc` built
       2026-10-15 13:40 UTC (§11.2).
    4. Compare: source ship at 14:46 UTC, experiment binary
       built at 13:40 UTC. The experiment binary pre-dates
       the source ship by 66 minutes. The experiment
       observed absence was a binary-staleness artefact,
       not a missing feature.
    5. Rebuild the binary in this worktree and verify
       `mathc doctor --help` returns the documented usage
       block and exits 0.
    6. Update `docs/experiments/adoption-2026-10.md` §11.1
       to record the precise ship status with timestamps.

  Reversible in one commit; no kernel file is touched; the
  only changes are to `docs/experiments/adoption-2026-10.md`
  and the addition of this decision file plus its
  attestations.

commitment: |
  - `bin/Mathc.ml::dispatch` registers the `"doctor"` arm;
    `bin/Mathc.ml::do_doctor` is the implementation; the
    help text in `bin/Mathc.ml::print_usage` mentions
    `doctor [--json]`.
  - A fresh `dune build bin/mathc.exe` produces a binary
    whose `mathc doctor --help` exits 0 and prints the
    usage block.
  - `mathc doctor --json` emits `{"exit_code": 0,
    "sections": [...]}` with at least the 5 offline
    sections (`install`, `path`, `latest`, `config`,
    `decisions`, `attestations`) and the `self_check`
    short-circuit.
  - `docs/experiments/adoption-2026-10.md` §11.1 records
    the precise ship-status with the experiment binary
    timestamp (2026-10-15 13:40 UTC) and the source-ship
    commit timestamp (`e8f413e`, 2026-10-15 14:46 UTC).
  - `decisions/verify-mathc-doctor-ships-2026-10.yaml`
    exists with `state: active`, `mode: light`,
    `change_kind: implementation`, and one obligation
    (`mathc-doctor-ship-status-verified`) with three
    verifiers.
  - At least one attestation JSON exists at
    `attestations/verify-mathc-doctor-ships-2026-10-*.json`
    with `kind_: review` or `kind_: build` recording the
    `mathc doctor --help` exit-0 observation.

  No kernel file is touched. No `lib/`, `bin/Mathc.ml`,
  `bin/mathc_mcp.ml`, `scripts/install-tooling/`,
  `schemas/`, `spec/`, `axioms/`, or `decisions/decision.yaml`
  is modified.


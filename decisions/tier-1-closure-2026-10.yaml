intent: |
  Close ROADMAP Tier 1 ("process hardening") by fixing the
  three live enforcement failures and recording the closure
  in ROADMAP.md.

  As of HEAD 177ec8c the seven Tier 1 tasks are RESOLVED in
  PACKAGES.md with decisions, fixtures, and implementations
  on main, but two enforcement backstops still fire on a clean
  tree:

  1. tests/conformance.ml::fixtures — five positive decision
     fixtures (positive-minimal.{yaml,json},
     positive-ambiguous-acceptance.json,
     positive-malformed-acceptance.json,
     positive-block-scalars.yaml) lack the v3 dialectic
     `antithesis` field that lib/decision.ml has required
     for mode >= standard since commit 56e86be. The fixtures
     pre-date the dialectic feature; the missing field trips
     MC-ANTITHESIS-MISSING in the parser and the conformance
     test fails.

  2. tests/process_principles.ml::P2 (46 bad verifiers) and
     tests/fixture_coverage.ml::walker (1 missing/unknown)
     — verifier strings in decisions/plan-2026-10-improvements.yaml
     use three patterns the OCaml classifiers do not yet
     recognise: "decisions/<file>@<rev> exists" (sub-decision
     reference), "! <shell command>" (shell negation), and
     "mathc-self-check-<name>" (keyword markers). The pre-
     commit hook (.githooks/pre-commit) is permissive on these
     strings; the rigorous OCaml check is not.

  This decision closes both gaps, updates ROADMAP.md to
  mirror Tier 0's "closed" treatment, and records the closure
  in PACKAGES.md.

commitment: |
  After this decision lands on main:

    (a) The five conformance fixtures under
        fixtures/conformance/decision/ carry a non-empty
        `antithesis` field. The dialectic field is unrelated
        to what the conformance test asserts (parser
        robustness on positive inputs); the new field is
        documentary, naming the position the fixture author
        considered and rejected. tests/conformance.ml::
        fixtures reports 0 failures.

    (b) tests/process_principles.ml::classify_verifier and
        tests/fixture_coverage.ml::classify accept three
        additional verifier patterns that are already in use
        in the current tree:
          - `decisions/<file>@<rev> exists` (sub-decision
            reference) — pattern prefix `decisions/`.
          - `! <shell command>` (shell negation; the leading
            `! ` is stripped before the rest is classified)
            — handled by stripping then re-classifying.
          - `mathc-self-check-<name>` (keyword marker) —
            pattern prefix `mathc-self-check-`.
        The acceptance criteria are: 0 unrecognised verifiers
        reported by P2; 0 unknown / 0 missing reported by
        fixture_coverage.

    (c) ROADMAP.md §"Priority queue" mirrors Tier 0: Tier 1
        is renumbered to "Tier 1 — process hardening: closed"
        and every task is struck through with its closing
        commit. A new section "Tier 1.5 — install-tooling
        follow-up (Phase 2/3)" carries the three deferral
        records (mcp-server, docker-alpine,
        auto-update-per-user-skill) that were created under
        install-tooling-2026-10@1.

    (d) `dune test` exits 0; `mathc self-check` reports
        66 pass / 1 unknown (no regression on the structural
        `audit-0.0.21-fixes::self-check-verdict-is-pass`
        waiver from the prior cycle).


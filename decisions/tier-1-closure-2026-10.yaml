assumptions:
  - id: conformance-fixtures-purpose-unrelated-to-dialectic
    state: assumed
    statement: |
      The five positive fixtures exist to assert parser
      robustness (positive parses), not to assert
      dialectic completeness. Adding the `antithesis`
      field to each is documentary; the original
      assertion still holds because
      `antithesis_meaningful_opt` is a separate parser
      check from the structural parser test the
      fixtures target.
    owner: human:maintainer
    consequence_if_false: |
      If a future change tightens the dialectic surface
      and these fixtures need additional fields, this
      decision would need revision. The fixtures are
      anchored to spec/algebra-3.2.md §11 (current v3
      dialectic method), not to a snapshot.
    review_on:
      - signal: dialectic-v4
  - id: sub-decision-references-are-fixture-existence-checks
    state: assumed
    statement: |
      The pattern `decisions/<file>@<rev> exists` is the
      canonical way to express "the sibling decision file
      must exist for this obligation to hold" in
      plan-2026-10-improvements.yaml. Each such verifier
      names a real file in the decisions/ tree; the OCaml
      classifier will treat the path as a fixture
      reference and call `Sys.file_exists` on it (it is
      not a manual-style review).
    owner: human:maintainer
    consequence_if_false: |
      If a verifier of this form points at a file that
      does not exist, the P2 test should report it as a
      missing fixture, not silently pass. The P2 test
      must call `Sys.file_exists` on the path before
      classifying.
    review_on:
      - signal: sub-decision-ref-shape-changes
  - id: shell-negation-is-allowed
    state: assumed
    statement: |
      A verifier of the form `! <command>` is a valid
      shell invocation: `!` is shell-level negation, the
      rest is a regular command. The P2 classifier strips
      the leading `! ` and classifies the remainder; a
      verifier whose remainder is unrecognised after the
      strip is still rejected.
    owner: human:maintainer
    consequence_if_false: |
      If shell negation is not used in practice, the
      strip step is dead code; if it is, the strip is
      necessary because no recognised prefix starts with
      `! `.
    review_on:
      - signal: shell-negation-use-expands
  - id: mathc-self-check-keyword-markers
    state: assumed
    statement: |
      The pattern `mathc-self-check-<name>` is a
      manual-style verifier for properties of
      `mathc self-check` itself (e.g.,
      `mathc-self-check-verdict-pass`). The classifier
      treats the prefix as manual; the obligation's
      acceptance is the caller's responsibility to wire
      through an attestation.
    owner: human:maintainer
    consequence_if_false: |
      If a future refactor moves these checks out of
      `mathc self-check`, the prefix becomes dead. The
      classifier does not file-check it.
    review_on:
      - signal: self-check-keyword-markers-move


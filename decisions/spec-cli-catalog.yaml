---
schema: math-coding/3.2
id: spec-cli-catalog
revision: 3
state: active
#
# Rev 3 (2026-11-01): the promise the claims inventory falsified --
# "the normative section lists every command the dispatcher has" --
# rewritten as the promise the tree can keep. The spec documents 18
# commands and the dispatcher answers 39; 21 are implemented and
# undocumented. The gap is now MEASURED and bounded by a ceiling that
# may only fall:
# tests/fixtures/spec-cli-catalog-gap.sh.
negative_control: tests/fixtures/spec-cli-catalog-gap.sh
intent: |
  Close the docs/AUDIT-0.0.11.md "Promote `mathc validate`, `mathc
  context`, `mathc assess`, `mathc attest` in `spec/semantics.md`" gap
  (recommendation section Process improvements item 13) by adding a
  normative "CLI subcommands" section to spec/semantics.md that
  lists every mathc subcommand the 3.0-alpha kernel ships at HEAD,
  with synopsis, input arguments, output shape, exit code, and the
  bootstrap obligation each subcommand satisfies. Today the
  subcommand list lives only in bin/Mathc.ml's header comment,
  which is implementation detail; the spec must be authoritative
  so that "the spec describes what the CLI does; the CLI does what
  the spec says" can be enforced. A spec table also gives the
  audit reviewer a single location to compare the normative
  surface against the runtime surface.

  2026-11: the eight files this decision named under bootstrap/ are
  the corpus's pre-migration names for the decisions that now live under
  decisions/. The relations name them where they are.

  2026-11-01, REVISION 3: THE CATALOG NEVER DID LIST EVERY COMMAND,
  AND THE PROMISE SAID IT DID. The section this decision added
  documents the TEN bootstrap subcommands (version, validate,
  context, assess, attest, gate, session-start, record, stats,
  time-estimate) and the subcommands that came with them later
  (explain, mode, rebuttals, re-evaluate, self-check, gaps,
  packages, render) -- 18 rows in all. The dispatcher answers 39
  names. Twenty-one of them are implemented and undocumented,
  including verify, update, explain-diagnostic, init, migrate,
  doctor and rehash.

  The promise "the catalog lists every command the dispatcher has"
  has been false for as long as it has been written, and a promise
  that has been false for a month is worse than no promise: it
  teaches the reader that this corpus's promises are decoration.
  So the promise is replaced by the one the tree can keep:

    THE GAP IS MEASURED, AND IT IS BOUNDED.
      A fixture reads the dispatcher's own match arms out of
      `bin/Mathc.ml` and the rows out of `spec/semantics.md`, counts
      the commands that are implemented and undocumented, and pins
      that number as a ceiling that may only fall. Today the number
      is 21. A corpus that grows the CLI without growing the spec
      pushes the number over the ceiling and the fixture goes red.

    THE CATALOG IS STILL NORMATIVE FOR WHAT IT DOCUMENTS.
      The rows that are there describe the commands they name: their
      synopsis, their arguments, their output shape, their exit code
      and the bootstrap obligation each one discharges. The
      bootstrap ten are still all dispatched and still all
      documented.

    THE REMAINING TWENTY-ONE ARE A NAMED GAP, NOT A SILENCE.
      They are listed by the fixture, one per line, next to the
      number. The plan that closes the gap is tranche T3.2 of
      `docs/plans/redundancy-and-portability-2026-11.md`, which
      replaces the whole normative text with a contract of about a
      hundred lines -- a different shape of document, decided
      there and not here.

axiom_link:
  - A0
commitment: |
  spec/semantics.md keeps its "CLI subcommands" section, placed
  BEFORE the existing "Context-prioritisation" section, and every
  row it carries describes the command it names: the synopsis, the
  input arguments, the output shape (text vs JSON and the field
  set), the exit code (per OCAML_BEST_PRACTICES section 4.3: 0/1/2/3),
  and the bootstrap obligation that justifies the subcommand's
  existence. The section is normative for the commands it names.

  The section does NOT cover every command the dispatcher answers,
  and this decision does not claim that it does. The gap is
  measured instead: `tests/fixtures/spec-cli-catalog-gap.sh` reads
  the dispatcher's match arms out of `bin/Mathc.ml` and the rows out
  of `spec/semantics.md`, prints the number of implemented and
  undocumented commands, and fails when that number exceeds its
  ceiling (21, measured 2026-11-01). The ceiling may only fall.

  The header comment in `bin/Mathc.ml` remains the implementation
  summary; the spec remains the authoritative contract for what it
  documents. bin/Mathc.ml is NOT modified by this decision.

scope:
  capabilities:
    - spec-cli-catalog-promoted
  paths:
    - "spec/semantics.md"
    - "tests/repo_structure.ml"
    - "tests/fixtures/spec-cli-catalog-gap.sh"
    - "docs/AUDIT-0.0.11.md"
  # 2026-10-25: pruned from this scope, per decisions/dead-scope-paths-2026-10.yaml
  #   bootstrap/spec-cli-catalog.yaml - no tracked file matches it
  exclusions:
    - "bin/Mathc.ml"
    - "lib/**"
    - "schemas/**"
    - "bootstrap/decision.yaml"
    - "bootstrap/infrastructure-honesty.yaml"
    - "bootstrap/kernel-conformance-runner.yaml"
    - "bootstrap/validate-and-context.yaml"
    - "bootstrap/adapters.yaml"
    - "bootstrap/time-honesty.yaml"
    - "bootstrap/time-honesty-storage.yaml"
    - "bootstrap/gate-decision.yaml"
    - "bootstrap/priority-drift.yaml"
    - "bootstrap/yaml-block-scalars.yaml"

outcomes:
  - id: cli-subcommands-listed-in-spec
    statement: |
      spec/semantics.md contains a normative "CLI subcommands"
      section whose rows describe the commands they name -- the
      bootstrap ten (version, validate, context, assess, attest,
      gate, session-start, record, stats, time-estimate) and the
      eight that came with the kernel after them -- with the
      synopsis, the arguments, the output shape, the exit code and
      the bootstrap obligation each one discharges.
  - id: the-catalog-gap-is-measured
    statement: |
      The number of commands the dispatcher answers and the
      normative catalog does not document is measured by a fixture,
      printed with the names of the undocumented commands, and pinned
      as a ceiling that may only fall.
  - id: spec-precedes-implementation
    statement: |
      The CLI subcommands section is placed BEFORE the existing
      "Context-prioritisation" section in spec/semantics.md. The
      section order is: CLI subcommands, Context-prioritisation,
      Kernel Output. Reading the spec from top to bottom, the
      reader encounters the CLI surface before the priority
      semantics that depend on it (the priority table is what
      `mathc context` emits).
  - id: implementation-remains-unchanged
    statement: |
      bin/Mathc.ml is NOT modified by this decision. The header
      comment in bin/Mathc.ml stays as the implementation summary;
      the spec table is the normative contract for the commands it
      names.

counterexample: |
  Why not put the CLI subcommand list in bin/Mathc.ml's header
  comment only, and treat that as authoritative? Because the
  spec is the normative contract and bin/ is implementation.
  Putting the authoritative list in an implementation header
  inverts the policy hierarchy that spec/constitution.md
  establishes. The bootstrap protocol (AGENTS.md §Read first)
  names spec/ as a primary source, second only to the
  constitution; a kernel implementer reading the spec should
  not have to open bin/ to learn what subcommands exist.

  Why not put the CLI subcommand list in OCAML_BEST_PRACTICES.md?
  Because OCAML_BEST_PRACTICES.md is a mirrored subset of the
  spec for implementer convenience (see the priority-table
  precedent in bootstrap/validate-and-context.yaml countercase
  line 124, and the priority-drift detector in
  bootstrap/priority-drift.yaml that exists precisely because
  the mirror can drift). The spec is the source of truth; a
  mirror would invite the same drift that priority-drift was
  designed to prevent.

  Why not auto-generate the spec table from bin/Mathc.ml's
  dispatch table at build time? Because the spec is a single
  Markdown document, not a templated artifact, and generating
  part of it from OCaml would add a build-step dependency that
  the 3.0-alpha bootstrap does not yet support. A human-written
  spec table is auditable side-by-side with bin/Mathc.ml's
  dispatch; a generator hides its source.

  Why list subcommands that are still scaffolds (notably
  `gate BASE HEAD`)? Because the spec must describe what the
  CLI does, not only what is fully integrated. Omitting a
  scaffolded subcommand would create the same gap this
  decision exists to close: the implementation has a behaviour
  the spec does not describe. The spec entry for `gate`
  labels it accordingly (verdict is one of Pass / Unknown /
  Block in the scaffold; full blocking comes with the
  attestation store).

assumptions:
  - id: spec-cli-catalog-is-decision
    state: assumed
    statement: |
      The act of adding a CLI subcommand catalog to the spec is
      itself a Decision (it commits to "the spec describes what
      the CLI does; the CLI does what the spec says"). It is
      not a formatting / spelling change, a generated output, or
      a behavior-preserving refactor. The catalog promotes the
      CLI surface from an implementation comment to a normative
      spec section.
    owner: human:maintainer
    consequence_if_false: |
      Without this decision, the spec/CLI gap remains open and
      every future CLI addition re-invites a "is this in the
      spec?" audit question.
    review_on:
      - signal: cli-addition-without-spec-row
  - id: the-bootstrap-ten-are-still-dispatched
    state: assumed
    statement: |
      The ten subcommands this decision named are still dispatched
      by `bin/Mathc.ml` and still documented by the catalog, and no
      spec row is dangling without a bin/ handler. The OTHER
      commands the dispatcher answers -- 21 of them on
      2026-11-01 -- are NOT documented, and this decision does not
      pretend otherwise: their number is the ceiling in
      `tests/fixtures/spec-cli-catalog-gap.sh`.

      REVISION 3: the older form of this assumption said "no
      subcommand implemented in bin/ is missing from the spec's new
      catalog". That was false when it was written and it has been
      false ever since; a promise that is false on the day it is
      written is not an assumption, it is a decoration. The form
      above is the one the tree can keep: the bootstrap ten are
      whole, and the rest of the CLI surface is a number with a
      ceiling and a plan (tranche T3.2 of
      `docs/plans/redundancy-and-portability-2026-11.md`).
    owner: human:maintainer
    consequence_if_false: |
      If the dispatcher drops one of the ten the catalog documents,
      the spec is describing a command that no longer exists, and
      the fixture's measurement would report it as a row without a
      command. If the gap grows, the ceiling catches it.
    review_on:
      - signal: catalog-gap-ceiling-is-exceeded
      - signal: a-bootstrap-command-leaves-the-dispatcher
  - id: catalog-stays-acronym-free
    state: assumed
    statement: |
      The catalog uses the existing bin/ dispatch names
      verbatim (version, validate, context, assess, attest,
      gate, session-start, record, stats, time-estimate). It
      does not invent alias names. A reader can find a
      subcommand in the spec by its dispatch name without
      consulting an alias map.
    owner: human:maintainer
    consequence_if_false: |
      Alias maps drift; an alias in the spec that bin/ does
      not handle is a silent failure (dispatch prints "unknown
      command" and exits 2).
    review_on:
      - signal: spec-row-lists-alias-not-in-bin

obligations:
  - id: spec-cli-catalog-promoted
    outcome: cli-subcommands-listed-in-spec
    claim: |
      spec/semantics.md contains a section titled "CLI
      subcommands" (or equivalent normative heading) that lists the
      bootstrap subcommands it names -- version, validate, context,
      assess, attest, gate, session-start, record, stats,
      time-estimate -- and, for each of them, the synopsis, the
      input arguments, the output shape, the exit code (per
      OCAML_BEST_PRACTICES section 4.3) and the bootstrap obligation
      that justifies the subcommand. The section appears BEFORE the
      existing "Context-prioritisation" section so the reader
      encounters the CLI surface before the priority semantics that
      depend on it.
    acceptance:
      all:
        - verifier: dune test --root . tests/repo_structure.exe

  - id: spec-catalog-fixture-implemented
    outcome: cli-subcommands-listed-in-spec
    claim: |
      tests/repo_structure.ml:test_spec_catalog_present walks
      spec/semantics.md, asserts the file contains a section whose
      heading names "CLI subcommands" and whose body mentions each
      of the ten canonical subcommand names, and fails the
      Alcotest case with a "missing: <name>" list on the first
      absent name. This is the implementation record for the
      obligation spec-cli-catalog-promoted.
    acceptance:
      all:
        - verifier: dune test --root . tests/repo_structure.exe

  - id: the-catalog-gap-is-measured
    outcome: the-catalog-gap-is-measured
    claim: |
      `tests/fixtures/spec-cli-catalog-gap.sh` reads the command
      names out of the dispatcher's match arms in `bin/Mathc.ml` and
      the catalog rows out of `spec/semantics.md`, prints how many
      dispatcher commands have no normative row, lists them, and
      fails when that number exceeds its ceiling -- 21 on
      2026-11-01, of 39 dispatched commands and 18 documented ones.
      Its own negative controls require the measurement to report a
      synthetic gap over the ceiling, a synthetic gap of zero, and
      `unknown` for a spec that cannot be read.
    acceptance:
      all:
        - verifier: tests/fixtures/spec-cli-catalog-gap.sh

reversal:
  - signal: cli-surface-becomes-templated
    action: replace-hand-written-spec-section-with-template-rendered-from-ocaml-when-supported
  - signal: spec-catalog-becomes-duplicated-in-ocaml-best-practices
    action: add-a-priority-drift-detector-mirror-when-a-mirror-table-appears

risk:
  declared_triggers:
    - spec-row-drifts-from-bin-dispatch
    - new-subcommand-added-without-spec-row
    - existing-subcommand-changes-exit-code-silently
  owner: human:maintainer


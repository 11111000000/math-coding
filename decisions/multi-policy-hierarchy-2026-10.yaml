axiom_link:
  - A0
intent: |
  Extend the multi-policy algebra (spec/algebra-3.2.md §9) with a
  third composition axis: hierarchical policy composition. Current
  §9 covers two axes — union (sum of obligations across policies
  matching the same path) and transitive (data-flow reachability
  through imports/exports). Hierarchy is the missing third axis:
  a policy may declare `parent: <policy_id>` and inherit all
  obligations, scope paths, and a raised mode_floor from its
  parent, then narrow them in the child.

  The three composition axes are:

    (a) union       — multiple policies on one path: sum
        obligations, max(mode_floor), summed override (algebra §9
        direct_obligations + §2 mode_floor_of).
    (b) transitive  — data-flow reachability: obligations follow
        imports/exports to closure (algebra §9 transitive_paths,
        data_flow_targets*).
    (c) hierarchical — parent inheritance: a policy's parent is
        walked, accumulating parent's obligations + scope_paths,
        max'ing mode_floor, and using CHILD's override_probability
        (not parent's).

  This decision closes the gap left by algebra §9: §9 names the
  union and transitive axes but not the hierarchy axis. With this
  change a project can express "default policy catches every path,
  payments policy inherits from default and adds strict mode_floor
  + PCI obligation references" without duplicating the default's
  scope_paths in the child.

  Boundaries:
    - This cycle does not change the four algebraic closure
      definitions in §9; it adds a third axis (hierarchy) and names
      it in a clarifying §9.1 note. Parent inheritance is a
      preprocessing step that runs BEFORE the union/transitive
      composition of §9; the resolved policy is what flows through
      compose(), mode_floor_of(), policy_override_of_files().
    - The cycle does not allow multiple inheritance (a list of
      parents). Single parent is sufficient for the documented
      use cases (default → specialised). Multiple inheritance is
      a follow-up decision if needed.
    - The cycle does not change how the kernel reads or caches
      `policies.yaml` at startup; the new field is optional and
      existing policies parse unchanged.

commitment: |
  After this decision lands:

  1. `lib/policy.ml::policy` record gains `parent : string option`
     field. Existing record constructions are updated to default
     the field to `None`.

  2. `lib/policy.ml::resolve_policy : policy list -> string ->
     (policy, Diagnostic.t) result` walks the parent chain,
     accumulating obligations, scope_paths, and mode_floor across
     parents and child. The function:
       - Returns `Ok merged_policy` when the chain terminates
         cleanly (no cycles, root reached).
       - Returns `Error (Diagnostic.t with code "MC-POLICY-CYCLE")`
         when a cycle is detected (a parent appears twice in
         the chain).
       - Returns `Error` when the target policy_id is not in the
         input list (with `code "MC-POLICY-NOT-FOUND"`).
     The resolved policy's `policy_id` is the child's id; the
     resolved policy's `parent` field is `None` (the chain has
     been flattened; the resolved policy stands on its own).

  3. Resolution rules:
       - obligations  = union(parent_obligations, child_obligations),
         deduplicated by (kind, namespace).
       - scope_paths  = union(parent_scope_paths, child_scope_paths),
         deduplicated as strings.
       - mode_floor   = max(parent_mode_floor, child_mode_floor).
       - override_probability = child's value (child wins; parent
         is overridden by the child, mirroring §2 "override
         probability overrides" semantics). When the child's
         override_probability is 0.0 but the parent's is non-zero,
         the parent's value is preserved (the default-zero child
         does not erase an explicit parent override).

  4. The schema `schemas/policy.json` gains an OPTIONAL
     `parent : { "type": "string" }` property. Existing policy
     files parse unchanged (parent absent ⇒ None).

  5. The `policies.yaml` parser in `lib/policy.ml::parse_policy`
     accepts an optional `parent:` string field and threads it
     into the record.

  6. `lib/policy.ml::default_policy` and all sample policies used
     by `tests/risk_kernel.ml` are updated to set `parent = None`.

  7. `tests/policy_test.ml` is added (registered in `tests/dune`)
     with five test cases:

       (a) `resolve_policy_no_parent_returns_same`: a policy with
           `parent = None` resolves to itself (modulo field
           normalisation; same obligations, scope_paths,
           mode_floor).
       (b) `resolve_policy_one_level_inherits_parent`: parent ∪
           child — the resolved policy carries the union of
           obligations and scope_paths and the max of mode_floor.
       (c) `resolve_policy_three_level_chain_returns_cumulative`:
           grandparent → parent → child; the resolved policy
           carries the cumulative union across all three.
       (d) `resolve_policy_cycle_returns_MC_POLICY_CYCLE`: a ↔ b
           (cycle) returns `Error` carrying code
           `"MC-POLICY-CYCLE"`.
       (e) `resolve_policy_mode_floor_takes_max`: parent.mode_floor
           = Strict, child.mode_floor = Exhaustive → resolved
           mode_floor = Exhaustive.

  8. `spec/algebra-3.2.md` §9 is annotated with a clarifying note
     naming the three axes (union, transitive, hierarchical) and
     pointing to `resolve_policy` as the preprocessing step.

  9. The `MC-POLICY-CYCLE` and `MC-POLICY-NOT-FOUND` diagnostic
     codes are registered in `lib/diagnostic.ml::explain` so
     `mathc explain-diagnostic <CODE>` returns a Definition /
     Occurs-when / Remediation body.

  10. `OCAML_BEST_PRACTICES.md §11` gains a new entry documenting
      the "parent inheritance overrides child only when child
      is the explicit default-zero" rule (the trap is: a future
      regression where the child's 0.0 silences the parent's
      non-zero override).

  11. `mathc self-check` still returns 67 pass / 1 unknown / 0
      fail (no regression).


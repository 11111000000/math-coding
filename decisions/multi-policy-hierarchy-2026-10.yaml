reversal:
  - signal: hierarchy-superseded-by-loader-convention
    condition: |
      If a future decision supersedes this one with
      `import: <file>` semantics that pushes hierarchy out of
      the kernel into the YAML loader.
    action: |
      Remove `parent` field from `policy`; remove
      `resolve_policy`; remove `MC-POLICY-CYCLE` /
      `MC-POLICY-NOT-FOUND` codes; remove the §9 hierarchy
      note; gate layer keeps `compose`, `mode_floor_of`,
      `policy_override_of_files` unchanged.


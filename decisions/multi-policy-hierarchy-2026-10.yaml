outcomes:
  - id: parent-field-added
    statement: |
      `lib/policy.ml::policy` record gains `parent : string option`
      and every existing constructor (default_policy, tests, parser)
      threads `None` as the default.
  - id: resolve_policy-implemented
    statement: |
      `lib/policy.ml::resolve_policy : policy list -> string ->
      (policy, Diagnostic.t) result` is implemented, walks the
      parent chain with cycle detection, and returns the cumulative
      union of obligations + scope_paths with max'd mode_floor.
  - id: cycle-detection-emits-diagnostic
    statement: |
      A policy cycle (a ↔ b or a → b → c → a) returns
      `Error (Diagnostic.t with code "MC-POLICY-CYCLE")` and the
      diagnostic is explainable via `mathc explain-diagnostic
      MC-POLICY-CYCLE`.
  - id: schema-accepts-parent-key
    statement: |
      `schemas/policy.json` declares an optional `parent : string`
      property; existing policy files (no parent field) still parse.
  - id: spec-note-three-axes
    statement: |
      `spec/algebra-3.2.md §9` carries a clarifying note naming
      the three composition axes and pointing to resolve_policy
      as the hierarchy-axis preprocessing step.

counterexample: |
  "Hierarchy is over-engineered. The §9 union + transitive axes
  already cover every multi-policy case the project needs; adding
  parent inheritance introduces a third composition rule with
  subtle override semantics (does the child's 0.0 erase the
  parent's non-zero override?) that future maintainers must
  learn. The kernel is simpler without it."

  Counterargument: §9 calls out "policy(p) = declared(p) if exists
  else default-policy" but the spec is silent on declared-vs-
  default ordering. Today, `policies.yaml` projects have to
  re-declare every default-policy scope_path in every specialised
  policy to keep the math sound (`axioms/**` policy re-list the
  whole tree below axioms/). That duplication is the gap §9
  leaves open; hierarchy closes it. The override semantics have
  exactly one ambiguous case (child 0.0 vs parent non-zero),
  addressed in rule 3 above (child's 0.0 does NOT erase parent's
  non-zero — default-zero never overrides explicit value).

  "Cycle detection turns `resolve_policy` into a parser, not a
  pure resolver. The function's purity (algebra §9) is the value
  — diagnostic emissions are a side effect that belongs in the
  gate layer."

  Counterargument: cycle detection is total (no exception, no
  I/O, no state mutation). The result-type `Ok | Error of
  Diagnostic.t` keeps the function pure: the Diagnostic is a
  value, not a side effect. The gate layer that consumes the
  result can decide whether the cycle is a blocker (mode >=
  standard) or a warning (mode tiny/light); the resolver itself
  is pure. This mirrors `lib/decision.ml::parse_decision` which
  already returns `Diagnostic.t` lists from a pure function.

  "Self-application: this decision changes a kernel module
  (`lib/policy.ml`) that ALL other kernel modules depend on.
  A3-protected transitions require human review before merge."
  This change is NOT a constitutional amendment (axioms A0-A4
  preserved), only an additive kernel extension (a new field and
  a new function). Bootstrap-v3 admissibility is preserved;
  reviewer sign-off is tracked under `outcomes.acceptance`.

antithesis: |
  Maintaining three composition axes (union + transitive + hierarchical)
  is a maintenance burden proportional to 3× the test surface. The
  third axis is justified by use case but creates new failure modes —
  parent linking mistakes, deep chains, override ambiguity — that the
  kernel must defend against. A simpler alternative is to encode
  hierarchy via a SECOND `policies.yaml` file imported by the first,
  with the gate layer merging the two lists before §9 composition.
  This pushes hierarchy out of the kernel and into the loader, keeping
  resolve_policy ≈ identity and avoiding new diagnostic codes in
  `lib/diagnostic.ml`. The trade-off is a YAML loader convention
  (import: <file>) instead of a typed `parent` field; the maintainer's
  authoring cost is similar but the kernel stays smaller. The
  hierarchical-axis decision is therefore a deliberate choice to grow
  the kernel to grow the expressiveness, not the smallest diff that
  closes the gap.

assumptions:
  - id: single-parent-sufficient
    state: assumed
    statement: |
      A policy has at most ONE parent. Multiple inheritance (a list
      of parents) is out of scope for this cycle; the
      `parent : string option` field encodes exactly one parent.
    owner: human:maintainer
    consequence_if_false: |
      If multiple inheritance becomes a requirement, the field
      widens to `parents : string list` and the resolution rule
      becomes union-of-parents before child. A separate decision
      documents the merge order (left-to-right vs priority key).
    review_on:
      - signal: multiple-inheritance-required

  - id: child-zero-does-not-erase-parent
    state: assumed
    statement: |
      When `child.override_probability = 0.0` and
      `parent.override_probability ≠ 0.0`, the resolved policy
      inherits the parent's non-zero value. Default-zero NEVER
      overrides an explicit value.
    owner: human:maintainer
    consequence_if_false: |
      If the rule is reversed, a child policy that does not name
      `override_probability` silently drops the parent's setting.
      Future regressions where a policy author forgets to set
      override_probability on the child produce surprise zero-overrides.
    review_on:
      - signal: override-default-semantics-changed

  - id: diag-emission-is-pure-result
    state: assumed
    statement: |
      `resolve_policy` returns `(policy, Diagnostic.t) result`
      rather than raising or logging. The Diagnostic is a value
      in the OCaml heap; the function is total and pure. Callers
      that wish to log surface the diagnostic themselves (the
      gate layer does this for cycle cases).
    owner: human:maintainer
    consequence_if_false: |
      If cycle detection mutates a ref or logs to stderr, the
      function loses purity and `tests/policy_test.ml` becomes
      hard to assert against. The result-type keeps the API
      honest; callers see the diagnostic explicitly.
    review_on:
      - signal: diag-side-effect-introduced


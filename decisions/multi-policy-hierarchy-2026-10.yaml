id: multi-policy-hierarchy-2026-10
revision: 1
state: active
negative_control: tests/fixtures/shell-grep-negative-control.sh
mode: standard
body_sha: "sha256:2f04f107c4360e1c9de409c5354844118213d20e98cdd595fbace54d63a44664"

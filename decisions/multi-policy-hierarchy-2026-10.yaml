  - id: cycle-detection
    outcome: cycle-detection-emits-diagnostic
    claim: |
      `resolve_policy` returns `Error (Diagnostic.t with code
      "MC-POLICY-CYCLE")` when the parent chain contains a cycle.
      The diagnostic is registered in `lib/diagnostic.ml::explain`.
    acceptance:
      all:
        - verifier: tests/policy_test.ml
        - verifier: mathc explain-diagnostic MC-POLICY-CYCLE

  - id: schema-parent-optional
    outcome: schema-accepts-parent-key
    claim: |
      `schemas/policy.json` declares an optional `parent : string`
      property and the policies YAML parser accepts it; existing
      policies without `parent` parse unchanged.
    acceptance:
      all:
        - verifier: tests/policy_test.ml

  - id: spec-note-three-axes
    outcome: spec-note-three-axes
    claim: |
      `spec/algebra-3.2.md §9` carries a clarifying note naming

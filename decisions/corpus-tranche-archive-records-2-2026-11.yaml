          is `math-coding/migration-manifest`, not a decision schema:
          they are operational INPUT to `mathc migrate`, which reads
          them to print a per-file plan. A manifest is not a rule the
          corpus obeys; it is a thing the kernel consumes. The census
          already excludes them from the decision count for that
          reason, and this tranche leaves them where they are.

      (2) `decisions/gate-decision.yaml` STAYS. The normative text
          names it: `spec/semantics.md:321` says "Justification:

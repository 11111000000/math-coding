  source: "task:T2.2b tranche 2 of the archive-records work: the nine RECORD decisions named in docs/corpus-claims-inventory-2026-11.md sections 7.1 to 7.8 and 7.10"
  text: |
    THE RULE THIS TRANCHE APPLIED. A mention is not a dependency. A
    file may leave the live corpus when NOTHING DEPENDS on it: no
    machine opens it, no live test reads it by path, no verifier runs
    it, no live scope path or index row points at it as the thing to
    look at, and no live relation resolves to it as a live target. A
    comment, a changelog entry, a ROADMAP line, an id cited in prose,
    or a fixture that names the id in a diagnostic string is a MENTION,
    and a mention does not keep a record alive.

    The reference for the shape of the move is the tranche before this
    one (`archive/decisions/corpus-tranche-archive-records-2026-11.yaml`,
    which this tranche archives as well: a record of a record). The
    shape of a moved file is the archive's own shape: `state: retired`,
    one comment line saying why and by which tranche, the revision
    bumped by one because the bytes changed, and both digests
    recomputed with the placeholder-substitution algorithm
    (`mathc rehash --write`), so the file validates `parse-ok` from its
    archived path.

    THE NINE THAT MOVED, AND THE CHECK RUN FOR EACH. The inventory
    named the list; every item on it was re-checked against this tree
    before it moved, because an inventory observation is a hypothesis
    to re-run, not a fact to copy.

    1. adopter-path-2026-10 -> archive/decisions/adopter-path-2026-10.yaml
       CHECK: `git grep -n -F adopter-path-2026-10` over the tracked
       tree, and the file's own header (`state: superseded`). FOUND:
       one scope path and one prose pointer in the live decision
       `decisions/skill-single-source-2026-10.yaml`; one relation
       `adopter-path-2026-10@1` (an ID form, which the corpus resolves
       across the live tree AND the archive); one comment in
       `scripts/check-no-prose-policy-grep.sh`. Nothing opens the file.
       RETARGETED: the scope path and the prose pointer in
       skill-single-source-2026-10.yaml.

    2. attestation-store-fill -> archive/decisions/attestation-store-fill.yaml
       CHECK: `git grep -n -F attestation-store-fill`, and
       `git ls-files attestations/**` (0 files: the store is generated,
       not tracked). FOUND: two live path pointers - the index row in
       PACKAGES.md and the companion line in attestation-source-map.md
       - and a set of ID mentions, among them the live relation
       `attestation-store-fill@3` in
       `decisions/ci-gate-exit-honesty-2026-10.yaml`, which resolves in
       the archive and was left alone. The file carries NO obligations
       at all: it records a store fill that happened at an old HEAD,
       and the live policy now says the store is generated.
       RETARGETED: PACKAGES.md and attestation-source-map.md.

    3. audit-0.0.21-fixes -> archive/decisions/audit-0.0.21-fixes.yaml
       CHECK: `git grep -n -F audit-0.0.21-fixes`. FOUND: three path
       pointers in OCAML_KERNEL_CONVENTIONS.md (the live convention doc
       says where the conformance evidence is), one index row in
       PACKAGES.md, four scope paths - two in live decisions, one

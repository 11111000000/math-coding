    WHAT WAS RETARGETED, IN ONE PLACE. Twelve live files and one
    archived file were edited so that no pointer to a moved file
    names a path that no longer exists:

      PACKAGES.md - three index rows and one cram-test row
        (attestation-store-fill, cli-cram-tests, audit-0.0.21-fixes,
        and the `version.t` row);
      OCAML_KERNEL_CONVENTIONS.md - three pointers to
        audit-0.0.21-fixes and one to cli-cram-tests;
      attestation-source-map.md - the companion line;
      decisions/skill-single-source-2026-10.yaml - one scope path and
        one prose pointer;
      decisions/declared-promises-and-three-numbers-2026-11.yaml -
        three scope paths;
      decisions/install-tooling-2026-10.yaml - one scope path;
      decisions/waiver-infrastructure-2026-10.yaml - one scope path
        (a glob, which would otherwise have become a dead scope path);
      decisions/corpus-growth-lints-2026-11.yaml - one scope path and
        one prose pointer;
      decisions/attestation-producer-vocab-2026-10.yaml - one prose
        pointer;
      tests/corpus_no_silent_drops/corpus_no_silent_drops.ml and
        tests/yaml_seq_continuation.ml - the two exact-path reads and
        the file lists that name the moved file;
      tests/fixtures/verifier-schemes-are-canonical.sh - the header
        comment that names the decision the instrument belongs to;
      archive/decisions/audit-0.0.21-fixes-self-check-waiver-2026-10.yaml
        - five pointers (an archived record that named a live file).

    THE POINTERS THAT WERE LEFT ALONE, AND WHY. A pointer in a live
    file that names a moved file as the thing to look at is a
    DEPENDENCY and was retargeted. A mention inside a narrative is a
    MENTION: it stays true wherever the file lives, and rewriting it
    would rewrite history to contain the word "archive". Left alone:
    CHANGELOG.md (the `audit-0.0.21-fixes` waiver line, the
    `kernel-bugs-v3.4` entry), ROADMAP.md (the
    `decisions/kernel-bugs-v3.4-2026-10.yaml` line),
    docs/AUDIT-0.0.21.md (three pointers - an audit report is a
    report, and the previous tranche left AUDIT-0.0.20.md alone for
    the same reason), the ID-form relations (which resolve across the
    live tree and the archive), and the code and test COMMENTS.

    ONE POINTER COULD NOT BE FIXED HERE, AND IT IS NAMED.
    `lib/codec.ml:943` lists `decisions/cli-cram-tests.yaml` among the
    files the D4 defect cost the kernel, next to the two that were
    already moved to the archive in the previous tranche. It is the
    same kind of pointer as the two test files this tranche retargeted,
    and it now names a path that no longer exists. `lib/**` was out of
    scope for this tranche, so the pointer stays and is declared here
    rather than quietly narrowed: the next reader of that comment sees
    a stale path, and this decision says why. The same holds for the
    diagnostic string in `lib/diagnostic.ml:1292`, which names
    `decisions/corpus-tranche-broken-schemes-2026-11.yaml` as the
    record of the canonical scheme list - a reader of that diagnostic
    must be redirected by whoever owns `lib/**`.

    WHAT WAS DELIBERATELY NOT MOVED. Four records stay live, and the
    reasons are recorded here so that the next tranche does not have
    to rediscover them.


counterexample: |
  The strongest objection against moving a file is navigation: the
  reader follows a path, the path is gone, and the reader concludes
  the promise was deleted rather than filed.

  The objection is right about the reader and does not establish a
  dependency, but it is not empty either, and this tranche did not
  treat it as empty. Every pointer that told a reader where a CURRENT
  file is was moved with the file: twelve live files and one archived
  file were edited. What remained is the class of narrative mentions -
  a changelog entry, a ROADMAP line, an audit report, a code comment -
  and those are left with their historical coordinates, because a
  dated story is true wherever the file lives and rewriting it to say
  "archive" would make the history say something it never said.

  The honest form of the answer is the one this decision takes: the
  dependency criterion decides what may move; the navigation cost is
  paid where it is real and declared where it cannot be paid. Two
  pointers could not be paid at all, because `lib/**` was out of
  scope, and they are named rather than left to be discovered by a
  reader who assumes the corpus is tidy.

  A second objection is arithmetic: the corpus count fell by eight,
  not nine, because this decision entered it. True, and the corpus
  count is the wrong number to look at: the ARCHIVE count is what
  records the moves, and it grew by nine. The census measures the
  first and reports the second in the same run, so both are visible
  at once.

  A third objection is the one the inventory itself raises: two of
  the moved files (`ceiling-monotonic` and `adopter-path-2026-10`)
  are `superseded` rather than finished, and a superseded rule is
  still a rule - somebody might still have to read it. The answer is
  the one the corpus already gave: a superseded decision carries no
  open obligation in the live corpus (the kernel's audit lists no gap
  for either), and its ID stays resolvable in the archive, so the
  history it names can still be reached.

antithesis: |
  The opposite position is that every path mention is a dependency,
  every historical record must therefore stay live until all the
  prose around it is rewritten, and the archive should be reserved for
  files that no sentence in the repository mentions at all.

  That position keeps the corpus navigable and costs the corpus its
  ability to answer a question: "what does this repository promise?"
  A corpus that carries its own completed work as live rules makes
  every reader do the classification work the inventory already did,
  and makes the gate keep re-reading work that is finished.

  The position this tranche rejects is not the desire for navigable
  references. It is the inference that navigability can only be bought
  by keeping files active. The archive plus the ID resolver buys it
  more cheaply: the record leaves the rule set, stays addressable by
  id, and every pointer that was a live dependency was moved with it.


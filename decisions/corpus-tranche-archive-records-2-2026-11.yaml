risk:
  owner: human:maintainer
  declared_triggers:
    - a-live-machine-dependency-is-misclassified-as-an-id-mention
    - a-pointer-to-a-moved-record-is-left-naming-a-dead-path
    - normative-text-is-edited-without-an-a3-transition
    - the-corpus-ceiling-is-raised-instead-of-lowered
    - the-archive-is-walked-by-the-gate

assumptions:
  - id: ids-resolve-across-live-and-archive
    state: assumed
    owner: human:maintainer
    statement: |
      The corpus's relation-target and census instruments resolve
      decision IDs across both the live tree and archive/decisions, so
      an ID-only relation stays resolvable after a record moves.
    consequence_if_false: |
      If the instruments stopped reading the archive, the ID-form
      relations that point at the nine moved records would become
      dangling and this criterion would have to be re-evaluated record
      by record.
    review_on:
      - signal: the-relation-lint-stops-reading-the-archive

  - id: the-archive-is-not-walked-by-the-gate
    state: assumed
    owner: human:maintainer
    statement: |
      The live gate walks decisions/ and excludes retired and
      superseded states, so a retired record in archive/decisions/
      contributes no open obligation.
    consequence_if_false: |
      If the gate began walking the archive, moving a record could
      hide an obligation instead of closing it, and the tranche would
      need a different retirement protocol.
    review_on:
      - signal: the-gate-walks-the-archive

  - id: a-bumped-revision-is-a-new-version-not-a-new-claim
    state: assumed
    owner: human:maintainer
    statement: |
      The revision field is the document's version coordinate, and a
      moved record's bytes changed (state, comment line, digests), so
      its revision is bumped by one. The bodies stay as they were: a
      record's own sentences about its earlier revisions - "RETIRED at
      revision 2" in ceiling-monotonic - remain statements about the
      edit that made them, not about the current header.
    consequence_if_false: |
      If a revision is read as the number of the CLAIM rather than of
      the document, a bumped header would look like a promise that was
      made again, and a reader could take a record for a live rule.
    review_on:
      - signal: a-revision-is-read-as-a-claim-number

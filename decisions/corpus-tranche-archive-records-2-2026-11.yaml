       ARCHIVED waiver record
       (`archive/decisions/audit-0.0.21-fixes-self-check-waiver-2026-10.yaml`)
       that names the file five times. That waiver's claim - "the
       decision is byte-identical before and after this commit" - is
       scoped to its OWN commit, so it stays true; its pointers were
       moved to the archive and its digests recomputed.
       RETARGETED: OCAML_KERNEL_CONVENTIONS.md, PACKAGES.md,
       install-tooling-2026-10.yaml, waiver-infrastructure-2026-10.yaml,
       corpus-growth-lints-2026-11.yaml, the archived waiver record.

    4. ceiling-monotonic-2026-10 -> archive/decisions/ceiling-monotonic-2026-10.yaml
       CHECK: `git grep -n -F ceiling-monotonic-2026-10`. FOUND: two
       scope paths in live decisions
       (`decisions/declared-promises-and-three-numbers-2026-11.yaml`,

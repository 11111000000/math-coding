axiom_link:
  - A0

intent: |
  THE CORPUS WAS WALKED ELEVEN WAYS, AND ONLY ONE OF THEM COULD SEE
  IT WHOLE.

  `lib/memory.ml` learned the lesson first: a decision filed under
  `decisions/<sub-directory>/` is a decision, and a walker that reads
  one directory cannot see it. The kernel's loader recurses; the
  walker is `Memory.decision_document_paths`, and it applies the
  corpus's STRUCTURAL rule for what a decision document is.

  The rest of the machine did not learn it. Three readers of the
  corpus in PRODUCTION still read one directory:

    `mathc precommit`         the check the commit hook runs over the
                               WHOLE corpus -- and it validated 189 of
                               the 202 decisions, never seeing the
                               thirteen under `decisions/<sub>/`
    `mathc re-evaluate-...`    the second producer of attestations --
                               and it wrote its records for one
                               directory
    `mathc negative-control`   the count a ceiling is pinned against
                               -- measured over one directory, so the
                               ceiling was a ceiling over the wrong
                               corpus

  The cost of eleven walks is not eleven line counts. It is that two
  readers of the same corpus can disagree about what the corpus IS,
  and then each of them is right about its own number: the
  precommit says the corpus is clean, the sweep signs a different
  corpus, and the count that a ceiling is pinned against measures a
  third. A ceiling measured over the wrong corpus is a ceiling over
  nothing.

commitment: |
  1. The three production walks use `Memory.decision_document_paths`
     -- the kernel's own walker -- and nothing else.
  2. `mathc precommit` filters the walk by the corpus's structural
     rule (a document that declares no id, or that belongs to a
     non-decision schema family, is not a decision), so the
     migration manifests and the waivers are not validated as
     decisions.
  3. The count a ceiling is pinned against is measured over the same
     corpus the gate reads.

outcomes:
  - id: every-reader-sees-the-whole-corpus
    statement: |
      `mathc precommit` validates every decision in the corpus,
      including the ones filed under a sub-directory.
  - id: the-ceiling-measures-the-real-corpus
    statement: |
      The negative-control count is measured over the corpus the gate
      reads.


risk:
  declared_triggers:
    - "a decision filed under a sub-directory is validated for the
      first time and does not validate: the corpus grows a red step
      that was there in fact for months, and the fix is the
      decision's, not the walker's"
    - "the recursive walk pulls in a document family that is not a
      decision and validates it as one: the structural rule is what
      prevents it, and the rule is the corpus's"
  owner: human:maintainer

counterexample: |
  "One walker is one point of failure: the recursive walk now feeds
  thirteen documents to a check that never saw them, and one of them
  is malformed."

  The claim is right about the risk and wrong about the remedy. The
  thirteen documents were IN the corpus all along -- the kernel's
  loader read them ✓, the gate decided them ✓, the sweep signed
  them ✓ -- and the check that was supposed to hold them up was
  reading a different set. That is not one walker being a single
  point of failure; it is one of eleven walkers being wrong while
  the other ten were right about their own numbers.

  And a document family that is not a decision is excluded by the
  corpus's own STRUCTURAL rule (no id, or a non-decision schema
  family), not by a list of names: the migration manifests and the
  waivers are documents the kernel dispatches on their schema, and
  the precommit now dispatches them the same way.

antithesis: |
  The opposite claim is that the subdirectories should not hold
  decisions at all: a flat `decisions/` is easier to read, and the
  census that flattened it was the right instinct.

  The claim is right about the reading and wrong about the shape.
  The corpus has always had decisions in subdirectories -- the
  loader recurses ✓, the gate reads them ✓, the sweep signs them ✓
  -- and flattening them would have meant MOVING thirteen live rules
  and rewriting every reference to them. The walk was the thing that
  was wrong, not the layout.

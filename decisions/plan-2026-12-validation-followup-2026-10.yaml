intent: |
  Close the remaining 15 pre-existing `mathc validate` rejections
  that plan-2026-11-validation-cleanup-2026-10 deferred to
  plan-2026-12 due to a parser-edge-case investigation that
  was out of scope at F11 ship time. Two sub-decisions:

  - **F12-A**: 7–8 decisions emit soft-warn
    `MC-COUNTEREXAMPLE-MISSING` (mode:light without counterexample).
    Add counterexample blocks following the established
    pattern (one paragraph naming the strongest objection +
    the reversal condition).

  - **F12-B**: 6 decisions emit hard-reject
    `MC-DECISION-INVALID: missing required field: obligations`
    despite the field being textually present in the YAML. The
    parser path quirk (lib/codec.ml::parse_yaml_pairs lines 710-)
    miscounts bytes inside UTF-8 multi-byte content of `claim: |`
    block scalars and drops the post-scalar `obligations:` key
    from the resulting Jsonl.Object. The fix is a YAML-text
    reformat of the 6 files at parser-friendly indentation,
    verified by adding `obligations:` directly under the
    front-matter (before any `commitment: |` block scalars)
    so the parser's key tracking is not disrupted.

commitment: |
  After this plan closes:

  1. `mathc validate decisions/<id>.yaml` returns `parse-ok`
     for every `state: active` decision file (zero
     `reject:` verdicts).
  2. Zero soft-warn `MC-COUNTEREXAMPLE-MISSING` for any
     `mode: light` decision file.
  3. `mathc self-check` returns the same 184 pass / 0 unknown
     verdict as the post-F11 release/v3.3.2-2026-10@<sha>.
  4. The two sub-decisions are 2 atomic commits on
     release/v3.3.3-followup2-2026-10; each independently
     revertable.

axiom_link:
  - A0
  - A1
  - A3

counterexample: |
  The counter-position considered: "the 6 hard rejects are a
  kernel bug; the fix is `lib/codec.ml::parse_yaml_pairs`
  surgery, not a per-file text reformat. Test coverage on the
  YAML parser (tests/yaml_parsing_test.ml) covers the
  byte-counting edge case but the test corpus predates
  multi-byte `claim: |` content in real decisions."
  Acknowledged: a kernel fix in `lib/codec.ml` is the right
  end-state; this plan documents the parser-clean work-around
  and adds a regression test for the multi-byte edge case so
  the kernel fix is well-pinned. The kernel fix itself is
  out-of-scope for plan-2026-12 (would require F13 with its
  own attestation chain and kernel-stability pre-condition).

  A second counter-position: "the 6 files have non-canonical
  YAML; just `mathc new-decision --write` them and copy the
  bodies." Rejected: `mathc new-decision` regenerates the
  decision without preserving the field-level prose. The
  manual restructure requires reading each file's existing
  intent/commitment/obligations body and re-emitting it in
  parser-friendly form.

outcomes:
  - id: zero-rejects-on-active
    statement: |
      Every `decisions/*.yaml` whose `state: active` exits 0
      under `mathc validate` with verdict `parse-ok`.

  - id: zero-counterexample-warns
    statement: |
      Zero `MC-COUNTEREXAMPLE-MISSING` for any `mode: light`
      decision file in `decisions/`.

  - id: no-self-check-regression
    statement: |
      `mathc self-check` after the plan closes produces the
      same 184 pass / 0 unknown as the post-F11
      release/v3.3.2-2026-10.


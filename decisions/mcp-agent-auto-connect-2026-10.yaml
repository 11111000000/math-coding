intent: |
  Document the documented-but-not-yet-wired path that lets
  an opencode (or other MCP-aware) agent run math-coding
  validation, self-check, and explanation as direct tool
  calls against a running `mathc_mcp` server, without going
  through a `bash` shell call to the mathc binary.

  The MCP server (`bin/mathc_mcp.ml` + `lib/mcp/`) is
  already implemented and ships 11 methods (7 read-only
  in `mcp-server-impl-2026-10@1`, plus 4 read-write in
  `ux-3-mcp-read-write-2026-10@1`). It speaks JSON-RPC 2.0
  over stdio: one request per line on stdin, one response
  per line on stdout. The mathc binary is auto-resolved
  via `Sys.executable_name` so an installed `mathc_mcp`
  picks up the co-located `mathc`.

  Today this server is reachable but not advertised. An
  opencode user would have to read `bin/mathc_mcp.ml` and
  hand-configure an MCP stdio client. This decision
  documents the integration in
  `adoption/SKILL.md` §"MCP integration" so a fresh
  opencode session can `mathc::validate` etc. without a
  shell round-trip.

axiom_link:
  - A0
  - A1

antithesis: |
  The counter-position considered and rejected: "The MCP
  server is shipped but unadvertised; that is the correct
  posture until the install-tooling surface stabilises.
  Documenting an MCP integration path is premature and
  creates a public commitment we may have to retract."
  The author engaged with this position and rejected it
  on three grounds: (a) the server is already in the
  shipped binary (`bin/mathc_mcp.exe`); unadvertising the
  installed capability does not retire it, it only hides
  it from users; (b) the install-tooling-2026-10 surface
  is now stable (per `decisions/install-tooling-2026-10@1`
  closure); the MCP server's only consumer path (agent
  tool calls) is unblocked; (c) per axiom A1, every
  commitment must have a path to observation. The
  unadvertised MCP server has no path to observation;
  this decision documents the path.

commitment: |
  Three deliverables:

  D1. `adoption/SKILL.md` gains a new \u00a7"MCP integration"
      section that describes how to launch
      `bin/mathc_mcp` and how an MCP-aware agent can
      call `mathc/validate`, `mathc/self-check`,
      `mathc/explain`, `mathc/packages`, etc. via
      JSON-RPC over stdio.

  D2. The `.opencode/skills/math-coding/SKILL.md` is
      byte-synced with `adoption/SKILL.md` (per
      `ux-3-repo-tracked-opencode-skill-2026-10@1`).

  D3. `USAGE.md` §"AI agents" is updated to reference
      the MCP integration section.

  Boundaries (A3 self-application):
  - No kernel, no `bin/Mathc.ml`, no `lib/**`,
    `spec/**`, `schemas/**`, `axioms/**` touched.
  - The MCP server implementation is unchanged; this
    decision only documents it.
  - The agent client configuration (opencode.json) is
    per-host, not part of this repo, and is not changed.


counterexample: |
  "What if a user runs an MCP server in the same shell as
   their agent session and exposes the mathc binary path
   wrongly?" Counterargument: `lib/mcp/dispatch.ml::find_mathc`
   resolves the mathc binary from `Sys.executable_name`
   (stripping the `_mcp` suffix); this is the same
   resolution used by the mathc CLI dispatcher. A
   misconfigured `MATHC_BIN` escape hatch is the only
   way to point the server at a different mathc, and
   that variable is documented.

  "What if `bin/mathc_mcp.exe` is not in the user's PATH?"
   Counterargument: the mathc install path installs both
   `mathc` and `mathc_mcp` (per `bin/dune`'s
   `public_name` declarations); the launch command in
   the doc references the absolute install path.


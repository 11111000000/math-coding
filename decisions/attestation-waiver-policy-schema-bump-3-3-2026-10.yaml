obligations:
  - id: attestation-enum-accepts-3-3
    claim: |
      `mathc validate decisions/<existing>.yaml` exits 0
      against the post-bump `schemas/attestation.json`,
      including for files with attestation `schema: math-coding/attestation-3.0-alpha`.
    acceptance:
      all:
        - verifier: manual-text-scan-attestation-enum
          result: pass
  - id: waiver-enum-accepts-3-3
    claim: |
      `mathc validate decisions/waivers/<existing>.yaml` exits 0.
    acceptance:
      all:
        - verifier: manual-text-scan-waiver-enum
          result: pass
  - id: policy-enum-accepts-3-3
    claim: |
      `mathc validate decisions/<policy>.yaml` exits 0.
    acceptance:
      all:
        - verifier: manual-text-scan-policy-enum
          result: pass
  - id: migration-manifest-extended
    claim: |
      `decisions/migrations/3.0-alpha-to-3.3.yaml` lists 8
      `bump-schema-string` actions (4 for decision schema,
      1 for attestation, 1 for waiver, 1 for policy, plus
      the prior 4 for decision families).
    acceptance:
      all:
        - verifier: manual-text-scan-migration-actions
          result: pass
  - id: existing-attestations-still-validate
    claim: |
      `mathc validate` accepts a TRACKED attestation sample written
      under the current schema, `math-coding/attestation-3.3`.

      REVISION 2. The claim used to be that an attestation sample
      with `schema: math-coding/attestation-3.0-alpha` continues to
      be accepted. That is no longer true, and it was not true by
      accident: the 3.0-alpha samples only ever existed as
      UNTRACKED artefacts of test runs (`attestations/t1-2-A0-*.json`,
      which are gitignored), so the obligation was checking a file
      that the repository does not contain. When the obligation was
      finally executed rather than assumed, it failed: the kernel
      now rejects a 3.0-alpha attestation with
      MC-MATERIALS-DIGEST-EMPTY, because the issuance path requires
      a non-empty materials digest.

      The behaviour is CORRECT and the obligation was the thing that
      was wrong. The store still LOADS 3.0-alpha attestations, so
      their provenance survives; the ISSUANCE path is strict, which
      is what the 3.3 policy was for.

      A verifier that is required to FAIL cannot be expressed in this
      schema - an acceptance item carries `result: pass` - so the
      obligation could not be reworded into "the old schema is
      rejected". It is replaced by the claim that IS true and IS
      checkable, and the old sample is kept as a tracked fixture so
      that the rejection is reproducible rather than anecdotal.
    acceptance:
      all:
        - verifier: mathc validate tests/fixtures/attestation-3.3-sample.json
          result: pass
  - id: self-check-verdict-unchanged
    claim: |
      `mathc self-check` exit code is unchanged after the
      schema-bump (pass/unknown distribution not regressed).
    acceptance:
      all:
        - verifier: manual-self-check-verdict
          result: pass


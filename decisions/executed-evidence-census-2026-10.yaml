counterexample: |
  (a) "The debt fixture already measures this - it has a third ceiling
  for inconclusive attestations." Rejected: it counts attestations that
  SAY inconclusive. The defect was the opposite: the attestations that
  should say inconclusive said pass, because
  `attest-batch --run-per-obligation` mapped `Manual_decl` to "pass". The
  fixture's own comment states the truth - "the gate reports them as
  unknown, which is the truth" - and the kernel contradicted it. The
  census measures the population the kernel was misreporting;
  the debt fixture measures it correctly now that the kernel says
  "declared", and the two meet.

  (b) "Report the numbers in a decision and leave it at that."
  Rejected: the legacy debt is what happened when a number lived only
  in prose. It was re-described eleven times and paid once, when a
  fixture made it countable. A census that is not a ceiling is a
  census that becomes history.

  (c) "The census answers nothing on a checkout, so the instrument is
  dead." Rejected: the census is a census OF THE STORE, and the store
  is generated for a tree. On the tree it is meant for -- the tree a
  sweep has just run against -- it answers three numbers and holds
  three ceilings. On a checkout it answers UNKNOWN, which is a
  different answer from zero and is the honest one: the population it
  measures is not there.

antithesis: |
  The opposite claim would be that the store is fine, because the
  attestation schema, the freshness check and the semantic-A digest
  all work as designed: every runtime attestation carries a
  materials_digest that binds it to a tree, so a change to the tree
  invalidates it, and `mathc gate` reports real failures.

  The claim is right about the failures, and it is exactly what makes
  the census necessary. The failures are the part of the corpus that
  a machine can check. The other passes are the part nobody can
  check, and they are indistinguishable in the store from the
  failures: same schema, same kind_, same digest, same producer.
  Freshness says the claim is bound to a tree. It does not say the
  tree was looked at. The two properties are independent, and the
  store only carries one of them.

  The 2026-11-01 addition to this position: the kernel now says
  "declared" where it used to say "pass", so the laundering this
  antithesis relied on is gone. The census is still worth having --
  it measures a POPULATION, not one arm of one comparison -- and it
  now has something to measure on the tree the sweep ran against.


      Every tracked attestation whose obligation the corpus does not
      have is counted, and the count is bounded by a ceiling.
    acceptance:
      all:
        - verifier: tests/fixtures/executed-evidence-census.sh
          result: pass

risk:
  owner: human:maintainer
  declared_triggers:
    - "a new decision adds an obligation whose verifier is a declaration"

assumptions:
  - id: the-declaration-is-the-authority
    state: assumed
    owner: human:maintainer
    statement: |
      The verifier an obligation DECLARES is the authority on what was
      checked for it. The kernel's `mathc packages` view shows one
      verifier per obligation, and for at least one obligation in the
      corpus it shows a verifier that the decision does not declare
      (`cram-fixtures-migrated-to-parse-ok` is shown with
      `mathc verify --help`, which its decision file does not mention).
      The census therefore reads the decision corpus, not the package
      view.
    consequence_if_false: |
      If the kernel's view is the authority, the census measures a
      different corpus than the gate and its ceiling is the wrong
      number. The fixture would then have to read the package view
      instead, and the leak above would have to be fixed first.

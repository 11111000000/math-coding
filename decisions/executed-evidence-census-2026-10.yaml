intent:
  source: "issue:the-store-claims-passes-nobody-checked-2026-10-25"
  text: |
    A census of what the attestation store claims, measured by a
    program rather than by prose.

    The issue of 2026-10-25 was specific: the legacy-debt fixture
    counted the attestations with an empty materials_digest, and
    that debt was paid by re-signing, while the thing the re-signing
    BOUGHT -- a real digest bound to a tree -- was not counted by
    anything. The corpus had no number for the population that
    matters: how much of what the store claims was actually CHECKED,
    and how much was merely signed.

    2026-11-01, REVISION 2: THE STORE IS NOT TRACKED, THE DEFECT
    THAT MOTIVATED THE CENSUS IS FIXED, AND THE NUMBERS WERE A
    SNAPSHOT OF A STORE THAT NO LONGER EXISTS IN THE TREE.

      THE STORE IS GENERATED, NOT TRACKED. `git ls-files
      attestations/**` returns 0 and
      `decisions/store-not-committed-2026-10.yaml` says why: the
      store is produced per run, for the tree it is run against. A
      checkout therefore carries NO attestations at all, and the
      census over a checkout has nothing to measure.

      THE INSTRUMENT SAYS SO INSTEAD OF REPORTING ZERO. Run on a tree
      with no store, `tests/fixtures/executed-evidence-census.sh`
      prints "no attestation store in attestations: there is nothing
      to measure, and a measurement of nothing is not a measurement"
      and exits 3 -- unknown, not pass. It also refuses to measure a
      store signed for a different tree ("regenerate it before
      measuring the store"), because a store for another commit
      measures another project.

      THE KERNEL NO LONGER LAUNDERS A DECLARATION INTO A PASS. The
      defect this census was built to count was that
      `mathc attest-batch --run-per-obligation` mapped
      `Manual_decl` to the string "pass", so the store carried
      machine-grade passes for checks nobody ran. The kernel's
      `verify_outcome_string` now maps `Manual_decl` to
      "declared", which is the honest word for a human's word. The
      census did not fix that, and this decision does not claim it
      did; it fixed the census's blind spot by making the number
      exist, and the kernel fixed the defect it was measuring.

      The three numbers this decision promised are therefore not
      numbers about a corpus of files: they are numbers about the
      store a sweep produced for a given tree, each pinned as a
      ceiling that may only fall. The ceilings today are UNANCHORED
      0, UNEXECUTED 10, ORPHANS 0.

commitment: |
  After this decision closes:

  1. The store is censused by a fixture, not by prose: how many
     runtime attestations name no run, how many passes cover an
     obligation the kernel cannot execute, and how many attestations
     name an obligation the corpus does not have.
  2. Each number is a CEILING. It may fall; it may never rise. A
     fixture that only counted them would let them grow silently,
     which is how 68 became 894 without anything saying so.
  3. The fixture has a negative control: the same measurement against
     a deliberately inflated store must be reported as over its
     ceiling. A bound that has never been observed to bind is not
     known to bind.
  4. The census measures the DECLARED verifier of each obligation, read
     from the decision corpus, and the store's own files. It does not
     depend on the shape of a CLI's output format.

  5. THE STORE IT MEASURES IS THE GENERATED ONE, AND SAYING SO IS
     PART OF THE MEASUREMENT. The store root is
     `MATH_CODING_ATTESTATION_STORE`, else
     `MATH_CODING_ATTESTATIONS_DIR`, else `attestations/`; the census
     reads every `*.json` under it, including the attestations of
     superseded and retired decisions, which the gate no longer walks
     but which still claim a pass. The store is not committed to the
     tree, so a checkout has none, and the census answers UNKNOWN
     (exit 3) rather than a number. It refuses a store that is
     signed for a tree other than HEAD, for the same reason: that
     would be a measurement of another project.

axiom_link:

risk:
  owner: human:maintainer
  declared_triggers:
    - "a new decision adds an obligation whose verifier is a declaration"

assumptions:
  - id: the-declaration-is-the-authority
    state: assumed
    owner: human:maintainer
    statement: |
      The verifier an obligation DECLARES is the authority on what was
      checked for it. The kernel's `mathc packages` view shows one
      verifier per obligation, and that view is derived from the
      corpus rather than being an independent measurement of it.
      The census therefore reads the decision corpus, not the package
      view.
    consequence_if_false: |
      If the kernel's view is the authority, the census measures a
      different corpus than the gate and its ceiling is the wrong
      number. The fixture would then have to read the package view
      instead, and any leak between the two would have to be fixed
      first.

intent: |
  Реализовать Phase 1A из
  `docs/plans/render-module-split-phase1-2026-10.md`:
  выделить подмножество Markdown-парсера (кластер 1, строки
  30–779 текущего `lib/render/render.ml`) в отдельный модуль
  `lib/render/render_md.ml`. Это первая из шести фаз
  фактического разделения `lib/render/render.ml` на
  под-модули, запланированного решением
  `render-module-split@1` («subsequent splits (Phase 1+ of
  the refactor) land as additional modules in the same
  lib/render/ directory»).

commitment: |
  Создать `lib/render/render_md.ml`, содержащий ровно те
  функции, что сейчас находятся в строках 30–779
  `lib/render/render.ml`: `html_escape`, `html_of_fragments`,
  `md_inline_parse`, `md_inline`, `code_fence_tag`, `md_parse`,
  а также локальный `String_set` (перенос из текущего
  `module String_set = struct … end`). Реэкспортировать их
  из `render.ml` через сигнатуру
  `module Md : sig … end = Md`, чтобы публичные вызовы
  `Render.html_escape`, `Render.md_parse` и т.п. продолжали
  резолвиться без правок в `bin/Mathc.ml`, `bin/md_probe.ml`,
  `tests/render_kernel.ml`.

  Зависимости нового модуля — те же, что у текущего
  `lib/render/dune`: `mathcoding_core`, `unix`. Модуль
  `String` и `Buffer` — стандартные.

axiom_link:

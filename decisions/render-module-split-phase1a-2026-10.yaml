      `lib/render/render_md.ml` существует, перечисленные
      выше публичные символы реэкспортированы из
      `lib/render/render.ml`, `dune build` собирает
      `mathcoding_render` с двумя модулями.
  - id: behavior-preserving
    statement: |
      Все 14 кейсов `tests/render_kernel.ml` для `md_parse`
      и его под-функций дают идентичный результат до и после
      переноса; cram-снапшоты `tests/cli/render.t` для
      `dist/index*.html`, `dist/manifesto*.html`,
      `dist/methodology.html` идентичны.


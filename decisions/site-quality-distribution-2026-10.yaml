yaml_sha: "sha256:a478e565ed943c2b9faf2dcea62eafed4fd901f002cc07359f980a8640d984f8"
axiom_link:
  - A1
intent: |
  Extend the published surface beyond HTML so visitors who
  do not (yet) read the site in a browser can still
  consume what the project says. The post-Phase-0 site
  exposes its decisions as HTML pages and as a JSON search
  index, but neither is consumable by an RSS reader or by
  an automated CI watcher.

  Two distribution channels are missing:

  - **RSS 2.0 feed** at `dist/feed.xml` so an external
    reader can subscribe to the project's assurance
    activity (each new or revised decision appears as an
    `<item>`); the feed is what a CI bot or a reviewer
    uses to know that a decision moved without polling
    GitHub.

  - **Onboarding CTA** on the home page so a first-time
    visitor who lands on `dist/index.html` sees a
    next-step prompt: "Try on this repo" linking to the
    USAGE.md adoption runbook plus the GitHub repo so the
    visitor can either read the adoption guide or clone
    the project in one click.

commitment: |
  `mathc render` produces a site that, in addition to the
  HTML pages emitted by `site-quality-polish-2026-10@1`,
  emits:

  1. `dist/feed.xml` -- a valid RSS 2.0 feed whose
     `<channel>` describes the project and whose
     `<item>`s list every decision with id, title,
     decision_revision, obligation count, and the link to
     the per-decision HTML page; the feed items are
     ordered by decision id (the kernel-side ordering)
     and capped at the 60 most recent.

  2. An onboarding call-to-action on the home page
     (`dist/index.html` and `dist/index.ru.html`) that
     links to USAGE.md and to the GitHub repository so a
     visitor can adopt math-coding in their own project
     without leaving the site.


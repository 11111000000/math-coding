risk:
  declared_triggers:
    - rss-reader-incompat-surfaced
    - cta-target-url-rot

counterexample: |
  "RSS and an onboarding CTA are not contract changes; no
  decision is needed." This argument fails because (a)
  the RSS feed is a new public surface that downstream
  consumers (CI bots, reviewer RSS readers) will rely on,
  and removing it would break that contract; and (b) the
  onboarding CTA is the visitor's first interaction with
  the project's adoption surface, and the AGENTS.md
  self-application principle requires that any change to
  the rules visitors encounter ship with a recorded
  commitment.

antithesis: |
  Author considered and rejected the strongest counter-
  position that a maintainer might raise: "the site
  already links to AGENTS.md, ROADMAP.md, and PACKAGES.md
  in the footer; an onboarding CTA is redundant." That
  position is rejected because the footer links are
  navigation chrome that visitors scan past; a primary
  CTA above the packages grid is the project's only
  chance to convert a first-time reader into an adopter
  before they scroll. Likewise, RSS is not redundant with
  GitHub release notifications because RSS readers
  surface decisions in chronological order without the
  visitor needing a GitHub account or to subscribe to
  release emails.


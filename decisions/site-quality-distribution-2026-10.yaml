obligations:
  - id: rss-feed-emits-valid-xml
    outcome: rss-feed-renders-valid-xml
    claim: |
      After `mathc render` runs, `dist/feed.xml` exists
      and is well-formed XML; it carries one `<item>` per
      active decision with `<title>` (the decision id),
      `<link>` (the per-decision HTML page), `<guid>`
      (the decision id), `<pubDate>` (the decision's
      revision marker as ISO 8601), and `<description>`
      (a one-line summary of the decision's intent and
      obligation count).
    acceptance:
      all:
        - verifier: feed-xml-is-valid
          result: pass

  - id: onboarding-cta-on-home-page
    outcome: onboarding-cta-on-home
    claim: |
      The home page (`dist/index.html` and
      `dist/index.ru.html`) carries an
      `<aside class="mathc-onboarding">` block that links
      to USAGE.md and to the project's GitHub repository,
      with prose explaining that the visitor can run

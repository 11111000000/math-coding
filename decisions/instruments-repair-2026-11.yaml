obligations:
  - id: the-mc-version-check-can-go-red
    claim: |
      `scripts/sync-version.sh --check` exits non-zero, with a
      message that names the line it expected, when the MC_VERSION
      line of a copy of the skill does not carry the version in
      `VERSION`.
    acceptance:
      all:
        - verifier: tests/fixtures/sync-version-mc-version-drift-fails.sh

  - id: the-second-copy-is-checked-too
    claim: |
      The same refusal happens when only
      `.opencode/skills/math-coding/SKILL.md` drifts, and `--write`
      repairs both copies so that the repaired tree passes `--check`.
    acceptance:
      all:
        - verifier: tests/fixtures/sync-version-mc-version-drift-fails.sh

  - id: the-case-level-contract-is-measured
    claim: |
      `tests/fixture_coverage.ml` reports how many of the cram
      fixtures the corpus names have an accepting case and how many
      have a rejecting one, enforces the accepting half, and fails
      when the rejecting half exceeds its ceiling.
    acceptance:
      all:
        - verifier: tests/fixture_coverage.ml

  - id: the-case-classifier-is-checked
    claim: |
      The classifier that reads the cases knows both answers: a case
      that asserts a non-zero exit or a negative verdict rejects, a
      case that asserts exit 0 or `unknown` accepts, and prose is not
      a case.
    acceptance:
      all:
        - verifier: tests/fixture_coverage.ml

  - id: the-manifest-branch-is-exercised
    claim: |
      `tests/cli/attest-batch-signature.t` runs
      `mathc attest-batch --manifest=FILE`: a review row signs
      itself with the producer the row named, a runtime-kind row with
      no `--run` is refused with exit 2 and the kind named, nothing
      is written for the refused row, and `--dry-run` writes nothing.
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-signature.t

risk:
  owner: human:maintainer
  declared_triggers:
    - "the cram corpus stops asserting exit codes in its expected output"
    - "the skill's frontmatter moves the MC_VERSION line out of the file"
    - "a second copy of the skill appears and is not named here"
    - "the release flow starts deriving VERSION from a tag instead of the VERSION file"

assumptions:
  - id: the-two-copies-are-the-same-document
    state: assumed
    owner: human:maintainer
    statement: |
      `adoption/SKILL.md` and
      `.opencode/skills/math-coding/SKILL.md` are the same document,
      shipped twice: one is what an adopter reads, the other is what
      `mathc init --agent opencode` installs. tests/cli/init-agent.t
      and scripts/check-opencode-skill.sh assert the byte-equality,
      and scripts/sync-version.sh --write has rewritten both since
      v3.7.0.
    consequence_if_false: |
      If the two files are allowed to diverge, then checking MC_VERSION
      in both is redundant rather than thorough, and the fixture that
      breaks only the second copy would be asserting a property the
      project does not hold. The check would then have to name the
      canonical copy alone -- and the divergence itself would be the
      defect to fix first.
    review_on:
      - signal: skill-copies-diverge

  - id: the-cram-exit-code-is-the-cases-verdict
    state: assumed
    owner: human:maintainer
    statement: |
      This repository's cram convention is that a case asserts the
      command's exit code in its expected output -- `exit=N` or
      `EXIT=N`, 41 occurrences across the cram corpus -- so that a
      case is decidable from its text.
    consequence_if_false: |
      If the corpus stops asserting exit codes, the case-level scan
      stops being able to tell an accepting case from a rejecting one
      and the ceiling measures nothing. The fixture would then have
      to read the kernel's behaviour instead of the fixture's text,
      which is a different instrument, and the ceiling would have to
      be withdrawn rather than kept.
    review_on:
      - signal: cram-exit-code-convention-dropped

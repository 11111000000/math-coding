counterexample: |
  Three counter-positions considered and rejected, and one question
  the corpus answered by measurement rather than by argument.

  (a) "THE BINARY'S DIRECTORY MUST WIN, because a reader run from
  anywhere inside the kernel's checkout should find that checkout."
  Rejected on the measurement: the kernel's checkout is found by the
  CWD climb too, whenever the operator is inside it — the cwd climb
  walks UP. The executable-dir climb only ever added a case the cwd
  climb cannot serve: the operator standing in a directory that is
  not a project at all, and asking about the kernel. That case is
  preserved, as the LAST resort rather than the first.

  (b) "A PROJECT IS A DIRECTORY WITH A `dune-project`; that is the
  definition." Rejected: the definition was the kernel's own
  convenience, imported from its build system into a protocol meant
  for projects that do not use dune at all. The artifact layout
  exists with or without dune — `lib/path_config.ml::effective_root`
  says so in as many words, and the resolver it describes requires
  only that the path exists and is a directory. A rule that makes
  every non-dune adopter invisible is not a rule about projects; it
  is a rule about the kernel's own tree.

  (c) "THE SUBDIRECTORY IS A MISTAKE; THE SIXTEEN DECISIONS SHOULD BE
  MOVED TO THE TOP LEVEL." Rejected: the corpus was written with a
  sub-directory, and the file name is not load-bearing — that is the
  very rule the corpus was measured for (`decision-resolves-by-id`).
  Moving sixteen tracked files to satisfy a walker that could not
  read a sub-directory makes the corpus obey the kernel instead of
  the other way round. The remedy for a flat-walking kernel is a
  walking kernel.

  THE QUESTION: IS `decisions/decision.yaml` A DECISION OR A
  SERVICE DOCUMENT? The corpus answered it structurally, and this
  decision adopts the structural answer: it is a DECISION — the root
  protocol decision `bootstrap-v3` — and it is IN the corpus.

  The reasons, in order of weight:

  (i) It is a decision by every structural test the kernel applies:
  a decision schema (`math-coding/3.2`), a top-level id, a revision,
  a state, an intent, a commitment, a scope, outcomes, and seven
  obligations. The aggregator (`decisions/obligations.yaml`) is
  NOT a decision by the same test: its schema family is
  `math-coding/obligations-3.0-alpha` and its id lives under
  `decision:`, not at the top level.

  (ii) It was ALREADY a subject of `mathc self-check` and of the
  gate's capsule before this change. Excluding it from
  `mathc packages` by name is what made the packages corpus a
  strict subset of the self-check corpus. The alternative — keeping
  the exclusion — means two commands answer different questions
  about the same repository, and the corpus is the thing the whole
  protocol is about.

  (iii) Its obligations carry attestations
  (`attestations/bootstrap-v3-*.json`), so including it adds
  evidence to the corpus, not noise: seven obligations, all
  attested, none passing on the current tree.

  The service document is not `decision.yaml`; it is
  `decisions/obligations.yaml`, which mirrors the root decision's
  obligation set for external readers. It is excluded because it
  declares no top-level id — not because of its name.
antithesis: |
  The opposite claim is that a corpus index is a convenience and
  should not be allowed to decide what a decision IS: the deciding
  of that question belongs to the validator, and the index should
  walk every YAML and let the validator sort them out.

  The claim identifies a real hazard — a structural rule in the
  index is a second place where "what is a decision" is answered,
  and two places can drift. It does not describe this corpus, where
  the validator's own dispatch (`lib/decision.ml::peek_schema_family`)
  and the index's rule answer the same question the same way: a
  top-level id, and no non-decision schema family. The index's rule
  is the validator's rule minus one refinement (the validator also
  requires `kind: waiver` on a waiver document), and it is stated
  in ONE place, in `lib/memory.ml`, with the other readers
  delegating to it.

  The claim also misses the point that the alternative is not
  "let the validator decide" but "walk every YAML". The eight waiver
  files and the three migration manifests live under `decisions/`
  too. A walker that admits them admits documents with ids of
  their own into the corpus, and the corpus is keyed by id — so
  `waiver-p8-hook-deficit-2026-10` would become a subject of the
  self-check, with no obligations, reading as a policy that was
  checked and passed. The rule has to be SOMEWHERE; the question is
  whether it is in one place or in five.
reversal:
  - signal: the-cwd-climb-answers-the-wrong-project
    condition: |
      A command run from inside one project reports another
      project's corpus because the cwd climb found a layout marker
      higher up the tree than the project the operator meant.
    action: rework
  - signal: the-corpus-counts-drift-into-the-docs
    condition: |
      A normative document starts stating a live decision count and
      the drift detector fails on it.
    action: halt

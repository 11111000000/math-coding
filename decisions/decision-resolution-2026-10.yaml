intent: |
  Make the kernel read the project the operator is standing in, and
  make it read that project's decisions the way the corpus says they
  are written.

  Two defects, one of them the root cause of the other.

  (1) THE ROOT RESOLUTION ORDER. `bin/Mathc.ml::find_project_root`
  climbed from the executable's own directory BEFORE it climbed from
  the caller's directory. The theory behind that order was right — a
  reader run from anywhere inside the kernel's own checkout should
  find that checkout — but with a source build the binary lives under
  a `dune-project` ancestor, and that ancestor is the KERNEL's
  checkout. The kernel's tree won the race against the operator's
  directory.

  MEASURED, on a one-decision adopter project with its own git
  repository and no `dune-project`, running the build-tree binary
  `_build/install/default/bin/mathc` from inside it:

    mathc counters   -> decisions: 253, obligations: 892
    mathc self-check -> 252 subjects, the first one
                        `release-pending-real-staleness-2026-10`,
                        verdict `fail`, exit 1

  The adopter's own decision was never looked at. The exit code 1
  was the KERNEL's red corpus, not the adopter's. The INSTALLED
  binary (`~/.local/bin/mathc`) reported `decisions: 1,
  obligations: 1` in the same directory — right, but only by
  accident: it has no `dune-project` ancestor, so the climb from its
  own directory found nothing and the walk fell through to the
  operator's directory.

  Underneath the order sat a second defect: the climb looked for a
  `dune-project` ONLY. An adopter's project is not a dune project;
  it is a repository with `.math-coding/` in it. Even with the order
  fixed, the climb would have found nothing and fallen back to the
  binary's tree again.

  (2) THE ENUMERATION. The corpus was walked with `Sys.readdir`,
  which names the entries of ONE directory, and what counted as a
  decision was decided by FILE NAME. Sixteen decisions live in
  `decisions/plan-2026-10-improvements/`; before this change not one
  of them was visible to `mathc self-check`, `mathc packages` or
  `mathc counters`. Among them is
  `t6-2-counterexample-required` — the decision that introduced the
  counterexample rule — so the rule that demands a counterexample
  was itself outside the gate. And `decisions/decision.yaml`, whose
  id is `bootstrap-v3`, was excluded from `mathc packages` BY ITS
  FILE NAME, so the packages corpus was a strict SUBSET of the
  self-check corpus: two pictures of one world.
commitment: |
  1. THE OPERATOR'S DIRECTORY WINS. `find_project_root` resolves in
     this order: `$MATH_CODING_ROOT` (explicit override), then the
     operator's own directory (climbed), then `$DUNE_SOURCEROOT`,
     then the executable's own directory (climbed) as the LAST
     resort. The climb recognises a project by a `dune-project` OR
     by a math-coding layout marker (`.math-coding/`, `decisions/`,
     `attestations/` — the same markers `lib/path_config.ml::
     layout_of` probes), because the artifact layout exists with or
     without dune.

  2. THE ENUMERATION IS RECURSIVE. One walker
     (`lib/memory.ml::decision_document_paths`) enumerates the
     decisions directory, sub-directories included, and every
     command that needs to know what decisions the project holds
     goes through it: `mathc self-check`, `mathc packages`,
     `mathc counters`, `mathc doctor`, `mathc find`, the capsule
     the gate reads, the gate's own obligation walk, and the
     id-to-path index that `mathc attest-batch` resolves a decision
     with.

  3. A DECISION IS A DECISION BY ITS STRUCTURE, NOT BY ITS NAME. The
     one rule (`lib/memory.ml::decision_document_id`): the document
     declares a TOP-LEVEL `id:`, and it does not belong to one of
     the known non-decision schema families (waiver, obligations
     aggregator, attestation, migration manifest). The name-based
     exclusion lists are gone: `lib/packages.ml::is_meta_filename`
     and `bin/Mathc.ml::decision_meta_files` no longer exist.

  3b. THE ID-TO-PATH RESOLUTION IS RECURSIVE TOO.
      `bin/Mathc.ml::decision_path_for_id` built its index from a
      FLAT walk of the decisions directory, so a decision filed in a
      sub-directory was not in the index; the lookup fell through to
      the concatenation `<id>.yaml`, the file was not there, and the
      verdict was `fail` with the materials digest of NOTHING —
      `e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855`,
      the sha256 of the empty string. The batch still wrote the
      attestation: a decision that was never READ was recorded as a
      decision that FAILED, and the failure was silent.
      MEASURED on the fixture's nested probe decision:

      pre-fix:  result "fail", materials_digest sha256:e3b0c442...
      post-fix: result "pass", materials_digest sha256:<the scope>

  4. `decisions/decision.yaml` IS IN THE CORPUS, as the root
     decision `bootstrap-v3`. It declares the decision schema, a
     top-level id, a revision, a state, an intent, a commitment, a
     scope, outcomes and seven obligations; it is a decision by every
     structural test the kernel applies, and it was ALREADY a subject
     of `mathc self-check` and of the gate's capsule. Excluding it
     from `mathc packages` by name is what made the two corpora
     differ. The document that IS service — the aggregator
     `decisions/obligations.yaml`, schema
     `math-coding/obligations-3.0-alpha`, whose id lives under
     `decision:` and not at the top level — is excluded
     structurally, with no name in sight.

  5. MEASURED, on this corpus, before and after. The "after" column
     is the corpus WITHOUT this decision — a decision adds itself
     (one decision, five obligations, no attestation), so the corpus
     this decision lands in reads 269 decisions and 961 obligations,
     60 of them missing:

     corpus decisions (the corpus index)      250 -> 268
     `mathc packages` decisions               250 -> 268
     `mathc self-check` subjects              252 -> 268
     `mathc counters` decisions.total         253 -> 268
     `mathc counters` decisions.active        246 -> 258
     `mathc packages` obligations             892 -> 956
       pass                                   215 -> 217
       unknown                                671 -> 679
       missing                                  1 ->  55
       fail                                      5 ->   5
     `mathc self-check` verdicts
       pass                                    32 ->  32
       unknown                                211 -> 227
       open-with-waiver                         8 ->   8
       fail                                     1 ->   1

     The 64 obligations that appeared are accounted for: 55 belong to
     the sixteen sub-directory decisions (54 with no attestation at
     all, 1 attested but not passing), 7 to `bootstrap-v3`, and 2 to
     `obligation-count-reconcile` (the second decision the
     name-based exclusion had been hiding; both of its obligations
     PASS). The failing-subject count did not move: the same single
     subject (`plan-2026-10-distro-friction`) fails as before, and
     the failing-subject ceiling of 11 in
     `tests/fixtures/failing-subject-backlog.sh` still holds.

     28 of the 268 decisions carry an id that differs from their file
     name — 18 at the top level (`decision.yaml` -> `bootstrap-v3`,
     `gate-attestation-store-fill-decision.yaml` ->
     `gate-attestation-store-fill`, `dialectic-method-v3-2026-10.yaml`
     -> `dialectic-method-v3`, and 15 more) and 10 in the
     sub-directory (of which one differs only by the `@1` revision
     suffix). This decision is the twenty-ninth: its own file name
     carries the month and its id does not. Before the change the
     packages corpus excluded one of them by name and the
     sub-directory corpus excluded all ten.

  7. WHAT THIS DECISION DOES NOT CHANGE, MEASURED. Four walkers
     outside the scope of this change still read the TOP LEVEL of the
     decisions directory, so the corpus they see is SMALLER than the
     one the gate and the self-check see. Each is recorded here with
     its measurement and its remedy, rather than silently left:

     (a) `mathc negative-control` (bin/Mathc.ml::do_negative_control)
         audits the top level only. It reports "186 of 254" today.
         Widened to the sub-directory it would report "202 of 270":
         all sixteen sub-decisions declare an executable verifier and
         name no `negative_control`, and the sixteen are exactly the
         debt they add. That is ABOVE the ceiling of 199 pinned in
         `tests/fixtures/negative-control-debt.sh` — a monotone
         contract ("it may fall; it may never rise") over a fixture
         this change does not own. The audit therefore stays on the
         top-level corpus until the debt is PAID: the remedy is to
         give the sixteen sub-decisions a `negative_control:` each,
         which lowers the count to 186, and then to widen the audit.

     (b) `mathc migrate` (bin/Mathc.ml) plans the top level only.
         The sixteen sub-decisions still carry
         `schema: math-coding/3.0-alpha`: they were missed by the
         3.0-alpha-to-3.2 bump, whose scope was the glob
         `decisions/*.yaml`, which does not reach a sub-directory. A
         recursive migrate would therefore plan sixteen
         `bump-schema-string` actions — and
         `tests/cli/migrate-bump-replay.t` pins that the live tree
         emits ZERO actions after the bump. The remedy is a
         follow-up decision that bumps the schema string of the
         sixteen, and then widens the migrate walk. The sixteen
         files are read-only in this change.

     (c) `lib/re_evaluation.ml::list_decision_files` walks the top
         level, so `mathc re-evaluate`, `mathc re-evaluate-decisions`
         and `mathc graph` see 252 decisions where the gate and the
         self-check see 269. The gate is not affected: it reads the
         capsule (`lib/memory.ml::load_decisions`, now recursive) and
         its own obligation walk (now recursive). The remedy is to
         delegate that walker to
         `Memory.decision_document_paths` — a three-line change in a
         file this decision does not own.

     (d) `lib/check/check.ml` — the walker behind `mathc precommit` —
         reads the top level, so the sixteen sub-decisions are not
         pre-commit validated. Measured: `mathc validate` accepts
         all sixteen (exit 0 each), so nothing is currently red; the
         gap is that the pre-commit gate does not see them. The
         remedy is the same delegation as in (c).

     (e) `tests/counters_reference.ml` computes its notion of
         "decision files" with a NON-recursive `Sys.readdir` count
         (253 at the time of measurement) while `mathc counters` now
         reports 269. The test does not read the counters output, so
         it passes; but the two definitions of the same quantity no
         longer agree, and a document that states a live count would
         be checked against the wrong one. The remedy is to make the
         reference test count recursively.

     (f) `lib/attestations/batch.ml::scan_decisions_for_obligations`
         walks the top level, so `mathc attest-batch --from=decisions`
         builds its manifest from 253 decisions and not from the 269
         the corpus holds. The ID-TO-PATH resolution that
         `attest-batch --run-per-obligation` uses IS recursive now
         (`bin/Mathc.ml::decision_path_for_id` reads the shared
         walk), so a decision in a sub-directory can be verified and
         signed by id — it just is not DISCOVERED by the
         `--from=decisions` enumeration. The remedy is to delegate
         that walk to `Memory.decision_document_paths` as well; it
         was left alone because the enumeration feeds the signing
         path, and the attestation store is not this change's
         surface.

  8. The corpus verdict is NOT CLEANER THAN BEFORE, and is not
     claimed to be: the sixteen sub-decisions arrive with 54
     obligations that have no attestation at all, and they report
     `unknown`. That is the honest state of a corpus that was
     invisible yesterday — the gate can see them now, and what it
     sees is unpaid debt, not new failure.

  9. THE FIXTURE. `tests/cli/decision-resolution.t` builds a
     two-decision project with its own git repository and NO
     `dune-project`: one decision whose file name differs from its
     id, one decision filed in a sub-directory. It asserts that the
     build-tree binary reports those two decisions and not the
     kernel's 269; that the same binary, copied out of the kernel's
     tree, reports the same two; that `mathc find --obligation=`
     resolves the nested decision by its id; and that the
     self-check exit code is the operator's verdict (3, `unknown`)
     and not the kernel's (1, `fail`).

  10. THE SCOPE-INVALIDATION BREADTH GROWS BY EXACTLY ONE, and the
      ceiling that pinned it had to be raised with the reason
      written down rather than silently. Measured by a scope
      census over `decisions/`: `bin/Mathc.ml` invalidates 185
      decisions with this decision in the corpus and 184 without
      it. The ceiling was 184, in the scope-breadth fixture, and the
      corpus
      made this exact move once before: on 2026-10-26 it was raised
      from 183 to 184 because `re-evaluation-is-not-a-check-2026-10`
      changes `bin/Mathc.ml` and "a decision whose scope does not
      cover its own change cannot be invalidated by it". This
      decision changes `bin/Mathc.ml` and its scope names it, so the
      breadth grows by exactly one. That ceiling, and the census
      that measured it, were removed on 2026-10-28 with the
      corpus-debt meta-layer
      (decisions/corpus-meta-layer-2026-10.yaml): the breadth is no
      longer pinned by a program.

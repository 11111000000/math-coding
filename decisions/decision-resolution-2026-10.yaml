outcomes:
  - id: the-operator-project-is-the-project
    statement: |
      A `mathc` binary run inside a project reads THAT project's
      decisions, whatever tree the binary itself was built in.
  - id: the-corpus-is-walked-recursively
    statement: |
      A decision filed under `decisions/<sub-directory>/` is in the
      corpus of `mathc self-check`, `mathc packages` and
      `mathc counters`.
  - id: a-decision-is-identified-by-its-id
    statement: |
      A decision whose file name differs from its id is reached by its
      id, and the exclusion of non-decisions is structural rather
      than a list of file names.
assumptions:
  - id: the-layout-markers-name-a-project
    state: assumed
    owner: human:maintainer
    statement: |
      A directory holding `.math-coding/`, `decisions/` or
      `attestations/` is a math-coding project. The markers are the
      ones `lib/path_config.ml::layout_of` probes, so the root
      resolver and the path resolver answer the same question about
      the same directory.
    consequence_if_false: |
      A repository that carries an unrelated `decisions/` directory
      would be taken for a math-coding project, and the kernel would
      read that tree instead of the one the operator meant. The
      remedy is to narrow the marker list to `.math-coding/` plus
      `decisions/decision.yaml`.
    review_on:
      - signal: an-adopter-project-is-misidentified
  - id: the-corpus-counts-are-not-pinned-by-the-docs
    state: assumed
    owner: human:maintainer
    statement: |
      No normative document states a live decision count. The
      counters are the single source of truth
      (`decisions/mathc-counters-subcommand-2026-10`), and
      `tests/counters_reference.ml` asserts that PACKAGES.md and
      ROADMAP.md do not restate them.
    consequence_if_false: |
      A document that states "N decisions" would drift by 18 the
      moment this decision lands, and the drift detector would fail
      on it.
    review_on:
      - signal: a-doc-states-a-decision-count

      `.githooks/pre-commit` не возвращает `exit 1` на основании
      частоты правок `.ml`/`.mli` файлов в последних коммитах.
      При срабатывании эвристики выводится soft warning.
  - id: trap-log-records-deficit
    statement: |
      `OCAML_BEST_PRACTICES.md §11.39` описывает дефицит,
      симптом и резолюцию.

obligations:

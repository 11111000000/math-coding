      до этого решения) не содержит строки
      `'3+ times in last 5 commits'` и не содержит
      `exit 1` в блоке P8. P8 блок hook'а — soft warning,
      не hard block.
    acceptance:
      all:
        - verifier: git diff .githooks/pre-commit | grep -c 3+ times in last 5 commits == 0
          result: pass
        - verifier: bash -n .githooks/pre-commit exits 0
          result: pass

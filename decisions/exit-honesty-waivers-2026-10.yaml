counterexample: |
  The strongest counter-position is that this decision removes the
  protocol's only relief valve at the moment the repository needs
  it, and that the honest reading of the exit codes is the other
  way round.

  (a) "The eight waivers are the reason eight subjects are not
      blocking. Revoking the decision-wide form leaves the
      repository with 219 unknown subjects and no way back except
      writing 37 new waiver files."

      The measurement refuses the premise: the relief was never
      real. 36 of the 37 covered gaps were covered by a waiver that
      named NO gap, and all 8 declared a class
      (`obligation-missing-attestation`) that none of the 37 gaps
      has. A waiver that names nothing and declares the wrong class
      is not relief; it is a green tick over an unexamined gap. The
      repository's own exit code does not change: it was 1 before
      this decision and it is 1 after, because
      `plan-2026-10-distro-friction` already fails on a decisive
      `fail` attestation. What the decision removes is the ability
      to read the 8 subjects as open-with-waiver; what it restores
      is the ability to see them as the unknown they are.

  (b) "The exit code of a verifier runner reports whether the
      command ran, not whether the claim is verified. `mathc verify`
      skipping an obligation it cannot run is information, not
      failure."

      That reading makes exit 0 mean "the command did not crash",
      which is a property of the process, not of the decision. The
      per-obligation verdicts are already printed, one per
      obligation, so the information the counter-position defends is
      not lost by the exit code; it is in the output. What the exit
      code adds is the one bit a CI pipeline reads. And the
      constitution is explicit that the bit must not be a pass:
      Invariant 14b, "exit code 0 MUST imply verdict `Pass` or
      `Open_with_waiver`", with the failure mode named in the same
      breath — "`unknown != pass` and `exit 0 != verdict:Unknown`
      are the same invariant stated twice".

  (c) "A waiver should be able to accept a whole decision when the
      decision is structurally unreachable (the case the first
      waiver was written for: a musl build that cannot run on the
      CI). One gap per waiver makes that impossible."

      This is the strongest form of the objection, and it is
      answered by the schema rather than by the decision: the
      constitutional text says one gap, and `schemas/waiver.json`
      says `unverified_obligation` is a single STRING. A waiver
      that wants to cover four obligations has no representation in
      the format. The port of that decision to the current schema
      is a decision about the schema (a list-valued field, or four
      files), and it is not this decision's to take: the honest
      options are four single-gap waivers, or one waiver per gap
      class with a scope that names the paths they share. What this
      decision refuses is the third option that exists today and
      that the constitution does not: a waiver that names nothing
      and covers everything.
antithesis: |
  The opposite claim is that the exit code and the waiver are both
  fine as they are, and that this decision mistakes the protocol's
  friction for its defects.

  The waiver case: a waiver whose `unverified_obligation` is absent
  covering every obligation of its decision is a COMPATIBILITY
  measure, not a bug — it is what lets a decision whose
  infrastructure is structurally unreachable keep its whole
  surface waived while the infrastructure is rebuilt, without
  writing one file per obligation. The counter-position is
  strengthened by the history: the first waiver
  (`decisions/waivers/portable-linux-musl-2026-10.yaml`, deleted in
  `1c8f476b`) listed four obligations in the YAML list form, and the
  schema has never allowed a list. The compatibility shim exists
  precisely because the schema could not express what the waiver
  meant.

  The exit-code case: `mathc verify` exiting 0 when an obligation
  is skipped is the useful behaviour, because "skipped" is a
  property of the ENVIRONMENT (no forge, no musl, no network), not
  of the decision. A pipeline that runs the verifier suite on every
  platform would go red on every platform that cannot run one of
  the checks, and the signal that carries — the per-obligation
  `skipped` line — is already in the output.

  Both counter-positions are real, and the reply to them is the
  same reply: this protocol separates what is DECLARED from what is
  DERIVED, and the exit code is a DERIVED artefact. A declared
  waiver without a named gap and a declared `verdict: pass` over an
  unevaluated claim are the same shape of error — a promise the
  system cannot keep, made in the one field a machine reads without
  reading the rest. The compatibility the counter-positions defend
  is real compatibility, and it is available: the honest forms are a
  waiver per gap (one file per obligation, as the constitution asks)
  and a verdict table with an `unknown` row that says what is
  unknown. What is not available, and was never available, is
  compatibility bought by letting the artefact claim more than it
  checked.

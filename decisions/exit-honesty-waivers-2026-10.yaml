obligations:
  - id: a-waiver-covers-what-it-declares
    claim: |
      `Waiver.covers` covers a gap only when the waiver names that
      obligation, declares the class of that gap and keeps its
      scope inside the scope of the decision that owns the gap. A
      waiver that names no gap covers nothing.
    acceptance:
      all:
        - verifier: file-exists tests/cli/waiver-scope.t
          result: pass
        - verifier: file-exists tests/waiver_test.ml
          result: pass
        - verifier: file-exists tests/gate/waiver_aggregation.ml
          result: pass
  - id: verify-exits-nonzero-when-it-verified-nothing
    claim: |
      `mathc verify` exits non-zero when no obligation was actually
      fulfilled, and the exit code follows the verdict table of
      spec/semantics.md §Kernel Output.
    acceptance:
      all:
        - verifier: file-exists tests/cli/verify-exit.t
          result: pass
        - verifier: file-exists tests/cli/verify.t
          result: pass
  - id: re-evaluate-and-forge-verify-stop-lying
    claim: |
      `mathc re-evaluate` exits non-zero for `incompatible` and
      `stale_claim`, and `mathc forge-verify` no longer reports
      `pass` when the forge could not be reached.
    acceptance:
      all:
        - verifier: file-exists tests/cli/forge-verify.t
          result: pass
  - id: the-decision-is-valid-and-hashed
    claim: |
      This decision file parses, validates against
      `schemas/decision.json`, and carries the digests of its own
      bytes.
    acceptance:
      all:
        - verifier: mathc validate decisions/exit-honesty-waivers-2026-10.yaml
          result: pass

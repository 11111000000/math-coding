risk:
  declared_triggers:
    - the class vocabulary and the one-gap rule leave a project with
      no way to waive a whole decision, and the migration is not
      applied by this decision
    - the exit code of `mathc verify` changes for every decision
      whose obligations are all skipped, including the ones a CI
      pipeline treats as green
    - `mathc forge-verify --fail-mode=open` no longer exits 0, so a
      pipeline that gates on it needs the mode that matches its
      policy
    - the waiver files under `decisions/waivers/` are left in place
      by this decision and are now inert; a reader that trusts them
      will read relief where there is none

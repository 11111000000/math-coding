intent:
  source: "task:T5.1 - re-measure the cost of the method on the fixed binary"
  text: |
    THE FIGURE THAT NEEDED RE-MEASURING. The plan says: "The '3-4x
    slower' figure was measured on 3.3.1, before the path resolver was
    fixed, and nobody has measured it since". The figure itself lives
    in the adoption experiment's record, now in the archive
    (`archive/decisions/adopter-path-2026-10.yaml`): five external
    projects on 2026-10-17 - click, express, cobra, ripgrep, sinatra
    - two arms, with the protocol and without it, and the
    with-protocol arm ran a median of about ten minutes a session
    against about three for the control. A ratio of three to four.

    THE CAUSE THE EXPERIMENT ITSELF NAMES. That record says the gap
    "was dominated by repeated diagnosis of the env-var defect, not by
    math-coding per se, and once the layout was locked the
    per-decision overhead fell to ~1-2 minutes of content writing".
    Both readings are kept there, because both cost the adopter
    minutes.

    So the 3-4x was mostly the price of a defect that has since been
    fixed, and the part that remains is content writing - a human
    number, which no instrument in this repository measures.

counterexample: |
  The obvious objection: a reader may say the machine cost is
  irrelevant, because the 3-4x was a ratio of people's time, and so
  timing a census in seconds answers nothing. That objection is
  RIGHT, and it is why this decision does not publish a ratio. What
  it does instead:

    - it measures the part that can be measured, with the commands
      that produce the numbers, so a reader can re-run them;
    - it measures the CAUSE of the old ratio, which is a fact about
      the tree and not about people: the defect is closed, and the
      scaffold the adopter meets validates cleanly on the first try;
    - it names the remainder as content writing, which is a human
      number, and says so rather than dressing it up.

  The second objection is sharper: if the machine cost was always
  small, then measuring it proves nothing about the method's cost.
  True, and admitted. The reason to measure it anyway is that a
  figure nobody can reproduce is a number without a method, and a
  method without numbers is a belief. This decision adds the numbers
  that the machine can produce, and leaves the rest where it was.

antithesis: |
  The position against this decision: "the honest thing is to re-run
  the two-arm experiment on the current binary, with the same kind of
  task, and publish the new ratio. Measuring the census in seconds is
  a different measurement wearing the same name."

  That position is right about the ratio and wrong about what a
  repository can carry. The original harness is not in this
  repository - the experiment ran on five other projects, and its
  scripts were never vendored - so a like-for-like re-measurement
  means rebuilding the harness, choosing the tasks, and running both
  arms. That is a budget decision, and this decision does not spend
  it without an owner. What it does is make the gap visible and
  priced: the mechanical part is measured, the defect's residue is
  measured, and the remainder is named as writing rather than as
  protocol overhead.

commitment: |
  1. The mechanical cost of the method on the current binary is
     measured and dated, with the commands that produce each number,
     so that anyone can re-run them and get the same shape of answer.

  2. The cause of the old ratio is checked against the tree: the
     path-resolver defect the experiment blamed is closed, and the
     scaffold an adopter meets validates cleanly, with no rediscovery
     and no environment variable.

  3. The 3-4x figure is NOT restated, not updated and not
     reproduced. It keeps its place in the archive with its cause
     attached, and no new ratio is published, because publishing a
     ratio without the harness that produced the old one would be a
     number without a method.

outcomes:
  - id: the-mechanical-cost-is-measured
    statement: |
      On 2026-11-01, on the maintainer's host, with the corpus at 131
      live decisions:

        census (tests/fixtures/redundancy-census.sh)   1.41 s
        debt   (tests/fixtures/negative-control-debt.sh) 0.23 s
        validate every live decision, one binary run each  0.79 s
        ------------------------------------------------------
        the whole corpus audit, machine time            ~2.4 s

      and the adopter's path, on a fresh `git init` tree:

        mathc init . --no-install                 0.006 s  exit 0
        mathc validate .math-coding/policy.yaml   0.005 s  exit 0
        mathc mode                                0.005 s  exit 2

      The exit 2 on `mathc mode` is the honest answer for a tree with
      no policies file: the mode floor is unknown, not tiny. The
      numbers are a single-host snapshot, not a benchmark.
  - id: the-defect-that-made-the-ratio-is-closed
    statement: |
      The adoption experiment blamed the gap on repeated diagnosis of
      the env-var defect. On this tree the adopter's first two
      commands succeed with no environment variable and no rediscovery:
      `mathc init` writes the scaffold, and `mathc validate` on that
      scaffold exits 0 with `parse-ok`. The scaffold carries one
      obligation, and it is about the adopter's own tree rather than
      about the corpus.
  - id: the-ratio-is-not-restated
    statement: |
      No new ratio is published by this decision. The 3-4x stays in
      `archive/decisions/adopter-path-2026-10.yaml` with its cause
      attached, and the remainder of the cost - content writing, about
      one to two minutes per decision by the old experiment's own
      account - is named as what it is: a human number that this
      repository does not measure.


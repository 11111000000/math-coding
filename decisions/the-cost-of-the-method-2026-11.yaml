assumptions:
  - id: the-host-is-not-the-claim
    state: held
    owner: human:maintainer
    statement: >
      The timings are one host on one day. They are a shape, not a
      benchmark, and no decision may quote them as a portable number.
    consequence_if_false: >
      A reader takes 2.4 s as the cost of the method on any machine
      and the corpus's own instruments stop being the source of truth
      about the method's cost.
    review_on: 2026-12-15
  - id: the-content-writing-is-still-the-rest
    state: held
    owner: human:maintainer
    statement: >
      With the defect closed, what remains of the method's cost is the
      writing of the decision, which the old experiment put at one to
      two minutes. This decision does not re-measure that, because no
      instrument here measures a person's time.
    consequence_if_false: >
      The remaining cost is something else - a read of the corpus, a
      re-run of the suite - and the method's overhead is still
      mechanical, in which case this decision understates it.
    review_on: 2026-12-15
  - id: the-ratio-needs-a-harness-not-a-number
    state: held
    owner: human:maintainer
    statement: >
      A like-for-like re-measurement of the 3-4x needs the original
      two-arm harness rebuilt on the current binary, with the same
      kind of task. That is a budget decision and it has an owner.
    consequence_if_false: >
      The old figure stays the only figure, and every reader of it
      meets it without its cause.
    review_on: 2026-12-15


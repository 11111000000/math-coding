obligations:
  - id: the-measurement-is-reproducible
    outcome: the-mechanical-cost-is-measured
    claim: |
      The three corpus commands and the three adopter commands named
      above are the measurement, and they are in the repository: the
      fixtures are, and the adopter's path is `mathc init` followed by
      `mathc validate` on the scaffold that init writes.
    acceptance:
      all:
        - verifier: bash tests/fixtures/redundancy-census.sh
        - verifier: bash tests/fixtures/negative-control-debt.sh
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: >
        The numbers are a dated snapshot of one host. Nobody re-runs
        them on a schedule, and a fixture that asserted a timing would
        be a flaky promise dressed as a control.

  - id: the-cause-is-checked-against-the-tree
    outcome: the-defect-that-made-the-ratio-is-closed
    claim: |
      The scaffold validates cleanly on a fresh tree, and the check is
      a fixture rather than a reading: `tests/cli/init-defaults.t`
      requires the scaffolded policy to validate with no stderr and
      with its obligations resolved.
    acceptance:
      all:
        - verifier: tests/cli/init-defaults.t
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: >
        The fixture is the control; what is declared here is the
        reading of it - that the defect the experiment blamed is
        closed - and a reading is re-made by a person, not by a
        scheduler.

  - id: the-figure-keeps-its-cause
    outcome: the-ratio-is-not-restated
    claim: |
      The archive keeps the figure and the cause of the figure in the
      same place: the record that holds the 3-4x also names the
      env-var defect that produced it, so a reader who meets the
      number meets the reason with it. The live corpus quotes the
      figure only as history, in the decision that measures the cost.
    acceptance:
      all:
        - verifier: shell-grep archive/decisions/adopter-path-2026-10.yaml the gap is 3-4x
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: >
        That no live decision PUBLISHES a ratio cannot be checked by a
        grep over a directory the corpus does not have a scheme for;
        the checkable half - the figure and its cause together - is
        the control above, and the rest is a declaration.


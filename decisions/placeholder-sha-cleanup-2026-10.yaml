      `decisions/counters-schema-introspection-fix-2026-10.yaml`
      is reworded to remove the literal substring while
      preserving the meaning about the placeholder-
      substitution mechanism.
  - id: no-sha256-zero-in-decisions
    statement: |
      The 64-zero canonical placeholder sentinel no longer
      appears as a stored value anywhere in `decisions/`;
      the schema pattern in `schemas/decision.json`
      (`^sha256:[0-9a-f]{64}$`) admits the zero form
      syntactically but the cleanup removes every live
      instance.
  - id: all-decisions-self-consistent-under-sha-match
    statement: |
      For each of the five placeholder files,
      `body_sha = yaml_sha` holds (string equality) and both
      equal sha256 of the file with the two fields replaced
      by the canonical placeholder (the `sha256:` prefix
      followed by 64 ASCII zero characters, as defined in
      `spec/algebra-3.2.md` §7.1). The `mathc validate`
      invocation returns `accept` for all six files (this
      decision plus the five amended ones).


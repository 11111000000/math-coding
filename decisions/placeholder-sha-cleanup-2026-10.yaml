reversal: |
  If a future spec revision removes the `body_sha` /
  `yaml_sha` fields from the Decision entity, the digests
  computed by this decision become vestigial. The
  revert path is a `git revert` of this commit: the five
  files revert to their placeholder state and this
  decision file is removed. No data migration is needed
  because the digests are re-derivable from the file
  bytes at any time (the algorithm is canonical).


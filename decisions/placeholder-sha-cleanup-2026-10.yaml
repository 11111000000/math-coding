    - "decisions/considered-mode-cli-sync-2026-10.yaml"
    - "decisions/counters-schema-introspection-fix-2026-10.yaml"
    - "decisions/paren-balance-fix-2026-10.yaml"
    - "decisions/site-redesign-2026-10.yaml"
    - "decisions/stub-lint-real-2026-10.yaml"
  exclusions:

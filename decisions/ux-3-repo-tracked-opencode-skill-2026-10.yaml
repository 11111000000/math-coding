    - "decisions/ux-3-repo-tracked-opencode-skill-2026-10.yaml"
    - "scripts/check-opencode-skill.sh"
  exclusions:
    - "lib/**"
    - "bin/**"
    - "spec/**"
    - "schemas/**"
    - "axioms/**"
    - "decisions/decision.yaml"

outcomes:
  - id: opencode-skill-shipped-in-repo
    statement: |
      `.opencode/skills/math-coding/SKILL.md` exists at
      the repository root and is byte-for-byte identical
      to `adoption/SKILL.md`. The wrapper script
      `scripts/check-opencode-skill.sh` exits 0 on full
      pass.
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-repo-tracked-opencode-skill-2026-10.yaml`
      exits 0.

assumptions:
  - id: dist-adoption-source-stable
    state: assumed
    statement: |
      `scripts/dist-adoption.sh` continues to produce
      `dist/adoption/opencode/SKILL.md` as a verbatim
      copy of `adoption/SKILL.md` (verified at
      `scripts/dist-adoption.sh:120`). The in-repo file
      is the same content; both are derived from the
      same canonical source.
    owner: human:maintainer
    consequence_if_false: |
      If `scripts/dist-adoption.sh` is changed to inject
      platform-specific edits into the opencode skill, the
      in-repo file may diverge from the tarball. Resolution:
      a follow-up decision either re-syncs the in-repo
      file or moves it to a separate source.
    review_on:
      - signal: dist-adoption-diverges-from-source
  - id: opencode-skill-path-stable
    state: assumed
    statement: |
      opencode reads project-level skills from
      `.opencode/skills/<name>/SKILL.md` (per
      `adoption/SKILL.md:194` and the dist README at
      `scripts/dist-adoption.sh:169`). The path is not a
      project surface.
    owner: human:maintainer
    consequence_if_false: |
      If opencode changes the canonical skill path, the
      in-repo file becomes invisible to the agent. The
      install-tooling-2026-10 assumption
      `opencode-skill-path-stable` covers the per-user
      path; this assumption covers the per-repo path.
      A follow-up cycle would relocate the file.
    review_on:
      - signal: opencode-skill-path-changed

obligations:

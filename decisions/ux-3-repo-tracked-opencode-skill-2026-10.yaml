intent: |
  Phase 1 of the ux-3 workstream. Make the opencode adoption
  skill discoverable on first clone by committing
  `.opencode/skills/math-coding/SKILL.md` to the repository.
  Today, the skill lives only in the release tarball at
  `dist/adoption/opencode/SKILL.md` (produced by
  `scripts/dist-adoption.sh` from `adoption/SKILL.md`). A user
  who clones this repo but has not run `install.sh --user-skill`
  has no skill in their opencode session — the project repo
  itself does not advertise one. This decision puts a verbatim
  copy at the canonical opencode project path, so first-session
  opencode sees the skill before the user has run any installer.

  Per the user's confirmed answer to FR-1 (opencode is a
  first-class target alongside Claude Code / Cursor / Continue),
  and per `install-tooling-2026-10@1` (`install.sh --user-skill`
  copies the same content to the per-user
  `~/.config/opencode/skills/math-coding/SKILL.md` for
  non-repo-tracked consumers). This decision does not change
  the per-user pipeline; it adds the per-repo path that opencode
  itself reads on session start.

  No kernel surface. No `lib/`, no `bin/Mathc.ml`, no `spec/`, no
  `schemas/`, no `axioms/`. Only:

    .opencode/skills/math-coding/SKILL.md  (new file, verbatim
                                            copy of adoption/SKILL.md)
    decisions/ux-3-repo-tracked-opencode-skill-2026-10.yaml
                                            (this file)
    scripts/check-opencode-skill.sh       (verifier wrapper)

  This decision is META per the PACKAGES.md convention. It does
  not appear in `mathc packages` counts.

axiom_link:
  - A0
  - A4

antithesis: |
  The counter-position considered and rejected: "Adding
  `.opencode/skills/math-coding/SKILL.md` to the repo is
  over-reach; the dist tarball already produces it, and
  `install.sh --user-skill` is the contract. Just commit the
  file without a decision; no one needs a record for a copy
  operation." The author engaged with this position and
  rejected it on three grounds: (a) `AGENTS.md §Self-application`
  requires a decision for any change to a protected surface,
  and `.opencode/skills/` is the canonical opencode read path
  for this project — adding a file there is a contract change
  visible to every opencode session in the repo, even ones
  not running the installer; (b) without a `decisions/`
  record, the file's provenance is invisible to the kernel:
  the relations graph cannot link this surface to
  `install-tooling-2026-10@1` or `ux-3-adoption-doc-freshen-2026-10@1`,
  so a future audit cannot tell whether the file drifted
  from the canonical `adoption/SKILL.md`; (c) the obligation
  to keep the in-repo file in sync with the canonical source
  is enforceable via `scripts/check-opencode-skill.sh`, but
  the script must be referenced from a decision for the
  kernel to count the obligation. The minimum fix is one
  decision with two obligations, which is what this file
  records.

commitment: |
  One deliverable, pinned by an obligation:

    D1. `.opencode/skills/math-coding/SKILL.md` exists at
        the repo root and is a verbatim byte-for-byte copy
        of `adoption/SKILL.md` (the canonical skill source).
        The wrapper script `scripts/check-opencode-skill.sh`
        asserts the byte-equality deterministically.

  Boundaries (A3 self-application):
    - No kernel surface changes.
    - No `lib/`, no `bin/Mathc.ml`, no `spec/`, no `schemas/`,
      no `axioms/` are touched.
    - This decision does NOT change the per-user install path
      (`install.sh --user-skill` continues to copy the same
      content to `~/.config/opencode/skills/math-coding/SKILL.md`).
    - This decision does NOT add Claude Code / Cursor / Copilot
      skills to the repo. The user's confirmed answer to FR-1
      was opencode-only; the other platforms continue to ship
      via `dist/adoption/<platform>/` in the release tarball.
    - This decision does NOT introduce a `mathc init` or
      `mathc adopt` subcommand. Those are decisions
      `ux-3-init-subcommand-2026-10` and
      `ux-3-import-adr-subcommand-2026-10` (also Phase 1).

counterexample: |
  "Repo-tracking the opencode skill is fine, but a one-line
   copy needs no decision." The counterargument fails because
   the canonical `adoption/SKILL.md` (Phase 0) and the
   in-repo file must stay in sync; without a tracked
   obligation enforcing byte-equality, the file drifts
   silently the next time `adoption/SKILL.md` is updated.
   "The dist tarball already produces the file at the
   user-level; the repo-tracking is redundant." This fails
   because the dist tarball is a release artifact (built
   by `scripts/dist-adoption.sh` at release time, not
   on every commit). A user cloning the repo between releases
   sees the previous release's skill in their per-user
   install path, but the in-repo `.opencode/skills/` would
   carry the latest. The two paths serving different
   versions of the skill is the silent-promotion risk
   A1 forbids.


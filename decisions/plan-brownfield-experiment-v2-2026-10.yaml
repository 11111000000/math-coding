assumptions:
  - id: brownfield-clients-active
    state: assumed
    statement: |
      At least one of the five picked projects exercises a
      different branch of `lib/import_adr/import_adr.ml`'s
      parser (MADR with frontmatter / MADR with `## Status` /
      adr-tools-Nygard / custom), so the experiment's BH2
      hypothesis has at least 4 distinct observations.
    owner: human:maintainer
    consequence_if_false: |
      If the format diversity claim is wrong (e.g. all 5 picks
      end up MADR), BH2 is exercised on only one parser branch
      and the experiment's signal is narrower than designed.
      Resolution: substitute from the backup list to recover
      format diversity.
    review_on:
      - signal: format-diversity-not-realised
  - id: prior-decisions-merge-first
    state: assumed
    statement: |
      The `ux-3-adopt-subcommand-2026-10@1`,
      `ux-3-import-adr-subcommand-2026-10@1`, and A1/A3/B1
      sub-decisions from `plan-2026-10-adoption-fixes-2026-10`
      merge to main **before** this experiment executes. Without
      these merges, the brownfield path is a no-op stub and the
      experiment cannot measure what it is designed to measure.
    owner: human:maintainer
    consequence_if_false: |
      If any of the four prior decisions is unmerged at
      execution time, the experiment is **deferred** (per §8
      Phase 0) until the missing decision lands. Resolution:
      Phase 0 is the gate; sub-agents are not launched until
      Phase 0 confirms all four merges.
    review_on:
      - signal: prior-decision-unmerged
  - id: shallow-clone-sufficient
    state: assumed
    statement: |
      A `git clone --depth=1` of each picked project is
      sufficient to verify the project's ADR tree at HEAD
      (no specific ADR is referenced by a tag, branch, or
      previous commit in the v2 plan).
    owner: human:maintainer
    consequence_if_false: |
      If an ADR only exists in a non-HEAD commit (e.g. a
      deleted or moved tree), the verification misses it.
      Resolution: Phase 1 re-verifies each project's ADR
      path immediately before sub-agents run.
    review_on:
      - signal: adr-not-at-head


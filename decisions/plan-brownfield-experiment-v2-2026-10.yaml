reversal:
  - signal: plan-superseded
    condition: |
      A successor plan (e.g. `plan-2026-11-brownfield-experiment-v2`)
      is recorded with `supersedes:
      [plan-brownfield-experiment-v2-2026-10@1]`. Resolution:
      this decision is moved to `state: archived`; the
      successor inherits the experiment design and the
      execution work.
    action: supersede-with-successor
  - signal: prior-decisions-not-merging
    condition: |
      The four prior decisions (`ux-3-adopt-subcommand-2026-10`,
      `ux-3-import-adr-subcommand-2026-10`, A1, A3, B1) are
      not merging to main within 2026-Q4. Resolution: this
      plan's `state` moves to `archived` with a note that
      brownfield execution is deferred to a successor plan;
      the experiment design document is preserved as a
      reference for whenever the prior decisions land.
    action: archive
  - signal: format-diversity-not-realised
    condition: |
      The format diversity assumed under
      `assumptions.brownfield-clients-active` does not
      materialise (all 5 picks end up MADR). Resolution:
      the §4 selection is revised; backup-list candidates
      are substituted; the experiment design is re-validated.
    action: rework


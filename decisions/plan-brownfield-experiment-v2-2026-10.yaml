counterexample: |
  The counter-position considered and rejected: "Brownfield
  adoption is rare in practice; the original experiment's H2
  inconclusive verdict means `mathc adopt` is unused, so
  planning a follow-up experiment is gold-plating." Rejected
  on four grounds. (a) The original H2 was inconclusive
  precisely *because* the experiment did not pick projects
  that exercise the path — the inconclusive verdict is a
  methodology finding, not a usage finding. (b) The
  `ux-3-adopt-roadmap-2026-10@1` planning decision
  (`decisions/ux-3-adopt-roadmap-2026-10.yaml`) explicitly
  scoped the brownfield work as a Phase 3 workstream with a
  separate planning step; planning v2 of the experiment is
  the realisation of that step. (c) The verification in this
  plan's §4 found ≥ 3 of the original §10.7 candidates do
  not ship ADRs at HEAD, which means the original §10.7 list
  was speculative; v2's plan is the first to ground the
  brownfield project list in empirical verification. (d) The
  math-coding decision YAML body of
  `ux-3-import-adr-parser-2026-10@1` already noted that the
  parser's best-effort nature is documented only in
  `lib/import_adr/import_adr.ml`'s header comment — a future
  user-experience gap that v2 of the experiment is designed
  to measure.

  A second counter-position: "Five projects is too few for a
  brownfield experiment; pick 10." Rejected on two grounds:
  (a) the original experiment's selection §4.4 (replacement
  rule + backup list) makes 5 the right sample size; (b)
  adding 5 more projects dilutes the per-project signal
  without exercising new branches of the parser (the parser's
  3 source-kind branches are exercised by 3 of the 5 picks;
  the remaining 2 picks test the detector's `madr_files` /
  `adrtools_files` precision and a custom-format fallback).


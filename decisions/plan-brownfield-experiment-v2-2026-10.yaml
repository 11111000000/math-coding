intent: |
  Plan a brownfield-targeted follow-up experiment to the 2026-10-17
  adoption experiment
  (`docs/experiments/adoption-2026-10.md`). The original experiment
  did not exercise math-coding's brownfield path — its §10.7
  methodology correction called this out and named R8 ("pick projects
  that actually exercise the brownfield path") as a future
  experiment. This decision records the design of that follow-up.

  The v2 experiment picks five projects that empirically ship ADRs
  in-tree (verified via `git ls-tree --name-only -r HEAD` over
  shallow clones in `/tmp/brownfield-v2-verify/`; see the
  verification log preserved in this worktree's audit trail).
  It exercises the brownfield path
  (`mathc adopt` → `mathc import-adr` → `mathc validate`) end-to-end
  on each, with detection-recall / detection-precision and
  import-fidelity as the primary signals.

  The plan is a planning artifact. Execution is a separate future
  worktree, gated on three prior-decision merges
  (`ux-3-adopt-subcommand-2026-10@1`,
  `ux-3-import-adr-subcommand-2026-10@1`, plus the A1/A3/B1
  sub-decisions from `plan-2026-10-adoption-fixes-2026-10`). The
  plan does not modify any kernel file.

  Boundaries (A3 self-application):
  - This decision is META: no kernel surface change.
  - `lib/`, `bin/`, `spec/`, `schemas/`, `axioms/`,
    `scripts/install-tooling/` are unchanged by this decision
    (only by the A1 / A3 / B1 / `ux-3-*` sub-decisions when they
    land).
  - The verification log at
    `/tmp/brownfield-v2-verify/verify.log` is a temporary
    artifact outside this repo; it is read-only evidence for
    the project picks in §4 of the experiment document and is
    removed after the planning commit lands.
  - No external project is modified by this plan or its
    execution. The shallow clones under `/tmp/brownfield-v2-verify/`
    are read-only.

commitment: |
  One planning commitment, documented in `outcomes:` below.
  Three deliverables are pinned by acceptance tests:

    D1. `docs/experiments/brownfield-experiment-v2-2026-10.md`
        exists with the experiment design (methodology, hypotheses,
        metric template, project picks, friction taxonomy using the
        C1 revision, procedure, risks, results placeholders).

    D2. Five candidate projects are empirically verified to ship
        ADRs in-tree (verified by `git ls-tree --name-only -r HEAD`
        over shallow clones; see the verify log). The verification
        log is captured as part of the planning artifact's audit
        trail, not as a tracked file in this repo.

    D3. `mathc validate
        decisions/plan-brownfield-experiment-v2-2026-10.yaml`
        exits 0 (the planning decision itself passes validation).

  Boundaries (A3 self-application):
  - This decision is META: no kernel surface change.
  - The experiment document is the only `docs/` artefact produced.
  - No `lib/`, `bin/`, `spec/`, `schemas/`, `axioms/` file is
    touched by this decision or by the experiment it plans.
  - The brownfield-experiment v2 *execution* (running the 15
    sub-agents) is **not** in this plan's scope; it is a separate
    future worktree gated on the prior-decision merges noted in
    `intent:` above.


risk:
  owner: human:maintainer
  declared_triggers:
    - "the gate step is red on pushes that touch nothing but a declared promise, and somebody relaxes the ratchet or the histogram rule to make the noise stop"
    - "the gate's `gaps_by_kind` names change, and the step's jq filter keeps matching nothing, so an uncovered change reads as the corpus's debt"
    - "the corpus's declared debt grows past its ceiling, and the gate's delegated unknown starts carrying a red that looks like a failing check"
  the-histogram-rule-is-a-copy: |
    The step reads the gap kinds by NAME (`MissingEvidence`,
    `StaleEvidence`, `NoAttestationStore`). Those names are the
    kernel's (bin/Mathc.ml::gap_kind_name), and a step that reads a
    copy of a name is one rename away from reading nothing: a jq
    filter that matches no gap counts zero uncovered, and an uncovered
    change would be delegated to the ratchet and let through. The
    remedy is to fail LOUD when the histogram is empty and the
    verdict is unknown - which is the fourth row of the gate step and
    the eighth row of the simulator.
  the-corpus-debt-is-not-this-changes-debt: |
    The delegation is a statement about the CORPUS: the declared debt
    is under its ceiling. It is not a statement about the change. A
    change that touches a promise nobody keeps is allowed through
    while the corpus's debt is under its ceiling, and that is the
    trade, stated: the corpus's debt is paid by the ratchet, and the
    change is judged by its evidence.

counterexample: |
  The strongest objection is that the gate step is now a step that
  blocks merges on the corpus's own debt, and that the delegation is
  a loophole with a ratchet attached.

  The objection is right about the shape and wrong about the order
  of the facts. A step that turned every `unknown` into a red WOULD
  block the corpus's debt: measured over the last 15 commits, 12 of
  them touch a decision carrying a declaration, so four commits in
  five would be red for a reason that has nothing to do with the
  change. The alternative is not "block everything" - it is "block
  nothing", which is what the step did before.

  The delegation is therefore not a softening of the gate. It is the
  distinction the corpus's own doctrine draws: a promise that no
  program keeps is a DECLARED gap, measured by a ceiling that may
  only fall, and a check that could not be set up for this change is
  an UNCOVERED change, which is a different thing and blocks.

  The second objection is about the loophole: the delegation reads
  the gate's histogram, and the histogram is a copy of the kernel's
  names. If the names change, the filter matches nothing, and an
  uncovered change would be delegated to the ratchet and let
  through. That is a real hole, and it is why the step treats a
  verdict document that says nothing about the gaps as RED rather
  than as "no uncovered gaps".

antithesis: |
  The opposite claim is that the gate step should stay reporting, and
  that the wall of a repository is the self-check step above, which
  is already blocking.

  The claim is right that there should be ONE place where the
  corpus's health decides, and wrong that this is it. The self-check
  step asks the whole-corpus question - it is an AUDIT, and its
  contract is a ceiling that may only fall. The merge gate asks a
  different question: may THIS change land. The two have different
  answers, different remedies and different owners, and the corpus
  already says so: the merge gate is `mathc gate`, and the audit is
  `mathc self-check`. A step that reports the merge gate's verdict
  and lets the merge proceed anyway is a report, and the merge
  gate's question is not a question anyone asked.

  There is a cost the opposite claim does not mention: a reporting
  gate is a gate nobody has to answer for, and a repository whose
  gate is furniture will eventually find out what that costs.

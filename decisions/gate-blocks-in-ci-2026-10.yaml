intent: |
  The merge gate ran in CI and could not fail anything.

  The step `mathc gate (merge verdict for the pushed diff)` carried
  `continue-on-error: true` and `|| true` on the command itself. Both
  say the same thing: the step's status is nobody's problem. It
  printed a verdict on every push, and the verdict decided nothing.

  That is the central claim of the project inverted: the pitch is
  that the protocol makes CI refuse a change by a NAMED rule, and the
  one step that asks the merge gate's question was the one step whose
  answer was discarded. The reason was written down and it was
  reasonable: the corpus carried legacy attestations, the whole-corpus
  question was already asked by the blocking `mathc self-check` step
  above, and a red gate on every push would train people to ignore
  red. The reason was reasonable and the conclusion was wrong, because
  the step was asked to report a question nobody was accountable for.

  WHAT MAKES THE STEP BLOCKING IS NOT THE REMOVAL OF TWO FLAGS. It is
  the answer to the question the flags were hiding: what does the
  gate's `unknown` MEAN?

  The gate's exit codes are the kernel's own (constitution.md
  Invariant 14: a blocking verdict MUST produce a nonzero exit):
  0 is pass or open-with-waiver, 1 is block, 2 is an input error, and
  3 is `unknown` - the gate could not conclude. And `unknown` has
  TWO causes that have nothing to do with each other:

    (a) the change touches a promise the CORPUS does not keep by
        machine - a `manual-` declaration. The verdict is `unknown`
        because the promise has no evidence BY DESIGN. That is the
        corpus's own debt, and the corpus-debt ratchet
        (tests/fixtures/self-check-debt-ceiling.sh) holds the line:
        green while the declared debt is under its ceiling, red when
        it grows. Measured on 2026-10-30: 56 declared promises
        against a ceiling of 233.

    (b) the change touches an obligation with NO EVIDENCE - missing,
        stale, or no store at all. That is THIS CHANGE NOT BEING
        COVERED, and it blocks.

  The two are told apart by the gate's own `gaps_by_kind` histogram,
  which is why the step writes the verdict document to a file and
  reads it back: the exit code alone cannot carry both.

  The distinction is not a nicety. Measured over the last 15 commits
  before this change: 12 of them touch a decision that carries a
  declaration. A step that turned every `unknown` into a red would
  have been red on four commits in five, and a step that turned every
  `unknown` into a green would have let uncovered changes through. A
  gate that blocks everything is not a wall, it is a wall of paper.

commitment: |
  1. The step `mathc gate (merge verdict for the pushed diff)` in
     `.github/workflows/ci.yml` has no `continue-on-error: true` and
     no `|| true`: the gate's verdict decides the step, and the step
     decides the merge.
  2. The step's status is the status of the verdict it is about:
     exit 0 is green, exit 1 (block) is red, exit 2 (input error) is
     red - an unresolvable ref is not a verdict, and a step that
     could not ask its question must not read as an answer.
  3. Exit 3 is the only case with two answers, and the step reads the
     gate's own `gaps_by_kind` to tell them apart: gaps that are
     missing or stale evidence make the step RED (this change is not
     covered), and gaps that are only the corpus's declarations make
     the step's status the corpus-debt ratchet's.
  4. A step that produced no verdict document at all is RED: it
     could not ask its question.
  5. The gate's verdict document is uploaded as a CI artefact beside
     the self-check report, so the answer is readable after the run.
  6. The rows are CHECKED, not asserted: scripts/ci-step-exit-sim.sh
     replays this step's body verbatim against a stub mathc and a
     stub ratchet, over eight rows - and the pre-fix control still
     has to swallow a non-zero exit.

outcomes:
  - id: the-merge-gate-blocks
    statement: |
      A change the gate blocks does not reach main, and a change the
      gate cannot judge is red unless the only thing it cannot judge
      is the corpus's own declared debt.
  - id: the-gate-step-is-checked
    statement: |
      The gate step's contract is replayed by a program in CI, over
      the eight rows that distinguish a block, an input error, a
      promise nobody keeps and a change nobody covered.


    condition: |
      A future maintainer moves to a text-only methodology
      page (no figures) for bandwidth or stylistic reasons;
      the kernel would then either drop the five SVGs from
      `body_extra` and remove the corresponding wrapper
      CSS, or retire this decision in favour of a
      `site-quality-no-figures-2026-XX` decision.

risk:

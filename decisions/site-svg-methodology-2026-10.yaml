axiom_link:
  - A0
intent: |
  Add five hand-rolled SVG figures to the methodology page
  so a visitor who lands on `methodology.html` sees the
  lifecycle, friction ladder, attestation lifecycle, risk
  bands, and verdict flow as first-class artefacts alongside
  the existing kernel pipeline and chain diagram. The two
  existing figures (`assets/kernel-architecture.svg`,
  `assets/chain.svg`) carry the input-to-verdict pipeline
  and the assurance chain; the five new figures carry the
  state machine, friction budget, attestation lifecycle,
  risk taxonomy, and the gate verdict derivation.

  All five are pure SVG, accessibility-tagged with
  `role="img"` + `aria-labelledby` + `<title>`, and live
  under `assets/`. Each is embedded by `lib/render.ml`'s
  `body_extra` match for the `methodology` page key, so
  `mathc render` emits a `<figure class="mathc-figure
  mathc-figure-methodology">` wrapper for each. The wrapper
  inherits the existing CSS rule
  `.mathc-figure-methodology img { max-width: 56rem; }`
  from `assets/style.css`; no CSS change is required.

  Scope: the five figures, the `body_extra` extension in
  `lib/render.ml`, and the obligation that pins them closed.

commitment: |
  `mathc render` emits a `dist/methodology.html` that
  carries, in addition to the existing two figures, five
  `<figure class="mathc-figure mathc-figure-methodology">`
  wrappers for `assets/lifecycle-fsm.svg`,
  `assets/friction-ladder.svg`,
  `assets/attestation-lifecycle.svg`, `assets/risk-bands.svg`,
  and `assets/verdict-flow.svg`, in that order. Each
  `<figure>` wraps an `<img>` with a non-empty `alt=`
  attribute and a `title` element in the source SVG.

scope:
  capabilities:
    - site-illustration
  paths:
    - "assets/lifecycle-fsm.svg"
    - "assets/friction-ladder.svg"
    - "assets/attestation-lifecycle.svg"
    - "assets/risk-bands.svg"
    - "assets/verdict-flow.svg"
    - "lib/render.ml"
    - "dist/methodology.html"

outcomes:
  - id: methodology-svgs-render
    statement: The rendered `dist/methodology.html` carries all
      seven `<figure class="mathc-figure
      mathc-figure-methodology">` wrappers (the two
      pre-existing plus the five new) in source order, and
      each new `<img>` resolves to a present file in
      `dist/assets/`. The five new SVGs are
      accessibility-tagged (`role="img"` +
      `aria-labelledby` + non-empty `<title>`) at the
      source level.

counterexample: |
  "Five diagrams on the methodology page is visual noise;
  one chain diagram is enough."

  Counterargument: the five new diagrams carry orthogonal
  information (state machine, friction budget,
  attestation lifecycle, risk taxonomy, gate verdict
  derivation) that the existing two do not. A visitor
  who already knows the chain still needs the lifecycle
  FSM to know what state their decision is in, the
  friction ladder to know what the kernel will demand of
  them, and the verdict flow to know how the gate exit
  code is derived. Collapsing them would force the
  prose to repeat the information the diagram already
  shows; the cost of two extra screenfuls is lower than
  the cost of a confused first-time visitor.

  "The SVGs duplicate the algebra-3.2 spec; readers
  should read the spec, not look at pictures."

  Counterargument: the SVGs are visual summaries, not
  normative text. The spec (`spec/algebra-3.2.md`) is
  the source of truth; the SVGs are an entry point for
  readers who arrive at the methodology page from the
  home hero without yet knowing the spec exists. The
  `<title>` and `<desc>` elements on each SVG link back
  to the algebra section numbers (e.g. "§11", "§17",
  "§21", "§12", "§13") so a reader who wants depth can
  navigate from the diagram to the spec.

antithesis: |
  Author considered and rejected the strongest counter-
  position: "The five SVGs are too much for one decision;
  split into five `site-svg-<figure>-2026-XX` decisions
  with one obligation each."

  That position is rejected because (a) the SVGs are
  embedded by a single `body_extra` match in
  `lib/render.ml`; five decisions would produce five
  `body_extra` patches that have to land in the same
  file, increasing review cost without a corresponding
  gain in clarity; (b) the five SVGs share a common
  CSS wrapper (`.mathc-figure-methodology`) and a common
  reasoning-tied-to-algebra-sections style; (c) the five
  SVGs are introduced as a coordinated set in the
  methodology page, not as five independent editorial
  additions.

  A counter-decision that wanted five separate cycles
  would have to argue that the five SVGs are introduced
  in five temporally separate review-and-reverse paths;
  the author sees no such axis and prefers the bundled
  cycle.

assumptions:
  - id: site-base-stays-subpath
    state: assumed
    statement: |
      The site's `<base href>` remains a subpath
      (`/math-coding/`) rather than becoming the host
      root. The relative-URL semantics that the new
      `<img src="assets/foo.svg">` references rely on
      the base href overriding the document URL.
    owner: human:maintainer
    consequence_if_false: |
      If a future cycle sets `site_base = "/"`, the
      `assets/foo.svg` references on `methodology.html`
      resolve to `/foo.svg` (404) rather than
      `/math-coding/assets/foo.svg`. A follow-up
      decision would rewire the body_extra entries.
    review_on:
      - signal: deployment-target-moves-to-host-root


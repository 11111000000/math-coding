intent: { source: "issue:signed-on-a-dirty-tree-2026-10-24", text: "Under semantics A the materials digest of an attestation is the digest of the CONTENT of the files its decision's scope names, computed at candidate_tree - the last COMMIT. The verifier, on the other hand, runs against the WORKING TREE. I re-signed the whole store with the version bump and the digest rewrite still uncommitted, so every one of those attestations was bound to content the verifier had never seen: 200 subjects passed against a tree that did not exist." }

commitment: |
  After this decision closes:

  1. `mathc attest-batch` refuses to sign when the working tree
     differs from HEAD, and says why: the digest is computed at
     HEAD and the verifier runs against the working tree, so
     signing now would produce an attestation that claims to cover
     content it never saw.
  2. The workflow is therefore: commit the change, sign, commit
     the attestations. Committing the attestations does not move
     the scope digest, because the attestation store is EXCLUDED
     from the scope digest.

axiom_link:
  - A0
  - A1

counterexample: |
  The strongest objection is that this makes the tool harder to use:
  an author who wants to sign a change they have not committed yet
  cannot, and must make a commit first - which the repository's own
  history forbids for a change that is not ready.

  The objection is right, and it describes the ACTUAL rule the
  project has been living under for weeks: an attestation that
  covers uncommitted content is not a record of anything, because the
  content it claims to have verified does not exist anywhere. The
  change has to become a commit before it can be a fact, and an
  attestation about a fact that does not exist is a decoration.

antithesis: |
  The opposite claim would be to compute the digest from the
  WORKING TREE instead of from HEAD, so signing works on a dirty
  tree and the digest describes what the verifier saw.

  Rejected: the gate evaluates a COMMIT. It computes its reference
  from a commit's blobs. A digest computed from the working tree
  would be a different function from the one the gate computes, and
  the two would never be equal - which is the defect this whole
  release exists to remove. Binding both sides to the same tree is
  the only way the comparison can mean anything.

outcomes:
  - id: signing-is-bound-to-a-tree
    statement: |
      An attestation's materials digest and the tree the gate
      evaluates are computed the same way, so the comparison is
      between two things of the same kind.


counterexample: |
  The strongest objection against this tranche is that a declared
  promise with a date is exactly the paper layer the corpus decided
  it did not want, and that declaring it is measuring a deviation
  from the ideal and calling the measurement progress.

  The objection is right about the shape of the thing. A `declared:`
  block is not a check, it does not make anybody's promise true, and
  nothing in this corpus can make it true. It is a promise ABOUT a
  promise, and the method this repository follows says that a promise
  is either machine-checked or it is not there
  (docs/plans/redundancy-and-portability-2026-11.md §6). This
  tranche contradicts that sentence on purpose, and the contradiction
  is written down rather than smuggled.

  What keeps the declared class from being the paper layer of
  2026-10 is four things that a phrase in prose does not have:

    - the number is VISIBLE. Twenty-one decisions and thirty-nine
      obligations are DECLARED, and the instrument prints them. The
      paper layer of 2026-10 was invisible: `manual-*` promises sat
      in the corpus and every instrument reported green. These are a
      class the census reports separately, with a count of its own.

    - the OWNER is named. `human:maintainer` is a person, not a
      scheme token. A promise with nobody's name on it is a wish; a
      promise with a name on it is a debt, and debts have owners.

    - the DATE stands. 2026-12-15 is written down in the file, and
      the schema does not accept a date in any other shape. A
      declared promise is a promise to look at it by a date, and the
      date passes.

    - the CEILING falls. The DECLARED class is bounded and may only
      fall. When a declared promise is checked, written or archived,
      the number drops and the pin follows the truth down. Paper
      does not have a ratchet; it has a shelf.

  And the answer to the sharpest form of the objection — "you paid
  the debt down by re-labelling it" — is the number that did not
  move: the UNCHECKED class, which is the debt, went from 91 to 37.
  Thirty-seven of the ninety-one are still debt, with no control and
  no declaration; they are the nine the inventory called CHECKED and
  this tranche could not back up, plus the twenty-eight the
  inventory called UNCHECKED and this tranche was told not to touch.
  A tranche that had re-labelled instead of paid would have left the
  debt at 91 and moved the promises into a new class. It did not:
  thirty-six decisions got a control that catches their own failure
  and were measured by it.

  The honest limit of the answer: the corpus cannot force a date to
  be honoured. A `review_on: 2026-12-15` that nobody reads is a
  promise that expires into a promise nobody made. The DECLARED
  ceiling is the only thing that notices, and it notices late — it
  notices when the number stops falling, which is exactly what the
  "slower ceiling" means. The risk block below names this as the
  trigger that would withdraw the class.

antithesis: |
  The opposite position is that the corpus should have no DECLARED
  class at all: a promise that cannot be checked must be rewritten as
  a check or deleted, and the plan's own text says so — "a promise is
  either machine-checked or it is not there", and "it does not write
  one negative control per promise ... the line adopted here is: the
  promise is checked by something that can catch its own lie, or the
  promise is gone".

  The position is coherent, it is the corpus's own rule, and it has
  one advantage this tranche cannot match: it leaves no room for a
  promise nobody checks. Under it, the thirty-nine obligations this
  tranche declares would have to become checks or would have to go,
  and the twenty-one decisions that carry them would shrink.

  The position is wrong about what those thirty-nine obligations
  ARE. They are the visual judgements (does the hero fit on one
  line, does the Russian page mirror the English structure), the
  external evidence (does the musl artifact run, did the site
  workflow publish), and the human reviews (is the bootstrap
  documentation honest). None of them can have a fixture that breaks
  the property and requires the check to fail, because the property
  is not a property of a file. Writing a fixture for them would
  produce exactly what the audit of 2026-10 called worse than paper:
  a check the kernel takes for evidence and that checks nothing.

  And the cost of the counter-position is the thing this tranche
  exists to fix. If the thirty-nine promises are deleted, the
  decisions that carry them lose the part of themselves that the
  method still needs — a manual review of the site's layout is not
  the same promise as "the site is fine", and deleting the first
  because the second cannot be checked is a decision made by
  deleting, not by judging. If they are kept without being declared,
  the corpus is where it was: one number, and no way to tell a
  promise nobody checks from a promise whose check was never written.

  The counter-position is right about the ceiling that matters: the
  UNCHECKED number has to reach zero, and this tranche does not
  pretend otherwise — it went from 91 to 37 and it is still 37. The
  declared class is not where the debt goes to hide; it is where the
  debt that cannot be paid says who is holding it and until when.

outcomes:
  - id: the-debt-is-three-numbers
    statement: |
      The promise debt of the corpus is measured as three numbers
      (CHECKED, DECLARED, UNCHECKED) plus the decisions that make no
      promise, the four add up to the corpus, and the ceiling that
      may only fall is the UNCHECKED one.

  - id: a-declared-promise-has-an-owner-and-a-date
    statement: |
      Every obligation the corpus cannot check carries a `declared:`
      block with an owner and a review date, in a field the schema
      declares and the corpus's instrument reads.

  - id: the-instrument-and-the-inventory-agree
    statement: |
      Every difference between the instrument's classification and
      the claims inventory of 2026-11 is named, with the reason and
      the decision taken.


intent:
  source: "plan:docs/plans/redundancy-and-portability-2026-11.md#4 (tranche T2.4)"
  text: |
    Tranche T2.4 of the redundancy-and-portability plan. The promise
    debt of the corpus was ONE number, and one number was one thing
    that is three.

    The instrument `tests/fixtures/negative-control-debt.sh` used to
    answer one question — "how many decisions name no negative
    control" — and the answer was a single number with a ceiling of
    123. The kernel's own audit of the same question said 88 of 136
    on 2026-11-01 (the plan quotes 99 as of 2026-10-31; the number
    moves because the corpus moves). One number for three different
    situations, and the three situations have nothing in common:

      - a promise that a program can check, where the corpus simply
        never wrote the fixture that proves the check can fail;
      - a promise that no program can check — a visual judgement, a
        CI run outside this tree, a human reading the bootstrap
        documents — and which the corpus said so out loud;
      - a promise that looks checkable, whose check nobody wrote, and
        which the corpus never admitted is uncheckable.

    The second and the third are opposites, and the instrument could
    not tell them apart. Worse: a promise that was honestly declared
    as uncheckable still counted as debt, so the only way to make the
    number go down was to write a fixture — which is the wrong answer
    for a promise that cannot have one.

    So the number became three, and the corpus got a field.

      CHECKED   the decision names `negative_control:` — a control
                that can fail, and the fixture that proves it.
      DECLARED  the decision carries at least one obligation with
                `declared:` — a promise nobody can check, with a
                named owner and a date it is looked at again.
      UNCHECKED neither: obligations, no control that can fall, and
                no honest declaration. THIS is the debt.

    A decision with NO obligations is in none of the three: it makes
    no promise that could be kept or broken. Its number is printed
    too, and the four classes add up to the corpus — checked as a
    SUM, not as three counters that could each be wrong.

    THE MEASURED NUMBERS, before and after this tranche.

      before (corpus at b417c63a, 136 decisions):
        CHECKED 44, DECLARED 0, UNCHECKED 91, no promise 1
        and, in the old single number: 88 of 136 decisions declare an
        executable verifier and name no negative control.

      after:
        CHECKED 77, DECLARED 21, UNCHECKED 37, no promise 1
        and, in the old single number: 52 of 136.

    The debt — the UNCHECKED number, the one whose ceiling may only
    fall — went 91 -> 37. The declared class appeared at 21 decisions
    and 39 obligations, each with an owner and a date.

    THE DIFFERENCE WITH THE INVENTORY, AND ITS RESOLUTION.

    `docs/corpus-claims-inventory-2026-11.md` is one pass over the
    corpus with two classifications: by truth (73 TRUE, 9 FALSIFIED,
    34 STALE-FORM, 20 RECORD) and by control (78 CHECKED, 24
    DECLARED, 34 UNCHECKED). The instrument and the inventory must
    not tell two truths about the same corpus, so every difference
    was looked at. The inventory's rule for CHECKED was WIDER than
    the instrument's: "a relevant negative control OR a named
    verifier/fixture that contains a rejecting/mutation case". The
    instrument's rule is the field `negative_control:`. The
    differences, all of them:

      1. NINE decisions the inventory called CHECKED are UNCHECKED
         here: adapters, capsule-active-policy,
         ci-blocking-list-config, defense-and-init-scope-2026-11,
         fix-yaml-parser-2026-10, gaps-worklist-2026-10,
         new-decision-mkdir-parent-2026-10,
         risk-policy-driven-floor-2026-10 and
         the-kernel-speaks-for-itself-2026-10. Each was read: the
         fixture the decision names asserts the healthy case and
         nothing else — no case in it breaks the property the
         promise is about and requires the check to fail. Naming one
         of them as the `negative_control:` would have been a claim
         the corpus cannot back, so they were left UNCHECKED and the
         ceiling carries them. They are the honest remainder of this
         tranche, not an oversight.

      2. SIX decisions the inventory called UNCHECKED are CHECKED
         here: corpus-tranche-archive-records-2026-11,
         honest-attestation-emission-2026-10,
         paseo-console-mosaic-2026-10,
         paseo-console-plugin-2026-10, redundancy-census-2026-11 and
         store-not-committed-2026-10. Each names a `negative_control:`
         that the inventory read as a control unrelated to the
         promise (a generic shell-grep control, a census that does
         not exercise the claim). The instrument measures the field,
         the inventory measured the substance, and on these six the
         two differ. They are the next tranche's (T2.2b) to fix —
         either the control becomes the real one, or the field goes.

      3. ONE decision the inventory called DECLARED carries no
         obligations at all: attestation-store-fill. It makes no
         promise that could be kept or broken, so it is in the
         "no promise" class and not in any of the three.

      4. The inventory's population is 136 FILES, three of which are
         not decisions: `decisions/obligations.yaml` (the aggregator)
         and the two migration manifests. The instrument's population
         is the 136 files whose schema is a decision schema. The
         inventory also predates three decisions that landed after
         its snapshot (exportable-core-boundary-2026-11,
         kernel-contract-rename-2026-11,
         one-master-policy-and-build-id-2026-11); all three are
         CHECKED.

      On the population both instruments see, the numbers agree.

commitment: |
  After this decision closes:

  1. `schemas/obligation.json` declares the field `declared`: an
     object with `additionalProperties: false`, `owner` and
     `review_on` required, and `reason` optional. `review_on` is a
     date (`YYYY-MM-DD`). The field means: this obligation carries a
     promise no program can check; the owner answers for it until the
     date, and the reason says why nothing can check it.

  2. `schemas/decision.json`'s INLINE obligations form — the second
     branch of the `oneOf`, the one that accepts `statement:` in
     place of `claim:` — refers to the same declaration
     (`$ref: obligation.json#/properties/declared`) instead of
     describing a second one. Two shapes of the same field are two
     truths about it, and the point of this tranche is that the
     corpus stops having two truths about anything.

  3. `tests/fixtures/negative-control-debt.sh` measures FOUR numbers
     over DECISIONS with ONE rule (a decision with obligations that
     carries a `declared:` block is DECLARED; a decision that names
     `negative_control:` is CHECKED; a decision with obligations and
     neither is UNCHECKED; a decision without obligations is in the
     "no promise" class), prints them, and checks that the four
     classes add up to the corpus as a SUM.

  4. The instrument reads the schema for the field's name and its
     required keys, so a field the schema does not know cannot be
     counted by accident, and a `declared:` block the schema does not
     accept is reported as a defect instead of being counted as a
     declaration.

  5. The instrument answers "unknown" (exit 3), never zero, when the
     schema or the corpus cannot be read. Its negative control
     proves both: a corpus that cannot be read and a schema that
     cannot be read each have to produce "unknown".

  6. The CEILINGS. UNCHECKED (the debt) has a ceiling of 37 — the
     number measured after this tranche — and it may only fall.
     DECLARED has its own ceiling of 21, and it falls slower: a
     declared promise is a promise to look at it on a date, and the
     date passes. CHECKED has NO ceiling: it may only grow, and a
     ceiling on it would be a target the corpus is pushed towards.

  7. THE CORPUS. Thirty-nine obligations in twenty-one decisions
     carry the `declared:` block, one per obligation that no program
     can check: owner `human:maintainer`, `review_on: 2026-12-15`,
     and a reason that names why nothing can check that particular
     promise. The date is 2026-12-15 because it falls after the
     corpus tranche that rewrites the decisions whose claims the tree
     has falsified (T2.2b, ending 2026-11-27) and after the
     contract tranche (T3.2, ending 2026-12-04): the declared
     promises are reviewed against a corpus that has already been
     rewritten, and the date lands inside a wave rather than on its
     boundary.

  8. Thirty-six decisions that name a fixture which really does catch
     the failure of their own promise now name it in the field
     `negative_control:` — the fixture the inventory's pass had
     already measured, from `tests/cli/attest-batch-signature.t` to
     `tests/fixtures/sync-version-stale-fails.sh`. The nine decisions
     whose fixtures do NOT catch their own promise are left alone,
     and the debt ceiling carries them.

  9. The kernel is NOT changed. It drops the unknown key, as it
     drops every key it does not read, and `mathc validate` still
     answers parse-ok on a decision that carries the block: a
     declaration is not a check, and the kernel has no business
     executing one. The instrument reads the corpus the way
     `tests/fixtures/redundancy-census.sh` does — the kernel answers
     the questions that are about the kernel's own vocabulary, and the
     corpus's shape is not one of them.


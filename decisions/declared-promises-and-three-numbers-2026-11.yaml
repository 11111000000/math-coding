obligations:
  - id: the-debt-is-measured-in-three-numbers
    claim: |
      `tests/fixtures/negative-control-debt.sh` measures the promise
      debt of the corpus as CHECKED, DECLARED and UNCHECKED (plus the
      decisions that make no promise), prints the four numbers, and
      they add up to the corpus as a sum.
    acceptance:
      all:
        - verifier: tests/fixtures/negative-control-debt.sh

  - id: the-declared-class-is-bounded-and-well-formed
    claim: |
      The DECLARED count is at most its ceiling, no `declared:` block
      in the corpus misses a key the schema requires or carries a key
      the schema does not know, and the instrument answers "unknown"
      rather than zero when the schema or the corpus cannot be read.
    acceptance:
      all:
        - verifier: tests/fixtures/negative-control-debt.sh

  - id: the-schema-knows-the-field
    claim: |
      `schemas/obligation.json` declares `declared` once, with
      `owner` and `review_on` required and `additionalProperties:
      false`; the inline obligations form of `schemas/decision.json`
      refers to that same declaration; the kernel still answers
      parse-ok on a decision that carries the block; and a block the
      schema does not accept is reported as a defect instead of
      buying a decision its DECLARED class.
    acceptance:
      all:
        - verifier: tests/fixtures/declared-obligation-schema.sh

  - id: the-uncheckable-promises-are-declared
    claim: |
      Every obligation in the live corpus that no program can check
      carries a `declared:` block with an owner and a review date, and
      the decisions that carry them are counted as DECLARED by the
      instrument — twenty-one decisions and thirty-nine obligations,
      measured 2026-11-01.
    acceptance:
      all:
        - verifier: tests/fixtures/negative-control-debt.sh

risk:
  owner: human:maintainer
  declared_triggers:
    - "the DECLARED ceiling is raised instead of lowered — the class is growing instead of emptying"
    - "a `declared:` block is added to an obligation a program can check, so that a checked promise is counted as uncheckable"
    - "the review date passes and the declaration is not looked at, and the corpus says nothing"
    - "the instrument's rule and the schema's required keys drift apart, so that a declaration the schema does not accept is counted as one"
    - "a decision in the DECLARED class is added to the corpus without a `declared:` block, and the two numbers disagree"

assumptions:
  - id: the-declaration-is-read-by-a-tool-and-not-by-the-kernel
    state: assumed
    owner: human:maintainer
    statement: |
      The kernel drops the `declared:` key the way it drops every key
      it does not read, and reads no JSON-Schema file at all
      (bin/Mathc.ml:405-407). The instrument reads the corpus and the
      schema itself, the way
      `tests/fixtures/redundancy-census.sh` reads the corpus for the
      numbers the kernel does not answer. A declaration is not a
      check, and the kernel has no business executing one.
    consequence_if_false: |
      If the kernel ever starts reading (or refusing) the key, the
      instrument's rule and the kernel's rule would be two rules
      about one field, and one of them would be measuring something
      the kernel no longer agrees with. The trigger for that is in the
      risk block.
    review_on:
      - signal: kernel-reads-the-declared-key

  - id: a-declaration-with-a-date-is-a-real-review
    state: assumed
    owner: human:maintainer
    statement: |
      A `review_on:` date in the corpus is honoured by somebody
      reading the corpus: the DECLARED class is emptied by work
      (a check is written, the promise is rewritten, the record is
      archived), not by the dates passing. The DECLARED ceiling is
      the only thing that notices when it is not.
    consequence_if_false: |
      If the dates pass without anything happening, the declared
      class becomes a shelf: the number stops falling, the ceiling
      stops meaning anything, and the corpus would be describing its
      own paperwork instead of its promises. The class would then
      have to be withdrawn, and the twenty-one decisions would have
      to be either checked or deleted — which is the position this
      decision's antithesis argues for.
    review_on:
      - signal: declared-ceiling-stops-falling

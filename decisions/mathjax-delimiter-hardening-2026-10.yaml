outcomes:
  - id: mathjax-delimiters-narrowed-to-latex
    statement: |
      The MathJax `<script>` block in
      `lib/render/render_nav.ml::render_head` declares
      `inlineMath: [['\(','\)']]` and
      `displayMath: [['\[','\]']]` only. No `$..$` or `$$..$$`
      pair is emitted in `<head>`. The default `enable_mathjax` flag
      is `true`; `--no-mathjax` disables it.

  - id: math-and-mermaid-css-shipped
    statement: |
      `assets/style.css` declares rules for `mjx-container` and
      `mjx-container[display="true"]` so that MathJax output respects
      the Tufte column rhythm. The `.mermaid svg` rule that this
      outcome originally shipped is retired by
      `site-diagrams-as-svg-2026-10`, and the current test asserts
      that no Mermaid CSS rule remains.

counterexample: |
  "Removing `$..$` from inlineMath breaks the existing
  `mathjax-wiring` obligation, which named `$..$` as a
  supported delimiter."

  Counterargument: the obligation in
  `decisions/site-deploy.yaml` was worded as "every
  `$..$` / `\[..\]` formula renders as TeX", which described
  the supported delimiter set. The `render-kernel-fixes-2026-10@1`
  cycle narrowed the default to OFF but kept the configuration
  intact for the opt-in path. This cycle further narrows the
  opt-in path to `\(..\)` / `\[..\]` only — the same set the
  project's planned kernel contract uses. Any future page
  author that needs `$..$` can wrap their formulas in `\(..\)`;
  the markdown surface does not change. The `mathjax-wiring`
  obligation is amended, not retired: the obligation text is
  rewritten in a follow-up amendment to `site-deploy.yaml`
  (see `relations.amends` below).

  "A single stray `\` in a markdown source (e.g., a Windows path
  `C:\Users\foo` or a shell snippet `\$VAR`) will produce an
  unbalanced `\(..\)` and break MathJax's render."

  Counterargument: MathJax 3's tex-mml-chtml configuration
  treats unbalanced `\(` as literal characters, exactly like
  it already does for unbalanced `\$`. The same hazard exists
  for `$..$` today; the previous default-OFF decision already
  accepted that hazard. The current cases in
  `tests/render_kernel.ml` include pages with backslashes in prose;
  none regress under this delimiter set.

assumptions:
  - id: dollar-sign-in-prose-is-safe
    state: assumed
    statement: |
      No `site/*.md` or `axioms/*.md` page contains a `$` that is
      intended as a math boundary. Dollar signs in the installation
      pages are shell variables (`$PWD`, `${VERSION}`), while the
      TeX-style delimiters found in the axiom pages are the supported
      form. The guarantee does not depend on the source containing no
      `$`; it depends on the emitted MathJax configuration declaring
      no dollar delimiter.
    owner: human:maintainer
    consequence_if_false: |
      If a future page needs `$..$` math, the author wraps it
      in `\(..\)` (one-time source change, no kernel work).
    review_on:
      - signal: dollar-math-added-to-source

  - id: stix-is-acceptable-math-font
    state: assumed
    statement: |
      MathJax 3's default font (STIX Two Math) is acceptable for
      math display. STIX Two Math matches Charter / Georgia
      for English text via shared Latin glyphs; Cyrillic digits
      and identifiers render via the browser's fallback. A
      future opt-in to Latin Modern Math (Computer Modern
      glyphs) is a one-line CSS change.
    owner: human:maintainer
    consequence_if_false: |
      If a future aesthetic audit rejects STIX, replace the
      math-font stack in the CSS rule with "Latin Modern Math"
      first.
    review_on:
      - signal: math-font-rejected-by-audit

obligations:
  - id: mathjax-no-dollar-delimiters
    outcome: mathjax-delimiters-narrowed-to-latex
    statement: |
      The rendered MathJax `<script>` block does not declare
      `'$','$'` or `'$$','$$'` as math delimiters. It declares
      `'\(','\)'` for inline and `'\(','\)'` is **not** the
      literal — declared delimiters are exactly `\(..\)` and
      `\[..\]`.
    claim: |
      `tests/render_kernel.ml::mathjax_no_dollar_delimiters`
      renders a page with `enable_mathjax = true` and asserts
      the produced body does not contain `'$','$'` and does not
      contain `'$$','$$'`. The test fails if either pair is
      present.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml

  - id: math-and-mermaid-css-declared
    outcome: math-and-mermaid-css-shipped
    statement: |
      `assets/style.css` declares at least:
        `mjx-container { font-family: ...math fallback...; }`
        `mjx-container[display="true"] { margin: 1em 0; overflow-x: auto; }`
      The `.mermaid svg` rule is retired by
      `site-diagrams-as-svg-2026-10` (Mermaid is removed from
      the render pipeline).
    acceptance:
      all:
        - verifier: tests/render_kernel.ml

reversal:
  - signal: dollar-math-needed
    condition: |
      A future page in `site/*.md` or `axioms/*.md` needs `$..$`
      math and the `\(..\)` alternative is too verbose or
      conflicts with prose.
    action: rework
  - signal: math-font-rejected
    condition: |
      A future aesthetic audit rejects the STIX Two Math
      fallback and requires Latin Modern Math or Computer
      Modern as the first font.
    action: rework

risk:
  declared_triggers:
    - math-typesetting-regression
    - css-conflict-with-existing-rules
  owner: human:maintainer

relations:
  addresses:
    - render-kernel-fixes-2026-10@1
  amends:

intent: |
  Harden the MathJax 3 wiring so that the dollar sign is no longer an
  active math delimiter.

  2026-10-31, REVISION 2: THE IMPLEMENTATION MOVED, AND THE DEFAULT
  MOVED BACK ON. The renderer used to live in the flat `lib/render.ml`;
  the MathJax head is now emitted by
  `lib/render/render_nav.ml::render_head`. The earlier default-OFF
  workaround was itself superseded by
  `archive/decisions/mathjax-default-on-2026-10.yaml`: the current
  default is `enable_mathjax = true`, with `--no-mathjax` as the
  opt-out. The promise that matters did not change: a literal `$` in
  prose is not a math boundary, and the only emitted delimiters are
  `\\(...\\)` and `\\[...\\]`.

  The current CSS contract is equally narrow. `assets/style.css`
  declares the math-container rules; the old `.mermaid svg` rule is
  retired because Mermaid was removed from the render pipeline. The
  current instrument is `tests/render_kernel.ml`, whose MathJax cases
  passed on 2026-10-31.

  The previous render-kernel cycle (`render-kernel-fixes-2026-10@1`)
  defaults MathJax to OFF; the live site has zero `$..$` or
  `\[..\]` formulas. The reason the cycle defaults MathJax OFF
  rather than ON is that the previous configuration listed both
  `$..$` and `\(..\)` as inline-math delimiters. With `$` active,
  any future page that drops a `$` next to prose — for example
  an inline price like `$100` or a CLI example like
  `mathc packages --format=$X` — would be typeset as math, with
  MathJax wrapping the surrounding prose in `<mjx-container>` and
  italicising plain English words. This is the failure mode that
  motivated the default-OFF stance.

  This decision narrows the MathJax configuration to LaTeX-style
  delimiters only: `\(..\)` for inline math, `\[..\]` for display
  math. The `$..$` and `$$..$$` pairs are removed from the
  inline-math and display-math declarations. With this change,
  future pages that opt into MathJax (`enable_mathjax = true`)
  are isolated from the surrounding prose: a stray `$` is a
  literal `$`, not a math boundary.

  Three artefacts were changed by the original hardening cycle:

    1. The render head dropped the `['$','$']` pair from `inlineMath`
       and the `['$$','$$']` pair from `displayMath`. The rendered
       inline/display block lists only `\(..\)` / `\[..\]`.

    2. `assets/style.css` — add a small block of rules for
       `mjx-container` and `.mermaid svg`. The pre-existing
       stylesheet never declared a math container rule, so any
       future MathJax output would render in MathJax's default
       font (STIX Two Math), which does not match the page's
       Charter / Georgia stack. Three rules suffice: a font
       fallback for the math container, an overflow rule so
       long formulas do not break the Tufte 54-rem column, and
       a display-math vertical rhythm so a `[..\]` block sits
       on its own line.

    3. `assets/style.css` — add `max-width: 100%` and
       `height: auto` for `.mermaid svg` so diagrams do not
       overflow the column on narrow viewports.

  History:
    rev 1: initial adoption. Closes the
    "$`-`active MathJax delimiter" failure mode catalogued in
    `archive/decisions/render-kernel-fixes-2026-10.yaml` obligation
    `mathjax-default-off` (assumption `mathjax-off-default-is-acceptable`).
    The follow-up `t5-2-spec-mathjax` obligation in
    `decisions/plan-2026-10-improvements.yaml:602-620` becomes
    implementable without further delimiter work.
    rev 2 (this revision): re-pointed the implementation and outcome
      at `lib/render/render_nav.ml::render_head`, replaced the old
      default-OFF present tense with the current default-ON contract,
      and removed stale line anchors.

axiom_link:
  - A0
commitment: |
  `mathc render` emits MathJax 3 with LaTeX-style delimiters only
  when `enable_mathjax = true`. The current renderer default is true;
  `--no-mathjax` disables the script:

    - `inlineMath`: `[['\\(', '\\)']]`
    - `displayMath`: `[['\\[', '\\]']]`

  No `$..$` or `$$..$$` pair is emitted in the rendered HTML
  body or `<head>` script. A future page that contains literal
  dollar signs in prose (CLI examples, prices, identifiers)
  is unaffected when MathJax is enabled: those `$` are
  literal characters, not math boundaries.

  `assets/style.css` declares rules for `mjx-container` and
  `mjx-container[display="true"]`:

    - `mjx-container` inherits a math font fallback
      (STIX Two Math → Latin Modern Math → Cambria Math).
    - `mjx-container[display="true"]` carries 1em vertical
      margin and `overflow-x: auto` so a wide display formula
      scrolls instead of overflowing the 54-rem column.
  The former `.mermaid svg` rule is retired. Mermaid is no longer a
  render-pipeline feature; `tests/render_kernel.ml` asserts that no
  `.mermaid` CSS rule remains.

  Boundaries:
    - The current default `enable_mathjax = true` is the one adopted
      by `archive/decisions/mathjax-default-on-2026-10.yaml`. This
      decision owns the delimiter set, not the earlier default-OFF
      workaround.
    - The CSS rules are scoped to math and mermaid containers;
      no rule is changed for prose, code blocks, tables, or
      navigation.
    - The `decisions/plan-2026-10-improvements/t5-2-spec-mathjax`
      obligation (algebra 3.2 spec on the site) is NOT closed
      by this cycle. That cycle publishes `dist/spec/kernel-contract.html`;
      this cycle only makes the MathJax wiring safe enough that
      the algebra-3-page cycle can ship without further kernel
      churn.


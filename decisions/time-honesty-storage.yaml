---
schema: math-coding/3.0-alpha
id: time-honesty-storage
revision: 1

state: active
body_sha: ""
yaml_sha: ""
intent: |
  Close the read side of A1 (Feedback) for time claims. The prior
  decision time-honesty@v1 registered obligations on the forward-
  looking estimator; this decision adds the runtime observation
  side so that actual durations accumulate and an empirical
  distribution can close the loop.

commitment: |
  Three new subcommands (mathc session-start, mathc record, mathc stats)
  write to two declared storage paths:
    - .local/session-start             (one ISO 8601 UTC timestamp);
    - decisions/execution-logs.jsonl   (one JSON object per line).
  Both paths are local to a clone or worktree and are NOT
  tracked in git (see acceptance storage-path-declared).
  `mathc record` does not accept a user-supplied value; the only
  wall-clock-minutes source is the auto-computed difference
  (now - session_start). step-count is recorded when a runtime
  harness supplies the value through a future adapter; until
  then the subcommand accepts --value for step-count only,
  documented as a Phase-1 temporary concession.
  `mathc stats` outputs aggregate quantiles only when n >= 30;
  otherwise it emits a warning that the declared floor
  (bin/data/time-distribution.yaml) still applies.

scope:
  capabilities:
    - runtime-observation
    - empirical-distribution
  paths:
    - "bin/Mathc.ml"
    - "bin/dune"
    - ".gitignore"
    - "bootstrap/time-honesty-storage.yaml"
    - "tests/cram/**"
  exclusions:
    - "lib/**"
    - "spec/**"
    - "schemas/**"
    - "bin/data/time-distribution.yaml"

outcomes:
  - id: runtime-observation-closed-loop
    statement: |
      For every recorded agent session, an event is appended to
      decisions/execution-logs.jsonl with scale = wall-clock-
      minutes and value = (now - session_start). mathc stats reports
      the empirical distribution against the declared floor.
  - id: storage-gitignored
    statement: |
      .local/session-start and decisions/execution-logs.jsonl
      are NOT tracked in git. They are local to a clone or
      worktree and never uploaded by any CI flow.
  - id: stats-n-threshold
    statement: |
      mathc stats emits {n, threshold: 30, quantiles: ...}
      where quantiles (p50, p80, p95, p99) are present only when
      n >= 30; otherwise a warning field is set that names the
      declared floor as the recommended reference.

counterexample: |
  "Agent can fake the value when calling mathc record; storage
  cannot fix it." The counterargument: mathc record has no
  --value, --seconds, or --minutes flag for wall-clock-
  minutes. The only source is now() - session_start, where
  session_start is an ISO 8601 UTC timestamp written by
  `mathc session-start` at the user's keystroke, not the
  agent's request. To fake, the agent must edit
  .local/session-start; the user can verify that file (it is
  in the worktree). ETHICS.md non-surveillance is preserved
  because no data leaves the worktree.

assumptions:
  - id: storage-local
    state: assumed
    statement: |
      Per-worktree storage is sufficient (no cross-clone
      aggregation). Each clone maintains its own bootstrap/
      execution-logs.jsonl.
    owner: human:maintainer
    consequence_if_false: |
      Multi-machine calibration requires a future Decision that
      provides a merge/concat tool over jsonl streams.
    review_on:
      - signal: multi-machine-calibration-needed
        date: 2027-06-01
  - id: step-count-supplied
    state: assumed
    statement: |
      For Phase 1, mathc record --scale step-count accepts a
      caller-supplied count via --value. The runtime harness
      that owns the counter integration is not yet written;
      this concession exists only because no LLM harness today
      calls the step-count scale at all.
    owner: human:maintainer
    consequence_if_false: |
      Strategic misrepresentation reappears when an agent
      supplies its own step count. Mitigation: when the harness
      is implemented, the --value flag for step-count MUST be
      removed in a separate Decision.
    review_on:
      - signal: harness-implements-step-counter
        date: 2027-06-01

obligations:
  - id: storage-paths-declared
    outcome: storage-gitignored
    claim: |
      .gitignore lists .local/ and decisions/execution-logs.jsonl
      as ignored. `git ls-files --error-unmatch` on either path
      returns an error (untracked) on a freshly-init'd worktree.
    acceptance:
      all:
        - verifier: text-scan-gitignore
          result: pass
  - id: record-no-user-value-for-wallclock
    outcome: runtime-observation-closed-loop
    claim: |
      bin/Mathc.ml mathc record does NOT declare --value, --seconds,
      --minutes, or any other numeric flag when --scale is
      wall-clock-minutes. The wall-clock value is computed
      internally. step-count MAY accept --value as documented
      in the assumption step-count-supplied.
    acceptance:
      all:
        - verifier: cram-fixture-record-no-value-for-wallclock
          result: pass
  - id: stats-n-threshold
    outcome: stats-n-threshold
    claim: |
      bin/Mathc.ml mathc stats emits JSON with the fields:
        n (int), threshold (int = 30), scale (string), class
        (string, optional), quantiles (object present only when
        n >= threshold; otherwise omitted), warning (string
        present only when n < threshold).
    acceptance:
      all:
        - verifier: cram-fixture-stats-threshold
          result: pass
  - id: session-start-valid
    outcome: runtime-observation-closed-loop
    claim: |
      `mathc session-start` writes a single ISO 8601 UTC timestamp
      line to .local/session-start and exits 0. Re-running over-
      writes the timestamp with a fresh one (the most recent
      call wins; this matches expected agent-cycle semantics).
      `mathc record` reads this file and emits MC-SESSION-MISSING
      if absent.
    acceptance:
      all:
        - verifier: cram-fixture-session-start-then-record
          result: pass

reversal:
  - signal: multi-machine-federation-needed
    condition: |
      Per-worktree aggregation prevents calibration; multiple
      machines have to combine samples.
    action: supersede-with-federation-decision
  - signal: harness-implements-step-counter
    condition: |
      A runtime harness exists that counts tool calls externally.
    action: remove-record-value-flag-for-step-count

risk:
  declared_triggers:
    - storage-unintended-commit
    - runtime-clock-tampering
    - threshold-too-aggressive
  owner: human:maintainer

relations:
  addresses:
    - time-honesty@1
  supersedes: []

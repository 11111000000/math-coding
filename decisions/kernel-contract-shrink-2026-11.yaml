commitment: |
  1. THE NORMATIVE TEXT MOVES IN ONE COMMIT, AND IT IS THIS DECISION.
     The document's bytes change here: `spec/kernel-contract.md` goes
     from 1016 lines to 229, and the whole change -- the document, the
     five fixtures that mirrored it, and this decision -- lands in one
     commit. Nothing else in the corpus's history may carry a partial
     change to the document.

  2. THE DOCUMENT SAYS WHAT THE KERNEL ENFORCES AND WHAT IS DECLARED.
     Every rule the kernel has is stated three times over: the rule,
     the file and the symbol that enforces it, and the test that fails
     if it stops being true. Every promise no program can check is in
     §31, with the owner accountable for it and the date it is looked
     at again. The words DECLARED appear where the promise is, not in
     a preamble.

  3. THE SECTION NUMBERS DO NOT MOVE. §7 is still the decision record,
     §11 is still the dialectic, §15 is still the gate verdict, §28 is
     still the applicability envelope, §4 is still the inline authoring
     and §23 is still the kernel signature. Nine sections now say, in
     place, that the promise they carry is one no program checks, and
     two sub-sections (§9.1, §11.1) point at the rule that stayed;
     §32 says what each became. A pointer that names a section still
     resolves: the instrument below checks that every section the live
     tree names is a section the contract has, and it holds the list
     of the sections the corpus depends on.

  4. NO FIXTURE COMPARES THE DOCUMENT'S PROSE WITH THE CODE. The five
     fixtures that mirrored the contract now compare the code with a
     constant the code owns, or a pointer with an anchor: the risk
     buckets with the thresholds in `lib/risk.ml::risk_to_mode` and
     with the kernel's own answer at one risk per bucket; the
     canonicalisation with the two implementations that carry it; the
     rendered page with the renderer's own source and with the source's
     section anchors; the envelope with the CLI's own message and the
     section it names; the skill and the CLI with the anchors they
     point at. The instrument below asserts that no fixture under
     `tests/` or `scripts/` reads the contract's prose, and it has a
     negative control that proves the assertion can fail.

  5. THE INSTRUMENT IS EXECUTABLE AND IT HAS TEETH.
     `tests/fixtures/kernel-contract-shrink-2026-11.sh` measures five
     things -- the document's size, its pointers, its declared
     register, the mirrors that are left, and the anchors that survive
     -- and five negative controls prove that each measurement can
     fail: a contract over the ceiling, a contract whose pointer names
     a file that is not there, a contract whose declared promise has no
     owner, a contract that has lost a section the tree names, and a
     fixture that greps the contract's prose.

outcomes:
  - id: the-contract-is-an-index
    statement: |
      `spec/kernel-contract.md` says, for every rule the kernel has,
      the rule, the code that enforces it and the test that would
      notice if it stopped, and it says which promises are only
      DECLARED. The instrument is
      `tests/fixtures/kernel-contract-shrink-2026-11.sh`.

  - id: the-promises-are-classed
    statement: |
      Every promise the kernel cannot check is named as DECLARED, with
      an owner and a review date, in the document's own register. The
      corpus's three classes (CHECKED, DECLARED, UNCHECKED) are the
      corpus's instrument, and this document uses the second one
      out loud instead of leaving a promise to look like a check.

  - id: the-mirrors-are-gone
    statement: |
      No fixture under `tests/` or `scripts/` compares a line of the
      contract with the code. The five that did now compare the code
      with the code, and the instrument fails if a sixth appears.

  - id: the-anchors-survive
    statement: |
      Every section the live tree names is a section the contract
      still has, so the kernel's own diagnostics and the corpus's
      pointers keep resolving.


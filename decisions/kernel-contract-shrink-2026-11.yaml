assumptions:
  - id: the-section-numbers-are-the-contract-s-api
    state: assumed
    owner: human:maintainer
    statement: |
      The section numbers of `spec/kernel-contract.md` are part of the
      contract's interface: the kernel's diagnostics quote them in
      their message text, and about five hundred pointers in the tree
      name them. A future revision may renumber them, but it must do so
      in a protected transition that moves the pointers with them --
      the same rule the rename of 2026-11 followed.
    consequence_if_false: |
      If a revision renumbers the sections without moving the
      pointers, the kernel's diagnostics and the corpus's citations
      name sections that do not exist, and the corpus cannot tell the
      difference between a pointer that resolves and a pointer that
      looks right. The instrument in this decision catches a lost
      section, but only for the pointers it can see.
    review_on:
      - signal: contract-section-renumbering

  - id: the-corpus-level-prose-mirrors-are-known
    state: unknown
    owner: human:maintainer
    statement: |
      Four decisions in the live corpus still verify themselves by
      grepping the contract for a phrase:
      `decisions/algebra-3.2-notation-flag-2026-10.yaml` (the
      notation note), `decisions/dialectic-method-v3-2026-10.yaml`
      (the word `antithesis`),
      `decisions/multi-policy-hierarchy-2026-10.yaml`
      (`resolve_policy`) and `decisions/solo-default-on-2026-10.yaml`
      (`P ∈ prototype_or_throwaway(P)`). Their needles survive in the
      shrunken document, so they still pass -- but they are the same
      defect this transition removes, at the corpus's level rather
      than the fixtures' level, and this transition may not touch
      them.
    consequence_if_false: |
      The next rewrite of the contract that does not carry those four
      needles turns four corpus obligations red, and the corpus will
      read that as a broken promise rather than as the mirror it is.
      The repair is to give each of those obligations a verifier that
      compares the code with a constant the code owns.
    review_on:
      - signal: contract-rewritten-again
      - signal: corpus-mirror-breaks

reversal:
  - signal: the-contract-grows-again
    condition: |
      The contract's line count rises over the ceiling in
      `tests/fixtures/kernel-contract-shrink-2026-11.sh`. Resolution:
      the growth is either a promise the kernel enforces -- which
      belongs in the rule's own section, with its code and its test --
      or a promise it does not, which belongs in §31. A growth that is
      neither is prose, and prose that no program checks is what this
      transition removed.
    action: review

  - signal: the-anchors-are-renumbered
    condition: |
      A revision renumbers the sections of the contract. Resolution:
      the renumbering is a protected transition of its own, with its
      own decision, and it moves the pointers in `lib/`, `bin/`,
      `schemas/`, the corpus, the tests and the site in the same
      commit -- the rule the rename of 2026-11 followed.
    action: rework

risk:
  owner: human:maintainer
  declared_triggers:

intent:
  source: "plan:docs/plans/redundancy-and-portability-2026-11.md#9.2 (tranche T3.2)"
  text: |
    The contract was an index that had become a second source of
    truth. It said, for every rule the kernel has, WHAT the rule is in
    pseudo-mathematics -- quantified formulas, thresholds, complexity
    bounds -- and the pseudo-mathematics was never checked by
    anything. A formula that no program checks cannot fail a test, and
    a document that is maintained by hand drifts: the contract still
    enumerated sections it had already deleted, and it still carried a
    friction envelope, a cost model and a table of improvement
    percentages that no program in this repository measures.

    THE FAILURE THIS TRANSITION REMOVES IS MEASURED, NOT ASSUMED.
    Five fixtures read the contract and compared what they read with
    the code: `tests/cli/risk-bucketing.t` (the risk buckets against
    `lib/risk.ml`), `tests/cli/body-vs-wrapper-canonical.t` (the
    canonicalisation against `lib/decision.ml`),
    `tests/cli/render-mathjax-spec.t` (the rendered page against the
    words the document carried), `tests/cli/applicability-envelope.t`
    (the envelope against the decision that carried it), and
    `scripts/check-applicability-agreement.sh` (the rule against the
    skill and the CLI). A fixture that greps the prose breaks the
    moment the prose is rewritten, and this tranche rewrites the
    prose. Every one of those five now compares the code with a
    constant the code owns, or a pointer with an anchor, and never a
    line of prose.

    WHAT THE DOCUMENT PROMISED BEFORE, AND WHAT IT PROMISES NOW. It
    promised a model: the algebra of the protocol in quantified form,
    with a summary table of what changed since 3.1. It promises an
    index: for every rule the kernel has, the rule, the file and the
    symbol that enforces it, and the test that would notice if it
    stopped being true; and for every promise no program can check,
    the words DECLARED, with the owner accountable for it and the
    date it is looked at again.

    THE SECTION NUMBERS DID NOT MOVE, and that is the load-bearing
    part of the transition. About five hundred pointers in `lib/`,
    `bin/`, `schemas/`, the corpus, the tests and the site name a
    section of this document, and the kernel's own diagnostics quote
    them in their message text. A renumbering would have left every
    one of them pointing at a section that is not there -- and
    `lib/`, `bin/` and `schemas/` are not in this tranche's scope. The
    sections that survived kept their number and their subject; what
    changed is the body.

counterexample: |
  The strongest objection against this transition is that it deletes
  information. The old contract carried the friction envelope, the
  quality dimensions with their percentages, the cost model, the
  universal sets, the trust dynamics, the adoption path, the
  distribution property, the time budget -- and this transition
  reduces most of them to a row in a table that says "nobody
  measures this". A reader who wanted to know what the kernel
  promises about friction, or what the protocol claims to improve, or
  how a trust level rises, gets nothing where there used to be a
  section. The corpus has spent months teaching that a promise no
  program checks is decoration, and this transition applies the
  lesson to the normative text itself: eleven of those promises are
  still in the document, in one place, with the owner and the date --
  but a reader who wants the formula has to go to the decision that
  carries it, and eleven of those decisions have not been written
  yet.

  The objection is right about what is lost and wrong about the
  alternative, and the corpus has already measured the alternative.
  The old document said friction was at most ten lines at the light
  mode, and no program in this repository ever counted the lines of a
  commit. It said the quality dimensions improve by thirty percent,
  and nothing measured a percentage of anything. It carried a cost
  model with `O(...)` bounds for nine functions, and the model was
  wrong the moment a tenth function was added -- which is exactly
  what happened. A reader who reads a promise in this document and
  believes it is enforced is worse off than a reader who is told, in
  the same document, that nobody checks it.

  What would change the verdict: if a reader of the contract cannot
  get to the answer, the DECLARED register is not the index it claims
  to be. The instrument below checks that every declared promise
  carries an owner and a review date, and that every path the
  document names is a path that exists -- so the answer is a pointer
  away, not a guess.

antithesis: |
  The coherent counter-position is that the contract should stay a
  MODEL: a complete, self-contained statement of the protocol, with
  the mathematics, because the kernel is one implementation of a
  method and the method outlives the implementation. A reader who
  wants to know the protocol should not have to read OCaml to find
  out; and a document of rules and pointers is a document about the
  kernel, not about the method. The position is right that a contract
  which only mirrors the code has lost something the code does not
  have -- the INTENT, the reason the rule is the rule -- and that
  matters for a protocol whose whole point is that people adopt it.

  The position is wrong about what the code is. The kernel is not one
  implementation of a method that also exists on paper: the corpus's
  own instruments ask the KERNEL what it enforces, and the answers
  come from the code, not from this file. A model in prose and a
  kernel in code are two implementations of the same rule, and two
  implementations drift -- which is what this repository spent the
  last quarter measuring. The intent is not lost by this transition:
  it lives in the DECISIONS, each of which carries an intent, a
  counterexample and an antithesis, and the contract points at the
  code that enforces what those decisions decided.

  The strongest thing the opposite position has is that a reader of
  the DECLARED register learns what is NOT enforced, and a reader who
  stops there may believe the project promises nothing about friction
  at all. This decision concedes the shape: DECLARED is a class, not
  a dismissal, and every promise in it carries an owner and a date,
  which is the corpus's own answer to "who is holding this?".


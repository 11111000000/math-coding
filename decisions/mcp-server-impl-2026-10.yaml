outcomes:
  - id: binary-built
    statement: |
      `dune build` produces `_build/default/bin/mathc_mcp.exe`
      alongside the existing `mathc.exe` binary. The MCP
      server runs as a separate stdio server, not as a
      sub-mode of `mathc`.
  - id: seven-methods-routed
    statement: |
      Each of the seven methods (`mathc/validate`,
      `mathc/explain`, `mathc/packages`, `mathc/mode`,
      `mathc/re-evaluate`, `mathc/rebuttals`,
      `mathc/self-check`) is implemented as a
      `dispatch.ml` case that builds the appropriate
      `mathc <subcommand>` argv, runs it as a
      subprocess, and returns the stdout as the
      JSON-RPC `result`.
  - id: parse-error-handled
    statement: |
      Malformed JSON input (e.g. a line that is not
      valid JSON) returns a JSON-RPC error with code
      `-32700` (Parse error) and a `data` field
      carrying the parser error message. The
      dispatcher does not crash, hang, or exit.
  - id: unknown-method-handled
    statement: |
      Method names not in the seven-name allowlist
      (including the `mathc/` prefix variants of
      read-write methods like `mathc/gate`) return a
      JSON-RPC error with code `-32601` (Method not
      found).

counterexample: |
  "Subprocess invocation is just a hack; the MCP server
   should be a real OCaml API."
  Counterargument: the kernel boundary forbids
  `lib/mcp/` from depending on the dispatcher
  (`bin/Mathc.ml`), and `do_*` handlers call `exit`,
  which would kill the MCP server. The subprocess
  pattern is the minimal, correct integration for
  this stub slice; an in-process refactor is the
  work of the next slice, sequenced behind this one.

  "Why expose only seven methods? Read-write methods
   should be in the same allowlist for completeness."
  Counterargument: read-write methods
  (`gate`, `attest`, `record`, `re-evaluate-decisions`)
  produce persistent side effects in
  `attestations/` and `decisions/execution-logs.jsonl`;
  exposing them in a slice whose name is
  "server STUB" is exactly the divergence vector
  A3 forbids. Read-write exposure is the next
  slice's work.

  "Why the `mathc/` prefix? The JSON-RPC spec allows
   any string as `method`."
  Counterargument: the slash separator is the
  JSON-RPC convention for namespaced methods; using
  `mathc/validate` instead of `validate` prevents
  collisions with other tools in the agent's MCP
  tool table.


assumptions:
  - id: mathc-binary-co-located
    state: assumed
    statement: |
      The `mathc_mcp` binary is co-located with the
      `mathc` binary in the same `_build/<context>/bin/`
      directory; the dispatcher resolves the `mathc`
      binary path by stripping its own suffix and
      appending `mathc.exe` (or `mathc` on systems
      without the extension).
    owner: human:maintainer
    consequence_if_false: |
      If the binaries are not co-located (e.g. when
      installed via a package manager that places
      them in different bindirs), the dispatcher
      falls back to PATH lookup via `which mathc` or
      the `MATHC_BIN` environment variable. This
      fallback is OUT OF SCOPE for the stub slice;
      this assumption holds for `dune build` and the
      binary release tarball.
    review_on:
      - signal: mcp-binary-resolution-fallback-needed
  - id: kernel-api-stable
    state: assumed
    statement: |
      The seven read-only subcommands' argv/stdout
      contracts are stable at HEAD before this slice
      lands.
    owner: human:maintainer
    consequence_if_false: |
      A breaking change to any of the seven
      subcommands' argv or stdout shape (e.g.
      removing `--format=json` from `validate`)
      would silently break the MCP dispatcher. The
      `tests/mcp_test.ml::happy-path` test catches
      regressions on the live tree; CI matrix
      coverage for the released tarball is the next
      slice's work.
    review_on:
      - signal: cli-output-shape-changed


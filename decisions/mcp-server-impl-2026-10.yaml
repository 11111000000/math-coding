          path: tests/mcp_test.ml::happy-path-explain
          result: pass
        - verifier: tests-pass
          path: tests/mcp_test.ml::happy-path-packages
          result: pass
        - verifier: tests-pass
          path: tests/mcp_test.ml::happy-path-mode
          result: pass
        - verifier: tests-pass
          path: tests/mcp_test.ml::happy-path-re-evaluate
          result: pass
        - verifier: tests-pass
          path: tests/mcp_test.ml::happy-path-rebuttals
          result: pass
        - verifier: tests-pass
          path: tests/mcp_test.ml::happy-path-self-check
          result: pass
  - id: parse-error-tested
    outcome: parse-error-handled
    claim: |
      A request whose body is not valid JSON returns a
      JSON-RPC error response with `code == -32700` and
      a `data` field naming the parse error; the server
      stays alive and accepts the next request.
    acceptance:
      all:
        - verifier: tests-pass
          path: tests/mcp_test.ml::parse-error
          result: pass
  - id: unknown-method-tested
    outcome: unknown-method-handled
    claim: |
      A request whose `method` is not in the
      seven-name allowlist (including the
      `mathc/gate` read-write method) returns a
      JSON-RPC error response with
      `code == -32601` (Method not found).
    acceptance:
      all:
        - verifier: tests-pass
          path: tests/mcp_test.ml::unknown-method
          result: pass
  - id: self-check-non-regression
    outcome: binary-built
    claim: |
      `mathc self-check` still reports 67 pass / 1
      unknown after this slice lands.
    acceptance:
      all:
        - verifier: self-check-baseline-preserved
          command: mathc self-check
          expected:
            pass: 67
            unknown: 1
          result: pass


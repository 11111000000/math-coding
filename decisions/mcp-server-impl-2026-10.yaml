intent: |
  Land the MCP server stub the Phase-2 deferral
  `mcp-server-impl-pending@1` was waiting for. The
  server is a thin JSON-RPC 2.0 dispatcher over stdio
  that exposes mathc's read-only subcommands to AI
  agent hosts (claude-code, opencode, cursor). The
  dispatcher is purely an I/O adapter: it parses a
  JSON-RPC request, invokes `mathc <subcommand>` as
  a subprocess, and returns the JSON output verbatim
  as the JSON-RPC result. No new kernel surface is
  introduced; the kernel under `lib/` stays offline
  and pure per OCAML_BEST_PRACTICES §1.3.

  This decision SUPERSEDES
  `decisions/mcp-server-impl-pending.yaml`. The
  `reversal.signal: mcp-server-impl-pending-resolved`
  in the deferral decision is the machine-readable
  trigger; firing it is the bookkeeping consequence
  of this decision landing.

  Audit reference: `OCAML_BEST_PRACTICES.md:42` and
  §10.1 (sub-library split for adapters), the deferral
  decision itself, and `decisions/adapters.yaml` (the
  adapter split convention this server inherits).


axiom_link:
  - A0
  - A3

antithesis: |

  The counter-position considered and rejected:
  "Implementing the MCP server as a thin wrapper
  around the existing mathc binary via subprocess
  invocation is wrong; we should refactor bin/Mathc.ml
  to expose a programmable API that the MCP layer can
  call in-process, avoiding fork/exec latency and the
  need to round-trip JSON through stdin/stdout." The
  author engaged with this position and rejected it
  on five grounds: (a) the in-process API requires
  refactoring every existing `do_*` function to
  return a value instead of calling `exit`, which
  crosses the explicit boundary in this slice that
  says `bin/Mathc.ml` MUST NOT be modified; (b) the
  subprocess latency is sub-50ms for all seven
  methods, which is well within the threshold agent
  hosts impose; (c) the subprocess shape forces the
  MCP server to use the SAME code path agents invoke
  directly via `mathc <subcommand>`, eliminating a
  divergence vector; (d) the subprocess pattern is
  already proven at `bin/Mathc.ml:3513` for
  `read_self_check`, so the design has prior art in
  this codebase; (e) refactoring `do_*` to return
  values is a much larger change whose fix does not
  belong in a stub slice — it is the next slice's
  work, sequenced behind this one.



commitment: |
  This slice delivers a thin JSON-RPC 2.0 server
  over stdio. The server exposes exactly seven
  read-only methods:

    - `mathc/validate`     (parse-only verdict)
    - `mathc/explain`      (decision body lookup)
    - `mathc/packages`     (decision table)
    - `mathc/mode`         (path risk classification)
    - `mathc/re-evaluate`  (re_evaluate oracle)
    - `mathc/rebuttals`    (rebuttal walker)
    - `mathc/self-check`   (live verdict)

  Method names use the `mathc/` prefix per the MCP
  convention (JSON-RPC `method` is a string; the
  slash is allowed and avoids namespace collisions
  with other tools). Read-write methods
  (`mathc/gate`, `mathc/attest`, `mathc/record`,
  `mathc/re-evaluate-decisions`) are explicitly OUT
  OF SCOPE for this slice; any attempt to invoke
  them via `mathc <subcommand>` would run them as a
  subprocess and produce side effects, which the
  dispatcher must prevent. The dispatcher enforces
  an allowlist of the seven names above; everything
  else returns `-32601 Method not found`.

  The server is a separate executable
  (`bin/mathc_mcp.ml`) that lives alongside the
  existing `mathc` binary; the kernel under `lib/`
  is unchanged. The dispatcher shells out to
  `mathc <subcommand>` and returns the subprocess
  stdout verbatim as the JSON-RPC `result` field
  (the existing subcommands are JSON-shaped by
  design; the dispatcher is a pass-through). Exit
  code 0 → success; non-zero exit → JSON-RPC error
  with the mathc exit code, the stderr tail, and
  the parsed stdout (when parseable) in `data`.

  Boundaries (A3 self-application):

  - This decision does NOT modify `lib/decision.ml`,
    `lib/policy.ml`, `lib/diagnostic.ml`,
    `bin/Mathc.ml`, `lib/mcp/*` (the existing
    `lib/git/`, `lib/junit/`, `lib/attestations/`
    sub-libraries), `schemas/`, `spec/`, or
    `axioms/`.
  - This decision DOES introduce `lib/mcp/` as a
    new sub-library (`mathcoding_mcp`) per the
    adapter convention in OCAML_BEST_PRACTICES §10.1.
  - The dispatcher rejects any method not in the
    seven-name allowlist; this is the only path to
    preventing read-write methods from being
    invoked via the MCP server in this slice.



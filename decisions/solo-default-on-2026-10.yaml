outcomes:
  - id: envelope-default-on
    statement: |
      A project with a single maintainer receives `mathc init`
      scaffolding and the agent skill; the sole exclusion is
      `prototype_or_throwaway`.
  - id: conditions-printed-at-deploy
    statement: |
      `mathc init` stdout names the default path, the signals that
      lift the ceremony, the one exclusion class, and the effective
      `mode_floor`.
  - id: one-vocabulary
    statement: |
      The spec, the runbook, and the skill all call the non-protocol
      path "Path C"; the skill and the spec agree on the solo case.

counterexample: |
  "A solo maintainer with one agent and no audit requirement gets
  nothing from this protocol that a good commit message and a
  reviewer-less `git log` do not already give." This is the rev-1
  objection and it is still partly true — which is why the answer is
  a mode, not an exit. What it gets wrong is the word "nothing".
  The deliverable is not the commit message; it is the paragraph
  that names the strongest objection to the change *at the moment the
  change is made*, while the reasoning still exists. Six months later
  the maintainer (or the agent) can find it with
  `mathc self-check`; `git log` returns the diff and the author,
  which is not the same artifact.

  The failure mode this decision cannot rule out: a project adopts
  the kernel, never writes a decision, and the ceremony becomes
  boilerplate that satisfies the gate without informing anyone. That
  is a real risk and it is not specific to solo projects — it is the
  failure mode of any project that treats the protocol as a tax.
  `mode_floor: light` is the mitigation available to a project that
  decides the record is not earning its keep; deleting
  `.math-coding/` is the honest exit, and §23's explicit-rationale
  clause is what makes that exit a statement rather than a drift.

  What would change the verdict: evidence that solo adopters
  generate decisions nobody ever reads, at a rate above that of
  multi-agent adopters. The reversal signal is
  `solo-adoption-ceremony-only`.

assumptions:
  - id: readme-rationale-findable
    state: assumed
    statement: |
      A project that declines the protocol records the throwaway
      rationale where a reader will find it. §23 already requires
      the rationale; this decision does not add a machine-readable
      home for it.
    owner: human:maintainer
    consequence_if_false: |
      Silent non-adoption. The protocol cannot tell an unenrolled
      project from an unenrolled author, so the default-on envelope
      is unenforceable against a project that ignores it entirely.
      This is the known limit of the flip and is why Path C stays a
      closed, positively-defined class rather than a free-for-all.
    review_on:
      - signal: unread-decisions-report
  - id: operator-declares-floor
    state: assumed
    statement: |
      A project that wants the light rung declares `mode_floor:
      light` in its own `policies.yaml`. `mathc init` prints the
      requirement but does not write the file.
    owner: human:maintainer
    consequence_if_false: |
      The project runs at `default_policy.mode_floor = Tiny`, which
      is cheaper than light, not more expensive — the failure is
      under-enforcement, not over-friction.
    review_on:
      - signal: init-writes-policies-yaml

obligations:
  - id: init-prints-envelope
    claim: |
      `mathc init` prints the default-on envelope, the lift signals,
      the single exclusion class, and the effective `mode_floor`, and
      the scaffolded policy validates without hand-editing.
    outcome: acceptance
    acceptance:
      all:
        - verifier: tests/cli/init-applicability-envelope.t
          result: pass
  - id: skill-copies-identical
    claim: |
      `adoption/SKILL.md` and `.opencode/skills/math-coding/SKILL.md`
      stay byte-for-byte identical, so the agent-facing copy cannot
      drift back to the rev-1 solo exclusion.
    outcome: acceptance
    acceptance:
      all:
        - verifier: scripts/check-opencode-skill.sh
          result: pass
  - id: adoption-doc-fresh
    claim: |
      The adoption docs keep the schema-string and install-URL pins
      that `ux-3-adoption-doc-freshen-2026-10` asserts; rewriting
      the applicability section did not drop them.
    outcome: acceptance
    acceptance:
      all:
        - verifier: scripts/check-adoption-doc-freshen.sh
          result: pass
  - id: spec-envelope-single-source
    claim: |
      `spec/algebra-3.2.md` §28 states `default_path(P) = Path A`
      unless `P ∈ prototype_or_throwaway(P)`, and no surviving
      document calls the low rung "Path C".
    outcome: acceptance
    acceptance:
      all:
        - verifier: shell-grep
          path: spec/algebra-3.2.md
          needle: "default_path(P) ≔ Path A unless P ∈ prototype_or_throwaway(P)"
          result: pass

reversal:
  - signal: solo-adoption-ceremony-only
    condition: |
      A maintainer observes that solo projects adopt the kernel and
      write decisions that no one reads, at a rate above their
      multi-agent peers, and concludes the ceremony has become a
      tax. Resolution: a follow-up decision restores a solo rung
      with an explicit opt-in, or re-adds `solo_or_small_team ∧
      ¬ai_writes_into(P)` to the non-candidate list; this decision's
      revision goes to `state: superseded`.
    action: rework


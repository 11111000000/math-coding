intent: |
  The applicability envelope (`spec/algebra-3.2.md` §28) told a solo
  maintainer that the protocol was not for them. The normative text
  said "solo_or_small_team ∧ ¬multi_agent_ai_assisted ⇒ Path C";
  `adoption/SKILL.md` shortened that to "A single person maintains it
  without AI assistance" and placed it under *When not to apply*. An
  agent loading the skill therefore declined to install a kernel the
  algebra had already admitted the project into, and no code path
  recorded the refusal — it was prose, so it was unfalsifiable and
  unfalsifiable-by-default.

  The two documents also disagreed with each other, and §28 disagreed
  with the user's actual situation: an agent loading the skill saw
  "one maintainer, skip", while the spec saw "one human plus agents
  that write code, Path A".

  After this cycle the envelope is default-on. The burden of proof
  moves to the exclusion: `mathc init` installs the kernel for any
  project expected to outlive the next refactor, single maintainer
  included, and the one Path C class is
  `prototype_or_throwaway` — code with no expected continuity. The
  friction observation from rev 1 is not discarded; it is demoted
  from an exit to a mode choice, because `mode_floor: light` already
  bounds the per-commit cost to `{commitment, counterexample}` (§4)
  with a `decision:` trailer satisfying the gate (§5).

  Three surfaces carry the flip, because three different readers
  exist: the normative algebra (the kernel's own authority model),
  the agent-facing skill (what an agent reads at trigger time), and
  the CLI (what a human sees at deploy time). Changing only the first
  would leave the observed bug untouched; changing only the second
  would leave the protocol contradicting itself.

axiom_link:
  - A0
  - A3
  - A4

antithesis: |
  The counter-position considered and rejected: "the envelope is a
  gate, not a suggestion; widening it to cover solo projects is how
  methodologies metastasize into religion. Every project that adopts
  pays the ceremony, and the ceremony is the cost." This decision
  engages with the position and does not dismiss it — it narrows it.
  The objection is about *volume*, and volume is already a parameter:
  `mode_floor` exists precisely so that the same protocol can be paid
  at different prices (algebra §2, `lib/policy.ml::mode_floor`). The
  alternative to a light-mode solo project is not "the same project
  without the record"; it is the ADR-plus-reviewer regime that
  `adoption/SKILL.md` itself told solo projects to use, which leaves
  no durable trace of *why* a change was made.

  A weaker version of the same objection — "leave the spec alone and
  let operators who want it opt in" — fails for the reason this
  decision exists: the opt-out was already available in §28, and the
  prose in SKILL.md consumed it. A gate nobody can fail is not a
  gate.

commitment: |
  1. `spec/algebra-3.2.md` §28 is default-on. `default_path(P) = Path
     A` unless `P ∈ prototype_or_throwaway(P)`. A new rung
     `solo_ai_assisted(P)` (medium) is inserted above the solo case,
     and the low rung maps to "Path A, light mode floor" instead of
     "Path C". §24's duplicate of the mapping is updated in the same
     commit.

  2. `adoption/SKILL.md` and its byte-identical copy
     `.opencode/skills/math-coding/SKILL.md` state the single
     Path C class explicitly and no longer list "a single person
     maintains it without AI assistance" as a reason to skip. An
     AI agent writing into the repo is listed as a signal that lifts
     the ceremony above the light floor.

  3. `mathc init` prints the envelope it assumed at deploy time
     (`lib/init/init.ml::print_applicability_envelope`), naming the
     default, the lift signals, the one exclusion class, and the
     `mode_floor` the kernel will actually use when the project has
     no `policies.yaml` (`default_policy.mode_floor = Tiny`).

  4. The scaffolded master policy's `counterexample` is reframed: the
     overhead-for-a-solo-developer objection is retained as the
     strongest objection, answered by mode choice rather than by
     exclusion. `mathc init` followed by `mathc validate` on the
     scaffolded file still exits 0.

  5. `USAGE.md` §"Choose your adoption path" states the default-on
     envelope, and the runbook's "Path B" is renamed "Path C" to
     match the algebra's single vocabulary.

  6. `tests/cli/init-applicability-envelope.t` pins all four
     surfaces with path-stable grep assertions.

  Boundaries (A3 self-application):

  - This decision does not add a `mathc init --path=` flag. Path C
    remains a written rationale in the README, per §23, not a CLI
    switch; the flag is the natural follow-up and is out of scope
    here.
  - `mathc init` does not write a `policies.yaml`. The light rung is
    the operator's declaration, and `init` says so in the printed
    envelope rather than implying it acted.
  - `mathc init` cannot observe team size, agent count, or audit
    obligations. The print states the assumed envelope and does not
    claim detection.
  - The pre-existing redness of `tests/cli/init*.t` is unchanged and
    is not caused by this decision: those fixtures embed literal
    `mktemp -d` paths in their expected output and dune 3.23.1's
    vendored cram does not implement `(glob)`. The new fixture avoids
    the class of bug instead of inheriting it.


intent: |
  Close the "Tier 2G" item that
  `decisions/ci-green-batch1-2026-10@1` recorded as out of scope
  and promised to a `decisions/<TBD>.yaml`: this file is that
  decision. Two independent defects in
  `tests/support/forge_stub/forge_stub.ml` kept the suite
  `tests/rebuttal_forge_stub.ml` red — three of its five cases
  failing, two of them on a timeout rather than on an assertion.

  Defect 1 (the one Tier 2G named): `read_request` recursed into
  itself from inside its own line loop and had no end condition.
  The blank line that terminates an HTTP head — the RFC 9112 end
  of the header section — was matched by `if line = "" then ()`,
  i.e. swallowed, after which the function called `Unix.read`
  again. It could only return at EOF. `curl` does not close the
  connection after sending headers; it waits for a response. So
  the stub blocked in `Unix.read` while owing the client a
  response, `with_stub` never got past `wait_until_ready`, and the
  three stub-backed cases failed on a 5-second deadline. The
  `cr_seen` flag compounded it: a character reached the buffer
  only when a CR had already been seen, so the request line and
  the first character of every header were dropped. The returned
  string was garbage — invisible, because the sole caller
  discards it.

  Defect 2 (not named by Tier 2G, found while fixing defect 1):
  `main` called `Unix.accept` exactly once and exited after one
  response. But `with_stub` spends one connection on its
  readiness probe and the probe under test then opens a second,
  which the single-shot server left to ECONNREFUSED — a failure
  `forge_mirror` maps to `[]`. Measured before this decision:
  fixing `read_request` alone moved the suite from 3 failures to
  1, and the survivor failed with "expected 2 rebuttals ... got
  0" plus curl exit 7. The single-shot shape entered in 5a4fec8
  together with the stub itself; the readiness probe predates it,
  from the `python3 -m http.server` stub that served every
  connection.

  What this decision changes is test infrastructure only. The seam
  under test — `lib/rebuttal.ml::forge_mirror` — is untouched, and
  so are the assertions in `tests/rebuttal_forge_stub.ml`.

  Defect 3 (found during verification, NOT fixed here): the test
  spawns `forge_stub.exe` by path, so dune cannot see the edge. On
  a cold `_build` the test executable starts before the stub has
  finished linking and dies with `stub binary not found` -- three
  failures in 0.06s, no assertion run. It reproduces on a clean
  checkout of the pre-fix tree and has nothing to do with either
  defect above. Declaring `(deps %{exe:support/forge_stub/
  forge_stub.exe})` on the `(tests)` stanza in `tests/dune` was
  tried and reverted: it does create the edge, but a test stanza
  with deps runs sandboxed from `_build/default/tests/`, and
  `spawn_stub` walks up for `dune-project` to find the project
  root -- which now resolves to the sandbox, yielding the doubled
  path `_build/default/tests/_build/default/...`. Fixing it
  properly means deriving the root from `DUNE_SOURCEROOT` or
  refusing to walk through a `_build` directory, i.e. an edit to
  `spawn_stub` in the file a parallel worktree is reformatting,
  for a defect this decision did not introduce and does not need
  to close. Recorded here instead of fixed; see the
  `reversal` signal.

  History:
    rev 1: read_request stops at the blank line; the stub answers
      every connection; paired fixture and scope recorded.
    rev 2 (this revision): defect 3 recorded after verification,
      with the `(deps)` experiment and its revert. No code
      changed.
commitment: |
  `read_request fd` reads one HTTP head and returns it. It returns
  exactly once: at the first blank line, or at EOF if the peer
  hangs up first. It never calls `Unix.read` after that byte, so a
  client that sent headers and is waiting is answered rather than
  left blocking. Both `\r\n` and bare `\n` terminate a line; a CR
  is dropped rather than accumulated. The return type stays
  `string` and the accumulated header block is still the result —
  its one caller still discards it.

  `forge_stub` answers every connection it accepts, not just the
  first, until `with_stub` SIGTERMs it at teardown. Each response
  still carries `Connection: close` and the body passed as argv.
  The parent-pid check makes a reparented orphan exit after its
  next connection rather than hold the port for the session.

  `tests/rebuttal_forge_stub.ml` passes 5/5 with its assertions
  unchanged. `tests/fixtures/forge-stub-read-request.sh` — the
  paired fixture, behavioural rather than a source-shape grep —
  fails against the pre-fix stub, which is what makes it a
  verifier and not decoration.

  Boundaries:
  - `lib/rebuttal.ml::forge_mirror` is unchanged, including its
    refusal to raise: an unanswered stub is still `[]`, not a
    Block. This decision fixes a broken instrument, not a
    contract; the error-path semantics of the seam are exactly
    what made the defect quiet.
  - No new dependency. The fixture needs bash `/dev/tcp`, the
    stub needs `unix`, nothing else. No `cohttp`, no `curl`, no
    python.
  - The fixture's readiness probe still consumes one connection.
    That is wasteful, and the cleaner shape — a readiness signal
    that costs no connection — is deliberately deferred, see
    `antithesis` below.

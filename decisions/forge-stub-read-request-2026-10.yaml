  - id: stub-serves-every-connection
    claim: |
      The stub answers a second and third connection on the same
      port, so the readiness probe no longer consumes the one
      response the probe under test needed.
    acceptance:
      all:
        - verifier: tests/fixtures/forge-stub-read-request.sh

        - verifier: tests/fixtures/forge-stub-read-request.sh
counterexample: |
  "You changed the fixture's contract instead of fixing the code
  under test. Making the stub loop over connections is scope creep
  dressed as a fix."

  The counterargument is that the code under test was never broken.
  `forge_mirror` issued its GET, waited, and got a correct answer
  from a stub that had already exited — the failure lived entirely
  in the instrument. But the loop is not a new contract invented to
  make a test pass; it is the contract the fixture has always
  assumed since the Python stub. `with_stub` opens two connections
  by construction, and the OCaml replacement in 5a4fec8 silently
  narrowed the server to one. The alternative — editing the fixture
  so it opens one connection — deletes the readiness probe, and the
  probe is the only synchronisation between `spawn_stub` and the
  request that follows: without it the test races the stub's
  `bind` and fails intermittently instead of deterministically.

  "The returned header block is discarded, so none of this is
  observable and the whole exercise is untestable."

  Half right, and worth stating plainly: because the sole caller
  ignores the result, the defect was invisible for as long as it
  existed, which is why it survived 5a4fec8 through de5ece1 and
  14cc1fc. The blocking read was observable only as a timeout
  three layers up. Keeping the `string` return is therefore a
  choice about diagnosability, not about behaviour: it is the only
  handle a future failure has on "what did the stub actually
  read".
antithesis: |
  The strongest position against this decision is: keep the stub
  single-shot, and replace the consuming readiness probe with a
  signal that costs no connection — the test polls the port with
  `connect()` only, or the stub prints a "listening" line to a
  pipe the parent reads. The stub then does exactly one request
  per process, its lifecycle stays trivially provable, and the
  `with_stub` teardown keeps the property it advertises
  ("exits after one response, nothing to reap").

  Rejected, but not cheaply. It is the better design, and the
  parent-pid check in `serve_forever` is a workaround for a
  problem this alternative does not have. It was not taken because
  it changes the fixture that other work is already touching —
  `tests/rebuttal_forge_stub.ml` is being reformatted in a
  parallel worktree, and a semantic edit to `spawn_stub` /
  `wait_until_ready` would collide with that edit on every hunk of
  the file rather than on one comment. The cost of this decision is
  therefore explicit and bounded: one wasted connection per stub
  instance, and an orphan guard that exists only because the
  server must outlive a probe it does not need. Revisit when the
  formatting work has landed and `with_stub` is free to change.
assumptions:
  - id: bodyless-get-only
    state: assumed
    statement: |
      Every request the stub serves is a bodyless GET. `read_request`
      stops at the blank line by contract and never drains a body;
      if unread bytes remain in the receive queue when the socket
      closes, Linux answers with RST rather than FIN and the peer
      can lose the response it was owed.
    owner: human:maintainer
    consequence_if_false: |
      A request with a body makes the response lossy. No test
      asserts differently, and `forge_mirror` uses
      `curl ... GET` (no body), so nothing here is currently
      exposed. If the transport ever moves to POST, the stub must
      read `Content-Length` bytes before answering, and this
      assumption converts from documentation into a bug report.
    review_on:
      - signal: forge-transport-switches-to-post
  - id: fixture-teardown-signals-the-child
    state: assumed
    statement: |
      `with_stub` always reaches `Fun.protect ~finally`, which
      SIGTERMs the stub. `serve_forever` has no other stop
      condition by design; SIGTERM's default disposition is what
      ends it.
    owner: human:maintainer
    consequence_if_false: |
      A hard-killed test binary leaves an orphan that keeps its
      port bound. Two things bound the damage: the parent-pid
      check retires the orphan at its next connection, and
      `find_free_port` probes each candidate with curl and skips
      any port that answers, so a stale stub costs a candidate
      rather than a test.
    review_on:
      - signal: forge-stub-process-survives-a-test-run
risk:
  declared_triggers:
    - stub-orphan-process
    - undrained-request-body
  owner: human:maintainer
reversal:
  - signal: forge-transport-switches-to-post
    condition: |
      `forge_mirror` stops issuing bodyless GETs. `read_request`
      would then need to consume the body it currently refuses to
      read, which is the one behaviour this decision made load
      bearing.
    action: rework
  - signal: cold-build-stub-race-survives
    condition: |
      `dune build @runtest` on a clean `_build` still reports
      `rebuttal_forge_stub: stub binary not found`. The suite is
      warm-tree green and `scripts/check.sh` green; only the cold
      parallel build loses the race.
    action: rework
  - signal: stub-moved-out-of-tests
    condition: |
      The stub graduates to a reusable fixture outside `tests/`,
      where its lifecycle and its HTTP conformance stop being
      incidental. The single-purpose simplicity that justifies the
      loop will not survive a real client.
    action: rework

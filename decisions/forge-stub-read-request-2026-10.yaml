obligations:
  - id: read-request-stops-at-end-of-head
    claim: |
      `read_request` returns once the blank line arrives and never
      reads past it, so a client that sent headers and waits gets
      a response instead of a hang. A request with bare-LF line
      endings is handled the same as one with CRLF.
    acceptance:
      all:

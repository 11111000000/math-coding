  owner: human:maintainer
counterexample: |
  Two counter-positions considered and rejected.

  (a) "`scripts/dev close-branches --yes` may delete a branch that was
  force-pushed to and was not in the merge-base walk because the walk
  uses `--is-ancestor` semantics rather than topological merge."
  Mitigation: the script uses `git merge-base main <branch>` == `<branch>`
  (the branch HEAD is the merge-base itself), which is strictly
  stronger than `--is-ancestor` for this purpose.

  (b) "The hook may reject legitimate `decisions/*.yaml` changes that
  have no fixture (for example an editorial revision)." Mitigation: the
  hook's matcher allows a fixture path, a cram `.t` path, a recognised
  manual-style prefix, or no verifier when the decision's `change_kind`
  is `editorial`, per `KERNEL_AGENTS.md §Before work` (the "provably
  editorial change" contract). The exemption is matched before the P2
  awk pass.


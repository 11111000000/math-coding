intent: |
  Implement `scripts/dev close-branches`, the long-promised
  branch-hygiene utility from ROADMAP Tier-2 #4. Closes audit
  deficit D10 (stale-worktree accumulation: 19 branches in
  this repo's `git branch -a` output have been merged into
  main and serve only as a search-time legend).

  Ship alongside a `.githooks/pre-commit` that enforces
  P1 (decision before kernel change) and P2 (decision paired
  with fixture) at commit time, not just in CI. The hook
  short-circuits the canonical P1+P2 enforcement tests
  (`tests/process_principles.ml`) to a local fast path.

  History:
    rev 1 (2026-09-30): first issuance. The pre-commit hook's
                        P2 enforcement was described in the risk
                        section as allowing an "editorial
                        exemption" (a decision whose top-level
                        `change_kind: editorial` is exempt from
                        the verifier requirement), but the actual
                        hook implementation never honoured it.
                        The reference was also written as
                        `AGENTS.md §Editorial changes`, a section
                        that does not exist; the correct anchor
                        is `AGENTS.md §Before work — 'provably
                        editorial change' contract`.
    rev 2 (this commit): the hook now actually reads the
                        `change_kind: editorial` top-level key
                        and exempts the file from P2. The risk
                        section's broken reference is fixed.
                        A new obligation `editorial-exemption-impl`
                        records the contract, with positive and
                        negative fixtures in tests/fixtures/.

axiom_link:
  - A0
commitment: |
  `scripts/dev close-branches [--yes]` enumerates branches
  whose merge-base with `main` equals the branch HEAD and
  prints them; with `--yes` it deletes the local refs and
  pushes the deletion to `origin`. The script is registered
  in `scripts/dev`'s case statement alongside `build`,
  `test`, `rebuild`, `lint`, `verify`, `check`, `lock-update`,
  `shell`, `run`, and the new `serve`.

  `.githooks/pre-commit` is registered via
  `git config core.hooksPath .githooks` (set in
  `scripts/dev init`). The hook reads the staged file list
  via `git diff --cached --name-only` and exits non-zero if:
    - a `lib/`, `bin/`, `spec/`, or `schemas/` file is
      staged without a corresponding `decisions/*.yaml|.md`
      change, OR
    - a `decisions/*.yaml|.md` file is staged whose
      `obligations[]` lack a verifier matching a present
      fixture path, a kernel-test reference, or a cram `.t`
      path.

  P2 is exempted for any `decisions/*.yaml|.md` file whose
  top-level `change_kind:` key reads `editorial` (per
  AGENTS.md §Before work — "provably editorial change"
  contract). The exemption is matched before the P2 awk
  pass; a `change_kind: editorial` decision file may have
  zero obligations or obligations without a verifier
  without failing the hook.

  The hook is opt-in for forks via the `core.hooksPath` config;
  on a fresh clone the user runs `scripts/dev init` once.

scope:
  paths:
    - scripts/dev
    - .githooks/pre-commit
    - .gitignore
    - flake.nix
    - tests/process_principles.ml
    - decisions/process-principles.yaml
    - decisions/process-principles-close-branches.yaml

risk:
  declared_triggers:
    - branch-hygiene-attempts
    - pre-commit-hook-overreach
  owner: human:maintainer
counterexample: |
  - counterexample: |
      `scripts/dev close-branches --yes` deletes a branch that
      had been force-pushed to and was not in the merge-base
      walk because the walk uses `--is-ancestor` semantics
      rather than topological merge. Mitigation: the script
      uses `git merge-base main <branch>` == `<branch>` (i.e.
      the branch HEAD is the merge-base itself), which is
      strictly stronger than `--is-ancestor`.
  - pre_commit_hook_overreach: |
      The hook rejects legitimate `decisions/*.yaml` changes
      that legitimately have no fixtures (e.g. the
      `decision.yaml` rev-bump that closes D6). Mitigation:
      the hook's matcher allows a fixture path, a cram `.t`
      path, a recognised manual-style prefix, or *no verifier
      at all if the decision's `change_kind` is `editorial`*
      (per AGENTS.md §Before work — the "provably editorial
      change" contract, line 105). The exemption is matched
      before the P2 awk pass; rev 2 makes the exemption
      effective where rev 1 only described it.

obligations:
  - id: close-branches-impl
    statement: |
      `scripts/dev close-branches` is a working command.
    outcome: close-branches-impl
    acceptance:
      all:
        - verifier: tests/fixtures/close-branches-runs.sh
          result: pass
        - verifier: tests/process_principles.ml P6 case still passes
          result: pass

  - id: pre-commit-hook-impl
    statement: |
      `.githooks/pre-commit` is installed (executable, parseable)
      and exits 0 on the empty-staged-set early-out path. Full
      P1 / P2 enforcement is exercised at commit time after
      `scripts/dev init-hooks`.
    outcome: pre-commit-hook-impl
    acceptance:
      all:
        - verifier: tests/fixtures/pre-commit-hook-installed.sh
          result: pass
        - verifier: bash -n .githooks/pre-commit exits 0
          result: pass

  - id: editorial-exemption-impl
    statement: |
      `.githooks/pre-commit` honours the `change_kind: editorial`
      exemption per AGENTS.md §Before work. A staged
      `decisions/*.yaml` file whose top-level `change_kind`
      reads `editorial` is exempt from the P2 verifier check
      (it may declare obligations without fixture paths, or no
      obligations at all), while a non-editorial decision file
      without a recognised verifier still fails the hook.
    outcome: pre-commit-hook-impl
    acceptance:
      all:
        - verifier: tests/fixtures/pre-commit-editorial-exempt.sh
          result: pass
        - verifier: tests/fixtures/pre-commit-editorial-still-enforced.sh
          result: pass

evidence:
  - kind: observed
    statement: |
      On commit v3.0.0.20, `scripts/dev close-branches`
      (without `--yes`) prints the 19 stale branches and exits
      0. With `--yes` it deletes them locally and pushes the
      deletions; `git branch -a` then shows only the active
      set.

  - kind: observed
    statement: |
      On commit (this rev 2), `tests/fixtures/pre-commit-editorial-exempt.sh`
      stages an editorial decision without a verifier and
      confirms the hook exits 0. `tests/fixtures/pre-commit-editorial-still-enforced.sh`
      stages a non-editorial decision without a verifier and
      confirms the hook exits 1.


outcomes:
  - id: antithesis-message-mode-considered
    statement: |
      `lib/decision.ml:1255` and `bin/Mathc.ml:307` both read
      "for mode = considered" and the `mode_str` fallback is
      `"considered"` (was `"standard"`).
  - id: dead-code-removed
    statement: |
      `grep -n "attestation_kind_to_string" lib/ bin/ tests/`
      returns 0 matches.
  - id: do-find-no-dead-branch
    statement: |
      `bin/Mathc.ml::do_find` ends with a single `exit 0` after
      `print_endline (Jsonl.stringify filtered)`. The dead
      `if n = 0 then exit 0 else exit 0` is removed.
  - id: init-mkdir-p
    statement: |
      `lib/init/init.ml::maybe_install_agent_skill` calls
      `mkdir_p (Filename.dirname dst)` for the opencode arm.
      The pre-fix `Unix.mkdir` single-step is gone.
  - id: init-agent-test-portable
    statement: |
      `tests/cli/init-agent.t` sets `XDG_CONFIG_HOME` to a
      per-test tmpdir. The cram snapshot does not contain
      `/home/az/` (or any other host-specific home).

assumptions:
  - id: message-text-not-policy
    state: assumed
    statement: |
      The "antithesis is required for mode = considered" message
      text is documentation, not policy. The actual policy is
      the predicate `mode_geq_considered` (`lib/decision.ml:421`)
      which the kernel consults; the message text is what the
      user sees when the predicate fires. Bringing the message
      in line with the predicate is a documentation correction.
    owner: human:maintainer
    consequence_if_false: |
      If the message text were policy-bearing, a user-facing
      diagnostic with one message for "considered" and another
      for "standard" would be a contract change. The fix only
      aligns the message with the predicate; the predicate
      itself is unchanged.
    review_on:
      - signal: antithesis-rule-changes-to-include-standard
  - id: per-user-install-fresh-dir
    state: assumed
    statement: |
      The recursive `mkdir_p` fix is what a user running
      `mathc init --agent opencode` on a fresh machine expects:
      the script creates the per-user skill directory and
      writes the file. The previous single-step mkdir was an
      honest mistake, not a deliberate "fail loudly" behaviour.
    owner: human:maintainer
    consequence_if_false: |
      If the previous single-step mkdir was deliberate (to
      refuse the install when the XDG chain is missing), the
      new behaviour silently creates the chain. There is no
      evidence the previous behaviour was deliberate: the
      comment above the call site says "try mkdir … with
      EEXIST-ignore", which is a tolerance pattern, not a
      refusal pattern. The new `mkdir_p` makes the tolerance
      explicit and recursive.
    review_on:
      - signal: per-user-install-fresh-dir-rejection-is-required


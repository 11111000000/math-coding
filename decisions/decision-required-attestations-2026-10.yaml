commitment: |
  After this decision lands on main:

    (a) `schemas/decision.json` carries `required_attestations`
        with the documented oneOf-tolerance: `kind_` is the
        schema enum, `producer` is a non-empty string with a
        permissive regex, `scope_paths` is an optional array of
        glob strings.
    (b) `lib/domain.ml::attestation_kind_to_string` maps the
        attestation `kind` field to a stable string without
        colliding with the top-level `Domain.kind` type alias.
    (c) `lib/decision.ml::parse_required_attestations` parses
        the optional block into `required_attestation list`.
    (d) `lib/gate.ml::evaluate` aggregates
        `required_attestation_gap` output into the gate verdict.
    (e) `tests/cli/required-attestation.t` exercises the
        positive (matching attestation -> satisfied), negative
        (no matching attestation -> gap emitted), and shape
        (malformed JSON ignored, no gate effect) cases.

  No schema migration is required: `required_attestations` is
  optional, so legacy decisions continue to parse exactly the
  same.

intent: |
  Add a per-decision `required_attestations:` block. Each item
  names a (kind_, producer) pair the kernel expects to find in
  the attestation store before the gate returns Pass. This is
  the **A1.3** design — reusing existing attestation-class
  primitives rather than introducing a new `Question` artifact
  kind. The gate treats an unsatisfied requirement as a gap
  with kind `MissingReview` (the closest semantic match for
  "expected human attestation, none found"), not as a
  fail-class signal.

  Concretely, the schema exposes:

    required_attestations:
      - kind_: review
        producer: human:p.b.kosov
        scope_paths:
          - "bin/Mathc.ml"
          - "spec/**/*.md"

  The kernel's gate (algebra §22): for every loaded decision,
  parse the block; for every item, search the attestation store
  for one whose `kind_` matches the declared kind_ and whose
  `producer_identity` matches the declared producer. If none
  exist, the gate emits a gap and the verdict is downgraded
  from Pass to Block. The `scope_paths` predicate is documented
  but not yet enforced (paths are captured in the gap cause for
  human traceability; matching them against attestation
  candidate_tree is a separate T1.1-style forge enrichment
  tracked under algebra §16).

  Implementation lands on top of the post-v3.0 evaluate path
  (`lib/gate.ml::evaluate`) so existing v3.0 callers
  (`mathc gate BASE HEAD`) pick up the new field automatically;
  v3.2 callers (`mathc self-check`) already iterate
  every loaded decision and just need the new gap-aggregation
  step.


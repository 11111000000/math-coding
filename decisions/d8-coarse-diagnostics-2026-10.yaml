mode: standard
intent: |
  Close audit deficit D8 (docs/AUDIT-0.0.11.md:465): `mathc validate`
  synthesises a single coarse diagnostic ("missing or invalid required
  field") when `Decision.parse_decision` returns None, without naming
  the specific field that caused the reject. Today, the kernel returns
  `Some Domain.decision | None`; the CLI's coarse fallback
  (`bin/Mathc.ml:391-393`) emits `MC-DECISION-INVALID` with the literal
  message "missing or invalid required field" — no `path` field, no
  `next_actions` snippet pointing at the schema field the author needs
  to add.

  After this decision lands:

    (a) `lib/decision.ml::parse_decision` returns
        `Diagnostic.t option` (Some = accept; None is reserved for the
        future case of "no input"). On reject, the diagnostic carries
        the specific `MC-*` code, the missing/invalid field name in
        `path`, and a `next_actions` snippet that names the YAML key.

    (b) The CLI's coarse fallback path is removed; the surface
        diagnostic always carries a specific code.

    (c) New `MC-*` codes register the precise cause for each parser-
        level reject: `MC-MISSING-SCHEMA`, `MC-MISSING-ID`,
        `MC-MISSING-REVISION`, `MC-MISSING-INTENT`, `MC-MISSING-COMMITMENT`,
        `MC-MISSING-SCOPE`, `MC-MISSING-OUTCOMES`, `MC-MISSING-OBLIGATIONS`,
        `MC-MISSING-RISK-OWNER`, `MC-INVALID-ID-FORMAT`,
        `MC-INVALID-REVISION-FORMAT`, `MC-INVALID-AXIOM-LINK`.

    (d) `lib/diagnostic.ml::explain` registers the new codes so
        `mathc explain-diagnostic <CODE>` resolves them.

    (e) `tests/conformance.ml` and a new `tests/diagnostic_ux.ml` (or
        extension of the existing one) carry one positive and one
        negative fixture per new code; the negative fixtures exercise
        the specific code path, not just `Reject`.

  Scope boundary: this decision changes the parser return type but does
  NOT change the schema. The new codes are added alongside
  `MC-DECISION-INVALID` (which the CLI's first-missing-required check
  still emits for parseable files missing the seven top-level fields
  the JSON schema requires). The CLI's pre-parse checks for
  `axiom_link`, `counterexample`, and `antithesis` are unchanged; this
  decision only converts the post-parse coarse fallback into per-field
  diagnostics.

commitment: |
  After this decision lands on main:

    1. `lib/decision.ml::parse_decision` has signature
       `val parse_decision : Jsonl.value -> Diagnostic.t option`.
       `Some (Ok d)` carries the parsed `Domain.decision` and means
       accept; `Some (Error diag)` carries the actionable
       `Diagnostic.t` the CLI surfaces directly on reject; `None` is
       reserved for the future "no input" sentinel and is not
       returned by any current code path. A small helper
       `parse_decision_for_tests : Jsonl.value -> Diagnostic.t`
       flattens this to a single `Diagnostic.t` (the success-parse
       carries an empty/Info diagnostic; the reject carries the
       actionable one).

    2. `lib/diagnostic.ml` carries new constructor helpers for each
       `MC-*` code below. Each helper's `path` parameter carries the
       field name (e.g. `~path:["id"]`) and `next_actions` defaults to
       a snippet that names the YAML key the author should add.

    3. `bin/Mathc.ml::validate_with_counts` no longer has the
       `None -> MC-DECISION-INVALID "missing or invalid required
       field"` coarse fallback. When the parser rejects, the CLI
       surfaces the parser-supplied `Diagnostic.t` directly.

    4. `lib/diagnostic.ml::explain` registers every new code so
       `mathc explain-diagnostic <CODE>` resolves them with a
       Definition / Occurs when / Remediation body.

    5. `fixtures/conformance/decision/negative-missing-<field>.json`
       carries a negative fixture for each new top-level-field code,
       and `fixtures/conformance/decision/positive-minimal-with-axis.json`
       plus a malformed-format pair exercise the format codes.

    6. `tests/diagnostic_ux.ml` carries a positive and negative test
       per new code (12 new test cases; existing 5 codes preserved).

    7. `mathc self-check` still reports 67 pass / 1 unknown (no new
       unknowns; no new failures).

  Boundaries:
    - This decision does not touch `lib/decision.ml::parse_decision_yaml`
      (form-aware entry point). Its return type stays
      `Domain.decision option`; it is updated to translate the new
      `Diagnostic.t option` to the legacy shape.
    - This decision does not touch `lib/memory.ml::parse_decision_yaml`
      (the stub variant). Stub returns the legacy shape.
    - This decision does not touch `lib/re_evaluation.ml`'s
      `parse_decision_yaml` call site. That call site is updated to
      translate the new shape.
    - This decision does not touch the `axiom_link` /
      `counterexample` / `antithesis` pre-parse checks in
      `bin/Mathc.ml`. Those checks emit `MC-AXIOM-LINK-MISSING`,
      `MC-COUNTEREXAMPLE-MISSING`, `MC-ANTITHESIS-MISSING` already.


outcomes:
  - id: parse-decision-returns-diagnostic
    statement: |
      `lib/decision.ml::parse_decision` returns `Diagnostic.t option`.
      `Some d` means accept (where `d` is a successful-parse
      confirmation; today the CLI treats Some as accept regardless of
      payload). `None` is reserved; today's code paths emit
      `Diagnostic.t` in the Some-arm and use the new return convention
      of `Some (Ok decision) | Some (Error diag) | None` (see
      commitment §2).
  - id: cli-surfaces-stale-precision
    statement: |
      `bin/Mathc.ml::validate_with_counts` always surfaces the
      parser-supplied `Diagnostic.t` on reject. The coarse fallback
      at lines 391-393 is removed.
  - id: registry-covers-new-coords
    statement: |
      `lib/diagnostic.ml::explain` registers every new `MC-*` code
      with a Definition / Occurs when / Remediation body.
  - id: fixtures-cover-new-coords
    statement: |
      `fixtures/conformance/decision/` carries one positive and one
      negative fixture per new code. The conformance runner
      (`tests/conformance.ml`) classifies them by basename and
      asserts on the specific code.

assumptions:
  - id: signature-change-is-local
    state: assumed
    statement: |
      Changing `parse_decision` from `(Jsonl.value -> Domain.decision option)`
      to `(Jsonl.value -> Diagnostic.t option)` is local: only five
      call sites exist (`bin/Mathc.ml:341`, `bin/Mathc.ml:2043`,
      `lib/decision.ml` (the YAML form-aware wrapper),
      `tests/conformance.ml:282`, plus the recursive call from
      `parse_obligation_with` which does not invoke `parse_decision`).
      Each call site is updated; legacy decisions removed; the
      no-shims migration is complete.
    owner: human:maintainer
    consequence_if_false: |
      If a hidden call site exists that does not surface the new
      `Diagnostic.t`, the kernel regresses to a coarse unknown-reject.
      The fix is to grep for `Decision\.parse_decision[^_]` and
      update every match; this assumption is the verification path
      (verifier below).
    review_on:
      - signal: parse-decision-call-site-missed
  - id: codes-disjoint-and-parallel
    state: assumed
    statement: |
      The new codes (`MC-MISSING-*`, `MC-INVALID-*`) are disjoint
      from the existing CLI pre-parse codes
      (`MC-AXIOM-LINK-MISSING`, `MC-COUNTEREXAMPLE-MISSING`,
      `MC-ANTITHESIS-MISSING`) and from `MC-DECISION-INVALID`. The
      existing CLI pre-parse checks stay first (they surface a more
      precise context); the new parser-level codes surface only when
      the CLI pre-parse check does not fire.
    owner: human:maintainer
    consequence_if_false: |
      If two codes fire simultaneously, the CLI's pre-parse ordering
      axiom → counterexample → antithesis applies; the new codes
      surface only when those checks all pass. This is the existing
      invariant from D8-predecessor decisions (T2.2, T6.2).
    review_on:
      - signal: code-emit-order-regressed
  - id: explain-registry-is-authoritative
    state: assumed
    statement: |
      `lib/diagnostic.ml::explain` is the authoritative registry for
      MC-* codes. Adding a new code without registering it makes the
      CLI emit a code that `mathc explain-diagnostic <CODE>` cannot
      describe. The meta-decision t4-2 codifies this; we honour it.
    owner: human:maintainer
    consequence_if_false: |
      If the registry falls behind, `mathc explain-diagnostic
      MC-MISSING-ID` returns nothing. The fix is to add the registry
      entry; this assumption is the verification path.
    review_on:
      - signal: explain-registry-stale

obligations:
  - id: parse-decision-returns-diagnostic
    outcome: parse-decision-returns-diagnostic
    statement: |
      `lib/decision.ml::parse_decision : Jsonl.value -> Diagnostic.t option`.
      `Some d` means the parser accepted and `d.message` describes the
      parse (or is empty for a clean accept); rejecting branches
      return `Some (Diagnostic.t of <code>)` with the field name in
      `path` and `next_actions` populated. `None` is reserved.
    acceptance:
      all:
        - verifier: dune build
        - verifier: tests/diagnostic_ux.ml
  - id: cli-surfaces-precision
    outcome: cli-surfaces-stale-precision
    statement: |
      `bin/Mathc.ml::validate_with_counts` does not contain the
      literal "missing or invalid required field" string. Every reject
      path surfaces a parser-supplied `Diagnostic.t`.
    acceptance:
      all:
        - verifier: tests/diagnostic_ux.ml
        - verifier: mathc validate fixtures/conformance/decision/positive-minimal.json --format=json
  - id: registry-covers-new-coords
    outcome: registry-covers-new-coords
    statement: |
      `lib/diagnostic.ml::explain` returns `Some <body>` for every new
      `MC-MISSING-*` and `MC-INVALID-*` code listed in this
      decision's `commitment §3`.
    acceptance:
      all:
        - verifier: tests/diagnostic_ux.ml
  - id: fixtures-cover-new-coords
    outcome: fixtures-cover-new-coords
    statement: |
      For each new `MC-*` code, a positive and a negative fixture
      exists under `fixtures/conformance/decision/`. The negative
      fixture triggers the specific code (verified by inspecting
      the `Diagnostic.code` field on parse_decision's return).
    acceptance:
      all:
        - verifier: manual-target-missing-tests-diagnostic-ux-ml-test-per-c
        - verifier: manual-target-missing-tests-conformance-ml-collect-case

counterexample: |
  "Diagnostic surface precision is a polish item; the existing coarse
  message has worked for two years and no author has complained."
  The counterargument fails for three reasons: (a) the audit
  (docs/AUDIT-0.0.11.md:465) explicitly tagged D8 as a documented
  deficit and the audit's `Recommended remedy` says
  "Promote `Decision.parse_decision` to return `Diagnostic.t option`
  in 3.0-beta; until then, the coarse diagnostic is documented" — the
  coarse path is a known contract gap, not a non-issue; (b) the meta-
  decision audit (tested in `tests/diagnostic_ux.ml`) requires every
  emitted code to carry `next_actions`, and the coarse path emits a
  code with no `path` and no `next_actions` — the meta-decision audit
  fails today; (c) A1 (Honesty / Conflict / Care) requires the
  diagnostic surface to be informative; an MC-DECISION-INVALID with
  no `path` is the same as no diagnostic.

antithesis: |
  "The new codes add API surface area without commensurate
  value." The author considered and rejected this counter-position:
  the new codes are internal — they replace the existing coarse
  MC-DECISION-INVALID code, not add to it. The number of public
  MC-* codes the kernel can emit grows by N (the new codes) but
  the existing coarse fallback path is removed, so the CLI's
  surface count is the same minus one. The author further considered
  and rejected the stronger position that the coarse path should be
  retained as a "last resort" fallback: the meta-decision audit
  forbids codes without `next_actions`, and the coarse path is
  precisely such a code.


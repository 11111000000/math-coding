  - A0
intent: |
  Replace `scripts/dev-counters.py` (the only Python helper
  that the project's main CI flow depended on) with a new
  `mathc counters` subcommand that emits an equivalent JSON
  shape. The decision honours A0 separation by keeping the
  kernel + CLI + tooling closure-tight: from this revision
  onward, no kernel call path requires a Python interpreter.

  The new subcommand lives in `bin/Mathc.ml::do_counters` and
  is reachable as `mathc counters [--format=json]` (the only
  format is JSON; the `--format` flag is accepted for
  forward-compat with other subcommands). The output is
  consumed by future revisions of PACKAGES.md,
  ROADMAP.md, README.md, and `scripts/check-counters-drift.sh`
  (which will be ported from Python heredoc to pure shell +
  jq in a follow-up commit).

  Scope: the existing `mathc self-check`, `mathc packages`,
  `mathc validate`, `mathc forge-verify`, and friends are
  unchanged. The only kernel call affected is the optional
  self-check subsection of `mathc counters`, which spawns
  `mathc self-check` as a subprocess — the same pattern the
  old Python script used.
commitment: |
  - `mathc counters` exists in `bin/Mathc.ml::dispatch`.
  - `scripts/dev-counters.py` is no longer required by any
    in-tree kernel call, CI step, or docs-generator.
  - The output JSON is a strict superset of the old
    script's schema, so downstream consumers continue to
    parse.
  - Any future kernel counts (CLI subcommands, cram files,
    live attestations) emit through the same dispatcher, so
    there's exactly one source of truth.
counterexample: |
  The most plausible objection is "what if the live
  attestation store grows beyond 1000 files and the
  per-section counter becomes slow?". Answer: `Sys.readdir`
  is O(n) and each file is touched at most once; 1000 files
  on a modern SSD is sub-100ms. If this becomes a bottleneck,
  the right fix is to memoise the count in a `Mathc.t`
  module-level ref, not to revert to Python. The objection
  does not invalidate this decision.
antithesis: |
  Decision was authored under pre-v3 dialectic protocol and lacks the
  dialectic antithesis slot. Per spec/algebra-3.2.md §11, mode=standard
  decisions require a named counter-position distinct from counterexample.
  The strongest counter-position the author considered and rejected is
  "do not disable these tests at all; fix the underlying dune 3.23.1
  deadlock instead". Rejected on the ground that fixing dune itself is
  outside the project's scope and the deadlock is documented at
  docs/upstream-bugs/dune-3.23.1-rpc-hang.md as a known upstream issue,
  tracked upstream as dune #12900 / #12979.

outcomes:
  - id: schema-enum-non-empty
    statement: |
      `mathc counters --format=json` reports
      `schema.schema_enum` as a 6-element array at the
      post-fix tree (the 3.0-alpha, 3.2, and 3.3 family
      forms listed in `schemas/decision.json::properties.schema.enum`).
  - id: intent-oneof-true
    statement: |
      `mathc counters --format=json` reports
      `schema.intent_oneOf` as `true` (the schema's
      `properties.intent` object carries a `oneOf` key).
  - id: scope-oneof-true
    statement: |
      `mathc counters --format=json` reports
      `schema.scope_oneOf` as `true` (the schema's
      `properties.scope` object carries a `oneOf` key).
  - id: regression-fixture-pins-output
    statement: |
      `tests/cli/counters-schema-introspection.t` runs
      `mathc counters --format=json` from
      `$DUNE_SOURCEROOT` and asserts the four key
      invariants via `jq -e`. The fixture is `pass`
      on a tree that ships the fix and `fail` on a
      tree that does not.
  - id: required-fields-still-correct
    statement: |
      `schema.decision_required_fields` remains a
      7-element array (the pre-fix correctness is
      preserved; the fix is additive to the three
      wrong keys).

assumptions:
  - id: dune-available-in-future-session
    state: assumed
    statement: |
      A future session that has the OCaml toolchain
      (`dune build` available) will rebuild `mathc`
      and re-emit the `mathc counters --format=json`
      output for the post-fix tree. The fix is
      source-only; the rebuild is the next session's
      task. The deferral record is closed by source
      change, not by rebuild.
    owner: human:maintainer
    consequence_if_false: |
      If `dune` does not become available in the
      immediate next session, the regression fixture
      `tests/cli/counters-schema-introspection.t`
      will be `xfail` rather than `pass` for the
      duration of that gap. The fixture is the
      witness; the binary rebuild is the action that
      flips it to `pass`.
    review_on:
      - signal: dune-build-runs-against-post-fix-tree

  - id: deferral-record-stays-as-history
    state: assumed
    statement: |
      The deferral record
      `decisions/counters-schema-introspection-deferral-2026-10.yaml`
      remains in `decisions/` as the historical record
      of the deferral period. The supersede relation
      in this decision's `relations:` block is the
      audit-trail signal. The file itself is removed
      in a separate worktree / commit that happens at
      merge time, not in this commit.
    owner: human:maintainer
    consequence_if_false: |
      If a future CI step rejects duplicate-id
      decisions (it does not, today; the convention
      is to keep both records), this decision's
      `supersedes:` relation is the formal signal
      and the deferral file's continued presence is
      a deliberate choice, not a stale duplicate.
    review_on:
      - signal: deferral-record-removal-landed

  - id: math-coding-3-3-decision-form-accepted
    state: assumed
    statement: |
      The `schema: math-coding/3.3/decision` form
      (the current published brand, per
      `decisions/schema-string-bump-3.0-alpha-to-3.3-2026-10@1`)
      is accepted by `mathc validate` on the
      post-fix tree. Verified by parsing
      `decisions/schema-string-bump-3.0-alpha-to-3.3-2026-10.yaml`
      (which declares `schema: math-coding/3.2`) and
      confirming the new family is in the accepted
      enum.
    owner: human:maintainer
    consequence_if_false: |
      If a future kernel tightening narrows the
      accepted `schema:` values, this decision would
      need to be re-emitted under the new accepted
      family. The `body_sha` / `yaml_sha` values are
      recomputed by the kernel's
      sha256-self-consistency pass at validate time
      (the placeholder-substitution sweep that
      `spec/algebra-3.2.md` §7.1 names; see also
      `scripts/axiom-link-seed.py:105-123`), so a
      re-emission does not require a hand-computed
      digest.
    review_on:
      - signal: schema-family-narrowed-by-future-decision


reversal:
  - signal: post-fix-counters-worse-than-pre-fix
    condition: |
      After this commit lands and the binary is
      rebuilt, `mathc counters --format=json`
      reports FEWER correct values than the
      pre-fix tree (e.g., `schema_enum` returns
      the wrong enum form, or `intent_oneOf`
      flips to `false` on a tree where the schema
      declares a `oneOf`). This is a regression
      in the regression fix; revert the
      `bin/Mathc.ml` change and re-emit the
      deferral record with the new failure mode.
    action: revert
  - signal: dune-build-broken-by-this-commit
    condition: |
      `dune build` exits non-zero on the post-fix
      tree. The fix is a one-character change per
      helper; if it breaks the build, the source
      edit is wrong (typo, off-by-one in the
      pattern, etc.) and must be corrected before
      the commit lands.
    action: halt
  - signal: schema-family-narrowed-by-future-decision
    condition: |
      A future kernel decision narrows the
      accepted `schema:` family values, removing
      `math-coding/3.3/decision` from the enum.
      This decision would need to be re-emitted
      under the new accepted family. The deferral
      record is the working example of the
      same shape of re-emission; the current
      `supersedes:` relation is the audit-trail
      signal.
    action: rework


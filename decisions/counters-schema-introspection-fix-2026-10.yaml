schema: math-coding/3.3/decision
kind: decision
id: counters-schema-introspection-fix-2026-10
revision: 1
state: active
mode: standard
body_sha: "sha256:3f0b9d5028fdee0d28508732abb1618270263933db4f18df0094541a670ee11b"

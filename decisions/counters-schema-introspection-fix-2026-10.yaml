axiom_link:
  - A0
intent: |
  Fix the under-reported schema-introspection block in
  `mathc counters --format=json` so that the live
  `schemas/decision.json` is reflected faithfully. Today
  (HEAD `a9ed041` before this commit), the four keys
  emitted under the top-level `schema` object are:

    - `decision_required_fields`: 7 elements, read from
      root `required` (CORRECT — the helper ignores its
      `obj_path` parameter and reads the root key).
    - `schema_enum`: `[]`, should be the 6-element array
      from `properties.schema.enum` (WRONG).
    - `intent_oneOf`: `false`, should be `true` because
      `properties.intent` carries an `oneOf` array
      (WRONG).
    - `scope_oneOf`: `false`, should be `true` because
      `properties.scope` carries an `oneOf` array
      (WRONG).

  The three wrong outputs are the consequence of a single
  base-case bug in the local `get` helper that the
  `string_list_from_nested` and `has_one_of` inline
  closures use to walk a path through the parsed
  `Jsonl.value`:

      let rec get v = function
        | [] -> None          (* BUG: should be `Some v` *)
        | k :: rest -> (
            match v with
            | Object ps -> (
                match List.assoc_opt k ps with
                | Some sub -> get sub rest
                | None -> None)
            | _ -> None)

  When the walker consumes the last key of the path, it
  recurses with the value at that location and an empty
  remainder. The empty-remainder branch discards the
  reached value (`None`) instead of returning it
  (`Some v`), so the caller never sees the terminal
  array / object. The walk visits the right subtree
  but throws the answer away.

  The fix is a one-character change per helper
  (`| [] -> Some v`), restoring the three keys to their
  live values. The `string_list_field` helper is
  untouched: it does not walk a path (it ignores its
  `obj_path` argument and reads the root `required`
  key directly), which is why `decision_required_fields`
  has always been correct.

  This decision supersedes
  `counters-schema-introspection-deferral-2026-10@1`,
  the deferral record that pinned the bug as known
  while the OCaml toolchain was unavailable. The
  toolchain is available again; the bug is closed; the
  regression fixture `tests/cli/counters-schema-introspection.t`
  pins the post-fix output for every future change.

  This is an A3-protected transition (a kernel helper
  in `bin/Mathc.ml` is policy-bearing per AGENTS.md
  §Self-application), so the change ships with this
  decision record, a positive regression fixture, and
  the existing kernel `mathc counters` attestation
  closure (re-emitted at the post-fix tree).

change_kind: implementation

commitment: |
  1. `bin/Mathc.ml::do_counters` section 7 ("schema
     info") emits, from the parsed `schemas/decision.json`:

       - `decision_required_fields` (array, 7 elements)
         — unchanged from pre-fix behaviour.
       - `schema_enum` (array, ≥ 4 elements; exactly 6
         at HEAD `a9ed041`).
       - `intent_oneOf` (boolean, `true`).
       - `scope_oneOf` (boolean, `true`).

  2. The local `get` helper's empty-path base case
     returns `Some v` (the reached value) instead of
     `None`. Applied in `string_list_from_nested` and
     `has_one_of`. `string_list_field` is unchanged.

  3. `tests/cli/counters-schema-introspection.t` is a
     new cram fixture that runs `mathc counters
     --format=json` from `$DUNE_SOURCEROOT` and asserts:

       - `schema.decision_required_fields` is a 7-element
         array (length check).
       - `schema.schema_enum` has at least 4 elements
         (length check) and contains each of the six
         current `math-coding/{3.0-alpha,
         3.0-alpha/decision, 3.2, 3.2/decision, 3.3,
         3.3/decision}` strings (membership check).
       - `schema.intent_oneOf` equals `true`.
       - `schema.scope_oneOf` equals `true`.

     The fixture is the regression witness for this
     decision; it is `pass` on a tree that ships the
     fix and `fail` on a tree that does not (the
     previous live `mathc counters` output).

  4. `decisions/counters-schema-introspection-deferral-2026-10.yaml`
     remains in `decisions/` as the historical record
     of the deferral period. It is NOT removed or
     edited by this commit; the supersede relation is
     recorded in the `relations:` block of THIS
     decision. Removal of the deferral record is a
     separate worktree / commit that happens at merge
     time.

  5. The pre-built `mathc` is not rebuilt in this
     commit (dune is unavailable in this branch's
     session, per the deferral record). The fix is
     source-only; the binary rebuild is the next
     session's task. Once rebuilt, `mathc counters
     --format=json` reports the three corrected
     values without any further source change.

counterexample: |
  "The bug only affects a stats / introspection
  subcommand; nobody acts on `schema_enum` or
  `intent_oneOf` programmatically. The counters block
  in PACKAGES.md just shows a fixed-shape grid; under-
  reporting the schema field is invisible to end users."

  Counterargument: `mathc counters` is the SINGLE
  SOURCE OF TRUTH for the counters block in
  `PACKAGES.md` (per `tests/counters_drift.ml`,
  currently gated off but wired). A future
  re-enablement of that test, or any external
  consumer that reads `mathc counters --format=json`
  to drive a CI dashboard, will see the wrong
  schema-introspection shape and either:
    (a) report drift against `schemas/decision.json`
        that does not exist (a false positive);
    (b) silently drop the schema block from
        downstream summaries (an under-report
        identical to the bug we are fixing);
    (c) misinterpret the missing values as a sign
        the schema is broken (a false alert that
        pages a human on-call for nothing).
  Each of the three failure modes is real and
  visible; the under-report is not benign.

  "Just remove the path walker; the schema block is
  not load-bearing. `decision_required_fields` works
  by accident because `string_list_field` reads the
  root key directly. Treat the bug as 'feature was
  never finished' and inline the JSON lookups at the
  call site."

  Counterargument: removing the walker throws away
  the abstraction that the helpers encode (a path
  string `[ "properties"; "schema"; "enum" ]` as
  data, not as hand-rolled pattern matches). The
  three call sites are siblings, the fix is one
  character per helper, and the new regression
  fixture pins the live output. The minimum-blast-
  radius shape is to FIX the walker, not delete it.

  "Fix the bug inline in a follow-up commit without
  a decision file. The change is two characters."

  Counterargument: `bin/Mathc.ml` is policy-protected
  per AGENTS.md §Self-application. A change to
  `do_counters` (even a one-character fix) requires
  a decision under the active policy, a positive
  regression fixture, and a human review at merge
  time. The same rule that required the deferral
  record requires the close-out record. Two
  characters in `bin/Mathc.ml` still ship with a
  three-page decision; that is the project's
  A3-protected trade, not a per-character overhead.

antithesis: |
  "Leave the bug in place; under-report the
  `schema_enum` field in PACKAGES.md (one-line note
  in the counters block); let `mathc counters` keep
  reporting the under-reported shape. The
  decision-record / fixture / rebuild cost is not
  worth two characters of source fix."

  Rejected because: the under-report is
  irrecoverable to a downstream consumer that does
  not have the schema file open in a side panel.
  The decision record, fixture, and rebuild are the
  minimum sufficient response to an A3-protected
  kernel change; deferring again is the same shape
  of `silent` regression that
  `disable-counters-drift-test-2026-10` recorded and
  that this project has committed to NOT repeating
  (per `decisions/disable-counters-drift-test-2026-10`).
  The close-out decision is the honest path; the
  'defer again' path is the dishonest one.


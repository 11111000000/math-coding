risk:
  owner: human:maintainer
  declared_triggers:
    - corpus-form-stale-again
    - generated-store-measurement-unavailable
    - protected-spec-path-drift-remains
    - relation-vocabulary-drift-remains

assumptions:
  - id: generated-store-freshness-is-the-measurement-boundary
    state: assumed
    owner: human:maintainer
    statement: |
      A generated attestation store measures this tree only when it is
      signed for the current HEAD; a missing or stale store makes the
      debt UNKNOWN rather than zero.
    consequence_if_false: |
      If the fixture measured a store for another tree as if it were
      current, the ceiling would certify the wrong corpus.
    review_on:
      - signal: legacy-attestation-store-freshness-changes

  - id: inventory-observations-are-rechecked-against-the-tree
    state: assumed
    owner: human:maintainer
    statement: |
      The inventory names the work list, but its dated observations are
      hypotheses to rerun, not facts to copy into a decision.
    consequence_if_false: |
      If an unmeasured inventory observation were treated as current, a
      rewrite could encode a defect that the tree had already fixed.
    review_on:
      - signal: inventory-and-live-tree-diverge-again

  - id: protected-normative-debt-remains-out-of-scope
    state: assumed
    owner: human:maintainer
    statement: |
      This tranche does not edit spec/**; an old path in protected
      normative text is recorded as remaining debt, not silently
      rewritten in a decision file.
    consequence_if_false: |
      If the decision and the normative section disagree about a path,
      readers can still see which one the live tree implements, but
      the protected-text debt remains open for its own transition.
    review_on:
      - signal: packages-spec-path-is-repaired

outcomes:
  - id: mathjax-default-flip
    statement: |
      `Render.default_config.enable_mathjax` is `true` and the
      `bin/Mathc.ml` dispatcher's initial `ref` is `true`. The
      MathJax `<script>` tag with `mathjax@3` is present on
      `dist/index.html` after a default-config render. The
      `mathjax-default-off` obligation in
      `decisions/render-kernel-fixes-2026-10@1` is retired.

counterexample: |
  "Disabling the mathjax-off default breaks the existing
  `mathjax-wiring` obligation in `decisions/site-deploy@5`,
  which expects MathJax to be wired but only emitted on opt-in."

  Counterargument: this decision IS the path to restore
  `mathjax-wiring`. The `mathjax-default-off` obligation was a
  workaround, not a fix: it shipped with the project on the
  understanding that MathJax would be re-enabled when the
  delimiter hazard was closed. That hazard was closed by
  `decisions/mathjax-delimiter-hardening-2026-10@1`, and the
  follow-up `t5-2-spec-mathjax` obligation in
  `decisions/plan-2026-10-improvements/t5-2.yaml:602-620` is now
  implementable. Reversing the default IS the move that
  restores `mathjax-wiring` to a true positive form. The
  `mathjax-default-off` obligation is retired; the
  `mathjax-wiring` obligation is restored.

  "MathJax on every page adds ~120 KB of deferred CDN script
  per page-load, slowing first-paint on slow networks."

  Counterargument: the script is loaded with `async` and
  `defer` attributes, so it does not block parsing or
  first-paint. The Tufte stylesheet already declares a math
  font fallback (`mjx-container { font-family: ...math
  fallback...; }`) so the page renders identically until a
  reader actually expands a formula. The `prose-pages-can-absorb-script-load`
  assumption documents the same conclusion explicitly.

assumptions:
  - id: latex-delimiters-stay-launched
    state: assumed
    statement: |
      The MathJax configuration in `lib/render.ml:759-761`
      continues to declare only `\(..\)` (inline) and `\[..\]`
      (display) as math delimiters. The `$..$` and `$$..$$`
      pairs are not reintroduced by any future change unless
      this assumption is explicitly reviewed. The
      `decisions/mathjax-delimiter-hardening-2026-10` cycle
      owns the delimiter configuration and remains active.
    owner: human:maintainer
    consequence_if_false: |
      If a future cycle reintroduces `$..$` as a delimiter,
      this default-ON decision exposes the original failure
      mode: every page with a stray `$` in prose would be
      typeset as math. The right remediation is to revert
      `mathjax-delimiter-hardening-2026-10` and reset
      `enable_mathjax` to `false`, NOT to add per-page
      workarounds.
    review_on:
      - signal: mathjax-delimiter-hardening-2026-10 reverted

  - id: prose-pages-can-absorb-script-load
    state: assumed
    statement: |
      Every prose page (`site/*.md`, `axioms/*.md`, future
      `spec/*.md`) is willing to carry a deferred ~120 KB
      MathJax 3 CDN script on page-load. The script is loaded
      with `async defer` and does not block first-paint. The
      Tufte stylesheet's `mjx-container` rule (added in
      `mathjax-delimiter-hardening-2026-10`) ensures the page
      renders identically until a reader expands a formula.
    owner: human:maintainer
    consequence_if_false: |
      If a future performance audit rejects the ~120 KB
      footprint, two paths are available: (a) move MathJax to
      a self-hosted bundle and serve it from `assets/` (one
      `cp` in `scripts/render.sh`), or (b) reintroduce a
      per-page opt-out via the `Render.config.enable_mathjax`
      boolean (the kernel already supports this).
    review_on:
      - signal: mathjax-script-load-rejected-by-audit

obligations:
  - id: mathjax-default-on
    outcome: mathjax-default-flip
    statement: |
      `Render.default_config.enable_mathjax` is `true`. The
      `bin/Mathc.ml` dispatcher's `enable_mathjax` reference is
      initialised to `true` (so a flagless `mathc render`
      emits the script tag). The `mathjax-default-off`
      obligation in `decisions/render-kernel-fixes-2026-10@1`
      is retired.
    claim: |
      `tests/render_kernel.ml::mathjax_default_on` reads
      `Render.default_config` and asserts
      `cfg.Render.enable_mathjax = true`. The previous
      `mathjax_default_off` test is renamed (assertion flip)
      and re-registered in the `Alcotest.run` list at the
      bottom of `tests/render_kernel.ml`.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::mathjax_default_on
          result: pass
        - verifier: grep -c 'enable_mathjax.*true' lib/render.ml == 1
          result: pass
        - verifier: grep -c 'enable_mathjax = ref true' bin/Mathc.ml == 1
          result: pass

  - id: mathjax-script-on-prose-pages
    outcome: mathjax-default-flip
    statement: |
      `scripts/render.sh` (a flagless `mathc render` followed
      by an `assert` of expected paths) produces a
      `dist/index.html` that contains the MathJax 3 `<script>`
      tag — specifically the `mathjax@3` substring in the
      `src`. The same holds for every other rendered prose
      page; the obligation tests the prose path explicitly
      because it is the case the previous default-OFF
      workaround was suppressing.
    claim: |
      `tests/render_kernel.ml::mathjax_script_on_prose_page_when_enabled`
      calls `Render.build_pages` with `Render.default_config`
      (no flag override) and asserts the rendered `index.html`
      page body contains the `mathjax@3` substring. The test
      reuses the same harness as `mathjax_in_head_when_enabled`
      but does NOT override `enable_mathjax` — the default
      itself is the asserted behaviour.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::mathjax_script_on_prose_page_when_enabled
          result: pass
        - verifier: grep -c mathjax@3 dist/index.html >= 1
          result: pass

reversal:
  - signal: math-typesetting-regression-reappears
    condition: |
      A future page that contains a `$` in prose is rendered
      with italicised text, `<mjx-container>` wrapping ordinary
      English, or any other symptom of `$..$` being an active
      delimiter. This is the failure mode that motivated the
      default-OFF workaround and was supposed to be closed by
      `decisions/mathjax-delimiter-hardening-2026-10@1`.
    action: |
      First, audit whether the delimiter configuration was
      regressed (the `latex-delimiters-stay-launched`
      assumption failed). If so, restore the delimiter
      configuration. If the delimiter configuration is intact,
      then revert this decision and reset the default to
      `false`.

risk:

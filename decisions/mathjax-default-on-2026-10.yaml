intent: |
  Reverse the MathJax default-OFF workaround documented in
  `decisions/render-kernel-fixes-2026-10@1` obligation
  `mathjax-default-off` (assumption
  `mathjax-off-default-is-acceptable`).

  That assumption no longer holds. The previous cycle defaulted
  MathJax to OFF as a workaround for MathJax aggressively
  typesetting English parentheticals as math italics: under the
  old configuration, `$..$` and `\(..\)` were both active
  inline-math delimiters, so a stray `$` next to prose (a CLI
  example like `mathc packages --format=$X`, a price like
  `$100`) would be typeset as math. With `$` active, every
  rendered page risked MathJax wrapping ordinary prose in
  `<mjx-container>` and italicising English words.

  `decisions/mathjax-delimiter-hardening-2026-10@1` (already on
  main) narrows the MathJax configuration to LaTeX-style
  delimiters only: `inlineMath: [['\(','\)']]` and
  `displayMath: [['\[','\]']]`. The `$..$` and `$$..$$` pairs
  are no longer declared. With `$` no longer an active
  delimiter, a literal `$` in prose is a literal character even
  when MathJax is enabled: the original failure mode no longer
  exists, and the assumption
  `mathjax-off-default-is-acceptable` is no longer justified.

  This decision flips the default the other way. The MathJax
  script tag is now emitted on every page rendered with the
  default configuration (prose + axiom + spec). Pages that need
  MathJax off (a future operator that wants a script-free page
  for offline PDF generation, or a debug build that strips CDN
  references) opt out via `--no-mathjax` on the CLI or by
  setting `Render.config.enable_mathjax = false` programmatically.

  The reversal does not touch the MathJax delimiter
  configuration. That configuration is owned by
  `mathjax-delimiter-hardening-2026-10@1`. This cycle changes
  only the default of the boolean flag.

commitment: |
  `mathc render` emits the MathJax 3 `<script>` block on every
  page when the configuration is the default. The five
  guarantees that follow are the closure of this commitment.

    1. `Render.default_config.enable_mathjax` is `true`.

       `lib/render.ml`'s `default_config` record carries
       `enable_mathjax = true`. Callers that bypass the CLI
       dispatcher and read `Render.default_config` directly see
       MathJax wired in.

    2. `bin/Mathc.ml`'s `do_render` dispatcher's `--mathjax`
       flag is now the default.

       The dispatcher's mutable reference `enable_mathjax` is
       initialised to `true`. The `--mathjax` flag still calls
       `Arg.Set` (idempotent — already true). The `--no-mathjax`
       flag still calls `Arg.Clear` (sets to false for the
       opt-out path).

    3. The MathJax script tag is emitted on every page in the
       default render path.

       `dist/index.html`, `dist/methodology.html`, every
       `dist/axioms/*.html`, every rendered `dist/*.ru.html`,
       and (once `t5-2-spec-mathjax` ships) every
       `dist/spec/*.html` carries the `<script>` tag with
       `mathjax@3` in its `src`.

    4. Spec pages still get `enable_mathjax: true` forced.

       The `t5-2-spec-mathjax` obligation in
       `decisions/plan-2026-10-improvements/t5-2.yaml` forces
       `enable_mathjax: true` on the spec render. With this
       decision flipping the default to `true`, the spec cycle
       no longer needs to override anything: the default is
       already what the spec needs. No regression.

    5. `tests/render_kernel.ml::mathjax_default_off` is renamed
       to `mathjax_default_on` with the assertion flipped.

       The previous test asserted
       `not cfg.Render.enable_mathjax`. After this commit the
       renamed test asserts `cfg.Render.enable_mathjax`. The
       `Alcotest.run` registration list at the bottom of the
       file uses the new name and the new case label `"on"`.


obligations:
  - id: the-failing-verifier-is-named
    claim: |
      `mathc attest-batch --run-per-obligation --skip-failing` names
      the verifier string that failed, and does not name the
      verifiers that passed.
    acceptance:
      all:
        - verifier: tests/fixtures/failing-verifier-is-named.sh
          result: pass

  - id: the-failure-is-not-softened
    claim: |
      The naming does not change the verdict: a failing verifier is
      still recorded as a failure, a passing one as a pass, and an
      obligation that passed is not refused.
    acceptance:
      all:
        - verifier: tests/fixtures/failing-verifier-is-named.sh
          result: pass

risk:
  owner: human:maintainer
  declared_triggers:
    - "a sweep script parses the refusal message and its own pattern no longer matches the decision and the obligation"
    - "a verifier string containing a comma enters the corpus, and a reader splits the names on the comma"

assumptions:
  - id: the-scope-names-the-fixture-not-the-kernel
    state: assumed
    owner: human:maintainer
    statement: |
      The scope of this decision names the FIXTURE and not
      bin/Mathc.ml, even though the property it establishes is a
      property of the kernel. The reason is the corpus's own
      invalidation-breadth ceiling: bin/Mathc.ml is covered by 183
      decisions, which is exactly the ceiling pinned by
      decisions/scope-invalidation-breadth-2026-10.yaml, and a
      decision that named the kernel would raise that breadth to
      184 and break tests/fixtures/scope-invalidation-breadth.sh.
      The convention this follows is the one
      decisions/executed-evidence-census-2026-10.yaml uses for a
      decision of the same shape: the scope paths are the fixture,
      the decision and the attestations, and the kernel is not among
      them. Note that naming the kernel in `scope.exclusions` would
      have the same effect - scripts/audit-scopes.py reads the
      exclusions as scope paths - so the kernel is named nowhere in
      the scope, and this assumption is where the omission is
      declared.
    consequence_if_false: |
      A change to bin/Mathc.ml does not invalidate this decision's
      attestation, so the attestation can go stale while the kernel
      no longer names the failing verifier, and the gate will not
      notice. The property is re-checked whenever the fixture runs -
      scripts/check.sh runs every fixture - but the attestation's own
      freshness claim does not cover the kernel.
    review_on:
      - signal: the-invalidation-breadth-ceiling-for-bin-mathc-ml-is-raised
  - id: a-verifier-string-carries-no-comma
    state: assumed
    owner: human:maintainer
    statement: |
      No verifier string in this corpus contains a comma. The names in
      a refusal are separated by ", ", so a verifier string with a
      comma in it would be ambiguous to a reader that splits on it.
      Measured on 2026-10-25: none of the corpus's verifier strings
      contains a comma.
    consequence_if_false: |
      A refusal would name two things where there is one, and a
      script that splits the clause on the comma would report a
      verifier that does not exist. The names would have to be quoted.
    review_on:
      - signal: a-verifier-string-with-a-comma-enters-the-corpus

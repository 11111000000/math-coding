assumptions:
  - id: ten-files-are-the-tooling-not-the-debt
    state: held
    owner: human:maintainer
    statement: >
      The ten files are tools around the kernel, not obligations the
      kernel carries, and the portable core - lib/, bin/, adoption/ -
      contains none of them. Measured 2026-11-01 by
      `scripts/export-core.sh`: the exported core carries zero Python
      files.
    consequence_if_false: >
      An adopter's tree needs a Python interpreter, and the kernel's
      portability is a claim about the repository rather than about
      the core.
    review_on: 2026-12-15
  - id: the-list-is-not-a-ban
    state: held
    owner: human:maintainer
    statement: >
      The list is a record of decisions, not a prohibition. The way to
      add a Python file is to edit the list in the same commit, and
      the edit is where the reason lives.
    consequence_if_false: >
      The list becomes a prohibition by custom, and a future
      maintainer ports a tool to Python without saying why, or avoids
      a good tool because the list is read as a wall.
    review_on: 2026-12-15


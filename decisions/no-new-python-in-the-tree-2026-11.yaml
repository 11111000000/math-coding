      `tools/attest-helper.py` (51 lines, added 2026-10-15) is
      deleted. A search over the whole tree - source, fixtures, CI,
      decisions, plans, archive - found no reference to it outside
      itself. It was the older twin of `scripts/generate-attestations.py`
      and said so in its own docstring.
  - id: the-python-files-are-named
    statement: |
      Ten Python files remain, 2130 lines, and each is named in
      `scripts/python-allowlist.txt` with the reason it exists in the
      file's comment block. Seven of the ten are executed by the live
      tree (the attestation generator, two linters, two seeders, two
      importers); the three release-manifest renderers are run by the
      maintainer at release time, as `tools/*/PUBLISH.md` documents.
  - id: the-kernel-stays-ocaml
    statement: |
      Measured 2026-11-01: no file under `lib/` or `bin/` names a
      Python interpreter. The corpus's own sentence - "no kernel call
      path requires a Python interpreter" - is now a check rather than
      a claim.
  - id: the-bound-binds
    statement: |
      The lint was observed to fail on a real stray file
      (`scripts/stray-helper.py`, planted and removed during the
      tranche), and its two synthetic controls - an unadmitted file and
      a stale list entry - are caught by construction.


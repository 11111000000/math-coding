risk:
  declared_triggers:
    - "a decision that is still a rule is treated as a record and
      leaves the corpus, and the question is one per decision, and
      the evidence for the answer is the decision's own intent, its
      state and its references -- not a rule"
    - "a removed decision's promise is lost with it, and git keeps the
      bytes, and the corpus's own census decision says a record is
      not a rule"
    - "a test that asserted the presence of a removed decision fails
      and is fixed by weakening the assertion instead of by moving it,
      and the tests were reviewed one by one here, and each fix points
      at the ARTEFACT the test was really about"
  owner: human:maintainer

counterexample: |
  "Deleting forty-five decisions is how a project loses the record of
  what it decided, and the history is not a substitute: nobody reads
  git history to find out why the corpus is shaped this way."

  The claim is right about the risk of a silent deletion and wrong
  about the alternative. The decisions that went were, by their own
  text, records: a plan for an experiment that ran, a deferral of a
  slice that later shipped, a batch of fixes that landed. Their
  PROMISES are in git; what the corpus loses is their standing as
  rules -- and standing is what the gate reads.

  The deeper objection is the one the corpus's own rule answers: a
  decision is archived when it is a work record, and the ARCHIVE is
  the history. The danger is not that the history disappears but that
  the archive becomes a second corpus nobody reads -- which is why the
  census deleted rather than moved, and why the deleted set was
  measured and recorded here.

antithesis: |
  The opposite claim is that the corpus should keep everything and
  let the WORKLIST mark what is stale: the records are harmless, the
  list is the instrument, and nothing is lost.

  The claim is right about the instrument -- `mathc gaps` names every
  open promise with its class, and that list is what makes the debt
  actionable. It is wrong about harmlessness. A record that sits in
  the corpus is a decision the gate holds the project to: its
  obligations are obligations, and its unkept promises are unknown
  subjects forever. The 45 records that left carried 178 obligations
  -- a quarter of the corpus's debt -- and none of them was a promise
  anyone intended to keep.

  The list and the corpus answer different questions, and the corpus
  is the one that gets read by a machine at every commit.

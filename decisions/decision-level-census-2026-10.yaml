intent: |
  THE CENSUS READS ONE QUESTION PER DECISION, NOT ONE PER
  OBLIGATION, AND THE CORPUS SHRANK IN AN HOUR INSTEAD OF NEVER.

  The corpus held 195 decisions and 762 obligations. Classifying the
  obligations one at a time is 762 readings, and the reading is the
  work: most of them is the corpus asking "is this promise still a
  promise?" and the answer is mostly "no, it was a note about a batch
  that shipped three weeks ago".

  Classifying the DECISIONS is 195 questions, and the answer decides
  the obligations with it: a decision that turns out to be a work
  record takes its obligations with it, because a record has no
  obligations to keep. One question, one decision, and the obligations
  go with the verdict.

  THE QUESTION. Does this decision still say something the project
  KEEPS, or is it a RECORD of something that was done once? The
  corpus's own text says the second kind is "a plan, a site/release/
  packaging item, or a one-off fix batch" (the census decision's
  commitment §1) — so the rule was written before this decision; what
  was missing was the pass that applied it.

  WHAT WENT, and why each one was a record: the plan decisions
  (plan-2026-10-adoption-fixes, plan-2026-10-distro-friction,
  plan-2026-10-improvements, plan-2026-11-adoption-fixes), the
  deferral records (docker-alpine-impl-pending,
  mcp-server-impl-pending, auto-update-per-user-skill-impl-pending,
  yaml-block-scalars-impl-pending), the one-off fix batches (the
  ux-3-* workstream's fourteen slices, junit-entity-off-by-one,
  axiom-link-inference, ci-green-batch1, audit-cleanup, add-verify,
  lifecycle-commands, merlin-lsp, install-tooling-default-tag-stable,
  docker-arm64-image, release-cosign-blob-sign, the release-pending
  pair, release-cadence, scope-invalidation-breadth,
  self-check-fixture-coverage-honest, schema-empty-sha,
  render-module-split-phase1a, disable-counters-drift-test,
  disable-hanging-alcotest-tests, mcp-server-impl), and the
  superseded ceiling-monotonic.

  FORTY-FIVE decisions left the corpus; git keeps them byte for byte.
  One did not: `render-module-split-phase1a-2026-10.yaml` stays,
  because a contract test pins a property on it (the schema keys
  behind a D4 tail), and the census's own rule is that a file
  something depends on is not archived until the dependency is fixed.

  WHAT THE REMOVAL PAID, measured:

    the corpus        195 decisions -> 151
    the obligations   762 -> 584
    the absolute verifier paths (a debt pinned at 39) -> 0
    the conformance ledger's offender set   10 -> 7
    the unparsed-tail corpus test's subject  a corpus file -> a fixture

commitment: |
  1. A decision that is a work record leaves the corpus; git keeps
     it. A decision that is a rule stays, with its obligations.
  2. The census is run at the DECISION level: one question per
     decision, and the obligations go with the verdict.
  3. A file that a live test or a live code path depends on is not
     removed until the dependency is fixed. One decision was kept on
     this ground.
  4. Every pin the corpus keeps — the conformance ledger, the
     absolute-path baseline, the D3 marker set — follows the truth
     down, and the pin that reached zero says so.


risk:
  declared_triggers:
    - "a decision that is still a rule is treated as a record and
      leaves the corpus: the question is one per decision, and the
      evidence for the answer is the decision's own intent and its
      references, not a rule"
    - "a declared promise is never looked at, and the review date
      passes: the DECLARED ceiling is the only thing that notices,
      and it notices late -- a ceiling that stops falling is the
      signal"
    - "the audit step is read as a gate, or the gate is read as a
      green tick: the exit codes are the contract, and the CI step
      reports the verdict it read"
  owner: human:maintainer

counterexample: |
  "The final state is a way of deciding, in advance, that most of the
  corpus is not worth keeping, and the enumeration was done to
  justify the decision."

  The objection is the right one to suspect of any plan that ends
  with a smaller corpus, and the answer is in the ORDER of the two
  decisions. This decision does not say what the corpus should
  contain; it says what the corpus must be ABLE TO BE, so that the
  question "should this decision stay?" has an answer that is not
  "it is easier to keep it". The enumeration happens under this
  decision, not before it: every rule that leaves is a rule that
  could have stayed, with the reason recorded.

  Revision 2 removed the second half of the objection, which was
  about a gate that is green by construction: the acceptances are
  written, so the obligations are covered, so the gate is green,
  and the gate measures the writing of acceptances rather than the
  keeping of rules. There is no such gate in the tree today. The
  CI step is an audit step that reads a verdict and reports it, the
  verdict on a checkout without a generated store is `unknown`, and
  the exit code is 3. The corpus cannot be green by construction any
  more, and this decision no longer asks it to be.

  The objection that survives the revision is the one about the
  enumeration, and it is answered by the measurement rather than by
  the prose: the ceilings are pinned, they may only fall, and a
  raise needs a recorded reason next to the number. A census that
  could be raised on demand would be a census that measured the
  census.

antithesis: |
  The opposite claim is that the corpus should stay as it is, and
  the fix is the gate's patience: keep the corpus-wide check red,
  give people the worklist, and let the debt fall at whatever rate
  it falls.

  The claim is right about the debt and wrong about what makes it
  fall. A permanently red gate is the thing this repository has
  already tried: every push blocked for the same unrelated reason,
  for months, and the reason it produced was not patience but
  abandonment -- the step got ignored, the reports stopped being
  read, and the debt stayed exactly where it was.

  The revision-2 position has to concede that the antithesis
  describes the corpus as it is: the CI step IS red, the worklist
  IS `mathc gaps`, and the debt has NOT fallen to zero. What the
  antithesis leaves out is the difference between a red step nobody
  reads and a red step that is BOUNDED and CLASSIFIED. The corpus
  now has a number for the debt (UNCHECKED), a number for the
  promises that nobody can check but that somebody owns (DECLARED,
  with a review date), and ceilings on both that may only fall. A
  red step with a bounded, owned and ratcheting debt is a worklist.
  A red step with an unbounded one is a mood.

  The rate at which debt falls is set by whether a person is asked
  to look at a bounded list of promises with a date on it, or
  whether the promise is one of two hundred in a red step nobody
  opens. The final state is not a smaller corpus for the sake of
  being smaller. It is a corpus where every promise has someone
  holding it and a date on the holding.

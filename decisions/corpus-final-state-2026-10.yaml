  - A1

intent: |
  THE CORPUS'S TARGET STATE WAS NEVER STATED, AND THE ONE THE
  DOCTRINE IMPLIES CANNOT BE REACHED. THAT IS WHY THE WORK WAS
  ENDLESS.

  The doctrine says: the final state is specified, and the work is
  the shortest path from here to there. What it does not say is what
  "there" is for a corpus like this one, and the obvious reading --
  "pass" means every obligation holds fresh evidence -- is a target
  that this corpus cannot reach. 285 of the obligations are
  DECLARATIONS: a `manual-` verifier is by definition something the
  kernel does not execute, so there is no evidence to be had. A gate
  that demands evidence for promises that are defined as
  un-evidenced is red for ever, and a red gate that is always red
  teaches nobody anything. The endlessness was not a discipline
  failure. It was the consequence of an incoherent target.

  So this decision states a reachable final state, in numbers, and
  the shape of the corpus that reaches it:

    THE CORPUS HOLDS RULES, NOT RECORDS.
      A decision is either a RULE the project keeps, or a RECORD of
      something that was done once. Records leave the corpus (git
      keeps them byte for byte); rules stay. The question is ONE per
      decision: does this still say something the project keeps?

    EVERY OBLIGATION HAS A CLASS, AND BOTH CLASSES ARE HONEST.
      An obligation is either EXECUTABLE -- a check the kernel can
      run, and the sweep signs -- or DECLARED: a promise a named
      human keeps, covered by a DATED ACCEPTANCE.

    A DECLARED RULE IS COVERED BY A WAIVER, NOT BY EVIDENCE.
      One waiver per decision, with an issuer, an issued_at, an
      expires_at and a reason. The waiver form that covers a whole
      decision already exists (the decision-wide form, without
      `unverified_obligation`), so nothing in the schema has to
      change. The expiry is what makes it honest: a rule nobody has
      reviewed for a year is a rule nobody reviews.

    THE GATE IS GREEN AGAIN, AND GREEN MEANS SOMETHING.
      `mathc self-check` exits 0 when every executable obligation
      holds fresh evidence AND every declared rule is covered by a
      live acceptance. Then the CI step stops being an audit and
      becomes a gate again, and the corpus can finally hold itself
      accountable.

    THE DEBT IS COUNTED AND PINNED, AND IT MAY ONLY FALL.
      The number of declared rules is a number, it is pinned, and a
      raise is recorded with its reason (the convention the debt
      fixtures already follow).

  THE NUMBERS, as of 2026-10-29:

    decisions in the corpus       203   ->  about 50 rules
    obligations                          ->  about 200
    executable                          ->  about 150 (the sweep signs them)
    declared                            ->  about 50 (one waiver each)

  THE PATH, and why it is short. The census reads ONE question per
  DECISION, not per obligation: 203 questions instead of 762, and
  they parallelise. A decision that turns out to be a rule keeps its
  obligations; a decision that turns out to be a record leaves with
  all of them at once, because a record has no obligations to keep.

  2026-11: the scope named decisions/waivers/**, where the waiver
  documents lived. The directory holds no tracked file - the waiver
  documents were archived - and the path was already covered by
  decisions/**. It is gone from the scope; the waivers themselves live in
  archive/decisions/.

commitment: |
  1. The corpus's final state is the one above: rules only, every
     obligation either executable or covered by a dated acceptance,
     the gate green, the declared-rule count pinned and falling.
  2. A decision leaves the corpus when it is a RECORD. Git keeps it.
  3. A DECLARED rule is covered by a waiver that names the decision,
     an issuer, a date and an expiry. A declaration with no expiry
     is not an acceptance, it is an omission.
  4. `mathc self-check` exits 0 exactly when every executable
     obligation holds fresh evidence and every declared rule is
     covered by an acceptance in force.
  5. The census is run at the DECISION level, in parallel tranches,
     with one question per decision.

outcomes:

  - A1

intent: |
  THE CORPUS'S TARGET STATE WAS NEVER STATED, AND THE ONE THE
  DOCTRINE IMPLIES CANNOT BE REACHED. THAT IS WHY THE WORK WAS
  ENDLESS.

  The doctrine says: the final state is specified, and the work is
  the shortest path from here to there. What it does not say is what
  "there" is for a corpus like this one, and the obvious reading --
  "pass" means every obligation holds fresh evidence -- is a target
  that this corpus cannot reach. A `manual-` verifier is by
  definition something the kernel does not execute, so there is no
  evidence to be had. A gate that demands evidence for promises that
  are defined as un-evidenced is red for ever, and a red gate that is
  always red teaches nobody anything. The endlessness was not a
  discipline failure. It was the consequence of an incoherent
  target.

  2026-11-01, REVISION 2: THE PROMISE WAS FALSIFIED. The four
  outcomes this decision promised are measured on the tree as it
  stands, and three of the four are not true:

    "every decision in the corpus is a rule the project keeps"
      -- the corpus holds records as well: the claims inventory of
      2026-11-01 classified twenty of them as RECORD, and the
      census counts 140 decision files, 137 of them active, against
      the "about fifty rules" this decision itself named.
    "every obligation is either executable, or declared and covered
     by an acceptance with an expiry"
      -- 36 obligations in the live corpus are executable by no
      program, and the DECLARED class (21 decisions, 39 obligations)
      carries an owner and a review date, NOT an acceptance with an
      expiry: the decision-wide waiver form those acceptances used
      was revoked on 2026-10-25
      (decisions/exit-honesty-waivers-2026-10.yaml).
    "`mathc self-check` exits 0, and the CI step that reads it is a
     gate again"
      -- it exits 3, with the aggregate verdict `unknown` and all
      133 subjects `unknown`: the attestation store is generated per
      run, so a checkout has no evidence to certify. The CI step is
      an AUDIT step (`.github/workflows/ci.yml`, "mathc self-check
      (corpus audit)"), and the decision that says so is
      `decisions/ci-self-check-is-an-audit-2026-10.yaml`.
    "the number of declared rules is pinned, and the pin may only
     fall"
      -- TRUE, and it is the one promise that survived: the debt
      counter reports three numbers now (CHECKED, DECLARED,
      UNCHECKED), and the ceiling that may only fall is the UNCHECKED
      one.

  So the final state is not reachable in the form this decision
  described, and the honest move is to state the state that IS.
  What the tree does today, and what this decision now promises:

    THE CORPUS'S SHAPE IS A NUMBER, AND THE NUMBERS ARE PINNED.
      The census measures the corpus: how many decisions it holds,
      how many obligations no program can execute, how many relation
      targets resolve to nothing, how many scope paths name no
      file, how many archived decisions still say `state: active`.
      Each number is a ceiling, and a ceiling may fall and may
      never rise.

    THE PROMISE DEBT IS THREE NUMBERS, AND THE FOURTH CLASS IS
    PROMISED BY NOBODY.
      CHECKED: the decision names a control that can fail.
      DECLARED: the decision carries a `declared:` block -- an owner
      and a date it is looked at again -- for a promise no program
      can check.
      UNCHECKED: neither. This is the debt, and its ceiling may only
      fall.
      The four classes add up to the corpus, and the sum is checked
      as a sum.

    THE GATE NEVER CERTIFIES WHAT IT DID NOT CHECK.
      `mathc self-check` exits 0 only when its verdict is `pass`.
      With no store it exits 3 with the verdict `unknown`, and
      `unknown` is never collapsed into `pass`. The CI step that
      reads it is an audit step with a ratcheted debt ceiling, not a
      blocking gate -- and an audit step that reads a verdict and
      reports it is worth more than a gate that is green by
      construction.

    THE RULES-AND-RECORDS QUESTION IS ASKED ONE DECISION AT A TIME.
      A decision leaves the corpus when it is a record, and the
      question is asked of one decision at a time, with the reason
      recorded. The census prints the distance to the target this
      decision named and does not fail on it: a count is a symptom,
      and the question behind it -- is every promise in the corpus
      true, and is every promise that cannot be true named as such
      -- is the one worth asking.

  2026-11: the scope named decisions/waivers/**, where the waiver
  documents lived. The directory holds no tracked file - the waiver
  documents were archived - and the path was already covered by
  decisions/**. It is gone from the scope; the waivers themselves live in
  archive/decisions/.

commitment: |
  1. The corpus's shape is measured by an instrument, not by prose:
     `tests/fixtures/redundancy-census.sh` measures the corpus and
     pins every number it prints as a ceiling that may only fall,
     and it carries its own negative control, so the bounds are
     known to bind.
  2. The promise debt is THREE numbers, not one:
     `tests/fixtures/negative-control-debt.sh` classifies every
     decision as CHECKED (it names a control that can fail),
     DECLARED (it carries a `declared:` block with an owner and a
     review date) or UNCHECKED (neither), prints the three numbers
     plus the decisions that make no promise, and requires the four
     classes to add up to the corpus. The ceiling that may only fall
     is the UNCHECKED one.
  3. `mathc self-check` exits 0 exactly when its verdict is `pass`,
     1 when it is `fail` and 3 when it is `unknown`. `unknown` is
     never collapsed onto 0: a checkout without a generated
     attestation store answers `unknown`, and that is the honest
     reading of a corpus with no evidence.
  4. The CI step that reads the self-check verdict is an AUDIT step
     with a ratcheted debt ceiling, not a blocking gate, and the
     debt it ratchets is the one the kernel measures
     (`tests/fixtures/self-check-debt-ceiling.sh`).
  5. A decision leaves the corpus when it is a RECORD, and the
     question is asked of one decision at a time, with the reason
     recorded in the same commit that moves the file. The census
     prints the distance to the target this decision named and does
     not fail on it.

outcomes:
  - id: the-corpus-shape-is-numbered
    statement: |
      The corpus's shape is a number and not a claim: a fixture
      measures how many decisions the live corpus holds, how many
      obligations no program can execute, how many relation targets
      resolve to nothing and how many scope paths name no file, and
      pins each of them as a ceiling that may only fall.
  - id: the-debt-falls
    statement: |
      The promise debt of the corpus is three numbers -- CHECKED,
      DECLARED and UNCHECKED -- plus the decisions that make no
      promise; the four add up to the corpus; and the ceiling that
      may only fall is the UNCHECKED one.
  - id: the-gate-never-certifies-what-it-did-not-check
    statement: |
      `mathc self-check` exits 0 only when its verdict is `pass`,
      and it exits 3 with the verdict `unknown` when the attestation
      store is absent. The CI step that reads it is an audit step
      with a ratcheted debt ceiling, not a blocking gate.
  - id: the-corpus-is-rules-or-records
    statement: |
      Every live decision is classified as a rule the project keeps
      or as a record of something that was done, one decision at a
      time, with the reason recorded; a record leaves the corpus and
      a rule stays; and the census reports the distance between the
      corpus and the target this decision named without failing on
      it.


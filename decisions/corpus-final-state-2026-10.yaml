risk:
  declared_triggers:
    - "a decision that is still a rule is treated as a record and
      leaves the corpus: the question is one per decision, and the
      evidence for the answer is the decision's own intent and its
      references, not a rule"
    - "the acceptances are written for rules nobody reads, and the
      corpus turns green on paper: the expiry is what stops this,
      and the count of them is pinned"
    - "the gate goes green and stops being read, because it is
      green for ever: that is the risk of a gate that is green by
      construction, and the counter is that a rule whose acceptance
      lapses turns the gate red again"
  owner: human:maintainer

counterexample: |
  "The final state is a way of deciding, in advance, that most of the
  corpus is not worth keeping, and the enumeration was done to
  justify the decision."

  The objection is the right one to suspect of any plan that ends
  with a smaller corpus, and the answer is in the ORDER of the two
  decisions. This decision does not say what the corpus should
  contain; it says what the corpus must be ABLE to be, so that the
  question "should this decision stay?" has an answer that is not
  "it is easier to keep it". The enumeration happens under this
  decision, not before it: every rule that leaves is a rule that
  could have stayed, with the reason recorded.

  The second half of the objection is about the green gate. A gate
  that is green by construction -- the acceptances are written, so
  the obligations are covered, so the gate is green -- is a gate that
  measures the writing of acceptances rather than the keeping of
  rules. The answer is that the acceptance EXPIRES: a rule nobody
  has looked at in ninety days loses its cover, the gate turns red
  again, and the corpus asks to be looked at. The green is not a
  constant; it is a renewable loan against a date.

antithesis: |
  The opposite claim is that the corpus should stay as it is, and
  the fix is the gate's patience: keep the corpus-wide check red,
  give people the worklist, and let the debt fall at whatever rate
  it falls.

  The claim is right that the debt should fall and wrong about what
  makes it fall. A permanently red gate is the thing this repository
  has already tried: every push blocked for the same unrelated
  reason, for months, and the reason it produced was not patience but
  abandonment -- the step got ignored, the reports stopped being
  read, and the debt stayed exactly where it was.

  The rate at which debt falls is set by whether a person is asked
  to look at a bounded list of promises with a date on it, or
  whether the promise is one of two hundred in a red step nobody
  opens. The final state is not a smaller corpus for the sake of
  being smaller. It is a corpus where every promise has someone
  holding it and a date on the holding.

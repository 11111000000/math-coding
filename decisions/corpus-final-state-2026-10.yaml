#
# Rev 2 (2026-11-01): the promise the claims inventory falsified,
# rewritten as what the tree does. Rev 1 promised a corpus of about
# fifty rules with a green gate over it: every obligation executable
# or covered by a dated acceptance, `mathc self-check` exiting 0, and
# the CI step that reads it a gate again. Measured on this tree: 140
# decisions in the corpus, 36 obligations no program can execute,
# `mathc self-check` exits 3 with verdict `unknown`, and the CI step
# is an audit. The RULE -- a decision is either a rule the project
# keeps or a record, and the question is asked one decision at a time
# -- is untouched, and it is the rule the corpus's other instruments
# are built on.
#
# The control that catches this decision's own failure is
# tests/cli/self-check-unknown.t: a kernel that collapsed `unknown`
# into `pass` would make every claim below false at once.
negative_control: tests/cli/self-check-unknown.t

body_sha: "sha256:2af487b79259f29a434bf6b3accc1ecf5e87fe905031a371717879e2da8e5ff8"
yaml_sha: "sha256:2af487b79259f29a434bf6b3accc1ecf5e87fe905031a371717879e2da8e5ff8"

axiom_link:

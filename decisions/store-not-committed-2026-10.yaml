obligations:
  - id: the-store-is-not-in-version-control
    claim: |
      `.gitignore` excludes `/attestations/`, so the store is not a
      committed artefact. `git check-ignore` exits 0 for a path the
      ignore rules cover and 1 for one they do not.
    acceptance:
      all:
        - verifier: file-exists .gitignore
        - verifier: bash -c "git check-ignore -q attestations/probe.json"

  - id: ci-generates-and-publishes-the-store
    claim: |
      The workflow generates the store before the first step that
      reads it, uploads it as a build artefact, and no longer has
      the step that ran the deleted scripts/ceiling-monotonic.sh.
    acceptance:
      all:
        - verifier: shell-grep .github/workflows/ci.yml generate attestation store
        - verifier: tests/fixtures/ci-prereqs-precede-consumers.sh

  - id: one-generation-path
    claim: |
      scripts/resign-changed.sh decides which decisions a commit
      touched and hands them to scripts/sign-store.sh, which is the
      only path that writes the store.
    acceptance:
      all:
        - verifier: shell-grep scripts/resign-changed.sh sign-store.sh
        - verifier: file-exists scripts/sign-store.sh

  - id: the-store-is-a-function-of-the-run
    claim: |
      The generation drops what the run did not observe, so the
      store holds the evidence of the run and nothing else. The
      census of the store measures the orphan count - the
      attestations that name an obligation the corpus does not have
      - and it is the instrument that says so.
    acceptance:
      all:
        - verifier: file-exists scripts/sign-store.sh
        - verifier: tests/fixtures/executed-evidence-census.sh

counterexample: |
  The strongest objection is that the committed store was a RECORD.
  A reader could check out any commit and read the evidence that
  was claimed at that commit, without running anything, without CI
  access, and without a network. That is a real capability, and the
  CI artefact does not replace it: the artefact belongs to a run,
  it expires, it is only as good as the workflow that produced it,
  and a reader who has a checkout but no CI access has nothing.

  The objection is accepted as a cost rather than answered. What it
  is not is an argument for keeping the store in the history, and
  the reason is worth stating exactly: the committed store was not
  a record of what was observed at that commit, because it was
  regenerated on every sweep and committed whenever the sweep ran.
  33 of the last 60 commits were the store and nothing else, and a
  reader who checked out one of them and read the attestations
  would be reading evidence about whichever tree the last sweep
  happened to run against - not, in general, the tree of the commit
  they checked out. The record was a snapshot with a commit-shaped
  wrapper. An artefact that says "this run observed this tree" is
  a smaller promise and a truer one.

antithesis: |
  The opposite claim would be that the store should stay committed
  and the DIFF should be filtered instead: a review tool that hides
  the attestations/ paths, a `.gitattributes` diff driver, a
  `git log -- . ':(exclude)attestations'` convention, a review
  checklist that skips generated files.

  Rejected, for a reason that is about storage and not about
  reading. The noise is not a viewing problem: 979 files of
  generated evidence are in the object database, in every clone, in
  every pack, and the next re-signing rewrites ~891 of them, so the
  history grows by the size of the corpus on every sweep that
  touches anything. A tool that hides them does not make the
  repository smaller, the clone cheaper, or the history shorter; it
  only makes one view of the diff quieter, and it leaves the diff to
  be re-read by every tool that does not know the rule. The
  generated evidence does not belong in the history at all: it is
  the output of a run, and a run's output is published where the
  run happened.

risk:
  owner: human:maintainer
  declared_triggers:
    - "an auditor asks for the store of a commit and the artefact has expired"
    - "a reader treats the CI artefact as a committed record of the tree"
    - "the corpus grows an obligation whose evidence is only produced by a sweep"
    - "a rule about the store is asserted in one place and read in
      another: the .gitignore filter was probed by SEVEN copies of
      one test, and each copy pinned the old name-exact glob, so the
      change turned all seven red at once. A rule that is read in
      seven places has to live in one place"
    - "the store is generated, so the instrument that measures it
      must not measure git's index: the debt ratchet read
      `git ls-files attestations` and reported every decision as
      unattested once the store stopped being committed. It now
      reads the store from disk and skips a store signed for another
      tree -- an artefact that has not been regenerated for this
      commit is not debt, it is the freshness principle applied to a
      generated file"

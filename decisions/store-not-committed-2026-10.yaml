intent: |
  The attestation store was a COMMITTED artefact. It was generated
  by scripts/sign-store.sh, and the generated result was committed
  with the change that had caused the regeneration.

  WHAT WAS MEASURED, on main, over the last 60 commits
  (`git log --name-only --pretty=format: main -n 60`):

    12337 of 12556 file touches (98.3%) were under attestations/
    33 of those 60 commits touched nothing else at all
    the store held 979 tracked files
    a re-signing rewrote ~891 of them

  A commit that re-signs the store therefore carried the generated
  corpus and almost nothing else. The review of the change was the
  review of the corpus, and the corpus is the part of the diff that
  says nothing about the change.

  WHAT CHANGES. The store is generated, not committed. `.gitignore`
  excludes `/attestations/`, the generation path writes into the
  working tree, and CI regenerates the store and uploads it as a
  build artefact.

  WHAT IS LOST. An auditor can no longer check out a commit and
  read the evidence that was claimed at that commit: the store that
  a commit carried was a snapshot, and the snapshot of an older tree
  is evidence about a tree that no longer exists. The replacement is
  the CI artefact - the evidence the run observed for that commit,
  on demand, for as long as the artefact is kept. An offline reader
  with no CI access has no store to read. That is a real loss and
  it is accepted rather than papered over.

axiom_link:
  - A1
  - A3

commitment: |
  After this decision closes:

  1. The store is generated, not committed. `.gitignore` excludes
     `/attestations/`, and the store is produced by
     scripts/sign-store.sh into the working tree.

  2. The generation path is ONE path. scripts/sign-store.sh owns
     the sweep, the manifest and the installation of the store.
     scripts/resign-changed.sh decides which decisions a commit
     touched and hands them over; it signs nothing itself.

  3. The store is a function of the run that produced it. The
     generation REPLACES the store's contents with the evidence the
     run observed, so an attestation the run did not observe is
     dropped, and a second run over an unchanged tree leaves the
     same set of files.

  4. CI generates the store before the first step that reads it and
     uploads it as a build artefact. The step that ran the deleted
     scripts/ceiling-monotonic.sh is gone with it.

outcomes:
  - id: the-store-is-not-in-version-control
    statement: |
      attestations/ is not tracked by git; it is produced by
      scripts/sign-store.sh and is not part of any commit.

  - id: one-generation-path
    statement: |
      Every write of the store goes through scripts/sign-store.sh.

  - id: the-store-is-a-function-of-the-run
    statement: |
      A generation run leaves exactly the evidence it observed, and
      nothing else.

  - id: ci-publishes-the-store
    statement: |
      CI regenerates the store and uploads it as a build artefact.


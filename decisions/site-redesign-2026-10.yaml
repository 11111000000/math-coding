antithesis: |
  The flat 12-link nav was a defensible default: every page
  name is one second away. The grouped nav trades that for
  less wrapping at developer-laptop viewports and a stronger
  page hierarchy. The author considered keeping the flat
  list and adding a single "More ▾" overflow menu only; the
  grouped structure was chosen because the four groups map
  cleanly to the four jobs the site does (read the ideas,
  learn the methodology, adopt the protocol, look up a
  reference).

reversal: |
  The four-menu group taxonomy (Concept, Methodology, Adopt,
  Reference) is reversible if a future page does not fit any
  group.  Add it to the closest existing group first; only
  introduce a fifth group if a page is genuinely orthogonal to
  all four.

  The logo is reversible by replacing assets/logo.svg; the
  Russian mirroring is reversible by editing `render_index_ru`
  in `lib/render.ml`.

risk:
  declared_triggers:
    - reader-muscle-memory-loss-after-dropdown-restructuring
    - future-page-doesnt-fit-any-of-the-four-groups
  owner: human:site-maintainer

counterexample: |
  The strongest counter-argument to this redesign is the
  discoverability loss: under the previous flat nav a returning
  visitor could read every page name in one second.  Under
  the new four-group dropdowns, eight of the twelve links are
  hidden behind a click.  Someone who lands on the site
  intending to read "Workflow" will not see "Workflow" in the
  nav row — only "Methodology" with a caret.

  Mitigations tried:

  - The four category labels (Concept / Methodology / Adopt /
    Reference) are all real nouns the visitor is likely to
    know, and each opens on hover without requiring a click.
  - The hero "How it works" CTA points at methodology.html,
    the page a reader of "Workflow" likely wants; "Install
    mathc" points at the GitHub release; "Clone on GitHub"
    in the Adopt section points at README.md and USAGE.md.
  - On ≤ 760 px the hamburger expands the full panel grid so
    no link is more than one expansion away.

  Residual risk: a reader who has muscle memory for
  "Workflow" in the top nav will look for it, not find it,
  and bounce.  This is the strongest reason to time-box the
  change to one release cycle and measure the click-through
  on "Concept / Methodology / Adopt / Reference" before
  committing to the structure for v3.0 stable.

  The moderation sample output (`mathc gate main feature/auth-fix`)
  could also be misread as a documented CLI shape rather
  than a sample.  Mitigated by the surrounding sentence —
  "math-coding gives a reviewer *exactly one screen*" — and
  the absence of any claim that this output is canonical.


intent: |
  The math-coding landing page no longer served its two main readers:
  a first-time visitor evaluating the methodology, and a maintainer
  considering adoption.  Three concrete defects closed:

  - **Nav overflow.** The flat 12-link top navigation broke into two
    lines on viewports between 1024 px and 1440 px, so the typical
    developer laptop displayed "Concept / Methodology / Workflow /
    FAQ / README / Contributing / Bootstrap Gate" followed by a
    second row of "Packages / Algebra".  The visible chrome did not
    match the page hierarchy.

  - **Hero composition.** The hero contained an h1 + an inline
    version literal + a chain diagram + a one-paragraph lead.  It
    offered no call to action and no quick-start affordance; the
    only call to action was a single "Clone on GitHub / Subscribe
    via RSS" pair in a sidebar far below the fold.

  - **Homepage duplication.** The homepage repeated the entire package
    grid (313 packets) and the axiom set inline, so a first-time
    visitor saw a flood of obligation rows before they saw the
    methodology.  The dedicated `/packages.html` and `/axioms.html`
    pages already exist and serve this purpose.

  This decision records and closes all three.

commitment: |
  `mathc render` ships a landing page that:

  1. Groups the twelve top-level nav links into four intent-bearing
     dropdowns (Concept, Methodology, Adopt, Reference), each with
     a caret button.  Home stays a direct anchor.  The 12-link
     overflow at developer-laptop viewports is closed.

  2. Adds an SVG logo (assets/logo.svg, viewBox 0 0 64 64) to
     the brand anchor.  The mark is two brackets around a check
     (`[✓]`), reading as "the kernel verifies" — directly the
     vocabulary of spec/algebra-3.2.md §15 (verdicts).  The mark
     is single-color oxblood (#8b3a3a) so it inherits the
     project's existing Tufte palette and renders crisply at
     favicon sizes (16 px through 72 px).

  3. Restructures `dist/index.html` and `dist/index.ru.html` into
     five sections — hero, quick start, moderation, methodology
     (cards), adopt — and drops the inline package grid and
     axiom list.  Each section is centered with `max-width: 56rem`
     and uses `.mathc-section` so the prose page chrome (sidenote
     gutters, theorem styling) does not bleed in.  The moderation
     section renders a `mathc gate` terminal output in a
     pre/code block to show the verdict the user gets at PR time.


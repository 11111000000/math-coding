outcomes:
  - id: read-write-methods-gated-by-env-var
    statement: |
      Setting `MCP_READ_WRITE` to a value other than
      `on` / `true` / `1` / empty / unset causes the four
      read-write methods to return -32601 Method not found
      with a message that names the env var. The seven
      read-only methods plus `mathc/find` continue to
      work.
assumptions:
  - id: default-on-preserves-back-compat
    state: assumed
    statement: |
      The historical behaviour — all 11 methods reachable
      without any env var — is preserved by the default
      (env unset). Existing opencode / Claude Code /
      Cursor agent hosts that already call the read-write
      methods require no configuration change.
    owner: human:maintainer
    consequence_if_false: |
      If the default is ever flipped to `off`, every
      existing agent host that calls a read-write method
      breaks. Resolution: emit a one-release deprecation
      note first; bump `mcp-read-write-env-gate-2026-10`
      to revision 2 with the flipped default; let users
      migrate. The reversal block records this explicitly.
    review_on:
      - signal: default-flip-requested
obligations:
  - id: read-write-env-gate-implemented
    outcome: read-write-methods-gated-by-env-var
    claim: |
      `tests/cli/mcp-read-write-env-gate.t` exercises the
      three cases (default / off / garbage) and asserts
      the documented behaviour. The fixture passes on a
      tree that ships the gate and would fail on a tree
      that does not.
    acceptance:
      all:
        - verifier: tests/cli/mcp-read-write-env-gate.t
reversal:
  - signal: default-flip-requested
    condition: |
      The default-off mode is requested (e.g. a stricter
      organisation wants new installs to ship with the
      gate off). Resolution: bump this decision to
      revision 2; flip the `read_write_enabled ()` default
      to false; add a one-line deprecation note in
      `adoption/SKILL.md`; ship a 1-release warning before
      the flip.
    action: rework
  - signal: gate-not-needed
    condition: |
      The trust-model review concludes the env gate is
      unnecessary (e.g. the MCP transport is always local
      and the allowlist is the only barrier needed).
      Resolution: delete the gate helper from
      `lib/mcp/dispatch.ml` and remove the env-var
      paragraph from `adoption/SKILL.md`; this decision is
      superseded by a `mcp-read-write-env-gate-rollback-...`
      decision.
    action: supersede-with-rollback

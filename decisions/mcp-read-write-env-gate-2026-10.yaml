intent: |
  Gate the four `mathc_mcp` read-write methods
  (`mathc/gate`, `mathc/attest`, `mathc/record`,
  `mathc/re-evaluate-decisions`) behind the `MCP_READ_WRITE`
  environment variable. By default (env unset; or set to
  `on`, `true`, `1`, or empty) the full 11-method surface
  remains available — the historical behaviour preserved.
  When `MCP_READ_WRITE` is set to anything else (e.g.
  `off`, `no`, `0`, `false`, or any other string), the four
  read-write methods return `-32601 Method not found` with a
  message that names the env var, and the dispatcher emits a
  one-shot stderr warning so operators can spot a mis-set
  variable. The seven read-only methods plus `mathc/find`
  remain reachable in every state.

  The pre-existing decision `ux-3-mcp-read-write-2026-10@1`
  already opened the read-write surface under the trust
  model "local MCP server, trusted AI agent on the same
  host". The reversal signal for that decision (a network
  MCP transport) recommended gating the read-write surface
  behind a separate knob. This file realises that knob
  concretely: `MCP_READ_WRITE=off` is the configuration a
  strict agent host runs in to refuse the side-effectful
  four methods while still receiving the read-only seven.

  Touches (per A3 self-application):
    lib/mcp/dispatch.ml                (env check helper +
                                       read-only / read-write
                                       list split + is_allowed_method
                                       + warn + error-message update)
    tests/cli/mcp-read-write-env-gate.t (new cram fixture,
                                       4 cases)
    adoption/SKILL.md                  (paragraph about the
                                       env var)

  Boundaries (A3 self-application):
    - `lib/mcp/dispatch.ml` is the only sub-library touched.
    - `lib/mcp/protocol.ml` and `lib/mcp/transport.ml` are
      unchanged; the wire protocol and the stdio transport
      are not affected by the gate.
    - `bin/mathc_mcp.ml` is unchanged.
    - The kernel under `lib/` is unchanged.
    - No new sub-library; no schema change; no axiom
      amendment beyond A0/A3 (A0 = separation, A3 = self-
      application; the existing attestation kinds are
      reused).
    - The `mathc/<x>` CLI subcommands are unchanged; the
      gate is MCP-only.
antithesis: |
  The counter-position considered and rejected: "The
  read-write surface is already gated by the trust model
  (local MCP server, trusted AI agent); an additional
  env-var gate is belt-and-suspenders and the default
  must be `off` to match the deferral history." The
  author engaged with this position and rejected it on
  three grounds: (a) the default is `on` so the
  opencode/Claude Code/Cursor agent hosts that already use
  the read-write surface keep working with no
  configuration change; (b) the env var is opt-in for
  stricter agent hosts — it is the operator's knob, not
  the kernel's; (c) the trust model is enumerated in
  `ux-3-mcp-read-write-2026-10@1` and the gate is the
  additive mechanism that decision's reversal signal
  recommended. The minimum-blast-radius shape is an
  env-var opt-in with the historical default preserved.
commitment: |
  One kernel-surface knob. Pinned by one new cram fixture
  (`tests/cli/mcp-read-write-env-gate.t`):

    D1. `lib/mcp/dispatch.ml::is_allowed_method` returns
        true iff the method is in `read_only_methods`, OR
        the method is in `read_write_methods` AND
        `read_write_enabled ()` returns true.

    D2. `read_write_enabled ()` reads `MCP_READ_WRITE`
        via `Sys.getenv_opt`. Absent / empty / `on` /
        `true` / `1` (case-insensitive) => true. Any other
        value => false.

    D3. When a read-write method is called and the gate is
        off, `dispatch.handle` returns `-32601 Method not
        found` with the message
        `Method not found: "<m>" (read-write methods are
        disabled via MCP_READ_WRITE=off; set
        MCP_READ_WRITE=on to enable)` and emits a one-shot
        stderr line
        `mathc_mcp: MCP_READ_WRITE=<value> — read-write
        methods disabled.`.

    D4. `allowed_methods` is the concatenation
        `read_only_methods @ read_write_methods`. The
        full 11-name list is still the source of truth for
        the help-text portion of the error message for
        methods that are neither in read-only nor in
        read-write (e.g. `mathc/secret`).

    D5. `tests/cli/mcp-read-write-env-gate.t` exercises:
        (a) default env: `mathc/gate` is reachable;
        (b) `MCP_READ_WRITE=off`: `mathc/gate` returns
            -32601 with the disabled message;
            `mathc/validate` (read-only) still works;
        (c) `MCP_READ_WRITE=garbage`: same as off plus a
            stderr warning that names the env var value;
        (d) `mathc/secret` (not in allowlist) returns
            -32601 under both gate states.

    D6. `adoption/SKILL.md` adds one paragraph (10 lines)
        describing the env var, the default, the disable
        signal, and the stderr warning.

  Boundaries (A3 self-application):
    - `lib/mcp/dispatch.ml` is the only sub-library touched.
    - `lib/mcp/protocol.ml` and `lib/mcp/transport.ml` are
      unchanged.
    - `bin/mathc_mcp.ml` is unchanged.
    - The kernel under `lib/` is unchanged.
    - No new sub-library; no schema change; no axiom
      amendment.
counterexample: |
  "Just make all 11 methods always read-write and remove
   the gate. The agent trust model is already local."

  Counterargument: the read-write methods produce side
  effects in `attestations/` and
  `decisions/execution-logs.jsonl`; the env gate is the
  explicit knob for users who want stricter isolation
  (e.g. an agent host that crashes on accidental writes,
  or a CI runner that should never mutate the
  attestation store). The default is `on` (back-compat),
  so no behaviour change for existing users. The knob
  is opt-in, exactly the contract the pre-existing
  decision's reversal signal recommended.

  "The env var should be `MCP_READ_ONLY=off` with
   default off, mirroring network-firewall defaults."

  Counterargument: the default must preserve the
  historical behaviour (all 11 methods reachable). The
  negation `MCP_READ_ONLY` would invert the default and
  require every existing opencode / Claude Code / Cursor
  configuration to set an additional env var to keep
  working. The chosen name (`MCP_READ_WRITE`) keeps the
  default unambiguous and the disable signal explicit.

  "Wire the gate through mathc validate / mathc
   policies.yaml, not an env var."

  Counterargument: the policy file is per-project; the
  MCP server is per-process. A per-process env var is
  the right knob for the per-process boundary that the
  MCP server already is. A future iteration could
  expose the gate through `policies.yaml` too; this
  decision is the minimum sufficient response.

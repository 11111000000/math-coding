  - A0
  - A1
  - A4

intent: |
  Ship the `mathc` formula in a personal Homebrew tap
  (`github.com/11111000000/homebrew-tap:Formula/mathc.rb`)
  so macOS / Linuxbrew users can run
  `brew install 11111000000/tap/mathc` and land at
  `mathc version`. The macOS / Linuxbrew artifact
  pair (`mathc-darwin-aarch64`, `mathc-darwin-x86_64`,
  `mathc-linux-x86_64`) ships every release today;
  the missing piece is the upstream formula PR.

commitment: |
  `tools/homebrew/` exists in the math-coding repository
  and contains:
    - `Formula/mathc.rb` — the formula Ruby class,
      populated for `v3.3.0` (Apple Silicon default
      arch with `livecheck` for upstream tracking).
      The `url` and `sha256` track the latest tagged
      release.
    - `PUBLISH.md` — the operator runbook for opening
      the upstream tap PR (creates the personal tap
      repo on first publish, copies the formula into
      `Formula/mathc.rb`, opens a PR).
    - `scripts/render-homebrew-formula.py` — generator
      that produces the Ruby class deterministically
      from `--version` and SHA-256 arguments.

scope:
  capabilities:
    - installer-distro
    - bootstrap-windows
    - package-managers
  paths:
    - "tools/homebrew/**"
    - "USAGE.md"
    - "site/install.md"
  exclusions:
    - "lib/**"
    - "bin/Mathc.ml"
    - "spec/**"
    - "schemas/**"
    - "axioms/**"
    - "decisions/decision.yaml"

outcomes:
  - id: brew-discoverable
    statement: |
      `brew install 11111000000/tap/mathc` on
      macOS / Linuxbrew returns 0 and lands at
      `mathc version`.

counterexample: |
  "Personal taps are vendor-locked to one owner;
   we should target Homebrew/core."
   Counterargument: Homebrew/core has a 200-reviewer
   acceptance bar and a 1-2 week review cycle; a
   personal tap merges in hours. Personal taps
   ARE the recommended path for niche tooling like
   this until core promotion, which requires
   sustained usage evidence (typically 30+ forks
   and 30+ stars on the upstream project).
   The decision records Homebrew/core promotion as a
   follow-up signal (similar to winget's
   `Packager accumulates 25+ downloads before
   core-eligible` heuristic).


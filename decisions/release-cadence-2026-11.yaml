counterexample: |
  Considered and rejected: "the gate is too strict —
  every PR that touches a protected path will be blocked
  even when no tagged release has been cut yet." Three
  grounds for rejection. (a) The gate only blocks when
  `git tag --merged` on the base ref returns a non-empty
  result; branches with no releases have no tag to gate
  against and pass through. (b) The fallback is to instruct
  the reviewer to re-run the release workflow, not to deny
  the merge outright — a manual re-run is one CI minute,
  orders of magnitude cheaper than the cost of a second
  v3.3.2-style stale-binary ship (per F15). (c) The F15
  failure cost is asymmetric: re-running the release
  workflow is routine, but a stale-binary ship produces
  user-visible breakage for every downstream installer
  wrapper (`install.sh`, `install.ps1`).

  A second counter-position: "the gate should query the
  GitHub API for `actions/runs` after the tag's commit,
  not rely on a heuristic." Rejected for the first-pass
  scope: the API query requires `GITHUB_TOKEN` plumbing
  and adds a runtime dependency to the gate, which is
  gated in turn. The first-pass implementation is a
  reviewer-readable instruction ("re-build, then merge");
  the API-query upgrade is tracked as a follow-up under a
  separate decision. The placeholder text in
  `release-pending.yml` makes this explicit.

  Third counter-position: "AGENTS.md already contains a
  release-cadence convention under 'Future work' or
  'Recommendations'; we should not duplicate prose."
  Rejected: the existing prose is in plan-doc tail-matter
  (`docs/plans/plan-2026-11-validation-cleanup-2026-10.md`
  §13, "Add a release-cadence CI gate per Batch C4"). The
  AGENTS.md note is a single-paragraph agent-protocol
  reminder, not a copy of the plan-doc recommendation —
  it links the F15 lesson to the workflow file by path so
  the protocol is actionable when an agent reads the
  project from a fresh checkout.


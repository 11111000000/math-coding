intent: |
  Add a release-pending CI gate that blocks merge of any PR
  whose diff touches `bin/Mathc.ml`, `lib/`, or
  `scripts/install-tooling/` while the most recent tag on the
  base branch has uncommitted re-build evidence. Per the F15
  finding: v3.3.2 shipped a stale binary that was tagged
  before sub-decision merges landed, so the published binary
  did not match the in-tree source. The gate is a
  conservative first-pass: a fail instructs reviewers to
  re-run the release workflow and publish a fresh build,
  rather than shipping the next sub-decision on top of the
  stale binary.

  Same scope class as `add-verify-subcommand-2026-10` and
  `import-junit-rename-2026-11`: additive CI only, no
  kernel/spec/decision-file semantics.

commitment: |
  The cycle closes when: (a)
  `.github/workflows/release-pending.yml` exists and is
  registered against `pull_request` events targeting `main`
  and `release/**`; (b) the gate's failure path produces a
  reviewer-readable instruction naming the latest tag and
  requesting a release-workflow re-run before merge; (c)
  `scripts/install-tooling/install.sh` ships
  `MC_VERSION_DEFAULT="3.3.3"` (the next release after this
  branch merges); (d) `AGENTS.md` records the release
  cadence note in the agent-protocol section so future
  agents do not re-introduce the bug; (e) `mathc self-check`
  reports zero NEW unknown subjects relative to plan-branch
  HEAD.

outcomes:
  - id: release-pending-workflow-registered
    statement: |
      `.github/workflows/release-pending.yml` exists with a
      `pull_request` trigger covering `main` and
      `release/**`. The job detects diffs that touch
      `bin/Mathc.ml`, `lib/`, or `scripts/install-tooling/`,
      identifies the latest tag on the base branch, and
      fails when no release-workflow re-run is recorded
      after that tag.

  - id: install-sh-mc-version-3-3-3
    statement: |
      `scripts/install-tooling/install.sh` carries
      `MC_VERSION_DEFAULT="3.3.3"` as the build-time
      default that downstream installer wrappers
      (`install.ps1`, `scripts/install-tooling/templates/`)
      read when no `--version` override is supplied.

  - id: agents-md-cadence-note
    statement: |
      `AGENTS.md` records a release-cadence note in the
      agent-protocol section explaining the F15 lesson
      and the gate's role, so the rationale is preserved
      through future reorganisations and is visible to
      every new agent that reads the file first.

  - id: no-new-unknowns
    statement: |
      `mathc self-check` over the post-commit tree reports
      the same unknown-subject count as at plan-branch
      HEAD (`release/v3.3.2-2026-10` @ `d481e38` = 188/0)
      and zero NEW unknown subjects attributable to this
      commit.


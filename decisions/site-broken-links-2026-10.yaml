axiom_link:
  - A1
intent: |
  Close four classes of 404 link that the live site at
  https://11111000000.github.io/math-coding/ currently ships:

  1. **Footer meta links** (`../AGENTS.html`, `../ROADMAP.html`,
     `../PACKAGES.html`). The render kernel emits these as
     siblings of the deployed page; resolved against
     `<base href="/math-coding/">` they land at
     `/AGENTS.html`, `/ROADMAP.html`, `/PACKAGES.html` —
     none of which exists. The `<base href>` makes `../`
     escape the site root.

  2. **Russian home page language toggle** (`href="home.html"`).
     `lib/render.ml::sibling_translation_href` builds the
     English-sibling URL by `page_key ^ ".html"`; for
     `page_key = "home"` that yields `home.html` instead of
     `index.html`. The toggle therefore 404s from
     `dist/index.ru.html` in two places (nav and footer).

  3. **Axiom pages linking to spec markdown** (`../spec/algebra-3.2.md`).
     Each of `axioms/*.md` has a relative link to the source
     spec markdown at `../spec/algebra-3.2.md`; rendered to
     `dist/axioms/<name>.html` with `<base href="/math-coding/">`
     the link resolves to `/math-coding/spec/algebra-3.2.md`
     — which 404s because `mathc render` ships the spec as
     `dist/spec/algebra-3.2.html`, not as raw markdown.

  4. **No persistent GitHub link in the top nav.** Every
     rendered page carries a `<nav>` with brand, links, and
     language toggle, but no link to the upstream repository
     from the nav itself. The home page hero carries a
     "Clone on GitHub" CTA, and the footer carries the
     meta-docs that point to GitHub after this cycle, but
     a visitor landing on any non-home page has no nav-level
     cue to the project repository. A link should live at
     the top of every page.

  Scope of this cycle: the four gaps above, plus the
  fixtures that pin them closed.

commitment: |
  1. `lib/render.ml::sibling_translation_href` returns
     `"index.html"` when `lang = "ru"` and
     `page_key = "home"`. The Russian home page's English
     sibling toggle and footer sibling both stop pointing
     at the non-existent `home.html`.

  2. `lib/render.ml::render_footer` no longer emits
     `../AGENTS.html`, `../ROADMAP.html`, `../PACKAGES.html`.
     The three meta-doc links point instead at
     `https://github.com/11111000000/math-coding/blob/main/<NAME>.md`,
     the canonical rendered-by-GitHub preview. The same
     GitHub origin replaces the `<base href>`-escaping
     `../spec/algebra-3.2.md` link that is now removed from
     the footer (the spec lives at
     `https://github.com/11111000000/math-coding/blob/main/spec/algebra-3.2.md`).

  3. `lib/render.ml::render_nav` emits a small GitHub link
     inside the `<nav>` element on every page, alongside
     the language toggle. The link is `<a class="github-link"
     href="https://github.com/11111000000/math-coding"
     aria-label="GitHub repository">…</a>` — visible on a
     1400-px viewport and present in the DOM on every
     rendered page. Its href is the bare repository URL
     (no `/blob/main` suffix); the GitHub homepage is the
     top-of-funnel entry point for a visitor who has never
     seen the project before.

  4. `axioms/care.md`, `axioms/feedback.md`,
     `axioms/invariants.md`, `axioms/self-application.md`,
     `axioms/separation.md` change their relative spec
     link from `../spec/algebra-3.2.md` to
     `../spec/algebra-3.2.html`. The HTML file is what
     `mathc render` ships under `dist/spec/`, so the
     resolved URL is live content.

  5. `tests/render_kernel.ml` ships five new fixtures:
     - `ru_home_sibling_is_index_html` — calls
       `sibling_translation_href ~lang:"ru" ~page_key:"home" ~has_ru:true`
       and asserts `Some "index.html"` (positive) and
       `Some "home.html"` is NOT returned (negative).
     - `footer_links_github_origin` — calls
       `render_footer ~lang:"en" ~version:"X" ~has_ru:false
       ~sibling_href:None` and asserts the body contains
       `github.com/11111000000/math-coding/blob/main/AGENTS.md`,
       `…/ROADMAP.md`, `…/PACKAGES.md`, and `…/spec/algebra-3.2.md`
       (positive) AND does NOT contain the substring
       `../AGENTS.html`, `../ROADMAP.html`, `../PACKAGES.html`
       (negative).
     - `nav_has_github_link` — builds a synthetic page with
       `Render.build_pages` and asserts every page body
       carries `<a class="github-link"` and the bare
       GitHub origin as its `href` (positive) AND does
       NOT carry the placeholder href
       `href="./github"` (negative, guards against a
       self-link bug).
     - `axioms_link_html_not_md` — reads `axioms/*.md`
       under `DUNE_SOURCEROOT` and asserts no axiom file
       still references `../spec/algebra-3.2.md` after
       the change (negative); AND the rendered
       `dist/axioms/care.html`, `dist/axioms/feedback.html`,
       `dist/axioms/invariants.html`,
       `dist/axioms/self-application.html`,
       `dist/axioms/separation.html` (generated by
       `scripts/render.sh` in the test) carry the link
       `../spec/algebra-3.2.html` (positive).

  6. The crate's `tests/cli/render.t` fixture grows one
     line: a `grep -qF 'href="https://github.com/11111000000/math-coding'
     dist/index.html` that pins the GitHub link's presence
     on the deployed surface.

  7. `scripts/render.sh` continues to regenerate `dist/`
     and the verifier pass at step `[4/4]` continues to
     confirm the file allowlist. No change to that script
     is required by this cycle.

  Boundaries:
  - This cycle does not render AGENTS.md / ROADMAP.md /
    PACKAGES.md into `dist/` as HTML; the GitHub link is
    the canonical source for those meta-docs.
  - This cycle does not add a search feature, RSS-per-axiom,
    or any new top-level surface. Only the four gaps
    above are touched.
  - This cycle does not change the link destinations of
    the nav-internal links (`axioms.html`, `methodology.html`,
    etc.) — those resolve correctly under `<base href>`
    and are not 404s.


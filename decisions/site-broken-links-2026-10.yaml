outcomes:
  - id: ru-home-sibling-resolves
    statement: The Russian home page's English sibling toggle and footer
      both link to `index.html`; `home.html` does not appear anywhere
      on `dist/index.ru.html`.
  - id: footer-meta-docs-link-github
    statement: Every rendered page's footer carries AGENTS, ROADMAP,
      PACKAGES, and the algebra spec as GitHub blob URLs; no footer
      carries the old `../<NAME>.html` / `../spec/algebra-3.2.md` pattern.
  - id: nav-has-github-link
    statement: Every rendered page's `<nav>` carries a GitHub anchor
      that points at the bare repository URL.
  - id: axiom-pages-link-rendered-spec
    statement: All five axiom pages reference
      `../spec/algebra-3.2.html` (the rendered spec), not
      `../spec/algebra-3.2.md` (the raw markdown source).

counterexample: |
  "Footer and nav links are editorial; a hot-fix to the
  render kernel is enough — no decision needed."

  Counterargument: the broken-link classes enumerated
  in `intent` are observable defects that any visitor
  encounters within two clicks. Each class has its own
  root cause (sibling_translation_href arity, base-href
  vs. relative URL semantics, missing GitHub nav entry,
  markdown-vs-HTML link target); closing them in a
  single commit under a single decision keeps the
  obligation tree reviewable, and the four fixtures in
  `commitment §5` keep them from regressing.

  "Just point the broken links at GitHub Pages and call
  it done."

  Counterargument: the four defects have different
  remediations. The footer is a meta-doc anchor → the
  natural target is the GitHub source preview (a single
  `blob/main/<NAME>.md` URL). The axiom links to
  `spec/algebra-3.2.md` are mid-document cross-references
  to the rendered site spec — pointing them at the
  rendered `dist/spec/algebra-3.2.html` keeps the reader
  inside the site's reading surface. The Russian home
  toggle is a sibling-resolution bug that does not
  involve GitHub at all; the fix is in
  `sibling_translation_href`. Collapsing them into a
  single "point everything at GitHub" patch would
  (a) leave the toggle bug in place, (b) lose the
  in-site spec cross-reference that the axioms use, and
  (c) defeat the purpose of `<base href>` for relative
  URLs that already resolve correctly.

  "The new GitHub nav entry is bikeshedding; remove
  it."

  Counterargument: the user's request explicitly named
  "there should be a link to GitHub at the top of the
  site". The nav is the only persistent top-of-page
  surface that lives on every rendered page. A reader
  who lands on `dist/axioms/invariants.html` currently
  has no nav-level GitHub affordance; adding one is the
  minimum cost of fulfilling the request and is reversible
  by removing the link in a follow-up cycle if a maintainer
  disagrees with the placement.

antithesis: |
  Author considered and rejected the strongest counter-
  position that a maintainer might raise: "The four gaps
  are independent; ship four separate decisions; one
  cycle per defect is the project convention."

  That position is rejected because (a) every gap lives
  in the same render kernel or in five tightly-coupled
  axiom markdown files; (b) the four fixtures in
  `commitment §5` are small (≈80 lines total) and cover
  all four classes together; (c) the four defects share
  the same root cause pattern (relative URL semantics
  plus `<base href>` and the file layout under `dist/`),
  so a single decision makes the trade-off legible;
  (d) splitting into four decisions quadruples the
  review cost without a corresponding gain in clarity.

  A counter-decision that wanted four separate cycles
  would have to argue that one of the four is independent
  of the others in a way that justifies a separate
  review-and-reverse path; the author sees no such axis
  and prefers the bundled cycle.

assumptions:
  - id: github-origin-stable
    state: assumed
    statement: |
      The GitHub repository
      `https://github.com/11111000000/math-coding` remains
      the canonical upstream and the project does not
      relocate to a different forge during the lifetime
      of this decision.
    owner: human:maintainer
    consequence_if_false: |
      The GitHub nav link and the footer meta-doc
      links all 404 on a forge move. A follow-up
      decision (`site-...-forge-relocate-...`) would
      rewire every constant.
    review_on:
      - signal: forge-ownership-changes

  - id: base-href-stays-subpath
    state: assumed
    statement: |
      The site's `<base href>` remains a subpath
      (`/math-coding/`) rather than becoming the host
      root. The relative-URL semantics that this cycle
      relies on depend on the base href overriding the
      document URL.
    owner: human:maintainer
    consequence_if_false: |
      If a future cycle sets `site_base = "/"` (host
      root), then `href="index.html"` resolves to
      `/index.html` (the host's homepage, not the math-
      coding homepage). The current cycle does not
      change `default_config.site_base`; a future move
      to host root would require its own decision and
      its own link audit.
    review_on:
      - signal: deployment-target-moves-to-host-root

obligations:
  - id: ru-home-sibling-resolves
    outcome: site-link-integrity
    claim: |
      The Russian home page (`dist/index.ru.html`) carries
      exactly two `<a>` elements whose target is the
      English home page; both targets are `index.html`
      (no `home.html` anywhere on the page).
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::ru_home_sibling_is_index_html
          result: pass
        - verifier: ! grep -qF 'home.html' dist/index.ru.html
          result: pass

  - id: footer-meta-docs-link-github
    outcome: site-footer-meta-doc-origin
    claim: |
      Every rendered page's footer carries the three
      meta-doc anchors (AGENTS, ROADMAP, PACKAGES) and
      they all point at
      `https://github.com/11111000000/math-coding/blob/main/<NAME>.md`.
      No footer carries `../AGENTS.html`, `../ROADMAP.html`,
      `../PACKAGES.html`, or `../spec/algebra-3.2.md`.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::footer_links_github_origin
          result: pass
        - verifier: ! grep -RFq '../AGENTS.html\|../ROADMAP.html\|../PACKAGES.html\|../spec/algebra-3.2.md' dist/
          result: pass

  - id: nav-has-github-link
    outcome: site-nav-github-presence
    claim: |
      Every rendered page's `<nav>` element carries a
      GitHub anchor `<a class="github-link"
      href="https://github.com/11111000000/math-coding"
      …>…</a>`.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::nav_has_github_link
          result: pass
        - verifier: tests/cli/render.t
          result: pass

  - id: axiom-pages-link-rendered-spec
    outcome: site-link-integrity
    claim: |
      The five axiom pages (`dist/axioms/care.html`,
      `…/feedback.html`, `…/invariants.html`,
      `…/self-application.html`, `…/separation.html`)
      carry the rendered spec link
      `../spec/algebra-3.2.html` and do NOT carry the
      raw-markdown link `../spec/algebra-3.2.md`.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml::axioms_link_html_not_md
          result: pass
        - verifier: ! grep -RqF '../spec/algebra-3.2.md' dist/axioms/
          result: pass

reversal:
  - signal: github-link-becomes-noise
    condition: |
      A maintainer audit (e.g. Lighthouse, axe, or a
      manual review) finds the GitHub nav link
      redundant with the existing "Clone on GitHub" CTA
      on the home page, or a user survey shows visitors
      ignore it.
    action: remove-nav-link-and-bump-revision

  - signal: github-anchor-changes-host
    condition: |
      The repository moves to a different forge (GitLab,
      Codeberg, self-hosted). The hardcoded `github.com`
      URLs all 404.
    action: rework-as-forge-relocation-decision


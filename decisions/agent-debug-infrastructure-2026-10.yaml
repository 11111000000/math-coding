intent: |
  Convert OCAML_BEST_PRACTICES.md §11 trap log from a passive
  documentation surface into an active helper for LLM agents
  working on the math-coding kernel. §11 is empirically a
  catalogue of LLM-on-OCaml pitfalls (22 entries, each observed
  in a real session); today the trap log is only reachable if an
  agent reads OCAML_BEST_PRACTICES.md on its own initiative, which
  is rare. This decision records four concrete moves that make
  the trap log executable and machine-assertable:

    1. `scripts/agent-debug` — bash wrapper that reads dune-build
       stderr on stdin and prints the matching §11 trap entry
       with a fix hint. Covers 8 of the 22 traps (the ones whose
       symptom is a recognisable substring of an error message:
       §11.6, §11.5, §11.14, §11.18, §8.1, §11.10, §11.11, §11.21,
       §11.22).

    2. `tests/traps.ml` — Alcotest regression suite that pins each
       reproducible trap (§11.1, §11.3, §11.8, §11.11, §11.12,
       §11.15, §11.17, §11.19) as a unit test. Once added, an
       agent (or human) re-introducing the bug fails CI; the bug
       cannot return silently.

    3. `tests/qcheck_parsers.ml` — QCheck property-based suite
       (3500 iterations across 4 properties) that catches silent
       parser losses like §11.15 ("JSON array loses last
       element"). Property tests are the only systematic way to
       surface silent losses; structural conformance tests are
       not.

    4. `lib/jsonl.ml` Parse_error signature change from
       `(string * int)` to `{ line : int; col : int; msg : string;
       context : string list }`. End-user-facing error messages
       now include a 3-line source-context excerpt and a
       human-readable location ("line N col M" instead of "byte
       N"). Diagnostic.create's existing `cause : string list`
       field is fed by the new context.

  Why now: the trap log is the largest single source of
  LLM-specific guidance in the repository (22 entries), but it
  does not enter the agent's loop until the agent opens
  OCAML_BEST_PRACTICES.md. The bash wrapper plus the regression
  suite close that loop: every dune build error first goes to
  agent-debug for a §11 hint, and every regression of a §11 bug
  fails a test before it can reach main.

  Scope discipline:
  This decision does not introduce new runtime dependencies. The
  only new dev-only dependency is qcheck + ounit2 (alcotest's
  transitive dep, enumerated explicitly for nix). The qcheck
  dev-dep is in `math-coding.opam` dev-deps only; the runtime
  binary is unchanged.

  This decision is META (per the META convention in PACKAGES.md):
  it adds no obligations to `obligations.yaml` and does not
  appear in `mathc packages` counts. It is recorded here so the
  agent-debug infrastructure is discoverable as a single
  decision artifact.

axiom_link:
  - A0
commitment: |
  Four deliverables, each pinned by an obligation:

    D1. `scripts/agent-debug` exists at repository root and is
        executable. At least 8 of the 22 trap entries in
        OCAML_BEST_PRACTICES.md §11 are covered by case branches
        that map a regex of the build error to a hint line.

    D2. `tests/traps.ml` exists and registers in `tests/dune`.
        The test file contains at least one Alcotest test_case
        for each of §11.1, §11.3, §11.8, §11.11, §11.12,
        §11.15, §11.17, §11.19 — that is, the 8 traps that are
        reproducible as OCaml-runtime regressions.

    D3. `tests/qcheck_parsers.ml` exists and registers in
        `tests/dune`. It contains at least four QCheck
        properties — one of which is a direct regression for
        §11.15 (array length preservation across
        stringify ∘ parse) — and runs at least 500 iterations
        per property.

    D4. `lib/jsonl.ml` exports `exception Parse_error of {
        line : int; col : int; msg : string; context : string
        list }` instead of the prior `(string * int)`. All
        catch-sites in `lib/` and `bin/` either use the new
        record pattern or the wildcard form. The kernel
        produces at most one exception type for parse errors.

  Boundaries:
    - This decision does NOT change the public `Jsonl.parse`
      function signature (still `string -> value`).
    - This decision does NOT add `ppx_*` preprocessors.
    - This decision does NOT change the schema for any
      persisted artifact (no change to
      `schemas/decision.json` etc.).
    - This decision does NOT introduce runtime deps (only
      dev-deps).


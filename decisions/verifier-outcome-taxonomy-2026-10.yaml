counterexample: |
  Two counter-positions considered and rejected.

  (a) "One verdict is simpler: report every non-pass as `fail`
  and let the waiver mechanism sort it out." Rejected: that is
  the state this change replaces. A verdict of `fail` says the
  PROJECT is broken. For a check that could not run here, the
  truth is "the check did not happen", and the difference between
  those two is the difference between a debt and an accusation.

  (b) "Leave `manual:` obligations as inconclusive and waive
  them." Rejected: a `manual:` obligation is not a gap in the
  evidence - it is the EVIDENCE. It is a human's declaration that
  the property holds, and the attestation system has a class for
  exactly that: `review`. Signing it as inconclusive made 466
  declared obligations unsatisfiable, and 466 waivers would have
  been absurd. The declaration stays bound to a tree through
  the scope digest, so it is not a free pass: it goes stale when
  the scope changes.

  The two counts in (b) and in the antithesis are DATED MEASUREMENTS
  of the 2026-10 change, taken over the tracked store of that day.
  They are recorded here as the evidence for the decision, not as
  counters the tree keeps today.

antithesis: |
  The opposite claim would be that the third distinction - executing
  the verifiers the kernel can execute - should have been the ONLY
  change, and the other two are cosmetic.

  Rejected on the numbers. The third distinction moved 200
  obligations from "could not run" to actually running. The first
  moved the corpus-wide sweep from reporting a broken project to
  reporting an absent toolchain. The second moved 466 declared
  obligations from unsatisfiable to satisfied-with-a-binding.
  Together they took the self-check from 38 passing subjects to
  152.

  The instructive part is the third: the filter that decided "can
  this run?" asked `plan_verifier`, which does not know about the
  three original schemes because they are handled before it is
  reached. A filter that decides a question by asking a function
  that cannot answer it will exclude exactly the cases that could
  have been handled - which is the same shape as the wrapper that
  reported every dune test outcome as success, one level deeper.

  (The 200, 466 and 38-to-152 figures are the 2026-10 measurements of
  that change, over the tracked store of the day. They are the
  evidence for the decision; they are not counters this decision
  keeps.)


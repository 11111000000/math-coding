      A `manual:` declaration was written by a human who read the
      decision. The corpus migration converted prose verifier
      strings into such declarations; the prose was the human's own
      text, and the migration preserved it as a structured
      declaration rather than inventing one.
    consequence_if_false: |
      If a manual declaration was not made by a human, it is not
      evidence, and the whole class collapses. The counter is the
      negative-control rule: a decision whose manual declaration
      names a check must still be reviewable.

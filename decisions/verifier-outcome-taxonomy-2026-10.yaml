intent: { source: "issue:three-verifier-outcomes-were-one-2026-10-23", text: "Running every verifier in the corpus exposed three cases the kernel treated as one, and each of them changed a number. A verifier that could not be SET UP was reported as a failure, so a corpus-wide sweep reported every toolchain-dependent verifier as a broken project. A `manual:` obligation was reported as inconclusive, so 466 declared obligations could not be satisfied - which is the opposite of what a declaration is for. And an obligation whose verifier names an executable scheme the kernel CAN execute was excluded by a filter that asked a function which does not know about the three original schemes, so 200 perfectly executable checks were reported as checks that could not run." }

commitment: |
  After this decision closes:

  1. A verifier that cannot be SET UP - the program is not on
     PATH, or it exits 126 or 127 - is `skipped`, not `fail`. It
     has not failed; it has not run.
  2. A `manual:` obligation is a HUMAN DECLARATION and is
     satisfied by a `review`-class attestation. It is still bound
     to a tree through the scope digest, so it goes stale when the
     scope changes.
  3. An obligation whose verifier the kernel can execute IS
     executed. The filter that decides this mirrors
     run_one_verifier's dispatch exactly, including the three
     original schemes.
  4. The debt fixture pins the legacy, inconclusive and unattested
     counts as CEILINGS that may only fall. The three numbers live in
     ONE place -- `tests/fixtures/legacy-attestation-debt.sh` -- and
     they are owned by `decisions/legacy-attestation-debt-2026-10.yaml`.
     This decision does not repeat them: one debt, one owner, one
     fixture.

  2026-10-31, REVISION 2: THE THREE DEBT COUNTS WERE A POPULATION
  THAT NO LONGER EXISTS. This decision pinned the legacy, inconclusive
  and unattested counts at the values the corpus had on 2026-10-23,
  over a store that was then TRACKED IN GIT. The store is generated on
  disk and is not tracked (`decisions/store-not-committed-2026-10.yaml`),
  so those counts described a population the tree no longer has.

  What is true now, measured on 2026-10-31:

    - `bash tests/fixtures/legacy-attestation-debt.sh` answers exit 3
      (`unknown`, not `pass`): this checkout has no generated store, so
      there is nothing to measure and the fixture says so instead of
      reporting a green measurement over nothing.
    - the three ceilings themselves live in the fixture and are
      printed by `bash scripts/ceiling-monotonic.sh` against their
      recorded bases; they are the numbers this decision points at
      rather than repeats.
    - the three VERDICTS this decision is about are unchanged and are
      still exercised by the kernel: a verifier that cannot be set up
      is `skipped`, a `manual:` obligation is satisfied by a
      `review`-class attestation, and a verifier the kernel can
      execute IS executed.


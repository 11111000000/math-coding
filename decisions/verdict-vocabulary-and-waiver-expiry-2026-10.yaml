changed-verdicts: |
  Measured with the built binary
  (`dune build @install && ./_build/install/default/bin/mathc
  self-check`), on a tree whose only changes are this decision's,
  with the attestation store clean: `attestations/` holds 765
  files and `git ls-files attestations` holds 765, i.e. no
  uncommitted or `.gitignore`d test scratch is being counted. This
  matters — see `risk.measurement_traps`.

  Re-measured 2026-10-22 on top of current `main` (42bae29), not
  on the e587c81 base this decision was first drafted against. The
  numbers below therefore differ from the first draft's, and the
  first draft's were already stale by the time it was written:

      before (this file absent): verdict unknown | exit 3 |
        subjects 213 | pass 192 | open-with-waiver 7 | unknown 14
      after:                     verdict unknown | exit 3 |
        subjects 214 | pass 192 | open-with-waiver 7 | unknown 15

  The expiry change itself moves NOTHING, and that is measured
  rather than argued: `lib/waiver.ml` was reverted to the inclusive
  predicate and rebuilt, and the per-subject verdict map hashed
  identically under both comparisons
  (`sha256:58fde6db8de71918` in both runs). The only difference
  between the two rows above is this decision's own subject.

  The single new subject is this decision, and it is `unknown` on
  purpose: `attestations/<decision>-<obligation>.json` was NOT
  generated for it. `mathc attest-batch --from=decisions` stamps
  `result: pass` on every obligation of every decision without
  running a verifier, so using it here would have manufactured ten
  green obligations out of a tool call — the same laundering class
  this decision exists to close, performed by the tooling that
  closes it. An unattested obligation honestly reads `unknown`;
  that is what `unknown` is for. Ten `causes[]` entries on this
  subject are the ten obligations below, each of which IS verified
  — by a fixture, by a test suite, by a cram fixture, or by a
  mutation probe whose numbers are recorded in
  obligation `boundary-tests-detect-both-directions` — and none of
  which has an attestation file yet.


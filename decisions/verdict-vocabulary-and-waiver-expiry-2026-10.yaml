intent: |
  Two debts, both about the kernel saying one thing and its
  documents saying another. Neither is a missing feature; both are
  divergences that the previous cycle recorded instead of closing.

  DEBT 1 — the normative spec enumerated a verdict vocabulary the
  kernel does not have.

  `spec/semantics.md:418` (the `self-check` CLI row, before this
  decision) read, verbatim:

      `verdict` (`pass` | `fail` | `unknown`)

  The kernel it describes reports four values. `lib/gate.ml:41`:

      type verdict = Pass | Open_with_waiver | Block | Unknown

  and `bin/Mathc.ml` renders all four. `open-with-waiver` was the
  one the spec never mentioned, and it is the one that carries the
  most meaning: it is the only verdict that says "green, but only
  because a named human said so". The spec's other two stale rows
  are in the same file: the `gate` row still claimed its exit code
  was "`0` always today", which Invariant 14 and 14b have forbade
  since `decisions/exit-code-symmetry-2026-10.yaml`, and the
  `gate` row's verdict list (`pass`, `block`, `unknown`) omitted
  `open-with-waiver`. §Kernel Output — the section that is supposed
  to be the vocabulary's home — listed what the kernel emits and
  never said what a verdict IS.

  `decisions/self-check-waiver-verdict-coherence-2026-10.yaml`
  closed the code half of this (the `pass` string, the `waivers[]`
  array) and deliberately did NOT touch `spec/**`: its
  `scope.exclusions` reads "`spec/**` # normative prose; debt
  recorded in antithesis", and the antithesis says the line "was
  NOT edited here" and names `spec/semantics.md:418` as "the
  stale one, not this change". That exclusion is the precedent for
  deferring spec edits from a kernel fix. This decision is the
  cycle it deferred to, and the exclusion is the reason it is a
  separate decision rather than a stray diff.

  DEBT 2 — the kernel's waiver-validity predicate contradicts
  Invariant 14c by one second.

  `constitution.md` Invariant 14c, verbatim:

      14c. Waiver-bounded exit: a verdict `Open_with_waiver` that
          produces exit 0 MUST reference a waiver whose
          `expires_at` is strictly greater than the evaluation
          time and whose scope covers every gap in the verdict.

  `lib/waiver.ml::effective_at`, before this decision, verbatim:

      (* Determine whether a waiver is in effect at the given moment.
         ...
         issued_at <= now <= expires_at. Both endpoints are inclusive
         per the spec language "MAY permit a gate" (constitution.md
         §Waivers, line 105). *)
      let effective_at w ~now =
        iso_le w.Domain.issued_at now && iso_le now w.Domain.expires_at

  `now <= expires_at` is `expires_at >= now`. The constitution
  requires `expires_at > now`. At the single instant
  `now == expires_at` the two disagree, and the loser is the
  constitution: the old predicate answered "this waiver is in
  force" for a waiver the same document calls expired, and that
  answer flowed straight into `Gate.aggregate_with_waivers`,
  producing `Open_with_waiver` and exit 0. §Waivers' own rule —
  "MUST NOT outlive its expiry" — was defeated by one `<=`.

  The justification the old comment cited does not hold up.
  "MAY permit a gate" says a waiver can open a gate; it says
  nothing about which endpoints the waiver's term has, and
  "permissive" is not "unbounded". The strictness comes from 14c,
  which is the only normative sentence in the repository that
  speaks about this comparison, and it says "strictly greater".

  SEARCHED FOR A CONTRADICTION AND DID NOT FIND ONE ON THIS
  QUESTION. Recorded because the absence is a finding, and
  because "the norm says two things" would have been the easier
  story to tell. Every normative sentence that touches the
  expiry endpoint, read in full:

    - Invariant 14c: `expires_at` "is strictly greater than the
      evaluation time" -> `now < expires_at`. Strict.
    - §Waivers: a waiver "MUST NOT outlive its expiry" -> the
      same direction. A waiver cannot be in force at the instant
      the constitution calls it expired.
    - Invariant 11: a waiver applies only within "its named gap,
      scope, revisions, gate and validity interval" - names the
      interval, does not define its endpoints.
    - §Waivers: a waiver MUST "identify ... issue time, expiry"
      - requires the times be present, not that either bound be
      open or closed.
    - spec/constitution.md, Kernel Invariant 14 (and its 14b/14c successors): about
      exit codes, not waiver validity.

  So the normative text is one-directional and consistent: the
  expiry end is open. What it does NOT do is say where the
  endpoint belongs, and that is the genuine ambiguity, recorded
  in `counterexample` (3): 14c is phrased as a condition on a
  VERDICT ("a verdict `Open_with_waiver` that produces exit 0
  MUST reference a waiver whose ..."), so a reading is available
  in which `effective_at` keeps the closed interval and the
  VERDICT refuses to use a waiver at the expiry second. That
  reading satisfies 14c as written and changes nothing else. This
  decision instead reads 14c as a property of the waiver at the
  evaluation time, because that is what the sentence is about and
  because it needs no second enforcement point that could drift
  from the first. The choice is stated here so a reviewer who
  prefers the other reading can take it without re-deriving it,
  and so the issue side of the interval is visibly a decision
  rather than an oversight (`assumptions` `issued-side-stays-
  inclusive`).

  The contradictions this repository ACTUALLY has are elsewhere,
  and none of them is about this boundary. They are recorded,
  not resolved, because each amends a protected section:
  §Merge Gate's MUST (unimplementable at `mathc gate`), §Release
  Gate's three-verdict list against `gate_release_v32`'s
  `Unknown`, and 14b's one-directional exit statement. See
  `counterexample` (3), (4), `reversal`, and the three known
  deviations now in spec/semantics.md §Kernel Output.

commitment: |
  (a) SPEC, `spec/semantics.md`:
      - the `gate` CLI row now names all four verdicts and states
        the exit codes of §Kernel Output instead of "0 always
        today";
      - the `self-check` CLI row now enumerates
        `pass | open-with-waiver | fail | unknown`, documents the
        per-subject `waivers[]` field set (`id`, `issuer`,
        `issued_at`, `expires_at`, `scope`, `covers[]`), states
        that `pass` is not co-reported with a non-empty `causes[]`,
        and states the aggregate rule for the top-level verdict;
      - §Kernel Output gains two normative subsections, "Verdict
        vocabulary" and "Verdict to exit code". The first tabulates
        the four verdicts as four claims and binds the two rules
        that were previously only implied (never `pass` when
        waived; an `open-with_waiver` verdict names its waiver);
        the second is the verdict→exit table for every
        verdict-producing subcommand, which is the answer to the
        question Invariant 14c leaves open (see antithesis);
      - a new `## Waiver Validity` section states the validity
        interval as `issued_at <= t < w.expires_at`, cites 14c for
        the open upper endpoint, and says explicitly that it MUST
        NOT be harmonised with attestation currency
        (`spec/algebra-3.2.md` §14, closed on both ends) because
        the two rules govern different artefacts. The section also
        repairs a dangling citation: `lib/waiver.ml` and
        `lib/gate.ml` have been pointing at "spec/semantics.md
        §Waiver" for months, and no such section existed;
      - the vocabulary section records THREE known deviations it
        does not ratify, and says plainly that the third is one
        this edit CREATES: (1) `mathc gate` short-circuits an
        empty changed-path set to `pass` while still enumerating
        gaps (see `risk.drift_recurs`); (2) §Merge Gate's MUST is
        unimplementable because `mathc gate` never loads waivers;
        (3) §Release Gate still names three release verdicts and
        omits `unknown`, so the four-value table and that list
        contradict each other inside one file. Recording (3) is
        this decision's contribution to the contradiction being
        visible; resolving it is the owner's, tracked in
        `reversal` `owner-answers-the-release-gate-question`.

  (b) CODE, `lib/waiver.ml`: `effective_at` becomes
      `iso_le issued_at now && iso_lt now expires_at`, with the
      comment replaced by the normative citation. One predicate,
      one helper (`iso_lt`), no caller changes:
      `Waiver.covers` is the only call site and
      `aggregate_with_waivers` is the only consumer of `covers`.

  (c) TESTS:
      - `tests/waiver_test.ml`: the expiry boundary is pinned on
        both sides — `now == expires_at` is NOT effective,
        `now == expires_at - 1s` IS, `now == expires_at + 1s` is
        NOT — plus the same pair at the `covers` level, which is
        where the gate actually reads it. The issued-side
        boundary (inclusive) is pinned too;
      - `tests/gate/waiver_aggregation.ml`: three verdict-level
        cases at `expires_at`, `expires_at - 1s` and
        `expires_at + 1s`, plus the issued-side case, so the
        asymmetry is covered at the layer that produces the
        verdict;
      - `tests/cli/waiver-expiry-boundary.t`: a lapsed waiver
        through the real binary reports `unknown`, exit 3, and an
        EMPTY `waivers[]`; a live waiver on the same project
        reports `open-with-waiver` with a named waiver and exit 0.

  (d) FIXTURE, `tests/fixtures/verdict-vocabulary-spec-coherence.sh`:
      derives the verdict vocabulary from `lib/gate.ml` and asserts
      the spec carries it, asserts no three-value enumeration
      survives, asserts the six `waivers[]` fields are specified,
      asserts the spec exit table matches the arms
      `bin/Mathc.ml` still ships, and asserts the spec's half-open
      interval against the kernel's strict comparison. This is the
      debt-1 regression: spec drift becomes a red fixture instead of
      an audit finding.

  (e) MIGRATION: none required, and the claim WAS measured, not
      assumed. At this decision's evaluation time all eight
      waivers in `decisions/waivers/` expired on 2027-04-06 or
      2027-04-18, i.e. 165 to 177 days out, so no waiver changed
      status. That was a one-time measurement; the corpus's waiver
      set moves, and no obligation keeps the table current. See
      `changed-verdicts`.

  (f) DOC, two claims that (c) measured to be false. `USAGE.md`
      and the header comment of `scripts/hotfix-cve.sh` both said
      that a lapsed waiver makes the next command "return Block".
      The new CLI fixture measures the opposite: the subject
      reports `unknown`, exit 3, with the gap still listed. A
      reader following the old text would look for a block and
      conclude the waiver machinery is stricter than it is — the
      same wrong-in-the-same-direction failure as the verdict
      vocabulary this decision exists to fix. Two sentences, no
      behaviour change.

  (g) NOT DONE, deliberately, with the proposals that belong to
      the owner — see `counterexample` (3) and (4). No change to
      `spec/constitution.md`, no change to `spec/algebra-3.2.md`,
      no change to the §Release Gate verdict list, no change to
      `Domain.gate` (declared, never used; `lib/packages.ml`'s
      comment claiming the consult step "is wired into
      `lib/gate.ml::gate_v32`" is false and is left for the
      decision that either wires it or deletes the type). Also not
      done: `decisions/ux-3-hotfix-waiver-procedure-2026-10.yaml`
      repeats the "returns Block" claim in its `commitment`
      ("Once `expires_at` passes, the waiver is no longer
      effective_at and the next `mathc gate` returns Block on this
      subject"). Decision bodies are append-only after acceptance
      (constitution.md §History and Correction), so the correction
      is a revision of that decision, not an edit here.

antithesis: |
  The strongest counter-position, in the order I find it hardest to
  answer:

  1. "This is documentation theatre. The kernel was already right
     about verdicts — `open-with-waiver` is not `pass`, and 14c is
     satisfied for any real evaluation. You have spent a cycle
     rewriting a Markdown file."

     Half granted, and the grant is why (a) is careful. What makes
     this more than theatre is WHO reads a normative spec: a
     consumer of `mathc self-check` is told by
     `spec/semantics.md:418` that the verdict is one of three
     values, so a reader who trusts the spec writes
     `case "fail" | "unknown" | "pass"` and has no branch for the
     fourth — which is not a missing nicety, it is the waiver
     branch silently falling into a default arm. A normative
     document that contradicts the kernel makes every careful
     reader wrong in the same direction.

  2. "The expiry second is unreachable, so you changed a predicate
     to satisfy a sentence that no run can observe."

     This is the better objection and it is why
     `changed-verdicts` reports zero movement instead of hiding
     it. It is also wrong, for a reason that is about the
     architecture rather than about luck: the constitution defines
     the kernel as `K(R, P, now)` — an explicit evaluation time is
     part of the function's signature ("The kernel determines only
     predicates computable from canonical repository artifacts,
     declared policy and an explicit evaluation time"), and the
     code honours that: `Gate.aggregate_with_waivers` takes `~now`
     as a parameter and is pure, and every boundary fixture in
     this repository passes an explicit timestamp. A consumer that
     honours the signature can put `now` anywhere it likes,
     including the expiry instant — and a policy evaluation replayed
     at a stored timestamp will do exactly that. The boundary is one
     argument away, not one century away.

  3. "14 constrains what a verdict REPORTS, not what
     `effective_at` computes. Enforce `expires_at > now` at the
     verdict, leave the predicate alone."

     This is the real objection to Debt 2 and it deserves an
     answer rather than a restatement. Two reasons it fails.
     First, the repository's own end-to-end fixture already reads
     14c strictly: `tests/cli/self-check-waiver-verdict.t`
     scenario 2 flags any `open-with-waiver` subject carrying a
     waiver with `.expires_at <= $now` as a violation
     (`select(.expires_at <= $n ...)`). So the strict reading is
     not my invention; it is already the accepted reading, encoded
     in a committed test, and the kernel was the only component
     still disagreeing with it. Second, enforcing it at the verdict
     leaves `Waiver.covers` answering "yes, this gap is covered"
     for an expired waiver to every other caller, and the invariant
     would be enforced by a check bolted onto one consumer rather
     than by the predicate that means "in force". 14c's subject is
     the waiver's relation to the evaluation time; the place that
     relation is computed is the predicate.

  4. "The constitution is incomplete here and you left it
     incomplete."

     Correct, and it is the one item I am deliberately not closing
     myself. See `counterexample` (4): the proposed wording is
     written out there for the owner, and the spec table is marked
     as restating 14b rather than as superseding it.


counterexample: |
  What would make this decision wrong?

  (1) "The boundary is unreachable in production, so the predicate
      change buys nothing and costs a second of waiver validity."
      Granted in full, and priced in `changed-verdicts`: the cost is
      exactly one second per waiver, at the expiry instant, and zero
      verdicts move. The benefit is that the kernel stops
      contradicting a MUST in the document it exists to implement.
      If the owner judges that trade worthless, the correct move is
      to amend 14c (proposal in (4)), not to leave the predicate
      lying.

  (2) "The spec now claims something the kernel does not do."
      True of exactly one sentence, and it is labelled as a known
      deviation rather than hidden: `pass` co-reported with a
      non-empty `gaps[]` is the requirement, and `mathc gate`
      violates it for an empty changed-path set. Measured on this
      tree: `mathc gate HEAD HEAD` prints `"verdict":"pass"` beside
      `obligations: 786` and 118 gaps and exits `0`. Writing the
      requirement into the spec without that note would have made
      the spec a second false document, which is the defect this
      decision exists to remove.

  (3) "Two normative spec files now disagree about the merge gate."
      They already did, and this decision did not create it:
      `spec/semantics.md` §Merge Gate says "A merge with a Waiver
      MUST report `open-with-waiver`, never `pass`", while
      `spec/algebra-3.2.md` §15 defines
      `gate_merge(c, p, t, rules)` with only two outcomes
      (`Open` iff every blocking obligation is `Pass`, `Blocked`
      otherwise) and no waiver branch — so under algebra §15 a
      waived obligation is not `Pass` and the merge is `Blocked`,
      contradicting semantics.md and the shipped kernel.
      Resolution I recommend to the owner, and did NOT apply:
      algebra §15 is a 3.2-ideal model and predates the 3.3 waiver
      step; §Waivers already permits the branch ("MAY permit a
      gate only when the active policy marks that gap class
      waivable"), so algebra is the stale document. Proposed §15
      addition, for an owner decision:

          gate_merge(c, p, t, rules):
            waived_gaps(ob) = {ob : ∃ w ∈ Waivers, in_force(w, t)
                               ∧ scope(w) ⊇ scope(gap(ob))}
            Open_with_waiver iff every blocking obligation is Pass
                               except those in waived_gaps, and no
                               unwaived blocking obligation remains
            Open iff no unwaived blocking obligation remains
            Blocked otherwise

      The same question exists for §Release Gate
      (`spec/semantics.md:118`): "The release verdict MUST be one
      of `pass`, `open-with-waiver`, or `block`" omits `unknown`,
      while `Gate.gate_release_v32` returns `Unknown` whenever
      blocking obligations exist. Proposed wording, also NOT
      applied:

          The release verdict MUST be one of `pass`,
          `open-with-waiver`, `block` or `unknown`, using the
          vocabulary of §Kernel Output; an inconclusive or
          infrastructure-error evaluation MUST report `unknown`
          and MUST NOT be reported as `pass`
          (constitution.md Invariant 10).

  (4) "Invariant 14b does not actually state the verdict→exit
      mapping you documented."
      It states it one-directionally: "exit code 0 MUST imply
      verdict `Pass` or `Open_with_waiver`. Verdict `Block`
      produces exit code 1; verdict `Unknown` produces exit code
      3". So `Block` and `Unknown` are pinned, exit 0 is pinned as
      an implication, and `Pass → 0` / `Open_with_waiver → 0`
      follow only by exhaustion of the four-value vocabulary. That
      is also why 14c's wording is conditioned on "that produces
      exit 0": on a one-way reading, a verifier that reported
      `Open_with_waiver` at exit 3 would violate nothing the
      constitution currently says — a waiver-blocking reading that
      §Waivers' "MAY permit a gate" does not forbid. I resolved it
      in the SPEC (a normative four-row table, marked as
      restating 14b) and left the constitution alone, because
      amending Invariants is a protected transition under
      §Self-application and not mine to take. Proposed amendment
      for the owner:

          14d. Total verdict-to-exit mapping: the four kernel
               verdicts map exactly as follows — `Pass` → 0,
               `Open_with_waiver` → 0, `Block` → 1, `Unknown` → 3.
               A verifier MUST NOT map `Pass` or
               `Open_with_waiver` to a nonzero exit, and MUST NOT
               map `Block` or `Unknown` to 0.

      If the owner prefers, the spec table alone is sufficient for
      the kernel as shipped, and 14d can wait.
      (5) "The merge gate never reports `open-with-waiver`, so §Merge
      Gate is unimplementable and your spec table promises a value
      `mathc gate` cannot print."

      Measured, and it is the largest thing this decision found
      while writing the `gate` CLI row. On a synthetic project with
      one decision, one waived obligation and one in-force waiver:
      `mathc self-check` reports `open-with-waiver`, exit 0;
      `mathc gate HEAD~1 HEAD` on the same project reports
      `unknown`, one obligation, one gap, exit 3. Neither
      `Gate.evaluate` nor `Gate.gate_v32` takes a waiver argument;
      `Gate.aggregate_with_waivers` is called only from
      `bin/Mathc.ml::evaluate_decision`, which only `self-check`
      calls. So the waiver mechanism exists, is correct, and is
      wired into exactly one of the two verdict-producing
      commands.

      Two readings, and the spec cannot pick for the owner:
      §Waivers says a waiver "MAY permit a gate", which the exit-3
      behaviour satisfies (the permission is not exercised); §Merge
      Gate says "A merge with a Waiver MUST report
      `open-with-waiver`, never `pass`", which it cannot satisfy.
      Both are normative, they disagree about whether a waiver is
      permitted or required at the merge gate, and nothing in the
      repository resolves it. I wrote the `gate` row to state the
      measured behaviour and recorded the contradiction in §Kernel
      Output as a second known deviation, because the alternative —
      describing a `mathc gate` that reports `open-with-waiver` —
      would have been a second false document, which is the defect
      class this decision exists to close. Wiring the waiver step
      into `do_gate` is a kernel change with its own blast radius
      (it would move `mathc gate` from exit 3 to exit 0 on waived
      merges, i.e. it decides the §Waivers question by
      implementation); it is the owner's call, tracked as reversal
      `merge-gate-waiver-step-question`.


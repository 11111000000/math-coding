  | waiver-p8-hook-deficit-2026-10 | p8-hook-deficit-2026-10 | 2026-10-18T04:45:00Z | 2027-04-18T00:00:00Z | 177 | in force | in force |
  | waiver-render-module-split-phase1a-2026-10 | render-module-split-phase1a-2026-10 | 2026-10-18T04:45:00Z | 2027-04-18T00:00:00Z | 177 | in force | in force |
  | waiver-site-axiom-img-and-dropdown-2026-10 | site-axiom-img-and-dropdown-2026-10 | 2026-10-18T04:45:00Z | 2027-04-18T00:00:00Z | 177 | in force | in force |
  | waiver-site-dropdown-anim-2026-10 | site-dropdown-anim-2026-10 | 2026-10-18T04:45:00Z | 2027-04-18T00:00:00Z | 177 | in force | in force |

  Migration: NONE. No waiver file is edited, no `expires_at` is
  rewritten, and no subject moves. The only behavioural change in
  the whole tree is that a waiver is no longer in force during its
  own expiry second — one second out of a 165-to-177-day term, and
  zero out of every evaluation anyone has run.

  The seven `open-with-waiver` subjects are unchanged: their
  waivers expire 2027-04-18, and the per-subject `waivers[]`
  entries still name them with `covers[]` exactly as before (4, 7,
  4, 3, 2, 5 and 6 obligations respectively). Exit codes are
  unchanged everywhere: 0 for `pass`/`open-with-waiver`, 1 for
  `block`, 3 for `unknown`, 2 for input errors.

  This decision adds exactly one subject to the corpus, and that
  subject is the `unknown` counted above; no other subject moves.
  That before/after comparison was measured once, at this
  decision; no obligation keeps it, because the corpus's verdict
  moves with the census.

assumptions:
  - id: spec-remains-normative
    state: assumed
    owner: human:maintainer
    statement: |
      `spec/**` stays normative prose that the kernel is expected to
      match, rather than historical prose that records what the
      kernel used to do. Every prior spec edit in this repository
      (e.g. `decisions/spec-prose-corrections-2026-10.yaml`) reads
      it that way. If the owner decides spec files are frozen, the
      correct follow-up is to withdraw (a) and keep the fixture as
      a pure code-side check.
    consequence_if_false: |
      If `spec/**` is frozen, the `spec/semantics.md` edit is
      reverted (see reversal `owner-freezes-spec-files`), the
      kernel change and its tests stand on Invariant 14c alone, and
      the coherence fixture keeps only its kernel-side assertions.
    review_on:
      - signal: owner-freezes-spec-files
        date: 2027-04-18T00:00:00Z
  - id: issued-side-stays-inclusive
    state: assumed
    owner: human:maintainer
    statement: |
      No normative text requires `issued_at < now`, so the start of
      the term stays inclusive. Invariant 14c constrains
      `expires_at` only; §Waivers requires the issue time to be
      IDENTIFIED, not to be exclusive. The asymmetry is recorded in
      both `lib/waiver.ml` and `spec/semantics.md` §Waiver Validity
      so that a future reader does not "harmonise" it by accident.
    consequence_if_false: |
      If some normative text is found to require an exclusive
      start, the change is one operator in `lib/waiver.ml` and the
      `at issued boundary` cases in both unit suites would then be
      the ones failing — they are pinned precisely so that
      correction is visible rather than silent.
    review_on:
      - signal: invariant-14c-amended-to-cover-issuance
        date: 2027-04-18T00:00:00Z

outcomes:
  - id: spec-ships-the-verdict-vocabulary
    statement: |
      `spec/semantics.md` enumerates the four kernel verdicts in
      §Kernel Output, in the `gate` and `self-check` CLI rows and in
      no stale three-value form anywhere; §Kernel Output states the
      verdict→exit table; §Waiver Validity states the half-open
      interval.
  - id: kernel-honours-invariant-14c-at-the-boundary
    statement: |
      `Waiver.effective_at` is `issued_at <= now < expires_at`, so a
      waiver whose `expires_at` equals the evaluation time is not in
      force and cannot produce `Open_with_waiver` or exit 0, while
      the waiver is still in force on the second before its expiry.
  - id: drift-is-a-red-test-not-an-audit-finding
    statement: |
      `tests/fixtures/verdict-vocabulary-spec-coherence.sh` derives
      the vocabulary from `lib/gate.ml` and the interval from
      `lib/waiver.ml` and fails when the spec stops matching either.
      It was verified to fail on three injected divergences (a
      restored three-value enumeration, a dropped `open-with-waiver`
      table row, a reverted expiry comparison).

obligations:
  - id: spec-enumerates-the-four-verdicts
    outcome: spec-ships-the-verdict-vocabulary
    claim: |
      `spec/semantics.md` §Kernel Output tabulates every verdict
      string `lib/gate.ml::verdict_to_string` can emit, no
      three-value enumeration of the self-check verdict survives
      anywhere in the file, and the `self-check` CLI row names all
      four values including `open-with-waiver`.
    acceptance:
      all:
        - verifier: tests/fixtures/verdict-vocabulary-spec-coherence.sh
  - id: spec-states-the-verdict-to-exit-table
    outcome: spec-ships-the-verdict-vocabulary
    claim: |
      `spec/semantics.md` §Kernel Output states `Pass`→0,
      `Open_with_waiver`→0, `Block`→1, `Unknown`→3, matching the
      arms `bin/Mathc.ml::verdict_to_exit` ships, and the `gate`
      CLI row no longer claims an unconditional exit 0.
    acceptance:
      all:
        - verifier: tests/fixtures/verdict-vocabulary-spec-coherence.sh
  - id: spec-states-the-waiver-validity-interval
    outcome: spec-ships-the-verdict-vocabulary
    claim: |
      `spec/semantics.md` §Waiver Validity states
      `issued_at <= t < w.expires_at`, cites Invariant 14c for the
      open upper endpoint, and warns against harmonising it with
      attestation currency in algebra §14.
    acceptance:
      all:
        - verifier: tests/fixtures/verdict-vocabulary-spec-coherence.sh
  - id: waivers-array-is-specified
    outcome: spec-ships-the-verdict-vocabulary
    claim: |
      The `self-check` CLI row documents all six `waivers[]` fields
      (`id`, `issuer`, `issued_at`, `expires_at`, `scope`,
      `covers[]`) and the rule that every other verdict carries an
      empty array.
    acceptance:
      all:
        - verifier: tests/fixtures/verdict-vocabulary-spec-coherence.sh
  - id: waiver-expiry-is-strict-at-the-boundary
    outcome: kernel-honours-invariant-14c-at-the-boundary
    claim: |
      `Waiver.effective_at` returns false at `now == expires_at`,
      true at `now == expires_at - 1s`, false at
      `now == expires_at + 1s`, true at `now == issued_at`, and
      `Waiver.covers` agrees at the expiry second.
    acceptance:
      all:
        - verifier: tests/waiver_test.ml
  - id: verdict-aggregation-honours-the-boundary
    outcome: kernel-honours-invariant-14c-at-the-boundary
    claim: |
      `Gate.aggregate_with_waivers` returns `Unknown` at
      `now == expires_at` and at `now == expires_at + 1s`,
      `Open_with_waiver` at `now == expires_at - 1s`, and
      `Open_with_waiver` at `now == issued_at` (inclusive start).
    acceptance:
      all:
        - verifier: tests/gate/waiver_aggregation.ml
  - id: lapsed-waiver-stops-lifting-through-the-cli
    outcome: kernel-honours-invariant-14c-at-the-boundary
    claim: |
      With the real binary, a synthetic project whose only waiver
      has lapsed reports subject and repository verdict `unknown`,
      exits 3, carries an empty `waivers[]` and still lists the
      cause; the same project with a live waiver reports
      `open-with-waiver`, names the waiver, and exits 0.
    acceptance:
      all:
        - verifier: tests/cli/waiver-expiry-boundary.t
  - id: boundary-tests-detect-both-directions
    outcome: drift-is-a-red-test-not-an-audit-finding
    claim: |
      The boundary tests are not vacuous, and they reject the
      over-correction as well as the original defect. Reverting
      `effective_at` to the inclusive comparison fails
      `tests/waiver_test.ml` (2 assertions) and
      `tests/gate/waiver_aggregation.ml` (1 case); making the
      interval strictly open at BOTH endpoints — the plausible
      over-correction — fails `tests/waiver_test.ml` (1 assertion)
      and `tests/gate/waiver_aggregation.ml` (1 case). The CLI
      fixture was measured green under the inclusive mutant, which
      is stated here rather than hidden: it pins lapse behaviour
      (`unknown`, empty `waivers[]`) and cannot place the
      evaluation time on a chosen instant, because
      `bin/Mathc.ml::now_iso` reads the wall clock and ignores
      `MATH_CODING_FIXED_TIME`. That is why the exact-second
      boundary is owned by the pure unit tests.
      All four numbers were re-measured on 2026-10-22 against
      current `main`, not inherited from the first draft.
      Mutant A (`iso_le ... expires_at`, the original defect) gives
      `tests/waiver_test.ml` 2 failures — `effective_at` at the
      expires boundary and `covers` at the expiry second — and
      `tests/gate/waiver_aggregation.ml` 1 failure, "a waiver does
      not lift a gap at now == expires_at". Mutant B (strictly
      open at BOTH ends) gives 1 failure in each, both on the
      issue side. `dune runtest tests/cli` exits 0 under mutant A,
      which is the honesty cost of pinning lapse behaviour at the
      CLI and is why the mutation probe, not the cram fixture,
      carries this obligation.
    acceptance:
      all:
        - verifier: shell-grep tests/gate/waiver_aggregation.ml a waiver does not lift a gap at now == expires_at
reversal:
  - signal: owner-freezes-spec-files
    condition: |
      The owner decides `spec/**` is frozen prose and that this
      repository's convention of excluding it from kernel fixes was
      right after all. Resolution: revert the `spec/semantics.md`
      edit as one commit, keep `lib/waiver.ml` and the tests (they
      stand on Invariant 14c alone), and keep the fixture with its
      spec assertions removed — the kernel-side checks
      (`lib/waiver.ml` strict bound) remain meaningful without it.
    action: rework
  - signal: a-consumer-needed-the-inclusive-second
    condition: |
      A consumer reports that a gate it relied on flipped from
      `open-with-waiver` to `unknown` at its expiry second.
      Resolution: this is the constitution working, not a
      regression; the consumer should renew the waiver or attest the
      obligation. If the owner disagrees with that reading of 14c,
      amend 14c (proposal in `counterexample` (4)) instead of
      reverting the predicate.
    action: rework
  - signal: evaluation-time-becomes-controllable
    condition: |
      `MATH_CODING_FIXED_TIME` is extended to `self-check` / `gate`
      (it currently only overrides the wall clock for `record` and
      `session-start`). Then the exact-second boundary becomes
      reachable through the CLI and a cram scenario SHOULD be added
      next to `tests/cli/waiver-expiry-boundary.t` asserting
      `unknown` at `expires_at` and `open-with-waiver` at
      `expires_at - 1s`. Tracked, not done here: changing which
      clock a command reads is a behaviour change of its own.
    action: attest
  - signal: merge-gate-waiver-step-question
    condition: |
      The owner rules on whether a waiver is permitted ("MAY permit
      a gate") or required ("A merge with a Waiver MUST report
      `open-with-waiver`") at `mathc gate`. Resolution: if required,
      `do_gate` gains the waiver load and the
      `aggregate_with_waivers` step that `self-check` already has,
      which moves waived merges from exit 3 to exit 0 — a real
      gate-relaxation change that needs its own decision, fixtures
      on both sides, and a migration note for CI scripts gating on
      `mathc gate`'s exit code. If permitted-but-not-required, the
      second known deviation in §Kernel Output is deleted and §Merge
      Gate's MUST is reworded to match. Either way the deviation is
      removed from the spec in the same commit that resolves it.
    action: rework
  - signal: owner-answers-the-release-gate-question
    condition: |
      The owner rules on the §Release Gate verdict list and on
      algebra §15's missing waiver branch (proposals in
      `counterexample` (3)). Resolution: apply the owner's wording
      in its own decision with a `spec/**` scope entry, then extend
      the coherence fixture to assert the release verdict list too.
    action: rework
  - signal: empty-change-set-pass-is-pursued
    condition: |
      The owner decides to close the `mathc gate` empty-change
      deviation recorded in the spec's Kernel Output section (a
      `pass` verdict beside 93 unmet gaps, exit 0). Resolution: a
      kernel fix, not a spec fix, with the shape decided by the
      owner — either an empty changed-path set yields `unknown`
      rather than `pass`, or the gate omits `gaps[]` when it takes
      the shortcut.
    action: rework

risk:
  declared_triggers:
    - owner-freezes-spec-files
    - a-consumer-needed-the-inclusive-second
    - evaluation-time-becomes-controllable
    - merge-gate-waiver-step-question
    - owner-answers-the-release-gate-question
    - empty-change-set-pass-is-pursued
  drift_recurs: |
    The laundering class this repository keeps rediscovering has now
    produced three instances, each in a different component: an
    EMPTY obligation set reported as `pass`
    (`path-probe-anchoring-2026-11`), a WAIVED obligation set
    reported as `pass` (`self-check-waiver-verdict-coherence-2026-10`),
    and — found while writing this decision and NOT fixed here — an
    EMPTY changed-path set reported as `pass` by `mathc gate`.
    Measured on this tree: `mathc gate HEAD HEAD` prints
    `"verdict":"pass"` next to `obligations: 786` and 118 gaps and
    exits 0, because `lib/gate.ml::evaluate` takes the
    `| [], _ | _, 0 -> Pass` arm while still enumerating every gap.
    The invariant is the same in all three: the verdict string and
    the evidence beside it must not disagree. The guard against a
    fourth shape is the spec table plus the recorded deviation; the
    code-side guard does not exist yet and is the owner's call.

    Found while measuring, pre-existing, NOT fixed here:
    `lib/domain.ml:281` declares
    `type gate = Open | Open_with_waiver of id list | Blocked of gap
    list`, which nothing in the repository constructs or matches,
    and `lib/packages.ml:61` states that the waiver consult step
    "is wired into `lib/gate.ml::gate_v32` as `Open_with_waiver`".
    `gate_v32` takes no waiver argument and returns
    `Pass | Block | Unknown`; the consult actually happens in
    `Gate.aggregate_with_waivers` and `bin/Mathc.ml`. So the comment
    describes a wiring that does not exist, and the type describes a
    vocabulary (`Open`/`Blocked`) that differs from both
    `lib/gate.ml::verdict` and algebra §15. Left alone: deleting a
    public type is a bigger step than this decision's mandate.

    The same comment is wrong in a second way, and this one has
    consequences: the waiver mechanism is wired into ONE of the two
    verdict-producing commands. Measured on a synthetic project
    whose single obligation is covered by an in-force waiver,
    `mathc self-check` reports `open-with-waiver` and exits 0 while
    `mathc gate HEAD~1 HEAD` on the same project reports `unknown`
    and exits 3 — `Gate.aggregate_with_waivers` is called from
    `bin/Mathc.ml::evaluate_decision` (self-check only) and from
    nowhere else. So §Merge Gate's "MUST report `open-with-waiver`"
    has no implementation at the merge gate, and §Waivers' "MAY
    permit a gate" and §Merge Gate's MUST disagree about whether a
    waiver is optional there. Recorded as the second known
    deviation in §Kernel Output. Wiring it is a gate-relaxation
    change — exit 3 becomes exit 0 on waived merges — so it is a
    decision of its own; see reversal
    `merge-gate-waiver-step-question`.

  measurement_traps: |
    Four environment facts cost real time while measuring this
    decision and will cost it again; all four are recorded so the
    next run does not rediscover them.

    (0) THIS FILE WAS ITSELF SILENTLY TRUNCATED, and the only
    reason it was caught is that a structural check failed. One
    line of the `counterexample` block scalar — the `(5) "The merge
    gate never reports ...` line — sat at indent 0 while every one
    of its 128 sibling lines sat at indent 2 or more. A `|` block
    scalar ends at the first line less indented than its body, so
    that line terminated `counterexample`, `parse_yaml_pairs` then
    met a token it could not type and returned early, and EIGHT
    top-level keys were dropped without a word:
    `scope`, `changed-verdicts`, `assumptions`, `outcomes`,
    `obligations`, `reversal`, `risk` and `relations`. What the
    operator saw was `MC-DECISION-INVALID: missing required field:
    scope` — one missing field, when in fact 8 of the document's
    21 top-level keys were gone. Isolated by deleting each line of
    the block in turn and re-validating: deleting that single line
    alone restores the parse. The general lesson, and it is why
    `decisions/duplicate-mapping-keys-silent-drop-2026-10.yaml`
    exists: a mis-indented block-scalar line is a silent
    truncation, and no warning names it. Note that
    this instance produced NO `MC-UNPARSED-TAIL` — the loader had
    consumed every byte, into the wrong tree. Check the shape of a
    decision before believing what the kernel says about it.

    (1) A `mathc` on `PATH` is NOT the built kernel.
    `/home/az/.local/bin/mathc` is dated 2026-10-18 and predates the
    `waivers[]` array entirely. `dune runtest tests/cli/X.t` does not
    build the `@install` alias, so after `dune clean` the cram
    sandbox can find no built `mathc` and inherits that stale one
    from `PATH`. Measured: a mutation probe reported a "failure"
    that was really the October binary answering with a JSON shape
    from before this feature set. Always `dune build @install`
    before `dune runtest`, and verify with
    `./_build/install/default/bin/mathc version`.

    (2) `dune runtest` writes 776 ignored attestation files.
    `.gitignore:37` ignores `attestations/t1-2-A0-*.json`, and a
    cram run leaves ~776 of them behind, so `ls attestations`
    reads 1536 while `git ls-files attestations` reads 760. A
    `self-check` run afterwards counts that uncommitted data and can
    go green for reasons that are not on disk. Clean before
    measuring: `git clean -Xdf attestations/`.

    (3) `dune build @runtest` is flaky in this environment and so
    is NOT a baseline. On the untouched tree (e587c81, stashed
    changes) it exits 1 with `repo_structure.exe` and
    `render_kernel.exe` internal errors, and on the same tree it
    picked a different pair of failures on a second run. Each
    suite passes when run on its own via `dune exec`. The reason is
    recorded upstream in
    `decisions/disable-hanging-alcotest-tests-2026-10.yaml`.
  owner: human:maintainer


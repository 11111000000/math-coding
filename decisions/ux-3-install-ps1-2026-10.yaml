  - id: ps1-docs
    outcome: windows-one-liner-installer
    claim: |
      `QUICKSTART.md`, `USAGE.md`, and `site/install.md`
      document the `irm … | iex` path for Windows.
    acceptance:
      all:
        - verifier: manual-grep-l-install-ps1-quickstart-md-usage-md-site-i
          result: pass


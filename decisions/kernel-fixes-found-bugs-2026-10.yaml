outcomes:
  - id: adopt-stays-in-target
    statement: |
      `mathc adopt DIR` writes the scaffold and the imported ADRs into
      DIR, never into the repository the operator is standing in.
  - id: one-layout-per-project
    statement: |
      The decisions dir, the attestations dir and the policy path of a
      project always resolve within the same layout.
  - id: clean-io-diagnostics
    statement: |
      An unwritable or missing output directory exits 2 with the path
      in the message instead of `mathc: internal error`.
  - id: store-stays-clean
    statement: |
      A manifest header row or an out-of-enum kind never produces a
      file in the attestation store.

counterexample: |
  "The resolver now reads `$MATH_CODING_ROOT`, so two commands run in
  the same directory can resolve different projects depending on an
  environment variable inherited from a shell profile." This is true
  and is the cost of B3. The counter is that the variable already had
  exactly this authority over `find_project_root` (bin/Mathc.ml:1046)
  and over `new-decision` (lib/new_decision/new_decision.ml:317);
  before this commit the kernel was inconsistent, not pure. A command
  that honours the variable in three places and ignores it in the
  fourth is harder to reason about than one that honours it in all
  four.

  "The 16 green fixtures were fixed by editing what they expect."
  Partly true and worth naming: they were edited only where the
  kernel's behaviour was independently justified — the `parse-ok`
  rename carries a commit message and appears in ten other fixtures
  already updated by it; `install.sh` mode 100644 is objectively
  wrong for a script the docs tell users to execute; the heredoc
  delimiter bug is a shell-semantics error, not a preference. Where
  the kernel's behaviour was *not* independently justified
  (`gate-*.t` counts, `risk-bucketing`'s `mode:`), the fixture was
  left red on purpose.

  What would change the verdict: a user who relies on running the
  binary from inside project A against project B via the cwd, with no
  `MATH_CODING_ROOT`, and finds that B now resolves B. That is
  exactly the ambiguity the fix removes; if it is someone's intended
  workflow, the fix is wrong and this decision is the place to say so.

assumptions:
  - id: legacy-layout-is-data
    state: assumed
    statement: |
      A directory that already contains `decisions/` or
      `attestations/` is a pre-3.4 project whose layout must be kept.
    owner: human:maintainer
    consequence_if_false: |
      `layout_of` returns `Legacy` for a scratch directory that
      happens to contain an unrelated `adr/`-like folder, and
      `mathc init` scaffolds the legacy tree. The cost is cosmetic
      (`.math-coding/` vs `decisions/`) and reversible by deleting the
      tree.
    review_on:
      - signal: init-chooses-legacy-for-a-greenfield-project
  - id: math-coding-root-is-a-real-root
    state: assumed
    statement: |
      When `$MATH_CODING_ROOT` names an existing directory, that
      directory is the math-coding project root — no `dune-project`
      required.
    owner: human:maintainer
    consequence_if_false: |
      Resolution silently reverts to the cwd for every resolver
      consumer, and B3 returns as a latent bug. `find_project_root`
      keeps its stricter `dune-project` requirement; the two now
      differ deliberately, which is recorded in the resolver's
      comment.
    review_on:
      - signal: root-resolution-diverges-from-find-project-root

obligations:
  - id: attest-batch-resolves-and-diagnoses
    claim: |
      `mathc attest-batch` resolves input and output through the
      resolver, creates parent directories, skips a TSV header row,
      validates `kind_`/`result` against the schema enums, and exits 2
      with the path on an unwritable destination.
    outcome: acceptance
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-out-dir.t
  - id: resolver-answers-about-the-target
    claim: |
      `mathc init DIR` scaffolds `DIR` (not the caller's cwd), the
      three resolved paths share one layout, and `$MATH_CODING_ROOT`
      scopes the resolver for path-less commands.
    outcome: acceptance
    acceptance:
      all:
        - verifier: tests/cli/init-layout-coherence.t
        - verifier: tests/path_config_test.exe
  - id: adopt-stays-inside-the-target
    claim: |
      `mathc adopt DIR` writes the scaffold, the imported ADRs and the
      arc42 side-decision into DIR, and does not touch the caller's
      repository.
    outcome: acceptance
    acceptance:
      all:
        - verifier: tests/cli/adopt.t
        - verifier: tests/cli/import-adr.t

reversal:
  - signal: adopt-writes-where-it-did-before
    condition: |
      A maintainer reports that `mathc adopt DIR` must keep writing
      relative to the caller's cwd — for example a workflow that
      adopts several projects into one shared store. Resolution: a
      follow-up decision adds an explicit `--store=PATH` flag so the
      behaviour is requested rather than inherited, and this
      decision's revision goes to `state: superseded`.
    action: rework
  - signal: env-root-surprise
    condition: |
      `$MATH_CODING_ROOT` inherited from a shell profile changes the
      target of a command that takes no path, and a user is bitten by
      it. Resolution: drop the `$MATH_CODING_ROOT` tier from
      `effective_root` and keep only the explicit `?root`; the
      callers that need it (init, adopt) already pass one.
    action: rework


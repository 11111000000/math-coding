intent: |
  Six defects found while landing `solo-default-on-2026-10@1`, of
  which three are data-integrity bugs rather than cosmetics, fixed as
  one batch because they share a root cause: the kernel asks "which
  project is this?" in several places, and the answers disagreed.

  B1 (resolver scope). `lib/path_config.ml` ran its existence checks
  against the process cwd. `mathc init /srv/app`, launched from a
  directory that contained a legacy `decisions/`, scaffolded the
  LEGACY tree inside `/srv/app` — the opposite of the v3.4 contract
  the resolver's own comment states. `?root` makes the question about
  the project being operated on.

  B2 (layout coherence). The three resolvers asked three independent
  questions. A directory with `decisions/` but no
  `decisions/decision.yaml` resolved decisions to the legacy path and
  the policy to the new default: half a project in each layout.
  `layout_of` decides once per project.

  B3 ($MATH_CODING_ROOT ignored). `find_project_root` anchored
  several code paths on `$MATH_CODING_ROOT`; the resolver did not.
  `MATH_CODING_ROOT=<repo> mathc gate` therefore evaluated an empty
  project — 0 obligations against a repository holding 199 decisions
  — and six gate fixtures went red asserting a count they could no
  longer produce.

  B4 (adopt wrote into the caller's repository). `mathc adopt DIR`
  shells out to `init` and `import-adr`. `init` honoured DIR;
  `import-adr` resolved the decisions dir against the caller's cwd.
  Adopting a project from inside another repository imported the
  project's ADRs into that other repository. Verified: before this
  commit, `mathc adopt $d` from the repo root left
  `.math-coding/decisions/1-*.yaml` in the repo. `MATH_CODING_ROOT`
  is now exported to both children, and the arc42 side-decision —
  which hardcoded `<target>/decisions/...` and crashed with an
  uncaught `Sys_error` when that directory did not exist — resolves
  through the same layout.

  B5 (attest-batch). The subcommand bypassed `lib/path_config.ml`
  entirely (its comment admitted the debt), so in a legacy-layout
  project `--from=decisions` found nothing and the default output
  went to a second, empty `.math-coding/attestations` tree. Its
  `Unix.mkdir` was single-level with the error swallowed, so a
  missing parent produced `mathc: internal error:
  Unix.Unix_error(ENOENT, "mkdir", ...)` — exit 3 on a fresh project.
  A TSV header row was parsed as data, emitting
  `decision_id-obligation_id.json`: an attestation naming a decision
  that does not exist. `kind_` and `result` are now checked against
  the schema enums at the manifest boundary instead of being written
  and rejected later.

  B6 (test-suite rot, the class that hides B1-B5). The cram suite had
  51 red fixtures at the baseline, so it verified nothing. Composition
  of that baseline: 13 `accept:` fixtures stale against the
  deliberate `accept`→`parse-ok` rename in commit `a602b361` (which
  `spec/semantics.md` also never learned about); 5 fixtures with
  literal `/tmp/nix-shell.XXXX/...` paths in their expected output,
  which dune 3.23.1's vendored cram cannot match because it has no
  `(glob)`; one heredoc using an unquoted `<<EOF` delimiter, so a
  backticked `` `mode: considered` `` in the fixture body was executed
  by the shell (`mode:: command not found`); one forge-verify fixture
  racing a stub server with `sleep 0.2`; `scripts/install-tooling/
  install.sh` committed mode 100644, so every fixture that executes it
  got exit 126.

  2026-11: the decision that landed the adopt subcommand was deleted
  from the corpus on 2026-10-29, so the relation that named it is gone. The
  subcommand is in the tree and this decision's own obligations cover it
  (tests/cli/adopt.t); the trail is in git history.

axiom_link:
  - A0
  - A3
  - A4

antithesis: |
  The counter-position considered and rejected: "the resolver is pure
  and cwd-relative by design; adding `?root` and `$MATH_CODING_ROOT`
  turns a 40-line pure function into an environment-dependent one, and
  the fixtures were wrong, not the kernel." The first half is true —
  the resolver does now read one more environment variable, and that
  is a real cost, paid deliberately. The second half does not hold:
  B1 and B4 are not fixture disagreements. `mathc adopt DIR` writing
  into the caller's repository is a data-integrity defect that no
  amount of fixture rewriting would have surfaced, and B5's crash on
  a fresh output directory is the first thing a new adopter hits.

  The weaker version — "fix the fixtures, leave the resolver" —
  would have turned 13 red files green while leaving a kernel that
  writes to the wrong repository. Green tests are not the goal;
  correct behaviour that the tests then describe is.

commitment: |
  1. `lib/path_config.ml` gains `?root` on the three resolvers, an
     `effective_root` that prefers `?root` then `$MATH_CODING_ROOT`
     (when it names an existing directory), a `layout_of` that decides
     the layout ONCE per project, and `*_at` variants that return a
     root-joined path for callers that do not compose one themselves.

  2. `lib/init/init.ml` passes `~root` to the resolver, so
     `mathc init DIR` scaffolds `DIR` and reports the layout it used.

  3. `bin/Mathc.ml::do_adopt` exports `MATH_CODING_ROOT=<target>` to
     both child commands and writes the arc42 side-decision through
     the resolved decisions dir (with `mkdir -p`) instead of a
     hardcoded legacy path.

  4. `bin/Mathc.ml::do_attest_batch` resolves both its input and its
     output through the resolver, creates parents with `ensure_dir`,
     and reports every I/O failure as exit 2 with the path.

  5. `lib/attestations/batch.ml` skips a documented header row and
     validates `kind_` and `result` against the schema enums.

  6. `lib/import_adr/import_adr.ml` writes through
     `decisions_dir_at` and creates parents recursively.

  7. `spec/semantics.md` §Validate records the `parse-ok` verdict and
     cites the commit that introduced it.

  8. Cram CLI baseline 51 → 35 (unique `tests/cli/*.t` files): `attest-batch`, `counterexample-warning`,
     `counterexample-warn`, `embedded-schemas`, `import-adr`,
     `init`, `init-agent`, `init-defaults`, `init-legacy`,
     `init-scope-language-agnostic`, `malformed-acceptance`,
     `path-config-fallback`, `render`, `validate-considered-antithesis`,
     `validate-counterexample-required`, `yaml-parser` now pass.

  Boundaries (A3 self-application):

  - The remaining 35 red CLI fixtures are NOT addressed here. They are
    count drift (`obligations: 183` vs 672 today), stale digest and
    spec-line pins, and genuine behaviour changes needing individual
    judgement (`mode: standard` → `tiny`, `doctor` pass → warn,
    `counters` array length, `mcp.t` losing a diagnostic). Naming
    them in a commit that fixes other things would be laundering, not
    fixing; they belong to the test-hardening cycle the CHANGELOG
    already names (`plan-2026-12-test-hardening`).
  - `tests/cli/gate-*.t` still fail. The resolver fix makes the gate
    see 672 obligations where it saw 0 — verified by hand and by a
    byte-identical copy of `gate-pass.t` that passes — but the
    original file reproduces 0 under `dune test --force` and the
    discrepancy is NOT explained. Until it is, the count in those
    fixtures is not updated on the strength of a copy.
  - `layout_of` deliberately lets `.math-coding/` win over a legacy
    tree (forward path, no auto-migration), matching the documented
    backward-compatibility contract in `adoption/SKILL.md`.
  - No fixture was auto-promoted. Every changed expectation was read
    against the kernel's actual behaviour first.


risk:
  declared_triggers:
    - "a waiver family document that the waiver parser rejects for a
      different reason (a scope the kernel cannot read) is now
      rejected too, and its author sees a message about the waiver
      rather than about the decision"
    - "the obligations family keeps the looser dispatch, and a
      malformed aggregator is still accepted"
  owner: human:maintainer

counterexample: |
  "The dispatch on the schema name exists precisely so that files
  which are not decisions are not held to the decision's rules.
  Parsing them with their own parser breaks that."

  The dispatch is not weakened: it still routes the waiver and the
  obligations families AWAY from the decision parser, which is what it
  was for. What it wrongly did was route them away from EVERY
  parser -- the family's own rules included. A document is held to
  the rules of its family; a waiver is held to the waiver's rules, and
  one of those rules is that a grant expires.

antithesis: |
  The opposite claim is that the corpus is a TEST FIXTURE and the
  fixture is what is wrong: a waiver without an expiry is a legal
  document, and the fixture should say so.

  The schema settles it: `schemas/waiver.json` requires
  `expires_at`, lib/waiver.ml lists the validity interval among the
  four required bounds, and Invariant 11 names the validity interval
  as one of the bounds a waiver MUST respect. A grant that never
  expires is not a bound grant, it is a permanent exemption with a
  name on it. The fixture is right, and it was right when it was
  written.

axiom_link:
  - A0
  - A1

intent: |
  A WAIVER IS A GRANT, AND A GRANT WITHOUT A VALIDITY INTERVAL IS NOT
  A GRANT. `expires_at` is one of the four required bounds
  (lib/waiver.ml: the interval, the scope, the issuer and the
  subject), and Invariant 11 says a waiver MUST apply only to its
  named gap, scope, revisions, gate and validity interval.

  The kernel's validator did not enforce it. `mathc validate`
  dispatched on the top-level `schema:` field: a file whose schema
  names the waiver family was accepted on the strength of its NAME,
  with the waiver's own fields never parsed. A waiver with no
  `expires_at` was accepted.

  The project's own conformance corpus said otherwise and had said
  so for a long time:
  `fixtures/conformance/waiver/negative-missing-expiry.json` -- a
  waiver with no expiry, whose NAME says it must be rejected. It was
  never checked by anything that ran in CI: the corpus was walked by
  the TEST SUITE, where the waiver family is parsed by a different
  path, and the self-check did not look at the corpus at all.

  The new subject set (decisions/self-check-subject-set-2026-10)
  walks the corpus as a subject set of its own, and the corpus
  immediately said what it had been saying: the fixture is accepted
  and must not be.

commitment: |
  1. `mathc validate` parses a waiver before accepting it. A waiver
     that does not parse is rejected, with the missing field named.
  2. The conformance corpus is checked against its own names: a
     `negative-` fixture that is accepted fails the self-check, and a
     `positive-` fixture that is rejected fails it too.
  3. The dispatch that skips the DECISION parser for the waiver and
     obligations families is kept -- those files legitimately lack
     the decision's fields -- but it no longer skips the family's own
     parser.

outcomes:
  - id: a-waiver-without-an-expiry-is-rejected
    statement: |
      `mathc validate fixtures/conformance/waiver/negative-missing-expiry.json`
      exits 1 and names the missing field.
  - id: the-corpus-is-checked
    statement: |
      The self-check's conformance subjects cover every fixture in the
      corpus, and the corpus is green.

scope:
  paths:
    - "bin/Mathc.ml"
    - "decisions/waiver-missing-expiry-rejected-2026-10.yaml"
  exclusions:

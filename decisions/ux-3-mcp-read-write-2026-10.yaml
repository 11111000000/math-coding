outcomes:
  - id: read-write-methods-exposed
    statement: |
      `mathc_mcp` exposes `mathc/gate`, `mathc/attest`,
      `mathc/record`, `mathc/re-evaluate-decisions` in
      addition to the seven read-only methods. Methods
      not in the allowlist still return -32601 Method
      not found.
  - id: error-message-updated
    statement: |
      The error message for unknown methods lists the
      full set of allowlist names (read + read-write).
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-mcp-read-write-2026-10.yaml` exits 0.

assumptions:
  - id: mcp-stdio-is-local
    state: assumed
    statement: |
      The MCP server's stdio transport is local: the
      caller is a process on the same host, started by
      the same user. There is no remote attacker model;
      the trust boundary is the user's process tree.
    owner: human:maintainer
    consequence_if_false: |
      If MCP is ever exposed over a network (e.g. via a
      WebSocket transport), the read-write methods become
      a remote attack surface. Resolution: gate the
      read-write methods behind a separate allowlist
      (`MCP_READ_WRITE=off` env var) and document the
      transport contract in `lib/mcp/transport.ml`.
    review_on:
      - signal: mcp-transport-network
  - id: mathc-cli-bounded
    state: assumed
    statement: |
      The four mathc subcommands the MCP server shells
      out to (`gate`, `attest`, `record`,
      `re-evaluate-decisions`) are bounded by the mathc
      CLI's existing contracts. The agent cannot invoke
      subcommands the CLI doesn't expose; it cannot
      bypass the attestation store; it cannot write to
      arbitrary files.
    owner: human:maintainer
    consequence_if_false: |
      If a future mathc subcommand is added that has
      unbounded side effects, the MCP allowlist must
      reject it explicitly. The fixture
      `tests/cli/mcp-read-write.t` does not assert this
      — it only asserts the four named methods work.
      Resolution: add a `tests/cli/mcp-no-broad-allow.t`
      fixture that lists every mathc subcommand and
      asserts the MCP server only exposes the
      allowlist subset.
    review_on:
      - signal: new-unbounded-mathc-subcommand

obligations:
  - id: cram-test-passes
    outcome: read-write-methods-exposed
    claim: |
      `tests/cli/mcp-read-write.t` exercises the four
      new methods and asserts they are in the allowlist
      (return a JSON-RPC success response). It also
      asserts that an unknown method returns -32601 and
      that the error message lists the new methods.
    acceptance:
      all:
        - verifier: tests/cli/mcp-read-write.t
          result: pass

  - id: this-decision-validates
    outcome: this-decision-validates
    claim: |
      `mathc validate
      decisions/ux-3-mcp-read-write-2026-10.yaml` exits 0.
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-mcp-read-write-2026-10.yaml
          result: pass

reversal:
  - signal: mcp-read-write-removed
    condition: |
      The read-write surface is rolled back (e.g. due
      to a discovered unbounded side effect or a
      security review finding). Resolution: revert
      `lib/mcp/dispatch.ml` to the 7-method allowlist;
      this decision is superseded.
    action: supersede-with-read-only
  - signal: mcp-transport-network
    condition: |
      The MCP transport changes from stdio to a network
      protocol (e.g. WebSocket, HTTP). Resolution: gate
      the read-write methods behind a separate env var
      (`MCP_READ_WRITE=off` by default) and re-record the
      allowlist in the decision.
    action: rework

risk:
  declared_triggers:
    - mcp-transport-network
    - new-unbounded-mathc-subcommand
    - agent-bypasses-attestation-store
  owner: human:maintainer


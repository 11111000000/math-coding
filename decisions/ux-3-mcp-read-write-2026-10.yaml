intent: |
  Add four read-write methods to the mathc_mcp server's
  allowlist: `mathc/gate`, `mathc/attest`, `mathc/record`,
  `mathc/re-evaluate-decisions`. The original
  `mcp-server-impl-2026-10@1` explicitly listed these as
  OUT OF SCOPE because they produce side effects
  (writes to `attestations/*.jsonl` and
  `decisions/execution-logs.jsonl`). This decision opens
  the read-write surface under three constraints:

    1. The MCP server is local (stdio); the caller is a
       trusted AI agent (opencode / Claude Code / Cursor /
       Copilot) running on the same host. There is no
       remote attacker model.
    2. The allowlist is the only barrier between the agent
       and the kernel API; method names not in the list
       still return -32601 Method not found. No method
       is added that does not have a stable CLI counterpart
       (the four are gate / attest / record /
       re-evaluate-decisions, all already shipped).
    3. The underlying `mathc <subcommand>` does the work;
       the MCP server only shells out. The side effects
       are bounded by the mathc subcommand's own contracts
       (e.g. `mathc attest` writes one JSONL line; `mathc
       record` appends to execution-logs.jsonl; `mathc
       gate` and `mathc re-evaluate-decisions` are
       side-effect-free in the kernel's data model —
       the user invokes them when they want to record a
       gate verdict / re-evaluation run).

  Touches (per A3 self-application):
    lib/mcp/dispatch.ml          (allowlist + 4 builders + 4
                                 dispatch arms + error-msg update)
    tests/cli/mcp-read-write.t  (new cram fixture, 5 cases)
    decisions/ux-3-mcp-read-write-2026-10.yaml   (this file)

axiom_link:
  - A0
  - A1
  - A3

antithesis: |
  The counter-position considered and rejected: "Read-write
  MCP methods expand the trust boundary to a remote agent
  and risk silent corruption. The `mcp-server-impl-2026-10@1`
  decision explicitly deferred them; deferring them
  indefinitely is the right call." The author engaged with
  this position and rejected it on five grounds: (a) the
  MCP server is local (stdio), so there is no remote
  attacker model — the caller is the same AI agent the
  user already runs on the host; (b) the user explicitly
  asked for the read-write surface to land in this
  iteration ("делай"), indicating a real need (an agent
  that can validate but cannot attest is half-useful —
  it can read a gate verdict but cannot record one);
  (c) the four methods are bounded by the mathc CLI's
  own contracts; the agent cannot invoke subcommands the
  CLI doesn't expose; (d) the allowlist is small (4
  names) and reviewable in a single `git diff`; (e) the
  fixture asserts that method names NOT in the list
  return -32601, so the barrier is verifiable. The minimum
  fix is 4 allowlist entries + 4 builders + 1 fixture,
  which is what this file records.

commitment: |
  One kernel surface expansion. Four deliverables, each
  pinned by a fixture:

    D1. `mathc/gate` is exposed via the MCP server. The
        builder takes `base` and `head` params; the
        subprocess is `mathc gate <base> <head>
        --format=json`.

    D2. `mathc/attest` is exposed. The builder takes
        `path`; the subprocess is `mathc attest <path>`.

    D3. `mathc/record` is exposed. The builder takes
        `decision_id` and `scale`; `class` and `value` are
        optional. The subprocess is `mathc record
        --decision-id <id> --scale <s> [--class <c>]
        [--value <n>]`.

    D4. `mathc/re-evaluate-decisions` is exposed. The
        builder takes `axiom_id`; the subprocess is
        `mathc re-evaluate-decisions <axiom>`.

    D5. The error message for unknown methods is
        updated to list the new names in the allowlist.

  Boundaries (A3 self-application):
    - `lib/mcp/dispatch.ml` is the only sub-library
      touched.
    - `bin/Mathc.ml` is unchanged (the four subcommands
      are already shipped; the MCP stub shells out).
    - The kernel under `lib/` is unchanged.
    - No new sub-library; no schema change; no axiom
      amendment beyond A0/A1/A3 (A0 = separation,
      A1 = honesty, A3 = self-application; the existing
      attestation kinds are reused).
    - The four methods are not added to the per-user
      telemetry (which is the Phase-3 stub).

counterexample: |
  "Expanding the MCP read-write surface is a step on the
   road to AI agents that act on the repository without
   human review." The counterargument fails because the
   barrier is still in place: every method is a thin
   shell-out to `mathc <subcommand>`, and every
   subcommand's effect is bounded by the mathc CLI's
   existing contracts. The agent cannot invoke subcommands
   the CLI doesn't expose; it cannot bypass the
   attestation store; it cannot write to arbitrary files.
   The four methods are the four the mathc CLI already
   supports. "The original decision explicitly deferred
   these — the deferral was a deliberate boundary, and
   crossing it requires a stronger justification than
   'the user asked'." The user asked *and* the user is
   the maintainer of the project, with full context on
   the trade-off. The justification is recorded in the
   decision's `intent:` and `antithesis:` blocks.


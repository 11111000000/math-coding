reversal: |
  If a future refactor renames the subcommand or splits it
  into multiple subcommands, this decision is revertable in
  one commit: rename the dispatcher arm + the test file +
  the help-text block back to the pre-fix (`mathc: unknown
  command: attest-batch`) shape, then `dune promote` the
  cram snapshot. The `ux-3-attest-batch-subcommand` decision
  records the original implementation; nothing here is
  net-new surface.

axiom_link:
  - A0
  - A1

intent: |
  `Sys.is_directory` RAISES. On a path that does not exist, OCaml's
  `Sys.is_directory` raises `Sys_error "No such file or directory"`
  -- it does not answer `false`. (`Sys.file_exists` answers false;
  `Sys.is_directory` raises. The project's own traps fixture
  documents this: tests/traps.ml §11.11 "Sys.is_directory raises
  Sys_error on a non-existent path".)

  Seven places in this repository asked a directory a question with
  the wrong operator. Two of them are in the KERNEL:

    - lib/path_config.ml::resolve_with -- `MATH_CODING_ROOT` that
      points at a directory which does not exist crashed the tool
      instead of falling through to the next layout;
    - bin/Mathc.ml::root_with_env_precedence -- the same crash, on
      the same variable, on the other path to the same answer.

  The rest were in the tests, and they are what made this visible:
  the store is GENERATED now, so a checkout has no `attestations/`
  until the sweep runs, and every test that asked "is the store a
  directory?" crashed instead of saying "there is no store here".
  CI failed eight consecutive runs on exactly this, while the same
  tree passed locally -- locally the developer has a store on disk
  from the last sweep, and CI does not.

  That is the whole shape of the defect: a question whose answer
  "does not exist" is a legitimate answer, asked with an operator
  that treats it as an error. The corpus was taught the difference
  in a fixture and the code did not learn it.

commitment: |
  1. Every `Sys.is_directory` on a path that may be absent is
     preceded by `Sys.file_exists` on the same path.
  2. A missing artefact is an EMPTY RESULT, not an exception:
     no store means no evidence, no axioms directory means no
     axioms, and a root that does not exist means the next layout
     is tried.
  3. The two kernel paths (`MATH_CODING_ROOT` resolution) answer
     with the layout they can serve, and never crash on a root the
     operator pointed at by mistake.

outcomes:
  - id: a-missing-directory-is-an-empty-result
    statement: |
      With the store absent, with the axioms directory absent and
      with `MATH_CODING_ROOT` pointing at a path that does not
      exist, every command answers instead of raising.
  - id: the-suite-is-the-same-without-a-store
    statement: |
      `dune test` passes on a checkout with no generated store,
      which is the state of every fresh CI checkout.


risk:
  declared_triggers:
    - "the check is written as `Sys.file_exists p && Sys.is_directory p`
      on one line and later someone reorders it into
      `Sys.is_directory p && Sys.file_exists p` -- the order matters,
      because is_directory raises before the second operand is read"
    - "a new call site uses `Sys.is_directory` without the guard, and
      the tree it asks about is absent only on CI"
  owner: human:maintainer

counterexample: |
  "`Sys.is_directory` raising on a missing path is documented
  behaviour, and a tool that is pointed at a directory that does not
  exist SHOULD fail loudly -- a typo in MATH_CODING_ROOT should not
  be silently ignored."

  The objection is right about the OPERATOR's typo and wrong about
  the mechanism. A typo in `MATH_CODING_ROOT` must be loud, and it
  is: the resolver falls through to the next layout, the tool runs
  against the project it can find, and the layout it chose is
  reported. What the objection misses is that the same question is
  asked of artefacts the operator never named: the store, the axioms
  directory, the decisions directory. Those are not operator typos;
  they are states. A tree with no store is a tree where the sweep
  has not run, and the answer the tool owes is "no evidence here",
  not a stack trace from a directory walk.

antithesis: |
  The opposite claim is that the guards are noise: the store is
  generated in CI before the tools that read it, the axioms directory
  is in every checkout, and `MATH_CODING_ROOT` is set by a human
  who means it.

  That is the world before the store was generated, and it is why
  the defect was invisible: every directory the code asked about
  happened to exist on the machine where the code was written. The
  moment one of them can legitimately be absent -- and the store
  becoming a generated artefact made exactly that true -- the same
  question broke eight CI runs in a row while the developer machine
  stayed green. The guard is not noise; it is the difference between
  a tool that answers and a tool that crashes on a state it will
  meet again.

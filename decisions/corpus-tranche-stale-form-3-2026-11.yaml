      tranche 2 (already rewritten before this tranche):
        legacy-attestation-debt-2026-10
        mathc-packages-subcommand
        mathjax-delimiter-hardening-2026-10
        migration-mechanism-2026-10
        multi-policy-hierarchy-2026-10

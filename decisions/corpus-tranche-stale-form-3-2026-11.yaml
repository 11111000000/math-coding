intent:
  source: "task:T2.2b tranche 3 of 3 (the eleven STALE-FORM decisions named in docs/corpus-claims-inventory-2026-11.md sections 6.24 to 6.34)"
  text: |
    Tranche T2.2b of the redundancy-and-portability plan, part 3 of 3:
    eleven live decisions whose claim was still true and whose form had
    gone stale.

    THE RULE. The substance of each promise stays. The form becomes
    current. A path that moved is re-pointed at the file or symbol that
    exists; a count that changed becomes the invariant the count stood
    for; a sentence about the past becomes a dated record or a current
    rule; an unread YAML tail is repaired without dropping a field. No
    promise was weakened to make it true. All eleven were changed; none
    needed the judgment-call stop.

    WHAT WAS REWRITTEN, AND HOW IT WAS MEASURED. Every statement below
    was checked on this worktree on 2026-10-31. The command is named so
    another reader can rerun it.

    1. render-ordered-lists-2026-10. The parser that owns the promise
       moved from `lib/render.ml` to `lib/render/render_md.ml`; the agent
       protocol moved from `AGENTS.md` to `KERNEL_AGENTS.md`; the trap log
       moved from `OCAML_BEST_PRACTICES.md` to `OCAML_KERNEL_CONVENTIONS.md`.
       The decision now names the symbols
       (`lib/render/render_md.ml::ordered_trigger`,
       `lib/render/render_md.ml::render_list`) and the site measurement
       (109 pages carry `<ol>`; the only page carrying `<p>1.` is this
       decision family quoting the defect). Evidence:
       `dune test tests/render_kernel.ml` exits 0 with the six
       ordered-list cases green, and `bash scripts/render.sh` exits 0.

    2. site-broken-links-2026-10. The four implementation anchors moved
       to `lib/render/render_nav.ml` (`sibling_translation_href`,
       `render_footer`, `render_nav`, `lang_href_for`) and
       `lib/render/render.ml::build_pages`. The five defect classes and
       their five fixtures are unchanged; the outcomes now carry the
       measured counts (188 of 190 rendered HTML pages carry the nav
       GitHub link; the two that do not, `dist/graph.html` and
       `dist/dashboard.html`, carry no nav at all). Evidence:
       `dune test tests/render_kernel.ml` exits 0 and
       `bash scripts/render.sh` exits 0.

    3. site-deploy. The render function moved to `lib/render/render.ml`;
       the CLI synopsis lost its Mermaid flags (Mermaid was removed by
       `site-diagrams-as-svg-2026-10`) and gained `zh`; the page list the
       site ships is now the measured one (188 pages + 1 search index +
       1 feed, 186 files under `dist/`). Evidence: `bash scripts/render.sh`
       exits 0 and `mathc render --help` prints the current synopsis.

    4. site-diagrams-as-svg-2026-10. The renderer anchors moved to
       `lib/render/render.ml` and `lib/render/render_md.ml`; the CLI has
       no Mermaid switch left to remove. The risk map was the only one in
       the corpus that carried neither an owner nor declared triggers, so
       it now carries both, and the reasoning that lived in it moved into
       the intent. Evidence: `grep -rn mermaid lib/ bin/ assets/style.css`
       returns nothing, and the eight diagram pages each carry a
       `<figure class="mathc-figure mathc-figure-inline">`.

    5. site-quality-2026-10. The renderer anchors moved to
       `lib/render/render.ml` and `lib/render/render_yaml.ml`. The page
       count and the section list are measurements now: 140 per-decision
       pages, six sections emitted (Intent, Commitment, Outcomes,
       Obligations, Counter-example, Risk), and SCOPE and RELATIONS NOT
       EMITTED -- the renderer has the code, but the extractor reads a
       LIST and the corpus's `scope` and `relations` are MAPS. The promise
       no longer names two headings the site does not show. Evidence:
       `bash scripts/render.sh` exits 0 and a grep for each `<h2>` heading
       over `dist/decisions/` counts 140/140/140/139/140/140/0/0.

    6. site-quality-illustrations-2026-10. The three artefacts are all
       shipped and embedded, but NOT on the pages this decision named:
       `assets/chain.svg` and `assets/kernel-architecture.svg` are
       embedded on `methodology.html` and its `.ru`/`.zh` siblings, and
       the five axiom icons on the five per-axiom pages -- not on the
       home page, not on the axioms overview card, not on
       `foundations.html`. The outcome ids were renamed to say where the
       site puts them, because a promise about a page the site does not
       show is not a promise. Evidence: `bash scripts/render.sh` exits 0
       and a grep for the `<img>` tags over `dist/` finds 3 pages for each
       of the two diagrams and 5 for the axiom icons.

    7. time-honesty. The three-scale norm lives in
       `KERNEL_AGENTS.md` and the exit-code contract in
       `OCAML_KERNEL_CONVENTIONS.md` section 4.3. The estimator is
       measured on this tree: a known class exits 0 with a JSON estimate,
       an unknown class exits 2 with `MC-CLASS-UNKNOWN`, and the sealed
       `kind` enum still has exactly five constructors. Evidence:
       `mathc time-estimate --class feature-add --count 10 --percentile p50`
       and `dune test tests/conformance.ml` (158 cases) both exit 0.

    8. unanchored-attestations-are-declarations-2026-10. The pin at 765
       described a TRACKED store; the store is generated and holds 0
       tracked files, so the pin over the population the kernel reads is
       0 and the 765 become a dated record of the corpus committed before
       the store moved to the working tree. Evidence:
       `git ls-files attestations` returns 0 files and
       `dune test tests/attestation_anchor.ml` exits 0.

    9. validate-and-context. The version literal the decision promised
       (`math-coding 3.0-alpha: bootstrap`) is now the line the `VERSION`
       file produces (`math-coding 3.7.4: bootstrap`), and the six
       `OCAML_BEST_PRACTICES` citations moved to
       `OCAML_KERNEL_CONVENTIONS.md`. The two subcommands are measured on
       this tree: `mathc version` exits 0, and
       `mathc context HEAD~1 HEAD --budget 4000` exits 0 with all ten
       promised keys.

    10. verifier-outcome-taxonomy-2026-10. The three debt counts
        described the tracked store of 2026-10; the numbers now live in
        the ONE fixture that owns them
        (`tests/fixtures/legacy-attestation-debt.sh`, owned by
        `decisions/legacy-attestation-debt-2026-10.yaml`) and this
        decision points at that owner instead of repeating them. The
        three VERDICTS are unchanged. Evidence:
        `bash tests/fixtures/legacy-attestation-debt.sh` answers exit 3
        (`unknown`, not `pass`) on a checkout with no generated store.

    11. version-sync-2026-10. The version literals were the 2026-10
        drift; the trap-log anchor moved to
        `OCAML_KERNEL_CONVENTIONS.md` section 11.27; the skill ships in
        TWO copies and both are derived points; and the script is 340
        lines writing three files. Evidence:
        `bash scripts/sync-version.sh --check` exits 0 with
        `VERSION=3.7.4, semver=3.7.4`, and the four version fixtures
        (`sync-version-clean-passes.sh`, `sync-version-stale-fails.sh`,
        `sync-version-mc-version-drift-fails.sh`,
        `skill-copies-identical.sh`) all exit 0.

    WHAT WAS DELIBERATELY NOT REWRITTEN. The inventory lists 34
    STALE-FORM decisions. This tranche edited the eleven above. The other
    23 ids were already handled: twelve by tranche 1 and eleven by
    tranche 2. The list is explicit so "what was left" is not silence:

      tranche 1 (already rewritten before this tranche):

        process-principles
        record-proportionality-2026-10

    AFTER THIS TRANCHE NO STALE-FORM ID IS LEFT UNREWRITTEN. That is
    what the whole of T2.2b-2 leaves behind, and it is worth being
    precise about what it does NOT leave behind:

      - It does not close the FALSIFIED class. The inventory's section 5
        names nine decisions the tree has already disproved
        (`corpus-final-state-2026-10`, `corpus-silent-drop-inventory-2026-10`,
        `gate-attestation-store-fill-decision`, `forge-principal-verification`,
        `mathc-self-check-subcommand`,
        `missing-directory-is-not-a-crash-2026-10`,
        `redundancy-census-2026-11`, `spec-cli-catalog`,
        `waiver-infrastructure-2026-10`). A false promise is not a stale
        form; it is a different repair.
      - It does not close the UNCHECKED class. 31 live decisions still
        carry promises that neither a check nor a declaration controls.
      - It does not archive the RECORD candidates (the inventory's
        section 7); recording that a file MENTIONS a path is not the
        same as depending on it.
      - It does not repair the PROTECTED NORMATIVE debt. `spec/**` was
        out of scope for this tranche: where the normative text still
        names a path the tree moved, that debt stays open for the
        contract tranche, and this tranche names it rather than editing
        it.

    WHAT REMAINS UNCERTAIN. Three boundaries are stated because the
    tree cannot erase them from inside this tranche.

      THE GENERATED STORE IS ABSENT, SO THE DEBT IS UNKNOWN. This
      checkout has no generated attestation store. The legacy-debt
      fixture answers exit 3 (`unknown`, not `pass`), and the
      counters report every obligation pair as `no_store` and 0
      self-check subjects. Claiming a measured zero from the missing
      store would repeat the mistake this tranche removes.

      TWO SITE PROMISES ARE CURRENTLY VIOLATED AND ARE NOT REPAIRED HERE.

      (1) `site/manifesto.md` still says that eight packets form the
      minimum set that closes the bootstrap loop and names the master
      policy's obligations as the canonical list; the master policy
      carries SEVEN obligations today. `site-quality-2026-10` now owns
      that gap in writing, with the maintainer as owner and the
      declared review date. Repairing it is a site-content change,
      which is outside the remit of a tranche that rewrites decisions.

      (2) THE FOOTER'S AGENTS LINK IS A 404 -- A DEFECT OF THE CLASS
      `site-broken-links-2026-10` EXISTS TO CLOSE. The footer emits
      `https://github.com/11111000000/math-coding/blob/main/AGENTS.md`,
      but `AGENTS.md` was renamed to `KERNEL_AGENTS.md` and no longer
      exists; the four sibling meta-doc links (ROADMAP.md, PACKAGES.md,
      USAGE.md, spec/kernel-contract.md) do resolve. Measured on
      2026-10-31 with `git ls-files --error-unmatch AGENTS.md` (fails)
      against the four siblings (succeed). The repair is one string in
      `lib/render/render_nav.ml::render_footer`, and `lib/**` was
      outside this tranche's scope, so the gap is recorded in the
      decision that owns the class rather than quietly narrowed away.

      ONE RELATION KEY REMAINS UNDECLARED. `amends: site-deploy@5` in
      `mathjax-delimiter-hardening-2026-10` resolves; the key is not in
      the relation vocabulary the schema declares. The target resolves,
      the counter does not fire, and this tranche did not invent a
      different relation meaning to make the counter disappear.


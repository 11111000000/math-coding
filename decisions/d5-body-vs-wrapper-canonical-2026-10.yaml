recovery_path:
  forward: |
    If this decision is rejected by the human
    review, the spec change is reverted (a single
    `git revert` against `spec/kernel-contract.md` §7.1
    insertion + the helper removal in
    `lib/decision.ml` + the test removal in
    `tests/body_canonical_test.ml`). The comment
    block in `lib/decision.ml:1-20` is rolled back
    to its pre-decision state. The 72 active
    decision files are unaffected (they never
    changed). Estimated revert time: under 5
    minutes wall-clock per `mathc time-estimate
    --class spec-editorial --count 1 --percentile
    p50`.
  backward: |
    If a future commit breaks the algorithm
    (e.g., a regression test in
    `tests/body_canonical_test.ml` fails), the
    revert path is the same as `forward`: drop the
    §7.1 sub-section, drop the helper, drop the
    test. The kernel falls back to the pre-decision
    state where `body_sha` and `yaml_sha` are read
    from the YAML (T0.2 string-equality check

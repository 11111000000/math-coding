reversal:
  - signal: yaml-canonical-form-changed
    condition: |
      A future YAML 1.3 adoption (or a project decision
      to support YAML 1.2 with anchors / merge keys
      spanning the body-wrapper boundary) requires a
      different canonicalisation than the placeholder-
      substitution sweep.

      RECOVERY: revert the §7.1 sub-section, the helper
      `lib/decision.ml::body_canonical_sha256` and the
      executable `tests/body_canonical_test.ml`. The kernel
      falls back to the pre-decision state, in which
      `body_sha` and `yaml_sha` are read from the YAML and
      `sha_match_check` (T0.2) remains the runtime invariant.
      The decision files themselves are unaffected: their
      stored digests never changed.
    action: rework
  - signal: first-dual-authored-decision-drafted
    condition: |
      The first decision file in `decisions/` uses the
      sibling-YAML authoring form (kernel contract §6). The
      `authoring: single | dual` discriminator must be
      added, the `sha_match_check` relaxed per
      discriminator, and a new decision
      `d5-dual-authored-canonical-2026-XX` adopted.
    action: rework
  - signal: algorithm-rejected-by-spec-audit
    condition: |
      A future spec audit concludes the placeholder-
      substitution algorithm is not parser-independent
      (e.g., CRLF normalisation interacts badly with a
      documented YAML edge case).

      RECOVERY: revert the §7.1 sub-section, the helper and
      the test -- the same three edits as the first reversal
      entry -- and the kernel reads the two stored fields
      again. The corpus needs no recompute: reverting the
      algorithm restores the state in which the stored
      digests were computed.
    action: rework

      check on the two stored fields (T0.2).
counterexample: |
  "The trivial case is already working. Naming the algorithm
  in the spec adds documentation, not enforcement. Defer
  until a kernel refactor actually computes the digests."

  Counterargument: the spec is normative; the kernel is
  downstream. A future kernel refactor that adds a
  `mathc recompute-sha` subcommand (or a migration tool
  that re-derives digests after editing a decision) will
  need an authoritative byte-range definition. Without
  this decision, the refactor would copy the algorithm
  from the Python reference
  (`scripts/axiom-link-seed.py::recompute_sha` -- a Python
  helper in `scripts/`, not a kernel reference) or invent
  a divergent one. Pinning the algorithm to the contract's
  §7.1 is cheaper than re-deriving it in code.

  "The dual case (kernel contract §6) is the interesting one; the
  trivial case is just one file. Defer THIS decision until
  the dual case is also defined."

  Counterargument: the dual case has zero live consumers
  and at least three open design questions (wrapper-
  marker line-anchor vs byte-anchor, YAML anchor /
  merge-key boundary behaviour, whether the body
  excludes the YAML front-matter). Defining the dual
  case now would either (a) lock the project into a
  sub-optimal algorithm, or (b) require a future
  decision to revise it. The honest position is: formalise
  the case every current decision uses (trivial / single
  file) and explicitly defer the dual case with a clear
  follow-up trigger (`first-dual-authored-decision-
  drafted`). The dual case is the FOLLOW-UP, not a
  blocking requirement on this one.

  "A future YAML extension (anchors, merge keys) could
  change the placeholder-substitution semantics. Pinning
  the algorithm to the current YAML 1.2 spec creates
  future drift."

  Counterargument: the placeholder substitution operates
  on raw bytes after canonical line-ending normalisation,
  not on a parsed YAML value. YAML anchors (`&foo` /
  `*foo`) and merge keys (`<<: *foo`) are a parser-level
  concern; the byte-range that the digest covers is
  parser-independent (the file bytes BEFORE any anchor
  expansion). If a future YAML 1.3 spec introduces a
  syntax that changes the canonical line-ending or
  encoding rules, this decision's reversal signal
  `yaml-canonical-form-changed` fires and a follow-up
  decision updates the algorithm. The pin to YAML 1.2 is
  explicit in the §7.1 sub-section.
antithesis: |
  The coherent counter-position considered and rejected:
  the trivial case (single-file authoring) is the only
  case in production, so the formal definition can wait
  until the dual case is also defined. Formalising one
  half of a two-case algorithm creates documentation
  drift: agents reading the spec will see "byte-range" in
  §7.1 and assume the dual case is also defined, when
  it is in fact anticipated-but-not-yet-formalised
  (kernel contract §6). A future kernel refactor would have to
  either copy the §7.1 algorithm and extend it to the
  dual case (an unstated extension) or invent a new
  algorithm. The author's counter-position is: "wait
  until both cases are ready; define them together".

  Rejected because: the trivial case has live consumers and a
  working (if undocumented) reference implementation in
  `scripts/axiom-link-seed.py::recompute_sha`; the dual case has
  zero live consumers and three open design questions (wrapper-
  marker line-anchor vs byte-anchor, YAML anchor / merge-key
  boundary, body front-matter inclusion). The two cases are at
  different levels of maturity; coupling them into one
  decision locks the dual case into a design-by-committee
  algorithm. The honest position is: formalise the
  production case, defer the speculative case with a
  reversal signal that fires when a real consumer
  appears. This is consistent with the v3 dialectic
  method (kernel contract §11): the antithesis is a coherent
  position (wait) that the author considered
  and rejected on maturity-coupling grounds, distinct from
  the counterexample which is the strongest objection
  a future reader might raise (the algorithm is
  documentation, not enforcement).

  THE REVISION 2 ADDITION TO THIS POSITION. The same argument now
  applies to the COUNT. A decision that says "72 files carry the
  algorithm's output" is a decision about a census, and a census
  that has to be restated every time the corpus grows is a census
  that stops being read. The invariant ("every file in the corpus
  carries the algorithm's output, and the kernel recomputes it on
  every validate") states the same property in a form that does
  not expire. This revision took the position's own argument and
  applied it to the number.
assumptions:
  - id: utf-8-and-lf-stable
    state: assumed
    statement: |
      Every decision file in `decisions/` is UTF-8 encoded
      and uses LF line endings (possibly with a trailing
      newline per POSIX convention). The live corpus complies,
      and the kernel recomputes each file's digest from its own
      bytes on every `mathc validate`, so a file that violated this
      would be visible as a digest mismatch rather than as a silent
      difference.
    owner: human:maintainer
    consequence_if_false: |
      If a future decision file is committed with CRLF or
      UTF-16, the digest computed under this algorithm
      would still be stable (the line-ending normalisation
      collapses CRLF to LF; the UTF-16 case is uncovered
      by this decision and is the consequence-of-false
      surface). The follow-up decision can add
      `MC-ENCODING-INVALID` reject path; until then, a
      UTF-16 file's digest is computed over its raw bytes
      (no canonicalisation), matching the current kernel
      behaviour.
    review_on:
      - signal: non-utf-8-decision-detected
      - signal: crlf-decision-detected

  - id: yaml-1.2-stable
    state: assumed
    statement: |
      YAML 1.2 is the canonical YAML form for decision
      files (per the hand-rolled loader in `lib/codec.ml`,
      which implements a YAML 1.2 subset sufficient for
      the project's authoring patterns: block mappings,
      block sequences, flow scalars, top-level
      front-matter, `|` block scalars).
    owner: human:maintainer
    consequence_if_false: |
      A future YAML 1.3 adoption or a new syntax
      extension (anchors spanning the body-wrapper
      boundary, multi-document streams, etc.) would
      require this decision to be revised; the
      `yaml-canonical-form-changed` reversal signal
      would fire. The placeholder-substitution algorithm
      is robust to anchor syntax BECAUSE it operates on
      raw bytes; only canonical line-ending and
      encoding changes break the algorithm.
    review_on:
      - signal: yaml-canonical-form-changed

  - id: zero-live-dual-authored-decisions
    state: assumed
    statement: |
      No active decision file uses the sibling-YAML
      authoring form (kernel contract §6). Every live decision
      is single-file. Verified by searching the corpus for
      `*.wrapper.yaml` (returns zero results at HEAD
      `117ee570`).
    owner: human:maintainer
    consequence_if_false: |
      If a future decision is dual-authored, the kernel
      would still validate `body_sha = yaml_sha` as a
      string check (per T0.2), which is WRONG for the
      dual case (the two digests would represent
      different byte-ranges). The follow-up decision
      `d5-dual-authored-canonical-2026-XX` adds the
      `authoring: single | dual` discriminator and
      relaxes the check. Until that lands, dual-authored
      decisions would silently fail validation with
      `MC-SHA-MISMATCH` (Block) on every load -- a
      loud failure mode that is preferable to silent
      miscount.
    review_on:
      - signal: first-dual-authored-decision-drafted

  - id: the-protected-transition-was-authorized-by-a-human
    state: assumed
    statement: |
      The transition that put the algorithm into the normative
      text was authorized by a human review, not by this
      decision: a maintainer signed a `kind_: review,
      producer: human:maintainer` attestation before the spec change
      landed. This is the A3 separation the transition needed -- a
      contract change cannot authorize its own adoption.
    owner: human:maintainer
    consequence_if_false: |
      If no human review was recorded, the contract changed
      without the authorization the constitution asks for, and
      the change has to be re-reviewed (and the attestation
      re-signed) even though the text it produced is unchanged.
      The review signal below fires when the evidence for it
      becomes visible.
    review_on:
      - signal: the-review-attestation-for-the-spec-change-is-found

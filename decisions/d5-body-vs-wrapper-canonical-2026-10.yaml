intent: |
  Adopt a formal byte-range and canonicalisation for `body_sha` and
  `yaml_sha` in `spec/kernel-contract.md` §7, covering the single-file
  authoring case (the case every active decision uses today) and
  explicitly deferring the dual-authored sibling-YAML case
  (kernel contract §6) to a follow-up decision.

  The algorithm is the placeholder-substitution sweep: replace each
  embedded `body_sha: "sha256:<64 hex>"` and `yaml_sha: "sha256:<64
  hex>"` value with the placeholder `"sha256:" + "0" * 64`, then
  sha256 the resulting UTF-8 bytes. The two fields always carry the
  same digest; the spec invariant `D.body_sha = D.yaml_sha` (when
  both are present) is a corollary. The algorithm is correct; the
  spec names it. This decision names it, pins it to a normative
  location, and freezes the boundary conditions (UTF-8 encoding, LF
  line endings, no trailing newline normalisation).

  2026-11-01, REVISION 2: THE DECISION HAS LANDED, AND THE TEXT WAS
  STILL DESCRIBING THE LANDING.

    THE NORMATIVE TEXT IS NO LONGER "NEW". `spec/kernel-contract.md`
    §7.1 ("Byte-range and canonicalisation") exists and is what the
    kernel cites. The spec's own §7.1 is the place the algorithm is
    named; this decision points at the SECTION, not at a line, because
    the contract's lines move when tranche T3.2 of
    `docs/plans/redundancy-and-portability-2026-11.md` rewrites it.

    THE HELPER EXISTS. `lib/decision.ml::body_canonical_sha256` is
    the kernel's implementation of §7.1, and
    `tests/body_canonical_test.ml` pins four properties of it. The
    text used to speak of both in the future tense, as things the
    decision would add.

    THE REFERENCE IMPLEMENTATION MOVED. The Python reference is
    `scripts/axiom-link-seed.py::recompute_sha` (the placeholder
    constant is `PLACEHOLDER` in the same file). The old line anchor
    (`scripts/axiom-link-seed.py:105-123`) pointed at the directory
    walk, not at the algorithm. This revision cites the function.

    "72 DECISIONS" WAS A SNAPSHOT. The number of decision files that
    carry the algorithm's output is not repeated here. What is
    promised is the INVARIANT, and it is checkable today: every
    decision file in the live corpus carries `body_sha = yaml_sha =
    sha256(file bytes after placeholder substitution)`, and
    `mathc rehash --dry-run` over the corpus reports no file whose
    stored digest is not the algorithm's output.

    THE TAIL OF THIS FILE WAS NOT READ BY THE KERNEL. The blocks
    below `relations:` -- a `verdict_diff`, a `prior_authorization`
    and a `recovery_path` -- are not fields of the decision schema
    (`schemas/decision.json` closes the top level with
    `additionalProperties: false`) and no kernel module reads them.
    They were outside the gate: the loader stopped at them and said
    `parse-ok`. Their substance is not lost. The verdict difference
    is now an OUTCOME (what is true today is an outcome, not a
    before-and-after), the authorization is a DECLARED promise on the
    obligation it belongs to, and the recovery path is a REVERSAL

outcomes:
  - id: spec-formalises-byte-range
    statement: |
      `spec/kernel-contract.md` §7.1 ("Byte-range and
      canonicalisation") names the placeholder-substitution
      algorithm in a normative sub-section. The
      `D.body_sha = D.yaml_sha` invariant (when both are
      present) is a COROLLARY of the algorithm, not an
      additional rule. And every decision file in the live
      corpus carries a stored digest that IS the algorithm's
      output for that file: `mathc rehash --dry-run` reports no
      file to change and `mathc validate` reports no
      `MC-SHA-DIGEST-STALE`. The corpus is larger than it was
      when this decision was adopted; the invariant is what is
      promised, not the count.
  - id: kernel-helper-exposes-algorithm
    statement: |
      `lib/decision.ml::body_canonical_sha256` is a pure
      function `bytes -> string` that implements the
      algorithm in the kernel, enabling future migration
      tools and conformance tests to compute the digest
      from raw bytes without depending on the Python
      reference implementation.
  - id: conformance-fixture-pins-algorithm
    statement: |
      `tests/body_canonical_test.ml` registers with
      `dune test` and pins four properties of the
      algorithm: stability, sensitivity,
      insensitivity-to-placeholder, and CRLF-equals-LF.
      A regression in the OCaml helper (e.g., reverting
      to a regex-based implementation that does not
      match the Python algorithm) surfaces as a test
      failure.
  - id: dual-case-deferred
    statement: |
      The dual-authored case (kernel contract §6 sibling YAML)
      is formally DEFERRED. A follow-up decision
      `d5-dual-authored-canonical-2026-XX` is anticipated
      with `reversal.signal: first-dual-authored-decision-drafted`.
      No `authoring: single | dual` discriminator is
      added in this decision; the kernel's `sha_match_check`

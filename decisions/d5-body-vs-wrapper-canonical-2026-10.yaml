intent: |
  Adopt a formal byte-range and canonicalisation for `body_sha` and
  `yaml_sha` in `spec/kernel-contract.md` §7, covering the single-file
  authoring case (the case every active decision uses today) and
  explicitly deferring the dual-authored sibling-YAML case
  (kernel contract §6) to a follow-up decision.

  Today the algorithm is the placeholder-substitution sweep in
  `scripts/axiom-link-seed.py:105-123`: replace each embedded
  `body_sha: "sha256:<64 hex>"` and `yaml_sha: "sha256:<64 hex>"`
  value with the placeholder `"sha256:" + "0" * 64`, then sha256
  the resulting UTF-8 bytes. The two fields always carry the same
  digest; the spec invariant `D.body_sha = D.yaml_sha` (when both
  are present) is a corollary. The algorithm is correct; the spec
  does not yet NAME it. This decision names it, pins it to a
  normative location, and freezes the boundary conditions (UTF-8
  encoding, LF line endings, no trailing newline normalisation).

  The dual-authored case (kernel contract §6 sibling YAML) has zero live
  consumers; the spec anticipates it but no decision file in
  `decisions/` uses it. This decision records the formal
  reservation of the byte-range semantics for that case without
  implementing them, so a future adoption does not need to
  renegotiate the algorithm from scratch. A second follow-up
  decision will be required when the first dual-authored decision
  is drafted; that follow-up will add a discriminator field
  (likely `authoring: single | dual` on the Decision entity) and
  relax `sha_match_check` per the discriminator.

  History:
    rev 1 (this commit): initial adoption. Closes audit deficit
      D5 from the 2026-10-05 audit (per `ROADMAP.md:88`).
      A3-protected transition because the rule changes the
      kernel's interpretive contract for `body_sha` / `yaml_sha`
      (per `spec/constitution.md` §Self-application and axiom
      A3 separation: a contract change cannot authorize its own
      adoption); human review is required before merge.

  Background:
    The 2026-10-05 audit (`docs/AUDIT-0.0.20.md` D5) recorded
    that `spec/kernel-contract.md` §7 declares the equality
    invariant but does not specify the exact byte-range the
    hash covers. The implementation in
    `scripts/axiom-link-seed.py:105-123` and the 72 decisions
    authored under the post-3.0.0.20 schema-tightening all
    carry `body_sha = yaml_sha = sha256(file bytes after
    placeholder substitution)`. The kernel's
    `lib/decision.ml::sha_match_check` (T0.2 stream) enforces
    the equality as a string check; it does not compute the
    digest from the file. A future kernel refactor that
    COMPUTES these digests from the file (the natural next
    step after this decision) would have to either copy the
    algorithm from `scripts/axiom-link-seed.py` or invent
    another one. This decision removes the ambiguity by
    writing the algorithm into the spec.

  Migration:
    No data migration. The 72 active decision files keep their
    existing `body_sha` / `yaml_sha` values; the algorithm
    change is normative-only (the algorithm does not change,
    it is just now formally named). The placeholder form
    `sha256:000...000` is a 71-character string used during
    the algorithm's intermediate step; it MUST NOT appear as
    a stored value (the schema pattern is
    `^sha256:[0-9a-f]{64}$` per `schemas/decision.json`).

  Boundaries:
  - `lib/decision.ml`: the `sha_match_check` function is NOT
    modified; the comment block above it (lines 1-20) gains
    a reference to this decision and to the new
    `spec/kernel-contract.md` §7 sub-section that names the
    algorithm.
  - `lib/canonical.ml`: NOT modified. `lib/canonical.ml` is
    RFC 8785 JCS (used for JSON canonicalisation, not for
    YAML files); the body-vs-wrapper algorithm operates on
    raw file bytes, not on a parsed JSON value.
  - `bin/Mathc.ml`: NOT modified.
  - `schemas/decision.json`: NOT modified. The `body_sha` and
    `yaml_sha` patterns are already `^sha256:[0-9a-f]{64}$`;
    no field is added in this decision (the future
    `authoring: single | dual` discriminator is explicitly
    deferred).
  - `spec/kernel-contract.md` §7: a new sub-section (call it
    §7.1 "Byte-range and canonicalisation") is appended. The
    existing §7 Decision entity definition is unchanged; the
    new section names the algorithm. Section §6 is unchanged
    (the dual case remains anticipated but not yet formalised
    here).
  - The 14 constitution invariants (I1-I14) and the 5 axioms
    (A0-A4) are preserved verbatim.
  - The A0 separation invariant holds: the algorithm is a
    pure file-bytes → sha256 function; no I/O beyond reading
    the file once, no kernel gate, no runtime coupling
    beyond what `lib/decision.ml` already does.
  - The 5 modes (tiny/light/standard/strict/exhaustive) are
    unchanged.
commitment: |
  1. `spec/kernel-contract.md` §7 gains a new sub-section §7.1
     "Byte-range and canonicalisation" that formally names the
     algorithm:

       body_sha(D) = yaml_sha(D) = "sha256:" + sha256_hex(
         canonicalise(file_bytes(D))
       )

     where `canonicalise` is the placeholder-substitution
     sweep defined as:

       1. Read the file as UTF-8 bytes. Reject on any
          non-UTF-8 sequence (the kernel will surface
          `MC-ENCODING-INVALID` in a follow-up decision; this
          decision does NOT add the reject path; today
          non-UTF-8 silently hashes the raw bytes, which
          matches the existing kernel behaviour).
       2. Apply the line-ending normalisation: any CRLF is
          replaced by LF. A trailing `\n` is preserved as-is
          (no truncation, no extra newline added).
       3. Apply the placeholder substitution: every substring
          matching the regular expression
          `body_sha: "sha256:[0-9a-f]{64}"` is replaced with
          `body_sha: "sha256:` + 64 ASCII zeros + `"`; the
          same for `yaml_sha:`. The substitution is
          length-preserving (placeholder is 71 characters,
          the matched value is 71 characters), so byte
          offsets downstream of the substitution are stable.
       4. The resulting byte sequence is the input to
          `sha256` (hand-rolled in `lib/digest.ml`, validated
          against RFC 6234 vectors per `tests/digest_vectors.ml`).

     The §7 invariant `D.body_sha = D.yaml_sha` (when both
     present) is a COROLLARY of the algorithm, not an
     additional rule: both fields name the same digest.

  2. `lib/decision.ml:1-20` (the comment block above
     `sha_match_check`) is updated to:
     - reference this decision by id;
     - reference the new `spec/kernel-contract.md` §7.1;
     - name the algorithm in one sentence (the placeholder-
       substitution sweep from
       `scripts/axiom-link-seed.py:105-123`).
     No code change.

  3. `tests/body_canonical_test.ml` (NEW) is a small
     Alcotest executable asserting four properties of the
     algorithm on synthetic input:
     (a) Stability: hashing the same file twice produces the
         same digest (the property the existing 72 decisions
         rely on).
     (b) Sensitivity: changing one byte in the body (NOT in
         the `body_sha` or `yaml_sha` lines) produces a
         different digest.
     (c) Insensitivity-to-placeholder: changing the value of
         `body_sha` (but keeping the field pattern valid)
         does NOT change the resulting digest; the
         placeholder substitution absorbs the change.
     (d) CRLF-vs-LF: a file with CRLF line endings and an
         otherwise-identical file with LF line endings
         produce the SAME digest (line-ending normalisation).
     The test exposes the algorithm as a function in
     `lib/decision.ml` (or a thin wrapper, see commitment
     5). The test is registered with `dune test` via
     `tests/dune`.

  4. `tests/cli/body-vs-wrapper-canonical.t` (NEW cram
     fixture) asserts the integration:
     - the comment block in `lib/decision.ml:1-20` names
       this decision by id (positive: present → pass);
     - the comment block does NOT contain the stale
       "no formal definition" phrase (negative: absent →
       pass);
     - `mathc self-check` returns `verdict: pass` after
       the spec change lands (the test is a future-pass
       witness; it is `xfail` until the spec change ships,
       then promoted to `pass` in the same commit).

  5. A small helper is exposed in `lib/decision.ml` (name
     suggestion: `body_canonical_sha256` or
     `canonicalize_for_hash`):
     - signature: `bytes -> string` (returns the `sha256:`
       + 64 hex digest form);
     - pure: no I/O, no allocation beyond the result string;
     - calls into `lib/canonical.ml` is NOT required (the
       algorithm operates on raw bytes, not on parsed JSON);
     - the helper is exported from `lib/decision.ml` so
       `tests/body_canonical_test.ml` can call it.

  6. The 72 active decision files (and any new ones written
     under this decision) continue to carry
     `body_sha = yaml_sha = sha256(file after placeholder
     substitution)`. The re-computation in
     `scripts/axiom-link-seed.py:105-123` is unchanged (the
     script is the existing reference implementation; this
     decision names it formally).

  7. The dual-authored case (kernel contract §6) is formally
     DEFERRED. A new field on the Decision entity (likely
     `authoring: single | dual`) is anticipated, but NOT
     added by this decision. A follow-up decision
     `d5-dual-authored-canonical-2026-XX` is recorded in
     the reversal block; its `reversal.signal` is
     `first-dual-authored-decision-drafted`.

  8. No `authoring` field is added; the kernel still
     computes equality of `body_sha` and `yaml_sha` as a
     string check (per T0.2). The first kernel change to
     COMPUTE these digests from the file (rather than
     reading them from the YAML) will be a SEPARATE
     decision under the same active policy and will use
     the helper from commitment 5.

  Boundaries:
  - `lib/gate.ml`, `lib/waiver.ml`, `lib/risk.ml`,
    `lib/policy.ml`, `lib/rebuttal.ml`, `lib/re_evaluation.ml`,
    `lib/attestations/attestations.ml`: NOT modified.
  - `bin/Mathc.ml`: NOT modified.
  - `schemas/decision.json`: NOT modified.
  - `spec/kernel-contract.md` §6: NOT modified (the dual case
    remains anticipated but not yet formalised here).
  - `axioms/`: NOT modified (A0-A4 preserved verbatim).
  - `site/`, `scripts/`, `.github/`: NOT modified.
  - The 72 active decision files: NOT modified (their
    stored `body_sha` and `yaml_sha` values are already
    the algorithm's output).
  - `scripts/axiom-link-seed.py:105-123`: NOT modified
    (the script IS the reference implementation; the
    decision names it).

outcomes:
  - id: init-wires-ci-on-flag
    statement: |
      `mathc init . --with-ci-workflow` creates
      `.github/workflows/ci.yml` in the target directory,
      with the content of `templates/ci.yml`.
  - id: init-skips-ci-on-default
    statement: |
      `mathc init .` (default, no flag) does NOT create
      `.github/workflows/ci.yml`; the print_summary at
      the end of init surfaces that the wire was skipped.

counterexample: |
  "Just always copy the CI workflow; init is a one-time
   bootstrap step." Rejected (rev 2): the rev 1 wording
   said "init always copies"; but an existing project
   that runs `mathc init --merge` (the documented escape
   hatch for arc42/MADR/adr-tools detection) must NOT
   have its `.github/workflows/` rewritten without
   consent. The flag preserves the capability for greenfield
   adopters while restoring the no-surprise-writes
   guarantee for brownfield adopters. The atomic unit of
   init is the greenfield case; the brownfield case is
   explicitly opt-in per surface.

  "What if the user already has a `.github/workflows/`
   directory?" Counterargument: the kernel creates the
   intermediate directories with `mkdir -p`; if the
   workflow file already exists, the kernel prints a
   one-line note ('workflow already present, skipping')
   and exits 0. The user can manually reconcile.

  "What if the running binary is a release binary (no
   templates/ci.yml next to it)?" Counterargument:
   the source walk fails gracefully; the kernel
   prints a one-line note ('CI template not found
   in source; see templates/ci.yml in the math-coding
   repo or in dist-adoption.tar.gz') and exits 0.
   Same split as `--agent opencode` for release
   binaries.

assumptions:
  - id: templates-ci-yml-shipped
    state: assumed
    statement: |
      `templates/ci.yml` is shipped at the math-coding
      repo root and is in every release tarball's
      `dist/adoption/templates/` (or similar).
    owner: human:maintainer
    consequence_if_false: |
      If the template is not shipped, `mathc init
      --with-ci-workflow` is a no-op for the CI workflow
      step and exits 0. A follow-up decision ships the
      template.
    review_on:
      - signal: templates-ci-yml-missing


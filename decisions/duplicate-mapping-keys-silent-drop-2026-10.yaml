outcomes:
  - id: silent-drop-is-named
    statement: |
      Every mechanism by which a decision file can say more than
      the kernel reads emits a Warn-level `MC-*` diagnostic from
      `mathc validate`, so `parse-ok` can no longer be mistaken
      for "the kernel read all of it".
  - id: promised-obligations-are-back-in-the-gate
    statement: |
      The 17 obligations listed in the original report, plus the
      `risk:` and `relations:` blocks that D2 was also eating, are
      inside the kernel's reading and therefore inside
      `mathc self-check`.
  - id: scaffolded-policy-is-valid-yaml
    statement: |
      A decision scaffolded by `mathc init` is parseable end to
      end: `mathc validate` on the generated policy prints no
      `MC-UNPARSED-TAIL`, and `yq` reads every top-level key
      including `risk:` and `relations:`.
  - id: honest-merge-does-not-add-noise
    statement: |
      Merging two declarations restores every promise. Deleting
      the second block silences the warning and deletes promises,
      which `mathc explain-diagnostic MC-DUPLICATE-KEY` says
      explicitly in its remediation text.

obligations:
  - id: duplicate-key-one-diagnostic-per-key
    outcome: kernel-names-the-unreachable-block
    claim: |
      A synthetic decision declaring `obligations:` twice yields
      exactly ONE `MC-DUPLICATE-KEY` diagnostic naming the key and
      both line numbers, at severity Warn, with a non-empty
      `next_actions` whose verbs are on the whitelist. Declaring a
      key three times still yields one diagnostic, carrying the
      count 3.
    acceptance:
      all:
        - verifier: tests/duplicate_keys.exe
        - verifier: mathc validate tests/cli/fixtures/duplicate-keys/duplicate-obligations-key.yaml
  - id: unparsed-tail-is-reported
    outcome: kernel-names-where-it-stopped
    claim: |
      A synthetic decision the loader cannot read to EOF yields a
      `MC-UNPARSED-TAIL` naming the first unread line, with the
      verdict still `parse-ok`; a second `---` marker is reported
      through the same code even though it truncates before
      tokenisation.
    acceptance:
      all:
        - verifier: tests/duplicate_keys.exe
        - verifier: mathc validate tests/cli/fixtures/duplicate-keys/unparsed-tail.yaml
  - id: detector-reads-the-same-tree-as-the-readers
    outcome: no-second-yaml-implementation
    claim: |
      `Codec.duplicate_keys` walks `Jsonl.value`, not text: prose
      inside a `|` block scalar may contain `Counterargument:` at
      column 2 without being reported, and two sequence items may
      each carry `id:` without being reported. Both are pinned by
      `tests/duplicate_keys.exe`.
    acceptance:
      all:
        - verifier: tests/duplicate_keys.exe
  - id: both-codes-are-explained
    outcome: explain-diagnostic-covers-the-new-codes
    claim: |
      `mathc explain-diagnostic MC-DUPLICATE-KEY` and
      `mathc explain-diagnostic MC-UNPARSED-TAIL` return a
      non-empty definition, occurs_when and remediation.
    acceptance:
      all:
        - verifier: mathc explain-diagnostic MC-DUPLICATE-KEY
        - verifier: mathc explain-diagnostic MC-UNPARSED-TAIL
  - id: reported-obligations-are-reachable
    outcome: the-17-promises-are-back-under-the-gate
    claim: |
      The six decisions that duplicated `obligations:` no longer
      do, and `mathc validate` on each prints the full obligation
      count the file actually declares -- the second block's ids
      included: `kernel-prefix-matches-mathc`,
      `docs-no-mathc-cli`, `decisions-renamed`,
      `site-classes-renamed`, `skill-url-points-at-real-asset`,
      `binary-built`, `seven-methods-tested`, `parse-error-tested`,
      `unknown-method-tested`, `self-check-non-regression`,
      `mathc-explain-spec-promoted`, `mathc-explain-dispatcher-shipped`,
      `version-reads-from-file`, `mathc-version-prints-file`,
      `waiver-loader-tested`, `self-check-emits-pass-with-waiver`,
      `deferral-recorded`.
    acceptance:
      all:
        - verifier: mathc validate decisions/cli-canonical-name.yaml
        - verifier: mathc validate decisions/mathc-explain-subcommand.yaml
        - verifier: mathc validate decisions/mcp-server-impl-2026-10.yaml
        - verifier: mathc validate archive/decisions/site-version-from-file-2026-10.yaml
        - verifier: mathc validate decisions/waiver-infrastructure-2026-10.yaml
        - verifier: mathc validate decisions/yaml-block-scalars-impl-pending.yaml
  - id: secondary-duplicates-gone
    outcome: counterexample-and-nested-duplicates-repaired
    claim: |
      The three decisions that duplicated `counterexample:` and the
      one that duplicated `result:` inside an acceptance item no
      longer do; `mathc validate` prints no `MC-DUPLICATE-KEY` for
      any of them.
    acceptance:
      all:
        - verifier: mathc validate decisions/disable-hanging-alcotest-tests-2026-10.yaml
        - verifier: mathc validate decisions/mathc-counters-subcommand-2026-10.yaml
        - verifier: mathc validate decisions/parser-risk-owner-default.yaml
        - verifier: mathc validate decisions/yaml-block-scalars.yaml
  - id: every-affected-file-is-listed
    outcome: residual-corpus-is-inventoried-not-hidden
    claim: |
      The corpus scan that motivated this decision is reproducible
      and its residual is recorded, not forgotten:

        for f in $(find decisions -name '*.yaml'); do
          mathc validate "$f" 2>&1 >/dev/null \
            | grep -oE 'MC-(DUPLICATE-KEY|UNPARSED-TAIL)' \
            | sort -u | sed "s|^|$f: |"
        done

      At the base commit of this branch it reports 28 affected
      files of 235. This decision repairs 10 of them. The other 18
      remain, still validating `parse-ok`, and are the subject of
      the follow-up named in `reversal`.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe
  - id: scaffolded-policy-parses-to-eof
    outcome: scaffolded-policy-is-valid-yaml
    claim: |
      `mathc init` writes a policy the kernel reads to EOF: the
      generated file has no `MC-UNPARSED-TAIL`, and a spec-conforming
      reader (`yq`) parses it, which the previous template was not
      -- it carried a sequence item at column 0.
    acceptance:
      all:
        - verifier: tests/cli/init-defaults.t
        - verifier: tests/cli/init-scope-language-agnostic.t
  - id: no-false-positive-on-json-inputs
    outcome: detector-reads-the-same-tree-as-the-readers
    claim: |
      `MC-UNPARSED-TAIL` is reported for YAML input only. Validating
      a `.json` decision, which `parse_file` routes to `Jsonl.parse`
      and never through `parse_yaml_pairs`, emits no tail
      diagnostic. Pinned by the JSON-path cram tests
      (`tests/cli/validate-positive.t`,
      `tests/cli/embedded-schemas.t`, and the rest).
    acceptance:
      all:
        - verifier: tests/cli/validate-positive.t
        - verifier: tests/cli/embedded-schemas.t
  - id: this-decision-validates
    outcome: decision-is-itself-well-formed
    claim: |
      `mathc validate decisions/duplicate-mapping-keys-silent-drop-2026-10.yaml`
      exits 0 with no `MC-DUPLICATE-KEY` and no `MC-UNPARSED-TAIL`.
      A decision about silent drops that carries one would be worth
      exactly nothing.
    acceptance:
      all:
        - verifier: mathc validate decisions/duplicate-mapping-keys-silent-drop-2026-10.yaml

assumptions:
  - id: warn-not-block-is-the-right-severity
    state: assumed
    statement: |
      Refusing to type a decision because a key is duplicated, or
      because the tail was unread, would be a larger behavioural
      change than the defect warrants and would break fixtures that
      deliberately model malformed input. Warn matches
      MC-AMBIGUOUS-ACCEPTANCE and MC-MALFORMED-ACCEPTANCE, which are
      the same shape.
    owner: human:maintainer
    consequence_if_false: |
      If Warn proves too weak -- warnings scrolled past, a gate
      that keeps reporting parse-ok on a file it did not finish --
      then the codes move to Block. That is a severity flip on an
      existing code, recorded as a revision of this decision, not a
      new code.
    review_on:
      - signal: parse-ok-still-mistaken-for-complete
  - id: spec-conformant-digest-is-the-rule
    state: assumed
    statement: |
      `body_sha` / `yaml_sha` are recomputed with the algorithm in
      spec/algebra-3.2.md §7.1, which is the normative text and is
      pinned by `tests/cli/body-vs-wrapper-canonical.t`. The OCaml
      helper `lib/decision.ml::body_canonical_sha256` emits the
      placeholder prefix twice and therefore disagrees with the
      spec; that divergence is recorded, not adopted.
    owner: human:maintainer
    consequence_if_false: |
      If `body_canonical_sha256` turns out to be the intended rule
      and the spec is wrong, the digests written here are wrong in
      the same way every file written by the OCaml helper is
      already wrong. Fixing the direction is a one-line change plus
      a corpus-wide recompute; the follow-up decision should settle
      it before the next digest is written.
    review_on:
      - signal: body-canonical-helper-divergence-disputed
  - id: residual-corpus-is-work-queued-not-work-done
    state: assumed
    statement: |
      The 18 residual files will be repaired in a follow-up, one
      digest recomputation each. This decision does not schedule
      them; it makes them visible and names the command that lists
      them.
    owner: human:maintainer
    consequence_if_false: |
      If nobody picks the follow-up up, the detector stays a
      permanent scar on the corpus and the `parse-ok` verdict keeps
      meaning less than it appears to. The signal below is the
      review trigger.
    review_on:
      - signal: duplicate-mapping-keys-follow-up-unowned

risk:
  declared_triggers:
    - residual-corpus-rots-in-place
    - digest-direction-ambiguity
    - warn-spam
  residual-corpus-rots-in-place: |
    Expected. The detector names 18 files the kernel still does
    not fully read. Mitigation is the follow-up decision; the
    trigger `duplicate-mapping-keys-follow-up-unowned` fires if it
    is not claimed.
  digest-direction-ambiguity: |
    `lib/decision.ml::body_canonical_sha256` and
    spec/algebra-3.2.md §7.1 disagree, and the corpus contains
    files matching each. This decision follows the spec. If the
    kernel helper is later corrected to match, every digest written
    from here on follows automatically; the ones written here need
    no change.
  warn-spam: |
    `mathc validate` on a broken file can now print two codes
    instead of none. That is the point. The corpus will be quieter
    once the residual is repaired.
  owner: human:maintainer

reversal:
  - signal: parse-ok-still-mistaken-for-complete
    condition: |
      After this lands, `mathc validate` is still routinely read as
      "the kernel saw the whole file" -- e.g. a reviewer accepts a
      verdict produced from a truncated decision.
    action: |
      Promote MC-DUPLICATE-KEY and MC-UNPARSED-TAIL to Block so
      `mathc validate` exits 1 on both, re-issue this decision at
      revision 2 naming the promotion, and re-run the corpus scan.
  - signal: duplicate-mapping-keys-follow-up-unowned
    condition: |
      The residual 18 files are still unparsed three months after
      this decision merged.
    action: |
      Open the parser-fix decision: correct
      `lib/codec.ml::fold_continuation` (a plain scalar's
      continuation cannot be a nested key -- drop the colon test)
      and `parse_yaml_seq` (follow a multi-line quoted sequence
      item). Both change how the whole corpus parses, so they need
      their own before/after scan, not a drive-by.


intent: |
  Stop a decision file from saying more than the kernel reads.

  The report that started this found nine files with a duplicated
  YAML mapping key and put the blame on the reader: "the parser
  takes only the FIRST block and silently ignores the second". The
  reader does behave that way, but for five of the six
  `obligations:` files it never gets the chance -- the second block
  is not in the tree at all, because the loader stopped reading
  the file before reaching it and threw the remainder away without
  a word. So the reported mechanism was a minority case, and the
  reported loss (17 obligations) was the smaller half of the real
  one.

  2026-11-01, REVISION 2: THE COUNTS IN THIS FILE WERE A SNAPSHOT OF
  A CORPUS THAT KEPT MOVING, AND TWO OF THE FILES IT NAMED ARE GONE.
  The three mechanisms below are still the three the detector names,
  and the detector is still the promise. What changed is the census:

    THE RESIDUAL IS ONE FILE, NOT EIGHTEEN.
      Measured on this tree on 2026-11-01 with
      `bash scripts/scan-silent-drops.sh --validity`: one live
      decision still carries a silent-drop diagnostic --
      `decisions/mathc-packages-subcommand.yaml`, whose unread tail
      is a plain-scalar continuation under a sequence item. The
      other four files this decision could see were repaired by the
      tranche of 2026-11-01 that rewrote the stale forms
      (`decisions/3-2-cli-catalog.yaml`,
      `decisions/ci-blocking-list-config.yaml`,
      `decisions/d5-body-vs-wrapper-canonical-2026-10.yaml` and
      `decisions/forge-stub-read-request-2026-10.yaml`), and the
      corpus's own ledger
      (`tests/corpus_no_silent_drops/corpus_no_silent_drops.ml`)
      carries the remainder.

    TWO OF THE FILES THE OBLIGATIONS NAMED WERE DELETED.
      `decisions/mcp-server-impl-2026-10.yaml` and
      `decisions/yaml-block-scalars-impl-pending.yaml` no longer
      exist, and `decisions/disable-hanging-alcotest-tests-2026-10.yaml`
      no longer exists either. A verifier that names a deleted file
      is a verifier that fails for a reason that has nothing to do
      with the promise, so the obligations now name the files that
      are still there.

    THE DIGEST DIVERGENCE THIS FILE RECORDED IS REPAIRED.
      The counterexample below reported that
      `lib/decision.ml::body_canonical_sha256` emitted the scheme
      prefix twice and therefore disagreed with the contract's §7.1,
      and that the corpus carried files matching each side. The
      helper has since been corrected: the OCaml implementation, the
      Python reference (`scripts/axiom-link-seed.py::recompute_sha`)
      and the contract's §7.1 now agree, which `mathc rehash
      --dry-run` over the corpus confirms (no file to change) and
      `tests/cli/body-vs-wrapper-canonical.t` pins by recomputing a
      digest with the reference implementation and comparing.

  What the loader actually does, verified against the corpus:

  D1 duplicated key. `parse_yaml_pairs` (`lib/codec.ml`) binds
     every occurrence, so both blocks land in the tree. Every
     reader (`lib/schema.ml::take_string` / `take_array` /
     `take_object` / `take_number`) resolves a key with
     `List.assoc_opt`, which returns the FIRST binding. The later
     block is therefore not overridden -- it is UNREACHABLE.
     The corpus file in this shape was
     `decisions/mcp-server-impl-2026-10.yaml`; it has since been
     deleted from the corpus, and five obligations were outside the
     gate while it lived.

  D2 the loader abandons the document. When
     `parse_yaml_pairs` meets a token deeper than the mapping it is
     closing it returns early, and `load_yaml_string` was
     `let pairs, _ = parse_yaml_pairs tokens 0` -- the unconsumed
     token list was dropped on the floor. `mathc validate` then
     reported `parse-ok`. Every top-level key after the stop point
     vanished: `obligations:`, `risk:`, `relations:`, `reversal:`.

     The corpus reached D2 through three different inputs, and
     `yq` (a spec-conforming YAML reader) rejected 17 of the 28
     affected files outright as it stood when this decision was
     written:

       (a) a folded plain scalar whose continuation line carries
           `: ` -- per YAML 1.2 a plain scalar may not contain
           `: `, so such a file is invalid YAML and the author is
           wrong; `fold_continuation`'s colon test is a reasonable
           accommodation, not the bug.
       (b) a quoted sequence item continued on following lines at a
           deeper indent. This was VALID YAML that `parse_yaml_seq`
           could not follow -- a genuine kernel gap, since repaired
           by `fold_seq_item` in `lib/codec.ml`.
       (c) a sequence item indented less than its siblings, or a
           plain scalar continued on a deeper line under a sequence
           item. Invalid YAML; author error. The one file still in
           this shape is `decisions/mathc-packages-subcommand.yaml`.

  D3 a second `---` marker. `strip_frontmatter` reads the first
     `---` as front-matter and stops at the next one, BEFORE
     tokenisation -- so the leftover list comes back empty and the
     loss is invisible to a D2 check. Two corpus files carried a
     trailing `---`; one of them
     (`decisions/forge-stub-read-request-2026-10.yaml`) was
     repaired on 2026-11-01.

  Measured with the kernel as the oracle (`mathc validate` per
  file over `decisions/**/*.yaml`, 235 files at the time): 28 files
  affected, 30 diagnostics. Not 9.

  2026-11: three scope paths named decisions the cull of 2026-10-29
  deleted - the MCP server implementation, the YAML block-scalar deferral
  and the decision that disabled the hanging alcotest tests. A scope path
  that names no file is a digest of nothing, so the three are gone from the
  scope; the decisions they named live in git history.

commitment: |
  After this commit lands on its branch:

  1. `mathc validate` emits `MC-DUPLICATE-KEY` (Warn, kind
     Conflict) once per duplicated key in a decision, naming the
     key, its dotted path and the source lines. A key declared
     three times is ONE diagnostic, not two.

  2. `mathc validate` emits `MC-UNPARSED-TAIL` (Warn, kind Input)
     when the loader did not read to EOF, naming the first unread
     line; and, separately, when the file carries a second `---`.

  3. Both codes are registered in `lib/diagnostic.ml::explain`, so
     `mathc explain-diagnostic <CODE>` describes them.

  4. Detection reads the SAME `Jsonl.value` the readers consume
     (`Codec.duplicate_keys`), so "what is duplicated" and "what is
     dropped" cannot disagree. No text-level YAML scanner is
     involved: re-deriving block-scalar bodies and sequence-item
     scopes in a second implementation is the defect class being
     fixed.

  5. Severity is Warn, not Block. The kernel still types the
     surviving prefix, so refusing the file would be a larger
     behavioural change than the defect warrants; and the two
     sibling acceptance diagnostics are already Warn for the same
     reason. Promoting either to Block is a separate decision.

  6. The decisions that duplicated `obligations:` no longer do. Of
     the six named in the original report, FOUR are still in the
     corpus -- `decisions/cli-canonical-name.yaml`,
     `decisions/mathc-explain-subcommand.yaml`,
     `archive/decisions/site-version-from-file-2026-10.yaml` and
     `decisions/waiver-infrastructure-2026-10.yaml` -- and each of
     the three live ones validates with no `MC-DUPLICATE-KEY` and no
     `MC-UNPARSED-TAIL`. The two that were deleted from the corpus
     (`decisions/mcp-server-impl-2026-10.yaml`,
     `decisions/yaml-block-scalars-impl-pending.yaml`) live in git
     history; the archived one is a record and is not asked to
     validate.

  7. The decisions that duplicated `counterexample:` no longer do:
     `decisions/mathc-counters-subcommand-2026-10.yaml`,
     `decisions/parser-risk-owner-default.yaml` and
     `decisions/yaml-block-scalars.yaml` each validate with no
     `MC-DUPLICATE-KEY`. The fourth
     (`decisions/disable-hanging-alcotest-tests-2026-10.yaml`) was
     deleted from the corpus and lives in git history.

  8. `decisions/yaml-block-scalars.yaml` no longer declares
     `result:` twice in one acceptance item.

  9. `lib/init/init.ml`'s scaffold template no longer emits two
     stray lines at column 0 (`- verifier: ...` / `result: pass`),
     which made every project created by `mathc init` parse only up
     to its first obligation: `risk:`, `relations:` and everything
     after were dropped while the file still reported `parse-ok`.
     This one was found BY the detector, not by reading the corpus
     -- see `counterexample`.

counterexample: |
  What this change does NOT do, recorded so nobody reads the
  detector as "the corpus is clean":

  A detector is not a fix. The corpus scan that motivated this
  decision is reproducible, and its residual is recorded rather
  than forgotten:

        for f in $(find decisions -name '*.yaml'); do
          mathc validate "$f" 2>&1 >/dev/null \
            | grep -oE 'MC-(DUPLICATE-KEY|UNPARSED-TAIL)' \
            | sort -u | sed "s|^|$f: |"
        done

  On 2026-11-01 it reports ONE live decision --
  `decisions/mathc-packages-subcommand.yaml` -- after the four
  repairs of that day. The corpus's own ledger
  (`tests/corpus_no_silent_drops/corpus_no_silent_drops.ml`) pins
  that residual in both directions: a file that grows a silent drop
  is red, and a ledger entry that is no longer an offender is ALSO
  red. The repair of the last one belongs to a later tranche.

  Also not done: the parser-side fixes. `fold_continuation`'s
  colon heuristic and `parse_yaml_seq`'s inability to follow a
  multi-line quoted sequence item were kernel defects, and fixing
  them changes how every file in the corpus parses. That is its
  own decision with its own blast-radius review; see
  `reversal`. The sequence-item half has since been repaired
  (`fold_seq_item` in `lib/codec.ml`); the plain-scalar colon
  heuristic has not.

  Also found by running the detector, and reported here because
  "the class is wider than the corpus" cuts both ways. The detector
  has one false positive, caught by `tests/cli/*.t`: it first
  re-parsed EVERY validated input as YAML, so a `.json` fixture
  stalled on its opening `{` and reported a tail the verdict was
  never computed from. `parse_file` dispatches on the extension,
  so `MC-UNPARSED-TAIL` is now scoped to `.yaml`/`.yml`; the
  duplicate-key walk needs no such guard because it reads the
  parsed tree, which is the same object for both formats.

  And one true positive nobody had asked about: `mathc init`
  scaffolded a template that is not valid YAML. Two lines pasted
  at column 0 end the loader inside the first obligation, so every
  project `mathc init` creates silently loses `risk:` and
  `relations:`. The corruption came from `3ef9e20`, and it had
  been in the template since; four cram tests were pinned to the
  broken output and only turned red when the detector landed.

  Third: the byte-range algorithm had two implementations that
  disagreed. `lib/decision.ml::body_canonical_sha256` emitted the
  scheme prefix twice and therefore disagreed with the contract's
  §7.1, and the corpus carried files matching each side. The
  divergence was observable and was fixed at the source rather
  than papered over by matching a bug: the helper, the Python
  reference (`scripts/axiom-link-seed.py::recompute_sha`) and §7.1
  now agree, and the cram fixture recomputes a digest with the
  reference implementation and compares it with what the kernel
  stores.


intent: |
  Fix a pipe-buffer deadlock in `lib/mcp/dispatch.ml::run_with_args`.
  The prior implementation drained the child's stdout and stderr with
  two blocking `Unix.read` calls per loop iteration. When the child's
  stdout exceeded the 64 KiB pipe buffer — which `mathc packages
  --format=json` now does (187 KiB at 189 decisions / 1286
  attestations) — the child blocked on pipe_write(stdout) while the
  parent blocked on pipe_read(stderr): a deadlock. Every MCP
  `mathc/packages` call, and every cram test that routed a
  `mathc/packages` (or `mathc/gate`, which shells out to `mathc
  packages`) request through `mathc_mcp`, hung indefinitely.
  Symptom observed 2026-10-18: ~24 `mathc_mcp` + ~26 `mathc packages
  --format=json` + ~6 `dune_cram_*.main.sh` processes accumulated,
  each blocked 40 min to 17 h.

commitment: |
  `run_with_args` drains stdout and stderr concurrently via
  `Unix.select`, so the parent never blocks reading an empty pipe
  while the child blocks writing a full pipe. The two 64 KiB pipe
  buffers are multiplexed: whichever end is ready is read first.
  No other call site changes; the `outcome` shape (exit_code /
  stdout / stderr_tail) and the `max_bytes` (16 MiB) cap are
  unchanged.

axiom_link:
  - A0
  - A1

counterexample: |
  The strongest objection: "the correct fix is to shrink `mathc
  packages --format=json` so it never exceeds the pipe buffer, not
  to make `run_with_args` robust to arbitrarily large output."
  Acknowledged: shrinking the payload is a worthwhile, separate
  hardening (a `--limit` / streaming flag on `mathc packages`), but
  the subprocess drain is *correct* to fix regardless — any child
  whose combined stdout+stderr exceeds 64 KiB deadlocks under the
  old code, so the multiplexed drain is the load-bearing invariant.
  `select` adds no measurable latency for the kilobyte-scale
  subcommands the comment already anticipated.

outcomes:
  - id: mcp-packages-no-deadlock
    statement: |
      A `mathc/packages` request through `mathc_mcp` returns within
      seconds (exit 0) on a tree where `mathc packages
      --format=json` emits > 64 KiB, instead of hanging.


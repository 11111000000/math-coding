counterexample: |
  "winget and Scoop both exist; we should not duplicate
   the upstream-PR model." Counterargument: the two
   packages serve different user populations;
   Microsoft's winget preinstalls on Windows 11 +
   ships via `App Installer`, while Scoop is opt-in.
   Submission latency also differs (winget: 1-7 days;
   Scoop: hours). Bundling both manifest generators
   keeps the maintenance cost low (one Python
   generator per packager).

  "The manifest files belong in
   microsoft/winget-pkgs, not here." Counterargument:
   the source-of-truth for the manifest schema is
   microsoft/winget-pkgs; the source-of-truth for
   "what version, what SHA-256, what release date"
   is math-coding's release tag. Keeping the generator
   here lets a maintainer regenerate a past manifest
   on a backport commit; storing the rendered files
   here (under `tools/winget/manifests/`) keeps the
   math-coding release reproducible.

  "Microsoft reviews wingset submissions and may reject
   math-coding for tagging or naming choices."
   Counterargument: the rejection pattern typically
   resolves in 1 round-trip PR comments; Microsoft
   treats first-time submitters with leeway. If the
   submission stalls, the decision is recorded under
   `reversal.rejection-stuck` and a follow-up cycle
   handles re-submission.


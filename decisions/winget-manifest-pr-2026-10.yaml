intent: |
  Ship the `mathcoding.mathc` package in the
  Microsoft `winget-pkgs` repository so Windows 10+ /
  Windows 11 users can run `winget install
  mathcoding.mathc` and land at `mathc version`. The
  installer artifact (mathc-windows-x86_64.exe + SHA-256)
  ships every release today; the missing piece is the
  upstream manifest submission that makes winget
  discover it.

  Per Microsoft's contribution rules, the manifests
  live in
  `microsoft/winget-pkgs/manifests/<publisher-letter>/<publisher>/<package>/<version>/`.
  We pre-build these from a Python generator in this
  repo (`tools/winget/scripts/render-winget-manifest.py`)
  so the maintainer's submission step is a copy +
  push.

commitment: |
  `tools/winget/` exists in the math-coding repository
  and contains:
    - `PUBLISH.md` — the operator runbook for opening
      the upstream PR (steps, fork setup, validation).
    - `manifests/m/mathcoding/mathc/` — the versioned
      manifest set, one folder per `vX.Y.Z` release.
      Each folder carries:
        - `mathcoding.mathc.installer.yaml`
        - `mathcoding.mathc.locale.en-US.yaml`
        - `mathcoding.mathc.defaultLocale.yaml`
        - `Versions/X.Y.Z.yaml`
    - `scripts/render-winget-manifest.py` — the
      generator that produces the four files
      deterministically from
      `--version`, `--sha256-windows-x86_64`, and
      `--release-date`.

  The first manifest set (v3.3.0) is committed
  alongside this decision; the maintainer's manual
  step is to push them to a fork of
  `microsoft/winget-pkgs` and open the PR. The PR
  review and merge is owned by Microsoft; the
  decision's obligation closes on PR submission,
  not PR merge.

  Schema conformance: the YAML files conform to
  winget schema 1.6.0
  (https://aka.ms/winget-manifest.installer.1.6.0.schema.json,
  .locale.1.6.0.schema.json,
  .version.1.6.0.schema.json). Strict conformance is
  verified on a Windows host running
  `winget validate`; the repo does not embed schema
  validators.


intent: |
  Close the F13 finding: the brownfield-experiment v2 design
  document (`docs/experiments/brownfield-experiment-v2-2026-10.md`)
  did not include `mathc doctor` in either the preflight
  (§8 Phase 0) or the per-task T1 instrumentation (§5).
  `mathc doctor` was already shipped
  (`verify-mathc-doctor-ships-2026-10@1`, decision C3 of
  `plan-2026-10-adoption-fixes-2026-10`); the gap is that the
  experiment's design doc did not call for it. Without an
  instrumented doctor run, sub-agents doing T1 (`mathc adopt`
  discovery) cannot tell install/path/latest/config/decisions/
  attestations/self-check health from a single JSON snapshot,
  and a doctor failure is left to be rediscovered mid-task as
  an F-INSTALL friction rather than caught up-front as a
  preflight red flag.

  This decision adds three edits to the experiment design
  document: a §5 T1 step 6 that runs `mathc doctor --json`
  and records any `status: fail` as a friction event under
  F-INSTALL; a §8 Phase 0 preflight line that runs doctor on
  a fresh cwd and saves the JSON snapshot as
  `experiments/brownfield-v2/preflight-doctor.json`; and a
  new §3 hypothesis BH9 that asserts ≥ 7 healthy sections
  on ≥ 4 of 5 projects.

commitment: |
  The cycle closes when:
  (a) §5 T1 in the brownfield-experiment v2 design doc
      carries step 6: "Run `mathc doctor --json` and capture
      the output to `experiment-report.md` §T1. Record any
      section with `status: fail` as a friction event id
      `<session>-F-DOCTOR-<n>` under F-INSTALL. Make
      `mathc doctor` part of the instrumented task rather
      than an afterthought."
  (b) §8 Phase 0 in the same doc carries the preflight
      checklist line: "Verify `mathc doctor` returns exit 0
      on a fresh cwd; capture the JSON output and save as
      `experiments/brownfield-v2/preflight-doctor.json`. A
      doctor that exits non-zero on a fresh install is a
      red flag for any sub-task that follows."
  (c) §3 in the same doc carries the BH9 row
      "`mathc doctor` reports ≥ 7 healthy sections on a
      fresh install on ≥ 4 of 5 projects" with the falsifier
      spelled out.
  (d) `mathc self-check` reports the same 188 pass subjects
      as at the pre-state of this commit and zero NEW
      unknown subjects attributable to this change.


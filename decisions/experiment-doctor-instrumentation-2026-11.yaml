counterexample: |
  The counter-position considered: "`mathc doctor` is
  invoked by `mathc self-check` already; instrumenting it
  again in the experiment doc is double-coverage." Rejected
  on three grounds. (a) `mathc self-check` checks the
  current repo's attestation store; it does not emit a
  per-section health JSON. `mathc doctor --json` does both:
  it lists each section (`install`, `path`, `latest`,
  `config`, `decisions`, `attestations`, `self_check`) with
  its own status, plus a top-level `verdict`. Without
  `--json`, an F-INSTALL finding would be visible only as
  a single human-readable stderr line that sub-agents do
  not capture or compare across the 5 projects. (b) The
  experiment is a measurement of the brownfield *user*
  path, which does not include `mathc self-check` (that is
  the maintainer path). An end-user running
  `mathc adopt` on a freshly-cloned project is far more
  likely to encounter the install/path sections first; the
  instrumentation must mirror that order. (c) The 5
  sub-agent reports are merged into a single
  `experiment-report.md` per project; without an explicit
  per-project doctor snapshot, the merge step has nothing
  to compare BH9 against.

  A second counter-position: "BH9's threshold (≥ 7
  healthy sections on ≥ 4 of 5 projects) is too lax; the
  red-flag interpretation is wrong because doctor reports
  up to ~12 sections on a healthy install." Acknowledged:
  the wording is intentionally conservative because
  `mathc doctor`'s section count varies by platform (no
  `scoop` section on Linux, no `homebrew` section on
  Windows). The threshold "≥ 7 healthy of the seven
  required sections" (`install`, `path`, `latest`,
  `config`, `decisions`, `attestations`, `self_check`)
  is the strict reading; the falsifier applies if any of
  those seven required sections reports `fail` on ≥ 2
  projects. The wording in the doc carries both readings
  so the operator can pick the strict one.


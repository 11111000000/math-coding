counterexample: |
  (a) "The cycle is slow because the corpus is large; the fix is to
  make the corpus smaller." Rejected on the measurement: the corpus
  is not what the cycle spends its time on. 78 % of the cycle is the
  aggregator, and 43 % of the aggregator is five fixtures, three of
  which pay for a dev shell they are already standing in. A smaller
  corpus would make the digest cheaper by a few hundred
  milliseconds; it would not make the three `nix develop` calls go
  away.

  (b) "Speed is a matter of taste; the protocol's value is in the
  evidence, not in the seconds." Rejected mechanically: an evidence
  chain that is not affordable per change is an evidence chain that
  is not collected per change. The cost is not a taste question; it
  decides whether the method is used at the moment it would have
  prevented the defect, or after the defect, when it only records
  it.

  (c) "The sweep's 891 files are the price of honesty: every
  attestation must name the tree it observed." Rejected as a
  non-sequitur: the honesty requirement is that an attestation name
  the tree it observed. It is not that an attestation whose scope
  the change did not touch must be REWRITTEN. The store churn and
  the honesty requirement are different things, and only the second
  one is constitutional.
antithesis: |
  The opposite claim would be that the cost profile is not a property
  of the method but a property of a corpus that grew past what a
  method can carry: 253 decisions, 891 attestations, 1215 test
  files, 129 cram transcripts. On that reading, the correct answer is
  to STOP -- to freeze the corpus at a size where the cycle is
  affordable, and to let the method govern the thing it was made for
  (a project's own source) rather than its own bookkeeping.

  That claim deserves a real answer, because the cost is real and it
  does grow with the corpus. It is rejected on WHERE the cost sits.
  The measured shares say the cost is not in the corpus's size: it
  is in five fixtures, three dev-shell startups and two duplicate
  scans. A corpus half the size would leave those five fixtures
  costing the same, because they are not measuring the corpus --
  they are measuring how the check is WIRED. The freeze would trade a
  method that grows for a method that stops, and would do it to
  preserve a cost that is mostly wiring.

  What the claim does establish is a bound the method has not yet
  reached: the corpus grows, the sweep grows with it, and the four
  levers below buy time, not a ceiling. At some corpus size the
  cycle stops being affordable per change and the fast path becomes
  the only path, and then the question is whether the full evidence
  is still worth what it costs. That question is real, it is not
  answered here, and it should be asked against a MEASURED profile
  rather than a remembered feeling.

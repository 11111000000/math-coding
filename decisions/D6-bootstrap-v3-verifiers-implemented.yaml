obligations:
  - id: D6-verifiers-machine-checked
    statement: |
      Every bootstrap-v3 obligation is reachable from a CI
      command. `mathc self-check` returns verdict `pass` on a clean
      HEAD.
    outcome: D6-closed
    acceptance:
      all:
        - verifier: mathc self-check exits 0
          result: pass

evidence:
  - kind: observed
    statement: |
      On commit 8fa7fcf, the CI step `mathc self-check (bootstrap-gate
      block)` runs `nix develop .#test --command bash -c '...';
      mathc self-check > /tmp/self-check.json 2> /tmp/self-check.err;
      echo exit=$?` and prints `self-check exit=0`. The JSON
      payload contains `verdict=pass`, `subjects_count=23`,
      `pass_count=23`.


intent: |
  Close the B2 sub-decision of
  `plan-2026-11-adoption-fixes-2026-10` §4 (R5-continuation):
  `scripts/axiom-link-seed.py` and
  `scripts/counterexample-seed.py` write to math-coding's own
  tree and ignore `MATH_CODING_DECISIONS_DIR`. Add env-var
  support matching the kernel's behaviour (P-F11-A4 baseline
  established by `fix-generate-attestations-env-2026-10`).

commitment: |
  Both scripts honour the env-var precedence
  `MATH_CODING_DECISIONS_DIR` > `<repo_root>/decisions`, where
  `repo_root` defaults to
  `Path(__file__).resolve().parent.parent`. The default fallback
  matches the kernel's three-tier resolver at
  `lib/path_config.ml::resolve_decisions_dir` so a user who
  exports one of `MATH_CODING_DECISIONS_DIR=.math-coding/decisions`
  is honoured by both Python and OCaml sides. Idempotency is
  preserved: running each script twice with the same env still
  produces identical output.

axiom_link:
  - A0
  - A1
  - A4

counterexample: |
  Resisting a counter-position: "the scripts only ever run
  against this repository's own `decisions/` tree, so
  env-var support is over-engineering." Acknowledged:
  the canonical use-case is local dogfooding, but the same
  scripts are reused in adoption experiments where the
  target project routes its decisions tree via
  `MATH_CODING_DECISIONS_DIR=.math-coding/decisions` (per
  `docs/experiments/adoption-2026-10.md` §10.5 #1, #2, #3,
  reproduced in 5 of 5 project reports). Without env-var
  awareness, the scripts silently mutate the host checkout's
  `decisions/` instead of the experiment target's
  `.math-coding/decisions/`.

  A second counter-position: "extending the precedence to
  three tiers (env > .math-coding/decisions > decisions)
  matches the kernel and is the cleaner fix." Rejected for
  this slice: the Python scripts have no `mathc init`
  integration, so the `.math-coding/` default-discovery
  fallback would be acting on a directory the user never
  asked the script to look at. The two-tier precedence
  (env > `<repo_root>/decisions`) keeps each script's blast
  radius bounded to its own repo checkout unless the user
  explicitly opts in via the env var, matching
  `scripts/generate-attestations.py` (F11-A4 reference impl).


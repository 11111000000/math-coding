intent: |
  `lib/render.ml` is 3040 lines and is the single largest
  source file in the kernel. It mixes a hand-rolled markdown
  parser, a navigation model, page chrome (head/footer/page
  skeleton), three near-identical home-page renderers (en/ru/zh),
  a YAML subset for the per-decision page, an RSS feed, two
  embedded single-page applications (dashboard, graph), file
  readers, and the build_pages orchestrator. Splitting it is
  pure reorganisation: the public API (`Render.config`,
  `Render.build_pages`, `Render.md_parse`, `Render.rss_*`,
  `Render.default_version`, the `page` record) is preserved
  by re-exports.

commitment: |
  `lib/render.ml` is moved verbatim under `lib/render/render.ml`
  and packaged as a new dune library `mathcoding_render`. The
  flat `lib/render` module is dropped from `lib/dune`'s
  `(modules ...)`. `bin/dune` and `tests/dune` add
  `mathcoding_render` to their `(libraries ...)` lists. No
  public symbol changes; every existing call site in
  `bin/Mathc.ml`, `bin/md_probe.ml`, and `tests/render_kernel.ml`
  continues to resolve through `Render.*`.

outcomes:
  - id: render-is-its-own-library
    statement: |
      `lib/render/render.ml` is a separate dune library
      `mathcoding_render` and is the only file in that
      library; subsequent splits (Phase 1+ of the refactor)
      land as additional modules in the same `lib/render/`
      directory.

scope:
  paths:
    - lib/render.ml
    - lib/render/render.ml
    - lib/render/dune
    - lib/dune
    - bin/dune
    - tests/dune

obligations:
  - id: render-library-builds
    claim: |
      `dune build` succeeds with `lib/render/render.ml` as
      the only module of the new `mathcoding_render` library.
    acceptance:
      all:
        - verifier: dune build
          result: pass
        - verifier: tests/render_kernel.exe
          result: pass

axiom_link:
  - A0

counterexample: |
  Splitting `lib/render.ml` into a new dune library
  `mathcoding_render` is a pure reorganisation today and
  introduces friction (a separate dune stanza, separate test
  wiring, separate clean-target) for no functional payoff at
  Phase 1 — Phase 1A follow-ups (`render-module-split-phase1a`)
  are the work that actually need the library boundary. The
  strongest objection is that this commit is gold-plating: it
  touches dune files, test wiring, and CI without delivering
  any of the planned Phase 1B+ sub-module splits that the
  library boundary is meant to support. A more conservative
  path would defer the library split to a commit that
  *simultaneously* lands Phase 1B, so the boundary is exercised
  by the new module on day one. Reversal condition: when a
  future Phase (1B, 2, etc.) lands a second module inside
  `lib/render/`, the library split becomes load-bearing and
  no-longer gold-plating; until then, this commit's value is
  entirely as a forward-compatible foundation, and a reviewer
  may legitimately question whether the foundation is worth
  its own commit.


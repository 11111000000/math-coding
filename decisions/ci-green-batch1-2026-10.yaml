---
schema: math-coding/3.2
id: ci-green-batch1-2026-10
revision: 1
state: active
intent: |
  Unblock `nix flake check` and `dune test` on the v3.3.3 mainline.
  The repository has accumulated four independent CI-blocking defects
  since v3.3.0 (commit `7454925`):

    1. `flake.nix:230-235` declared `hooks.decision-fixture-co-commit.entry`
       as a Nix-path attribute (`./scripts/.../...sh`). pre-commit-hooks.nix
       requires a string; this error blocks `nix flake check` evaluation
       BEFORE any derivation builds. The same flake.nix stanza also
       references `hooks.ocamlformat` (not a built-in pre-commit-hooks
       hook) and `hooks.shellcheck` (with `args` set); both lack an
       explicit `entry`, which makes pre-commit-hooks.nix try to
       evaluate `args` before resolving the default entry and throw
       "no value defined".

    2. `scripts/dev:281` greps the old filename `OCAML_BEST_PRACTICES.md`
       to count trap-log entries; the file was renamed to
       `OCAML_KERNEL_CONVENTIONS.md` at v3.3.3 (commit `6c3e8c9`).
       `scripts/dev doctor` therefore always reports `trap entries: `
       and fails the "trap log has 25+ entries" check. The same broken
       filename is at `scripts/agent-debug:53`, breaking the `--explain
       §11.N` mode (it `awk`s the missing file and exits 2).

    3. PACKAGES.md (line 36: `**735 files**`) and ROADMAP.md (line 7)
       carry attestation counts that were accurate at the 2026-10-14
       snapshot but stale at HEAD 352ff2b1. `tests/counters_drift.ml`
       dynamically computes the live count and looks for it as a
       literal substring in both files; the drift makes the test
       fail unconditionally on every CI run.

    4. `lib/import_adr/import_adr.ml::to_decision_yaml` writes a
       decision YAML without a `risk:` body section. The two scaffold
       files this produces (`decisions/1-foo.yaml` and
       `decisions/1-use-postgresql.yaml`, both gitignored) appear on
       disk after the first cram run; `tests/process_principles.ml::test_p1`
       rejects them with `P1: ... missing body sections: risk`. The
       failure persists until the developer manually deletes the
       two files.

  This decision records one bundled fix: each defect is closed by a
  targeted edit, all on the same branch `fix/ci-green-batch1-2026-10`,
  with one commit per defect. Five kernel-surface edits total, all
  in `flake.nix`, `scripts/`, `lib/import_adr/import_adr.ml`,
  `tests/render_kernel.ml`, `tests/rebuttal_forge_stub.ml`. Plus the
  two documentation counter updates.

  Out of scope (recorded as separate decisions / follow-ups):

    - Tier 2G: `tests/support/forge_stub/forge_stub.ml::read_request`
      has a recursive loop that never returns when the HTTP client
      keeps the connection open after sending headers. This makes
      `tests/rebuttal_forge_stub` time out at `wait_until_ready`.
      The test was already broken before this batch; tracked in
      `decisions/<TBD>.yaml` (rev 2 to follow).

    - Tier 3: 53 cram-test snapshots show diff vs their
      `.corrected` siblings. Categories: (a) temp-dir noise in
      `tests/cli/adopt*.t`, `tests/cli/init*.t` — fix the helper
      to mask `nix-shell.XXXX/build_XXXX_dune/tmp.XXXX` substrings.
      (b) stale snapshots in `tests/cli/{install,counters-schema-
      introspection,embedded-schemas}.t` — regenerate via
      `dune runtest --auto-promote` after confirming the new
      behaviour matches the spec. (c) real regressions in
      `tests/cli/{gate-pass,gate-fail,doctor}.t` — investigate
      whether the test or the kernel changed.

    - 339 references to `OCAML_BEST_PRACTICES.md` and 241 to
      `AGENTS.md` in OCaml comments and markdown — text references
      are not broken (only one real markdown link, in USAGE.md:60,
      is the actual broken link), but the references should be
      replaced in batches as touched files get other edits.

  Boundary: no spec/ or schemas/ change. No policy.yaml change.
  No axiom change. No surface change to the binary (subcommand
  count stays at 36; the existing `mathc import-adr` subcommand
  gets one more template field, which the binary emits through
  the same code path).

axiom_link:
  - A0
  - A1
  - A3

antithesis: |
  The counter-position considered and rejected: "These four
  defects are independent and should ship as four separate
  PRs, each with its own review cycle. Bundling them in one
  decision muddies the audit trail." The author engaged with
  this position and rejected it on four grounds: (a) all four
  defects share the same trigger (`nix flake check` and `dune
  test` both fail on `main`; a release that ships with red CI
  is a release that has not been verified); (b) each defect is
  small (one or two lines), so the audit value of splitting
  them is low — there is no architectural decision in any of
  them, only mechanical fixes; (c) bundling keeps the release
  cycle fast (one merge, one CI run, one release); (d) the
  math-coding audit trail is the commit message + the decision
  + the verification, not the decision count per change. Four
  commits, one decision, one merge — the audit trail is intact.

commitment: |
  Six commits on branch `fix/ci-green-batch1-2026-10`, all
  cherry-pickable onto `main` independently. Each commit's
  message references this decision.

    C1. `fix(ci): nix flake check + scripts/dev/agent-debug`
        — `flake.nix` (entry = string for 3 hooks),
        `scripts/dev:281` (filename rename), `scripts/agent-debug:53`
        (filename rename).

    C2. `fix(docs): PACKAGES.md / ROADMAP.md counters`
        — `PACKAGES.md:36` (735 → 737), `PACKAGES.md:41`
        (188 active → 189 active), `ROADMAP.md:7` (735 → 737).

    C3. `fix(scripts): dev-fast-test list`
        — `scripts/dev-fast-test:154-178`: add
        `tests/decision_addresses_equality.exe` and
        `tests/junit_test.exe` (the two tests added after
        the list was hardcoded).

    C4. `fix(scripts): dev banner version 3.3.1 → 3.3.3`
        — `scripts/dev:2, 271` (version literal).

    C5. `fix(tests): render_kernel.ml DUNE_SOURCEROOT → walk-up`
        — `tests/render_kernel.ml`: add `project_root ()`
        resolver near line 631, replace 9 fallback sites
        that used `None -> ".."` (broke when invoked from
        the repo root, since `..` resolves above the project
        root).

    C6. `fix(import-adr): add risk: block to decision template`
        — `lib/import_adr/import_adr.ml::to_decision_yaml`:
        add a draft-stage `risk:` body section so scaffold
        files pass `tests/process_principles.ml::test_p1`.

    C7. `fix(tests): rebuttal_forge_stub.ml path resolution`
        — `tests/rebuttal_forge_stub.ml::spawn_stub`: walk up
        to `dune-project` (the test exe is 3 parents below
        the project root, the previous code went up only 2).

counterexample: |
  "These fixes are wrong because the broader pattern — the
  fallback to `..` for the project root, the missing risk:
  in the import template, the stale counters in PACKAGES.md —
  is a symptom of a deeper problem: the kernel is not strict
  enough about its own invariants. The right fix is to make
  the kernel stricter, e.g. require `risk:` at the schema
  level (not just in `test_p1`), reject `DUNE_SOURCEROOT` unset
  for tests that need a project root, and require counters
  to be re-emitted by `mathc packages --write` on every
  release." The counterargument fails because the broader
  hardening IS the right next step, but it is not a precondition
  for the four small fixes that unblock CI today. The decision
  `kernel-strictness-v3.4` (or similar) records the broader work
  as a separate decision; this one is a mechanical unblock.

  "Why not just delete `process_principles.ml::required_body_sections`
  to exclude `risk:` for imported ADR scaffolds?" Because the
  test's purpose is to enforce the schema at the doc layer; the
  right fix is for the importer to emit a complete skeleton,
  not for the test to exempt a class of decisions. The exporter
  fix is local and idempotent.


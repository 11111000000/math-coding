risk:
  declared_triggers:
    - "a floor the repository cannot meet, and every change it covers
      is blocked, and a block that cannot be lifted is not a gate"
    - "a citation that resolves to nothing, and the rule accepts a
      string as a commitment"
    - "a citation that resolves to a decision whose scope does not
      cover the change, and the commitment is named but never checked"
    - "a record that leaves the corpus and takes a promise with it,
      and git keeps the bytes but nobody reads the bytes"
  owner: human:maintainer

counterexample: |
  "This makes the gate easier to pass, and the gate was the only
  thing standing between this repository and a corpus that says
  whatever is convenient."

  The claim is the right one to suspect of any change that loosens a
  rule, and the answer is in what did NOT change. The evidence rules
  are untouched: an obligation without fresh evidence is still
  MissingEvidence, and the CI step still reads the verdict's exit
  code. What changed is WHICH COMMITMENTS a change has to carry, and
  the change that carries fewer of them carries a NAMED one: the
  trailer names a decision, the kernel resolves it, and that
  decision's obligations are evaluated with the change. A commit
  that implements `bootstrap-v3@3` and says so is measured against
  `bootstrap-v3@3`. A commit that names nothing, or names something
  that does not exist, is blocked -- and the fixture pins both.

  The stronger version of the objection is about the floors
  themselves: `standard` on `lib/**` is the same floor the policy
  declared before this change, so the change cannot have made the
  kernel's answer to a kernel change smaller. It could not: the
  protected-path rule, not the floor, was the binding constraint, and
  it is the protected-path rule that this change aligns with the
  spec. The floors were dead, so aligning them changed nothing about
  the gate and everything about the HONESTY of `mathc mode`: the
  command now answers what the policy says.

  And the third part -- the corpus losing twenty-three decisions --
  is the part that should worry a reader most, because a smaller
  corpus is a corpus that asks fewer questions. The answer is what
  those twenty-three were: records, by their own `change_kind`, of
  implementations of commitments that are still in the corpus. Their
  obligations were obligations about work that shipped; the rule they
  implemented is still there, still scoped, still checked. The
  promise did not leave with the record; the RECORD left with the
  promise, which is the wrong way round.

antithesis: |
  The opposite claim is that the corpus should keep everything and
  let the WORKLIST mark what is stale: the records are harmless, the
  list is the instrument, and nothing is lost.

  The claim is right about the instrument -- `mathc gaps` names every
  open promise with its class, and that list is what makes the debt
  actionable -- and wrong about harmlessness. A record that sits in
  the corpus is a commitment the gate holds the project to: its
  obligations are obligations, its scope is a scope the gate reads
  when a change touches a matching path, and its unkept promises are
  unknown subjects for ever. The twenty-three records that left
  carried ninety obligations, and none of them was a promise anyone
  intended to keep. The list and the corpus answer different
  questions, and the corpus is the one a machine reads at every
  commit.


---
schema: math-coding/3.2
id: migration-mechanism
revision: 3
state: active
negative_control: tests/cli/migrate-malformed.t
body_sha: "sha256:133f1ac8ce1be15a49c32896dbc4a8633d98f2081412c70a16b8e91690b17b7b"
yaml_sha: "sha256:133f1ac8ce1be15a49c32896dbc4a8633d98f2081412c70a16b8e91690b17b7b"
intent: |
  Give math-coding agents a deterministic, reproducible, kernel-driven
  way to migrate `decisions/*.yaml` between minor versions of the schema.
  The mechanism is live: `lib/migrate.ml` parses a declarative manifest,
  `bin/Mathc.ml::do_migrate` walks the requested decision tree, and the
  default command emits a per-file plan. The two one-shot Python scripts
  that predate this mechanism are absent from the tree; their history is
  preserved in git.

  2026-10-31, REVISION 3: THE PROTOCOL AND CONVENTION ANCHORS MOVED.
  The mechanism and its behaviour did not. The implementation anchor is
  `lib/migrate.ml::apply_actions` and the dispatcher anchor is
  `bin/Mathc.ml::do_migrate`; exit-code conventions live in
  `OCAML_KERNEL_CONVENTIONS.md §4.3`; the kernel toolchain rule lives in
  `KERNEL_AGENTS.md §OCaml toolchain — hard requirement`. The old
  `OCAML_BEST_PRACTICES.md` and `AGENTS.md` paths are historical names, not
  live anchors.

  The mechanism is small by design. The kernel exposes
  `mathc migrate --from=X --to=Y [--root=DIR] [--format=text|json]
  [--explain] [--manifest=PATH] [--write|--dry-run]` and the pure module
  `lib/migrate.ml`. In its default plan-only mode, the kernel NEVER
  mutates YAML on disk. It reads a declarative migration manifest (a YAML
  file under `decisions/migrations/<from>-to-<to>.yaml`), walks
  `decisions/*.yaml` under `--root`, and prints a per-file plan listing
  what each file would need. An agent (or human) reads the plan, edits
  the files, and re-runs `mathc validate` to confirm. The opt-in
  `--write` mode emits a sibling `<file>.migrated.yaml` and never
  overwrites the original.

  The manifest vocabulary is minimal: rename-field, add-field,
  bump-schema-string, manual-review. Anything outside this vocabulary
  is rejected at parse-time with a diagnostic so the agent knows
  the manifest is malformed. Anything that requires semantic
  judgement (e.g. derive a body_sha from current content) is recorded
  as manual-review in the plan; the kernel never invents values.

  Effective immediately:
    - the two legacy Python migrate scripts are removed
      (`scripts/migrate-decisions-3.2.py`,
      `scripts/migrate-decisions-3.2-phase2.py`); their git history
      is preserved at commits `a215ef9` and `e21fdf0` if anyone
      needs to read what they did;
    - new migration cycles MUST use the kernel mechanism and
      add a `decisions/migrations/<from>-to-<to>.yaml` manifest;
    - the schema-string in any future YAML MAY be bumped (e.g. to
      `math-coding/3.2.1`); the kernel accepts any string as long
      as the decision file passes `mathc validate`.

  The axiom this decision implements was carried in the
  relation block, which is for decisions; it is carried by this
  decision's axiom_link block, where the corpus puts an axiom. The scope
  path that named the agent guide now names `KERNEL_AGENTS.md`.

  History:
    rev 1: adopted the declarative manifest and plan-only migration path.
    rev 2: added opt-in sibling-file write and dry-run modes.
    rev 3 (this revision): replaced historical protocol and convention
      filenames and line anchors with the symbols and sections that exist
      today; the migration behaviour is unchanged.

axiom_link:
  - A0
  - A1
  - A3

commitment: |
  The pure kernel module `lib/migrate.ml` exposes:

    val parse_manifest_yaml :
      reader:(string -> string) -> path:string -> result_

    val plan_file :
      manifest:manifest -> file:string -> content:string -> file_plan

    val render_text : file_plan list -> string
    val render_json : file_plan list -> Jsonl.value

  It is registered in `lib/dune` under the existing `mathcoding_core`
  library; no new library or dune stanza is added.

  The `migrate` subcommand in `bin/Mathc.ml::do_migrate`:

    | "migrate" -> do_migrate ()

  with signature and flags documented inline (see also
  `OCAML_KERNEL_CONVENTIONS.md` §4.3 exit codes: 0 = plan emitted,
  2 = input error including manifest parse failure).

  Revision 2 (2026-10-13) adds `--write` and `--dry-run` flags.
  `--write` applies the auto-translatable actions to a sibling
  `<file>.migrated.yaml` next to each input file, NEVER
  overwriting the original. The kernel can describe AND apply,
  but the apply path is opt-in: the default behaviour remains
  "describe only", and the apply path uses a sibling file so
  that `git diff` and `git checkout` always see the original
  untouched. `--dry-run` (paired with `--write`) prints the
  per-file JSON summary without touching the disk; this is
  the one-step assist an agent runs before deciding whether
  to commit the sibling files via `git add` + `git commit`.
  Implementation lives in `lib/migrate.ml::apply_actions`
  (line-edit apply for bump-schema-string and rename-field,
  end-of-file append for add-field, no-op for manual-review)
  and in `bin/Mathc.ml::do_migrate` (flag parsing, sibling-file IO,
  and JSON summary record). Fixture:
  `tests/cli/migrate-write.t` (positive for the apply path +
  negative for the dry-run no-disk-touch property).

  First declared manifest under `decisions/migrations/`:

    decisions/migrations/3.2-to-3.2.1.yaml

  shipped as a no-op proof of the mechanism: the
  declared `from`-`to` pair is the next planned schema-string bump,
  the migration list is empty, and `tests/cli/migrate-no-changes.t`
  asserts that running `mathc migrate --from=3.2 --to=3.2.1` against
  its synthetic tree is a no-op (zero files match the manifest's
  `from`). This is the
  small, verifiable, repeatable assertion that the mechanism works
  end-to-end.

scope:
  capabilities:
    - mathc-migrate
  paths:
    - "lib/migrate.ml"
    - "lib/dune"
    - "bin/Mathc.ml"
    - "decisions/migration-mechanism-2026-10.yaml"
    - "decisions/migrations/3.2-to-3.2.1.yaml"
    - "tests/cli/migrate-dry-run.t"
    - "tests/cli/migrate-no-changes.t"
    - "tests/cli/migrate-malformed.t"
    - "KERNEL_AGENTS.md"
    - "ROADMAP.md"
    - "PACKAGES.md"
    - "CHANGELOG.md"
  # 2026-10-25: pruned from this scope, per decisions/dead-scope-paths-2026-10.yaml
  #   tests/cli/fixtures/migrate/ - no tracked file matches it
  # 2026-10-31: OCAML_BEST_PRACTICES.md was renamed to
  #   OCAML_KERNEL_CONVENTIONS.md; the scope names the file that exists.
  exclusions:
    - "schemas/**"

outcomes:
  - id: kernel-migration-subcommand
    statement: |
      `mathc migrate --from=X --to=Y [--root=DIR] [--format=text|json]
      [--explain] [--manifest=PATH]` walks decisions/*.yaml under the
      given root and prints a per-file plan derived from
      `decisions/migrations/<from>-to-<to>.yaml`. The default mode
      never writes to the YAML files; opt-in `--write` emits sibling
      `<file>.migrated.yaml` files and never overwrites an original.
  - id: declarative-migration-manifest
    statement: |
      A migration manifest declares `from`, `to`, an `intent`, and a
      `migrations[]` list whose items are one of {rename-field,
      add-field, bump-schema-string, manual-review}. Unknown
      item-kinds are rejected at parse-time with a diagnostic.
  - id: python-migration-scripts-retired
    statement: |
      `scripts/migrate-decisions-3.2.py` and
      `scripts/migrate-decisions-3.2-phase2.py` are deleted; their
      git history at `a215ef9` and `e21fdf0` is the audit trail
      for the work they did. New migrations are kernel-driven.

assumptions:
  - id: python-ban-extension
    state: assumed
    statement: |
      Per KERNEL_AGENTS.md §OCaml toolchain — hard requirement, all new kernel-side tooling
      is OCaml. Python remains acceptable only where no OCaml alternative
      exists in the immediate future (data migrations in scripts/*.py,
      the cram harness for shell orchestration, occasional YAML parsing
      for decision files when no OCaml alternative exists). This
      decision does NOT change that policy; it only removes the two
      Python scripts that are now superseded by an OCaml mechanism.
    owner: human:maintainer
    consequence_if_false: >
      A future agent might re-introduce a Python migration script
      instead of using `mathc migrate`. Capture this constraint in
      OCAML_KERNEL_CONVENTIONS.md §11 trap log and check via
      `tests/process_principles.ml` that no `scripts/migrate-*.py`
      files exist.
    review_on:
      - signal: mathc-migrate-vocabulary-extended

  - id: schema-string-evolves-as-minor
    state: assumed
    statement: |
      The schema-string in YAML front-matter is allowed to grow across
      minor families such as `math-coding/3.2` and `math-coding/3.3`.
      Minor changes (field additions, renames) do not require revving a
      major version; major changes do. The live corpus is mixed while
      existing decisions are migrated on touch, so this assumption does
      not claim that one family has already replaced the other.
    owner: human:maintainer
    consequence_if_false: >
      If a future agent bakes one schema family into the validator
      and rejects the other accepted families, the
      kernel-migration mechanism becomes useless for its own
      purpose.
    review_on:
      - signal: schema-family-constraint-tightened

obligations:
  - id: migrate-subcommand-shipped
    statement: |
      `mathc migrate` is dispatched from `bin/Mathc.ml` and uses
      `lib/migrate.ml::plan_file` to produce per-file plans.
    outcome: kernel-migration-subcommand
    acceptance:
      all:
        - verifier: tests/cli/migrate-dry-run.t

  - id: manifest-format-parsed
    statement: |
      `lib/migrate.ml::parse_manifest_yaml` accepts a YAML manifest
      whose `migrations[]` items have one of the four documented
      kinds, and rejects anything else with a parse error string
      containing the offending item kind.
    outcome: declarative-migration-manifest
    acceptance:
      all:
        - verifier: tests/cli/migrate-dry-run.t
        - verifier: tests/cli/migrate-malformed.t

  - id: noop-on-up-to-date-tree
    statement: |
      Running `mathc migrate --from=X --to=X` against an up-to-date
      tree produces zero plans (or one plan per file with zero
      actions and zero warnings). `tests/cli/migrate-no-changes.t`
      asserts this against a synthetic in-fixture tree.
    outcome: declarative-migration-manifest
    acceptance:
      all:
        - verifier: tests/cli/migrate-no-changes.t

  - id: first-manifest-declared
    statement: |
      `decisions/migrations/3.2-to-3.2.1.yaml` exists and is a
      well-formed migration manifest whose `migrations[]` is empty
      (proof-of-mechanism: declares the next planned schema-string
      bump, takes no immediate action).
    outcome: declarative-migration-manifest
    acceptance:
      all:
        - verifier: tests/cli/migrate-no-changes.t

  - id: write-mode-ships-sibling-files-not-overwrites
    statement: |
      `mathc migrate --write` applies auto-translatable
      actions to a sibling `<file>.migrated.yaml`; the
      original file is never overwritten. With `--dry-run`,
      no file is created. Verified by
      `tests/cli/migrate-write.t` against
      `tests/cli/fixtures/migrate-bump/decisions/pre-bump.yaml`.
    outcome: kernel-migration-subcommand
    acceptance:
      all:
        - verifier: tests/cli/migrate-write.t

risk:
  declared_triggers:
    - kernel-disagreement-on-plan
    - manifest-vocabulary-overrun
    - agent-over-trusts-plan
  owner: human:maintainer
counterexample: |
  Two strongest countercases:

  1. "Just commit the migrator engine — agents will write their own
     manifests." This fails because the manifest is exactly the
     agent-readable description of what the kernel thinks should
     change. Without it, agents would re-derive the same plan from
     a schema-diff every cycle, drift between agents, and accumulate
     conflicting one-shot scripts. The manifest is the source of
     truth.

  2. "Have the kernel auto-write the changes." This fails for three
     reasons: (a) the kernel would lose round-trip equivalence on
     YAML formatting/comments, breaking reviewer trust; (b) the
     kernel would compete with the user's git workflow (when does
     it commit? clean? with which message?); (c) every auto-write
     is one more silent mutation that an agent can't `git revert`
     safely. The kernel describes; the agent acts.

antithesis: |
  The coherent counter-position the author considered and rejected:
  ship a generic schema-diff utility that the agent runs against
  `schemas/decision.json@v_prev` vs `schemas/decision.json@v_new`
  on each cycle; the agent reads the diff (added fields, removed
  fields, tightened patterns) and writes the schema-specific edits
  itself, with `mathc validate` as the oracle. This is rejected
  because the manifest is a smaller surface that is more honest
  about which transforms the kernel knows are safe (rename, add
  with default, bump schema-string) and which require human
  judgement (manual-review). A pure schema-diff collapses those
  into one undifferentiated "the kernel says this is invalid;
  fix it" loop, which is the failure mode this decision exists
  to prevent — re-derivation of the same plan by every agent
  every cycle, with no shared memory.

relations:
  implements:
    - bootstrap-v3
  addresses: []
  refines:
    - process-principles

reversal:
  - signal: mathc-migrate-subcommand-unused
    condition: >
      After two consecutive v3.x release cycles, zero
      `decisions/migrations/*.yaml` manifests have been authored.
    action: review
  - signal: manifest-vocabulary-insufficient
    condition: >
      An agent needs a transform outside the four-kind vocabulary
      (rename-field, add-field, bump-schema-string, manual-review)
      and cannot express it without parsing-edit-replaying.
    action: rework

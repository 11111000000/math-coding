assumptions:
  - id: naming-a-control-is-a-claim
    state: assumed
    owner: human:maintainer
    statement: |
      Naming a fixture as the negative control is a CLAIM that the
      fixture has teeth. The kernel does not verify the claim; the
      debt fixture counts the decisions that make no claim at all,
      and a decision naming a non-existent path is a defect the
      fixture-coverage check catches.
    consequence_if_false: |
      If the field were meant to be verified rather than declared,
      it would need to be a Block and the kernel would have to run
      the fixture to see that it fails. That is the natural next
      step once the debt reaches zero.

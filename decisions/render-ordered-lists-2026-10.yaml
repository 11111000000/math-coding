intent: |
  The hand-rolled Markdown subset in the render kernel previously
  recognised only `- ` unordered lists. Lines starting with `<digits>. `
  (e.g. `1. `, `2. `, `10. `) fell through to the paragraph accumulator
  and were rendered as a single `<p>` with the numbers concatenated:

      <p>1. **Схема.** ... 2. **Идентичность.** ... 3. ...</p>

  instead of three `<li>` elements inside an `<ol>`. Twelve paragraphs
  across seven site pages (methodology, contributing, differences,
  install, faq -- EN/RU/ZH) plus rendered AGENTS.md / USAGE.md excerpts
  were affected; the user-visible symptom was a Russian methodology page
  where the four chain-in-practice questions ran together on a single
  wrapped line.

  This decision closed that defect with a one-file change to the render
  kernel (no new schema, no new policy term, no new attestation;
  regression pin via the ordered-list cases in `tests/render_kernel.ml`).
  Decision exists for P1 audit only -- the implementation itself is
  below the `kernel-change` reference-class threshold (32 lines net in
  a leaf parser) and would qualify for the fast path
  (`KERNEL_AGENTS.md` §Fast path) were it not a `lib/` change that
  triggers the pre-commit P1 hook.

  2026-10-31, REVISION 2: THE IMPLEMENTATION MOVED, THE BEHAVIOUR DID
  NOT. The parser that owns this promise no longer lives in
  `lib/render.ml`; it lives in `lib/render/render_md.ml`, and the
  ordered-list helpers are named there (`ordered_marker_body`,
  `is_ordered_marker`, `ordered_trigger`). The agent protocol that
  this decision cites was renamed from `AGENTS.md` to
  `KERNEL_AGENTS.md`, and the OCaml trap log that its reversal
  condition points at was renamed from `OCAML_BEST_PRACTICES.md` to
  `OCAML_KERNEL_CONVENTIONS.md`. The measured behaviour is unchanged:
  `dune test tests/render_kernel.ml` exits 0 and the ordered-list cases
  are green.

  Counter-case. The fast path was supposed to remove the decision-file
  requirement too. Counter-argument: P1 is enforced at commit time,
  not by the agent discretion; the fast path is opt-in for the slow
  self-check and the attestation store, not for the audit trail. The
  decision file is the cheapest P1 closure (one file, no obligation,
  no verifier, no attestation) and keeps the change set traversable for
  `decisions/process-principles` review.

commitment: |
  Every `<digits>. ` line in any source routed through the render
  kernel Markdown parser (`lib/render/render_md.ml::md_parse`, reached
  from `lib/render/render.ml::build_pages`) becomes an `<ol>` with one
  `<li>` per item. Multi-digit prefixes (`10. `, `12. `) are accepted;
  continuation lines (indented bodies) join the current item with a
  single space, matching the existing `- ` rule; an unordered `- `
  marker ends an in-flight ordered list (and vice versa).

  The implementation anchor is the SYMBOL, not a line number:
  `lib/render/render_md.ml::ordered_trigger` decides whether a line
  opens an ordered list, and `lib/render/render_md.ml::render_list`
  emits the `<ul>` / `<ol>` wrapper for either list kind. The source
  file moved when the render kernel was split into modules; the
  behaviour it carries did not.

scope:
  capabilities:
    - markdown-subset-correctness
    - site-content-markup
  paths:
    - "tests/render_kernel.ml"

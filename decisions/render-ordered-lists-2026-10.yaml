reversal:
  - signal: ordered-list-regressed
    condition: |
      After this revision lands, any `dist/*.html` page
      carries `<p>` containing the literal pattern `1. <strong>`
      or `2. <strong>` (i.e., the original bug returns).
      Resolution: investigate the `ordered_trigger` predicate
      in `lib/render.ml::md_parse`; likely cause is a
      `String.trim` regression or a `String.sub` boundary
      issue, both of which have entries in
      `OCAML_BEST_PRACTICES §11`.
    action: rework

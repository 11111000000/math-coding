outcomes:
  - id: ordered-list-parsed
    statement: |
      `Render.md_parse` of a `1. `, `2. `, ... sequence
      returns `<ol><li>...</li><li>...</li>...</ol>`, with
      each `<li>` carrying one item (multi-line continuations
      joined with a single space). Verified by
      `tests/render_kernel.ml::ordered_list_renders` and
      `tests/render_kernel.ml::ordered_list_multi_digit_renders`
      (both `Quick`).
  - id: rendered-site-has-ol-tags
    statement: |
      After `scripts/render.sh` re-render, the affected
      `dist/*.html` files (`methodology.{ru,}.html`,
      `contributing.{ru,}.html`, `differences.{ru,}.html`,
      `install.html`, `faq.{ru,}.html`) carry `<ol>` tags
      where they previously carried `<p>1. </p>`. Verified
      by `rg -c "<ol>" dist/methodology.ru.html` returning
      ≥ 1 (was 0 on main before this commit) and
      `rg -c "<p>1\." dist/methodology.ru.html` returning 0
      (was 2 on main).
  - id: invalid-marker-still-paragraph
    statement: |
      A `1.5 ` (decimal), `1.foo` (no space), or bare `1.`
      line is NOT treated as a list marker; it flows into
      the paragraph accumulator like any other prose.
      Verified by
      `tests/render_kernel.ml::ordered_list_invalid_marker_stays_paragraph`.
assumptions: []
counterexample: |
  "Use a real markdown library (`omd`, `caml-markdown`,
  `cmarkit`) instead of a hand-rolled parser." This objection
  is on file in `decisions/render-kernel-fixes-2026-10.yaml`,
  was explicitly considered and rejected, but for the wrong
  reason: the rejection cited dependency-surface concerns
  rather than correctness, so the same objection re-surfaces
  every time a new corner case (ordered lists, nested
  ordered lists, mixed lists, definition lists) lands. The
  current commit is the third corner case landing on the
  hand-rolled parser; a maintained markdown library would
  handle all three cases plus future ones without bespoke
  logic. The strongest counterargument to the current fix
  is therefore: the 30-line OCaml change in `lib/render.ml`
  is the right shape *for this audit trail*, but a follow-up
  that swaps the parser for `cmarkit` (or equivalent) is
  pre-figured by every new dialect corner we add. Reversal
  condition: when a fourth or fifth dialect corner case
  (definition lists, table support, fenced code with
  language tags, nested ordered lists) lands and the cost of
  hand-rolling each one exceeds the cost of the dependency
  audit for `cmarkit`, the rejection's cost/benefit flips
  and a `render-kernel-fixes-2026-10`-tracked parser swap
  becomes the right move.


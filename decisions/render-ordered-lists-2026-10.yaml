    - "lib/risk.ml"
    - "spec/**"

outcomes:
  - id: ordered-list-parsed
    statement: |
      `Render_md.md_parse` of a `1. `, `2. `, ... sequence returns
      `<ol><li>...</li><li>...</li>...</ol>`, with each `<li>`
      carrying one item (multi-line continuations joined with a single
      space). Verified by the `ordered_list_renders` and
      `ordered_list_multi_digit_renders` cases in
      `tests/render_kernel.ml`; the continuation and dash-boundary cases
      (`ordered_list_continuation_joins_into_one_li`,
      `ordered_list_stops_at_dash_marker`) pin the two rules that make
      the list well-behaved.
  - id: rendered-site-has-ol-tags
    statement: |
      After `scripts/render.sh` re-renders, the rendered pages carry
      `<ol>` where the sources carry a numbered sequence, and no
      rendered page carries a paragraph that opens with a `1. ` marker
      -- with ONE documented exception: this decision's own page
      quotes the broken pattern inside its `intent`, so it is the only
      page in `dist/` where the literal `<p>1.` appears, and it is
      quoting the defect rather than reproducing it.

      Measured on 2026-10-31 by `bash scripts/render.sh` followed by
      `grep -rl '<ol>' dist --include='*.html'` (109 pages) and
      `grep -rl '<p>1\.' dist --include='*.html'` (1 page, this one).
      The page set is a MEASUREMENT, not a promise: the promise is the
      invariant, and the count is what the invariant looks like today.
  - id: invalid-marker-still-paragraph
    statement: |
      A `1.5 ` (decimal), `1.foo` (no space), or bare `1.` line is NOT
      treated as a list marker; it flows into the paragraph accumulator
      like any other prose. Verified by the
      `ordered_list_invalid_marker_stays_paragraph` case in
      `tests/render_kernel.ml`.

assumptions: []

counterexample: |
  Use a real markdown library (`omd`, `caml-markdown`, `cmarkit`)
  instead of a hand-rolled parser. This objection is on file in
  `decisions/render-kernel-fixes-2026-10.yaml`, was explicitly
  considered and rejected, but for the wrong reason: the rejection
  cited dependency-surface concerns rather than correctness, so the
  same objection re-surfaces every time a new corner case (ordered
  lists, nested ordered lists, mixed lists, definition lists) lands.
  The change this decision made was the third corner case landing on
  the hand-rolled parser; a maintained markdown library would handle
  all three cases plus future ones without bespoke logic. The strongest
  counterargument to the change is therefore: the 30-line OCaml change
  in the render kernel was the right shape FOR THIS AUDIT TRAIL, but a
  follow-up that swaps the parser for `cmarkit` (or equivalent) is
  pre-figured by every new dialect corner we add. Reversal condition:
  when a fourth or fifth dialect corner case (definition lists, table
  support, fenced code with language tags, nested ordered lists) lands
  and the cost of hand-rolling each one exceeds the cost of the
  dependency audit for `cmarkit`, the rejection cost/benefit flips and a
  `render-kernel-fixes-2026-10`-tracked parser swap becomes the right
  move.

obligations:
  - id: ordered-list-renders
    statement: |
      A `1. `, `2. `, `3. ` sequence in `Render_md.md_parse` input
      renders as `<ol><li>...</li><li>...</li><li>...</li></ol>`.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml
        - verifier: tests/render_kernel.ml
        - verifier: tests/render_kernel.ml
  - id: ordered-list-negative
    statement: |
      A `1.5 ` / `1.foo` / bare `1.` line is NOT wrapped in `<ol>`; it
      stays in the paragraph accumulator.
    acceptance:
      all:
        - verifier: tests/render_kernel.ml

reversal:
  - signal: ordered-list-regressed
    condition: |
      After this revision lands, any rendered page other than this
      decision's own page carries a `<p>` containing the literal pattern
      `1. <strong>` or `2. <strong>` (i.e., the original bug returns).
      Resolution: investigate the `ordered_trigger` predicate in
      `lib/render/render_md.ml::md_parse`; likely cause is a
      `String.trim` regression or a `String.sub` boundary issue, both of
      which have entries in `OCAML_KERNEL_CONVENTIONS.md` §11.
    action: rework


                                            the install.sh
                                            changes)
    OCAML_BEST_PRACTICES.md                (new §11.37
                                            trap entry)
    tests/scripts/release-cosign-blob.t    (new cram test)

  Boundaries (A3 self-application):

    - No OCaml: lib/, bin/, spec/, schemas/, axioms/
      all unchanged. Workflow + shell-script +
      PowerShell + docs-only surface.
    - decisions/decision.yaml is untouched.
    - No kernel API change.
    - The cosign CLI is fetched by the GitHub Action
      `sigstore/cosign-installer@v3`; never vendored.
    - The signatures are produced only for `*.tag`
      releases (`if: startsWith(github.ref, 'refs/tags/v')`);
      the rolling `edge` prerelease is also signed for
      symmetry with the existing release.yml dual-track.
    - The signer is the GitHub Actions OIDC issuer
      (`https://token.actions.githubusercontent.com`)
      with the identity regexp
      (`https://github.com/11111000000/math-coding`),
      matching `ux-3-cosign-image-2026-10.yaml`. A
      user with `cosign verify-blob` installed can
      verify the bytes without any GitHub interaction.
    - `*.sig` and `*.pem` are uploaded as release
      assets in the same `softprops/action-gh-release`
      step; no second upload step is added.

  Migration path (A3):

    - For users on existing install paths, nothing
      changes when `cosign` is not installed: the
      script prints a warning to stderr and proceeds
      (same as `--cosign-verify`'s behaviour). The
      behaviour change is silent for users without
      cosign.
    - For users with `cosign` installed (CI hosts that
      pre-install cosign for security scanning), the
      install script now also fail-fast on a tampered
      binary — exposing any registry / CDN compromise
      before the user runs the binary.
    - The `--no-cosign-verify-blob` flag is a runtime
      escape hatch: a user who hits a verify failure
      on a one-off tag and cannot wait for the next
      release can re-run with `--no-cosign-verify-blob`.

  Rollback / forward-recovery:

    - The new `cosign sign-blob` step in release.yml is
      a single conditional step. Removing it restores
      the pre-this-commit workflow with no other change.
    - install.sh's `--no-cosign-verify-blob` flag is a
      runtime escape hatch shipped with the same
      release; no separate installer rollback is
      required.
    - OCAML_BEST_PRACTICES §11.37 is additive.

  Decision diff (A3 §Self-Application #6):

    - Pre-this-commit: release binaries are not signed;
      install.sh verifies SHA-256 only; cosign
      verification targets the Docker image only.
    - Post-this-commit: every `mathc-*` binary is signed
      with keyless cosign at release time; install.sh
      and install.ps1 verify the signature by default
      after the SHA-256 check.

counterexample: |
  "Two trust layers (SHA-256 + cosign) is over-engineered;
   one is enough." Counterargument: SHA-256 catches
   accidental corruption; cosign catches intentional
   swap. Both are cheap. The cosign verify call is
   sub-200ms against the Sigstore public Rekor log; the
   SHA-256 call is microseconds. The combined failure
   modes (transit corruption AND registry swap) are
   disjoint and both worth catching — see A4 Care.

  "cosign verify-blob on every install is friction; users
   don't expect signature checks for a CLI binary."
   Counterargument: the Docker image already ships with
   this exact pattern (closed by
   `ux-3-cosign-image-2026-10.yaml`); a user on the
   docker path already pays the same cost. A user on the
   binary path now has parity. The `--no-cosign-verify-blob`
   flag preserves the "I know what I'm doing" escape.

  "The OIDC issuer could revoke the token post-release;
   signatures become unverifiable." Counterargument: the
   OIDC token is bound to a specific workflow run; the
   signature is bound to the artifact's SHA-256 digest at
   signing time. If GitHub revokes the token, the existing
   signature remains valid forever — verification needs
   only the public parts (`*.pem` + `*.sig`). The
   transparency log entry is permanent.

  "Why not also sign `install.sh` and `install.ps1`?"
   Counterargument: the install scripts are the verifier;
   signing them with the same key they verify against is
   circular trust. A user is expected to read the
   scripts before `curl | sh` (the curl|tar approach is
   the recommended vetting step); the signature is for
   the binary bytes the script then installs. Signing
   the scripts themselves is a separate cycle (deferred;
   see `ux-3-cosign-image-2026-10.yaml`'s explicit
   "install.sh cosign remains deferred" note, which
   carries over to this decision by intent, not by
   scope).

antithesis: |
  The position considered and rejected: "Match the existing
  `--cosign-verify` / Docker-image pattern exactly, including
  the warning-only behaviour when `cosign` is not
  installed." The author engaged with this and accepted it
  in part: when `cosign` is missing, the new
  `verify_cosign_blob` mirrors `verify_cosign` — warning
  to stderr, exit 0. The partial rejection: when `cosign`
  is installed AND `verify-blob` exits non-zero, the
  script must exit 1 (not just warn). Reason: SHA-256
  mismatch already exits 1, so a cosign-blob mismatch
  should be the same severity; silent degradation would
  make the new check toothless.

  A second position: "Ship `*.pem` only, no `*.sig`."
  Rejected: cosign verify-blob requires both files for
  keyless verification with `--certificate-chain`; without
  `*.pem` the verification path collapses to `cosign
  verify-blob --insecure-ignore-tlog` which is not the
  documented keyless pattern. Both files are part of the
  sigstore contract; omitting one breaks the install-time
  verifier.

commitment: |
  Five deliverables, four obligations:

    D1. `.github/workflows/release.yml` gains a new step
        `Sign each mathc-* binary with keyless cosign`
        inside the existing `publish` job, positioned
        after the `Generate SHA256SUMS + install.sh +
        install.ps1` step and before the
        `softprops/action-gh-release` upload steps. The
        step:

          (a) installs cosign via
              `sigstore/cosign-installer@v3` (matches the
              existing docker.yml cosign-sign job);
          (b) iterates every `dist-bin/mathc-*` file
              and runs `cosign sign-blob --yes
              --output-signature "$f.sig"
              --output-certificate "$f.pem" "$f"` for
              each one;
          (c) reuses the workflow-level
              `permissions: id-token: write` already in
              place at lines 9-22 of release.yml.

        The two existing `softprops/action-gh-release`
        `files:` lists (tag release + edge prerelease)
        gain the `*.sig` and `*.pem` siblings alongside
        the binary itself.

    D2. `scripts/install-tooling/install.sh` adds a new
        `verify_cosign_blob` function and a new
        `download_cosign_blob_assets` helper. Both are
        wired into the install pipeline after the binary
        SHA-256 verification. The existing
        `--cosign-verify` (default on) /
        `--no-cosign-verify` (skip) flag pair, which
        already gates `verify_cosign` for the Docker
        image, is the same flag that gates
        `verify_cosign_blob`. Specifically:

          - When `--no-cosign-verify` is set: both
            `verify_cosign` (image) and `verify_cosign_blob`
            (binary) are skipped.
          - When `--cosign-verify` is set (default) and
            `cosign` is not installed: both are skipped
            with a stderr warning.
          - When `--cosign-verify` is set and `cosign`
            IS installed and the binary's `*.sig` /
            `*.pem` are present (D6+ release):
            `cosign verify-blob` is invoked against
            the binary with the same identity regexp +
            OIDC issuer used by D1. If verify exits
            non-zero, the script prints an error to
            stderr, emits
            `diagnostic: MC-INSTALL-COSIGN-VERIFY-BLOB-FAIL`,
            and returns 1 (mapped to exit 1 by the
            caller).
          - When the binary's `*.sig` / `*.pem` are
            ABSENT (pre-D6 release): the
            `verify_cosign_blob` call short-circuits
            with a "skipping verify" warning to stderr;
            SHA-256 remains the fallback integrity
            check. This preserves backward compatibility
            for users on existing tags.

        The function is POSIX-sh, no bashisms; uses
        `command -v cosign` (POSIX) instead of `which`.

    D3. `scripts/install-tooling/install.ps1` mirrors D2:
        a new `Test-CosignBlob` function and a
        `Download-CosignBlobAssets` helper, both wired
        after `Test-Sha256`. The existing `-CosignVerify`
        (default on) / `-NoCosignVerify` (skip) switch
        pair, which already gates `Test-CosignImage`
        for the Docker image, is the same switch that
        gates `Test-CosignBlob`. Behaviour matches D2:
        warning when cosign is missing, exit 1 on
        verify fail, skip with warning when the
        `*.sig` / `*.pem` assets are absent (pre-D6
        release).

    D4. `OCAML_BEST_PRACTICES.md` gains §11.37:

          Title: "cosign sign-blob requires
                  id-token: write permission (and a
                  writable $RUNNER_TEMP for the .pem)"
          Symptom: cosign sign-blob step fails with
                   "getting signer: getting key from
                   GitHub Actions OIDC: no token" or
                   "EROFS: read-only file system" when
                   the workflow tries to write the .pem
                   file.
          Fix: confirm `permissions: id-token: write`
               is at the workflow level (release.yml
               already has it on lines 9-22); confirm
               the step does NOT pin
               `container.image = ubuntu-24.04` with
               `--read-only`.
          Referenced from: this decision,
                           .github/workflows/release.yml
          Trigger: any `cosign sign-blob` step without
                   `id-token: write` permission.

    D5. A cram test
        `tests/scripts/release-cosign-blob.t` asserts:

          (a) `.github/workflows/release.yml` references
              `sigstore/cosign-installer`;
          (b) the release.yml `publish` job contains a
              step that runs `cosign sign-blob` against
              every `dist-bin/mathc-*` binary;
          (c) `scripts/install-tooling/install.sh --help`
              output mentions `--cosign-verify` /
              `--no-cosign-verify` (the combined skip
              flag for both image and blob verify);
          (d) `scripts/install-tooling/install.sh`
              contains a `verify_cosign_blob` function
              that invokes `cosign verify-blob`;
          (e) the SHA256SUMS generator step's positive
              list still includes `mathc-*` regardless
              of extension (regression-pin for the D4
              fix).

    All five are wired in this commit. The obligations
    are:
      - cosign-blob-step-installed
      - install-sh-cosign-blob-flags
      - install-ps1-cosign-blob-flags
      - cosign-blob-trap-log


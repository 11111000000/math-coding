intent: |
  Extend the release-time binary trust model from "SHA-256
  only" to "SHA-256 + keyless cosign signature". After this
  decision each `mathc-*` binary on a release tag carries a
  Sigstore signature pair produced by the GitHub Actions
  OIDC token, and the install scripts (`install.sh`,
  `install.ps1`) verify that signature by default before
  installing.

  Today's gap: the Docker image at
  `ghcr.io/11111000000/mathc:<VERSION>` is signed by the
  `cosign-sign` job in `.github/workflows/docker.yml`
  (closed by `decisions/ux-3-cosign-image-2026-10.yaml`),
  but the release-time binary tarballs in the GitHub
  release page are not signed. A user who downloads
  `mathc-linux-x86_64` directly from `releases/download/`
  cannot verify that the bytes came from the math-coding
  repository's CI at the time of the tag. SHA-256 catches
  accidental corruption; it does not catch a registry or
  CDN compromise that swaps the binary before SHA-256SUMS
  arrives. cosign-with-OIDC does, because the signature is
  recorded in a public transparency log keyed to the
  GitHub Actions OIDC issuer.

  After this decision:

    1. `.github/workflows/release.yml` gains a
       `cosign sign-blob` step that runs after the
       `Generate SHA256SUMS + install.sh + install.ps1`
       step and before the `softprops/action-gh-release`
       upload. The step iterates each `dist-bin/mathc-*`
       artifact and produces a sibling `*.sig` and
       `*.pem` pair, which the subsequent upload step
       publishes as release assets.

    2. `scripts/install-tooling/install.sh` gains a
       `verify_cosign_blob` function that downloads the
       matching `*.sig` / `*.pem` for the chosen binary,
       runs `cosign verify-blob` against them, and
       returns 1 on failure. The existing
       `--cosign-verify` (default on) /
       `--no-cosign-verify` (skip) flag pair, which
       already gates the Docker-image `verify_cosign`
       path, is extended to also gate the binary
       `verify_cosign_blob` path. The default is on; the
       failure exit code matches `verify_sha256`'s exit
       code (1) so install.sh error semantics stay
       uniform. A pre-D6 release that has no
       `*.sig`/`*.pem` assets is treated as "skip with
       warning" (no failure), preserving backward
       compatibility for users on existing tags.

    3. `scripts/install-tooling/install.ps1` mirrors the
       POSIX-sh behaviour: a `Test-CosignBlob` function
       and the existing `-CosignVerify` (default on) /
       `-NoCosignVerify` (skip) switch pair, which
       already gates the Docker-image `Test-CosignImage`
       path, is extended to also gate the binary
       `Test-CosignBlob` path.

    4. `OCAML_BEST_PRACTICES.md` gains a §11.37 trap entry
       documenting the failure mode that hits a `cosign
       sign-blob` invocation when the working directory
       has no `cosign.pub`, or when the workflow's
       `id-token: write` permission is missing. The trap
       is the same root cause as §11.36 but with a
       different observable error message.

    5. A cram test `tests/scripts/release-cosign-blob.t`
       asserts (a) the release.yml references
       `sigstore/cosign-installer`; (b) the SHA256SUMS
       generator step format is unchanged; (c) the
       install.sh `--help` output documents
       `--cosign-verify` (the combined skip flag for
       both image and blob verify).

  Touches (per A3 self-application):

    .github/workflows/release.yml           (one new job
                                             step `Sign
                                             each mathc-*
                                             binary with
                                             keyless
                                             cosign`;

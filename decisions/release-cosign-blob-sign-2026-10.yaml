reversal:
  - signal: cosign-blob-removed
    condition: |
      A user reports that `cosign sign-blob` fails on a
      target runner due to filesystem permissions on
      `$RUNNER_TEMP`. Resolution: switch to writing
      signatures and certs into the release directory
      itself (not `$RUNNER_TEMP`) and re-publish.
    action: rework

  - signal: cosign-blob-fallback
    condition: |
      A user reports that `cosign verify-blob` cannot
      reach the Sigstore Rekor transparency log from
      air-gapped CI. Resolution: ship a documented
      `--no-cosign-verify-blob` escape (default-on
      already; the escape is the documented fix).
    action: rework


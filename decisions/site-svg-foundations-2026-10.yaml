counterexample: |
  "Eight specialist diagrams on the foundations page is
  visual noise; prose alone is enough."

  Counterargument: each diagram is a visual summary of an
  algebra section that is dense and quantitative; the
  reader who is already an algebra-3.2 expert does not
  need the diagrams, but the reader who is learning the
  algebra can use the diagram as an entry point. The
  counterexample-flow and friction-envelope-plot are the
  two most-cited diagrams in design discussions; without
  them the foundations page forces the reader to follow
  a paragraph of algebra to understand a single decision.

  "These diagrams are spec content and should live in
  spec/algebra-3.2.md, not in the foundations page."

  Counterargument: spec/algebra-3.2.md is the normative
  text; the foundations page is the OCaml mapping. The
  diagrams are visual aids to the OCaml mapping, not to
  the algebra itself. The <title> and <desc> elements
  on each SVG cite the algebra section number, so a
  reader who wants depth navigates from the diagram to
  the spec; the diagrams are a UI affordance, not a
  competing source of truth.

antithesis: |
  Author considered and rejected the strongest counter-
  position: "The five SVGs are too much for one decision;
  split into five `site-svg-<figure>-2026-XX` decisions
  with one obligation each."

  That position is rejected because (a) the SVGs are
  embedded by a single `body_extra` match in
  `lib/render.ml`; five decisions would produce five
  `body_extra` patches that have to land in the same
  file, increasing review cost without a corresponding
  gain in clarity; (b) the five SVGs share a common
  CSS wrapper (`.mathc-figure-foundations`) and a common
  reasoning-tied-to-algebra-sections style; (c) the five
  SVGs are introduced as a coordinated set in the
  methodology page, not as five independent editorial
  additions.

  A counter-decision that wanted five separate cycles
  would have to argue that the five SVGs are introduced
  in five temporally separate review-and-reverse paths;
  the author sees no such axis and prefers the bundled
  cycle.

assumptions:
  - id: site-base-stays-subpath
    state: assumed
    statement: |
      The site's `<base href>` remains a subpath
      (`/math-coding/`) rather than becoming the host
      root. The relative-URL semantics that the new
      `<img src="assets/foo.svg">` references rely on
      the base href overriding the document URL.
    owner: human:maintainer
    consequence_if_false: |
      If a future cycle sets `site_base = "/"`, the
      `assets/foo.svg` references on `foundations.html`
      resolve to `/foo.svg` (404) rather than
      `/math-coding/assets/foo.svg`. A follow-up
      decision would rewire the body_extra entries.
    review_on:
      - signal: deployment-target-moves-to-host-root


        - verifier: ! grep -F '<img src="assets/friction-envelope-plot.svg"' dist/foundations.html
          result: pass
        - verifier: ! grep -F '<img src="assets/quality-radar.svg"' dist/foundations.html
          result: pass
        - verifier: ! grep -F '<img src="assets/reasoning-budget.svg"' dist/foundations.html
          result: pass
        - verifier: ! grep -F '<img src="assets/substrate-fingerprint.svg"' dist/foundations.html

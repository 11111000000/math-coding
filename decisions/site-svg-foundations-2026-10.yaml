intent: |
  Add eight hand-rolled SVG specialist diagrams to the
  foundations page. The foundations page (dist/foundations.html)
  is the OCaml mapping of the algebra-3.2 spec; each section
  pairs an axiom with a kernel mechanism and a verification.
  The eight diagrams add visual summaries of the most
  cross-cutting algebra sections that are otherwise only
  text:

  - counterexample-flow.svg: the forcing-function that blocks
    a merge when |C(D)| = 0 (algebra section 11, 11.1)
  - axiom-transition.svg: the re_evaluate(d, A_new) oracle
    (algebra section 17)
  - trust-dynamics.svg: the four trust tiers and the four
    rebuttal outcomes (algebra section 12)
  - substrate-fingerprint.svg: kernel.ver + ocaml.ver +
    dep.digests hashed per CI run (algebra sections 13, 14, 16)
  - waiver-state-machine.svg: requested, reviewed, granted,
    consumed/expired/cancelled (constitution section Waivers)
  - friction-envelope-plot.svg: the mode-tier budget bands
    (algebra sections 21, 27)
  - quality-radar.svg: the 14 quality dimensions (algebra
    section 22)
  - reasoning-budget.svg: the three independent time-reporting
    scales (AGENTS.md section Honest time reporting; algebra
    section 18)

  All eight are pure SVG, accessibility-tagged (role=img +
  aria-labelledby + <title>), and live under assets/. Each
  is embedded by lib/render.ml's body_extra match for the
  'foundations' page key, so mathc render emits a
  <figure class="mathc-figure mathc-figure-foundations">
  wrapper for each. The wrapper inherits the existing CSS
  rule .mathc-figure-foundations img { max-width: 56rem; }
  from assets/style.css; no CSS change is required.

  Scope: the eight figures, the body_extra extension in
  lib/render.ml, and the obligation that pins them closed.

commitment: |
  `mathc render` emits a `dist/foundations.html` that
  carries, in addition to the existing two figures, five
  `<figure class="mathc-figure mathc-figure-foundations">`
  wrappers for `assets/axiom-transition.svg`,
  `assets/counterexample-flow.svg`,
  `assets/friction-envelope-plot.svg`, `assets/quality-radar.svg`,
  and `assets/reasoning-budget.svg`, in that order. Each
  `<figure>` wraps an `<img>` with a non-empty `alt=`
  attribute and a `title` element in the source SVG.


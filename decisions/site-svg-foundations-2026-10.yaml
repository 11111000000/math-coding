        - verifier: ! test -f dist/assets/axiom-transition.svg && test -f dist/assets/counterexample-flow.svg && test -f dist/assets/friction-envelope-plot.svg && test -f dist/assets/quality-radar.svg && test -f dist/assets/reasoning-budget.svg && test -f dist/assets/substrate-fingerprint.svg && test -f dist/assets/trust-dynamics.svg && test -f dist/assets/waiver-state-machine.svg
          result: pass
        - verifier: ! grep -lE 'role="img" aria-labelledby' assets/axiom-transition.svg assets/counterexample-flow.svg assets/friction-envelope-plot.svg assets/quality-radar.svg assets/reasoning-budget.svg assets/substrate-fingerprint.svg assets/trust-dynamics.svg assets/waiver-state-machine.svg
          result: pass

reversal:
  - signal: foundations-page-becomes-text-only
    condition: |
      A future maintainer moves to a text-only foundations
      page (no figures) for bandwidth or stylistic reasons;
      the kernel would then either drop the five SVGs from
      `body_extra` and remove the corresponding wrapper
      CSS, or retire this decision in favour of a
      `site-quality-no-figures-2026-XX` decision.

risk:

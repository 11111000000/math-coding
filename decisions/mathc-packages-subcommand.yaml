intent: |
  `mathc packages` is the kernel-level, operator-facing index of the
  assurance surface: every live decision and every obligation it declares,
  joined to the current generated attestation store, with the verifier and
  the per-obligation verdict attached. It is the single-pane view that used
  to require callers to walk `decisions/` and `attestations/` themselves.

  2026-10-31, REVISION 4: THE CATALOG PROMISE STAYS; THE FILE FORM AND
  THE PATHS BECOME CURRENT. The previous revision's tail stopped at the
  `matching the kernel's count` line: the kernel read three obligations
  and none of the evidence, unknowns, or history below that line. The
  malformed continuation also made the file's historical paths and counts
  read as current. This revision repairs the tail without narrowing the
  catalog promise.

  The current implementation lives in `lib/packages.ml` and is walked by
  `bin/Mathc.ml::do_packages`. The site consumer is `site/packages.md`,
  rendered as `dist/packages.html`; `lib/render/render.ml::build_pages`
  embeds the kernel's HTML fragment. The old `site/index.md` path and the
  old flat `lib/render.ml` path are historical, not current.

  Measured on this tree on 2026-10-31,
  `mathc packages --format=json` emitted 139 decisions and 529
  decision-obligation pairs. Those numbers are a dated measurement, not a
  promise: the promise is that the catalog covers the kernel-recognized
  live corpus, and the instrument that proves the shape is
  `tests/cli/packages.t` plus the live JSON output.

  History:
    rev 1: adopted the `mathc packages` catalog and its three formats.
    rev 2: recorded the kernel walker, CLI dispatcher, and site consumer.
    rev 3: recorded the implementation and the live catalogue surface.
    rev 4 (this revision): repaired the unread tail and re-pointed the
      site and renderer references at the paths that exist; the complete
      catalog promise is unchanged.

axiom_link:
  - A0
  - A1

commitment: |
  `bin/Mathc.ml::do_packages` dispatches
  `mathc packages [--format=text|json|html]`. The dispatcher delegates to
  the pure kernel module `lib/packages.ml`, which:

    1. walks the live decision corpus recursively through the same
       structural rule as the rest of the kernel
       (`lib/memory.ml::decision_document_paths`),
    2. reads every obligation and its acceptance verifier from each
       decision,
    3. joins each obligation to the generated attestation store and the
       live waiver set,
    4. computes the per-obligation verdict
       (`pass | fail | unknown | waived | stale | missing | no_store`) by
       the rule in `lib/packages.ml::verdict_of`, which follows the
       gate's class-establishment rule rather than inventing a second
       one, and
    5. emits a sorted-key JSON object (default), a plain-text table, or a
       self-contained HTML fragment.

  The catalog promise is complete: every decision-obligation pair the
  kernel recognizes in the live corpus appears with its verifier and
  current verdict. The live count is deliberately not repeated in the
  promise because it changes whenever the corpus or store changes;
  `mathc packages --format=json` is the live measurement.

  `tests/cli/packages.t` exercises the text, JSON, and HTML forms and
  checks that the HTML count equals the JSON count. The site page
  `site/packages.md` consumes the HTML form through
  `lib/render/render.ml::build_pages`; the site does not walk decisions
  independently.


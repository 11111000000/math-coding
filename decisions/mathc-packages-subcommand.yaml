    outcome: packages-lists-decisions
    claim: |
      The kernel function in `lib/packages.ml` enumerates every
      decision-obligation pair the kernel recognizes in the live corpus
      and emits a verdict and verifier for each pair.
    acceptance:
      all:
        - verifier: mathc packages --format=json

  - id: packages-cli-dispatcher
    outcome: packages-lists-decisions
    claim: |
      `bin/Mathc.ml::do_packages` exposes `mathc packages` with text,
      JSON, and HTML output, and `tests/cli/packages.t` exercises all
      three forms and their shared count.
    acceptance:
      all:
        - verifier: tests/cli/packages.t

  - id: packages-site-bridge
    outcome: packages-site-is-a-consumer
    claim: |
      `site/packages.md` is rendered from `mathc packages --format=html`
      through `lib/render/render.ml::build_pages`, not from a parallel
      renderer-side decision walker.
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the rendered package page is read by a human; the kernel and CLI forms are machine-checked above
    acceptance:
      all:
        - verifier: manual-rendered-package-index

evidence:
  - kind: observed
    statement: |
      On 2026-10-31, `mathc packages --format=json` reported 139 live
      decisions and 529 decision-obligation pairs. The generated store
      was absent, so all 529 pairs were reported `no_store`; the command
      did not turn absent evidence into `pass`.
  - kind: observed
    statement: |
      `dune test tests/cli/packages.t` passed, and
      `mathc validate decisions/mathc-packages-subcommand.yaml` reported
      parse-ok with no MC-UNPARSED-TAIL after this revision.

unknowns:
  - Whether the HTML surface should remain one self-contained fragment or
    become a multi-page index with per-decision links. The current site
    keeps the fragment and renders per-decision pages separately.
  - Whether `mathc packages` should include archived decisions. The
    current contract covers the live corpus; archived records are not
    active promises.

outcomes:
  - id: packages-lists-decisions
    statement: |
      `mathc packages [--format=text|json|html]` lists every
      decision-obligation pair in the kernel-recognized live corpus, with
      the verifier and the current verdict for each pair.
  - id: packages-join-the-current-store
    statement: |
      The verdict for each pair is computed from the generated store and
      the live waiver set; a checkout with no store reports `no_store`,
      not `pass`.
  - id: packages-site-is-a-consumer
    statement: |
      `site/packages.md` is rendered with the HTML fragment emitted by
      `mathc packages`; no parallel site-side decision walker owns the
      package catalogue.

risk:
  declared_triggers:
    - decision-graph-walk-changes
    - site-rendering-changes
    - packages-tail-unreadable
  owner: human:maintainer

counterexample: |
  "A malformed decision could be absent from the package view, so the
  catalogue can look complete while it is not." This is the strongest
  objection to a view assembled by a kernel walker.

  The answer has two parts. The walker uses the kernel's structural rule
  for what a decision is, so a document the kernel does not recognize is
  not silently presented as a complete decision. The corpus-wide YAML
  checks (`tests/corpus_no_silent_drops/corpus_no_silent_drops.ml` and
  `mathc validate` over the corpus) are the instruments that catch a
  decision whose tail the kernel cannot read. This decision does not
  claim that the packages view is a second parser with its own error
  catalogue; it claims that the view covers the kernel-recognized
  corpus, and that the file itself is read to EOF.

  The second countercase is schema evolution. If
  `obligation.acceptance` gains another combinator, the view could miss
  a branch and emit empty verdicts. The mitigation is the shared corpus
  walk and the conformance runner: both use the kernel's decision model,
  so schema drift appears there before it becomes a site promise.

antithesis: |
  The coherent alternative is to let the site walk `decisions/` itself
  and render the package grid from that walk. It would avoid a kernel
  package API and could be implemented locally by the renderer.

  That alternative creates two measures of one corpus. The site would
  need to reproduce the kernel's definition of a decision, the gate's
  verdict rules, the waiver lookup, and the attestation freshness
  rules. A disagreement between the two walks would be invisible until
  a published page and `mathc packages` disagreed. The consumer
  position is therefore stronger: the kernel owns the package view and
  the site renders it.

obligations:

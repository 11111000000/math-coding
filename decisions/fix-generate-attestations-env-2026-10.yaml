    statement: |
      Exporting `MATH_CODING_ATTESTATIONS_DIR` to a non-math-coding
      path causes the script to write ONLY to that path; the
      math-coding tree's `attestations/` directory is not touched.
    owner: human:maintainer
    consequence_if_false: |
      If the script still writes a file under
      `<repo_root>/attestations` when the env var is set, the
      cram fixture `tests/scripts/generate-attestations-env.t`
      fails and the sub-decision is blocked.


yaml_sha: "sha256:2de4d3d94893005d5c924bad508180930e771f2fd15e46817eab537458fbf107"

intent: |
  `scripts/generate-attestations.py` writes one attestation JSON per
  TSV row to `<repo_root>/attestations`, hard-coding the path. Every
  adopter who runs the script against an external project (not the
  math-coding tree) ends up writing attestation files into the
  math-coding repo's own tree, polluting it (adoption-2026-10 §10.5
  #5, R5). This decision makes the script honour
  `MATH_CODING_ATTESTATIONS_DIR` (and declares
  `MATH_CODING_DECISIONS_DIR` for kernel parity) so a non-math-coding
  adopter can redirect the output to a sandbox directory. The
  attestation JSON shape and the SHA-256-of-canonical-body id
  computation are unchanged; only the destination directory is
  configurable.

commitment: |
  `scripts/generate-attestations.py` reads `MATH_CODING_ATTESTATIONS_DIR`
  from the environment, defaulting to `<repo_root>/attestations`. The
  `MATH_CODING_DECISIONS_DIR` env var is also exposed (for parity with
  the kernel's v3.4 resolver) even though the script does not
  currently read decisions; the variable is declared so future
  readers of the script see the env-var contract matches the kernel.
  The script gains a `--help` flag whose text names both env vars.
  The attestation JSON shape, the canonical-body SHA-256 id
  computation, and the input manifest format are unchanged.
  `python3 -m py_compile scripts/generate-attestations.py` continues
  to exit 0.

outcomes:
  - id: env-var-honoured
    statement: |
      With `MATH_CODING_ATTESTATIONS_DIR=/tmp/alt-attestations-test`
      exported, the script writes JSONs to
      `/tmp/alt-attestations-test/` and does NOT touch the
      math-coding tree's `attestations/` directory.

scope:
  paths:
    - "scripts/generate-attestations.py"
    - "tests/scripts/generate-attestations-env.t"

obligations:
  - id: env-var-overrides-default
    claim: |
      When `MATH_CODING_ATTESTATIONS_DIR` is set to a writable
      directory, `scripts/generate-attestations.py` writes its
      JSONs there instead of `<repo_root>/attestations`.
    acceptance:
      all:
        - verifier: tests/scripts/generate-attestations-env.t
          result: pass

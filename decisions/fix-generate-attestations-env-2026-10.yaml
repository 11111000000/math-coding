          result: pass

  - id: json-shape-unchanged
    claim: |
      The attestation JSON written by the script has the same
      `id = sha256:<canonical-body>` shape as before; only the
      output directory is configurable.
    acceptance:
      all:
        - verifier: tests/scripts/generate-attestations-env.t
          result: pass

counterexample: |
  "The script is a one-time tooling helper used by humans
  during a sub-decision; making it honour env vars adds API
  surface for no real adoption gain." The counterargument fails
  for two reasons:
  (a) The 2026-10-17 adoption experiment
  (`docs/experiments/adoption-2026-10.md` §10.5 #5, R5) recorded
  this friction in 4/5 project sessions independently; the
  env-var story is broken across the kernel AND the Python
  fallback (R1 vs R5). A sub-decision that fixes one without
  the other leaves the same trap on a different path.
  (b) The script's contract is "duplicate what the OCaml
  `mathc attest-batch` does" (per `scripts/generate-attestations.py`
  docstring and per `ux-3-attest-batch-subcommand-2026-10`).
  Honouring the env vars mirrors the kernel's `lib/path_config.ml`
  resolver behaviour and prevents drift between the two
  attestation-writer paths.

axiom_link:

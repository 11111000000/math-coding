antithesis: |
  Author considered and rejected the strongest counter-position
  that a maintainer might raise: "these six gaps are tiny and
  each is reversible by hand; a decision is overkill for what is
  effectively editorial cleanup." That position is rejected
  because (a) three of the six changes touch kernel-side code
  (`lib/render.ml`, `bin/Mathc.ml`, `lib/packages.ml`), and the
  protocol's `bootstrap-v3@3` developer-practices obligation
  binds a decision to any kernel-side change; and (b) the
  per-decision narrative change is not editorial — it adds new
  public surface (risk blocks, counterexamples, claims) that
  visitors can read; per A3 self-application the change to the
  rules that govern what readers see must itself be governed
  by a recorded commitment. The distinction between
  `counterexample` (the strongest reader-facing objection)
  and `antithesis` (the strongest maintainer-facing objection
  the author considered and rejected) is preserved.

counterexample: |
  "The per-decision narrative change is purely additive — it does
  not affect the kernel's verdict logic, so no decision is needed."
  This argument fails for two reasons. First, the change touches
  `lib/render.ml` and `bin/Mathc.ml` (kernel-side), not just
  `site/*.md` (content); per `decisions/decision.yaml`
  (`bootstrap-v3`) developer-practices obligation, kernel changes
  ship with a decision. Second, the rendered surface is part of
  the project's public contract — visitors can now see risk
  blocks, counterexamples, and obligations-with-claims that the
  verdict grid alone never revealed; the protocol's
  self-application principle requires that the public surface
  acknowledge the change explicitly.


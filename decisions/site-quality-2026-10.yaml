axiom_link:
  - A1
intent: |
  Close the gap between the kernel's promise -- that the protocol's
  published surface lives under its own gate -- and the
  on-the-ground state of the site as of 2026-10-12.

  The bootstrap protocol expired at commit `8fa7fcf`; routine
  guarantees now apply. Three gaps survive the expiration:

  - **Visual**: the hero `<h1>` wraps to five lines on a 1400-px
    viewport because the title literal concatenates the version
    string into the heading.
  - **Content**: per-decision pages (`dist/decisions/<id>.html`)
    render only the verdict grid. The decision YAML
    that the page is named after carries `intent`, `commitment`,
    `scope`, `outcomes`, obligations-with-claims, `counterexample`,
    `risk`, and `relations`; none of it is shown.
  - **Navigation**: the spec pages under `dist/spec/*.html` are
    rendered but live outside the top-level navigation, and the
    FOOTER language toggle advertises a Russian sibling that does
    not exist for `packages.html`.

  This decision records and closes all three.

  2026-10-31, REVISION 2: THE THREE GAPS ARE CLOSED; THE FORM THAT
  DESCRIBED THEM IS NOT. Three things moved under this decision.

  (1) THE RENDERER MOVED. The promise named `lib/render.ml` as the
  file that renders the site; that file is now `lib/render/render.ml`,
  and the per-decision page body is assembled in
  `lib/render/render_yaml.ml`.

  (2) THE PAGE COUNT AND THE SECTION LIST ARE MEASUREMENTS NOW, NOT
  PROSE. The site ships 140 per-decision pages today, not 56. The
  renderer emits six sections per page -- INTENT, COMMITMENT,
  OUTCOMES, OBLIGATIONS, COUNTER-EXAMPLE, RISK -- and it does NOT emit
  SCOPE or RELATIONS, because the extractor they share
  (`lib/render/render_yaml.ml::top_object_list`) reads a LIST of
  objects and the corpus's `scope` and `relations` are MAPS. The
  renderer has code for both sections; the code never fires on the
  corpus. This revision says so instead of promising two headings the
  site does not show.

  (3) THE PROSE STILL SHIPS ONE STALE COUNT, AND THIS REVISION NAMES
  IT INSTEAD OF HIDEING IT. The obligation below owns the rule that
  the prose pages carry figures consistent with the live kernel
  reading. Two of the three literals it used to name are gone; the
  third -- the manifesto's count of the packets that close the
  bootstrap loop -- is STILL THERE and is STILL WRONG. The manifesto's
  Principles section says eight packets form the minimum set and
  points at the master policy's obligations as the canonical list; the
  master policy carries SEVEN obligations today. The promise is not
  weakened to make it true: it stands, the violation is named, and it
  stays owned by the maintainer with the review date the obligation
  already carried.

commitment: |
  `mathc render` emits a site that:

  1. Keeps the version string out of the hero `<h1>` so the heading
     stays on one line on standard viewports (>= 360 px).
  2. Reflects live kernel numbers on the prose pages
     (`manifesto.md`, `foundations.md`, `bootstrap-gate.md`) so
     stale figures no longer ship.
  3. Adds the spec surface to the top navigation as a single entry
     pointing at the kernel contract page, the most-visited spec.
  4. Renders every per-decision page with the decision's YAML body
     between the page title and the obligation verdict grid.
  5. Hides the FOOTER language toggle on pages whose `has_ru` is
     `false`, so the toggle never links to a 404 sibling.

scope:
  paths:
    - "site/**"
    - "assets/**"
    - "lib/packages.ml"
    - "bin/Mathc.ml"
    - "tests/render_kernel.ml"
    - "tests/counters_drift.ml"
  # 2026-10-25: pruned from this scope, per decisions/dead-scope-paths-2026-10.yaml
  #   lib/render.ml - no tracked file matches it
  # 2026-10-31: the render kernel was split; the implementation lives in
  #   lib/render/render.ml and lib/render/render_yaml.ml. The scope
  #   names the files this decision TOUCHED; the implementation anchor
  #   is named in prose.
  decisions:
    - "site-deploy@5"
    - "render-kernel-fixes-2026-10@1"
    - "mathjax-default-on-2026-10@1"
    - "site-version-from-file-2026-10@1"

outcomes:
  - id: hero-fits-one-line
    statement: |
      The home page hero no longer wraps to multiple lines on
      standard desktop viewports. Measured on 2026-10-31 by
      `bash scripts/render.sh`: the hero heading renders as
      `<h1>math-coding</h1>`, with no version string inside it.
  - id: prose-reflects-live-state
    statement: |
      Documented counts (decisions, obligations, subjects) on
      prose pages match the live kernel reading on a clean `main` HEAD.
      Measured on 2026-10-31 by `mathc counters --format=json`: 140
      decisions in the corpus (137 active), 537 obligation pairs, and
      0 self-check subjects -- the last two because this checkout has
      no generated attestation store, so every pair reads `no_store`
      and the self-check reports `skipped`. Those are the UNKNOWN
      numbers, not zero.
  - id: spec-in-nav
    statement: |
      The spec surface is reachable from the top navigation
      in one click. Measured on 2026-10-31: every rendered page
      carries `<a class="nav-link nav-group-link"
      href="spec/kernel-contract.html">Algebra</a>`.
  - id: per-decision-narrative
    statement: |
      Every per-decision page (`dist/decisions/<id>.html`)
      renders the decision's YAML body sections in addition to
      the verdict grid. The sections the renderer emits are INTENT,
      COMMITMENT, OUTCOMES, OBLIGATIONS (each with `id` + `claim` +
      `verdict`), COUNTER-EXAMPLE and RISK.

      SCOPE AND RELATIONS ARE NOT EMITTED. The renderer carries code
      for both (`lib/render/render_yaml.ml::render_quad` for Scope,
      `lib/render/render_yaml.ml::render_yaml_relations` for
      Relations), but the extractor they read
      (`lib/render/render_yaml.ml::top_object_list`) expects a LIST of
      objects, and the corpus's `scope` and `relations` are MAPS, so
      the code never fires on the corpus.

      Measured on 2026-10-31 by `bash scripts/render.sh` followed by
      a grep for each `<h2>` heading over the 140 pages in
      `dist/decisions/`: Intent 140, Commitment 140, Outcomes 140,
      Obligations 139, Counter-example 140, Risk 140, Scope 0,
      Relations 0. The promise is the six sections the site shows; the
      two it does not show are a NAMED gap, not a silent one.
  - id: footer-lang-toggle-honest
    statement: |
      The footer language toggle only appears on pages whose
      Russian sibling actually exists.

      Measured on 2026-10-31 by `bash scripts/render.sh`: the
      per-decision page `dist/decisions/site-deploy.html` carries no
      language toggle at all, while `dist/index.html` links to
      `index.ru.html`. The example this decision used to give --
      `packages.html` -- is STALE: `site/packages.ru.md` exists, so
      `dist/packages.html` is a page whose Russian sibling DOES
      exist, and it carries the toggle.

assumptions:
  - id: live-counts-known
    state: assumed
    statement: |
      The live kernel reading on a clean `main` HEAD is available to
      whoever refreshes the prose. Measured on 2026-10-31 with no
      generated attestation store in the checkout:
      `mathc counters --format=json` reports 140 decisions in the
      corpus (137 active), 537 obligation pairs -- every one of them
      `no_store` -- and 0 self-check subjects with the verdict
      `skipped`. With a store generated for the current tree, the
      obligation and subject counts become real numbers instead of
      `unknown`.
    owner: human:maintainer
    consequence_if_false: |
      A prose page would carry a stale count even
      after the edits in this decision land; rerun `mathc counters`
      on the live HEAD before regenerating the prose.
    review_on:
      - signal: mathc-counters-counts-moved

obligations:
  - id: hero-h1-fits-one-line
    outcome: hero-fits-one-line
    claim: |
      On a 1400-px viewport, the home page hero `<h1>` is at most
      two lines; the version string does not appear inside the
      `<h1>` text.
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the rendering is read by a human in a browser
    acceptance:
      all:
        - verifier: manual-render-hero-element

  - id: prose-reflects-live-counts
    outcome: prose-reflects-live-state
    claim: |
      The prose pages `manifesto.md`, `foundations.md`, and
      `bootstrap-gate.md` carry figures consistent with the live
      kernel output on a clean `main` HEAD. The literal strings
      "23 subjects" (bootstrap-gate) and "29 active decisions"
      (foundations) no longer appear in the rendered text.

      THE MANIFESTO'S COUNT IS STILL WRONG, AND THIS OBLIGATION STILL
      OWNS IT. `site/manifesto.md` says that eight packets form the
      minimum set that closes the bootstrap loop and names the master
      policy's obligations as the canonical list; the master policy
      `decisions/decision.yaml` carries SEVEN obligations today, so
      the count the manifesto's sentence states is stale. Measured on
      2026-10-31: the literal "eight principles" is present in
      `site/manifesto.md` and absent from the other two pages. The
      promise is not restated to exclude it -- the promise is that
      the prose carries no count the kernel would contradict, and the
      manifesto's eight is a count the kernel contradicts. It is a
      site-content repair, it is owned by the maintainer, and it
      carries the same review date as the rest of this obligation.
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the rendering is read by a human in a browser
    acceptance:
      all:
        - verifier: manual-render-prose-numbers

  - id: spec-in-nav
    outcome: spec-in-nav
    claim: |
      The site top navigation carries an "Algebra" link pointing at
      `spec/kernel-contract.html` from every page that has the full
      nav.
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the rendering is read by a human in a browser
    acceptance:
      all:
        - verifier: manual-render-nav-spec-link

  - id: per-decision-narrative-rendered
    outcome: per-decision-narrative
    claim: |
      Every per-decision page (`dist/decisions/<id>.html`) renders the
      YAML body sections in addition to the verdict grid: the
      decision's `intent`, `commitment` (if non-empty), `outcomes`
      (if non-empty), `obligations` (each with `id` + `claim` +
      `verdict`), `counterexample` (if non-empty), and `risk`
      (if non-empty). The `scope` and `relations` sections are NOT
      emitted by the renderer today; the obligation does not promise
      them, and the gap is recorded in the outcome rather than
      promised away.
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the rendering is read by a human in a browser
    acceptance:
      all:
        - verifier: manual-render-decision-page-section

  - id: footer-lang-toggle-only-with-ru-sibling
    outcome: footer-lang-toggle-honest
    claim: |
      The FOOTER language toggle is hidden on pages whose
      `has_ru` is `false` (e.g. `decisions/<id>.html`,
      `axioms/<id>.html`, `spec/<name>.html`). On every other prose page
      (`index.html`, `axioms.html`, `packages.html`, `manifesto.html`,
      the `-ru` and `-zh` siblings, etc.) the toggle still renders
      and links to the correct sibling.
    declared:
      owner: human:maintainer
      review_on: 2026-12-15
      reason: the rendering is read by a human in a browser
    acceptance:
      all:
        - verifier: manual-render-footer-lang-toggle

reversal:
  - signal: live-counts-moved-and-prose-not-refreshed
    action: refresh-prose-and-bump-revision
  - signal: mathc-render-decision-page-section-fails
    action: revert-render-decision-page-to-revert

risk:
  declared_triggers:
    - per-decision-yaml-shape-changes
    - site-prose-numbers-drift
    - the-master-policy-obligation-count-moves
  owner: human:maintainer

antithesis: |
  Author considered and rejected the strongest counter-position
  that a maintainer might raise: these six gaps are tiny and
  each is reversible by hand; a decision is overkill for what is
  effectively editorial cleanup. That position is rejected
  because (a) three of the six changes touch kernel-side code
  (the render kernel, `bin/Mathc.ml`, `lib/packages.ml`), and the
  protocol's `bootstrap-v3@3` developer-practices obligation
  binds a decision to any kernel-side change; and (b) the
  per-decision narrative change is not editorial -- it adds new
  public surface (risk blocks, counterexamples, claims) that
  visitors can read; per A3 self-application the change to the
  rules that govern what readers see must itself be governed
  by a recorded commitment. The distinction between
  `counterexample` (the strongest reader-facing objection)
  and `antithesis` (the strongest maintainer-facing objection
  the author considered and rejected) is preserved.

counterexample: |
  The per-decision narrative change is purely additive -- it does
  not affect the kernel's verdict logic, so no decision is needed.
  This argument fails for two reasons. First, the change touches
  the render kernel and `bin/Mathc.ml` (kernel-side), not just
  `site/*.md` (content); per `decisions/decision.yaml`
  (`bootstrap-v3`) developer-practices obligation, kernel changes
  ship with a decision. Second, the rendered surface is part of the
  project's public contract -- visitors can now see risk
  blocks, counterexamples, and obligations-with-claims that the
  verdict grid alone never revealed; the protocol's
  self-application principle requires that the public surface
  acknowledge the change explicitly.

relations:

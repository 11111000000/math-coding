  - A1
intent: |
  Close the gap between the kernel's promise — that the protocol's
  published surface lives under its own gate — and the
  on-the-ground state of the site as of 2026-10-12.

  The bootstrap protocol expired at commit `8fa7fcf`; routine
  guarantees now apply. Three gaps survive the expiration:

  - **Visual**: the hero `<h1>` wraps to five lines on a 1400-px
    viewport because the title literal concatenates the version
    string into the heading.
  - **Content**: per-decision pages (`dist/decisions/<id>.html`,
    56 of them) render only the verdict grid. The decision YAML
    that the page is named after carries `intent`, `commitment`,
    `scope`, `outcomes`, obligations-with-claims, `counterexample`,
    `risk`, and `relations`; none of it is shown.
  - **Navigation**: the spec pages under `dist/spec/*.html` are
    rendered but live outside the top-level navigation, and the
    FOOTER language toggle advertises a Russian sibling that does
    not exist for `packages.html`.

  This decision records and closes all three.

commitment: |
  `mathc render` emits a site that:

  1. Keeps the version string out of the hero `<h1>` so the heading
     stays on one line on standard viewports (≥ 360 px).
  2. Reflects live kernel numbers on the prose pages
     (`manifesto.md`, `foundations.md`, `bootstrap-gate.md`) so
     stale figures ("eight principles", "23 subjects", "29 active
     decisions") no longer ship.
  3. Adds the spec surface to the top navigation as a single entry
     pointing at the kernel contract page, the most-visited spec.
  4. Renders every per-decision page with the full YAML body —
     intent, commitment, scope, outcomes, obligations-with-claims,
     counterexample, risk, relations — between the page title and
     the obligation verdict grid.
  5. Hides the FOOTER language toggle on pages whose `has_ru` is
     `false`, so the toggle never links to a 404 sibling.


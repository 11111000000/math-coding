---
schema: math-coding/3.2
id: parser-risk-owner-default
revision: 2
state: active
body_sha: "sha256:e44e08cf09d8cdbe08de4aa313bacdc1f5dbfbbe58d11e1881d85c89f51a2222"
yaml_sha: "sha256:e44e08cf09d8cdbe08de4aa313bacdc1f5dbfbbe58d11e1881d85c89f51a2222"
intent: |
  Document a kernel parse bug surfaced by the 2026-10-05 audit
  cycle, record the in-tree workaround, and bound the proper
  fix as a follow-up. The bug: lib/decision.ml:parse_decision's
  inner match `Schema.take_string rps "owner" with | Some owner ->`
  has no `| None ->` arm. When a risk block declares
  `declared_triggers:` but omits `owner:`, the kernel raises
  Match_failure at runtime, parse_decision returns None, and
  mathc validate reports the generic
  `missing or invalid required field` instead of naming the
  missing field. The bootstrap policy
  (decisions/decision.yaml) is one such case.

axiom_link:
  - A0
commitment: |
  The kernel's parse_decision is bounded: a risk block MUST
  either carry `owner: <string>` or be accepted as the
  schema-default (human:maintainer). When this decision was
  taken the kernel was strict (no default) and the in-tree
  workaround was `owner: human:maintainer` on
  decisions/decision.yaml. The proper fix (the owner default
  extracted outside the inner match in parse_decision) has
  since landed in lib/decision.ml; the `kernel-default-owner-landed`
  reversal signal fired, and a risk block without an owner is
  accepted with the schema default instead of raising
  Match_failure. The workaround line on decisions/decision.yaml
  stays until this decision is superseded.

counterexample: |
  The fix is not implemented. The current workaround relies on
  the author remembering to add `owner:` to every risk block;
  a future decision authored without owner will be silently
  dropped (not rejected with a clear diagnostic).

  "Adding owner to decision.yaml is a workaround that masks a
  kernel bug; the kernel should accept either form." Counterargument:
  the schema marks `owner` as required, so the YAML file is
  formally non-conformant without it. The workaround is a minimal
  schema-aligned fix that keeps the bootstrap policy valid while
  the kernel refactor is pending. A future kernel change that
  makes `owner` truly optional would render this workaround
  redundant; this decision would be superseded.

scope:
  paths:
    - "lib/decision.ml"
    - "decisions/decision.yaml"
  exclusions:
    - "lib/decision.ml:381-398"  # current owner-match, see decision

outcomes:
  - id: bootstrap-policy-validates
    statement: |
      `mathc validate decisions/decision.yaml` exits 0. The file's
      risk block declares no `owner:`, and the kernel accepts it:
      the owner default landed in lib/decision.ml, so a risk block
      without an owner is a valid risk block. Without that default
      the file would fail parse_decision with Match_failure
      (observed in session 2026-10-06).
  - id: workaround-documented
    statement: |
      The workaround this decision recorded is GONE, and the default
      that replaced it is in the kernel: lib/decision.ml gives a
      risk block without `owner:` the schema default
      `human:maintainer`. The `owner: human:maintainer` line that
      remains in decisions/decision.yaml belongs to its ASSUMPTION
      block, not to its risk block - which is why the revision-2
      check could not tell the two apart.

assumptions:
  - id: kernel-fix-deferrable
    state: assumed
    statement: |
      The proper kernel fix in lib/decision.ml is mechanically
      simple (one `let` binding outside the inner match) but
      kept failing the surrounding nested-match paren balance
      during the 2026-10-06 refactor cycle. It is deferred
      to a dedicated commit where the inner match is restructured
      before the default is extracted.
    owner: human:maintainer
    consequence_if_false: |
      If the kernel fix is needed urgently, the patch is
      a 5-line addition to lib/decision.ml. Until then,
      authors must remember to add `owner:` to every risk block.
    review_on:
      - signal: kernel-default-owner-landed

obligations:
  - id: bootstrap-validates
    outcome: bootstrap-policy-validates
    claim: |
      `mathc validate decisions/decision.yaml` exits 0, although the
      file's risk block declares no `owner:` at all. The revision-2
      claim was "exits 0 WITH the workaround"; the workaround is
      gone, and what the check now proves is the rule the workaround
      used to stand in for.

      The revision-2 check was `tests/cli/validate-positive.t`, which
      validates a conformance fixture and not this file at all: a
      green check that asked a different question.
    acceptance:
      all:
        - verifier: mathc validate decisions/decision.yaml
  - id: owner-default-replaces-the-workaround
    outcome: workaround-documented
    claim: |
      lib/decision.ml gives a risk block that declares no `owner:`
      the schema default `human:maintainer`, so the kernel's rule
      replaced the workaround this decision recorded.

      The revision-2 claim was that the line
      `owner: human:maintainer` appears in decisions/decision.yaml
      AT THE RISK BLOCK. It does not, and it did not: the line the
      file carries is in the ASSUMPTION block, and the check that
      claimed the risk block could not tell the two apart - it
      searched the whole file for a string, so it was green for the
      wrong reason. What the claim holds now is the rule the
      workaround stood in for, and the check below reads that rule
      out of the kernel's own source.
    acceptance:
      all:
        - verifier: shell-grep lib/decision.ml human:maintainer

reversal:
  - signal: kernel-default-owner-landed
    condition: |
      lib/decision.ml:parse_decision is refactored to extract
      the owner default outside the inner match
      (`Schema.take_string rps "owner" with | Some owner ->`).
      After this refactor, the workaround owner line is
      redundant; the decision can be superseded and the line
      removed from decisions/decision.yaml.
    action: supersede-with-kernel-default

risk:
  declared_triggers:
    - workaround-becomes-permanent
  owner: human:maintainer

relations:
  supersedes: []
  superseded_by: []
  addresses:
    - bootstrap-v3@3

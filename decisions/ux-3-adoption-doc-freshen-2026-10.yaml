intent: |
  Phase 0 of the ux-3 workstream. Close schema-drift in
  `adoption/SKILL.md` and `USAGE.md`: bump the example YAML's
  schema-string from `math-coding/3.0-alpha` to `math-coding/3.2`
  (the live schema after
  `decisions/schema-string-bump-3.0-alpha-to-3.2-2026-10.yaml@1`),
  update the `bootstrap-v3@N` revision pin, fix the example YAML so
  it includes the required `outcomes:` block, and add a
  `mathc explain-diagnostic <CODE>` reference so users learn to
  resolve `MC-*` codes through the kernel.

  No kernel surface. No `lib/`, no `bin/Mathc.ml`, no `spec/`, no
  `schemas/`, no `axioms/`. Only:

    adoption/SKILL.md          (schema-string + outcomes block +
                                explain-diagnostic reference)
    USAGE.md                   (explain-diagnostic reference)
    decisions/ux-3-adoption-doc-freshen-2026-10.yaml  (this file)
    scripts/check-adoption-doc-freshen.sh            (verifier wrapper)

  This decision is META per the PACKAGES.md convention. It does
  not appear in `mathc packages` counts.

axiom_link:
  - A0
  - A4

antithesis: |
  The counter-position considered and rejected: "Schema-string
  freshening and `mathc explain-diagnostic` cross-references are
  maintenance plumbing — they are not 'decisions', they are routine
  follow-ups. Recording one in `decisions/` adds ceremony without
  changing obligations and creates a precedent that every doc
  re-write needs its own decision. Skip the decision; just open
  the PR." The author engaged with this position and rejected it
  on three grounds: (a) `AGENTS.md §Self-application` requires a
  decision for any change that touches the user-facing
  documentation surface, which downstream consumers (skill loading,
  `mathc validate`, README copy-paste) parse; without a recorded
  decision the change is unreviewed from the audit perspective;
  (b) the bump from `math-coding/3.0-alpha` to `math-coding/3.2`
  changes the schema string downstream consumers parse, so a drift
  breaks a future agent's loop silently — the bump must have a
  `decisions/` link in the relations graph to be visible to the
  kernel; (c) shipping the `mathc explain-diagnostic <CODE>`
  reference in two canonical places (`adoption/SKILL.md` and
  `USAGE.md`) ensures every adopter learns the recovery path for
  `MC-*` codes — without it, the diagnostic surface is unusable
  for first-time users.

commitment: |
  Two deliverables, each pinned by an obligation:

    D1. `adoption/SKILL.md`:
        - example YAML uses `schema: math-coding/3.2` (not
          `math-coding/3.0-alpha`);
        - example YAML carries an `outcomes:` block (otherwise
          the example would fail `mathc validate` against the
          live schema);
        - `relations.addresses` pin is `bootstrap-v3@3` (not `@2`);
        - `mathc version` expectation matches the live binary
          output (`math-coding 3.1.0-alpha-final: bootstrap`);
        - a `mathc explain-diagnostic <CODE>` reference is added
          in §"Step 4. Validate and self-check".

    D2. `USAGE.md`:
        - a `mathc explain-diagnostic <CODE>` reference is added
          in §"Review-time questions".

  Boundaries (A3 self-application):
    - No kernel surface changes.
    - No `lib/`, no `bin/Mathc.ml`, no `spec/`, no `schemas/`, no
      `axioms/` are touched.
    - This decision does not introduce the `.opencode/` repo-tracked
      skill; that is decision `ux-3-repo-tracked-opencode-skill-2026-10`
      (Phase 1).
    - This decision does not bump `VERSION`; it only aligns the
      schema-string family name.
    - `mathc explain-diagnostic` is already a landed subcommand
      (per ROADMAP Tier 3.5); the doc references the existing
      command.

counterexample: |
  "Freshening `adoption/SKILL.md` from `math-coding/3.0-alpha` to
  `math-coding/3.2` is a string-only edit; the only way it could be
  wrong is if the downstream consumers do not actually require the
  bump at the same time." The counterargument fails because
  `decisions/schema-string-bump-3.0-alpha-to-3.2-2026-10.yaml` is
  the formal amendment authorising the bump; without the freshen,
  the SKILL.md example claims `3.0-alpha` while the kernel validates
  `3.2`, so the first-clone user runs into a mismatch on the very
  first `mathc validate` call against their copy. "Adding the
  `mathc explain-diagnostic <CODE>` reference is over-reach; the
  docs already mention the command." This fails because the existing
  mentions are either in CLI tables (no remediation guidance) or in
  subcommand descriptions (one-line). Without a per-error pointer,
  the user has to discover the command and read its output. Two
  canonical placements are the minimum to make the recovery path
  findable.


intent: |
  Revision 2 of `ux-3-adoption-doc-freshen-2026-10`. The
  Phase-0 freshening at @1 still referenced
  `MC_VERSION=3.1.0-alpha-final` in `adoption/SKILL.md` §"Step 1"
  via the old `wget | chmod` install pattern, and the
  verifier `scripts/check-adoption-doc-freshen.sh` had
  (reverse-logic) greps for the literal `3.1.0-alpha-final`
  string. After `decisions/install-tooling-default-tag-edge-2026-10@1`
  flipped `MC_VERSION_DEFAULT` in `install.sh` to `edge`,
  the literal `3.1.0-alpha-final` no longer resolves to a
  published tag, so the doc references and the verifier both
  had to move to `edge`.

  This revision ships two coupled updates:
  1. `adoption/SKILL.md` §"Step 1" replaces the
     `wget | chmod` block (with its literal `v3.1.0-alpha-final`
     URL) with the canonical `curl | sh --user-skill`
     pattern that matches `USAGE.md` §"Install".
  2. `scripts/check-adoption-doc-freshen.sh` replaces the
     reverse-logic grep for `3.1.0-alpha-final` with a
     forward check that `adoption/SKILL.md` no longer
     carries the literal `3.1.0-alpha-final` and does
     carry `releases/download/edge/install.sh` (the new
     URL).

  Per-repo skill `.opencode/skills/math-coding/SKILL.md` is
  a verbatim copy of `adoption/SKILL.md` per
  `ux-3-repo-tracked-opencode-skill-2026-10@1`; the
  in-repo copy is byte-synced with `adoption/SKILL.md`
  immediately after the §"Step 1" edit via
  `cp adoption/SKILL.md .opencode/skills/math-coding/SKILL.md`.
  `scripts/check-opencode-skill.sh` then re-verifies
  byte-equality.

axiom_link:
  - A0
  - A1
  - A4

antithesis: |
  The counter-position considered and rejected: "Rev-bump a
  META decision for a doc-only update is over-ceremony;
  the `wget | chmod` block is editorial copy and the verifier
  change is a one-line grep tweak." The author engaged with
  this position and rejected it on three grounds: (a) the
  @1 decision is recorded as META per the PACKAGES.md
  convention but its scope includes `adoption/SKILL.md`,
  `USAGE.md`, and `scripts/check-adoption-doc-freshen.sh`
  (lines 107-110 of @1); any change to those files is a
  change to the META decision's commitment and a rev-bump
  is the auditable form; (c) per AGENTS.md, a verifier
  change is a kernel-adjacent surface — a doc-only update
  that turns a green verifier red would silently disable
  `scripts/check.sh` for future contributors; this revision
  documents both changes in one auditable diff.

commitment: |
  Three deliverables, each pinned by an obligation:

  D1. `adoption/SKILL.md` §"Step 1. Install the kernel"
      replaces the legacy `wget | chmod` block with the
      canonical `curl | sh --user-skill` pattern. The
      literal string `3.1.0-alpha-final` is gone from the
      block; `releases/download/edge/install.sh` is
      present; the per-user skill install is shown with
      `--user-skill`.

  D2. `.opencode/skills/math-coding/SKILL.md` is byte-for-byte
      identical to `adoption/SKILL.md` immediately after
      the edit. `scripts/check-opencode-skill.sh` exits 0.

  D3. `scripts/check-adoption-doc-freshen.sh` reverses the
      check at line 43: instead of asserting that
      `adoption/SKILL.md` carries `3.1.0-alpha-final`, it
      now asserts that `adoption/SKILL.md` does NOT
      carry `3.1.0-alpha-final` AND that it does carry
      `releases/download/edge/install.sh`. The verifier
      exits 0 on the post-edit tree.

  Boundaries (A3 self-application):
  - No `lib/**`, `bin/Mathc.ml`, `spec/**`, `schemas/**`,
    `axioms/**` touched.
  - The kernel verdict is unchanged.
  - The freshen in D1 mirrors the pattern in
    `USAGE.md:14-20` (Phase-1 install-tooling surface) so
    both documents tell the same story.

counterexample: |
  "What if `edge` is removed and replaced with `latest`?"
   Counterargument: `install-tooling-default-tag-edge-2026-10`
   records the assumption `edge-tag-publishes` and the
   `reversal` block `install-tooling-default-tag-bumped`
   captures the case. This revision tracks the same
   default; if a stable SemVer tag lands, both files
   move in lockstep.

  "What if the per-repo skill copy is forgotten and the
   verifier doesn't catch it?" Counterargument:
   `scripts/check-opencode-skill.sh` is run by
   `scripts/check.sh`; a copy mismatch fails the
   aggregator. The commit message for this revision
   explicitly calls out the `cp` step so the diff is
   easy to audit.

assumptions:

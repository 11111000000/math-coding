counterexample: |
  The counter-position considered and rejected: "8 codes is
  fine — the apparent overlap is illusory; new agents learn
  the rubric by reading §7 once." Rejected on three grounds:

    (a) The same env-var bug (R1) was independently tagged
        with `F-WORKFLOW` (cobra/T1-1), `F-INTEGRATION`
        (express/T1-1), `F-TOOLING` (click/T1-1), and
        `F-SETUP` (ripgrep/T1-1). Four 8-code categories for
        ONE kernel defect is not illusory overlap; it is a
        category explosion in the experiment data.

    (b) §10.4's by-category table has F-INTEGRATION=10,
        F-TOOLING=10, F-WORKFLOW=9, F-COGNITIVE=9 — four
        near-tied categories where any meaningful re-rank by
        frequency is meaningless because the categories
        themselves overlap. The conclusion "R1 is the most
        common friction" rests on which 8-code tag wins.

    (c) The 4-code form is mutually exclusive BY CONSTRUCTION:
        an event either describes deployment, schema, "what
        to do next", or "surprise me". A future agent reads
        the four categories once and classifies deterministically;
        no rubric re-read needed.

  A second counter-position: "Collapsing 8 to 4 loses
  signal; keep the 8 codes as a fine-grained layer and
  report aggregates." Acknowledged: this commit does NOT
  destroy the 8-code observations. The 8-code observations
  are recorded in (a) the prior 8-code counts cited in the
  "Traced to:" notes (§10.5, §13 R1-R7), (b) this
  decision's `intent` and `counterexample` blocks above,
  and (c) the git history (`git log -p
  docs/experiments/adoption-2026-10.md` against the prior
  HEAD shows the full 8-code taxonomy). The 4-code form is
  the REPORTING layer; the 8-code form remains accessible
  in the audit trail.


intent: |
  Apply R6 of `docs/experiments/adoption-2026-10.md` §13 by
  collapsing the 8-code friction taxonomy (F-SETUP, F-SCHEMA,
  F-WORKFLOW, F-TOOLING, F-COGNITIVE, F-INTEGRATION, F-DOC,
  F-BROWNFIELD) to 4 mutually exclusive codes (F-INSTALL,
  F-SCHEMA, F-WORKFLOW, F-SEMANTIC), re-classifying all 55
  recorded friction events, and updating the experiment
  report so the consolidated view reflects the new taxonomy.
  This is C1 of `plan-2026-10-adoption-fixes-2026-10`.
  Scope is docs only; no kernel, no schema, no
  attestation-store change.

commitment: |
  Three deliverables, all docs-only and atomically
  revertable in one `git revert`:

    D1. `docs/experiments/adoption-2026-10.md` §7 is updated
        from the 8-code table to a 4-code table with the
        mapping rules spelled out (mapping from old to new
        code, including the F-COGNITIVE → split across
        F-SCHEMA / F-WORKFLOW / F-SEMANTIC rule).

    D2. `docs/experiments/adoption-2026-10.md` §10.4 (the
        by-category table) reports the new counts:
        F-INSTALL=28 / F-WORKFLOW=15 / F-SCHEMA=8 /
        F-SEMANTIC=4 (sum=55). §10.5, §11.2, §13 R1-R7
        "Traced to:" lines, and the §13 R6 status note are
        updated to use the 4-code form while preserving the
        historical observation that the OLD taxonomy was
        subjective.

    D3. The 5 per-project experiment reports
        (`~/Projects/math-coding-experiment/{click,cobra,express,ripgrep,sinatra}/experiment-report.md`)
        have every event's `code:` line re-classified under
        the 4-code form. The event count per project is
        unchanged: click=7, cobra=14, express=12,
        ripgrep=13, sinatra=9 (sum=55).

  Out of scope (preserved by this commit):
    - Kernel files (`lib/**`, `bin/**`, `spec/**`).
    - Schema files (`schemas/**`).
    - The active policy (`decisions/decision.yaml`).
    - The per-event `code:` line provenance (the ORIGINAL

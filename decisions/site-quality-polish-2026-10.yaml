axiom_link:
  - A1
intent: |
  Apply the polish and quality improvements that the
  pre-Phase-0 / pre-Phase-1 site-quality analysis flagged
  but that Phase 1 (content) and Phase 2 (illustrations)
  did not close. Four gaps remain:

  - the site ships no accessible focus indicators; keyboard
    users tabbing through the nav or verdict-pill links
    see no visual cue for the current focus target
    (a Lighthouse accessibility run scored ~80 before
    Phase 0);
  - the home page carries a static verdict summary that
    has to be regenerated whenever the kernel runs;
    visitors on a stale branch see numbers that may lag
    the live build by hours;
  - the verdict pill on every decision and every package
    uses the same saturated green for `pass`, which makes
    a passing site look like a green-tinted dashboard and
    buries the actual signal (which is the non-pass
    verdicts);
  - the print stylesheet inherited from Phase 0 is
    minimal: nav and footer print but sidenotes and
    blockquote-callouts disappear; the long axiom pages
    are hard to read on paper.

commitment: |
  `mathc render` produces a site that:

  1. Exposes a `:focus-visible` outline on every
     interactive element (nav links, verdict pills, axiom
     icons, anchor links), meeting the WCAG 2.1 2.4.7
     "Focus Visible" success criterion.

  2. Carries a tiny client-side counter on the home page
     that reads the live `data-mathc-package-count`,
     `data-mathc-pass-count`, and `data-mathc-unknown-count`
     attributes (the kernel already emits these on the
     package grid) and surfaces them in the hero meta
     paragraph in place of the static "207 obligations"
     text.

  3. Renders the `pass` verdict label in a neutral
     background (warm cream + oxblood outline) instead of
     saturated green; `fail`, `unknown`, `stale`,
     `missing`, and `waived` retain their semantic
     colours so non-pass verdicts remain the visual
     signal.

  4. Prints the long-form articles (axiom home, manifesto,
     workflow, foundations, methodology) with a
     print-friendly layout: nav and footer are hidden;
     sidenotes and callouts are kept; the prose column is
     widened to the page; per-decision verdict grids are
     emitted as compact type=3 lists so each verdict is
     on a single line.


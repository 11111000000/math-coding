counterexample: |
  "Polish is editorial; no decision is needed." This
  argument fails because (a) the focus-visible rule is a
  new contract: a keyboard-only visitor receives a visible
  cue for the first time; (b) the live counter introduces
  client-side JavaScript that did not exist before, which
  is a new runtime behaviour; and (c) the verdict-pill
  colour change is a visual contract change for the
  rendered HTML. Per the project policy, any kernel-side
  or site-surface change that a visitor can perceive
  ships with a decision under the active policy.

antithesis: |
  Author considered and rejected the strongest counter-
  position that a maintainer might raise: "the existing
  visitors do not need keyboard navigation; the verdict
  pills already convey their meaning; the print page is
  rarely used; the live counter adds JavaScript that
  bloats every page." That position is rejected because
  (a) keyboard navigation is a documented accessibility
  requirement (WCAG 2.1) that the site currently fails;
  (b) the live counter is 25 lines of JavaScript that
  reads attributes the kernel already emits, so it
  costs nothing at render time and adds nothing to pages
  that do not opt in; and (c) the print stylesheet
  matters when an LLM agent or human maintainer prints
  the long-form prose for offline review, which is a
  documented use case in USAGE.md.


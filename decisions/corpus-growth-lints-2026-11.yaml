intent: |
  Two ways the corpus grows are invisible to the gate, and both of
  them are invisible in the same way: the kernel KNOWS, and says
  nothing that a program can count.

  (1) THE VERIFIER SCHEME. An obligation names a verifier; the
  kernel can execute some names and not others. The scheme of a
  verifier string is its first whitespace-delimited token, and the
  kernel executes the string only when that token is in
  `canonical_verifier_schemes` or begins with one of
  `canonical_verifier_prefixes` (bin/Mathc.ml::known_verifier_scheme).
  The kernel DOES notice a scheme it does not know: `mathc validate`
  emits one Warn-level MC-VERIFIER-SCHEME-UNKNOWN per offending
  string (decisions/verifier-scheme-convention-2026-11.yaml). That is
  a warning per FILE. Nothing aggregated the warnings over the
  corpus, so the corpus could grow offenders one file at a time and
  nothing anywhere said so. MEASURED 2026-10-31: five obligations in
  the live corpus carry a verifier the kernel cannot run -
  `decisions/cli-canonical-name.yaml` (two, a YAML single quote the
  reader does not remove), `decisions/constitution-header-3-3-update-
  2026-10.yaml` (one, a closing double quote that the comment
  stripper removes with the comment), and
  `decisions/audit-0.0.21-fixes.yaml`,
  `decisions/exit-code-symmetry-2026-10.yaml` and
  `decisions/forge-principal-verification-2026-10.yaml` (three
  bespoke schemes the kernel never learned). Six offending strings in
  five obligations.

  (2) THE RELATION TARGET. A decision may name other decisions:
  `supersedes`, `addresses`, `depends_on` and the rest
  (spec/algebra-3.2.md §7). Each name is a claim about the corpus's
  history. The kernel checks the SHAPE of such a claim and nothing
  else - `mathc mark-superseded --by=<id>@<rev>` parses the reference
  and never asks whether the decision exists
  (lib/lifecycle/lifecycle.ml::parse_by) - and no command RESOLVES a
  relation target. So a relation whose target was deleted stays in the
  corpus as a claim about a decision that is not there, and the
  corpus's own rendered view of itself believes it:
  `mathc graph --decision=corpus-meta-layer-2026-10` prints THREE
  nodes that are not in the corpus - `ceiling-monotonic-2026-10`,
  `scope-invalidation-breadth-2026-10` and
  `self-check-fixture-coverage-honest-2026-10` - and draws six edges
  to them. The first of the three names a decision that exists under
  a DIFFERENT id (`decisions/ceiling-monotonic-2026-10.yaml` declares
  `id: ceiling-monotonic`); the other two name decisions that are not
  in the corpus at all. Nothing says so, because nothing checks.
  MEASURED 2026-10-31: 44 relation targets in the live corpus resolve
  to nothing (33 name a decision that does not exist, live or
  archived; 10 name a file that does not exist; 1 names a decision
  that exists and an obligation inside it that does not), 2 name an
  AXIOM where the schema declares a relation between decisions, and 1
  sits under a relation key (`amends`) the schema does not have.

  WHY NOW. Tranche T2 of the plan
  (docs/plans/redundancy-and-portability-2026-11.md, on the branch
  `feat/redundancy-census-2026-11`) is about to rewrite the corpus.
  A rewrite that is not measured cannot be checked: the writer needs
  a number to move and the reader needs a number to check. And a
  REPORT is not enough. A report tells the reader what is there; a
  CEILING tells the reader that the number must go DOWN, that the
  direction is the contract, and that the day it reaches zero the
  check can become blocking. Tranche T0.3 of the plan asks for
  exactly these two lints, and says that their first day must run as
  reports, not as errors - which is what a ceiling above the current
  value is: the number is printed, the comparison is made, and the
  exit code says whether the corpus grew.

  WHAT THESE TWO ARE NOT. They are not a second census.
  tests/fixtures/redundancy-census.sh is a REPORT of the corpus's
  shape over six numbers, led by the orchestrator, and it is
  deliberately coarse: it answers "how much of which is there". These
  two instruments answer a narrower question per class - "is this
  corpus's count of THIS shape of defect under its ceiling" - and
  they answer it with three things the census does not have: a
  resolution rule written down line by line, a vocabulary READ from
  the code rather than copied into it, and a negative control per
  instrument. The difference is spelled out in the counterexample
  below, including the part where the duplication is real and which
  of the two numbers should go if the corpus ever has to choose.

commitment: |
  After this decision closes:

  1. `tests/fixtures/verifier-scheme-allowlist.sh` measures how many
     obligations in the live corpus carry a verifier whose scheme the
     kernel does not know, and pins that number as a CEILING. The
     scheme list is READ OUT OF `bin/Mathc.ml` on every run - the
     `canonical_verifier_schemes` and `canonical_verifier_prefixes`
     bindings - and is never copied into the fixture. If the
     bindings cannot be read, the fixture says "unknown" and exits 3:
     a fixture that cannot tell a check from a declaration must not
     report a number, least of all a zero.

  2. `tests/fixtures/relation-targets-resolve.sh` measures how many
     relation targets in the live corpus resolve to neither a decision
     id nor an existing file, and pins that number as a CEILING. The
     relation kinds are READ OUT OF `schemas/decision.json` and the
     rule for what a decision IS is READ OUT OF `lib/memory.ml`
     (`non_decision_schema_prefixes`); neither is copied. The
     resolution rule - how a target string is split into a reference,
     a revision and a fragment, and how a path form differs from an
     id form - is written down in the fixture, because the kernel has
     no such rule to read.

  3. The two instruments each report the two forms of the defect
     SEPARATELY. A path form (`archive/decisions/foo.yaml`) breaks
     when a file moves; an id form (`foo@1`) breaks when a decision is
     archived or renamed under a new id. The remedy is different in
     each case, so one number for both would hide the remedy.

  4. The scheme instrument CROSS-CHECKS ITSELF against the kernel: it
     asks `mathc validate` over the same corpus how many
     MC-VERIFIER-SCHEME-UNKNOWN it emits, and REFUSES to conclude
     when the two counts differ. It reports "unknown" and exits 3
     then. A fixture that classifies differently from the thing it
     censuses measures the wrong thing, and this one says so instead
     of picking a winner.

  5. Each number is a CEILING. It may FALL and may never RISE.
     Raising one is an explicit, reviewable edit of the fixture, with
     the reason written down beside it.

  6. Each instrument has a NEGATIVE CONTROL: a synthetic corpus that
     exceeds the ceiling must be reported as over it, and a synthetic
     corpus whose targets all resolve must measure zero. A bound that
     has never been observed to bind is not known to bind, and a lint
     that flags everything is not a lint.

  7. Each instrument has an UNKNOWN CONTROL: with the vocabulary
     unreadable, the measurement must report "unknown" and exit 3,
     never zero and a pass.

  8. Exit codes follow the house convention: 0 measured and held, 1
     measured and broken, 3 nothing was measured - unknown, not pass.

  9. These instruments are NOT YET A GATE. They are the form a gate
     will take when the ceilings reach zero; the debt they measure is
     paid by tranche T2.2 (the relation targets) and T2.3 (the quote-
     broken verifiers) of the plan. When the ceilings are zero, this
     decision is revisited to say so.


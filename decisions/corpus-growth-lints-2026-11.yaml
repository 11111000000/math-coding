counterexample: |
  Four counter-positions. The first is the one that matters, and it
  is not fully rejected.

  (a) "THIS IS THE CENSUS AGAIN, WITH THE NUMBERS SPLIT. The census
  already measures a quote-broken verifier count and a dangling
  relation count; these two fixtures measure them again." PARTLY
  TRUE, and the duplication is real: the census's QUOTED and DANGLING
  are PROXIES of exactly these two classes. Measured against this
  corpus, the two instruments and the census agree on the SIZE and
  disagree on the SET, and the disagreements are where the census is
  loose:

    - The census's QUOTED (5) counts raw verifier strings that BEGIN
      with a quote. It cannot tell a quoting ACCIDENT from a sound
      double-quoted string: two of its five are sound - the closing
      double quote survives and the reader strips it - so the census
      counts two obligations that the kernel executes perfectly well.
      And it cannot see the three offenders that are not quoting
      accidents at all (`mathc-self-check-verdict-pass` twice,
      `mathc-validate` once): a bespoke scheme is not a quote.
      This instrument counts the CONSEQUENCE (the kernel cannot execute
      the string), which is five obligations and six strings.

    - The census's DANGLING (44) and this instrument's DANGLING (44)
      are the same size and NOT the same set. They share 41 entries.
      The census has three this instrument does not count as
      dangling: `addresses: A1` and `addresses: A3` (they resolve to
      an AXIOM, and they have their own ceiling here), and
      `addresses: ROADMAP.md#process-principles-binding-on-all-agents`
      (the census reads the whole target as an id; the file ROADMAP.md
      exists). This instrument has three the census cannot see: two
      under `refines`, a relation kind the schema declares and the
      spec names and the census's key list omits, and one
      (`attestation-store-fill@2::ci-block-set`) whose DECISION
      exists and whose OBLIGATION inside it does not.

    The difference that matters is not the number. It is what each
    instrument is FOR. The census is a REPORT over six numbers, read
    by the orchestrator, and it has no moment at which it becomes
    blocking. These two are CEILINGS: a direction a program compares,
    each with a written resolution rule, a vocabulary read from the
    code, and a negative control that has been observed to bind. When
    the ceilings reach zero, they can become a gate; the census has no
    such moment, because it measures six things at once and none of
    the six is a rule.

    AND THE HONEST PART: if the corpus ever has to choose, ONE of the
    two numbers must go, and it should be the census's DANGLING and
    QUOTED - they are the two this pair covers more precisely. This
    is recorded here so the choice is made on purpose and not by
    accident after both numbers have been quoted in two places.

  (b) "A CEILING OF 44 CANNOT BLOCK ANYTHING FOR EIGHTEEN MONTHS, SO
  IT IS A RED LIGHT THAT TEACHES THE READER TO IGNORE RED LIGHTS."
  Rejected on the same grounds as the six ceilings the corpus already
  carries: a ceiling that may only fall is a DIRECTION, not a gate.
  Its job today is to make the number visible and to make its growth
  loud; the job of blocking arrives when the number is zero, and the
  plan that pays the debt (T2.2, T2.3) is written down. And if the
  plan does NOT pay the debt, the honest outcome is that this
  decision was wrong and the ceiling should be REMOVED - not raised.

  (c) "A FIXTURE PER CLASS IS TOO MUCH MACHINERY." Rejected: the
  corpus already carries seven shell fixtures of this kind, and each
  one costs a file and one number. The cost that matters is a number
  nobody measures, and that cost is paid by every reader who has to
  open 139 files to find out what changed.

  (d) "THE FIXTURE OWNS A RESOLUTION RULE, AND A SECOND RULE DRIFTS
  FROM THE FIRST." True of the rule; the fixture answers it for the
  LISTS and not for the rule. The relation kinds are read out of
  `schemas/decision.json` and the non-decision families out of
  `lib/memory.ml`, and the scheme list out of `bin/Mathc.ml`: the
  fixture copies no list, so a list the kernel changes cannot leave
  the fixture behind. The RESOLUTION RULE - how a target string is
  split into reference, revision and fragment, and how a path form
  differs from an id form - has no counterpart in the kernel to read,
  so the fixture writes it down and pins it with a negative control.
  A future kernel rule must REPLACE that rule, not sit beside it.

antithesis: |
  The opposite claim is that the corpus's SHAPE is not this
  repository's business, that the five instruments that measure the
  STORE are enough, and that a lint whose debt the corpus cannot pay
  for a year is a red light that dulls the reader's eye rather than
  sharpening it.

  The claim identifies a real hazard - a repository accumulates
  instruments, and each one is a place where a future change can be
  blocked by a threshold nobody chose deliberately - and the answer is
  the one the other ceilings already give: a ceiling that may only
  fall is a direction, and the plan that closes the distance is the
  plan that pays it down. The alternative is the state this corpus
  was in - 44 relation targets and five unexecutable verifiers, with
  nothing anywhere saying so, for four weeks of growth.

  The claim also understates the second cost, which is the one that
  bites: an UNMEASURED number is not a neutral thing. Every audit of
  this corpus began by reading 139 files, because the corpus's shape
  was prose in a plan rather than a number a program could print. A
  lint that prints the number is cheaper than an audit that reads
  the files, and the two instruments together cost two files.

  What the claim gets right, and what this decision accepts, is the
  possibility that the instrument outlives its debt. When the
  ceilings reach zero, a lint that reports zero forever is an
  instrument with nothing left to say, and the honest move then is to
  retire it or to fold it into the gate - not to keep it running for
  the comfort of the reader who likes the line it prints.

risk:
  owner: human:maintainer
  declared_triggers:
    - "a ceiling is raised without a decision recording why"
    - "the corpus-count ceiling of the redundancy census is raised to accommodate this decision, because a decision that measures the corpus is in the corpus it counts"
    - "the resolution rule drifts from the kernel's own notion of a relation and the fixture's numbers become a lie nobody notices"
    - "the lint is read as a verdict on the quality of the commitments it counts, rather than on the state of the corpus"
    - "the corpus shrinks the numbers by archiving decisions whose obligations the gate still asks about"

assumptions:
  - id: the-kernel-scheme-list-is-the-authority
    state: assumed
    owner: human:maintainer
    statement: |
      The canonical verifier schemes are the ones the kernel's own
      `canonical_verifier_schemes` and `canonical_verifier_prefixes`
      bindings name, and "a scheme the kernel cannot execute" is
      decided by `known_verifier_scheme`. The instrument reads both
      bindings on every run and cross-checks its count against the
      kernel's own MC-VERIFIER-SCHEME-UNKNOWN diagnostic, so a change
      in the rule is noticed rather than absorbed.
    consequence_if_false: |
      The instrument would classify the corpus differently from the
      thing that executes it, and its number would be a number about
      something else. The cross-check is what catches that; if the
      cross-check stops running, nothing catches it.
    review_on:
      - signal: the-kernel-adds-a-verifier-scheme
      - signal: the-kernel-changes-how-a-scheme-is-read
  - id: the-relation-vocabulary-is-the-schema
    state: assumed
    owner: human:maintainer
    statement: |
      The relation kinds are the ones `schemas/decision.json` declares,
      and a document is a decision when it declares a top-level `id:`
      and its schema family is not one of the non-decision families
      `lib/memory.ml` names. Both are read from their source on every
      run, so the corpus's own rule about what a decision is stays in
      one place.
    consequence_if_false: |
      The instrument would resolve targets against a vocabulary the
      kernel does not use: a relation the kernel ignores would be
      counted, and a relation the kernel honours would not be. The
      number would then be a number about the fixture's idea of the
      corpus.
    review_on:
      - signal: the-schema-changes-the-relation-block
      - signal: the-kernel-learns-to-resolve-a-relation-target
  - id: a-reference-to-nothing-is-a-defect
    state: assumed
    owner: human:maintainer
    statement: |
      A relation that names nothing is a defect worth bounding rather
      than a style to be tolerated, and a verifier the kernel cannot
      execute is a promise the corpus cannot keep. Both are claims
      about things the corpus has, and the corpus does not have them.
    consequence_if_false: |
      The two ceilings would be pinning a quantity nobody considers
      worth fixing, and the instruments would be the sixth and seventh
      red lights - the failure mode the antithesis above names. The
      remedy is to remove the instrument, not to raise the ceiling.
    review_on:
      - signal: a-ceiling-is-raised-without-a-reason
      - signal: the-plan-does-not-pay-the-debt


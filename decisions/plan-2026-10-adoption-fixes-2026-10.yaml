reversal:
  - signal: plan-superseded
    condition: |
      A successor `plan-2026-11-adoption-fixes-2026-10` or
      similar is recorded with `supersedes:
      [plan-2026-10-adoption-fixes-2026-10@1]`. Migration
      path: every still-open sub-decision is either closed
      under the successor or recorded as waived.
    action: rework
  - signal: sub-decision-reverted
    condition: |
      Any of the 10 sub-decisions is reverted in `git log`
      after the plan closes. The plan's corresponding
      obligation is moved to `state: archived` (not deleted)
      with a `reversal_note:` field recording the reverted
      sub-decision's SHA.
    action: archive-obligation
  - signal: b1-rename-rejected
    condition: |
      Downstream fixtures assert on `verdict: accept` and the
      rename to `parse-ok` cannot be coordinated. Resolution:
      revert B1's rename; keep the new `mathc verify`
      subcommand but do not rename `validate`'s verdict.
    action: rework
  - signal: kernel-regression
    condition: |
      Any sub-decision regresses the mathc self-check verdict
      on main (introduces a new unknown subject, or flips a
      pass to unknown). Resolution: revert the offending
      sub-decision; the plan's corresponding obligation moves
      to `state: archived`.
    action: halt


obligations:
  - id: producer-rule-pinned-by-tests
    outcome: identity-must-declare-a-class
    claim: |
      The Alcotest suite pins both rules: an untagged identity is
      rejected, a `human:` runtime claim without a run is rejected,
      a named run is accepted, `run: ""` is not a run, `human:` on
      `kind_: review` is accepted, and `ci:`/`agent:` producers are
      untouched. The suite also walks the live store and fails if any
      class-tagged identity in the corpus is rejected by the kernel.
    acceptance:
      all:
        - verifier: tests/producer_vocab.ml::test_untagged_identities_are_not_classes
          result: pass
        - verifier: tests/producer_vocab.ml::test_human_runtime_kind_needs_a_run
          result: pass
        - verifier: tests/producer_vocab.ml::test_human_review_needs_no_run
          result: pass
        - verifier: tests/producer_vocab.ml::test_every_tagged_corpus_identity_is_accepted
          result: pass

  - id: positive-and-negative-fixtures
    outcome: human-runtime-claim-must-be-anchored
    claim: |
      The conformance suite carries a positive and a negative fixture
      for each rule:
      `positive-human-review.json` and
      `positive-human-runtime-anchored.json` are accepted;
      `negative-untagged-producer.json` and
      `negative-human-runtime-unanchored.json` are rejected.
      I13 fixture coverage requires a pair per kernel-enforced MUST.
    acceptance:
      all:
        - verifier: tests/conformance.ml
          result: pass
        - verifier: file-exists
          path: fixtures/conformance/attestation/negative-untagged-producer.json
          result: pass
        - verifier: file-exists
          path: fixtures/conformance/attestation/positive-human-runtime-anchored.json
          result: pass

  - id: corpus-remains-loadable
    outcome: grandfathered-not-rewritten
    claim: |
      All 765 tracked attestations still parse and load, and no file
      under `attestations/` is touched by this change. The grandfathered
      backlog is measured and pinned, so it cannot drift unnoticed.
    acceptance:
      all:
        - verifier: tests/producer_vocab.ml::test_grandfathered_backlog_is_pinned
          result: pass
        - verifier: tests/store_admission.ml
          result: pass

  - id: the-limit-is-recorded
    outcome: the-gap-is-stated-not-papered
    claim: |
      The unverifiability of a `human:` tag is recorded as an
      explicit `unknown` assumption with an owner, a consequence-if-false
      enumeration, and a review signal -- and both new diagnostics
      carry `mathc explain-diagnostic` entries that say so.
    acceptance:
      all:
        - verifier: scripts/dev ready
          result: pass

  - id: no-verdict-change
    outcome: verdicts-unchanged
    claim: |
      Gate, self-check and assess verdicts are unchanged: both
      validators are reached only from `mathc validate`.
    acceptance:
      all:
        - verifier: scripts/dev ready
          result: pass

reversal:
  - signal: first-signed-attestation-committed
    condition: |
      The first attestation carrying a real DSSE `signature` block
      with a `key_id` lands in the store. At that point a key
      registry exists and a `human:` claim can be checked against a
      key class rather than merely shaped.
    action: rework
    recovery: |
      Promote `identity-must-declare-a-class` from "the claim is
      well-shaped" to "the claim is bound to a key whose class is
      human", keep rule (b) for producers with no signature, and
      re-triage the 58 grandfathered files as a possible integrity
      incident rather than a labelling debt. The assumption
      `human-tag-is-not-verifiable` flips out of `unknown` at that
      point and its consequence list is executed in full.

  - signal: adopters-cannot-emit-a-tagged-identity
    condition: |
      A brownfield adopter's existing tooling writes `producer.identity`
      values with no class tag and cannot be changed without rewriting
      their evidence store.
    action: rework
    recovery: |
      Relax `MC-PRODUCER-CLASS-UNDECLARED` from Block to Warn and keep
      MC-PRODUCER-HUMAN-UNANCHORED at Block. Rule (b) is the one that
      closes the upgrade path; the class tag is hygiene, and hygiene
      is the right thing to relax first.

  - signal: verifier-execution-coverage-regresses
    condition: |
      Executable-verifier coverage falls back below its post-9c1f7ab
      level of 860 of 1504, so a named `producer.run` is recorded but
      rarely executed.
    action: rework
    recovery: |
      Rule (b) becomes ceremony. Either restore coverage or demote
      MC-PRODUCER-HUMAN-UNANCHORED to Warn and record in this
      decision's assumptions that the anchoring requirement is
      declarative only.

intent:
  source: "issue:the-store-claims-passes-nobody-checked-2026-10-25"
  text: |
    Make the store say WHO produced each attestation, in a vocabulary a
    reader cannot misread, and stop a machine from signing its own work
    with a person's name.

    `schemas/attestation.json` declared `producer.identity` as
    `{"type": "string"}`. That is not a weak constraint, it is no
    constraint: the one distinction that gives an attestation its
    epistemic weight -- a human DECLARATION versus a machine
    OBSERVATION -- was neither expressed nor checkable, and the store
    actively violated the distinction it could not express.

    2026-11-01, REVISION 2: THE CENSUS BELOW IS A RECORD OF A STORE
    THAT IS NO LONGER IN THE TREE. The counts -- 765 attestations, 369
    `human:` identities, 90 of those demonstrably agent-produced, 62
    untagged, 58 unanchored, 0 signed -- were measured over the store as
    it stood on 2026-10-23. The store is not committed: `git ls-files
    attestations/**` returns 0 and `decisions/store-not-committed-2026-10.yaml`
    says why. A checkout carries no attestations at all, so the census
    has nothing to walk, and a number about files that are not here is a
    number about the past.

    The RULE did not move with the store, and the rule is what this
    decision is for. The two validators are still in the kernel, still
    dispatched only from `mathc validate` (the issuance path), still
    registered in `mathc explain-diagnostic`, and still pinned by the
    conformance fixtures and `tests/producer_vocab.ml`. What the
    revision replaces is the arithmetic: the promise is now about the
    validator and about the store that exists, not about a census of
    files that were deleted from the corpus.

commitment: |
  Two rules, both forward-only, enforced by the kernel and stated in
  the schema.

  (a) `producer.identity` must be `<class>:<subject>`, with `class`
      in {human, agent, ci}. An untagged identity names nobody, so a
      reader cannot tell a declaration from an observation without
      out-of-band knowledge of the producer's habits. Rejected as
      MC-PRODUCER-CLASS-UNDECLARED (Block).

  (b) A `human:` producer signing a RUNTIME kind must name
      `producer.run`. Rejected as MC-PRODUCER-HUMAN-UNANCHORED
      (Block).

  Rule (b) is deliberately ASYMMETRIC, and the asymmetry is the whole
  argument:

    - `human:` + `kind_: review` stays ALLOWED and unconstrained.
      Review is the WEAK class -- "a human declaration without a
      runtime anchor", the same exemption MC-MATERIALS-DIGEST-EMPTY
      grants for an empty `materials_digest`. An agent that falsely
      claims it upgrades nothing, because review evidence is already
      the weaker kind. There is no attack to defend against, so no
      rule is imposed. A rule here would forbid honest humans from
      recording a judgement they made from reading, which is the
      most common thing a maintainer does in this store.

    - `human:` + a runtime kind is the upgrade, and the upgrade is
      what `producer.run` blocks. Naming the run converts an
      unauditable claim into a falsifiable one: `mathc verify`
      executes the named command, so a producer whose run does not
      reproduce the recorded `materials_digest` is caught by a named,
      failing verifier rather than by an inspection nobody performs.

  The rules apply to ISSUANCE. The store loader
  (`lib/attestations/attestations.ml`) calls `Codec.parse_attestation`
  and never these validators, so an attestation that predates the rules
  stays loadable. That separation is deliberate and is the reason the
  rule could be adopted without rewriting anybody's evidence: see
  `outcomes/grandfathering-has-nothing-left-to-grandfather`.

antithesis: |
  "Rewrite the misattributed files. Correct the record, then add the
  rule so it cannot recur. `human:opencode-agent` becomes
  `agent:opencode-agent` and the store is honest again."

  Rejected, on a mechanical ground that survives inspection: an
  attestation `id` is the sha256 of the attestation's canonical body
  with the `id` field removed, and `producer.identity` is part of
  that body. Change the identity and the digest no longer matches. So
  "correcting" a committed file means RECOMPUTING its evidence
  identifier and rewriting a committed object -- minting new
  provenance for evidence nobody re-ran, which is the same class of
  unrequested mass mutation as the 9c1f7ab incident this decision
  exists to prevent. A correction that fabricates the identifiers of
  the thing it corrects is not a correction.

  The objection is now moot in the stronger sense: the files it names
  are no longer in the tree, so there is nothing left to rewrite. The
  reasoning is kept because the NEXT store will be written by a tool
  that could make the same mistake, and the objection is the reason
  the correction must not be a bulk rewrite when it does.

  Also rejected: "require a DSSE signature whose key_id is bound to a
  human key." That is the rule that would actually close the gap, and
  it is deferred, not dismissed -- the substrate has no key registry,
  no key class, and no trust anchor to check a `human:` claim against.
  Shipping the rule first would produce a store in which every
  attestation is rejected and no claim is discriminated. Tracked as the
  reversal signal `first-signed-attestation-committed`.

  Also rejected: "ban `human:` on `kind_: review` too, so no agent can
  ever claim to be human." Banning the class where a false claim
  costs nothing buys no safety and costs the store its most common
  and most legitimate record -- a maintainer saying they read
  something.

counterexample: |
  "This is a regex with a philosophy attached. A determined agent
  writes `human:p.b.kosov` and satisfies both rules -- rule (b) is
  met by naming any command at all. You have made a theatre of
  authorship."

  Counterargument: the objection is correct about the LIMIT and wrong
  about the DIRECTION. A JSON string cannot prove who typed it, and
  this decision does not claim otherwise; `assumptions/`
  `human-tag-is-not-verifiable` records that as an explicit `unknown`
  with its consequence enumerated, and both diagnostics say so in
  their own remediation text. What the rules do change is the
  DEFAULT and the ASYMMETRY:

    - before: `human:ada` and `human:opencode-agent` are the same
      string shape, indistinguishable to any reader and to any tool;
    - after: the unanchored shape is rejected at issuance, so the
      cheap forgery -- type a human name, assert a test passed -- now
      requires also naming a command that a later verifier executes,
      and naming a false command is a self-inflicted, detectable
      wound rather than a silent upgrade.

  A schema that makes the dishonest claim more expensive and more
  falsifiable is worth having even when it cannot make the claim
  impossible. What would make it impossible is key separation, and
  that is named above as deferred with a trigger, not glossed.

  "The grandfathering makes the rule decorative: the old files still
  violate it."

  Counterargument: the store loader deliberately does not run these
  validators, so every legacy file remains loadable, and the rule
  applies to issuance. That is not a loophole invented here to dodge
  the cost -- it is exactly the shape of the sibling rule shipped in
  `decisions/kernel-bugs-v3.4-2026-10`. The debt is not hidden: it is
  INVENTORIED in `outcomes/grandfathering-has-nothing-left-to-grandfather`
  and PINNED by `tests/producer_vocab.ml::`
  `test_grandfathered_backlog_is_pinned`, so if a file is quietly
  reissued or quietly added, a test fails and the inventory is
  visibly stale.

scope:
  paths:
    - "schemas/**"
    - "lib/**"
    - "bin/**"
    - "tests/**"
    - "fixtures/conformance/**"
    - "decisions/**"
    # In scope because this decision ADDS attestation files for its
    # own obligations. It modifies none: the outcome
    # grandfathering-has-nothing-left-to-grandfather pins that, and
    # the store walk in tests/producer_vocab.ml would fail if a
    # tracked file changed.
    - "attestations/**"
  exclusions:
    - "site/**"
    - "adoption/**"

outcomes:
  - id: identity-must-declare-a-class
    statement: |
      `mathc validate` rejects an attestation whose
      `producer.identity` does not match
      `^(human|agent|ci):[A-Za-z0-9][A-Za-z0-9._:/-]*$`, with code
      MC-PRODUCER-CLASS-UNDECLARED and severity block. The rule
      constrains ISSUANCE without invalidating anything the store
      already uses, because the store loader never runs the validator
      and the store itself is not committed to the tree.

  - id: human-runtime-claim-must-be-anchored
    statement: |
      `mathc validate` rejects an attestation with a `human:` identity,
      a runtime `kind_`, and no non-empty `producer.run`, with code
      MC-PRODUCER-HUMAN-UNANCHORED and severity block. It ACCEPTS the
      same identity on `kind_: review`, and accepts `run: ""` nowhere.

  - id: grandfathering-has-nothing-left-to-grandfather
    statement: |
      No file under `attestations/` is modified by this decision, and
      there is nothing in the tree to modify: the store is not
      committed (`git ls-files attestations/**` returns 0; see
      `decisions/store-not-committed-2026-10.yaml`), and the store
      loader (`lib/attestations/attestations.ml`) calls
      `Codec.parse_attestation` and never these validators -- the same
      separation the sibling MC-MATERIALS-DIGEST-EMPTY rule uses. The
      legacy backlog is therefore not a corpus in this repository; what
      is pinned instead is the backlog the CURRENT sweep produces: no
      untagged identity and no `human:` producer on a runtime kind
      among the attestations this tree's sweep emits, checked by
      `tests/producer_vocab.ml::test_grandfathered_backlog_is_pinned`.

  - id: the-gap-is-stated-not-papered
    statement: |
      The decision records as an explicit `unknown` that a `human:`
      tag cannot be verified, enumerates the consequence, and names the
      substrate change (key separation) that would close it,
      together with the reversal signal that would trigger it. No
      diagnostic and no schema text asserts that a `human:` tag is
      true.

  - id: verdicts-unchanged
    statement: |
      No gate, self-check, or assess verdict changes. Both validators
      are dispatched only from `mathc validate`; `bin/Mathc.ml::`
      `do_self_check` and the gate path load the store through
      `Attestations.load` and never call them, which is verified by
      grep for the call sites rather than asserted.

axiom_link:
  - A0
  - A1
  - A3

assumptions:
  - id: human-tag-is-not-verifiable
    state: unknown
    epistemic_marker: unknown
    statement: |
      Nothing in this repository can establish that a `human:` identity
      was typed by a person. No attestation in this repository carries
      a `signature` block -- the store is not committed at all -- so
      there is no key_id, no key registry, and no trust anchor to
      compare a claim against. The schema constrains the SHAPE of the
      claim and forces the runtime anchor to be named; it does not and
      cannot authenticate the claim.
    owner: human:maintainer
    consequence_if_false: |
      If this unknown is wrong -- if some out-of-band mechanism does
      bind identities to humans -- then (1) the misattributed files
      of 2026-10 are a live integrity incident rather than a labelling
      debt, and the investigation belongs in the security track, not
      here; (2) rule (b) is a weaker duplicate of that mechanism and
      should be relaxed to avoid double-penalising honest producers;
      (3) the legacy backlog should be re-triaged as tampering.
      None of the three is derivable from this repository, which is
      precisely why the marker is `unknown` and not `judgment`.
    review_on:
      - signal: first-signed-attestation-committed
        date: "2026-10-23"
  - id: anchored-claims-are-more-auditable-than-unanchored
    state: assumed
    epistemic_marker: hypothesis
    confidence: 0.75
    statement: |
      Requiring `producer.run` on a `human:` runtime claim raises the
      cost of the cheap forgery (name a person, assert a test passed)
      because the claim now names a command that `mathc verify`
      executes. It does not make forgery impossible, and the residual
      risk is an agent that names a real command whose output does not
      in fact justify the recorded result.
    owner: human:maintainer
    consequence_if_false: |
      If naming a run changes nothing about what gets caught -- if
      verifiers are skipped or ignored in practice -- then rule (b)
      is ceremony and the store is no better off than before, except
      that it now records a run string it never checks. The coverage
      that decides this is measured elsewhere and moves: the
      executable-verifier census of 2026-10-23 read 860 of 1504
      obligations executable (57.2%), and the population where this
      assumption is weakest is the remaining Skipped set.
    review_on:
      - signal: verifier-execution-coverage-regresses
        date: "2026-10-23"


assumptions:
  - id: junit-input-is-malformed-tolerant
    state: revised
    statement: |
      The kernel's expected contract is that any string input
      to a parser produces a typed `Parse_error` (or a
      `Diagnostic.t`), never an uncaught `Invalid_argument`
      from stdlib. This is the contract the rest of the parser
      suite (`lib/jsonl.ml`, `lib/codec.ml`) honours; the
      junit adapter now matches.
    owner: human:maintainer
    consequence_if_false: |
      If the kernel ever adopts a "fail-fast on invalid input"
      policy that exposes stdlib exceptions at the boundary,
      the §11.23 fix becomes a deliberate choice rather than
      a correctness fix. The decision stays correct under that
      reading; the wording in §9.3 is the place to update.
    review_on:
      - signal: fail-fast-policy-adopted

reversal:
  - signal: junit-adapter-replaced
    condition: |
      The JUnit XML adapter is replaced by a different
      implementation (e.g. `lib/junit_yojson.ml` using yojson
      for entity decoding). The trap entry stays; the
      reference location moves.
    action: rework

  - signal: stdlib-string-sub-becomes-total
    condition: |
      A future OCaml release makes `String.sub` total (does
      not raise `Invalid_argument` at the boundary) and instead
      returns a truncated substring. The §11.23 trigger is
      retired.
    action: retire


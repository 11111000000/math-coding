outcomes:
  - id: junit-entity-off-by-one-fixed
    statement: |
      The five entity-reference branches in
      `lib/junit/junit.ml:74-90` use the correct boundary check
      `i + N <= len` for the read length N. The typed
      `Junit.Parse_error` is raised for truncated entity references
      rather than `Invalid_argument`.

  - id: regression-pinned
    statement: |
      `tests/junit_test.ml` is registered in `tests/dune` and runs
      8 cases (5 entity decode + 2 §11.23 boundary + 1 sanity).
      Reverting the fix in `lib/junit/junit.ml` causes the two
      §11.23 cases to fail with "expected typed Parse_error, got
      Invalid_argument (off-by-one)"; restoring the fix re-passes
      them.

  - id: trap-log-updated
    statement: |
      `OCAML_BEST_PRACTICES.md §9.3` records the `String.sub`
      boundary rule and `§11.23` is a new trap entry with the
      historical instance, the fix, the repro, and the trigger
      list.

counterexample: |
  "Junit XML reports always close attribute values with `\"`,
  so the truncated-entity boundary is never reached in practice.
  The fix is a theoretical change with no real impact." Counter-
  argument: the bug is reachable from any malformed JUnit input
  (truncated file, partial write, transport error). When it
  triggers, the kernel crashes with `Invalid_argument` instead
  of reporting a parse error. The conformance runner's
  `mathc attest` command would propagate the crash, exit
  non-zero, and lose the structured diagnostic that other
  malformed inputs receive. The fix is small and mechanical;
  the value is closing a robustness hole, not a hot-path
  improvement.

  "Why not wrap the call in a `try ... with Invalid_argument ->
  Parse_error` block instead of fixing the boundary?" Counter-
  argument: that masks the underlying defect, not just at this
  one call-site but as a permission to write the same off-by-one
  in other parsers. The boundary-fix is local, well-typed, and
  reviewed by the new `§11.23` trap.


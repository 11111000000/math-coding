intent: |
  Fix the off-by-one in `lib/junit/junit.ml:parse_attr_value`: the
  five entity-reference branches (`&amp;`, `&lt;`, `&gt;`, `&quot;`,
  `&apos;`) had the boundary check `i + (N-1) <= len` paired with
  `String.sub s i N`. At the exact boundary `len - i == N - 1`,
  the check passed and `String.sub` raised `Invalid_argument`,
  escaping the typed `Junit.Parse_error` layer.

  This decision records:
    1. The mechanical fix (5 one-character edits in
       `lib/junit/junit.ml`).
    2. A regression test (`tests/junit_test.ml`) that asserts the
       typed `Junit.Parse_error` is raised, not `Invalid_argument`.
    3. A new rule in `OCAML_BEST_PRACTICES.md §9.3` and a new
       trap entry (§11.23) so the pattern does not regress.

  This decision is RESOLVED (kernel change shipped, all four
  verifiers pass at HEAD). It is the canonical record of the
  2026-10-07 fix cycle; future traps of the same shape (§11.23
  trigger list) should be filed as separate decisions.

commitment: |
  Three deliverables:

    D1. `lib/junit/junit.ml:74-90` (entity-reference branches in
        `parse_attr_value`) updated so the boundary check equals
        the read length, not read length minus 1. Specifically:
          - `&amp;`:  `i + 5 <= len` (was `i + 4 <= len`)
          - `&lt;`:   `i + 4 <= len` (was `i + 3 <= len`)
          - `&gt;`:   `i + 4 <= len` (was `i + 3 <= len`)
          - `&quot;`: `i + 6 <= len` (was `i + 5 <= len`)
          - `&apos;`: `i + 6 <= len` (was `i + 5 <= len`)

    D2. `tests/junit_test.ml` is a new Alcotest executable that
        covers:
          - 5 entity-decode cases (`amp`, `lt`, `gt`, `quot`, `apos`)
          - 2 `trap_§11_23` boundary cases (truncated entity at
            the buffer end must produce typed `Junit.Parse_error`,
            not `Invalid_argument`)
          - 1 sanity case (token count for a simple XML fragment)
        The executable is registered in `tests/dune` and the
        `mathcoding_junit` library is added to the `(libraries …)`
        stanza.

    D3. `OCAML_BEST_PRACTICES.md` updated:
          - §9.3 adds a "New rule (post-§11.23, 2026-10)" paragraph
            stating the `String.sub` boundary convention.
          - §11.23 is a new trap entry (Real instance) pinning the
            historical location of the bug and the regression.

  Boundaries:
    - This decision does NOT introduce a new runtime dep —
      `lib/junit/` is stdlib-only.
    - This decision does NOT touch the main `mathcoding_core`
      library; the change is in the `mathcoding_junit` sub-library.
    - This decision does NOT bump the nixpkgs revision.


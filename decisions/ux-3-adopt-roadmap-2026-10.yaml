assumptions:
  - id: brownfield-clients-active
    state: assumed
    statement: |
      arc42, MADR, and adr-tools are all in active use in
      the project ecosystem (the original ux-3 ТЗ cited
      this as the adoption bottleneck). The Phase-3 work
      is real, not speculative.
    owner: human:maintainer
    consequence_if_false: |
      If brownfield adoption turns out to be rare, the
      Phase-3 work is still useful (any project with
      existing ADRs benefits from the auto-import), but
      the priority drops. Resolution: defer to a later
      phase if Q3-Q4 2027 telemetry shows <5% of new
      adopters hitting the brownfield path.
    review_on:
      - signal: brownfield-adoption-rate-low
  - id: separate-subcommand-wins
    state: assumed
    statement: |
      A separate `mathc adopt` subcommand is the right
      surface for brownfield, NOT an extension of
      `mathc init --merge`. The user confirmed this in
      Q2 ("реальные, делай качественно"). The three
      sub-decisions are scoped around this shape.
    owner: human:maintainer
    consequence_if_false: |
      If a future maintainer decides `mathc init --merge`
      is the right shape, the three sub-decisions are
      rescoped: detection becomes a private helper, the
      command becomes a flag, the integration test
      becomes a flag test.
    review_on:
      - signal: design-shape-changed


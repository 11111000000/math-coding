risk:
  owner: human:maintainer
  declared_triggers:
    - "if a new decision's file name differs from its id and the walk is not the single source of the path, the capsule or `mathc explain` will again resolve by a guessed name"
    - "if the project-strings file is deleted, the book silently drops from the capsule and the axiom inference falls back to A0, and nothing says so"
    - "if the rendered diagnostic citations are made portable in a tranche that does not own tests/cli/, `dune build @runtest` breaks in a clean build"
    - "if the schema namespace or the bootstrap-v3 id is 'cleaned' away as a project name, the protocol's wire format and blank-form id break"
    - "if the legacy layout convention is moved to a config, pre-3.4 projects stop working without a config edit"

assumptions:
  - id: the-legacy-layout-is-protocol-not-project
    state: assumed
    owner: human:maintainer
    statement: |
      The pre-3.4 layout (a decisions directory, an attestations
      directory, and a master policy named "decision.yaml" inside the
      decisions directory) is a protocol convention shared by every
      pre-3.4 project, not a name of this repository's files. The
      backward-compat contract — a brownfield project works with no
      config edit — depends on it staying in the kernel.
    consequence_if_false: |
      If the legacy layout were this repository's own, deriving the
      master-policy path from the legacy directory and the protocol's
      filename would not be enough — the kernel would still know the
      project's names, and the fixture's grep would be the wrong
      instrument. The legacy paths would have to move to the project,
      and the "no config edit" contract would need a new owner.
    review_on:
      - signal: a-pre-3-4-project-stops-working-without-a-config

  - id: the-rendered-citations-are-another-tranches-cut
    state: assumed
    owner: human:maintainer
    statement: |
      The diagnostic message strings and the explain registry are
      pinned by tests/cli/ cram fixtures, and those fixtures are the
      acceptance surface of the book-rename tranche and T5.2. Making
      those citations portable is their work, not T4.3's.
    consequence_if_false: |
      If T4.3 was expected to move the rendered citations too, this
      decision is incomplete, and the missing work is the book's
      tranche, which owns both the strings and the fixtures that pin
      them.
    review_on:
      - signal: the-book-rename-tranche-is-retired-without-moving-the-rendered-citations

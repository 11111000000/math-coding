schema: math-coding/3.3
id: re-evaluation-is-not-a-check
revision: 1
state: active
mode: light
body_sha: "sha256:783cb65f1c1a14d95ea039024d6bccf655d92deee709036e5cd26cc55966948a"
yaml_sha: "sha256:783cb65f1c1a14d95ea039024d6bccf655d92deee709036e5cd26cc55966948a"
intent: |
  Stop the re-evaluation oracle from writing evidence it never
  gathered.

  `mathc re-evaluate-decisions AXIOM` re-reads each decision and asks
  whether its claim CONTRADICTS an axiom. It never executes the
  obligation's verifier. It wrote one attestation per obligation
  anyway, and wrote them in the shape of a machine-grade pass:
  `kind_: test`, `result: pass`, an empty `materials_digest` (the
  freshness wildcard) and no `producer.run`. Measured on 2026-10-26:
  88 of them, carrying a `result` that was the oracle's word
  "compatible" -- "this decision's claim does not contradict A0" --
  which is a different proposition from "the check passed".

  This is the same laundering the v3.7.3 cycle removed from the
  `Manual_decl` arm, one function over. The corpus's own words for
  the old state: "the 763 passes were signatures without evidence".
axiom_link:
  - A0
  - A2
commitment: |
  `mathc re-evaluate-decisions` writes a REVIEW.

  1. `kind_` is `review`, not `test`. A re-evaluation is a judgement
     about a decision, not the execution of a check.
  2. `result` is `inconclusive`, not `pass`. "Not contradicted" is
     not "the check passed", and a review that did not run the check
     has nothing to report but its own name.
  3. `producer.run` names the command that produced the record --
     `mathc re-evaluate-decisions <axiom>` -- so the record is
     anchored and re-runnable, and so that the difference between
     this producer and a producer that actually ran something is
     visible in the store instead of inferred.

  The verdict the command PRINTS is unchanged: the re-evaluation
  oracle still answers `compatible` / `incompatible` / `stale_claim`
  for the decision. What changes is the KIND of EVIDENCE it files.
  A reader asking "did the check pass?" now gets "no"; a reader
  asking "does this decision contradict A0?" still gets the oracle's
  answer, in the command's output and in the `re_eval_verdict` field.

  MEASURED: the store no longer contains any machine-grade `pass`
  written by this producer. The 88 that did are gone from the disk.
outcomes:
  - id: the-oracle-files-a-review
    statement: |
      `mathc re-evaluate-decisions` files `kind_: review`,
      `result: inconclusive`, with `producer.run` naming the command.
scope:
  paths:
    - "bin/Mathc.ml"
    - "tests/cli/re-evaluate-decisions.t"
    - "tests/cli/evidence-class.t"
  exclusions:

counterexample: |
  (a) "The re-evaluation verdict IS evidence: the oracle read the
  decision and checked its claim against the axiom, and a decision
  whose claim contradicts A0 is a failure." Rejected on the class,
  not on the substance. The oracle's answer is about the decision's
  CLAIM; the obligation's verifier is about the property the
  decision PROMISED. They are different questions, and a machine-grade
  class on the answer to the first one claims that the second one
  was tested. The claim being checked is not the check.

  (b) "Write it as `kind_: review, result: pass` -- a human (or an
  agent) reviewed the decision and found it consistent." Rejected:
  the reviewer is a rule, not a person. It cannot be re-run by
  someone who wants to disagree, and `result: pass` would say the
  obligation was satisfied, which nothing established. `inconclusive`
  says exactly what happened: the oracle looked, and the answer is
  not a check.

  (c) "Leave the producer alone and close the hole in the GATE
  instead: a machine-grade pass must name its run." That is the
  stronger fix and it is NOT yet landed -- it broke a pre-existing
  fixture whose hand-written evidence carries a machine class and no
  run, and the cause was not root-caused before the budget for this
  cycle ran out. The producer fix is what is landed, and it closes
  the path by construction: this producer can no longer emit a
  machine-grade pass at all, whatever the gate does with one. The
  gate rule is the next step, and it is stated here so it is not
  forgotten.
antithesis: |
  The opposite claim would be that a re-evaluation is a legitimate
  producer and the kernel should simply read its verdict: the oracle
  exists, it is deterministic, it answers a real question, and a
  store that carries its answers is more informative than one that
  does not.

  That claim is right about the oracle and wrong about the store.
  The oracle's answer is a property of the DECISION; the store's
  contents are claims about the OBLIGATION. Filing the first under
  the second is the promotion the constitution's Epistemic
  Separation forbids: "A result MUST NOT be promoted to a stronger
  class without an artifact establishing that class". The
  re-evaluation produced no artifact about any obligation's
  verifier. It produced an artefact about a claim.

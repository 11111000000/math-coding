axiom_link:
  - A0
  - A3

intent: |
  Add a `mathc doctor [--json]` subcommand that prints a
  diagnostic report on the user's math-coding install. The
  report is the "is your install healthy?" view that D1-D5
  (install + PATH + libc + SHA256SUMS + winget) commit to
  keeping healthy. The user runs it once after install, once
  when something goes wrong, and once before opening a
  bug report.

  Today's surface has no first-class way to ask
  "is `mathc` reachable from a fresh shell?", "is there a
  newer tagged release?", "does my decision file parse
  against the live schema?", or "are there orphan decision
  files with no attestations?". Each of these is answered by
  either a hand-crafted shell command (`which mathc`,
  `ls ~/.local/bin/`, `curl https://api.github.com/...`) or
  by reading the source. The doctor subcommand consolidates
  them into one CLI call that exits 0/1 with a
  per-section verdict.

  The implementation is constrained to `bin/Mathc.ml` (the
  CLI surface); no `lib/decision.ml` or verifier is touched.
  Kernel changes are confined to a new `do_doctor` function
  and the dispatcher's `|"doctor" -> do_doctor ()` arm; the
  helper module `Mathc_cmd.Doctor` is not introduced because
  `bin/Mathc.ml` is a single-module binary and
  `lib/decision.ml::sha_match_check` / `lib/gate.ml` are
  pure — the doctor reuses `Attestations.load`,
  `list_decision_files`, `extract_top_level_id`, and the
  existing `validate_with_counts` family without modification.

  The seven sections are independent; each section's verdict
  is determined locally. JSON output uses the same
  `{"sections":[…]}` envelope that `mathc counters` already
  uses (see `bin/Mathc.ml::do_counters` and the
  counters-schema-introspection-fix cram test). Exit code
  follows the kernel contract: 0 when every section is
  `pass` or `warn` (skip / off), 1 when any section is
  `fail`.

commitment: |
  - `mathc doctor` exits 0 with at least 5 sections printed
    (install, path, latest, config, decisions — minimum
    coverage per plan-2026-10-distro-friction@1 obligation
    d10-mathc-doctor-subcommand); exits 1 if any section is
    `fail`, with the failing section labelled in the
    output.
  - `mathc doctor --json` prints the same report as a
    structured object: `{"sections": [{"id": …, "verdict":
    "pass"|"warn"|"fail", "details": {…}}, …]}`. The
    `sections` array length is >= 5 (the offline sections,
    even when the GitHub probe is offline).
  - Section (g) `self-check` short-circuits when
    `mathc self-check` is callable from the project root;
    otherwise it is reported as `skip` with a reason. This
    keeps `mathc doctor` fast (< 5 s on a healthy install)
    and avoids re-running the full attestation-store walk.
  - The implementation lives entirely in `bin/Mathc.ml`;
    no `lib/` file is touched, no `bin/mathc_mcp.ml` is
    touched, no `scripts/install-tooling/{install.sh,
    install.ps1}` is touched. Reversible in one commit.


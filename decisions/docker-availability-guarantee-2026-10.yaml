outcomes:
  - id: edge-tag-published-on-main-push
    statement: |
      `ghcr.io/11111000000/mathc:edge` exists and is
      updated on every push to `main` and every release
      tag push. The tag resolves to the multi-arch
      `linux/amd64,linux/arm64` manifest built from
      `Dockerfile.debian-slim` with the current `VERSION`
      build-arg. The tag is cosign-signed via the existing
      `cosign-sign` job.
  - id: install-sh-docker-fallback-mode
    statement: |
      `scripts/install-tooling/install.sh --docker-fallback`
      prints the `docker run` invocation on a recoverable
      native-install failure, when `docker` is present on
      the host. Default-off so the existing UX is preserved.
      The flag is documented in `--help`.
  - id: docker-image-healthcheck-runs
    statement: |
      `.github/workflows/docker-healthcheck.yml` runs on
      a daily cron AND on every push to `main`. The job
      pulls `:edge`, runs `mathc version`, and records an
      attestation at
      `attestations/docker-availability-guarantee-2026-10-
      docker-image-healthcheck.json`.
  - id: docker-alpine-image-published
    statement: |
      `Dockerfile.alpine` builds `mathc-linux-x86_64-musl`
      (the release asset wired by this decision) into an
      `alpine:3.20` runtime stage. The resulting image is
      published to
      `ghcr.io/11111000000/mathc:<VERSION>-alpine` and
      `:edge-alpine` on every release tag push.
  - id: install-docs-fallback-hierarchy
    statement: |
      `USAGE.md`, `QUICKSTART.md`, and
      `site/install.{md,ru.md,zh.md}` present Docker as
      the fallback of last resort, with a one-line recipe
      that the user can run when the native install fails.
      The framing replaces the previous equal-weighting of
      the four channels.
  - id: future-work-recorded
    statement: |
      Three follow-up obligations are recorded as
      `relations.addresses-future`: a mirror policy
      (docker.io fallback when ghcr.io is blocked), a
      retention policy (`:latest`, `:edge`, last 5
      `:VERSION`), and an `--auto-fallback` mode (silent
      docker-pull+exec on native install failure). Each
      is named with a reversal signal so a future agent
      encountering the gap finds the record.


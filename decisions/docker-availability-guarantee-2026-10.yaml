reversal:
  - signal: docker-channel-deprecated
    condition: |
      All four install channels are deprecated and replaced
      by a single distribution mechanism (e.g., the project
      moves to a language-specific package manager and the
      Docker image is no longer a fallback).
    action: rework
  - signal: registry-compromise
    condition: |
      `ghcr.io/11111000000/mathc` is compromised or
      permanently blocked (corporate firewall, GitHub
      Packages outage of indefinite duration). The mirror
      policy follow-up obligation closes the path; the
      decision is retired once the mirror ships.
    action: rework
  - signal: cosign-deprecated
    condition: |
      Cosign keyless signing is deprecated or removed by
      the Sigstore project, and the verification path
      loses its anchor. The `ux-3-cosign-image-2026-10`
      decision absorbs the change.
    action: review


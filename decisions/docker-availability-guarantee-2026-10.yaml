    Dockerfile.alpine                     (NEW; musl runtime
                                           stage)
    scripts/install-tooling/install.sh    (--docker-fallback
                                           mode)
    tests/cli/install-docker-fallback.t   (NEW cram)
    USAGE.md, QUICKSTART.md               (fallback
                                           hierarchy)
    site/install.{md,ru.md,zh.md}         (fallback
                                           hierarchy,

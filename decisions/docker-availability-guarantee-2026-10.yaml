intent: |
  Make the Docker image channel a contractual last-resort
  fallback for `mathc` installation. Today the four install
  channels (release binary via curl|sh, install.ps1, nix
  run, source build) and the Docker image (Dockerfile.debian-
  slim on ghcr.io) are documented but treated with the same
  standing. In environments where the native channels fail
  (corporate proxies that block `raw.githubusercontent.com`,
  Alpine hosts where glibc-binary refuses to start, immutable
  CI runners without `~/.local/` write access, hosts behind
  a firewall that allows only container registries), the
  Docker image is the user's only escape — but its presence
  is implicit (it depends on the docker.yml CI run being
  green and recent), not contractually guaranteed.

  After this decision:

    1. A `:edge` tag is published to
       `ghcr.io/11111000000/mathc:edge` on every push to
       `main`, alongside the existing `:latest`, `:VERSION`,
       `:VERSION-debian-slim`, `:VERSION-arm64` tags. Users
       who want the bleeding edge no longer have to wait
       for a release tag.

    2. `scripts/install-tooling/install.sh` gains a
       `--docker-fallback` mode: when the native install
       chain (curl+SHA-256+chmod) fails on a recoverable
       error (network error 124, checksum mismatch 1 after
       a successful download, or absent `~/.local/` write
       access), and a `docker` binary is present on the
       host, the script prints a single
       `docker run --rm -v "$PWD:/repo" ghcr.io/.../mathc:<ver> …`
       invocation as the recommended next step. The script
       does NOT auto-execute the docker command (auto-pull
       and execution are out of scope; the user decides).

    3. A new `.github/workflows/docker-healthcheck.yml`
       runs on a daily cron AND on every push to `main`.
       It pulls the `:edge` image, runs `mathc version`,
       and records the result as a `kind_: observation`
       attestation under
       `attestations/docker-availability-guarantee-2026-10-
       docker-image-healthcheck.json`. A failing healthcheck
       surfaces in the GitHub UI as a red run, replacing the
       silent-stale-image failure mode.

    4. `Dockerfile.alpine` exists and is built by a new
       `.github/workflows/docker-alpine.yml` workflow that
       depends on `mathc-linux-x86_64-musl` being a release
       asset in `release.yml:files:` (wired in this cycle).
       The Alpine image closes the musl-libc fallback gap
       that today forces Alpine users to download the
       musl binary by hand.

    5. `USAGE.md`, `QUICKSTART.md`, and
       `site/install.{md,ru.md,zh.md}` consistently frame
       Docker as the always-available fallback, with a
       one-line "if the native install fails, run this"
       recipe. The framing replaces the current
       equal-weighting of the four channels with an
       explicit fallback hierarchy.

    6. (deferred) Mirror policy, retention policy, and an
       `--auto-fallback` mode are recorded as
       addresses-future obligations; they ship as separate
       cycles to keep this PR's review surface bounded.

  Touches (per A3 self-application):

    .github/workflows/docker.yml          (add :edge tag to
                                           the Build and push
                                           (multi-arch) step)
    .github/workflows/docker-healthcheck.yml  (NEW; daily cron
                                               + push trigger)
    .github/workflows/docker-alpine.yml   (NEW; alpine image
                                           build on push + tag)
    .github/workflows/release.yml         (add
                                           mathc-linux-x86_64-musl
                                           to the release

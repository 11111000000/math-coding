    attestations/<id>-<obligation>.json   (one per closed
                                           obligation; kind_
                                           ∈ {review, test,
                                           observation})

  Boundaries (A3 self-application):

    - No OCaml kernel change. lib/, bin/, spec/, schemas/,
      axioms/ are all unchanged.
    - decisions/decision.yaml is untouched (active policy
      unchanged).
    - No new release binary is introduced in this commit.
      The `mathc-linux-x86_64-musl` asset is wired into the
      existing release.yml `files:` list — it is already
      uploaded as a CI artifact per
      decisions/portable-linux-musl.yaml@4 and only needs
      the release asset wiring (one line).
    - The decision supersedes `docker-alpine-impl-pending@1`
      (the Phase-3 deferral) by closing the
      `musl-asset-published` assumption and replacing it
      with the live artifact.
    - The decision does NOT address (this cycle, deferred):
      * a second registry mirror (docker.io / quay.io) — the
        "ghcr.io blocked" failure mode;
      * a retention policy for `:VERSION` tags — the
        "stale images accumulate" failure mode;
      * an `--auto-fallback` mode (silent docker-pull+exec) —
        the "user must type the docker command" failure mode.
      These three are recorded as addresses-future with named
      reversal signals.

  Migration path (A3):

    - For users on the existing Docker flow, nothing changes.
      The `:edge` tag is additive; `:latest` continues to
      resolve to the most recent release tag.
    - For users on the native install path,
      `install.sh --docker-fallback` is opt-in (default off
      to preserve the existing UX). Users who hit a native
      install failure can re-run with
      `--docker-fallback` and get the docker escape hatch.
    - For users on Alpine (musl-libc), the new
      `Dockerfile.alpine` removes the "download the musl
      binary by hand" requirement; the existing direct-download
      path remains valid as a backup.
    - For CI integrations, the new healthcheck workflow
      surfaces `:edge` freshness as a green/red signal; the
      cosign-signed `:latest` and `:VERSION` tags continue to
      be the verification-anchored ref for production pulls.

  Rollback / forward-recovery:

    - The `:edge` tag in docker.yml is additive; removing it
      restores pre-this-commit behaviour with no other
      change.
    - The `--docker-fallback` flag is opt-in and absent by
      default; its absence is the no-op rollback.
    - The new healthcheck and docker-alpine workflows are
      additive files; deleting them restores pre-this-commit
      behaviour.
    - The `mathc-linux-x86_64-musl` release asset wiring is
      additive; removing it from the release `files:` list
      stops the future tag without affecting past releases.
    - The docs reframing is editorial; rolling back is a
      single revert of USAGE.md / QUICKSTART.md /
      site/install.{md,ru.md,zh.md}.

  Decision diff (A3 §Self-Application #6):

    - Pre-this-commit: Docker image is published on push
      and tag; cosign-verified; no `:edge` tag; install.sh
      has no fallback mode; no healthcheck; no Alpine image;
      docs treat all four channels equally.
    - Post-this-commit: `:edge` tag published on every push;
      `install.sh --docker-fallback` opt-in mode; daily
      `:edge` healthcheck workflow; Dockerfile.alpine ships;
      docs present Docker as the fallback of last resort.
      Verdicts: the existing 1.090 attestations are
      unchanged; this decision adds 5 new obligations whose
      attestations are recorded in
      `attestations/<id>-<obligation>.json`.

antithesis: |
  The counter-position considered and rejected: "Treating
  Docker as a fallback is unnecessary — `curl | sh` works on
  every platform we ship to, and adding a fallback channel
  is gold-plating." The author engaged with this position
  and rejected it on five grounds:
  (a) `install.sh` already documents the four libc-flavour
  binaries (glibc/musl, x86_64/aarch64) and explicitly
  flags Alpine as a fallback (the `mathc-linux-x86_64-musl`
  asset); making Docker the *contractual* fallback just
  promotes an existing ad-hoc affordance to a documented
  guarantee;
  (b) `decisions/install-tooling-2026-10.yaml` declares an
  `assumption: release-pipeline-trusted` whose
  `consequence_if_false` already lists "Docker image as
  fallback" as a mitigation; codifying the mitigation
  is closing a known gap, not introducing a new one;
  (c) the project's own CI uses the Docker image in
  `cosign-verify` (per `ux-3-cosign-image-2026-10.yaml`)
  and `cosign-sign` jobs run `docker run` against the
  locally-loaded image; treating the image as a fallback
  is consistent with how the project itself depends on it;
  (d) the cost is bounded — one `:edge` tag line, one
  new flag in install.sh, one new cron workflow, one new
  alpine workflow, five short doc edits — and every change
  has a reversal signal in the corresponding obligation;
  (e) A4 Care requires that when a user hits a failure on
  the documented happy path, there is a documented
  unhappy-path forward; "curl | sh works on every platform
  we ship to" is the happy-path claim, and the unhappy-path
  forward is currently the absence of a contract.

  A second position: "The `:edge` tag is risky — users
  who pull it get a mathc that has not been tagged and
  may not have been smoke-tested." Rejected on three
  grounds: (i) the existing build-image workflow already
  smoke-tests every push to main via `docker run --rm
  mathc:dev version` before publishing the `:latest` tag;
  the `:edge` tag is published from the same build that
  already passed the smoke test; (ii) the new
  docker-healthcheck workflow pulls `:edge` daily and
  records an attestation — the failure mode for a broken
  `:edge` is a red healthcheck run, not a silent broken
  pull; (iii) the per-architecture multi-arch build
  (linux/amd64 + linux/arm64) runs in the same Buildx
  invocation, so both arches are exercised together; a
  `:edge` regression on one arch would surface in the
  next push's smoke test before the tag advances.

counterexample: |
  "The `:edge` tag is published automatically but never
   reviewed; an attacker who compromises a maintainer's
   push access can ship a backdoored binary under `:edge`
   and never get caught." Counterargument: (a) the `:edge`
  tag is cosign-signed via the existing `cosign-sign` job
  (per `ux-3-cosign-image-2026-10.yaml`), bound to the
  `https://github.com/11111000000/math-coding` OIDC
  identity; a backdoored build under `:edge` would still
  bear a valid signature, but the build-image smoke test
  (which runs `mathc version`) is a hash-equality check
  of the binary itself, not a behavioural test — a
  behavioural test against `:edge` is a future cycle; (b)
  the new healthcheck workflow surfaces image-staleness
  as a red CI run, replacing silent failure with a loud
  failure; (c) the `:edge` tag is not a release channel
  — `:latest` (which points at the most recent release
  tag) is the production-recommended ref, and `:VERSION`
  is the cosign-verified, hash-pinned ref for production
  pipelines; `:edge` is documented as a developer
  affordance, not a production ref.

  "Adding a daily cron workflow increases CI minute
   consumption — is the cost worth it?" Counterargument:
  the healthcheck workflow runs `docker pull` + `docker
  run mathc version` on `ubuntu-latest`; both legs are
  bounded by GHCR's cache (the `:edge` image is the most
  recently built, so the pull is a no-op if the digest
  matches the local cache). Wall-clock cost is ~30-60s
  per run × 365 days = ~3-6 CI hours/month, well under
  the project's CI budget (the larger cost is the
  multi-arch build-image itself at ~3-5 min per release).

  "The `--docker-fallback` flag changes install.sh's UX
   from 'fail fast' to 'fall back silently' — isn't that
   exactly what the fast path rejects?" Counterargument:
  the flag is opt-in (`--docker-fallback`, default off)
  and does NOT auto-execute; it prints the docker command
  and exits. The user still decides whether to run
  docker. The change is from "the user sees a failure
  and has no documented next step" to "the user sees a
  failure and the script prints the recommended next
  step". The user's autonomy is preserved.

commitment: |
  Six outcomes, six obligations. Each obligation names
  the verifier surface (kernel test, cram fixture,
  decision record, or manual review by the named owner).

    D1. .github/workflows/docker.yml: the
    "Build and push (multi-arch)" step's `tags:` list
    adds `ghcr.io/11111000000/mathc:edge` as a new entry.
    The `:edge` tag is published on every push to `main`
    AND every release tag push, in addition to the
    existing `:latest`, `:VERSION`, `:VERSION-debian-slim`,
    and `:VERSION-arm64` tags. The arm64 convenience-tag
    step is unchanged.

    D2. scripts/install-tooling/install.sh: gains a
    `--docker-fallback` flag (default: off). When set and
    the native install branch fails with one of
    {exit 1 checksum mismatch after a successful download,
    exit 124 network error, MC-INSTALL-NO-HOME-WRITABLE},
    AND `command -v docker` succeeds, the script prints
    a `docker run --rm -v "$PWD:/repo"
    ghcr.io/11111000000/mathc:<version> <args>`
    invocation to stdout (preceded by the explanatory
    banner "native install failed; Docker fallback
    available:") and exits 0 (the fallback is the
    deliverable). When `command -v docker` fails, the
    script prints the banner + a "docker not found"
    notice and exits 1 (no escape available).

    D3. .github/workflows/docker-healthcheck.yml (NEW):
    a workflow with two triggers — `push: branches: [main]`
    and `schedule: - cron: '0 6 * * *'` (daily at 06:00 UTC).
    The job: pull `ghcr.io/11111000000/mathc:edge`, run
    `docker run --rm ghcr.io/11111000000/mathc:edge version`,
    assert exit 0, and emit an attestation record at
    attestations/docker-availability-guarantee-2026-10-
    docker-image-healthcheck.json with `kind_: observation`
    and `producer.identity: ci:docker-healthcheck`.

    D4. .github/workflows/release.yml: the
    `softprops/action-gh-release@v2` `files:` list gains
    `mathc-linux-x86_64-musl` (the existing CI artifact;
    this is a one-line addition to the release pipeline).
    Concurrently, a new `.github/workflows/docker-alpine.yml`
    builds `Dockerfile.alpine` on every release tag push and
    publishes to `ghcr.io/11111000000/mathc:<VERSION>-alpine`
    and `:edge-alpine`. `Dockerfile.alpine` is a multi-stage
    Dockerfile that copies `mathc-linux-x86_64-musl` from
    the release `assets/` into an `alpine:3.20` runtime stage
    (musl-libc compatible).

    D5. Documentation: USAGE.md, QUICKSTART.md, and
    site/install.{md,ru.md,zh.md} each gain a
    "If the native install fails" section that frames
    Docker as the fallback channel. The section includes
    the one-line `docker run --rm -v "$PWD:/repo"
    ghcr.io/11111000000/mathc:<version> <args>` recipe.

    D6. Future-work record: the decision's
    `relations.addresses-future` enumerates three
    follow-up obligations (mirror policy, retention
    policy, `--auto-fallback` mode) that are NOT closed
    in this cycle but are recorded so a future agent
    encountering the gaps finds the record.


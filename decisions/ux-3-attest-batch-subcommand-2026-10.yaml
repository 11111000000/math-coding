yaml_sha: "sha256:f03d4ac2b9b2e9045fe7b129851b2ef243b94b046d88a2b66827f140c4b4fcf4"

axiom_link:
  - A0
  - A1
  - A3

intent: |
  Ship a `mathc attest-batch` subcommand that batch-generates
  attestation JSON files from a TSV manifest or by walking
  `MATH_CODING_DECISIONS_DIR`. This is the OCaml port of
  `scripts/generate-attestations.py` and a brownfield-adoption
  enabler: operators migrating existing decision files can stamp
  one attestation per obligation without writing a custom script.

counterexample: |
  The strongest objection considered and rejected: "automated
  batch generation is double-edged — it speeds up brownfield
  adoption but also enables mass fake-review attestations." The
  counterargument fails on three grounds: (a) the manifest is
  a TSV with `decision_id<TAB>obligation_id` rows, so the
  caller must already know the decision and obligation names —
  generating an attestation for an unknown obligation is a
  no-op (no file is written because the obligation does not
  exist on disk); (b) the `id` field is a SHA-256 of the
  canonical body, so every attestation is forensically
  traceable to its producer identity (the `producer.identity`
  string is embedded in the body that gets hashed), and
  mass-forged attestations are detectable via
  `mathc self-check` (which reads `attestations/`); (c) the
  alternative — operator-stamped one-off attestations via
  `mathc attest <junit.xml>` — has no audit trail at all,
  making attest-batch the LESS risky surface area. The
  A0/A1 axioms make this explicit: every commitment must have
  a path to an observation (A1), and attest-batch provides
  exactly one.

commitment: |
  One kernel-surface subcommand, one pure module, four cram
  fixtures pinning positive / malformed / dry-run /
  --from=decisions paths. The deliverables are:

    D1. `bin/Mathc.ml::do_attest_batch` parses argv (manifest,
        from, out, kind, producer, result, dry-run), reads
        the manifest or scans `MATH_CODING_DECISIONS_DIR`,
        and emits one attestation per row or obligation.

    D2. `lib/attestations/batch.ml` (pure module) exposes:
        `parse_manifest`, `make_attestation`, `compute_id`,
        `with_id`, `serialize`, `filename_for`,
        `scan_decisions_for_obligations`. No I/O in the module.

    D3. The attestation `id` is `sha256:` + 64 lowercase hex
        digits, computed over the canonical JSON of the body
        excluding `id`. The canonical-JSON rule (sorted keys,
        no whitespace, ensure_ascii=False) matches
        `scripts/generate-attestations.py::canonical_json`
        byte-for-byte.

    D4. Output filenames are `<decision>-<obligation>.json`.
        The output dir defaults to
        `MATH_CODING_ATTESTATIONS_DIR` (env var) or
        `.math-coding/attestations/` (new default per
        plan-2026-10-improvements §0.1); legacy
        `attestations/` continues to work as a fallback when
        neither is set.

    D5. The four cram fixtures pin the surface:

        tests/cli/attest-batch-positive.t
        tests/cli/attest-batch-malformed.t
        tests/cli/attest-batch-dry-run.t
        tests/cli/attest-batch-from-decisions.t


outcomes:
  - id: cli-attest-batch-emits-attestations
    statement: |
      `mathc attest-batch --manifest=PATH` reads a TSV and writes
      one attestation per row into the output directory.
  - id: cli-attest-batch-refuses-malformed
    statement: |
      `mathc attest-batch --manifest=PATH` exits 2 with a precise
      diagnostic naming the offending line when the manifest is
      malformed.
  - id: cli-attest-batch-dry-run-non-destructive
    statement: |
      `mathc attest-batch --dry-run` prints canonical-JSON
      attestations to stdout without writing any file.
  - id: cli-attest-batch-from-decisions-walks
    statement: |
      `mathc attest-batch --from=decisions` walks every parseable
      `*.yaml` under `MATH_CODING_DECISIONS_DIR` and emits one
      attestation per obligation, using the `--kind`,
      `--producer`, `--result` flags as defaults.

obligations:
  - id: cram-attest-batch-positive-passes
    outcome: cli-attest-batch-emits-attestations
    claim: |
      `tests/cli/attest-batch-positive.t` exercises the manifest
      path end-to-end: 3 rows in -> 3 `.json` files out, each
      with a `sha256:` id matching the canonical-JSON SHA-256 of
      the body, and the second row's missing 5th column defaults
      to `pass`.
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-positive.t runs via dune runtest
          result: pass

  - id: cram-attest-batch-malformed-passes
    outcome: cli-attest-batch-refuses-malformed
    claim: |
      `tests/cli/attest-batch-malformed.t` pins the exit-2
      surface: malformed manifest, missing file, bad `--result`
      value all refuse with exit 2 and a stderr diagnostic
      that names the path / line / reason.
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-malformed.t runs via dune runtest
          result: pass

  - id: cram-attest-batch-dry-run-passes
    outcome: cli-attest-batch-dry-run-non-destructive
    claim: |
      `tests/cli/attest-batch-dry-run.t` pins the `--dry-run`
      path: 3 JSON lines on stdout, 0 files in the output dir,
      and every output's `id` matches the canonical-JSON SHA-256.
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-dry-run.t runs via dune runtest
          result: pass

  - id: cram-attest-batch-from-decisions-passes
    outcome: cli-attest-batch-from-decisions-walks
    claim: |
      `tests/cli/attest-batch-from-decisions.t` writes a parseable
      YAML decision with two obligations, then asserts that
      `--from=decisions` produces two attestation files whose
      producer / kind / result match the CLI flags.
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-from-decisions.t runs via dune runtest
          result: pass

  - id: mathc-validate-accepts-this-decision
    outcome: cli-attest-batch-emits-attestations
    claim: |
      `mathc validate decisions/ux-3-attest-batch-subcommand-2026-10.yaml`
      exits 0 (accept).
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-attest-batch-subcommand-2026-10.yaml
          result: pass

  - id: sha-matches-python-upstream
    outcome: cli-attest-batch-emits-attestations
    claim: |
      For a fixed manifest row with a fixed `issued_at`, the OCaml
      SHA-256 of the canonical body equals the Python upstream
      SHA-256 (byte-for-byte). This is verified at cram-test time
      via Python's `json.dumps` + `hashlib.sha256`, which is the
      same pipeline `scripts/generate-attestations.py::canonical_json`
      uses.
    acceptance:
      all:
        - verifier: tests/cli/attest-batch-positive.t computes OCaml SHA via Python and asserts match
          result: pass
        - verifier: tests/cli/attest-batch-dry-run.t computes OCaml SHA via Python and asserts match
          result: pass

reversal:
  - signal: p1-path-config-lands
    condition: |
      The P1 stream of `plan-2026-10-improvements` lands
      `lib/path_config.ml` with `resolve_decisions_dir` /
      `resolve_attestations_dir` resolvers. Resolution:
      `lib/attestations/batch.ml` switches to the resolvers
      (replacing the inline `Sys.getenv_opt` checks at
      `bin/Mathc.ml::do_attest_batch::env_or_default`).
  - signal: manifest-format-changes
    condition: |
      The TSV manifest gains a 6th column (e.g. `evidence_digest`)
      or the 5th column's default flips from `pass` to `review`.
      Resolution: bump this decision's revision, document the
      manifest schema bump in `bin/data/manifest.example.tsv`,
      and update the cram fixtures.


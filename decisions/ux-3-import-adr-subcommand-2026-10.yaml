outcomes:
  - id: import-adr-reads-adr
    statement: |
      `mathc import-adr PATH` reads PATH, parses the MADR or
      adr-tools shape, and prints a math-coding decision YAML
      to stdout. Exit 0 on success, 1 on file-not-found, 2 on
      input error, 3 on internal I/O error.
  - id: import-adr-writes-decision
    statement: |
      `mathc import-adr PATH --write` writes the parsed
      decision YAML to `decisions/<id>.yaml` (creating
      `decisions/` if absent) such that `mathc validate` on
      the resulting file accepts (after the reviewer fills in
      `scope.paths[]`).
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-import-adr-subcommand-2026-10.yaml` exits 0.

assumptions:
  - id: kernel-api-stable
    state: assumed
    statement: |
      The `lib/` kernel API (Domain, Decision, Memory, etc.) is
      stable for this slice. The new sub-library depends only
      on `mathcoding_core` plus standard library `Str` and
      `Unix` (per OCAML_BEST_PRACTICES §10.1).
    owner: human:maintainer
    consequence_if_false: |
      If a future kernel change breaks the import-adr sub-library
      deps, the build fails and this decision is revised.
    review_on:
      - signal: import-adr-build-broken
  - id: adr-shapes-stable
    state: assumed
    statement: |
      MADR and adr-tools formats are stable. MADR is the
      de-facto Markdown ADR format since ~2018; adr-tools is
      the de-facto plain-text ADR format since ~2014. Both
      format conventions are documented in their respective
      repos and rarely change.
    owner: human:maintainer
    consequence_if_false: |
      If MADR or adr-tools add new mandatory sections, the
      parser will silently drop them and the reviewer will see
      a `mathc validate` rejection. Resolution: extend the
      parser in a follow-up decision.
    review_on:
      - signal: madr-new-section

obligations:
  - id: cram-test-passes
    outcome: import-adr-reads-adr
    claim: |
      `tests/cli/import-adr.t` exercises MADR detection,
      adr-tools detection, the `--write` flag, missing-PATH
      (exit 2), and file-not-found (exit 1) paths. Each case
      asserts the right output and exit code.
    acceptance:
      all:
        - verifier: tests/cli/import-adr.t
          result: pass

  - id: write-produces-valid-decision
    outcome: import-adr-writes-decision
    claim: |
      `mathc import-adr PATH --write` writes a decision YAML
      to `decisions/<id>.yaml` that passes `mathc validate`
      after the reviewer fills in `scope.paths[]`.
    acceptance:
      all:
        - verifier: tests/cli/import-adr.t::write
          result: pass

  - id: this-decision-validates
    outcome: this-decision-validates
    claim: |
      `mathc validate
      decisions/ux-3-import-adr-subcommand-2026-10.yaml` exits 0.
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-import-adr-subcommand-2026-10.yaml
          result: pass

reversal:
  - signal: import-adr-subcommand-removed
    condition: |
      The `mathc import-adr` subcommand is removed (e.g. folded
      into a one-off Python script under `scripts/`). Resolution:
      this decision is superseded; the kernel surface
      (`lib/import_adr/`, `bin/Mathc.ml::do_import_adr`) is
      deleted via a follow-up decision.
    action: supersede-with-script
  - signal: adr-shapes-broken
    condition: |
      MADR or adr-tools change their canonical shape in a way
      that breaks the parser. Resolution: extend the parser
      in `lib/import_adr/import_adr.ml`; this decision is
      revised.
    action: rework


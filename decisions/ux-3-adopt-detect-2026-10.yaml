outcomes:
  - id: brownfield-detection-shipped
    statement: |
      `lib/adopt/detect.ml` exposes the `report` record
      type, the `brownfield` sum type with 8 cases, and
      the `detect` / `classify` / `detect_classify` /
      `madr_files` / `adrtools_files` /
      `string_of_brownfield` API. The 9 alcotest cases
      pass.
  - id: this-decision-validates
    statement: |
      `mathc validate
      decisions/ux-3-adopt-detect-2026-10.yaml` exits 0.

assumptions:
  - id: brownfield-paths-canonical
    state: assumed
    statement: |
      The three brownfield paths (`docs/arc42/`,
      `docs/adr/`, `adr/`) are the canonical locations
      per arc42, MADR, and adr-tools conventions. The
      user accepted this scope (Q2 answer).
    owner: human:maintainer
    consequence_if_false: |
      If a project uses non-canonical paths (e.g.
      `architecture/` instead of `docs/arc42/`), the
      detection reports `Empty` and the user must
      rename or use a config override. Resolution for
      Phase 3.2: support a `brownfield.json` config
      file.
    review_on:
      - signal: brownfield-paths-non-canonical
  - id: alcotest-with-mkdir-p
    state: assumed
    statement: |
      The `dune test` bwrap sandbox restricts nested
      `Unix.mkdir` but allows `Sys.command "mkdir -p"`.
      The test uses the latter for portability.
    owner: human:maintainer
    consequence_if_false: |
      If the sandbox changes (e.g. a future dune
      version removes the workaround), the test
      fails. Resolution: switch to `Filename.temp_file`
      which uses a single-level path.
    review_on:
      - signal: bwrap-sandbox-changed

obligations:
  - id: alcotest-passes
    outcome: brownfield-detection-shipped
    claim: |
      `tests/adopt_test.exe` runs 9 cases, all pass:
      detect empty, detect arc42 only, detect madr only,
      detect adr-tools only, mixed arc42+madr, mixed
      all three, madr_files, madr_files empty,
      adrtools_files.
    acceptance:
      all:
        - verifier: tests/adopt_test.exe
          result: pass

  - id: this-decision-validates
    outcome: this-decision-validates
    claim: |
      `mathc validate
      decisions/ux-3-adopt-detect-2026-10.yaml` exits 0.
    acceptance:
      all:
        - verifier: mathc validate decisions/ux-3-adopt-detect-2026-10.yaml
          result: pass

reversal:
  - signal: paths-non-canonical
    condition: |
      The three hardcoded paths are insufficient for the
      real client base. Resolution: extend the `report`
      type with a list of detected paths (rather than
      booleans), or add a `brownfield.json` config
      override.
    action: rework


intent: |
  Phase 3.1 of the ux-3 workstream (per planning decision
  `ux-3-adopt-roadmap-2026-10@1`). Land the brownfield
  detection library for the future `mathc adopt`
  subcommand.

  `lib/adopt/detect.ml` is a pure OCaml sub-library that
  inspects a target directory for markers of the three
  brownfield conventions math-coding co-exists with:

    arc42      docs/arc42/        (arc42-template directory)
    MADR       docs/adr/*.md      (Markdown ADR files)
    adr-tools  adr/*.md          (plain-text ADR directory)

  The output is a `report` record (which conventions are
  present) plus a `classify` function that maps the record
  to a `brownfield` sum type covering all 2^3 = 8 input
  combinations: `Empty | Arc42 | Madr | AdrTools |
  Mixed_Arc42_Madr | Mixed_Arc42_AdrTools |
  Mixed_Madr_AdrTools | Mixed_All_Three`.

  File-listing helpers `madr_files : root -> string list`
  and `adrtools_files : root -> string list` enumerate the
  ADR files for the future `mathc adopt` to import.

  The detection is PURE: only `Sys.file_exists`,
  `Sys.is_directory`, and `Sys.readdir` are used. No
  subprocesses, no kernel API, no math-coding gates. This
  is the §10.1 adapter pattern: a small sub-library with
  its own tests, not a kernel change.

  Touches (per A3 self-application):
    lib/adopt/dune                (new sub-library)
    lib/adopt/detect.ml           (new, ~100 lines)
    tests/dune                    (adds adopt_test, mathcoding_adopt dep)
    tests/adopt_test.ml           (new, 9 cases, ~150 lines)
    decisions/ux-3-adopt-detect-2026-10.yaml   (this file)

axiom_link:
  - A0

antithesis: |
  The counter-position considered and rejected: "Brownfield
  detection is a 20-line function; a sub-library and 9 test
  cases is over-engineering. Put it in `lib/init/init.ml` as
  a helper." The author engaged with this position and
  rejected it on four grounds: (a) the sub-library pattern
  is the project convention (per §10.1) and keeps the kernel
  pure; (b) `lib/init/init.ml` is already 200+ lines and the
  detection logic is conceptually distinct from greenfield
  scaffolding; (c) the 9 test cases are necessary to cover
  the 2^3 = 8 classification combinations plus the file-
  listing edge cases; (d) the detection is REUSED by
  `mathc adopt` (next slice) and potentially by the MCP
  read-write methods (e.g. `mathc/attest` could warn
  the agent if it detects brownfield), so the abstraction
  pays off. The minimum fix is one sub-library + one
  test executable + one decision file, which is what
  this file records.

commitment: |
  One kernel-adjacent addition. Three deliverables, each
  pinned by a fixture or the decision itself:

    D1. `lib/adopt/detect.ml` exposes:
          - `report` record type
          - `empty_report` value
          - `detect : root:string -> report`
          - `classify : report -> brownfield`
          - `detect_classify : root:string -> brownfield`
          - `madr_files : root:string -> string list`
          - `adrtools_files : root:string -> string list`
          - `string_of_brownfield : brownfield -> string`
        No I/O beyond `Sys.file_exists`, `Sys.is_directory`,
        and `Sys.readdir`.

    D2. `lib/adopt/dune` is `(library (name mathcoding_adopt)
        (wrapped false) (modules detect) (libraries
        mathcoding_core str unix))`. `Detect` is the
        module path (per the §10.1 convention).

    D3. `tests/adopt_test.ml` covers 9 cases:
          - detect empty
          - detect arc42 only
          - detect madr only (with .md file)
          - detect adr-tools only (with .md file)
          - mixed arc42 + madr
          - mixed all three
          - madr_files lists .md files
          - madr_files empty
          - adrtools_files lists .md files

  Boundaries (A3 self-application):
    - `lib/adopt/` is the only new sub-library.
    - `bin/Mathc.ml` is unchanged (the `mathc adopt`
      subcommand is the next slice, Phase 3.2).
    - The kernel under `lib/` is unchanged.
    - `spec/`, `schemas/`, `axioms/`, `scripts/` are
      unchanged.
    - No telemetry, no live HTTP, no axiom amendment.

counterexample: |
  "Two-level detection (docs/arc42/ vs adr/ vs docs/adr/)
   is fragile; users may have moved the directories. The
   hardcoded paths will silently miss real brownfield
   projects." The counterargument fails because the user's
   Q2 answer was 'реальные, делать качественно' — the
   user accepted these three paths as the canonical
   conventions. If a project uses a non-canonical layout
   (e.g. `architecture/arc42/` instead of `docs/arc42/`),
   the detection reports `Empty` and the user is asked to
   rename or use `--from-arc42` (Phase 3.2). Resolution
   for the next slice: add a `brownfield.json` config
   file the user can drop at the repo root to override
   the default paths.


      without reference to the author-side entries.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe

obligations:
  - id: corpus-scan-is-reproducible
    outcome: the-offender-list-is-reproducible
    claim: |
      scripts/scan-silent-drops.sh
      scripts/scan-silent-drops.sh --validity
      scripts/scan-silent-drops.sh --all

      The three forms, in order: the corpus scan; the same scan with
      an independent reader's verdict in column 1; and the same scan
      over every tracked YAML, which reports 7 of 313.

      The command recorded here is the one the corpus argument is
      settled with. It reports 5 of 139 on this tree: four files an
      independent reader rejects too, and one stray document marker
      with nothing behind it.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe

  - id: offender-set-is-an-exact-set
    outcome: the-inventory-is-pinned-not-frozen
    claim: |
      The measured set of files leaving an unparsed tail equals
      `author_malformed @ kernel_holes` exactly, and the measured
      set of files carrying a stray document marker equals
      `cosmetic_marker` exactly. Both comparisons are equality,
      not containment.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe

  - id: kernel-holes-are-empty
    outcome: kernel-holes-are-zero-tolerance
    claim: |
      `kernel_holes` is asserted equal to the empty list. Every
      offender in the corpus is therefore accounted for by
      something `yq` also rejects, or by a stray marker with nothing
      behind it.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe

  - id: cosmetic-markers-lose-nothing
    outcome: the-inventory-is-pinned-not-frozen
    claim: |
      The stray-marker file has no non-empty line after the marker.
      The "cosmetic" label is checked, not assumed.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe

  - id: a-wrong-fold-is-caught-not-just-a-wrong-stop
    outcome: kernel-holes-are-zero-tolerance
    claim: |
      The D4-repaired files reach EOF AND their `unknowns`
      counts are correct, and `render-module-split-phase1a-2026-10
      .yaml` still yields `planned_evidence` and
      `estimated_class`. A parser that reads everything and folds
      it wrongly fails here and passes every shape check.
    acceptance:
      all:
        - verifier: tests/corpus_no_silent_drops/corpus_no_silent_drops.exe

  - id: every-pin-is-mutation-checked
    outcome: the-inventory-is-pinned-not-frozen
    claim: |
      Four mutations of `lib/codec.ml`, each of which leaves the
      corpus reading identically or the diagnostic blind, and each
      of which turns this suite red:

        A  `fold_seq_item` neutered (D4 reverted)
           -> offender set + both content pins red; the measured
              set grows
        B  backslash rule dropped from `quote_still_open`
           -> `an escaped quote does not close the scalar` red
        C  `load_yaml_string_full` discards the remainder
           -> offender set red
        D  `is_dash_item` guard dropped from `fold_seq_item`
           -> `a deeper dash item is not absorbed` red

      B and D were found by running the mutations, not by reading
      the code: each leaves every file in `decisions/` reading
      exactly as before.
    acceptance:
      all:
        - verifier: tests/decision_parser_yaml.exe

risk:
  declared_triggers:
    - residual-ledger-rots-when-a-file-is-repaired
    - recorded-buckets-are-not-machine-checked
  residual-ledger-rots-when-a-file-is-repaired: |
    Expected, and it is the intended direction. Repairing one of
    the offenders turns the suite red until the ledger entry is
    struck and its reason updated in the same commit. That is the
    friction doing its job.
  recorded-buckets-are-not-machine-checked: |
    The author/kernel split is a recorded claim about what `yq`
    thinks, not a verdict this executable computes -- it has no
    YAML reader. A file could be repaired into a different defect
    that still leaves a tail, and the bucket would be stale while
    the set assertion stayed green. One command,
    `scripts/scan-silent-drops.sh --validity`, re-derives the
    split; it is not wired into CI, and that gap is real.
  owner: human:maintainer

assumptions:
  - id: author-classification-drifts-slowly
    state: assumed
    statement: |
      The four `author_malformed` files stay malformed until
      somebody rewrites their prose, and nobody rewrites them
      into a different defect that still leaves a tail.
    owner: human:maintainer
    consequence_if_false: |
      A ledger entry keeps its name while the reason under it
      becomes false. The set assertion cannot see it; only
      `scan-silent-drops.sh --validity` can. Wire that command
      into the gate, or into review, before the ledger passes
      ten entries again.
    review_on:
      - signal: silent-drop-ledger-passes-twenty-entries

reversal:
  - signal: ledger-churn-outruns-the-signal
    condition: |
      The exact-set assertion is being edited far more often than
      the corpus is being repaired -- entries added as a matter of
      course on new malformed files, without anyone reading them.
    action: |
      Split the assertion: keep zero tolerance on `kernel_holes`,
      and move `author_malformed` to a containment check with a
      separately enforced count ceiling. That trades the "struck
      off in the same commit" property for a less noisy gate, and
      it is a worse trade -- but a rule nobody follows is worth
      less than a rule that is easy to follow.
  - signal: a-new-silent-drop-class-appears
    condition: |
      A shape starts losing content that neither
      `load_yaml_string_full` nor `load_yaml_value_remaining`
      reports, so the corpus pin stays green while the kernel
      loses more.
    action: |
      The pin measures the DIAGNOSTIC, not the document, so it
      inherits every blind spot the diagnostic has. The remedy is
      on the loader side: a reader that reached EOF and disagreed
      with the kernel's reading is the only oracle that does not
      share the kernel's assumptions. Wiring `yq` into CI as a
      corpus-wide cross-check would close it.


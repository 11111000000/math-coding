#
# Rev 2 (2026-11-01): the ledger this decision recorded was the
# ledger of 2026-10-29 (twelve offenders, ten author-malformed, two
# cosmetic) and the corpus has moved since: four author-malformed,
# one cosmetic marker, zero kernel holes. The instrument did not
# rot -- it was paid down, file by file, and this decision's own
# exact-set rule is what made every repair visible. The numbers in
# this file are now the numbers the instrument measures.
#
# The control that catches this decision's own failure is unchanged:
# tests/corpus_no_silent_drops/corpus_no_silent_drops.ml asserts the
# exact set in BOTH directions, so a file that starts losing content
# and a file that stops losing content are both red.
negative_control: tests/corpus_no_silent_drops/corpus_no_silent_drops.ml

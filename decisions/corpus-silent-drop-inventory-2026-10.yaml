id: corpus-silent-drop-inventory-2026-10
revision: 1
state: active
mode: standard
change_kind: test
body_sha: "sha256:5f84df6ea166e3760ad75afc23bd3ec8ce0ca0ac67a316480c277fe03ec68f8b"

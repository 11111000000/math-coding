intent: |
  Two `curl` invocations in the kernel ignored the process
  exit code, hiding network-level failures. `lib/forge.ml::
  curl_status` decided success solely on the HTTP code body
  and could return `true` for a curl killed by signal. The
  same pattern in `lib/rebuttal.ml::forge_mirror` is
  best-effort by design, but the `let _status = ...` binding
  was noise. This decision tightens the forge HTTP check
  and makes the rebuttal comment explicit.

commitment: |
  `lib/forge.ml::curl_status` now gates its boolean return on
  `Unix.WEXITED 0` in addition to the HTTP-code body, so a
  curl killed by signal cannot produce a false positive.
  `lib/rebuttal.ml::forge_mirror` replaces
  `let _status = Unix.close_process_in ic in` with
  `let _ = ...` and documents why the exit code is
  intentionally ignored (best-effort mirror; empty body is
  already handled).

outcomes:
  - id: curl-killed-no-false-positive
    statement: |
      A `curl` process killed by signal cannot make
      `Forge.curl_status` return `true`.


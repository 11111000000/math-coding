antithesis: |
  "Just tighten the parser's `mode_geq_standard` check on
  `antithesis_required_missing` to `mode_geq_light`, so every
  decision at or above Light needs an antithesis block. Skip
  the new mode constructor entirely; the kernel switches do
  not need to be revisited."

  Rejected because: tightening the parser floor to `Light`
  would still force antithesis into the same 60+ decision
  files that the spec today does not require antithesis for.
  The chosen direction (introduce Considered and guard by it)
  is the minimal-blast-radius shape: existing files keep
  validating as before; the v3 dialectic method is opt-in
  via `mode: considered`; the spec text is preserved verbatim.
  The "tighten to Light" path would have the same outcome for
  legacy files but require no spec change; that is its only
  advantage, and it is outweighed by the inaccuracy of the
  spec saying `mode = considered` while the parser implements
  `mode >= standard`. The honest answer is to either rewrite
  the spec (which this transition does not do, by design) or
  introduce Considered, so the spec and the code agree.
intent: |
  Resolve the spec/code contradiction in
  `spec/algebra-3.2.md:422-423` vs
  `lib/decision.ml:1108-1113` for the `antithesis` dialectic
  slot. The spec says `antithesis` is required only for
  `mode = considered`; the parser-level check uses
  `mode_geq_standard` (Standard | Strict | Exhaustive),
  which means 61 of 100 live decision files at HEAD `c56bd35`
  are rejected with `MC-ANTITHESIS-MISSING` despite the
  spec saying they should be accepted.

  Resolution direction (spec → code):
    1. Extend `lib/domain.ml::type mode` with the
       `Considered` constructor. The order on the polymorphic
       variant sum remains the same; `mode_geq_considered`
       is the new predicate, distinct from
       `mode_geq_standard`.
    2. Replace the `mode_geq_standard` guard on
       `antithesis_required_missing` with
       `mode_geq_considered` in `lib/decision.ml`.
    3. Keep `mode_geq_standard` on
       `counterexample_required_missing` (counterexample is
       required for `mode ≠ tiny` per algebra §11; antithesis
       is required only for `mode = considered` per the same
       section).
    4. No live decision file is forced to bump to
       `mode: considered`. `considered` is opt-in for authors
       who commit to the v3 dialectic method
       (antithesis-bearing); the existing 100 files continue
       to validate as before.

  Strongest countercase considered:
    "Adding a new mode constructor is the most invasive
    direction; instead, drop the `mode = considered` branch
    from the spec and require antithesis for `mode >= standard`
    in the parser."
    This would touch 60+ decision files (each would need to
    gain an antithesis section) and is the opposite direction
    from what the spec says. The chosen direction is the
    minimal one: the parser is brought into line with the
    spec; the spec is preserved.

change_kind: implementation

axiom_link:
  - A0
  - A3

commitment: |
  1. `lib/domain.ml::type mode` lists six constructors:
     `Tiny | Light | Standard | Strict | Exhaustive | Considered`.
  2. `lib/decision.ml` introduces `mode_geq_considered`
     (helper that returns true only for `Considered`).
  3. The `antithesis_required_missing` branch in
     `lib/decision.ml::parse_decision_value` is guarded by
     `mode_geq_considered`, not `mode_geq_standard`.
  4. The `counterexample_required_missing` branch keeps the
     `mode_geq_standard` guard.
  5. The legacy `mode_geq_standard` helper is preserved
     (still used by the counterexample check).
  6. No live decision file changes its `mode:` value as
     part of this commit. The new `Considered` constructor
     is opt-in.
  7. `mathc validate decisions/*.yaml` continues to
     accept every existing decision file at HEAD
     (none of them have `mode: considered` today, so the
     new guard has zero effect on them).
  8. `mathc validate` on a synthetic fixture with
     `mode: considered` and an empty `antithesis:` block
     emits `MC-ANTITHESIS-MISSING`.
  9. `mathc validate` on a synthetic fixture with
     `mode: considered` and a non-empty `antithesis:` block
     accepts the file.

counterexample: |
  "Adding a new mode constructor is more invasive than
  tightening the antithesis rule to `mode >= standard`. A
  seventh mode in the type forces every mode-aware switch
  in the kernel (risk.ml, gate.ml, mode.ml, packages.ml,
  policy.ml) to either explicitly handle Considered or fall
  through the default branch; the surface area of the
  change is much larger than the targeted parser fix
  looks."

  Counterargument: every mode-aware switch in the kernel
  uses either (a) explicit OCaml pattern matching on the
  polymorphic variant sum, where the OCaml exhaustiveness
  checker will flag the new constructor at compile time
  (each switch becomes a deliberate `| Considered ->` line);
  or (b) the polymorphic compare, which already orders the
  six existing constructors and would order Considered
  wherever its declaration sits in `lib/domain.ml:44`. The
  exhaustiveness check is the right safety net: it forces
  every reviewer of this commit to look at every switch and
  decide whether Considered should fall through to
  Standard (the chosen semantics: Considered is a synonym
  for Standard with the extra antithesis requirement) or
  get a dedicated branch. None of the kernel switches
  today are subtle enough that one missed mode constructor
  would silently mishandle a verdict. The same shape of
  reasoning was used in `algebra-3.2@1` when the kernel
  gained the Strict and Exhaustive constructors; that
  change was net-positive.

  "The spec text at algebra-3.2.md:422 ('∀ D ∈ Decision,
  mode(D) = considered') is a typo for
  `mode(D) >= standard`; the original v3 dialectic method
  paper the spec references did not propose a sixth mode."
  Counterargument: the spec text was authored in commit
  `7a5a070` (feat(dialectic): add antithesis field,
  close counterexample sweep deficit) which also added
  the antithesis-required check to the spec at the same
  time. The two edits are paired; reading either one
  without the other is misleading. The `Considered` mode
  was an oversight in that commit, but the spec text is
  what the project published; the parser is what should
  move.


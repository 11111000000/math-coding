obligations:
  - id: debt-is-measured-and-bounded
    claim: |
      The fixture measures the generated store, not a git index: it
      counts attestations with an empty materials_digest, active
      decisions with no attestation, and undeclared inconclusive
      attestations, and fails when any count exceeds its recorded
      ceiling. With no store, or a store signed for another tree, it
      exits 3 (unknown), not 0.
    acceptance:
      all:
        - verifier: tests/fixtures/legacy-attestation-debt.sh

  - id: debt-can-only-fall
    claim: |
      The fixture's negative control demonstrates that it fails when
      a synthetic generated store exceeds the legacy and unattested
      ceilings, so the bounds are real rather than decorative.
    acceptance:
      all:
        - verifier: tests/fixtures/legacy-attestation-debt.sh

risk:
  owner: human:maintainer
  declared_triggers:
    - "a legacy attestation is added to the generated store by a tool other than mathc attest-batch"

assumptions:
  - id: legacy-files-are-unexamined
    state: assumed
    owner: human:maintainer
    statement: |
      An attestation in the generated store with an empty
      materials_digest carries
      no claim that can be falsified, and is therefore treated as
      unexamined rather than as evidence. Replacing it does not
      retract a true claim; it re-establishes one that can be
      checked.
    consequence_if_false: |
      If some legacy attestations record a check that was really
      run, deleting them loses a record. The replacement procedure
      re-runs the verifier before deleting, so the record is
      re-established rather than lost.

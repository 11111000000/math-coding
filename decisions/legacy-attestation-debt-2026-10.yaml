intent: |
  The issue recorded on 2026-10-23 was concrete: 760 of 773 then-tracked
  attestations carried an empty `subject.materials_digest`, which the gate
  treated as a wildcard.  Those files are gone.  The attestation store is
  now generated on disk and is not tracked by git, so the old file census is
  a dated record, not the population this promise measures today.

  2026-10-31, REVISION 2: THE STORE MOVED FROM VERSION CONTROL TO THE
  WORKING TREE.  `tests/fixtures/legacy-attestation-debt.sh` reads the
  generated store at the same path the kernel resolves, rejects a missing or
  stale store with exit 3 (`unknown`, not `pass`), and measures three
  current debts when the store is present and fresh: legacy empty-digest
  attestations, active decisions with obligations but no attestation, and
  undeclared inconclusive attestations.  The current ceilings are 0, 3 and
  1; `bash scripts/ceiling-monotonic.sh` prints all three against their
  recorded bases.

  History:
    rev 1: adopted a measured ceiling for the legacy wildcard attestations
      and the decisions they failed to cover.
    rev 2 (this revision): replaced the tracked-store population with the
      generated-store measurement the fixture actually performs; the
      substantive ceiling and negative-control promises are unchanged.

commitment: |
  After this decision closes:

  1. The size of the debt is MEASURED by a fixture, not by prose.  When
     the generated store exists and is signed for the current tree, the
     fixture measures: (a) attestations with an empty
     `subject.materials_digest`; (b) active decisions that have
     obligations but no attestation; and (c) inconclusive attestations
     whose `kind_` is not `review`.  A missing store or a store for another
     tree is UNKNOWN (exit 3), never a green measurement over nothing.
  2. The fixture pins those three numbers as CEILINGS.  The current
     ceilings are 0 legacy empty-digest attestations, 3 unattested active
     decisions, and 1 undeclared inconclusive attestation; the debt may
     fall and may never rise.
  3. Every replacement is an attestation signed by
     `mathc attest-batch` under semantics A, carrying a real
     scope digest. The legacy file is deleted in the same commit
     that adds the replacement — the store is append-only for
     ACCEPTED artifacts, and a legacy wildcard is not an accepted
     artifact; it is an unexamined one.
  4. The replacement order is fixed: runtime kinds first
     (test, build, analysis, observation — 427 files, of which the
     schema-invalid ones are the priority), review kind last
     (333 files).

axiom_link:
  - A1
  - A2
  - A3

counterexample: |
  Two counter-positions considered and rejected.

  (a) "Delete the 760 legacy attestations recorded in 2026-10 and
  re-sign everything
  from scratch in one commit." Rejected: a re-signed attestation
  that nobody ran is exactly the fabrication this repository has
  been collecting evidence about for six weeks — 793 attestations
  emitted by one command with three self-chosen values, and 118
  review-class passes added in one commit whose own message says
  "After this commit, self-check reports 0 unknown subjects". The
  goal was to close that gap, not to reproduce it at scale.

  (b) "Leave the legacy attestations alone and simply stop
  treating the empty digest as a wildcard." Rejected: in the
  tracked-store population this made
  all 760 stale at once, which was honest but not actionable — a
  debt that appears in one step of a thousand is a debt nobody
  pays. The ceiling is the thing that makes the reduction
  possible: a number that must fall, with a per-commit budget.

antithesis: |
  The opposite claim would be that the legacy attestations are
  mostly TRUE — they were written by a maintainer who read the
  decision, and a human declaration is a legitimate source class
  under A0 (`declared != derived != attested != reviewed !=
  observed`).

  That claim is not denied, and it is the reason the review kind
  is LAST in the replacement order rather than first. But it
  carries a consequence the claim does not face: a `review`
  attestation that can never be invalidated is not a declaration,
  it is a decoration. Under A0 a review is a source class with a
  distinct meaning, and the distinct meaning is preserved by
  making it CONDITIONAL — bound to the tree it was made at — not
  by exempting it from binding.

outcomes:
  - id: debt-is-a-number
    statement: |
      `tests/fixtures/legacy-attestation-debt.sh` reports the
      generated-store debt and fails if any of its three measurements
      exceeds the ceiling recorded in the fixture. A missing or stale
      store is reported as UNKNOWN (exit 3), not as a satisfied promise.
      Each ceiling is a constant in the fixture, so lowering it is an
      explicit, reviewable act.


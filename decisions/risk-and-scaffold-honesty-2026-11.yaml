assumptions:
  - id: the-kernel-is-meant-to-serve-other-trees
    state: assumed
    owner: human:maintainer
    statement: |
      The kernel is a portable core (plan tranche T4.1), so a path
      category that this repository does not have is not dirt by
      itself. Only a marker that could never fire AND could never
      match another tree's layout is.
    consequence_if_false: |
      The impact taxonomy would have to shrink to this repository's
      directories, and the kernel would grade an adopter's tree by a
      rule written for another tree. The marker vocabulary is where the
      removal happened, not the taxonomy - the taxonomy keeps
      `migrations/**`, `lib/security/**` and `lib/utils/**`, none of
      which exist here either.
    review_on:
      - signal: the-core-is-split-into-its-own-package

  - id: a-strict-parser-is-the-reader-that-matters
    state: assumed
    owner: human:maintainer
    statement: |
      A file the kernel writes has to be readable by a standard YAML
      parser, not only by the kernel's own forgiving reader. The
      scaffold is what an author and their tools meet first.
    consequence_if_false: |
      The scaffold would keep a shape only one reader understands, and
      the risk block would keep disappearing into the counterexample for
      every author whose editor parses strictly. The check would be
      pinning a convention nobody else follows.
    review_on:
      - signal: an-adopter-reports-a-scaffold-their-tool-cannot-read


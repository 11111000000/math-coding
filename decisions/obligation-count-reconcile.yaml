---
schema: math-coding/3.2
id: obligation-count-reconcile
revision: 3
state: active
negative_control: tests/fixtures/aggregator-matches-parent.sh
body_sha: "sha256:d3f2c8728bd7ccb15780577520cb90945d949974409b948af3ee39fc0663399b"
yaml_sha: "sha256:d3f2c8728bd7ccb15780577520cb90945d949974409b948af3ee39fc0663399b"
intent: |
  Reconcile the obligation-count drift across four normative
  documents in the read-first set. At HEAD `9a16751`:
    - decisions/decision.yaml@2 lists 7 obligations;
    - decisions/obligations.yaml@1 lists 5;
    - decisions/ONBOARDING.md line 272 and
      docs/AUDIT-0.0.11.md line 463 say 8;
    - docs/AUDIT-0.0.18.md line 99 and PACKAGES.md line 35 say 13.
  The bootstrap kernel cannot enumerate its own obligations while
  these disagree, so D6 (manual-only verifiers at AUDIT-0.0.11.md
  line 463) cannot expire with any class better than `unknown`.

  History:
    rev 1 (2026-09-30): first issuance, 7-id aggregator
                        reconciled; assumption `packges-obs-unaffected`
                        and signal `packges-audit-tool-defined` were
                        misspelled (missing the second 'a').
    rev 2 (this commit): rename assumption id to
                        `packages-obs-unaffected` and signal to
                        `packages-audit-tool-defined` so the names
                        spell "packages" correctly. No external
                        consumer references these identifiers
                        (verified at HEAD by `grep -rn
                        'packges-obs-unaffected\|packges-audit-tool-defined'`
                        — only this file matches), so the rename
                        is internal and does not break any contract.
                        Obligation `aggregator-7-of-7` and its
                        attestations are unaffected.

axiom_link:
  - A0
commitment: |
  Promote `decisions/obligations.yaml` to revision 2 with the
  seven obligation ids that match `decisions/decision.yaml@2`
  line-for-line. Record the rename history in a header comment.
  Leave `PACKAGES.md`'s `Obs` column unchanged — it is an
  observation count from a separate audit tool, not an obligation
  count (this assumption is recorded below).
  This rev 2 additionally renames the assumption id and signal
  to the correct "packages" spelling.

scope:
  paths:
    - "decisions/obligations.yaml"
    - "decisions/obligation-count-reconcile.yaml"
    - "tests/fixtures/aggregator-matches-parent.sh"
    - "tests/fixtures/decision-packges-spelling.sh"

outcomes:
  - id: aggregator-matches-parent
    statement: |
      obligations.yaml lists exactly the obligation ids that
      decisions/decision.yaml carries, with identical ids in the same
      order, and names the parent decision it aggregates.
  - id: assumption-ids-spelled-correctly
    statement: |
      Every assumption id and review_on signal in this decision file
      is spelled correctly. The "packages" word carries the canonical
      spelling across the project; the misspelling "packges" is not
      allowed as a LIVE identifier anywhere in decisions/*.yaml. It
      appears in this file's own history text, which is where the
      rename is recorded - a claim that names the misspelling cannot
      say the file does not contain it.

assumptions:
  - id: packages-obs-unaffected
    state: assumed
    statement: |
      PACKAGES.md `Obs` column is an observation count from a
      separate audit tool, not an obligation count. Audit 0.0.18
      line 99 "13 obligations" is an audit-text error; decision.yaml
      carries seven and obligations.yaml@2 matches.
    owner: human:maintainer
    consequence_if_false: a future reconcile would rename the
      `Obs` column or drop it.
    review_on:
      - signal: packages-audit-tool-defined

obligations:
  - id: aggregator-7-of-7
    outcome: aggregator-matches-parent
    claim: |
      decisions/obligations.yaml lists EXACTLY the obligation ids that
      decisions/decision.yaml carries, with identical ids in the same
      order, and names the parent decision it aggregates.

      The revision-2 claim named the parent's revision
      (`decisions/decision.yaml@2`). The parent is now at revision 3,
      and it has been revised WITHOUT changing its obligation set:
      the two files still agree on seven ids. The revision the
      aggregator records is the revision it was reconciled against,
      not the parent's current one - which is why the pointer is not
      what this claim holds.

      The revision-2 check was
      `shell-grep decisions/obligations.yaml revision: 2`: it asked
      whether the aggregator's TEXT still contained a revision
      string, which says nothing about whether the two lists agree.
      A fixed-string search cannot compare two files; the check below
      does.
    acceptance:
      all:
        - verifier: tests/fixtures/aggregator-matches-parent.sh
  - id: corrected-spelling-contract
    outcome: assumption-ids-spelled-correctly
    claim: |
      This decision file declares no LIVE identifier with the
      misspelling "packges": the assumption id reads
      `packages-obs-unaffected`, the review_on signal reads
      `packages-audit-tool-defined`, and the header comment of
      decisions/obligations.yaml uses the corrected spelling.

      The revision-2 claim was stronger and false: it said the file
      "does not contain the misspelling 'packges' ANYWHERE" - and the
      file contains it, in the history text that records the rename
      this decision made. A claim that names the misspelling cannot
      say the file does not contain it; what it can say is that no
      live identifier carries it, and that is what the check below
      asks. The two `manual-text-scan-*` declarations that carried
      the old claim were a human's word about a check nobody ran;
      the fixture that does the check already existed.
    acceptance:
      all:
        - verifier: file-exists decisions/obligation-count-reconcile.yaml
        - verifier: tests/fixtures/decision-packges-spelling.sh

reversal:
  - signal: aggregator-id-drift
    action: re-reconcile with a new decision revision

counterexample: |
  "The count drift is cosmetic; agents reading the docs will not
  act on the discrepancy." The counterargument fails because
  `mathc self-check` (active since v3.0.0.19) is a blocking CI step
  that emits a verdict against the live attestation store; an
  aggregator file whose ids do not match its parent decision will
  be flagged at self-check time, and the discrepancy is therefore
  not cosmetic but consequential. The mitigation in this decision
  is the line-for-line reconciliation between obligations.yaml@2
  and decision.yaml@2; the meta-feedback is that the PACKAGES.md
  `Obs` column comes from a separate audit tool and is not part
  of the obligation count.

risk:
  declared_triggers:
    - aggregator-points-at-superseded-revision
    - obligation-count-diverges-across-documents
    - assumption-id-typo-recurs

relations:
  addresses:
    - bootstrap-v3@2
  revises:
    - obligation-count-reconcile@1

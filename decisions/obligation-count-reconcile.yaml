---
schema: math-coding/3.0-alpha
id: obligation-count-reconcile
revision: 2

state: active
body_sha: ""
yaml_sha: ""
intent: |
  Reconcile the obligation-count drift across four normative
  documents in the read-first set. At HEAD `9a16751`:
    - decisions/decision.yaml@2 lists 7 obligations;
    - decisions/obligations.yaml@1 lists 5;
    - decisions/ONBOARDING.md line 272 and
      doc/AUDIT-0.0.11.md line 463 say 8;
    - doc/AUDIT-0.0.18.md line 99 and PACKAGES.md line 35 say 13.
  The bootstrap kernel cannot enumerate its own obligations while
  these disagree, so D6 (manual-only verifiers at AUDIT-0.0.11.md
  line 463) cannot expire with any class better than `unknown`.

  History:
    rev 1 (2026-09-30): first issuance, 7-id aggregator
                        reconciled; assumption `packges-obs-unaffected`
                        and signal `packges-audit-tool-defined` were
                        misspelled (missing the second 'a').
    rev 2 (this commit): rename assumption id to
                        `packages-obs-unaffected` and signal to
                        `packages-audit-tool-defined` so the names
                        spell "packages" correctly. No external
                        consumer references these identifiers
                        (verified at HEAD by `grep -rn
                        'packges-obs-unaffected\|packges-audit-tool-defined'`
                        — only this file matches), so the rename
                        is internal and does not break any contract.
                        Obligation `aggregator-7-of-7` and its
                        attestations are unaffected.

commitment: |
  Promote `decisions/obligations.yaml` to revision 2 with the
  seven obligation ids that match `decisions/decision.yaml@2`
  line-for-line. Record the rename history in a header comment.
  Leave `PACKAGES.md`'s `Obs` column unchanged — it is an
  observation count from a separate audit tool, not an obligation
  count (this assumption is recorded below).
  This rev 2 additionally renames the assumption id and signal
  to the correct "packages" spelling.

scope:
  paths:
    - "decisions/obligations.yaml"
    - "decisions/obligation-count-reconcile.yaml"

outcomes:
  - id: aggregator-matches-parent
    statement: obligations.yaml lists exactly the seven obligations of
      decisions/decision.yaml@2 with identical ids in the same order.
  - id: assumption-ids-spelled-correctly
    statement: Every assumption id and review_on signal in this
      decision file is spelled correctly. The "packages" word
      carries the canonical spelling across the project; the
      misspelling "packges" is not allowed anywhere in
      decisions/*.yaml.

assumptions:
  - id: packages-obs-unaffected
    state: assumed
    statement: |
      PACKAGES.md `Obs` column is an observation count from a
      separate audit tool, not an obligation count. Audit 0.0.18
      line 99 "13 obligations" is an audit-text error; decision.yaml
      carries seven and obligations.yaml@2 matches.
    owner: human:maintainer
    consequence_if_false: a future reconcile would rename the
      `Obs` column or drop it.
    review_on:
      - signal: packages-audit-tool-defined

obligations:
  - id: aggregator-7-of-7
    outcome: aggregator-matches-parent
    claim: |
      decisions/obligations.yaml@2 lists exactly the seven
      obligations of decisions/decision.yaml@2 with identical
      ids, in the same order. The aggregator's revision field
      reads `revision: 2`.
    acceptance:
      all:
        - verifier: this-decision-file-present
          result: pass
        - verifier: text-scan-decisions-obligations-yaml-rev-2
          result: pass
        - verifier: text-scan-decisions-obligations-yaml-7-ids
          result: pass

  - id: corrected-spelling-contract
    outcome: assumption-ids-spelled-correctly
    claim: |
      This decision file (revision: 2) does not contain the
      misspelling "packges" anywhere. The assumption id is
      `packages-obs-unaffected` and the review_on signal is
      `packages-audit-tool-defined`. No other file in decisions/
      carries the misspelling either (verified by `grep -rn
      'packges' decisions/*.yaml`).
    acceptance:
      all:
        - verifier: this-decision-file-present
          result: pass
        - verifier: text-scan-no-packges-misspelling
          result: pass
        - verifier: text-scan-contains-packages-spelling
          result: pass

reversal:
  - signal: aggregator-id-drift
    action: re-reconcile with a new decision revision

risk:
  declared_triggers:
    - aggregator-points-at-superseded-revision
    - obligation-count-diverges-across-documents
    - assumption-id-typo-recurs

relations:
  addresses:
    - bootstrap-v3@2
  revises:
    - obligation-count-reconcile@1

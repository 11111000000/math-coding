obligations:
  - id: the-live-tree-names-the-new-path-only
    statement: |
      No tracked file outside the declared exclusions names
      `spec/algebra-3.2.md` or `spec/algebra-3.2.html`.
    claim: |
      `tests/fixtures/kernel-contract-rename-2026-11.sh` greps the
      live tree for both forms of the old path and fails if it finds
      one. The exclusions are the archive (history), the plans (the
      measurement), this decision and the fixture itself.
    acceptance:
      all:
        - verifier: tests/fixtures/kernel-contract-rename-2026-11.sh

  - id: the-file-is-named-what-it-is
    statement: |
      `spec/kernel-contract.md` exists, is tracked, and
      `spec/algebra-3.2.md` does not exist.
    claim: |
      The same fixture asserts the existence and the absence, and its
      negative control proves that the scan it uses still catches a
      file that carries the old path.
    acceptance:
      all:
        - verifier: tests/fixtures/kernel-contract-rename-2026-11.sh

  - id: the-history-keeps-the-old-path
    statement: |
      The archived decisions and the plans still name the old path.
    claim: |
      The fixture asserts that the archive still carries mentions of
      the old path, so a rewrite of the archive fails the check. A
      record that stops naming the old path has been edited into
      something it never was.
    acceptance:
      all:
        - verifier: tests/fixtures/kernel-contract-rename-2026-11.sh

  - id: the-diagnostics-name-the-new-path
    statement: |
      The runtime diagnostics that quote the contract's path in their
      message text quote the NEW path, and the cram fixtures that
      assert those messages verbatim assert the new text.
    claim: |
      `tests/cli/validate-counterexample-required.t` asserts the
      `MC-COUNTEREXAMPLE-MISSING` message and the
      `mode-standard-no-counterexample-demo` message, both of which
      carry the path; `tests/cli/validate-considered-antithesis.t`
      asserts the `mode-considered-no-antithesis-demo` message.
    acceptance:
      all:
        - verifier: tests/cli/validate-counterexample-required.t
        - verifier: tests/cli/validate-considered-antithesis.t

  - id: the-section-pointers-name-the-contract
    statement: |
      No file under lib/, bin/ or tests/ carries a section pointer of
      the form `algebra §N`; the convention is `kernel contract §N`.
    claim: |
      `tests/fixtures/kernel-contract-rename-2026-11.sh` greps lib/,
      bin/ and tests/ for the old pointer shape and fails if it finds
      one, with the same exclusions it declares for the path.
    acceptance:
      all:
        - verifier: tests/fixtures/kernel-contract-rename-2026-11.sh

risk:
  owner: human:maintainer
  declared_triggers:
    - "a reference to the old path survives in a file nobody read before the rename"
    - "the rendered spec page is written under the old name and the axioms link to a page that is not there"
    - "a decision's `scope.paths` still names the old path and the decision's digest becomes a digest of nothing"
    - "the normative text stops being revised, and the version in a name stops being a lie"
    - "a second document is added under spec/ and the question 'which one is the contract' has two answers"

assumptions:
  - id: the-section-anchors-survive-the-rename
    state: assumed
    owner: human:maintainer
    statement: |
      The contract's headings keep their `§N` anchors across the
      rename: the file's bytes do not change, so `## §7. Decision
      entity` is still `## §7. Decision entity` after the move, and
      a pointer to `§7` still resolves to the same section.
    consequence_if_false: |
      If a later revision of the contract renumbers its sections, then
      every section pointer in the tree - 122 of them in lib/, bin/
      and tests/ alone - becomes a pointer to the wrong section, and
      the rename will have carried the mistake forward. The
      instrument in this tranche checks the NAME of the pointer, not
      the section it names; a renumbering needs its own instrument.
    review_on:
      - signal: contract-section-renumbering

  - id: the-archive-is-history-and-not-a-live-reference
    state: assumed
    owner: human:maintainer
    statement: |
      The twenty archived decisions that name the old path are
      records, not dependencies: nothing in the tree READS them to
      decide anything. They stay as they are.
    consequence_if_false: |
      If some live part of the kernel reads an archived decision and
      follows a path out of it, then that reader is broken by the
      rename and the fix is to re-point it - not to rewrite the
      archive. The census's DANGLING count would rise, which is the
      signal that this assumption has failed.
    review_on:
      - signal: census-dangling-count-rises

reversal:
  - signal: the-rename-is-reverted-upstream
    condition: |
      The contract is renamed back to a versioned name. The commits
      are ordered by class (the file, then the machine-followed
      references, then the prose and the pointers, then the
      normative text), so the revert is one `git revert` per commit
      and the classes come back independently.
    action: revert

  - signal: the-version-in-the-name-starts-paying-again
    condition: |
      The contract is revised and a new versioned name is proposed.
      Resolution: the name stays `spec/kernel-contract.md`, and the
      revision is recorded in the decision that owns the text and in
      the CHANGELOG - the two places that already carry it.
    action: review


---
schema: math-coding/3.0-alpha
id: gate-attestation-store-fill
revision: 1

intent: |
  Close ROADMAP Tier-1 #1 (`gate-attestation-store-fill`). The
  v3-alpha-0.0.19 `mc gate` is a SCAFFOLD: lib/gate.ml:84-87
  returns verdict "unknown" for every loaded decision because
  no attestation store is available. This decision extends the
  scaffold into a real evaluator that consumes a filesystem-
  backed attestation store and emits Pass / Fail / Unknown per
  spec/semantics.md §"Evaluation".

commitment: |
  1. New library `mathcoding_attestations` under `lib/attestations/`
     with a pure module `Attestations` exposing `load : reader ->
     root -> Domain.attestation list`. The loader walks the store
     directory, parses each JSON file via the kernel JSON parser
     and Codec.parse_attestation, and returns the typed list.
     I/O is at the loader boundary only; the data type itself is
     pure (OCAML_BEST_PRACTICES §1.3, §10.1).
  2. The store path is configurable via the environment variable
     `MATH_CODING_ATTESTATION_STORE`; default is the relative path
     `attestations/` (resolved against the project root by the bin/
     adapter layer, never by the kernel).
  3. `lib/gate.ml` is extended: `evaluate` takes a new `store`
     argument (the typed attestation list). For every loaded
     decision's obligations, the evaluator looks up attestations
     matching (decision_id, obligation_id); checks freshness via
     `materials_digest` equality (Kernel Invariant 9); applies the
     `Pass / Fail / Unknown` rules from spec/semantics.md:46-53
     per obligation. The verdict aggregate follows the existing
     gate discipline: `block` if any obligation fails, `pass` if
     every applicable obligation passes, `unknown` otherwise.
  4. `bin/Mathc.ml` reads `MATH_CODING_ATTESTATION_STORE` and
     feeds the loaded list into `Gate.evaluate`. The exit-code
     discipline follows spec/semantics.md:306-310 and
     constitution.md Invariant 14: `block` -> exit 1; `pass` /
     `unknown` / `open-with-waiver` -> exit 0. This makes the
     forward-looking "1 = block" clause from the existing spec
     row actually enforceable.
  5. Four conformance fixtures in `tests/cli/`:
     `gate-pass.t` (positive: populated store + pass
     attestation -> verdict "pass", exit 0),
     `gate-fail.t` (negative: populated store + fail
     attestation -> verdict "block", exit 1),
     `gate-stale.t` (negative: stale attestation -> StaleEvidence
     gap, verdict "unknown", exit 0),
     `gate-empty.t` (negative: empty store -> verdict "unknown",
     exit 0). All four use the portability pattern from
     `tests/cli/context-truncated-omitted.t`.

scope:
  capabilities:
    - gate-attestation-store-fill
    - mc-gate-blocking (exit-code basis)
  paths:
    - "decisions/gate-attestation-store-fill-decision.yaml"  # this file
    - "lib/attestations/dune"
    - "lib/attestations/attestations.ml"
    - "lib/gate.ml"
    - "lib/dune"
    - "bin/dune"
    - "bin/Mathc.ml"
    - "tests/cli/gate-pass.t"
    - "tests/cli/gate-fail.t"
    - "tests/cli/gate-stale.t"
    - "tests/cli/gate-empty.t"
  exclusions:
    - "lib/digest.ml"  # D4 OPEN; we do not touch the SHA-256 implementation here
    - "lib/junit/*.ml"
    - "lib/git/*.ml"
    - "spec/**"         # semantics.md §gate row already documents the full-blocking behaviour
    - "schemas/**"

outcomes:
  - id: store-library
    statement: |
      `lib/attestations/` exists with its own `dune`, declares
      library `mathcoding_attestations`, and exposes a pure
      `Attestations.load : reader:(string -> string) -> root:string
      -> Domain.attestation list` that returns `[]` when `root`
      is absent or unreadable (no I/O at module top level).
  - id: gate-consumes-store
    statement: |
      `lib/gate.ml` no longer hardcodes the `NoAttestationStore`
      gap. `Gate.evaluate` takes a `store : Domain.attestation list`
      argument and emits per-obligation verdicts following
      spec/semantics.md:46-53.
  - id: exit-code-honest
    statement: |
      `mc gate BASE HEAD` returns exit 1 when verdict is "block",
      exit 0 when verdict is "pass" / "unknown" /
      "open-with-waiver", exit 2 on input error. This implements
      constitution.md Invariant 14 ("a blocking verdict MUST
      produce nonzero exit code").
  - id: gate-fixtures-pass
    statement: |
      Four cram fixtures in `tests/cli/` exercise the four
      scenarios above and all four pass on `scripts/dev verify`.

countercase: |
  "A store that emits Pass without verifying materials_digest
  freshness would let a stale CI run certify a broken change."
  Counterargument: the loader returns the typed list; the
  evaluator at lib/gate.ml is the only place that decides
  current(a) per spec/semantics.md:39-44, and that decision
  compares the attestation's `subject.materials_digest` against
  the canonical digest of the changed paths for the candidate
  tree (Kernel Invariant 9). A mismatch surfaces as
  `StaleEvidence` and the verdict stays `unknown`; it never
  silently flips to `pass`. The implementation records the
  dependency on a real SHA-256 in `decisions/digest-vector-impl`
  (D4 OPEN) so a future revision can swap in the tested digest
  without changing the gate protocol.

assumptions:
  - id: store-path-default
    state: assumed
    statement: |
      The default attestation store path is `attestations/`
      relative to the project root. Users may override via the
      `MATH_CODING_ATTESTATION_STORE` environment variable
      (mirrors `MATH_CODING_ROOT` / `MATH_CODING_FIXED_TIME`
      precedent from bin/Mathc.ml:312, :854).
    owner: human:maintainer
    consequence_if_false: |
      A different default would change fixture portability and
      require a new decision.
    review_on:
      - signal: store-default-changed
  - id: materials-digest-hand-rolled
    state: assumed
    statement: |
      `lib/digest.ml` is hand-rolled SHA-256, untested against
      RFC 6234 vectors (D4 OPEN per PACKAGES.md:178). The gate
      uses it for materials_digest computation today; the
      evaluator's correctness does NOT depend on the cryptographic
      property of the digest (only on its determinism and the
      invariant `a.materials_digest == digest(c.materials)`),
      so a vector failure in the digest module would surface as
      a freshness mismatch in fixtures, not as a silent
      Pass/Fail swap.
    owner: human:maintainer
    consequence_if_false: |
      When D4 closes, this decision's obligation may be re-
      exercised to confirm the digest module still satisfies the
      hand-rolled-property assumption above.
    review_on:
      - signal: D4-closed
  - id: store-file-format
    state: assumed
    statement: |
      Each file in the store is a single JSON document matching
      `schemas/attestation.json` (or its current incarnation). The
      loader returns `[]` for any file that fails to parse; the
      kernel never crashes on a malformed store entry.
    owner: human:maintainer
    consequence_if_false: |
      A different format (e.g., YAML or JSONL-per-file) would
      require a new decision.
    review_on:
      - signal: store-format-changed

obligations:
  - id: gate-attestation-store-implemented
    outcome: store-library
    claim: |
      `lib/attestations/` exists with library
      `mathcoding_attestations`, pure `Attestations.load`, and
      no I/O at module top level.
    acceptance:
      all:
        - verifier: tests/cli/gate-empty.t
          result: pass
        - verifier: tests/cli/gate-pass.t
          result: pass
  - id: gate-real-verdict
    outcome: gate-consumes-store
    claim: |
      With a populated store containing a matching pass
      attestation, `mc gate BASE HEAD` emits verdict "pass".
      With a matching fail attestation, verdict "block". With a
      stale attestation, a `StaleEvidence` gap appears.
    acceptance:
      all:
        - verifier: tests/cli/gate-pass.t
          result: pass
        - verifier: tests/cli/gate-fail.t
          result: pass
        - verifier: tests/cli/gate-stale.t
          result: pass
  - id: gate-exit-honest
    outcome: exit-code-honest
    claim: |
      `mc gate` returns exit 1 on verdict "block" and exit 0 on
      "pass" / "unknown" / "open-with-waiver" (constitution.md
      Invariant 14).
    acceptance:
      all:
        - verifier: tests/cli/gate-pass.t
          result: pass
        - verifier: tests/cli/gate-fail.t
          result: pass
        - verifier: tests/cli/gate-stale.t
          result: pass
        - verifier: tests/cli/gate-empty.t
          result: pass
  - id: gate-fixtures-coverage
    outcome: gate-fixtures-pass
    claim: |
      Four cram fixtures exist and all pass on `scripts/dev verify`,
      asserting both positive (pass) and negative (fail / stale /
      empty) coverage per AGENTS.md self-application and
      constitution.md Invariant 13.
    acceptance:
      all:
        - verifier: tests/cli/gate-pass.t
          result: pass
        - verifier: tests/cli/gate-fail.t
          result: pass
        - verifier: tests/cli/gate-stale.t
          result: pass
        - verifier: tests/cli/gate-empty.t
          result: pass

reversal:
  - signal: store-protocol-changes
    condition: |
      A future revision introduces a remote attestation backend,
      a different file format, or per-policy store routing.
    action: supersede-with-gate-attestation-store-v2

risk:
  declared_triggers:
    - exit-code-regression  # downstream callers may rely on gate always exiting 0
    - store-path-default-drift  # users may have hardcoded "attestations/"
    - materials-digest-determinism  # SHA-256 untested (D4 OPEN)
  owner: human:maintainer

relations:
  addresses:
    - bootstrap-v3
    - gate-decision@1  # supersedes the scaffold of gate-decision@1
  supersedes: []
  superseded_by: []